slug: turn-a-notebook-into-a-service
title: Turn a working notebook into something that can take traffic
track: system-design
difficulty: medium
total_seconds: 140
competencies: [system-design, cost-and-latency, client-communication]

round: system-design
tests: Whether you put the contract before the code, name where notebook state hides and what the second request sees, and protect the behaviour that already works.
interviewers: [solution-architect, engineering-lead, hiring-manager]
builds_on: [key-the-cache-on-the-whole-request, give-every-customer-their-own-thread, record-every-call-the-agent-makes]

prompt_text: |
  At a pharmacy chain the size of Apollo Pharmacy, their data scientist has
  a notebook that extracts the lines of a prescription, and it works. They
  want it behind an endpoint by the end of the month. Walk me through what
  that involves.

framework:
  answer_first: The notebook proves the approach on the inputs she tried and proves nothing about the second request. The first thing I write is the contract. What goes in, what comes back, what errors look like, and a version.
  evidence: Fifty real inputs with the notebook's outputs recorded in week one. That is the only specification of correct behaviour anyone has, and it becomes the regression suite.
  trade_off: Writing the contract first costs a few days before any code moves. Skipping it means the first integration turns an accidental shape into a promise you have to keep.
  if_you_do_not_know: If you cannot say where the state hides, say what you would look for. A client created at the top, a variable that accumulates, a cached dataframe, and the second request is where each one shows.
tips:
  - Say what the notebook is and is not evidence of before you list the work. It has only ever run one request at a time with her watching.
  - Name the observability by the question it answers. Why was this request slow, and why did this one cost four dollars. A list of tools answers neither.
  - End of the month is a question about traffic. Ask how many requests a minute before you agree to the date.

beats:
  - id: b1
    label: Say what the notebook is and is not evidence of
    seconds: 30
    anchors: ["the notebook works", "one request at a time", "in order"]
  - id: b2
    label: Name the contract first
    seconds: 20
    anchors: ["what goes in", "what comes back", "errors", "a version"]
  - id: b3
    label: Say what breaks on the second request
    seconds: 40
    anchors: ["state", "between cells", "global", "leaks"]
  - id: b4
    label: Name what you need to see once it is live
    seconds: 25
    anchors: ["per request", "how long", "what it cost"]
  - id: b5
    label: Say what you would do in the first week
    seconds: 25
    anchors: ["same outputs", "golden", "before anything else"]

follow_ups:
  - trigger_after_beat: b3
    text: The data scientist says there is no global state, it is all in functions.
  - trigger_after_beat: b4
    text: We have logging already. Why is that not enough?

rubric:
  - criterion_key: c1
    label: Puts the contract before the code
    weight: 30
    descriptor_md: |
      Inputs, outputs, error shapes and a version. Strong answers do this
      first and say why: everything downstream is written against it, and the
      notebook has never had to promise anything.
  - criterion_key: c2
    label: Names request isolation concretely
    weight: 25
    descriptor_md: |
      A notebook runs top to bottom once. Strong answers name where state
      hides, module-level variables, cached clients, an accumulating list, and
      say what the second request sees.
  - criterion_key: c3
    label: Names observability in terms of what a question needs
    weight: 20
    descriptor_md: |
      Per-request timing, token spend and a correlation id, because the first
      question anyone asks is why one request was slow or expensive. Strong
      answers tie the signal to the question rather than listing tools.
  - criterion_key: c4
    label: Protects the behaviour that already works
    weight: 25
    descriptor_md: |
      The notebook is the only specification of correct behaviour anyone has.
      Strong answers capture its outputs on real inputs before refactoring, so
      the rewrite can be checked against something.

exemplars:
  - band: strong
    score: 88
    transcript: |
      So the notebook works, and that is worth something. What it is evidence
      of is that the approach is sound on the inputs she has tried. What it is
      not evidence of is anything about concurrency, because it has only ever
      run one request at a time, in order, with her watching.

      The first thing I would write is the contract, before touching the code.
      What goes in, what comes back, what the errors look like, and a version
      on it. That matters because the moment anyone integrates, that shape is
      a promise, and the notebook has never had to promise anything. If we get
      it wrong we find out when changing it breaks somebody.

      The thing that will actually bite is state. A notebook holds state
      between cells and that is the whole point of it, so there is usually a
      client created at the top, a variable that accumulates, a cached
      dataframe. Under one request nothing shows. On the second request that
      global is still there, and either it leaks something from the first
      customer into the second or it grows until the process dies. That is the
      bug I would go looking for first, and it is not usually obvious from
      reading.

      Once it is live, per request, I want how long it took, what it cost in
      tokens, and an id that ties the model calls to the request. Because the
      first question anyone asks is why was this one slow or why did this one
      cost four dollars, and without those three you cannot answer it.

      In the first week, before anything else, I would take fifty real inputs
      and record what the notebook produces for them. That is the only
      specification of correct behaviour anyone has. Then when we refactor we
      can check we still get the same outputs, and those golden cases become
      the regression suite.
  - band: adequate
    score: 62
    transcript: |
      There is a fair bit between a working notebook and a service. The code
      itself is usually the easy part.

      I would start by defining the API contract, so the request and response
      formats and the error cases. Then wrap the logic in a function that
      takes the input and returns the output, with no dependencies on notebook
      state.

      Statelessness is important. Notebooks rely on things being defined in
      earlier cells, so you need to make sure each request is independent and
      does not depend on anything left over from a previous one.

      Then the usual service concerns: error handling so a failure returns a
      proper response rather than a stack trace, logging and metrics,
      dependency pinning so it does not break when a library updates, and
      tests.

      On timing, end of the month is probably feasible for a first version,
      though I would want to understand how much traffic it needs to handle,
      because that changes the answer quite a lot.
  - band: weak
    score: 28
    transcript: |
      The main work is wrapping it in an API. I would use FastAPI, put the
      notebook logic into a function, and expose it as a POST endpoint. That
      part is usually quite quick.

      Then you containerise it with Docker and deploy it, and you would want
      some environment configuration for the API keys rather than having them
      in the code.

      You should add error handling and logging, and some tests to make sure
      it behaves the same as the notebook did.

      After that it is mostly operational: monitoring, scaling if the traffic
      grows, and a CI pipeline so deploys are repeatable. End of the month
      sounds achievable for that scope.
