name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  problems:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # docs/04: a broken problem should never reach the import screen, so this
      # gate runs on every push rather than at import time.
      - run: npm run validate:problems
        working-directory: web
      # Same reason on the voice side, with one thing worse: a broken question
      # fails while the learner is already speaking, and a spoken answer
      # cannot be recovered.
      - run: npm run validate:voice
        working-directory: web

  web:
    name: Web typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # CLAUDE.md forbids a credentialed database URL in the repository, so
          # the service container trusts local connections and DATABASE_URL
          # below carries no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fdeprep_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fdeprep_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The end-to-end tests drive real submissions through the Phase 1
      # battery, which is Python. Without it the worker cannot spawn the
      # runner, every submission comes back with an error verdict, and the
      # suite fails for a reason that has nothing to do with the change.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # CLAUDE.md's "no component reads difficulty directly" is enforced by a
      # lint rule rather than remembered. eslint-rules/no-direct-difficulty.js.
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web

  runner:
    name: Runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  voice:
    name: Voice package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voice/package-lock.json
      - run: npm ci
        working-directory: voice
      - run: npm run typecheck
        working-directory: voice
      # limits.test.ts asserts the session ceilings against the API Gateway
      # quotas they have to stay under. A change to either fails here rather
      # than as a socket closing for a reason a learner cannot be told.
      - run: npm test
        working-directory: voice

  infra:
    name: Infrastructure synth and assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      # The voice handlers are bundled from voice/, so esbuild has to resolve
      # there. Without this the synth of the voice socket fails on a missing
      # bundler rather than on anything in the template.
      - run: npm ci
        working-directory: voice
      - run: npm run typecheck
        working-directory: infra
      # The template is asserted rather than eyeballed: the runner having no
      # Bedrock permission is an IAM fact, and a grant added in the wrong place
      # fails here rather than in production.
      - run: npm test
        working-directory: infra
      # Synth proves the stack renders. Nothing here deploys; a human runs
      # `cdk deploy`, which is why deploy.yml only moves image tags.
      #
      # Twice: the voice socket is optional, so the stack has to render both
      # with it and without it. The ARN is a placeholder that is never read,
      # since synth resolves no secret value.
      - run: npx cdk synth --quiet
        working-directory: infra
      - run: npx cdk synth --quiet
        working-directory: infra
        env:
          VOICE_TOKEN_SECRET_ARN: >-
            arn:aws:secretsmanager:us-east-1:111122223333:secret:fdeprep/voice-token-AbCdEf
