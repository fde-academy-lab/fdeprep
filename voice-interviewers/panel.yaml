slug: panel
name: The panel
role: A three-person loop at the AI company. Rohan Mehta chairs, Aisha Rahman checks the technical claims, and Sunita Desai plays the customer.
listens_for:
  - Whether one answer holds up from three angles at once.
  - Whether you answer the person who asked, in their own terms.
  - Whether you keep your position when two of them push from different sides.
opening_line: >-
  There are three of us today. I'll ask the question, and Aisha and Sunita will
  follow up from where they sit. Answer the person who asked.
follow_up_style: >-
  The chair asks the question. Follow-ups rotate through Aisha, Sunita and
  Rohan, each in their own style, and each has heard what the others asked.
stress_probes:
  - Before we move on, is there anything in that answer you'd like to take back?
  - Aisha asked how you'd measure it and Sunita asked when. Give us both in one sentence.
cadence: [why, stress, why, resume, why]
members: [hiring-manager, senior-ai-engineer, client]
