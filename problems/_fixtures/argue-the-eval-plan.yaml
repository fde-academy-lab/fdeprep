# Throwaway fixture for Phase 4. Crude on purpose: real content lands in Phase 8.
slug: argue-the-eval-plan
title: Argue the evaluation plan
artefact_type: design
difficulty: extreme
track: evals
est_minutes: 40
time_limit_s: 10
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: client-communication, weight: 0.5 }

brief_md: |
  A fixture problem used to exercise the design workspace and the rubric judge.
  A client has 40 hand-written test conversations and a 95 percent pass rate on
  them, and wants to launch a refunding support agent in two weeks. Write the
  evaluation plan you would put in front of their head of support.

word_range: [40, 400]
required_headings:
  - What I would measure
  - What I would refuse to launch without

rubric:
  - { label: "Names what a hand-written set cannot cover", weight: 40 }
  - { label: "Proposes measurable gates rather than adjectives", weight: 35 }
  - { label: "Holds a position under commercial pressure", weight: 25 }

exemplars:
  - { band: strong,   score: 90, body_md: "Names selection bias in the forty hand-picked conversations and the cost of a wrong refund, which is money that does not come back. Then gives two numeric gates: no more than one wrong refund in two hundred replayed tickets, and a correct escalation on every ticket that mentions a chargeback." }
  - { band: adequate, score: 65, body_md: "Names one gap, that the forty conversations were chosen by the people who built the agent, and one gate, a replay of two hundred real tickets before launch. Concedes the launch date rather than arguing for a later one, and says nothing about what a wrong refund costs." }
  - { band: weak,     score: 30, body_md: "Says the agent needs more testing before launch because the forty conversations might not be enough, and that the team should test more carefully and keep an eye on quality after it goes live. Names no gate, no number and no cost, so nobody could tell when the testing is done." }

complexity: C4

interview_evidence:
  round: written
  asked_as: |
    A fixture, not a question anybody is asked.
  source: |
    Fixture scaffolding. Carries the fields so the validator
    exercises them, and claims nothing.
