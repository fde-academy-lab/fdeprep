# Throwaway fixture for Phase 2. Crude on purpose: real content lands in Phase 8.
slug: carry-state-across-turns
title: Carry state across turns
artefact_type: code
difficulty: medium
track: memory
est_minutes: 25
call_budget: 6
time_limit_s: 5
allowed_imports: [json, re]
competencies:
  - { slug: state-and-memory, weight: 1.0 }

brief_md: |
  A fixture problem used to exercise the catalogue and the workspace. It asks
  for an agent loop that calls the probe tool once and returns what the model
  finally says.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  Budget: at most 6 model calls. Allowed imports: json, re.

stub_code: |
  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"
      for _ in range(6):
          output = llm(scratchpad)
          # TODO: return the text when output is a Final Answer
          # TODO: otherwise call the probe tool and append what it returned
          pass
      return "I could not complete this request."

hints:
  - Look at what the tool returns, not at the status code.
  - An unchanged prompt gets an unchanged reply.

tests:
  - name: public_one
    visibility: public
    spec:
      kind: agent_run
      input: { question: "case 1 for carry-state-across-turns" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: probe(id=1)" }
        - { match: "*", reply: "Final Answer: done 1" }
      tools:
        probe: { returns: { status: 200, data: { state: "ok" } } }
      budget: { max_llm_calls: 6, max_tool_calls: 8, wall_ms: 5000 }
      assertions:
        - { type: returns_nonempty }
