slug: attach-a-source-to-each-evidence-block
title: "Label every evidence block with its source"
day: 8
skill: Start each evidence block with its chunk id, and add only whole blocks
artefact_type: code
difficulty: easy
track: context
concept:
  topic: "In the window or retrieved"
  question: "How does the model know where each piece of evidence came from?"
est_minutes: 20
competencies:
  - { slug: context-assembly, weight: 1.0 }
  - { slug: retrieval, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A hospital trust gives its staff an assistant that answers HR questions from
  the staff handbook. HR audits it by opening the chunk each sentence cites, so
  every claim in an answer has to carry the id of the chunk it came from.

  Last week it told a ward sister she could carry over ten days of annual
  leave, and cited hb-31. hb-31 says five days, and only for staff returning
  from a career break. The context builder had reached its 400 character
  budget halfway through hb-31 and cut it at "may carry over up to". The model
  finished the sentence, and the real id made the invented number look
  checked.

  Build the evidence the model reads: one block per chunk, each starting with
  its own id, and never half a block.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: search(query=<text>)` or
  `Final Answer: <text>`. The `search` tool returns chunks best first:

      {"status": 200, "chunks": [{"id": "hb-19", "source": "Staff handbook",
                                  "text": "Staff may carry over ..."}]}

  Write each chunk into the prompt as one evidence block that starts with its
  own id in square brackets:

      [hb-19] Staff may carry over ...

  The id is the citation. Most chunks share a `source`, so the source name
  is not one.

  The evidence holds at most 400 characters, counting each block as written.
  Add blocks in the order search returned them and stop at the first block
  that would take the total past 400. A block goes in whole or not at all.

  The model cites the ids it can see. Return its Final Answer as it is.

  Budget: at most 3 model calls. Allowed imports: json, re.
  Return a non-empty string in every case.

stub_code: |
  import json
  import re

  MAX_EVIDENCE = 400
  FALLBACK = "I could not answer that from the handbook."


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"

      for _ in range(6):
          output = llm(scratchpad)

          # TODO 1: return the text when the reply is a Final Answer
          # TODO 2: when the reply is an Action, call search with its query and
          #         append evidence(chunks) to the scratchpad
          pass

      return FALLBACK


  def block(chunk: dict) -> str:
      """One evidence block: the chunk's own id in square brackets, then its text."""
      # TODO 3: start the block with the chunk's id, as [<id>] <text>
      return chunk.get("text", "")


  def evidence(chunks: list) -> str:
      """Whole blocks, best first, joined by newlines."""
      # TODO 4: add blocks while the running total stays at or under
      #         MAX_EVIDENCE, and stop at the first block that does not fit
      return "\n".join(block(chunk) for chunk in chunks)

steps:
  - id: s1
    text: Return the text when the reply is a Final Answer.
    check_id: s1
  - id: s2
    text: Call search when the model asks, and put the evidence in the scratchpad.
    check_id: s2
  - id: s3
    text: Start every block with the chunk's own id in square brackets.
    check_id: s3
  - id: s4
    text: Add whole blocks in order and stop at the first one that would pass 400 characters.
    check_id: s4

step_checks:
  - step_id: s1
    spec:
      assertions:
        - { type: returns_nonempty }
  - step_id: s2
    spec:
      assertions:
        - { type: calls_tool, name: search }
  - step_id: s3
    spec:
      assertions:
        - { type: returns_matches, value: "\\[hb-\\d+\\]" }
  - step_id: s4
    spec:
      assertions:
        - { type: terminates }

hints:
  - Two things have to hold for every block the model reads. It starts with
    the chunk's own id, and it arrives whole. The source name is not an id,
    because most chunks share it.
  - Slicing the joined text keeps whatever falls before character 400, which
    is usually half a sentence. The half keeps its real id, so the model's
    ending to it looks cited.
  - Measure each block before you add it, and add it only if the running total
    stays at or under 400. The first block that does not fit ends the
    evidence.
  - "In order: turn each chunk into [<id>] <text>, keep a running total, stop
    at the first block that would pass 400, and join what you kept."

scenario:
  headline: "The HR assistant quotes ten days' leave from a five day rule"
  who: The HR team at a hospital trust
  situation: >-
    The staff assistant told a ward sister she could carry over ten days of
    annual leave and cited hb-31. The context builder had cut hb-31 at its
    400 character budget, mid-sentence, and the model finished the sentence.
  stakes: >-
    hb-31 says five days, and only after a career break. She booked the leave
    on the strength of a real citation, and HR now checks every citation by
    hand.
  metrics:
    - { label: Days it promised, value: "10" }
    - { label: Days hb-31 allows, value: "5" }
    - { label: Evidence budget, value: 400 characters }

diagram:
  title: Where a real citation ends up on an invented number
  caption: >-
    The budget was applied to the joined text, so it cut hb-31 mid-sentence.
    Add whole blocks, each starting with its id, and stop at the first that
    does not fit.
  direction: lr
  nodes:
    - { id: staff, label: Ward sister, sub: asks about carrying leave over, kind: actor, tone: blue, at: [0, 1] }
    - { id: search, label: search, sub: chunks best first with their ids, kind: tool, tone: neutral, at: [1, 0] }
    - { id: builder, label: Context builder, sub: 400 characters of evidence, kind: agent, tone: purple, at: [1, 1] }
    - { id: slice, label: "text[:400]", sub: cuts hb-31 after may carry over up to, kind: decision, tone: pink, at: [2, 0] }
    - { id: whole, label: Whole blocks only, sub: stop at the first that does not fit, kind: guard, tone: green, at: [2, 2] }
    - { id: model, label: Model, sub: continues whatever it is given, kind: model, tone: teal, at: [3, 1] }
    - { id: wrong, label: "Ten days [hb-31]", sub: a real id on an invented number, kind: output, tone: pink, at: [4, 0] }
    - { id: right, label: "Five days [hb-19]", sub: every claim can be opened and checked, kind: output, tone: green, at: [4, 2] }
  edges:
    - { from: staff, to: builder, label: question, step: 1 }
    - { from: builder, to: search, label: query, step: 2 }
    - { from: search, to: builder, label: "hb-19, hb-18, hb-31", step: 3 }
    - { from: builder, to: slice, label: join then slice, tone: danger }
    - { from: slice, to: model, label: half of hb-31, tone: danger }
    - { from: model, to: wrong, label: finishes the sentence, tone: danger }
    - { from: builder, to: whole, label: measure each block, tone: success }
    - { from: whole, to: model, label: hb-19 and hb-18 whole, tone: success }
    - { from: model, to: right, label: cites what it read, tone: success }

approach:
  goal: Every sentence in the answer points at a chunk a person can open
  branches:
    - label: Label each block with its id
      detail: The id is unique to one chunk. The source name is shared by the whole handbook.
      leaves: ["[<id>] in front of the text", the model cites what it can see]
    - label: Spend the budget in whole blocks
      leaves: [measure a block before adding it, stop at the first that does not fit]
    - label: Half a block is worse than none
      leaves: [a missing block is a gap anyone can see, a cut block gets finished by the model]
    - label: Keep the order search gave you
      leaves: [best first, the budget drops the weakest]

coach:
  opening: >-
    Look at the line that decides how much evidence goes into the prompt. The
    ids can all be right and that line can still send the model half a
    sentence.
  signals:
    - id: labels-by-source
      when:
        code_matches: '(\.get\(|\[)\s*[''"]source[''"]'
        code_lacks: '(\.get\(|\[)\s*[''"]id[''"]'
      say: >-
        Your blocks carry the source name, and most chunks share it. What would
        tell a reader which of two handbook chunks a sentence came from?
    - id: no-id-on-blocks
      when: { code_lacks: '(\.get\(|\[)\s*[''"]id[''"]' }
      say: >-
        Nothing reads a chunk's id yet, so the model has nothing to cite. What
        should every block start with?
    - id: slices-the-joined-evidence
      when: { code_matches: '\[\s*:\s*(MAX_EVIDENCE|400)\b[^\]]*\]' }
      say: >-
        Slicing to MAX_EVIDENCE keeps whatever falls before character 400. Print
        the evidence for three long chunks and read how the last block ends.
    - id: budget-never-checked
      when: { code_lacks: '[<>]=?\s*MAX_EVIDENCE\b|\bMAX_EVIDENCE\s*([<>]=?|-)' }
      say: >-
        Nothing compares the evidence with MAX_EVIDENCE yet, so every chunk
        search returns reaches the model. Where would a running total live?
    - id: hidden-cut-block
      when: { test_failed: a_block_that_does_not_fit_is_left_out_whole }
      say: >-
        In that run the third chunk does not fit in 400 characters. Look at
        what your loop sends of it, if anything.
    - id: hidden-twelve-chunks
      when: { test_failed: twelve_chunks_are_held_to_the_budget }
      say: >-
        That search returned twelve chunks. Count the characters of evidence
        your prompt carries after it.
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1 and TODO 2: return a Final Answer, and call search
        when the model asks. Then make `block()` start with the id and press Run.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. Hints are free on Easy, and the first one names
        the two things every block needs.
  wrap_up: >-
    A citation is only as good as the text under it. Label every block with an
    id a person can open, and spend a context budget in whole blocks so the
    model never finishes a sentence it was not given.

tests:
  - name: cites_the_chunk_the_answer_came_from
    visibility: public
    spec:
      kind: agent_run
      input: { question: "How much notice do I need to give before taking annual leave?" }
      llm_script:
        - { match: { contains: "[hb-22]" },
            reply: "Final Answer: Request annual leave at least four weeks in advance [hb-22]." }
        - { match: "*", reply: "Action: search(query=annual leave notice)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "hb-22", source: "Staff handbook",
                  text: "Annual leave must be requested at least four weeks in advance through the rostering system." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: search }
        - { type: returns_matches, value: "four weeks in advance \\[hb-22\\]" }
        - { type: llm_calls_at_most, value: 3 }

  - name: two_chunks_from_one_handbook_keep_their_own_ids
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Who approves overtime, and when is it paid?" }
      llm_script:
        - { match: { all: [ { contains: "[hb-41] Overtime" }, { contains: "[hb-43] Approved overtime" } ] },
            reply: "Final Answer: The ward manager approves overtime before the shift [hb-41], and it is paid the following month at time and a half [hb-43]." }
        - { match: "*", reply: "Action: search(query=overtime approval and pay)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "hb-41", source: "Staff handbook",
                  text: "Overtime must be approved by the ward manager before the shift is worked." }
              - { id: "hb-43", source: "Staff handbook",
                  text: "Approved overtime is paid in the month after it is worked, at time and a half." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\\[hb-41\\][\\s\\S]*\\[hb-43\\]" }
        - { type: no_exception }
        - { type: terminates }

  - name: a_block_that_does_not_fit_is_left_out_whole
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How many days of annual leave can I carry over into next year?" }
      llm_script:
        - { match: { regex: "career break(?![^\\n]*break began)" },
            reply: "Final Answer: You can carry over up to ten days of annual leave [hb-31]." }
        - { match: { contains: "[hb-19]" },
            reply: "Final Answer: You can carry over up to five days, with your line manager's agreement [hb-19]." }
        - { match: "*", reply: "Action: search(query=annual leave carry over)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "hb-19", source: "Staff handbook",
                  text: "Staff may carry over up to five days of annual leave into the next leave year, with their line manager's agreement recorded in the rostering system." }
              - { id: "hb-18", source: "Staff handbook",
                  text: "All full-time staff receive 27 days of annual leave and bank holidays, rising to 29 days after five years of service. Part-time staff receive the same allowance pro rata." }
              - { id: "hb-31", source: "Staff handbook",
                  text: "Staff returning from a career break may carry over up to five days of untaken leave from the year before the break began." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "five days[^\\[]*\\[hb-19\\]" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 3 }

  - name: twelve_chunks_are_held_to_the_budget
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Can I swap a night shift with a colleague?" }
      llm_script:
        - { match: { regex: "[\\s\\S]{1500}" },
            reply: "Final Answer: Shift swaps need written sign-off from the director of nursing [hb-60]." }
        - { match: { contains: "[hb-52]" },
            reply: "Final Answer: Yes. Swap with a colleague of the same band, and both of you tell the roster lead 48 hours before the first shift [hb-52]." }
        - { match: "*", reply: "Action: search(query=swap a night shift)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "hb-52", source: "Staff handbook",
                  text: "Staff may swap a shift with a colleague of the same band if both of them tell the roster lead at least 48 hours before the first of the two shifts." }
              - { id: "hb-53", source: "Staff handbook",
                  text: "A swapped shift counts towards the hours of the person who works it, and any enhancement for nights or weekends is paid to that person." }
              - { id: "hb-54", source: "Staff handbook",
                  text: "The rota is published six weeks ahead. Requests for particular shifts must reach the roster lead before the rota closes, two weeks before publication." }
              - { id: "hb-55", source: "Staff handbook",
                  text: "Night shifts start at 19:30 and end at 08:00, with a paid break of 45 minutes that must be taken away from the ward." }
              - { id: "hb-56", source: "Staff handbook",
                  text: "No member of staff may work more than four night shifts in a row, including shifts gained through a swap." }
              - { id: "hb-57", source: "Staff handbook",
                  text: "Bank staff cannot swap shifts through the roster lead. They release a shift through the bank office, which offers it to other bank staff." }
              - { id: "hb-58", source: "Staff handbook",
                  text: "Agency staff are booked by the bank office and are never part of a swap, even when they have worked on the ward for several months." }
              - { id: "hb-59", source: "Staff handbook",
                  text: "A shift swap that leaves the ward below its safe staffing level is refused, whatever the band of the two people involved." }
              - { id: "hb-61", source: "Staff handbook",
                  text: "Staff on a phased return from sickness agree their shifts with occupational health, and a swap needs that team's agreement as well." }
              - { id: "hb-62", source: "Staff handbook",
                  text: "Students on placement follow their practice assessor's rota and cannot swap shifts with employed staff." }
              - { id: "hb-63", source: "Staff handbook",
                  text: "Time owed from a swap that fell through is recorded by the roster lead and must be worked within the same rota period." }
              - { id: "hb-60", source: "Staff handbook",
                  text: "Swaps between different bands, or into a new rota period, need written sign-off from the director of nursing before either shift is worked." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "48 hours[^\\[]*\\[hb-52\\]" }
        - { type: no_exception }
        - { type: terminates }

reference_md: |
  A citation is a promise that a person can open the chunk and find the
  sentence. Two things break that promise here, and getting the ids right
  prevents neither of them on its own.

  The first is the label. `source` reads like a citation, and it is the one
  field that identifies nothing: every chunk in these tests comes from the
  Staff handbook. The id is the only label that is different for every chunk,
  and the model can only cite a label it can see, so the id goes in the
  block, in front of the text it names.

  The second is the budget, and it caused the incident. `text[:400]` is the
  obvious way to bound a prompt, and it bounds characters rather than
  meaning. Wherever character 400 falls, the last block is cut there, and a
  cut block is the most dangerous thing a context can hold: a sentence
  without its ending, under a real id. Continuing text is what a model does,
  so it continues it, and the citation vouches for the continuation.

  Whole blocks make the failure honest. If hb-31 does not fit, the model
  never sees it and cannot claim anything from it. The answer may be less
  complete than a bigger budget would allow, and an incomplete answer is a
  problem a person can see. A wrong number under a real citation is a
  problem nobody sees until the leave is booked.

  The twelve chunk case is the other half of bounding. Evidence is not free:
  every block costs tokens on every call, and a long prompt gives the model
  more places to find the wrong answer. The budget decides how much the
  model reads, and the order search returned is the best information you
  have about which blocks deserve it.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Your context budget runs out halfway through a retrieved chunk. What do you send the model, and why?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: search
    args: query
    returns: A status and `chunks` best first, each with an `id`, a `source` name that most chunks share,
      and its `text`.
example:
  case: two_chunks_from_one_handbook_keep_their_own_ids
  expect: Write each chunk as its own block starting with its id in square brackets, so the model sees
    [hb-41] and [hb-43] and returns an answer citing [hb-41] and then [hb-43].
traps:
  - Cutting the joined evidence at 400 characters, which sends the model half a sentence under a real
    id for it to finish.
  - Putting every chunk search returns into the prompt, with no running total that holds the evidence
    to 400 characters.
  - Labelling a block with its `source`, which most chunks share, so the model has no id to cite for the
    sentence it uses.
