        - { match: "*", reply: "Notice: Batch B-09 reaches the products listed. The list is complete." }
      tools:
        neighbours:
          by_arg:
            arg: node
            values:
              P-4471: { status: 200, used_in: ["A-200"], fitted_to: [], built_as: [] }
              A-200: { status: 200, fitted_to: [], built_as: [],
                used_in: ["A-301", "A-302", "A-303", "A-304", "A-305", "A-306", "A-307", "A-308", "A-309", "A-310",
                  "A-311", "A-312", "A-313", "A-314", "A-315", "A-316", "A-317", "A-318", "A-319", "A-320",
                  "A-321", "A-322", "A-323", "A-324", "A-325", "A-326", "A-327", "A-328", "A-329", "A-330",
                  "A-331", "A-332", "A-333", "A-334", "A-335", "A-336", "A-337", "A-338", "A-339", "A-340",
                  "A-341", "A-342", "A-343", "A-344", "A-345", "A-346", "A-347", "A-348", "A-349", "A-350",
                  "A-351", "A-352", "A-353", "A-354", "A-355", "A-356", "A-357", "A-358", "A-359", "A-360"] }
              V-77: { status: 200, used_in: [], fitted_to: [], built_as: ["VIN-77A"] }
              VIN-77A: { status: 200, used_in: [], fitted_to: [], built_as: [] }
            default: { status: 200, used_in: [], fitted_to: ["V-77"], built_as: [] }
      budget: { max_llm_calls: 2, max_tool_calls: 80, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [affected, stopped, notice], properties: { stopped: { const: "node_cap" } } } }
        - { type: tool_calls_at_most, value: 40 }
        - { type: returns_lacks, value: '"VIN-77A"' }
        - { type: returns_lacks, value: "The list is complete" }

  - name: leaves_out_what_lies_past_three_hops
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"part": "P-4471", "batch": "B-09"}' }
      llm_script:
        - { match: { contains: "Walk stopped: hop_cap" },
            reply: "Notice: Within three hops, batch B-09 of P-4471 reaches kits K-7 and K-8 and assembly A-9. Products further out were not read." }
        - { match: "*", reply: "Notice: Batch B-09 reaches the products listed. The list is complete." }
      tools:
        neighbours:
          by_arg:
            arg: node
            values:
              P-4471: { status: 200, used_in: ["K-7"], fitted_to: [], built_as: [] }
              K-7: { status: 200, used_in: ["K-8"], fitted_to: [], built_as: [] }
              K-8: { status: 200, used_in: ["A-9"], fitted_to: [], built_as: [] }
              A-9: { status: 200, used_in: [], fitted_to: ["V-9"], built_as: [] }
              V-9: { status: 200, used_in: [], fitted_to: [], built_as: ["VIN-9A"] }
            default: { status: 200, used_in: [], fitted_to: [], built_as: [] }
      budget: { max_llm_calls: 2, max_tool_calls: 80, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [affected, stopped, notice], properties: { affected: { const: [{ id: "A-9", type: "assembly", path: ["P-4471", "K-7", "K-8", "A-9"] }, { id: "K-7", type: "assembly", path: ["P-4471", "K-7"] }, { id: "K-8", type: "assembly", path: ["P-4471", "K-7", "K-8"] }] }, stopped: { const: "hop_cap" } } } }
        - { type: returns_lacks, value: '"V-9"' }
        - { type: tool_calls_at_most, value: 4 }

  - name: keeps_walking_past_a_lookup_that_fails
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"part": "P-4471", "batch": "B-09"}' }
      llm_script:
        - { match: { contains: "Walk stopped: complete" },
            reply: "Notice: Batch B-09 of P-4471 reaches assemblies A-118 and A-404, variant V-32 and vehicle range VIN-32A." }
        - { match: "*", reply: "Notice: Batch B-09 reaches the products listed. The list is complete." }
      tools:
        neighbours:
          by_arg:
            arg: node
            values:
              P-4471: { status: 200, used_in: ["A-118", "A-404"], fitted_to: [], built_as: [] }
              A-118: { status: 200, used_in: [], fitted_to: ["V-32"], built_as: [] }
              V-32: { status: 200, used_in: [], fitted_to: [], built_as: ["VIN-32A"] }
              VIN-32A: { status: 200, used_in: [], fitted_to: [], built_as: [] }
            default: { error: "not_found" }
      budget: { max_llm_calls: 2, max_tool_calls: 80, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: valid_json_return, schema: { type: object, required: [affected, stopped, notice], properties: { affected: { const: [{ id: "A-118", type: "assembly", path: ["P-4471", "A-118"] }, { id: "A-404", type: "assembly", path: ["P-4471", "A-404"] }, { id: "V-32", type: "variant", path: ["P-4471", "A-118", "V-32"] }, { id: "VIN-32A", type: "vehicles", path: ["P-4471", "A-118", "V-32", "VIN-32A"] }] }, stopped: { const: "complete" } } } }

reference_md: |
  Vector search answers "what looks like this?", and a recall asks "what is
  connected to this?". The assemblies that use a brake-line fitting have pages
  about hoses, brackets and wheel arches, so no similarity score puts them
  near the fitting's page. The connection lives in the parts graph, and the
  way to read it is to follow edges.

  The model is the wrong place to ask. It has never seen the graph, so its
  list of assemblies is a guess written in a confident voice, and one invented
  assembly sends a letter about a car nobody built while a real one goes
  missing. Here the model words the notice from a list the code built, and
  every entry carries the path that put it there.

  A walk needs three things a search does not. The frontier is the list of
  reached nodes still waiting to be asked about, taken oldest first, so each
  node is reached by its shortest path from the part. The visited set ends the
  loop that a data-entry error made: a kit listed inside its own sub-kit is
  asked about once. The stop is two limits, because they fail differently. The
  hop limit bounds depth and keeps a chain of nested kits from pulling in
  products several assemblies further out. The lookup limit bounds width, and
  a hub is what width looks like: one mounting kit in 1,900 assemblies turns a
  walk into thousands of lookups at the second hop.

  Saying which limit stopped the walk is part of the answer. `complete` means
  the list is the whole recall. `hop_cap` means something sits further out
  than the team chose to look, and `node_cap` means the list is partial, with
  nodes reached and never asked about. A quality engineer reads those three
  very differently, and a walk that reports the same word in all three cases
  hides the difference that matters most.

  The path is the evidence. A recall letter that says a vehicle is affected
  has to say why: this fitting, in this assembly, on this variant, built in
  this range. Breadth-first gives it for nothing, as long as each waiting node
  carries its path, and rebuilding it afterwards means walking again. A node
  whose own lookup fails is still affected, because its parent's reply named
  it, and the walk goes on without its neighbours.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    When would you put a graph behind retrieval instead of a vector index, and what stops the traversal?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: neighbours
    args: node
    returns: '`used_in`, `fitted_to` and `built_as`, each a list of ids, or `{"error": "not_found"}` for a node the database does not hold.'
example:
  case: lists_each_product_with_the_path_that_reaches_it
  expect: Ask about P-4471 first, reach two assemblies, two variants and two vehicle ranges once each
    with the path that reached them, and return them sorted by id with `stopped` as complete.
traps:
  - Asking the model which assemblies use the part, when only the parts graph knows and the model names
    ones that do not exist.
  - Walking with no visited set, so a kit listed inside its own sub-kit keeps the walk going round.
  - Walking with no limit on hops or lookups, so one kit shared by hundreds of assemblies turns a recall
    question into minutes of lookups.
  - Listing an affected product without the path that shows how the recalled part reaches it.
