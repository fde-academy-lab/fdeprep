slug: rerank-enough-candidates-to-find-the-answer
title: "Rerank enough candidates to find the answer"
drill: true
skill: Rerank to the depth where answers sit, and fall back to the fused order when it fails
artefact_type: code
difficulty: medium
track: context
concept:
  topic: "In the window or retrieved"
  question: "How many candidates does the reranker need to see, and what if it cannot answer?"
est_minutes: 30
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: tool-error-handling, weight: 0.5 }
  - { slug: context-assembly, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  The customer-care knowledge desk at a life insurer the size of HDFC Life
  answers policy questions for its call centre from 3,200 process documents.
  Retrieval runs in two stages. Hybrid search, keyword and vector results
  fused by rank, returns 30 candidate passages, best first. A reranker then
  reads the question together with each passage and scores how well that
  passage answers it, and the three passages it scores highest go to the
  model. Search is quick and rough, and the reranker is slower and more
  exact, which is why it reads a short list. It takes eight passages a call.

  To save calls, the team reranked only the first five candidates. A customer
  asked what they would get if they surrendered their unit-linked plan after
  three years. The passage that answers it sat 11th in the fused list, so the
  reranker never read it, and the model answered from a passage about
  traditional savings plans: the surrender value is paid within seven working
  days. A unit-linked plan surrendered in its first five years pays nothing
  until the five-year lock-in ends. The desk gave the wrong answer to about
  1,400 customers over two weeks.

  A week later the reranker timed out for 40 minutes on a Tuesday. Its adapter
  returned an empty list, and for those 40 minutes the desk told every caller
  that no process document covered their question.

  The search team has since checked 500 answered questions. The passage that
  answers sat in the fused top five for 61 percent of them and in the first
  24 for 96 percent, and the desk can afford three reranker calls a question.
  Rerank deep enough to reach the answer, and keep answering when the reranker
  cannot.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is JSON, such as `{"query": "Can a customer change the nominee
  on their policy online?"}`. Every step below is code, and the model is
  asked once, at the end.

  1. Call `tools["search"](query=...)` once. It returns the fused list, best
     first, about 30 entries:

         {"status": 200, "candidates": [{"id": "P-207", "text": "..."}, ...]}

     Some process documents were uploaded twice when the index moved last
     year, so one id can appear twice. Keep each id once, at its first
     position.

  2. Rerank the first 24 unique candidates, eight a call, in fused order:

         tools["rerank"](query=..., ids=["P-201", "P-207", ...])

     It answers with a score from 0 to 1 for each passage, or with an error:

         {"status": 200, "scores": [{"id": "P-207", "score": 0.91}, ...]}
         {"error": "timeout"}

     The reranker scores each passage against the query on its own, so a
     score from one call compares with a score from another. Merge them into
     one score per id.

  3. Keep the three candidates with the highest scores. A tie goes to the one
     earlier in the fused list.

  4. When a reranker call returns an error, make no more reranker calls and
     keep the first three unique candidates in fused order. Scored and
     unscored passages never share one ranking.

  5. Ask the model once with `answer_prompt(query, passages)`, which the
     starter code provides. It replies `Final Answer: <text>`.

  Return a JSON string:

      {"top": ["P-207", "P-209", "P-212"], "reranked": true, "answer": "<the text after Final Answer:>"}

  `top` holds the three ids in the order they went to the model, and
  `reranked` is false when step 4 applied.

  In this problem `rerank` is a scripted stand-in, and its replies come in
  call order: the first scores the first eight unique candidates, the second
  the next eight, and the third the eight after that.

  Budget: at most 2 model calls, and a clean solution makes one. Allowed
  imports: json, re.

stub_code: |
  import json
  import re

  DEPTH = 24  # unique candidates the reranker reads
  BATCH = 8   # passages the reranker reads in one call
  TOP = 3     # passages the model reads


  def unique(candidates: list) -> list:
      """The candidates in fused order, each id once, at its first position."""
      # TODO 1: keep the first entry for each id, in order
      return candidates


  def rerank_scores(query: str, candidates: list, tools: dict):
      """Reranker scores by id for the first DEPTH candidates, BATCH ids a call,
      or None when any call returns an error."""
      # TODO 2: send the ids of candidates[:DEPTH] in slices of BATCH, and put
      #         every reply's scores into one dict keyed by id
      # TODO 3: on a reply that carries "error", stop and return None
      return None


  def answer_prompt(query: str, passages: list) -> str:
      blocks = "\n".join(f"[{p['id']}] {p['text']}" for p in passages)
      return ("Answer the customer's question from these passages only.\n"
              f"Question: {query}\n{blocks}\n"
              "Reply as Final Answer: <answer>.")


  def run_agent(question: str, llm, tools: dict) -> str:
      query = json.loads(question)["query"]
      found = tools["search"](query=query) or {}
      candidates = unique(found.get("candidates") or [])
      scores = rerank_scores(query, candidates, tools)
      # TODO 4: with scores, the TOP candidates with the highest scores, a tie
      #         going to the earlier one. Without scores, the first TOP
      #         candidates in fused order.
      top = []
      reply = llm(answer_prompt(query, top))
      return json.dumps({
          "top": [p["id"] for p in top],
          "reranked": scores is not None,
          "answer": reply.split("Final Answer:", 1)[-1].strip(),
      })

steps:
  - id: s1
    text: Send the first eight unique ids, in fused order, to `rerank`.
    check_id: s1
  - id: s2
    text: Keep calling, eight ids a call, until the first 24 unique ids are scored.
    check_id: s2
  - id: s3
    text: Merge the scores into one per id and keep the three highest.
    check_id: s3
  - id: s4
    text: On a reranker error, stop calling it and keep the fused order, with `reranked` false.
    check_id: s4

step_checks:
  # s1 to s3 read answers_from_the_passage_the_reranker_puts_first. Search
  # returns P-201 at places 1 and 4 there, so the first eight unique ids run to
  # the ninth entry, and a first call that keeps the repeat differs from this
  # list. The 17th to 24th unique ids are P-710 to P-717, and search plus three
  # reranker calls is four tool calls.
  - step_id: s1
    spec:
      assertions:
        - { type: calls_tool_with, name: rerank, args: { ids: ["P-201", "P-207", "P-212", "P-209", "P-236", "P-233", "P-224", "P-701"] } }
  - step_id: s2
    spec:
      assertions:
        - { type: calls_tool_with, name: rerank, args: { ids: ["P-710", "P-711", "P-712", "P-713", "P-714", "P-715", "P-716", "P-717"] } }
        - { type: tool_calls_at_most, value: 4 }
  - step_id: s3
    spec:
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [top, reranked, answer], properties: { top: { const: ["P-207", "P-209", "P-212"] }, reranked: { const: true } } } }
  # s4 reads answers_from_the_fused_order_when_the_reranker_times_out, where
  # every reranker call times out and the fused top three answer.
  - step_id: s4
    spec:
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [top, reranked, answer], properties: { top: { const: ["P-410", "P-402", "P-415"] }, reranked: { const: false } } } }

hints:
  - Count how many passages the reranker read for the unit-linked question, and
    where in the fused list the passage that answers it sat.
  - A reranker reorders what it reads and cannot promote a passage it never
    saw. How deep it reads is a recall decision, and the desk measured it. The
    answer sat within the first 24 for 96 questions in 100.
  - Three calls of eight reach 24 passages. Each passage is scored on its own,
    so one dict of scores by id, filled from every reply, ranks all 24
    together.
  - A failed reranker still leaves the fused order. Use all of it, say so with
    `reranked` false, and stop calling, so half a reranked list never reaches
    the model.

scenario:
  headline: "The answer sat 11th and the reranker read only the first five"
  who: The customer-care knowledge desk at a life insurer the size of HDFC Life
  situation: >-
    Hybrid search returns 30 passages and a reranker picks the three the model
    reads. The team reranked only the first five, so the passage answering a
    unit-linked surrender question, 11th in the list, was never read. When the
    reranker timed out, the desk said no document covered anything.
  stakes: >-
    About 1,400 customers heard their surrender money would come within seven
    working days. A unit-linked plan in its first five years pays nothing until
    the lock-in ends.
  metrics:
    - { label: "Answer's place in the list", value: 11th }
    - { label: Candidates reranked, value: 5 of 30 }
    - { label: Customers misinformed, value: "about 1,400" }

diagram:
  title: Where the passage that answers was never read
  caption: >-
    The reranker can only promote what it reads. Three calls of eight reach the
    24 places where answers sit, and any error falls back to the fused order.
  direction: lr
  nodes:
    - { id: caller, label: Call-centre agent, sub: asks for a customer, kind: actor, tone: blue, at: [0, 1] }
    - { id: search, label: "`search`", sub: "30 passages, fused, some repeated", kind: tool, tone: neutral, at: [1, 1] }
    - { id: dedupe, label: Each id once, sub: first position kept, kind: guard, tone: green, at: [2, 1] }
    - { id: first, label: "`rerank` call 1", sub: unique passages 1 to 8, kind: service, tone: teal, at: [3, 0] }
    - { id: second, label: "`rerank` call 2", sub: "9 to 16, the answer at 11", kind: service, tone: teal, at: [3, 1] }
    - { id: third, label: "`rerank` call 3", sub: 17 to 24, kind: service, tone: teal, at: [3, 2] }
    - { id: merge, label: Merge by id, sub: three highest scores, kind: decision, tone: purple, at: [4, 1] }
    - { id: model, label: Model, sub: one call with three passages, kind: model, tone: teal, at: [5, 1] }
    - { id: five, label: First five only, sub: the 11th passage never read, kind: output, tone: pink, at: [2, 0] }
    - { id: fused, label: Fused order, sub: "any error, reranked false", kind: guard, tone: orange, at: [4, 2] }
  edges:
    - { from: caller, to: search, label: the question, step: 1 }
    - { from: search, to: five, label: the old way, tone: danger }
    - { from: five, to: model, label: "a traditional plan's rule", tone: danger }
    - { from: search, to: dedupe, step: 2 }
    - { from: dedupe, to: first, step: 3 }
    - { from: dedupe, to: second, step: 3 }
    - { from: dedupe, to: third, step: 3 }
    - { from: first, to: merge, label: scores }
    - { from: second, to: merge, label: scores }
    - { from: third, to: merge, label: scores }
    - { from: merge, to: model, label: top three, tone: success, step: 4 }
    - { from: second, to: fused, label: an error, tone: muted }
    - { from: fused, to: model, label: fused top three }

approach:
  goal: Let the reranker read every passage that might answer, and keep answering when it fails
  branches:
    - label: Depth decides recall
      detail: The reranker reorders what it reads. A passage past the depth is never promoted, no matter how well it answers.
      leaves: ["where did the answer sit in the fused list?", "how far do three calls of eight reach?"]
    - label: Batches merge by id
      leaves: [each passage is scored on its own, "one score per id, from every reply"]
    - label: Spend no place twice
      leaves: [drop a repeated id before the first call, keep its first position]
    - label: A failed reranker still leaves an order
      leaves: [fall back to the fused order, say which order answered, stop calling once it fails]

coach:
  opening: >-
    Before you write a reranker call, count how many passages the old desk let
    the reranker read, and where in the fused list the unit-linked answer sat.
  signals:
    - id: no-depth
      when: { code_lacks: ':\s*(DEPTH|24)\s*\]' }
      say: >-
        Nothing in your code stops at the 24th unique candidate. The answer sat
        inside the first 24 for 96 questions in 100, and the reranker can only
        promote a passage it reads. How far down the fused list does yours read?
    - id: one-call
      when: { code_lacks: '(BATCH|8)\s*\]' }
      say: >-
        The reranker reads eight passages a call and ignores the rest. Where does
        your code cut the 24 ids into calls of eight?
    - id: no-dedupe
      when: { code_lacks: '\bnot in\b|setdefault|fromkeys' }
      say: >-
        Search can return one id twice. What does the second copy cost you in a
        call that holds only eight passages?
    - id: hidden-depth
      when: { test_failed: reranks_far_enough_to_reach_the_eleventh_passage }
      say: >-
        In that run the passage that answers sits 11th in the fused list. Which
        of your reranker calls reads it, and does its score reach your top three?
    - id: hidden-dupes
      when: { test_failed: spends_no_reranker_slot_on_a_repeated_passage }
      say: >-
        In that run six ids come back twice. Which ids went into your third
        reranker call, and had any of them been sent already?
    - id: hidden-halfway
      when: { test_failed: falls_back_whole_when_the_second_call_fails }
      say: >-
        In that run the reranker answers one call and times out on the next.
        Which order reached the model, and what did `reranked` say about it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with `unique()`: walk the candidates in order and keep an id only
        the first time you meet it.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The second hint says how deep the reranker has to
        read, and why.
  wrap_up: >-
    A reranker sharpens the order inside what it reads, and how far down the
    list it reads fixes recall. Rerank to the depth your answers sit at, merge
    the calls by id, and when the reranker fails, answer from the fused order
    and say so.

tests:
  - name: answers_from_the_passage_the_reranker_puts_first
    visibility: public
    spec:
      kind: agent_run
      input: { question: '{"query": "Can a customer change the nominee on their policy online?"}' }
      llm_script:
        - { match: { contains: "[P-207]" },
            reply: "Final Answer: Yes. The policyholder can change the nominee online under Service Requests, Change Nominee, and the change takes effect once the insurer acknowledges it [P-207]." }
        - { match: "*", reply: "Final Answer: I could not find how to change a nominee in the process documents." }
      tools:
        search:
          returns:
            status: 200
            candidates:
              - { id: "P-201", text: "Nominee details are printed on the policy schedule and on every premium receipt." }
              - { id: "P-207", text: "A nominee can be changed online under Service Requests, Change Nominee, and the change takes effect once the insurer acknowledges it." }
              - { id: "P-212", text: "A nominee who is a minor needs an appointee, named in the same request." }
              - { id: "P-201", text: "Nominee details are printed on the policy schedule and on every premium receipt." }
              - { id: "P-209", text: "Changing the nominee at a branch needs form NC-2, signed by the policyholder." }
              - { id: "P-236", text: "A death claim is paid to the nominee, or to the legal heirs when no nominee is named." }
              - { id: "P-233", text: "More than one nominee can be named, each with a share in percent, and the shares add up to 100." }
              - { id: "P-224", text: "Nominee changes on a policy assigned to a lender go to the legal desk." }
              - { id: "P-701", text: "Premium receipts for the last three years can be downloaded from the customer portal." }
              - { id: "P-702", text: "A change of name after marriage needs the marriage certificate and a signed request." }
              - { id: "P-703", text: "Calls about a death claim go to the claims desk, never the service desk." }
              - { id: "P-704", text: "The customer portal locks after five wrong passwords and opens again after 30 minutes." }
              - { id: "P-705", text: "Printed policy documents are sent by courier within seven days of issue." }
              - { id: "P-706", text: "A complaint is acknowledged within two working days and answered within 14." }
              - { id: "P-707", text: "Revival requests above two lakh rupees go to the underwriting desk." }
              - { id: "P-708", text: "Agents can see a policy's status but cannot change the bank details on it." }
              - { id: "P-709", text: "The service desk is open from 9:00 to 19:00, Monday to Saturday." }
              - { id: "P-710", text: "Medical reports for a new proposal are valid for six months." }
              - { id: "P-711", text: "A cheque returned unpaid is charged 300 rupees and the premium falls due again." }
              - { id: "P-712", text: "The registered email address can be changed only from the registered mobile number." }
              - { id: "P-713", text: "Bonus rates for participating traditional plans are declared once a year." }
              - { id: "P-714", text: "A customer can ask for a call back in Hindi, English, Tamil, Telugu or Marathi." }
              - { id: "P-715", text: "Fund prices for unit-linked plans are published on the website every working day." }
              - { id: "P-716", text: "Standing instructions on a credit card are set up from the customer portal." }
              - { id: "P-717", text: "KYC documents older than ten years are asked for again at the next service request." }
              - { id: "P-718", text: "Complaints still open after 14 days can be escalated to the head of customer service." }
              - { id: "P-719", text: "Branch staff verify the customer's identity before reading out any policy detail." }
              - { id: "P-720", text: "Policy loan interest is charged every six months and added to the loan if unpaid." }
              - { id: "P-721", text: "A policy issued in error is cancelled and the premium refunded in full." }
              - { id: "P-722", text: "Cash premiums are accepted only at branches, never by agents." }
        rerank:
          sequence:
            - status: 200
              scores: [{ id: "P-201", score: 0.47 }, { id: "P-207", score: 0.91 }, { id: "P-212", score: 0.66 }, { id: "P-209", score: 0.74 },
                       { id: "P-236", score: 0.22 }, { id: "P-233", score: 0.58 }, { id: "P-224", score: 0.31 }, { id: "P-701", score: 0.25 }]
            - status: 200
              scores: [{ id: "P-702", score: 0.33 }, { id: "P-703", score: 0.24 }, { id: "P-704", score: 0.32 }, { id: "P-705", score: 0.10 },
                       { id: "P-706", score: 0.31 }, { id: "P-707", score: 0.09 }, { id: "P-708", score: 0.17 }, { id: "P-709", score: 0.08 }]
            - status: 200
              scores: [{ id: "P-710", score: 0.18 }, { id: "P-711", score: 0.26 }, { id: "P-712", score: 0.34 }, { id: "P-713", score: 0.25 },
                       { id: "P-714", score: 0.33 }, { id: "P-715", score: 0.11 }, { id: "P-716", score: 0.32 }, { id: "P-717", score: 0.10 }]
      budget: { max_llm_calls: 2, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [top, reranked, answer], properties: { top: { const: ["P-207", "P-209", "P-212"] }, reranked: { const: true } } } }
        - { type: returns_matches, value: "(?i)service requests" }
        - { type: llm_calls_at_most, value: 1 }

