reference_md: |
  A retriever and a reranker do different jobs. Hybrid search is cheap and
  wide: it finds 30 passages that might matter and orders them roughly. A
  reranker reads the question together with each passage and scores how well
  that passage answers it, which is slower and sharper. The sharpness applies
  only inside what it reads. A passage at fused rank 11 cannot be promoted by
  a reranker that reads five, no matter how well it answers, so the depth you
  send is the recall of the whole pipeline.

  The depth is a number you measure. The desk's review found the answering
  passage inside the first five for 61 questions in 100 and inside the first
  24 for 96, and three calls of eight cost what the desk can afford. Reading
  five saved two calls a question at the cost of the answer on 35 questions
  in 100.

  Merging calls by score works here because this reranker scores each passage
  against the question on its own, the way a cross-encoder does. A passage
  gets the same score whichever call it travels in, so one dict of scores by
  id ranks all 24 together. A reranker that orders a whole list against
  itself gives scores that compare only inside one call, and its calls would
  have to be merged some other way.

  Repeated ids look harmless and cost recall. Each copy takes one of the 24
  places, so six repeats push six unique passages past the depth. Dropping
  them before the first call keeps every place for a different passage.

  A failed reranker leaves the fused order, which is less precise than a
  reranked one and still an answer. The adapter that returned an empty list
  turned a slightly worse answer into "no document covers this" for 40
  minutes. When the second call fails after the first succeeded, keeping the
  first call's scores puts eight scored passages ahead of 16 unscored ones by
  the accident of which call failed. The whole list falls back, and
  `reranked` false tells the trace and the evaluation which order answered.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Where does a reranker sit in a retrieval pipeline, how deep do you rerank, and what happens when the reranker is down?
  source: |
    Author judgement. Interview bank entry I008 in docs/source-pack/09-interview-bank.json, where the right document was retrieved and the answer is still wrong, is adjacent, and that bank labels every entry "Original interview-style practice; actual employer frequency unverified". No employer frequency data stands behind it.

tools:
  - name: search
    args: query
    returns: "`candidates` in fused order, best first, each an `id` and its `text`. One id can appear twice."
  - name: rerank
    args: query, ids (eight at most)
    returns: 'A `score` from 0 to 1 for each id it reads, as `scores`, or `{"error": "timeout"}`.'
example:
  case: answers_from_the_passage_the_reranker_puts_first
  expect: Search once, drop the second P-201, rerank the first 24 unique passages in three calls of eight,
    and answer from P-207, the passage the reranker scores highest.
traps:
  - Reranking only the first few candidates, so a passage further down the fused list is never read,
    no matter how well it answers.
  - Sending more than eight ids in one call, so the reranker scores the first eight and never reads the
    rest.
  - Spending a reranker place on an id that search returned twice, which pushes a unique passage past
    the 24th place.
  - Meeting a reranker error with no passages at all, or ranking one call's scores ahead of the fused
    order for the rest.
