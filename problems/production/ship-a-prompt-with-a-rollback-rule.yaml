slug: ship-a-prompt-with-a-rollback-rule
title: The refund fix strands connecting passengers in testing
day: 21
skill: Ship a prompt change with a rollback rule written before launch
artefact_type: design
difficulty: hard
track: production
est_minutes: 40
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
  - { slug: client-communication, weight: 0.5 }

brief_md: |
  An airline's rebooking assistant helps passengers whose flights were
  cancelled, and it handles about 9,000 conversations a day. Prompt v14 has run
  for two months. In about 6 percent of conversations it offers a cash refund
  on a fare that does not allow one, and the airline's head of customer
  operations wants that stopped.

  Prompt v15 stops it. On the 200 development cases the prompt writers tuned
  against, v15 scores 92 percent against v14's 83. On the 150 holdout cases
  nobody tuned against, it scores 85 percent against v14's 88. The drop sits
  in the 30 holdout cases with a connecting flight, where v15 rebooks the
  first leg and leaves the passenger at the connection: 21 correct against
  v14's 27. About a fifth of real conversations involve a connection.

  The head of customer operations wants v15 live on Monday. Write the release
  and rollback plan you would send them. Say what ships on Monday, how it is
  exposed, and exactly which metric, threshold and window roll it back.

contract_md: |
  Write the plan as you would send it to the head of customer operations, who
  is not an engineer and who has promised Monday to their own director.

  Between 300 and 550 words. There is no template and no required structure.

  A rollback rule counts when it names the metric, the threshold and the
  window, and when Monday's traffic could actually trip it.

word_range: [300, 550]
required_headings: []

rubric:
  - label: Writes a rollback rule with a metric, a threshold and a window that can fire
    weight: 30
    descriptor_md: |
      Strong answers name a metric the canary produces within hours, a
      threshold v14 would not trip on a normal day, and a window with a
      minimum number of conversations, and they compare against v14 running
      beside it over the same window. A harm with a known shape, such as a
      stranded passenger, gets a trigger that fires on a single case. "Roll
      back if escalations go up" or "if customers complain" is a wish, and so
      is a threshold with no window.
  - label: Reads the holdout as the evidence and deals with the connections slice
    weight: 25
    descriptor_md: |
      Strong answers say the development score measures fit to the cases v15
      was written against, so the holdout is the number that predicts Monday.
      They notice that the drop is concentrated in connecting flights and do
      something about it: keep connections on v14, or gate them on a fixed
      holdout slice. They also say that 30 cases show a direction and cannot
      give a rate. Answers that ship everything on the 9-point development
      gain have chosen the measurement the prompt writers could influence.
  - label: Exposes v15 in stages with v14 one switch away
    weight: 20
    descriptor_md: |
      Strong answers start small, give a schedule for widening exposure with
      a gate at each step, and keep v14 deployed so rollback is a setting
      rather than a redeploy. A plan that needs a code change to undo will not
      be undone at 2am.
  - label: Gives the client a Monday answer they can act on
    weight: 15
    descriptor_md: |
      The head of customer operations has promised Monday. Strong answers say
      what ships on Monday, which passengers get it, what waits and until
      when, and what to tell the director, in plain language with no
      evaluation jargon left unexplained.
  - label: Names who rolls back and how fast
    weight: 10
    descriptor_md: |
      Strong answers make rollback automatic on the trigger, let the on-call
      engineer act without a meeting, and say when the client hears about it.
      A rollback that waits for sign-off has already failed.

exemplars:
  - band: strong
    score: 90
    body_md: |
      v15 should go live on Monday for passengers on a single flight.
      Passengers with a connection should stay on v14 until the holdout says
      otherwise.

      The two scores disagree because they measure different things. The 200
      development cases are the ones the prompt writers tuned v15 against, so
      92 percent tells us v15 fits them. The 150 holdout cases are the only ones
      that predict real traffic, and there v15 drops from 88 to 85 percent. The
      drop sits in connecting flights, where v15 rebooks the first leg and
      leaves the passenger at the connection: 21 correct out of 30 against 27.
      Thirty cases are too few to give a failure rate. Six more strandings out
      of thirty still show the direction, and about 1,800 of our passengers a
      day are on connections.

      Monday, 06:00. v15 goes to 10 percent of single-flight conversations. v14
      keeps everything else, including every connection. Both versions stay
      deployed and the prompt version is a setting, so switching back is one
      change that takes effect on the next conversation. On Tuesday and
      Wednesday, if nothing has fired, single flights go to 50 percent and
      then 100 percent.

      The rollback rule. v15 rolls back automatically when either of these
      holds over a rolling two-hour window containing at least 400 v15
      conversations:

      - the share of conversations handed to a human agent is more than 3
        points above v14's over the same window;
      - any rebooking leaves a passenger without an onward flight, as counted
        by the itinerary check we already run after every rebooking.

      The second fires on a single case, because a stranded passenger is the
      harm we know v15 can cause. The refund fix is measured alongside: if
      forbidden refund offers on v15 are not below v14's by Wednesday, v15 has
      not earned full traffic.

      Who acts. The rollback is automatic, the on-call engineer can switch
      back at any time without asking anyone, and your team hears from us
      within 30 minutes of any rollback, with the conversations involved.

      Connections. The prompt writers fix the connecting-flight behaviour
      against new cases, and v15.1 reaches connections only when it matches
      v14 on the holdout slice and passes the same canary. I expect that in
      about two weeks. That is the trade-off in this plan: passengers with a
      connection keep v14's refund behaviour for two more weeks, which costs
      the airline some forbidden refunds, in exchange for nobody being
      stranded at a connection by the fix.

      What you can tell your director: the refund fix is live on Monday for
      most passengers, the rest follow once it stops stranding people at
      connections, and a rule written before launch takes it back out if the
      numbers turn.
  - band: adequate
    score: 62
    body_md: |
      I recommend we launch v15 on Monday with a canary, because it fixes the
      refund problem, which is costing money every day.

      The development score improved from 83 to 92 percent, which is a large
      gain. The holdout score went down from 88 to 85 percent, which is worth
      watching. Most of that drop is in connecting flights, so I would ask the
      prompt writers to look at those cases this week.

      Launch plan:

      - Monday morning: 10 percent of traffic on v15, 90 percent on v14.
      - Tuesday: 50 percent if the numbers look normal.
      - Wednesday: 100 percent.

      Each step waits for a day of normal numbers before the next one starts,
      and the product owner can hold a step if escalations or complaints look
      high.

      Rollback: we switch back to v14 if the escalation rate on v15 goes above
      8 percent, or if we see complaints about missed connections. v14 stays
      deployed, so rolling back is a configuration change and takes a few
      minutes.

      The on-call engineer owns the rollback decision during the canary, and
      the product owner signs off each step up.

      We should also keep measuring the refund issue so we can show the fix
      worked, and we will send your team the rate of forbidden refund offers
      each morning during the rollout. I would expect it to fall close to zero
      if v15 behaves as it did on the development cases.

      For the connecting flights, once the prompt writers have a fix we will
      re-run both the development and holdout sets before shipping it. If the
      holdout number for connections does not improve, we should consider
      keeping connecting itineraries on v14 permanently.

      Overall this gets the refund fix live on Monday as requested, with a way
      back if something goes wrong, and it keeps the decision to widen the
      release with the people who can see the numbers each day.
  - band: weak
    score: 25
    body_md: |
      v15 is a clear improvement. It scores 92 percent on our test set against
      83 percent for v14, a gain of 9 points, and it fixes the refund problem
      that has been costing the airline money every week.

      Our test set is the 200 cases the prompt writers worked from while they
      wrote v15, so v15 has been checked against every one of them many times.
      A gain of 9 points on cases the team knows that well shows that v15 does
      what we need.

      I recommend we release it to all passengers on Monday as planned. We have
      tested it thoroughly and the numbers speak for themselves.

      Every day that v14 stays live, it keeps offering refunds that the fare
      rules do not allow, and each of those offers costs the airline money.
      Releasing v15 to everyone at once stops that for every passenger from the
      first day. A partial release would leave some passengers on the old
      prompt for no clear benefit.

      After launch we will monitor it closely for the first few days. If
      customers complain or the support team sees problems, we will roll back
      to v14, which we can do quickly because the old prompt is saved in the
      repository.

      The support team will keep an eye on escalations and complaints, and the
      prompt writers will read through a selection of conversations each
      morning. If anything looks wrong, we will meet with your team to agree
      whether to roll back, so that nobody changes the assistant without the
      airline's approval. An engineer can then restore v14 from the repository
      and redeploy it.

      There was a small drop on one of the other test sets, from 88 to 85
      percent, but that is within normal variation and the overall picture is
      strongly positive. Three points on 150 cases is four or five cases,
      which is the kind of movement any prompt change produces.
      We can look into it after launch if it turns out to matter.

      You can tell your director that the refund fix will be live for every
      passenger on Monday, as promised.

      In short, v15 is ready, and Monday is achievable.

hints:
  - Two scores moved in opposite directions. Ask which set of cases v15 was
    written against.
  - A threshold with no window either fires on the first bad conversation or
    never fires. Say how much traffic it looks at before it decides.
  - Six fewer correct out of thirty shows which way the slice moved. The
    canary's own traffic is where a rate comes from.
  - Monday can ship something. Decide which passengers get v15 and which stay
    on v14 until the connections slice passes.
  - Say who presses the button, how long a rollback takes, and whether v14 is
    still deployed when it happens.

scenario:
  who: The head of customer operations at an airline
  situation: >-
    Prompt v15 stops the rebooking assistant offering refunds the fare rules
    forbid. It beats v14 on the development cases and loses to it on the
    holdout.
  stakes: >-
    About a fifth of passengers have a connecting flight, and on those holdout
    cases v15 rebooks the first leg and strands the passenger at the
    connection.
  metrics:
    - { label: Development cases, value: 83% to 92% }
    - { label: Holdout cases, value: 88% to 85% }
    - { label: Holdout connections, value: 27 to 21 of 30 }

diagram:
  title: Two scores for one prompt, and which one decides
  caption: >-
    The development score measures how well v15 fits the cases it was written
    against. The holdout score is the one that predicts Monday.
  direction: lr
  nodes:
    - { id: dev, label: Development cases, sub: 200 that v15 was tuned on, kind: store, tone: blue, at: [0, 0] }
    - { id: holdout, label: Holdout cases, sub: 150 nobody tuned on, kind: store, tone: blue, at: [0, 2] }
    - { id: v15, label: Prompt v15, sub: stops forbidden refunds, kind: doc, tone: purple, at: [1, 1] }
    - { id: gain, label: 83% to 92%, sub: on the cases it was written against, kind: output, tone: green, at: [2, 0] }
    - { id: drop, label: 88% to 85%, sub: connections fall from 27 to 21 of 30, kind: output, tone: pink, at: [2, 2] }
    - { id: release, label: Monday release, sub: who gets v15 and what rolls it back, kind: decision, tone: orange, at: [3, 1] }
  edges:
    - { from: dev, to: v15, label: tuned against, step: 1 }
    - { from: holdout, to: v15, label: never seen, tone: muted }
    - { from: v15, to: gain, label: scored on development }
    - { from: v15, to: drop, label: scored on holdout, tone: danger }
    - { from: gain, to: release, label: the number that was sent, tone: danger }
    - { from: drop, to: release, label: the number that decides, tone: success }

approach:
  goal: A Monday release with a rollback rule that can actually fire
  branches:
    - label: Read the holdout
      leaves: [the development gain is on cases v15 was tuned on, the drop sits in connecting flights]
    - label: Scope the release
      detail: Monday can ship v15 where it is better and keep v14 where it is worse.
      leaves: [single flights first, connections wait for a fixed holdout]
    - label: Make rollback a rule
      leaves: [a metric the canary produces, a threshold and a window, enough traffic before it can fire]
    - label: Keep the way back open
      leaves: [v14 stays deployed, one switch and a named owner]

coach:
  opening: >-
    Before you write the plan, decide which of the two scores you believe, and
    say why in one sentence.
  signals:
    - id: no-holdout
      when: { code_lacks: '(?i)hold-?out|held[- ]out' }
      say: >-
        Your plan never mentions the holdout. v15 was tuned on the development
        cases. Which score predicts Monday?
    - id: no-connections
      when: { code_lacks: '(?i)connect' }
      say: >-
        The holdout drop sits in one slice. What happens on Monday to
        passengers with a connecting flight?
    - id: vague-monitoring
      when: { code_matches: '(?i)monitor (it |this |v15 )?closely|keep an eye|if (customers|passengers|users) complain' }
      say: >-
        Monitoring closely leaves the decision to whoever is awake. What
        number, over what window, rolls v15 back?
    - id: no-window
      when: { code_lacks: '(?i)\bwindow\b|\brolling \w+[- ](hour|minute|day)' }
      say: >-
        Your rollback rule has no window. How many conversations, or how many
        hours, does it look at before it fires?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with one sentence that names the metric, the threshold and the
        window that roll v15 back. The rest of the plan hangs off it.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three drafts have not passed. The first hint asks which cases v15 was
        written against, and the rest of the plan follows from the answer.
  wrap_up: >-
    A prompt release is a deployment. Ship it where the holdout says it is
    better, keep the old version one switch away, and write the rollback rule,
    with its metric, threshold and window, before launch.

reference_md: |
  The whole plan turns on reading the two scores correctly.

  The development set is where v15 was written. Prompt writers iterate against
  the cases in front of them, and every iteration that raises the score also
  fits the prompt a little more closely to those cases. A 9-point gain there
  is what tuning looks like, and it says little about traffic nobody tuned
  against. The holdout exists to answer that question, and it answered: v15 is
  slightly worse overall and clearly worse on connections. A plan that ships on
  the development number has chosen the measurement the prompt writers could
  influence.

  Scoping is what keeps Monday. v15 is better where the refund problem lives
  and worse on connections, so the release follows that line: single flights
  get v15, connections keep v14, and the airline gets its refund fix without
  trading it for stranded passengers. The trade-off it does accept, some
  forbidden refunds on connections for two more weeks, belongs in the plan in
  plain words, because the client is the one paying it. The version is a
  setting, because a release that needs a redeploy to undo is one nobody
  undoes at 2am.

  A rollback rule is three numbers written down before launch. The metric has
  to be something the canary produces within hours. The threshold has to be
  one v14 would not trip on a normal day, and the window has to hold enough
  conversations for the number to mean something. A harm with a known shape,
  like a stranded passenger, deserves a trigger that fires on one case.
  Everything else should compare against v14 running beside it over the same
  window, because Monday's traffic is different from last month's.

  Last, the rule has an owner and an automatic path. A rollback that waits for
  a meeting has already failed.

complexity: C4

interview_evidence:
  round: both
  asked_as: |
    Prompt B improves average accuracy but hurts a critical slice. How do you decide, and what rolls it back once it ships?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I023.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

traps:
  - Shipping on the development score, which measures fit to the cases v15 was tuned against, where the
    holdout predicts Monday.
  - Dismissing the holdout drop as normal variation and sending connecting flights to v15, when the drop
    sits in exactly that slice.
  - Writing a rollback rule with no threshold or window, such as rolling back if escalations go up or
    customers complain.
  - Making rollback a redeploy or a meeting, where v14 stays deployed and the switch fires without anyone's
    sign-off.
