slug: leave-the-answer-room-in-the-allowance
title: Leave the answer room inside the token allowance
artefact_type: code
difficulty: easy
track: production
est_minutes: 20
competencies:
  - { slug: context-assembly, weight: 1.0 }
  - { slug: cost-and-latency, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A broadband provider triages every support ticket with a small model before
  a person sees it. The platform team gives each triage request an allowance
  of 400 tokens, prompt and answer together, which is what keeps a
  30,000-ticket day inside the monthly budget. The triage answer is a JSON
  label with a one-sentence reason, and it needs 80 of those tokens.

  The prompt builder counts four characters to a token and keeps context until
  its estimate reaches 400. Last month the provider opened a Hindi support
  line. A Hindi ticket of 92 characters is estimated at 23 tokens, and the
  model's tokenizer measures it at 180. The prompt runs over, the answer gets
  whatever room is left, and the label comes back cut off halfway through the
  JSON. The ticket then sits unrouted until somebody notices.

  Rebuild the prompt so the answer always has its 80 tokens. The instructions
  and the ticket reach the model whole, every time. Everything else is ranked
  context, and the least useful goes first.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the ticket id. `prompt_parts(ticket=<id>)` returns

      {"status": 200, "allowance": 400, "answer_tokens": 80,
       "blocks": [
         {"id": "instructions", "kind": "instructions", "tokens": 88, "text": "..."},
         {"id": "account", "kind": "context", "rank": 1, "tokens": 41, "text": "..."},
         {"id": "ticket", "kind": "ticket", "tokens": 20, "text": "..."}]}

  `allowance` covers the prompt and the answer together, and the answer needs
  `answer_tokens` of it. `tokens` on every block is the count the model's own
  tokenizer measured. `kind` is `instructions`, `context` or `ticket`, and
  only context blocks carry a `rank`, where 1 is the most useful.

  Build the prompt from the blocks in the order given, joined by blank lines.

  - While the blocks cost more than `allowance` minus `answer_tokens`, drop
    the context block with the largest rank number.
  - Never drop or cut the instructions or the ticket. In these tickets the two
    always fit together.

  Call `llm(prompt)` once and return its reply unchanged. A prompt over its
  limit gets an answer cut off where the room ran out, and a second call to
  repair it spends the tokens the allowance exists to save.

  Budget: at most 2 model calls. Allowed imports: json, re.

