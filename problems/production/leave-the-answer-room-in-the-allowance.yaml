reference_md: |
  The allowance buys two things. The prompt is the one you assemble, so it is
  the one that grows until something else gives, and the thing that gives is
  the answer. A triage label cut off mid-JSON is worse than no label, because
  the router that reads it fails too, quietly, and the ticket waits for a
  person to notice. Hold the answer's share back before you count anything,
  and the prompt can only ever spend what is left.

  The count has to be the model's. Four characters to a token is a fair guess
  for English prose and a poor one for Hindi, whose characters this tokenizer
  splits into more pieces. An estimate that is right on average is wrong on
  exactly the tickets that differ from the average, and here those are the
  tickets from a whole support line. The tokenizer already measured every
  block, so the estimate saves nothing.

  What goes when the prompt is over is a ranking decision, made in advance by
  whoever ranked the context. A block's place in the list is an accident of
  how the context service assembled it. The instructions and the ticket sit
  outside the ranking entirely: without the instructions the model answers in
  prose, and a prompt cut from the end loses the ticket first, because that is
  where the question lives.

complexity: C2

