      #         has the room it needs
      prompt_limit = parts["allowance"]

      # TODO 2: count what a list of blocks costs, with the count the model's
      #         own tokenizer measured for each block
      def cost(kept: list) -> int:
          return 0

      # TODO 3: while the blocks cost more than the limit, drop the context
      #         block with the largest rank number, and keep the
      #         instructions and the ticket whatever happens
      kept = blocks

      # TODO 4: join the kept blocks with blank lines in their original
      #         order, call the model once and return its reply unchanged
      return ""

steps:
  - id: s1
    text: Take the answer's tokens out of the allowance before you count anything.
    check_id: s1
  - id: s2
    text: Count each block with the tokens the model's tokenizer measured.
    check_id: s2
  - id: s3
    text: Drop context from the largest rank number down until the prompt fits.
    check_id: s3
  - id: s4
    text: Join what is left in order, call the model once, and return its reply.
    check_id: s4

step_checks:
  - step_id: s1
    spec:
      assertions:
        - { type: calls_tool, name: prompt_parts }
  - step_id: s2
    spec:
      assertions:
        - { type: no_exception }
  - step_id: s3
    spec:
      assertions:
        - { type: valid_json_return }
  - step_id: s4
    spec:
      assertions:
        - { type: returns_nonempty }
        - { type: llm_calls_at_most, value: 1 }

hints:
  - The allowance pays for two things, and only one of them is the prompt.
  - Four characters to a token holds for English. Compare it with what the
    tokenizer measured for the Hindi ticket before you trust it anywhere.
  - Subtract the answer's tokens from the allowance first, then add up the
    tokens field across the blocks and compare against what is left.
  - Rank decides what goes, and a block's place in the list decides nothing.
    Each time round, take out the context block with the largest rank number,
    and leave the instructions and the ticket alone.

scenario:
  who: The platform team behind a broadband provider's ticket triage
  situation: >-
    Each triage request gets 400 tokens, prompt and answer together. The prompt
    builder counts four characters to a token and fills all 400 with context.
  stakes: >-
    Since the Hindi support line opened, its tickets come back with the triage
    label cut off mid-JSON, and they sit unrouted until somebody notices.
  metrics:
    - { label: Allowance per request, value: 400 tokens }
    - { label: Hindi ticket estimated, value: 23 tokens }
    - { label: Hindi ticket measured, value: 180 tokens }

diagram:
  title: Where the answer loses its room
  caption: >-
    Only 320 of the 400 tokens belong to the prompt. A character estimate lets
    a Hindi ticket take the answer's share.
  direction: lr
  nodes:
    - { id: parts, label: Prompt parts, sub: "instructions, ranked context, ticket", kind: doc, tone: blue, at: [0, 1] }
    - { id: count, label: tokens field, sub: what the tokenizer measured, kind: guard, tone: green, at: [1, 0] }
    - { id: builder, label: Prompt builder, sub: decides what fits, kind: agent, tone: purple, at: [1, 1] }
    - { id: guess, label: Four characters a token, sub: the rule of thumb, kind: decision, tone: pink, at: [1, 2] }
    - { id: model, label: Triage model, sub: 400 tokens in and out, kind: model, tone: teal, at: [2, 1] }
    - { id: whole, label: Whole label, sub: 80 tokens held back for it, kind: output, tone: green, at: [3, 0] }
    - { id: cut, label: Label cut off, sub: the prompt took the answer's room, kind: output, tone: pink, at: [3, 2] }
  edges:
    - { from: parts, to: builder, label: blocks, step: 1 }
    - { from: count, to: builder, label: measures Hindi at 180, tone: success }
    - { from: guess, to: builder, label: guesses Hindi at 23, tone: danger }
    - { from: builder, to: model, label: prompt, step: 2 }
    - { from: model, to: whole, label: prompt within 320, tone: success }
    - { from: model, to: cut, label: prompt over 320, tone: danger }

approach:
  goal: A prompt that always leaves the answer its 80 tokens
  branches:
    - label: Budget the answer first
      leaves: [the allowance covers prompt and answer, 400 minus 80 is the prompt's share]
    - label: Count what the model counts
      detail: Four characters a token is a guess that holds for English and fails for Hindi.
      leaves: [the tokens field on every block]
    - label: Trim by rank
      leaves: [the largest rank number goes first, a place in the list decides nothing]
    - label: Pin the essentials
      leaves: [the instructions stay whole, the ticket stays whole]

coach:
  opening: >-
    Work out how many of the 400 tokens the prompt may use before you look at a
    single block.
  signals:
    - id: no-room-for-the-answer
      when: { code_lacks: 'answer_tokens' }
      say: >-
        Nothing in your code reads answer_tokens. The allowance pays for the
        answer too. How much of it can the prompt have?
    - id: estimates-from-characters
      when: { code_matches: 'len\([^)]*\)\s*//?\s*4\b' }
      say: >-
        You are estimating tokens from characters. That holds for English and
        fails for the Hindi ticket. Every block already carries what the
        tokenizer measured.
    - id: cuts-the-prompt-string
      when: { code_matches: '(prompt|text)\w*\s*\[\s*:' }
      say: >-
        Cutting the joined prompt at a length removes whatever sits at the end,
        which is the ticket. Drop whole context blocks instead.
    - id: reserve-case
      when: { test_failed: the_answer_needs_room_of_its_own }
      say: >-
        The prompt in that case fits inside 400 tokens. Does it fit inside the
        part of the 400 that the answer does not need?
    - id: hindi-case
      when: { test_failed: a_hindi_ticket_costs_more_than_its_length_suggests }
      say: >-
        That ticket is in Hindi. Compare what your code thinks it costs with
        its tokens field.
    - id: rank-case
      when: { test_failed: the_worst_ranked_block_goes_first_wherever_it_sits }
      say: >-
        The context in that case is not listed in rank order. Which block did
        your code drop first, and what was its rank?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1, one line that takes the answer's tokens off the
        allowance, and press Run.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. Open the first hint; it says what else the
        allowance is paying for.
  wrap_up: >-
    Every token budget has two halves. Hold the answer's share back first,
    count with the model's own tokenizer, and let rank decide what goes.

tests:
  - name: a_ticket_that_fits_goes_in_whole
    visibility: public
    spec:
      kind: agent_run
      input: { question: "ticket 88213" }
      llm_script:
        - match:
            all:
              - { contains: "Reply with one JSON object and nothing else" }
              - { contains: "went up by 12 pounds" }
              - { contains: "12-month discount" }
          reply: '{"label": "billing", "reason": "The 12-month discount ended on 1 September, which added 12 pounds a month."}'
        - match:
            all:
              - { contains: "Reply with one JSON object and nothing else" }
              - { contains: "went up by 12 pounds" }
          reply: '{"label": "billing", "reason": "The bill rose without a package change, so check the account history."}'
        - { match: { contains: "went up by 12 pounds" }, reply: "I am sorry your bill went up. I will look into it for you." }
        - { match: "*", reply: "There is no ticket in this request to triage." }
      tools:
        prompt_parts:
          returns:
            status: 200
            allowance: 400
            answer_tokens: 80
            blocks:
              - id: instructions
                kind: instructions
                tokens: 88
                text: >-
                  You triage support tickets for a broadband provider. Use the ticket and
                  the context blocks. Reply with one JSON object and nothing else, with the
                  keys label and reason. The label is one of billing, fault, known_fault,
                  moving, cancel or other. The reason is one sentence a support agent can
                  act on. Never promise a refund, a credit or an engineer visit.
              - id: account
                kind: context
                rank: 1
                tokens: 41
                text: >-
                  Account history: the 12-month discount on this package ended on 1
                  September, which added 12 pounds a month to the bill. There are no other
                  changes on the account.
              - id: network
                kind: context
                rank: 2
                tokens: 22
                text: >-
                  Network status for the customer's area: no known faults and no planned
                  work this week.
              - id: offers
                kind: context
                rank: 3
                tokens: 44
                text: >-
                  Retention offers this month, for use only when a customer asks to leave or
                  to move to a cheaper package. Offer R6 takes 6 pounds a month off any
                  fibre package for 12 months.
              - id: ticket
                kind: ticket
                tokens: 20
                text: >-
                  My bill went up by 12 pounds this month and I have not changed my package.
                  Why?
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: prompt_parts }
        - { type: valid_json_return, schema: { type: object, required: [label, reason] } }
        - { type: returns_matches, value: '"label":\s*"billing"' }
        - { type: returns_matches, value: 'discount ended' }
        - { type: llm_calls_at_most, value: 1 }

