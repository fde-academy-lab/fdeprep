slug: divide-the-bill-by-resolved-tickets
title: "Work out the true cost per resolved ticket"
day: 15
skill: Divide the whole bill by the tickets that were resolved
artefact_type: code
difficulty: easy
track: observability
concept:
  topic: "Cost and latency per run"
  question: "What does one resolved ticket really cost?"
est_minutes: 15
competencies:
  - { slug: cost-and-latency, weight: 1.0 }
  - { slug: client-communication, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  Your team runs the support agent for a broadband provider. The provider
  wants to stop paying a monthly fee and pay per resolved ticket instead, and
  the draft contract prices a resolution at 6 cents. The commercial lead took
  that price from the ops dashboard, which says the agent costs 4.5 cents a
  ticket.

  The dashboard divides the month's model spend by every ticket the agent
  touched. More than a third of those tickets were escalated to a person, and
  hundreds of attempts timed out and were retried. The provider pays for none
  of that, and your team paid for all of it. Divided by the tickets the agent
  resolved, the same spend is 6.9 cents a resolution.

  At 6 cents, every ticket the agent resolves loses money. The contract is
  signed on Friday, and the commercial lead wants the figure computed from the
  run log before then.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns `Action: run_log(week=<n>)` once. Everything after
  that is yours, and the model never sees the log.

  `run_log(week=<n>)` returns one row per attempt:

      {"status": 200, "week": 38,
       "attempts": [{"ticket": "T-1", "attempt": 1,
                     "outcome": "resolved", "cost_usd": 0.041}]}

  `outcome` is `resolved` (the agent resolved the ticket), `escalated` (a
  person finished it) or `timeout` (the attempt died and may have been
  retried). Every attempt was paid for, whatever its outcome.

  Return a JSON string with three keys:

  - `total_spend_usd`: the cost of every attempt in the log.
  - `resolved_tickets`: how many tickets have at least one resolved attempt,
    counting each ticket once.
  - `cost_per_resolved_ticket_usd`: the first divided by the second, or
    `null` when nothing was resolved.

  Round both money figures to four decimal places.

  Budget: at most 2 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      reply = llm(f"Question: {question}\n")
      week = re.search(r"week=(\d+)", reply)
      log = tools["run_log"](week=week.group(1) if week else "")
      attempts = log.get("attempts") or []

      # TODO 1: add up cost_usd over every attempt, whatever its outcome
      total_spend = 0.0

      # TODO 2: collect the tickets with at least one resolved attempt, so
      #         that each ticket counts once
      resolved_tickets = set()

      # TODO 3: divide the spend by those tickets, and leave the figure as
      #         None when there are none
      per_resolution = None

      return json.dumps({
          "total_spend_usd": round(total_spend, 4),
          "resolved_tickets": len(resolved_tickets),
          "cost_per_resolved_ticket_usd":
              None if per_resolution is None else round(per_resolution, 4),
      })

steps:
  - id: s1
    text: Add up the cost of every attempt, whatever its outcome.
    check_id: s1
  - id: s2
    text: Collect the tickets with at least one resolved attempt, each one once.
    check_id: s2
  - id: s3
    text: Divide the spend by those tickets, and report no figure when there are none.
    check_id: s3

step_checks:
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.[0-9]*[1-9]' }
  - step_id: s2
    spec:
      assertions:
        - { type: returns_matches, value: '"resolved_tickets":\s*[1-9]' }
  - step_id: s3
    spec:
      assertions:
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*0\.[0-9]*[1-9]' }

hints:
  - The client pays for resolutions. Read your denominator and ask whether it
    counts only those.
  - An escalated ticket and a timed-out attempt were both paid for. They
    belong in the spend and nowhere else.
  - A set of ticket ids built from the resolved attempts counts each ticket
    once, whatever number of attempts it took.
  - A week can have no resolutions at all. Decide what the figure is then,
    before anything divides.

scenario:
  headline: "The draft contract loses money on every resolved ticket"
  who: The commercial lead at the firm running a broadband provider's support agent
  situation: >-
    The provider will pay per resolved ticket. The draft price of 6 cents came
    from a dashboard that divides model spend by every ticket the agent
    touched, resolved or not.
  stakes: >-
    More than a third of those tickets were escalated to a person and paid for
    anyway. Per resolution the agent costs 6.9 cents, so every resolution at 6
    cents loses money.
  metrics:
    - { label: Dashboard per ticket, value: "4.5¢" }
    - { label: Real cost per resolution, value: "6.9¢" }
    - { label: Draft contract price, value: "6¢" }

diagram:
  title: Where the dashboard hides what a resolution costs
  caption: >-
    Both figures start from the same spend. The dashboard divides it by every
    ticket, so each escalation makes a resolution look cheaper.
  direction: lr
  nodes:
    - { id: log, label: Run log, sub: one row per attempt, kind: store, tone: blue, at: [0, 1] }
    - { id: spend, label: Total spend, sub: every attempt whatever happened, kind: service, tone: orange, at: [1, 0] }
    - { id: resolved, label: Resolved tickets, sub: each ticket counted once, kind: guard, tone: green, at: [1, 1] }
    - { id: every, label: Every ticket, sub: resolved or escalated, kind: doc, tone: neutral, at: [1, 2] }
    - { id: real, label: 6.9¢ a resolution, sub: what the client buys, kind: output, tone: green, at: [2, 0] }
    - { id: dashboard, label: 4.5¢ a ticket, sub: the figure the price came from, kind: output, tone: pink, at: [2, 2] }
    - { id: price, label: Price per resolution, sub: 6¢ in the draft contract, kind: decision, tone: purple, at: [3, 1] }
  edges:
    - { from: log, to: spend, label: sum every attempt, step: 1 }
    - { from: log, to: resolved, label: outcome is resolved, step: 2 }
    - { from: log, to: every, label: every ticket id, tone: muted }
    - { from: spend, to: real, label: numerator }
    - { from: resolved, to: real, label: denominator, tone: success }
    - { from: spend, to: dashboard, label: numerator, tone: muted }
    - { from: every, to: dashboard, label: wrong denominator, tone: danger }
    - { from: dashboard, to: price, label: priced from this, tone: danger }
    - { from: real, to: price, label: price from this, tone: success }

approach:
  goal: A price per resolution that covers everything it took to get there
  branches:
    - label: What was paid for
      leaves: [every attempt in the log, escalations and timeouts included]
    - label: What the client buys
      detail: The contract pays for a resolved ticket, and nothing else in the log is the product.
      leaves: [tickets with a resolved attempt, each ticket counted once]
    - label: When nothing was bought
      leaves: [no resolutions means no price, report null instead of dividing]
    - label: Keep the arithmetic in code
      leaves: [the model asks for the log, your code does the sums]

coach:
  opening: >-
    Before you write a line, say what the client pays for. That is your
    denominator, and everything you paid to get it is your numerator.
  signals:
    - id: never-asks-if-resolved
      when: { code_lacks: '["'']resolved["'']' }
      say: >-
        Nothing in your code asks whether a ticket was resolved. What does the
        client pay for, and is that what you divide by?
    - id: spend-only-on-resolved
      when: { code_matches: 'sum\([^\n]*\bif\b[^\n]*resolved' }
      say: >-
        You add up only the attempts that resolved. The escalations and the
        timeouts were paid for too. Where does their cost go?
    - id: divides-by-attempts
      when: { code_matches: '/\s*len\(\s*(attempts|runs|rows|log|entries|records)\s*\)' }
      say: >-
        You divide by the number of attempts. A ticket that took two attempts
        is still one ticket. What should the denominator count?
    - id: escalated-case
      when: { test_failed: a_ticket_handed_to_a_person_is_paid_for_but_not_resolved }
      say: >-
        That week had tickets the agent escalated to a person. Trace one of
        them through your code: is it in the spend, and is it in the
        denominator?
    - id: nothing-resolved-case
      when: { test_failed: a_week_with_no_resolutions_has_no_price }
      say: >-
        Nothing was resolved that week. What does your code divide by, and
        what should the figure say?
    - id: resolved-twice-case
      when: { test_failed: a_ticket_resolved_twice_is_one_resolution }
      say: >-
        One ticket that week resolved on two attempts. How many resolutions
        did the client get from it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Do TODO 1 first and press Run. Once the spend matches, the rest is
        deciding what to divide it by.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints go from where to look to the shape
        of the fix, so open the first one.
  wrap_up: >-
    Unit economics break at the denominator. Price what the client buys, and
    charge it with everything you spent getting there, failures and retries
    included.

tests:
  - name: every_ticket_resolved_first_time
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What did a resolved ticket cost us in week 38?" }
      llm_script:
        - { match: "*", reply: "Action: run_log(week=38)" }
      tools:
        run_log:
          returns:
            status: 200
            week: 38
            attempts:
              - { ticket: T-5101, attempt: 1, outcome: resolved, cost_usd: 0.041 }
              - { ticket: T-5102, attempt: 1, outcome: resolved, cost_usd: 0.038 }
              - { ticket: T-5103, attempt: 1, outcome: resolved, cost_usd: 0.044 }
              - { ticket: T-5104, attempt: 1, outcome: resolved, cost_usd: 0.037 }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: run_log }
        - { type: valid_json_return,
            schema: { type: object,
                      required: [total_spend_usd, resolved_tickets, cost_per_resolved_ticket_usd] } }
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.160*(?![0-9])' }
        - { type: returns_matches, value: '"resolved_tickets":\s*4(?![0-9])' }
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*0\.040*(?![0-9])' }

  - name: a_retried_ticket_is_one_ticket_with_two_costs
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What did a resolved ticket cost us in week 39?" }
      llm_script:
        - { match: "*", reply: "Action: run_log(week=39)" }
      tools:
        run_log:
          returns:
            status: 200
            week: 39
            attempts:
              - { ticket: T-6201, attempt: 1, outcome: timeout, cost_usd: 0.030 }
              - { ticket: T-6201, attempt: 2, outcome: resolved, cost_usd: 0.045 }
              - { ticket: T-6202, attempt: 1, outcome: resolved, cost_usd: 0.040 }
              - { ticket: T-6203, attempt: 1, outcome: resolved, cost_usd: 0.035 }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object,
                      required: [total_spend_usd, resolved_tickets, cost_per_resolved_ticket_usd] } }
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.150*(?![0-9])' }
        - { type: returns_matches, value: '"resolved_tickets":\s*3(?![0-9])' }
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*0\.050*(?![0-9])' }

  - name: a_ticket_handed_to_a_person_is_paid_for_but_not_resolved
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What did a resolved ticket cost us in week 40?" }
      llm_script:
        - { match: "*", reply: "Action: run_log(week=40)" }
      tools:
        run_log:
          returns:
            status: 200
            week: 40
            attempts:
              - { ticket: T-7301, attempt: 1, outcome: resolved, cost_usd: 0.040 }
              - { ticket: T-7302, attempt: 1, outcome: escalated, cost_usd: 0.060 }
              - { ticket: T-7303, attempt: 1, outcome: timeout, cost_usd: 0.030 }
              - { ticket: T-7303, attempt: 2, outcome: escalated, cost_usd: 0.050 }
              - { ticket: T-7304, attempt: 1, outcome: resolved, cost_usd: 0.045 }
              - { ticket: T-7305, attempt: 1, outcome: resolved, cost_usd: 0.045 }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.270*(?![0-9])' }
        - { type: returns_matches, value: '"resolved_tickets":\s*3(?![0-9])' }
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*0\.090*(?![0-9])' }

  - name: a_week_with_no_resolutions_has_no_price
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What did a resolved ticket cost us in week 41?" }
      llm_script:
        - { match: "*", reply: "Action: run_log(week=41)" }
      tools:
        run_log:
          returns:
            status: 200
            week: 41
            attempts:
              - { ticket: T-8401, attempt: 1, outcome: escalated, cost_usd: 0.050 }
              - { ticket: T-8402, attempt: 1, outcome: timeout, cost_usd: 0.030 }
              - { ticket: T-8402, attempt: 2, outcome: timeout, cost_usd: 0.030 }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.110*(?![0-9])' }
        - { type: returns_matches, value: '"resolved_tickets":\s*0(?![0-9])' }
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*null' }

  - name: a_ticket_resolved_twice_is_one_resolution
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What did a resolved ticket cost us in week 42?" }
      llm_script:
        - { match: "*", reply: "Action: run_log(week=42)" }
      tools:
        run_log:
          returns:
            status: 200
            week: 42
            attempts:
              - { ticket: T-9501, attempt: 1, outcome: resolved, cost_usd: 0.040 }
              - { ticket: T-9501, attempt: 2, outcome: resolved, cost_usd: 0.040 }
              - { ticket: T-9502, attempt: 1, outcome: resolved, cost_usd: 0.050 }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"total_spend_usd":\s*0\.130*(?![0-9])' }
        - { type: returns_matches, value: '"resolved_tickets":\s*2(?![0-9])' }
        - { type: returns_matches, value: '"cost_per_resolved_ticket_usd":\s*0\.0650*(?![0-9])' }

reference_md: |
  The dashboard answered the question it was asked. "What does the agent cost
  per ticket it touches" is a fair number for a capacity plan. It went wrong
  when it priced a resolution, because the contract changed what the client
  buys and nobody changed the denominator.

  Cost per unit of value has one rule. The numerator is everything you paid,
  and the denominator is only what the customer pays for. Escalations and
  timeouts go in the first and never in the second. They are the reason a
  resolution costs more than a ticket, and a price that leaves them out is
  subsidised by every failure the agent has.

  A retry is the same mistake hiding inside one ticket. The ticket that
  resolved on its second attempt cost two attempts and is still one
  resolution. Count tickets rather than rows, or a duplicate resolution after a
  client-side timeout makes the figure look better at exactly the moment the
  system is behaving worse.

  A week with no resolutions has no price. Null is the honest figure. A
  dashboard that catches the `ZeroDivisionError` and prints 0 is telling the
  commercial lead the agent was free.

  The model asks for the log and does nothing else. Averages over forty rows
  are arithmetic, and arithmetic belongs in code a reviewer can read.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    What is the right denominator for model cost per successful task?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I025.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: run_log
    args: week
    returns: A status, the `week` and one `attempts` row per attempt, each with `ticket`, `attempt`, `outcome`
      and `cost_usd`.
example:
  case: a_retried_ticket_is_one_ticket_with_two_costs
  expect: Add every attempt's cost, the timeout included, to get 0.15, count three resolved tickets, and
    return JSON with a cost per resolved ticket of 0.05.
traps:
  - Adding up only the resolved attempts, which leaves escalations and timeouts out of a spend they were
    part of.
  - Dividing by every ticket or attempt, which counts escalated tickets the client never pays for.
  - Counting resolved rows, so a ticket resolved on two attempts counts as two resolutions.
  - Dividing by zero resolved tickets, which raises `ZeroDivisionError`, or reporting 0 where the figure
    should be null.
