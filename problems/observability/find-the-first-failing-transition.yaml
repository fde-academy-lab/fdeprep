slug: find-the-first-failing-transition
title: "Find the first broken step in a run"
day: 18
skill: Find the first broken step in a failed run's trace
artefact_type: code
difficulty: medium
track: observability
concept:
  topic: "Traces for debugging"
  question: "Where in this trace did the run first go wrong?"
est_minutes: 30
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: evaluation-design, weight: 0.5 }
  - { slug: agent-loop, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  An agent run failed. The trace is forty steps long and ends with a 500 from
  the payments API, in red, with a stack trace. The on-call engineer spent two
  hours with the payments team, who were not having an outage.

  Step six is where it broke. A lookup returned an empty result, the loop
  carried on with an empty order id, and everything after that was a
  well-formed request about nothing. The 500 at step thirty one is what an
  empty order id looks like by the time it reaches payments.

  Write the analyser that reads the trace the way the second engineer read it.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns `Action: trace()` until you ask for the summary. Ask
  with a prompt that carries a line starting `First broken step:`, and it
  returns one line an on-call engineer can read.

  `trace()` returns

      {"status": 200,
       "steps": [{"n": 1, "type": "tool_call", "tool": "lookup", "args": {"id": "A-1"}},
                 {"n": 2, "type": "observation", "value": {"order": "A-1"}},
                 {"n": 3, "type": "error", "message": "..."}]}

  and may return something else entirely.

  Walk the steps in order. A step is broken when any of these holds:

  | Kind | Test |
  |---|---|
  | `empty_observation` | an `observation` whose `value` is null, `{}`, `[]` or `""` |
  | `repeated_call` | a `tool_call` with the same tool and args as the two `tool_call` steps before it |
  | `error` | a step whose type is `error` |

  For `repeated_call`, report the first step of the repeated run rather than
  the one that completed it.

  Then ask the model for a one-line summary, giving it the first broken step
  and nothing after it. Return a JSON string with the keys `first_failure`,
  `kind`, `later_symptoms` and `note`.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  EMPTY = (None, {}, [], "")


  def broken_steps(steps: list) -> list:
      """Every broken step as a (step number, kind) pair, in trace order.

      Kinds are empty_observation, repeated_call and error, as the contract
      defines them. A repeated run is reported at its first call.
      """
      raise NotImplementedError


  def run_agent(question: str, llm, tools: dict) -> str:
      """Name the first broken step of a failed run and list the rest.

      llm(prompt) replies Action: trace() until a prompt carries a line that
      starts First broken step:, and then replies with one line for the
      on-call engineer.

      tools["trace"]() returns {"status": 200, "steps": [...]}, or something
      that is not a step list at all.

      Return json.dumps({"first_failure": <step number or None>,
                         "kind": <kind or None>,
                         "later_symptoms": [<step number>, ...],
                         "note": <the model's line>}).
      At most 3 model calls. Allowed imports: json, re.
      """
      return json.dumps({"first_failure": None, "kind": None,
                         "later_symptoms": [], "note": "not written yet"})

hints:
  - Walk forwards and stop. Every later match is a symptom, and symptoms are
    worth listing and not worth diagnosing.
  - Three identical calls in a row is a loop that has stopped learning
    anything, and the interesting step is the first one.
  - The model writes the summary. It does not decide which step is the cause,
    because you already know and it does not.
  - Walk the steps once, in order, collecting every broken step with its kind.
    The first is the cause and the rest are symptoms, and only the first goes
    into the model's prompt.
  - "Check the shape of what `trace()` returned before you walk it. A result with no step list still gets a report, with nothing in it."

scenario:
  headline: "An order agent fails and two hours go to the wrong team"
  who: The on-call engineer for an order agent that takes payments
  situation: >-
    A failed run's trace is forty steps long and ends in a red 500 from the
    payments API. The run broke at step six, where a lookup came back empty
    and the loop carried on.
  stakes: >-
    Two hours went to the payments team, who were not having an outage, while
    the empty order id kept producing well-formed requests about nothing.
  metrics:
    - { label: Steps in the trace, value: "40" }
    - { label: Where it got loud, value: step 31 }
    - { label: Hours with the wrong team, value: "2" }

diagram:
  title: Where the run broke, and where it got loud
  caption: >-
    The 500 is the first symptom loud enough to raise. Walk forwards from step
    one and stop at the first broken step.
  direction: lr
  nodes:
    - { id: lookup, label: "Step 5: lookup", sub: called with an empty id, kind: tool, tone: blue, at: [0, 0] }
    - { id: empty, label: "Step 6: observation", sub: "the value is {}", kind: output, tone: pink, at: [1, 0] }
    - { id: charge, label: "Step 30: charge", sub: a payment for no order, kind: tool, tone: neutral, at: [2, 0] }
    - { id: loud, label: "Step 31: error", sub: payments returned 500, kind: output, tone: orange, at: [3, 0] }
    - { id: analyser, label: Your analyser, sub: "walks forwards, stops at the first", kind: agent, tone: purple, at: [1, 1] }
    - { id: model, label: Model, sub: writes one line, kind: model, tone: teal, at: [2, 1] }
    - { id: report, label: Report, sub: "first failure, then symptoms", kind: output, tone: green, at: [3, 1] }
  edges:
    - { from: lookup, to: empty, label: returns nothing, step: 1 }
    - { from: empty, to: charge, label: the loop carries on, step: 2 }
    - { from: charge, to: loud, label: a request about nothing, step: 3 }
    - { from: analyser, to: empty, label: first match, tone: success }
    - { from: analyser, to: loud, label: reading from the end, tone: danger }
    - { from: analyser, to: model, label: step 6 and nothing after }
    - { from: model, to: report, label: one line }

approach:
  goal: Name the step that broke the run, and list what followed as symptoms
  branches:
    - label: Define broken before you look
      leaves: [an observation with nothing in it, three identical calls in a row, a step whose type is error]
    - label: Walk forwards and stop
      detail: A run carries its state forward, so everything after the first break is downstream of it.
      leaves: [the first match is the cause, later matches are symptoms, a loop is reported at its first call]
    - label: Keep the model on the sentence
      leaves: [your code picks the step, the model writes the line]
    - label: Expect a trace that is not a trace
      leaves: [check the shape before you walk it]

coach:
  opening: >-
    Decide what counts as broken before you read a single trace, then decide
    which direction you will walk it.
  signals:
    - id: no-observation-check
      when: { code_lacks: '["'']observation["'']' }
      say: >-
        Nothing in your analyser checks an observation yet. An observation with
        nothing in it never raises, and it is often where a run actually
        breaks.
    - id: no-repeat-check
      when: { code_lacks: '["'']tool_call["'']' }
      say: >-
        Nothing in your analyser reads tool calls yet. Three identical calls in
        a row never raise an error either, and they end the run all the same.
    - id: last-match
      when: { code_matches: '\[\s*-1\s*\]\s*(\.get\(\s*["'']n["'']|\[\s*["'']n["''])|reversed\(' }
      say: >-
        You report the last match. The last error is the loudest one, and in a
        run that carries its state forward it is usually a symptom.
    - id: hidden-quiet-cause
      when: { test_failed: the_loud_error_is_a_symptom_of_the_quiet_one }
      say: >-
        That run has a loud error near the end and a quiet failure much
        earlier. Which one does your walk reach first, and does it stop there?
    - id: hidden-repeat
      when: { test_failed: three_identical_calls_report_the_first_of_them }
      say: >-
        That run repeated one call. Your rule fires on the third copy. Which
        step number does the engineer need to read?
    - id: adversarial-not-a-trace
      when: { test_failed: adversarial_a_trace_that_is_not_a_trace }
      say: >-
        The trace service answered with something that is not a step list.
        What does your analyser return when there is nothing to walk?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Write the walk first: loop over the steps in order and print each
        type. Then add one kind of broken step at a time.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. Open the first hint: it narrows where to
        look and gives nothing away.
  wrap_up: >-
    A run carries its state forward, so one broken step produces well-formed
    requests about nothing until something loud fails. Walk forwards, stop at
    the first break, and list the rest as symptoms.

defence_question: |
  The trace ends in a 500 from payments and your analyser reports step six, an
  empty observation, as the cause. The payments team point out that an empty
  order id has been in traces for months without a 500, and ask how you know
  step six is the cause rather than a coincidence. What is your answer, and
  what would change your mind?

tests:
  - name: reports_a_single_error
    visibility: public
    spec:
      kind: agent_run
      input: { question: "run-1" }
      llm_script:
        - { match: { contains: "First broken step" }, reply: "The lookup tool errored at step 3." }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            steps:
              - { n: 1, type: "tool_call", tool: "lookup", args: { id: "A-1" } }
              - { n: 2, type: "observation", value: { order: "A-1" } }
              - { n: 3, type: "error", message: "lookup timed out" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [first_failure, kind, later_symptoms, note] } }
        - { type: returns_matches, value: "\"first_failure\": 3" }
        - { type: returns_matches, value: "\"kind\": \"error\"" }

  - name: a_clean_run_has_no_first_failure
    visibility: public
    spec:
      kind: agent_run
      input: { question: "run-2" }
      llm_script:
        - { match: { contains: "First broken step" }, reply: "Nothing broke in this run." }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            steps:
              - { n: 1, type: "tool_call", tool: "lookup", args: { id: "A-1" } }
              - { n: 2, type: "observation", value: { order: "A-1" } }
              - { n: 3, type: "tool_call", tool: "ship", args: { id: "A-1" } }
              - { n: 4, type: "observation", value: { booking: "CB-9" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [first_failure, kind, later_symptoms, note] } }
        - { type: returns_matches, value: "\"first_failure\": null" }
        - { type: terminates }

  - name: the_loud_error_is_a_symptom_of_the_quiet_one
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "run-3" }
      llm_script:
        - { match: { contains: "First broken step" },
            reply: "A lookup returned nothing at step 6 and the run continued on an empty id." }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            steps:
              - { n: 1, type: "tool_call", tool: "lookup", args: { id: "A-1" } }
              - { n: 2, type: "observation", value: { order: "A-1" } }
              - { n: 5, type: "tool_call", tool: "lookup", args: { id: "" } }
              - { n: 6, type: "observation", value: {} }
              - { n: 30, type: "tool_call", tool: "charge", args: { order: "" } }
              - { n: 31, type: "error", message: "payments returned 500" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"first_failure\": 6" }
        - { type: returns_matches, value: "\"kind\": \"empty_observation\"" }
        - { type: returns_matches, value: "31" }

  - name: three_identical_calls_report_the_first_of_them
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "run-4" }
      llm_script:
        - { match: { contains: "First broken step" },
            reply: "The loop repeated the same lookup from step 10 onwards." }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            steps:
              - { n: 9, type: "observation", value: { order: "A-2" } }
              - { n: 10, type: "tool_call", tool: "lookup", args: { id: "A-2" } }
              - { n: 11, type: "tool_call", tool: "lookup", args: { id: "A-2" } }
              - { n: 12, type: "tool_call", tool: "lookup", args: { id: "A-2" } }
              - { n: 13, type: "error", message: "step budget exhausted" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"first_failure\": 10" }
        - { type: returns_matches, value: "\"kind\": \"repeated_call\"" }
        - { type: no_exception }

  - name: adversarial_a_trace_that_is_not_a_trace
    visibility: adversarial
    fixture: unicode_payload
    annotation_md: |
      The trace service answered with a text blob instead of a step list, with
      an emoji, a right-to-left mark and a zero-width space in it. There is no
      `steps` key at all.

      An analyser that reaches straight for `result["steps"]` raises, and the
      incident that was already hard to read now has a second incident sitting
      on top of it. Returning a well-formed report that says nothing was
      analysable is more useful at three in the morning than a stack trace.
    spec:
      kind: agent_run
      input: { question: "run-5" }
      llm_script:
        - { match: { contains: "First broken step" }, reply: "The trace could not be read." }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace: { fixture: unicode_payload }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: terminates }
        - { type: valid_json_return,
            schema: { type: object, required: [first_failure, kind, later_symptoms, note] } }
        - { type: calls_tool, name: trace }
        - { type: returns_matches, value: '"first_failure":\s*null' }
        - { type: returns_matches, value: '"later_symptoms":\s*\[\]' }

reference_md: |
  Walk forwards, stop at the first match, and list the rest without
  diagnosing them.

  The reason this beats reading the end of the trace is not that the end is
  uninformative. It is that an agent run propagates state, so a broken step
  produces well-formed requests about nothing for as long as the budget
  allows, and the last error is the first one loud enough to raise. Reading
  backwards from the loudest signal is how two hours go to the payments team.

  Reporting the first step of a repeated run rather than the third is a
  usability decision with teeth. The third call is where your rule fired; the
  first is where the loop stopped learning anything, and it is the step whose
  observation an engineer needs to read.

  Which half the model does is the same split as every other problem in this
  track. Finding the step is a walk over a list and it is exact. Writing the
  sentence an engineer reads at three in the morning is language, and the
  model is better at it than a format string. Handing the model the whole
  trace and asking which step broke gets you an answer that agrees with
  whichever step had the scariest message.

  The unreadable trace is an ordinary Tuesday. Services change
  shape mid-incident precisely because somebody is deploying a fix.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    A run failed and three steps logged errors. Which one broke it, and how did you decide that from the trace?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: trace
    args: ''
    returns: A status and the run's `steps`, each with an `n`, a `type` and that type's fields. It may
      return something else entirely.
example:
  case: reports_a_single_error
  expect: Walk the steps in order, find the first broken one, the error at step 3, ask the model for its
    summary with a First broken step line, and return JSON with `first_failure` 3 and `kind` error.
traps:
  - Reporting the last or loudest error, which is usually a symptom of a quiet break earlier in the run.
  - Checking only for error steps, which misses an observation that came back empty and let the run carry
    on with nothing.
  - Reporting three identical calls at the third copy, where the rule fired, when the engineer needs the
    first call of the run.
  - Indexing into a reply that has no step list, which raises, where the report should come back with
    nothing in it.
