reference_md: |
  Each number on a dashboard answers a question, and both of these were
  answering a different one from the contract's.

  Latency in the contract is how long a customer waited. Adding the call
  durations up answers a different question, how much work was done, and
  the two agree only while calls run one after another. The assistant runs
  its three lookups at the same time, so the sum counts the same seconds two
  or three times, and a claim the customer waited six seconds for reads as
  nine. The time from the earliest start to the latest end is the wait. The
  trace store lists events in the order they ended, which is the order
  OpenTelemetry's span processors hand finished spans to an exporter, so the
  first event's start is not always the earliest start either.

  Cost in the contract is what the insurer is billed, which is every billed
  line: model tokens at that model's own input and output rates, per
  million, and the photo service's fee on every call. A dashboard that
  prices tokens only is measuring the model bill, which is a smaller number
  than the client's.

  A model missing from the rate card is the case that decides whether the
  report can be trusted. A rate you do not have is not zero. Priced at zero,
  the fallback runs look free, they drag the median cost down, and they can
  never trip the budget, so the report hides exactly the runs the client
  would ask about. Null with the run listed under `unpriced` says what is
  true: these runs happened, and nobody has priced them yet.

  Nearest rank is one of several percentile definitions, and the contract
  names it so two people computing a p95 from the same runs agree. Python's
  `statistics.quantiles` interpolates between values by default, which
  gives a different p95 on a small day. With a handful of runs a p95 is
  close to the maximum, so the report gives the per-run rows as well, and
  the conversation with procurement starts from those.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    How do you compute the latency and cost of an agent run from its trace, when some of its calls run in parallel?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: runs
    args: day
    returns: The day's `runs`, each with its `events` listed in the order they ended. An event is a model
      call with tokens or a tool call, each with `start_ms` and `end_ms`.
  - name: rate_card
    args: ''
    returns: The contract's `models` with rates per million tokens, the per-call fees in `tools`, and the
      `budget` for cost and latency.
example:
  case: prices_and_times_four_claims
  expect: Price CL-5101 at 0.01286 and time it at 3400 ms, take p50 and p95 by nearest rank across the
    four runs, and list CL-5102 and CL-5104 as over budget.
traps:
  - Adding up call durations, which counts the same seconds twice once calls run at the same time.
  - Pricing a model the rate card does not list at zero, so its runs look free and drop out of every check.
  - Leaving per-call service fees out of a run's cost because only tokens are priced.
