slug: record-a-redacted-timeline
title: "Log every step without logging secrets"
day: 17
skill: Keep every step on the timeline and every secret off it
artefact_type: code
difficulty: medium
track: observability
concept:
  topic: "Trace every step"
  question: "How do you log every step without logging a secret?"
est_minutes: 30
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
  - { slug: tool-error-handling, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  An order-support agent for an online retailer failed at 2:10 one morning.
  The on-call engineer opened the trace and found three steps. The fourth, a
  call to the carrier's API that never returned, was missing, because the
  recorder writes a step when it ends and that one never ended.

  The three steps that were there held a customer's email address, a full card
  number, and a bearer token for the billing API, quoted back inside a 401
  error. The week before, one error message carried a 41 KB HTML error page
  and made its trace too large to open. The trace store is readable by 62
  people, two of them at vendors.

  Write the recorder. Every step goes on the timeline with its duration and
  status, including a step that never finished. Nothing a customer or an
  attacker would care about goes on it at all.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `run_events()` returns what the agent runtime emitted for one run, in the
  order it was emitted:

      {"status": 200, "run_id": "run-7c21",
       "events": [
         {"span": "s1", "type": "start", "name": "model", "at_ms": 0,
          "detail": "plan the reply to ticket 4471"},
         {"span": "s1", "type": "end", "at_ms": 820, "status": "ok"}]}

  Every span has a `start` event. An `end` event carries `status` (`ok` or
  `error`) and may carry a `detail`. A span whose run was killed has no end
  event at all.

  Build one step per span, ordered by start time:

      {"n": 1, "span": "s1", "name": "model", "ms": 820, "status": "ok",
       "detail": "..."}

  - `ms` is the end's `at_ms` minus the start's. A span with no end gets
    `"ms": null` and `"status": "unfinished"`.
  - `detail` is the start's detail, followed by ` -> ` and the end's detail
    when the end has one.
  - Mask every detail. An email address becomes `[email]`. A card number, 13
    to 19 digits with spaces or dashes allowed between them, becomes
    `[card]`. The token after `Bearer ` and the value after `api_key=` each
    become `[secret]`.
  - After masking, a detail longer than 160 characters keeps its first 157
    and ends with `...`.

  The run's `outcome` is `unfinished` if any step is, otherwise `failed` if
  any step has status `error`, otherwise `succeeded`.

  Then call `llm` once for a one-line summary for the incident channel, giving
  it the steps you built and nothing from the raw events.

  Return a JSON string with `run_id`, `outcome`, `steps` and `summary`.

  Budget: at most 2 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  LIMIT = 160


  def mask(text: str) -> str:
      # TODO 1: replace each kind of customer data and credential the
      #         contract lists with its placeholder
      return text


  def run_agent(question: str, llm, tools: dict) -> str:
      data = tools["run_events"]()
      starts, ends = {}, {}
      for event in data.get("events") or []:
          if event.get("type") == "start":
              starts[event["span"]] = event
          elif event.get("type") == "end":
              ends[event["span"]] = event

      steps = []
      for n, start in enumerate(sorted(starts.values(), key=lambda e: e["at_ms"]), 1):
          end = ends[start["span"]]
          # TODO 2: a span with no end event is still a step. Give it no
          #         duration and the status the contract names.
          detail = start.get("detail", "")
          # TODO 3: add the end's detail, mask the whole detail, then keep it
          #         within LIMIT characters
          steps.append({"n": n, "span": start["span"], "name": start.get("name"),
                        "ms": end["at_ms"] - start["at_ms"],
                        "status": end.get("status"), "detail": detail})

      # TODO 4: work out the run's outcome, then ask the model for a one-line
      #         summary of the steps you built
      outcome = "succeeded"
      summary = ""

      return json.dumps({"run_id": data.get("run_id"), "outcome": outcome,
                         "steps": steps, "summary": summary})

steps:
  - id: s1
    text: Mask emails, card numbers and both kinds of credential in a detail.
    check_id: s1
  - id: s2
    text: Keep a span that never ended, with no duration and its own status.
    check_id: s2
  - id: s3
    text: Join the end's detail on, mask it, then cut it to length.
    check_id: s3
  - id: s4
    text: Set the run's outcome and ask the model to summarise your masked steps.
    check_id: s4

step_checks:
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: '\[email\]' }
  # Every span in the public cases ends, so s2 carries its own case: the
  # refund call starts and never ends, while a call started after it does.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "run-8c30" }
      llm_script:
        - { match: "*", reply: "The refund call never returned and the run was stopped." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-8c30
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "plan the reply to ticket 9107" }
              - { span: s1, type: end, at_ms: 540, status: ok }
              - { span: s2, type: start, name: refund_api, at_ms: 550, detail: "refund for order 31-2208" }
              - { span: s3, type: start, name: email_api, at_ms: 560, detail: "confirmation for order 31-2208" }
              - { span: s3, type: end, at_ms: 830, status: ok }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 5000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"ms":\s*null' }
        - { type: returns_matches, value: '"status":\s*"unfinished"' }
  # No public detail is longer than 160 characters, so s3 carries its own
  # case. Joined, the detail is 277 characters, and position 157 falls inside
  # the email address. Cut first and half the address is left behind, where
  # no pattern recognises it.
  - step_id: s3
    spec:
      kind: agent_run
      input: { question: "run-8c17" }
      llm_script:
        - { match: "*", reply: "The returns service refused a second label and the run failed." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-8c17
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "plan the reply to ticket 9043" }
              - { span: s1, type: end, at_ms: 580, status: ok }
              - { span: s2, type: start, name: returns_api, at_ms: 590, detail: "label for return 55-102" }
              - span: s2
                type: end
                at_ms: 1840
                status: error
                detail: >-
                  409 from returns service: a label was issued on 3 September, so a second
                  one was refused. The first label went to sam.okafor@example.net and can be
                  sent again from the returns console. Request r-88f1 was retried twice and
                  then dropped. RETRY_LOG_88F1
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 5000 }
      assertions:
        - { type: valid_json_return }
        - { type: returns_matches, value: 'label for return 55-102 -> 409 from returns service' }
        - { type: returns_matches, value: '\[email\]' }
        - { type: returns_lacks, value: 'sam\.okafor' }
        - { type: returns_lacks, value: 'RETRY_LOG_88F1' }
        - { type: returns_matches, value: '\.\.\."' }
  - step_id: s4
    spec:
      assertions:
        - { type: returns_matches, value: '"summary":\s*"[^"]+' }

hints:
  - Look at what the recorder does with a span that has a start and no end.
  - Error messages quote the failed request back, and the failed request
    carried its credentials.
  - Mask first and cut second. A cut through the middle of an email address
    leaves text that no pattern recognises.
  - Build steps from the start events and look each end up with a default, so
    a missing end becomes a status instead of an exception.
  - Build the summary prompt from your masked steps. Anything the model reads
    can come back in its reply.

scenario:
  headline: "A trace leaves out the stuck step and exposes a card number"
  who: The on-call engineers for an online retailer's order-support agent
  situation: >-
    A run failed at 2:10 one morning. The trace showed three steps. The
    fourth, a carrier call that never returned, was missing, because steps are
    written when they end.
  stakes: >-
    The steps that were there held an email address, a card number and a live
    billing token. The trace store is readable by 62 people, two of them at
    vendors.
  metrics:
    - { label: People who can read traces, value: "62" }
    - { label: Steps on the failed trace, value: 3 of 4 }
    - { label: Largest error message, value: 41 KB }

diagram:
  title: Where a trace loses a step and keeps a secret
  caption: >-
    Steps written when they end lose the one that hung, and details stored as
    they arrive carry whatever the error quoted back.
  direction: lr
  nodes:
    - { id: runtime, label: Agent runtime, sub: emits start and end events, kind: agent, tone: purple, at: [0, 1] }
    - { id: hung, label: Carrier call, sub: started and never ended, kind: tool, tone: pink, at: [0, 2] }
    - { id: recorder, label: Recorder, sub: one step per span, kind: service, tone: blue, at: [1, 1] }
    - { id: mask, label: Mask then cut, sub: masks first then cuts to 160, kind: guard, tone: green, at: [2, 0] }
    - { id: model, label: Summary model, sub: reads only masked steps, kind: model, tone: teal, at: [3, 0] }
    - { id: store, label: Trace store, sub: read by 62 people, kind: store, tone: orange, at: [3, 1] }
  edges:
    - { from: runtime, to: recorder, label: events, step: 1 }
    - { from: hung, to: recorder, label: no end event, tone: danger }
    - { from: recorder, to: mask, label: every detail, step: 2 }
    - { from: mask, to: store, label: masked timeline, tone: success, step: 3 }
    - { from: mask, to: model, label: masked steps only, tone: success }
    - { from: recorder, to: store, label: a raw error with a token, tone: danger }

approach:
  goal: A timeline that shows every step and holds no customer data or credentials
  branches:
    - label: Every step
      leaves: [one step per started span, ordered by start time, a missing end marks where it stopped]
    - label: Mask before you store
      detail: Error messages carry credentials because a failed request gets quoted back.
      leaves: [emails and card numbers, bearer tokens and api keys]
    - label: Cut after you mask
      leaves: [a cut made first can strand half an email, 160 characters at most]
    - label: The model reads masked steps
      leaves: [anything in a prompt can come back out]

coach:
  opening: >-
    Read the contract's masking rules, then find the line where a step is
    built. Everything this problem is about happens on its way into that step.
  signals:
    - id: no-credential-mask
      when: { code_lacks: '(?i)bearer|api_key' }
      say: >-
        Your masking never looks for a credential. Where would a bearer token
        or an api key appear in a step, and what happens to it now?
    - id: no-unfinished-status
      when: { code_lacks: '["'']unfinished["'']' }
      say: >-
        Nothing in your code produces the unfinished status. What does your
        loop do with a span that started and never ended?
    - id: no-cut
      when: { code_lacks: '\[\s*\d*\s*:\s*[^\]]+\]' }
      say: >-
        Nothing cuts a detail to length yet. How long is the longest error
        message your recorder could store?
    - id: credential-case
      when: { test_failed: a_credential_inside_an_error_message_is_masked }
      say: >-
        The errors in that case quoted credentials back. Check your steps and
        your summary: does either still hold one?
    - id: unfinished-case
      when: { test_failed: a_step_that_never_ended_is_still_on_the_timeline }
      say: >-
        One span in that case started and never ended. Is it on your timeline,
        and what does your outcome say?
    - id: page-case
      when: { test_failed: a_long_error_page_is_masked_then_cut_to_size }
      say: >-
        That error carried a whole HTML page with a customer detail near the
        start. Which comes first in your code, the mask or the cut?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 2: look the end up with a default so a missing end
        cannot raise. Then press Run.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints start with the span that never
        ended, which is the step most recorders lose.
  wrap_up: >-
    A trace is read by more people than the system it describes. Record every
    step including the one that hung, mask before you store, cut after you
    mask, and let the model see only what you would post in the channel.

tests:
  - name: a_clean_run_becomes_ordered_timed_steps
    visibility: public
    spec:
      kind: agent_run
      input: { question: "run-7c21" }
      llm_script:
        - { match: "*", reply: "Four steps in 2.1 seconds, all ok." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-7c21
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "plan the reply to ticket 4471" }
              - { span: s1, type: end, at_ms: 820, status: ok }
              - { span: s2, type: start, name: lookup_order, at_ms: 830, detail: "order 88-1204" }
              - { span: s3, type: start, name: lookup_tracking, at_ms: 840, detail: "parcel JD014600" }
              - { span: s3, type: end, at_ms: 1100, status: ok }
              - { span: s2, type: end, at_ms: 1400, status: ok }
              - { span: s4, type: start, name: model, at_ms: 1410, detail: "write the reply" }
              - { span: s4, type: end, at_ms: 2100, status: ok }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: run_events }
        - { type: valid_json_return,
            schema: { type: object, required: [run_id, outcome, steps, summary] } }
        - { type: returns_matches, value: '"outcome":\s*"succeeded"' }
        - { type: returns_matches, value: '"ms":\s*820[\s\S]*"ms":\s*570[\s\S]*"ms":\s*260[\s\S]*"ms":\s*690' }
        - { type: returns_matches, value: '"summary":\s*"Four steps' }

  - name: customer_details_are_masked_in_every_step
    visibility: public
    spec:
      kind: agent_run
      input: { question: "run-7c40" }
      llm_script:
        - { match: { contains: "jo.bloggs@example.com" },
            reply: "Checked the double charge for jo.bloggs@example.com and replied." }
        - { match: { contains: "4111" },
            reply: "Card 4111 1111 1111 1111 was charged twice and a refund is pending." }
        - { match: "*", reply: "Checked a double charge, found a pending refund and replied." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-7c40
            events:
              - { span: s1, type: start, name: model, at_ms: 0,
                  detail: "customer jo.bloggs@example.com asks why card 4111 1111 1111 1111 was charged twice" }
              - { span: s1, type: end, at_ms: 900, status: ok }
              - { span: s2, type: start, name: refund_lookup, at_ms: 910, detail: "email=jo.bloggs@example.com" }
              - { span: s2, type: end, at_ms: 1300, status: ok,
                  detail: "one refund pending for card 4111-1111-1111-1111" }
              - { span: s3, type: start, name: model, at_ms: 1310, detail: "write the reply" }
              - { span: s3, type: end, at_ms: 1900, status: ok }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [run_id, outcome, steps, summary] } }
        - { type: returns_lacks, value: 'jo\.bloggs' }
        - { type: returns_lacks, value: '4111[ -]?1111' }
        - { type: returns_matches, value: '\[email\]' }
        - { type: returns_matches, value: '\[card\]' }

  - name: a_credential_inside_an_error_message_is_masked
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "run-7d02" }
      llm_script:
        - { match: { contains: "tok_live_91f2c7a0b4e6" },
            reply: "Billing refused Bearer tok_live_91f2c7a0b4e6 with a 401." }
        - { match: { contains: "ak_prod_55d0e2f7" },
            reply: "Payments refused api_key=ak_prod_55d0e2f7 with a 403." }
        - { match: "*", reply: "Billing refused the token with a 401, then payments refused the key with a 403." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-7d02
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "look up the account for ticket 5120" }
              - { span: s1, type: end, at_ms: 700, status: ok }
              - { span: s2, type: start, name: billing_api, at_ms: 710, detail: "account 5120" }
              - { span: s2, type: end, at_ms: 1180, status: error,
                  detail: "401 from billing: the request carried Authorization: Bearer tok_live_91f2c7a0b4e6 and was refused" }
              - { span: s3, type: start, name: payments_api, at_ms: 1190, detail: "account 5120" }
              - { span: s3, type: end, at_ms: 1400, status: error,
                  detail: "403 from payments: api_key=ak_prod_55d0e2f7 is not enabled for refunds" }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: returns_lacks, value: 'tok_live_91f2c7a0b4e6' }
        - { type: returns_lacks, value: 'ak_prod_55d0e2f7' }
        - { type: returns_matches, value: 'Bearer \[secret\]' }
        - { type: returns_matches, value: 'api_key=\[secret\]' }
        - { type: returns_matches, value: '"outcome":\s*"failed"' }

  - name: a_step_that_never_ended_is_still_on_the_timeline
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "run-7d19" }
      llm_script:
        - { match: "*", reply: "The carrier call never returned and the run was stopped." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-7d19
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "plan the reply to ticket 6022" }
              - { span: s1, type: end, at_ms: 750, status: ok }
              - { span: s2, type: start, name: lookup_order, at_ms: 760, detail: "order 44-7781" }
              - { span: s2, type: end, at_ms: 1020, status: ok }
              - { span: s3, type: start, name: carrier_api, at_ms: 1030, detail: "parcel JD099120" }
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"outcome":\s*"unfinished"' }
        - { type: returns_matches, value: '"span":\s*"s3"' }
        - { type: returns_matches, value: '"ms":\s*null' }
        - { type: returns_matches, value: '"status":\s*"unfinished"' }

  - name: a_long_error_page_is_masked_then_cut_to_size
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "run-7d33" }
      llm_script:
        - { match: "*", reply: "The stock service returned a 502 after 5 seconds and the run failed." }
      tools:
        run_events:
          returns:
            status: 200
            run_id: run-7d33
            events:
              - { span: s1, type: start, name: model, at_ms: 0, detail: "plan the reply to ticket 7310" }
              - { span: s1, type: end, at_ms: 640, status: ok }
              - { span: s2, type: start, name: stock_api, at_ms: 650, detail: "sku 55-210" }
              - span: s2
                type: end
                at_ms: 5650
                status: error
                detail: >-
                  502 from stock service while reserving sku 55-210, quantity 2, for
                  delivery on Thursday between 08:00 and 10:00, for the customer
                  jo.bloggs@example.com: <html><head><title>502 Bad
                  Gateway</title></head><body><h1>Bad Gateway</h1><p>The proxy server
                  received an invalid response from an upstream server while handling GET
                  /v2/stock/55-210.</p><p>Request 7f3a2c was routed through edge node lon-04
                  at 03:12:44 UTC and retried twice before the proxy gave
                  up.</p><hr><address>Gateway at stock.internal port 443</address><p>If this
                  problem persists, contact the platform team with the request reference
                  above.</p>END_OF_PAGE</body></html>
      budget: { max_llm_calls: 2, max_tool_calls: 3, wall_ms: 10000 }
      assertions:
        - { type: returns_lacks, value: 'END_OF_PAGE' }
        - { type: returns_lacks, value: 'jo\.bloggs' }
        - { type: returns_matches, value: '\.\.\."' }
        - { type: returns_matches, value: '"ms":\s*5000' }
        - { type: returns_matches, value: '"outcome":\s*"failed"' }

reference_md: |
  A trace is written for one reader, the engineer at 2am, and read by everyone
  with access to the trace store, which is always more people than have access
  to the customer database. So the timeline has two jobs that pull against each
  other. It has to show every step, and it has to show nothing a customer or an
  attacker would care about.

  Every step includes the steps that never finished. A recorder that writes a
  step when it ends loses the step that hung, which was the only one the
  engineer needed: the other three were fine. Build steps from the start
  events and look each end up, with a missing end as a status of its own, and
  the place the run stopped stays on the page.

  Masking covers every detail, and error messages most of all, because a
  client library that fails an authenticated request quotes the request back,
  headers included. Mask first and cut second. A cut made first can leave half
  an email address or half a card number behind, and no pattern recognises
  half of one.

  The model writes the summary from the masked steps. Anything in its prompt
  can come back in its reply, and a summary posted to the incident channel
  travels further than the trace ever does.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    What goes into an agent's execution trace, and how do you keep customer data and secrets out of it?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: run_events
    args: ''
    returns: 'A status, the `run_id` and the runtime''s `events` in emitted order: a `start` for every
      span, and an `end` with a `status` unless the run was killed.'
example:
  case: customer_details_are_masked_in_every_step
  expect: Mask the email address and both writings of the card number in every detail, give the model
    only the masked steps, and return JSON that shows [email] and [card] and neither original value.
traps:
  - Masking customer data and leaving credentials, so a bearer token or `api_key` quoted in an error message
    reaches the timeline.
  - Losing a span that never ended, or reporting the run as succeeded or failed while one of its steps
    is unfinished.
  - Cutting a detail to 160 characters before masking it, which can leave half an email address that no
    pattern recognises.
