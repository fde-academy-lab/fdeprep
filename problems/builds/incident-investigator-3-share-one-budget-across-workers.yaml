            reply: "No definitive cause yet. Every trace shows checkout requests timing out on payments-api, and the allowance ran out with two traces not run." }
        - { match: "*", reply: "No cause found yet." }
      tools:
        dispatch: { returns: { status: 202, accepted: true } }
        collect:
          returns:
            status: 200
            results:
              - { job: "INC-8141/deploys/checkout-api", verdict: clear, finding: "no deploys to checkout-api in the last two hours", next: [] }
              - job: "INC-8141/logs/checkout-api"
                verdict: lead
                finding: "40 checkout requests failed in five minutes"
                next:
                  - { check: trace, args: { request: "r-9901" } }
                  - { check: trace, args: { request: "r-9902" } }
                  - { check: trace, args: { request: "r-9903" } }
                  - { check: trace, args: { request: "r-9904" } }
