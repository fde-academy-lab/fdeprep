          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the tracing backend timed out on the trace lookup" }
        diff: { returns: { status: 200, verdict: definitive, finding: "d-5520 cut the database connection pool from 50 to 5", next: [] } }
