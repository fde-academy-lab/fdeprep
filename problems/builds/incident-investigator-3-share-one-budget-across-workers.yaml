        - { type: returns_matches, value: '(?i)roll it back' }

reference_md: |
  The allowance was working. Four calls were spent and no more, which is
  exactly what a remaining-balance check guarantees and all it guarantees. It
  limits the total and says nothing about who spends it, so the first lead in
  the queue took every call. The log worker asking for forty traces was not
  misbehaving; it had forty failing requests and it happened to be first.

  Fairness is an order of service. Each lead keeps its own queue, and the
  leads take turns, one follow-up per turn. A lead waiting for its first
  follow-up always goes before a lead asking for its fifth, so the diff that
  names the cause runs in the first round whatever the length of the trace
  queue, and the stop from stage 1 ends the run there. The allowance is still
  checked before every call, and whatever is left in the queues when it runs
  out is written into the evidence, so the finding can say what was not
  looked at.

  A follow-up that raises is the same failure arriving by another route. If
  the exception escapes, one worker's broken tool takes every other lead's
  turn with it, along with the whole investigation. Catching it at the call,
  spending the allowance, and writing a line keeps that worker's failure
  local, which is the property the scheduler exists to provide.

  Equal turns is a choice, and the defence question asks you to argue it. It
  does not assume every lead is equally likely to pay off. It assumes the
  investigation does not know in advance which lead will, which on the night
  it matters is true.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Several workers share one call budget. Why is checking the remaining balance before each call not enough to stop one worker starving the rest?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I027.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: dispatch
    args: job, check, service
    returns: '`status` 202 with `accepted` true. The check runs on a worker, and its result arrives later
      through `collect`.'
  - name: collect
    args: ''
    returns: '`status` 200 and `results` in finishing order, each a check result with its `job` id. Other
      investigations share the queue, and a job may post nothing.'
  - name: diff
    args: deploy
    returns: What one deploy changed, called with the `deploy` id a lead names in `next`. It returns a
      `verdict`, a one-line `finding` and `next`.
  - name: trace
    args: request
    returns: A trace of one failed request, named in a lead's `next`. It returns a `verdict`, a one-line
      `finding` and `next`, and it can raise.
example:
  case: follow_ups_stop_when_the_allowance_is_spent
  expect: Spend the allowance of four on the lead's first four traces, add a line that its other 2 follow-ups
    were not run, and return the model's finding that the allowance ran out.
traps:
  - Draining one lead's queue before the next lead gets a call, so a lead with many traces spends the
    allowance another lead needed.
  - Changing the matching or the definitive stop while adding turns, so another investigation's result
    counts or leads run after the cause is found.
  - Letting a follow-up that raises escape, when it should spend its call, be recorded as failed and pass
    the turn to the next lead.
