              - { job: "INC-8144/metrics/checkout-api", verdict: clear, finding: "checkout-api CPU and memory normal", next: [] }
              - { job: "INC-8144/deploys/payments-api", verdict: lead, finding: "payments-api deploy d-5520 at 00:55", next: [{ check: diff, args: { deploy: "d-5520" } }] }
              - { job: "INC-8144/logs/payments-api", verdict: lead, finding: "connection timeouts to the payments database", next: [] }
              - { job: "INC-8144/metrics/payments-api", verdict: clear, finding: "payments-api CPU and memory normal", next: [] }
