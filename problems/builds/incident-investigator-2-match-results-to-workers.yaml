              - { job: "INC-8131/logs/payments-api", verdict: definitive, finding: "the payments database connection pool has been exhausted since 02:21", next: [] }
              - { job: "INC-8131/metrics/checkout-api", verdict: clear, finding: "checkout-api CPU and memory normal", next: [] }
              - { job: "INC-8131/deploys/payments-api", verdict: clear, finding: "no deploys to payments-api in the last two hours", next: [] }
              - { job: "INC-8131/logs/checkout-api", verdict: lead, finding: "checkout requests waiting on payments-api since 02:21", next: [] }
