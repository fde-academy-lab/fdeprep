  - name: a_worker_that_never_reports_is_named_in_the_finding
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"incident": "INC-8134", "services": ["checkout-api", "payments-api"]}' }
      llm_script:
        - { match: { regex: '(?i)metrics\W+payments-api\W+(?:no result|no report|missing|did not report|not reported)' },
            reply: "No cause found yet. The payments-api metrics check never reported, so payments-api is still unchecked." }
        - { match: "*", reply: "No cause found. Every check came back clear." }
      tools:
