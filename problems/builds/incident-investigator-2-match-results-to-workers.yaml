            results:
              - { job: "INC-8134/deploys/checkout-api", verdict: clear, finding: "no deploys to checkout-api in the last two hours", next: [] }
              - { job: "INC-8134/logs/payments-api", verdict: clear, finding: "no errors above the background rate", next: [] }
              - { job: "INC-8134/logs/checkout-api", verdict: clear, finding: "error lines match the usual background rate", next: [] }
              - { job: "INC-8134/deploys/payments-api", verdict: clear, finding: "no deploys to payments-api in the last two hours", next: [] }
              - { job: "INC-8134/metrics/checkout-api", verdict: clear, finding: "checkout-api CPU and memory normal", next: [] }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '(?i)unchecked' }
        - { type: no_exception }

  - name: a_lead_is_still_followed_up_after_the_fan_out
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"incident": "INC-8135", "services": ["checkout-api", "payments-api"]}' }
      llm_script:
        - { match: { contains: "from 50 to 5" },
            reply: "Deploy d-5520 cut payments-api's database connection pool from 50 to 5. Roll it back." }
        - { match: "*", reply: "No cause found yet." }
      tools:
        dispatch: { returns: { status: 202, accepted: true } }
        collect:
          returns:
            status: 200
            results:
              - { job: "INC-8135/deploys/checkout-api", verdict: clear, finding: "no deploys to checkout-api in the last two hours", next: [] }
              - { job: "INC-8135/logs/checkout-api", verdict: lead, finding: "checkout requests timing out on payments-api", next: [] }
              - { job: "INC-8135/metrics/checkout-api", verdict: clear, finding: "checkout-api CPU and memory normal", next: [] }
              - { job: "INC-8135/deploys/payments-api", verdict: lead, finding: "payments-api deploy d-5520 at 00:55", next: [{ check: diff, args: { deploy: "d-5520" } }] }
              - { job: "INC-8135/logs/payments-api", verdict: lead, finding: "connection timeouts to the payments database", next: [] }
              - { job: "INC-8135/metrics/payments-api", verdict: clear, finding: "payments-api CPU and memory normal", next: [] }
        diff: { returns: { status: 200, verdict: definitive, finding: "d-5520 cut the database connection pool from 50 to 5", next: [] } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: diff }
        - { type: returns_matches, value: '(?i)roll it back' }

reference_md: |
  The stage 1 code paired each result with the check that produced it
  without ever saying so, because the result came back from the call.
  Moving the checks onto workers removed that guarantee and left the
  assumption in place. A list in finishing order, paired with a list in
  dispatch order, put the payments database's exhausted connection pool on
  checkout-api's line, and the finding went to the wrong team.

  The job id is the whole fix, and the rest follows from it. It names the
  incident, the check and the service, it travels with the result, and it is
  the only field in a result that says which worker produced it. Keying on
  part of it fails more quietly. The check alone merges two services. The
  check and the service together accept last night's result from the shared
  queue, because another investigation ran the same check on the same
  service.

  Walking your own jobs, instead of the results, is what makes the evidence
  complete. Every dispatched job gets exactly one line, a result nobody here
  asked for gets none, and a worker that never reported gets a line that says
  so. That last line changes the finding. "No cause found" over five checks
  is a different statement from "no cause found, and payments-api's metrics
  never reported", and only the second tells the engineer where to look.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    You fan an investigation out to six workers. Results come back in whatever order they finish, some of them from another run. How does each result find the worker that produced it?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: dispatch
    args: job, check, service
    returns: '`status` 202 with `accepted` true. The check runs on a worker, and its result arrives later
      through `collect`.'
  - name: collect
    args: ''
    returns: '`status` 200 and `results` in finishing order, each a check result with its `job` id. Other
      investigations share the queue, and a job may post nothing.'
  - name: diff
    args: deploy
    returns: What one deploy changed, called with the `deploy` id a lead names in `next`. It returns a
      `verdict`, a one-line `finding` and `next`.
example:
  case: every_result_lands_on_its_own_line
  expect: Dispatch six jobs with their ids, collect once, match each result by its `job` id, and return
    the model's finding, which sends the payments database cause to the payments team.
traps:
  - Pairing results with jobs by position, when workers post in finishing order and only the `job` id
    says which job a result belongs to.
  - Matching on the check and the service alone, so a result another investigation left in the shared
    queue lands on your line.
  - Walking the results you received instead of the jobs you dispatched, so a worker that never reported
    gets no line saying so.
  - Skipping stage 1's follow-up loop after the fan-out, so a lead's next checks never run when nothing
    was definitive.
