  - name: a_line_the_invoice_never_shows_does_not_count
    visibility: hidden
    spec:
      kind: agent_run
      input:
        question: |
          9 April 2026

          Dear claims team,

          Smoke from a kitchen fire on 7 April 2026 ruined the sofa, the rug
          and the cushions in our living room. My policy number is HX-254877.
          The invoice for the replacements is attached, and the total I am
          claiming is £1,540.00, which includes the delivery charge for the
          new sofa.

          Yours faithfully,
          Helen Marsh
      llm_script:
        - { match: { regex: '(?i)not\s+(?:\w+\s+){0,2}in\s+the\s+invoice' },
            reply: '{"policy_number": "HX-254877", "claimant": "Helen Marsh", "incident_date": "7 April 2026", "amount_claimed": "£1,540.00", "line_items": [{"description": "Sofa, three seat", "amount": "£1,150.00"}, {"description": "Rug, 160 x 230", "amount": "£225.00"}, {"description": "Cushions, set of four", "amount": "£90.00"}]}' }
        - { match: "*",
            reply: '{"policy_number": "HX-254877", "claimant": "Helen Marsh", "incident_date": "7 April 2026", "amount_claimed": "£1,540.00", "line_items": [{"description": "Sofa, three seat", "amount": "£1,150.00"}, {"description": "Rug, 160 x 230", "amount": "£225.00"}, {"description": "Cushions, set of four", "amount": "£90.00"}, {"description": "Delivery", "amount": "£75.00"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 11960          Date: 8 April 2026
              Sofa, three seat                      £1,150.00
              Rug, 160 x 230                          £225.00
              Cushions, set of four                    £90.00
              TOTAL                                 £1,465.00
        submit: { returns: { status: 200, claim: "C-6104" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4204" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: submit }
        - { type: calls_tool, name: human_queue }
        - { type: returns_matches, value: 'amount_claimed: does not match the line items' }

  - name: two_items_on_one_scanned_row_are_split_on_repair
    visibility: hidden
    spec:
      kind: agent_run
      input:
        question: |
          14 April 2026

          Dear claims team,

          Burglars took the television and other electrical goods from our
          flat on 12 April 2026. My policy number is HX-883021. The invoice for
          the replacements is attached, and the total I am claiming is
          £1,626.00.

          Regards,
          Luke Brennan
      llm_script:
        - { match: { regex: '(?i)not\s+(?:\w+\s+){0,2}in\s+the\s+invoice' },
            reply: '{"policy_number": "HX-883021", "claimant": "Luke Brennan", "incident_date": "12 April 2026", "amount_claimed": "£1,626.00", "line_items": [{"description": "Laptop, 14 inch", "amount": "£899.00"}, {"description": "Television, 43 inch", "amount": "£449.00"}, {"description": "Wall bracket", "amount": "£89.00"}, {"description": "Soundbar", "amount": "£189.00"}]}' }
        - { match: "*",
            reply: '{"policy_number": "HX-883021", "claimant": "Luke Brennan", "incident_date": "12 April 2026", "amount_claimed": "£1,626.00", "line_items": [{"description": "Laptop, 14 inch", "amount": "£899.00"}, {"description": "Television, 43 inch and wall bracket", "amount": "£538.00"}, {"description": "Soundbar", "amount": "£189.00"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 20455          Date: 13 April 2026
              Laptop, 14 inch                         £899.00
