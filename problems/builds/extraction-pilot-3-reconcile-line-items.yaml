build: { id: extraction-pilot, title: "Rescue a document extraction pilot", stage: 3, of: 4 }

brief_md: |
  Stages 1 and 2 are live at the insurer. Every value comes from the letter,
  every record meets the intake rules or reaches an adjuster after one
  repair, and the error folder is empty.

  An auditor found the next problem. Last month a contents claim was paid at
  £4,125.00, the total the customer's letter claimed. The invoice attached to
  it lists items that add up to £3,712.50. Nothing in the pipeline reads the
  invoice lines, so nothing noticed the £412.50 between them. Itemised claims
  are only 18 percent of the letters, and they carry 71 percent of the money
  claimed.

  The adjusters who check invoices by hand say an invoice is untidier than a
  letter. Every invoice prints its own total, and many print a subtotal and
  VAT above it. Whether VAT is paid depends on whether the policyholder can
  reclaim it, which no letter says. Now and then the scanning service attaches
  another customer's invoice to a letter.

  Extend the pipeline to the invoice. Extract its lines of goods, check each
  one against the invoice, and reconcile them with the letter's total before
  anything is submitted. Two numbers that disagree go to an adjuster with the
  reason, whichever of them looks right.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  The stub carries stages 1 and 2 as working code: the letter check in
  `_ground`, the intake rules in `_validate`, one repair that carries the
  error lines, and routing to `submit` or `human_queue`.

  `question` is the letter. `amount_claimed` is the total it claims, and the
  letter names its invoice as `invoice No. <number>`.
  `tools["invoice"]()` returns
  `{"status": 200, "text": "<the scanned invoice>"}`. Treat any other result
  as an invoice with no text.

  Read the invoice a line at a time, and compare text the way `_ground`
  compares a value with the letter. The first line prints
  `INVOICE No. <number>`. The Total line is the first line whose first word
  is `TOTAL`. Every line above it is a goods line, except a line whose first
  word is `SUBTOTAL` or `VAT`.

  Ask the model for the four fields and `line_items`, a list of
  `{"description": ..., "amount": ...}` copied from the invoice. Then add
  these error lines:

      invoice: the letter names No. <letter's>, the invoice is No. <invoice's>
      line_items: <amount> matches no goods line on the invoice
      line_items: missing
      amount_claimed: includes VAT or charges that are not line items
      amount_claimed: does not match the line items

  - The `invoice` line when the letter and the invoice each give a number
    and the two differ.
  - A `line_items` line for each item that no single goods line contains
    with both its description and its amount. Leave that item out.
  - `line_items: missing` when no item is left.
  - When the items left do not add up to `amount_claimed` to the penny:
    `amount_claimed: includes VAT or charges that are not line items` if they
    add up to less and `amount_claimed` equals the Total line's amount, and
    `amount_claimed: does not match the line items` in every other case.

  These lines join the intake errors, so they drive the one repair and the
  routing exactly as stage 2's do. The record you return carries the
  `line_items` that count. The return shape is stage 2's.

  Budget: at most 3 model calls. Allowed imports: json, re, decimal.

defence_question: |
  Your reconciliation sends every mismatch to an adjuster. A month in, a
  third of the human queue is invoices that miss their total by under five
  pounds, mostly trader rounding, and the head of claims asks you to
  auto-approve any mismatch below that line. What would you want to know
  before agreeing, and what would you build instead of a flat tolerance?

stub_code: |
  import json
  import re

  FIELDS = ("policy_number", "claimant", "incident_date", "amount_claimed")
  POLICY_NUMBER = re.compile(r"^[A-Z]{2}-\d{6}$")
  AMOUNT = re.compile(r"^£\d[\d,]*(?:\.\d{2})?$")

  WRONG_INVOICE = "invoice: the letter names No. {letter}, the invoice is No. {invoice}"
  NOT_A_GOODS_LINE = "line_items: {amount} matches no goods line on the invoice"
  NO_ITEMS = "line_items: missing"
  INCLUDES_CHARGES = "amount_claimed: includes VAT or charges that are not line items"
  DOES_NOT_ADD_UP = "amount_claimed: does not match the line items"

  EXTRACT = (
      "Read the claim letter and the invoice below. Reply with one JSON object and "
      "nothing else, with exactly these keys: policy_number, claimant, "
      "incident_date, amount_claimed, line_items.\n"
      "Copy each value exactly as it is written. amount_claimed is the total the "
      "letter claims. line_items is a list with one object for each line of goods "
      "on the invoice, each with a description and an amount. When a value is not "
      "stated, use null.\n\n"
      "<letter>\n{letter}\n</letter>\n<invoice>\n{invoice}\n</invoice>\n"
  )

  REPAIR = (
      "{extract}\n"
      "Your previous reply was:\n{reply}\n\n"
      "It was rejected for these reasons:\n{errors}\n\n"
      "Reply with the corrected JSON object. A value that is not written in the "
      "letter or the invoice stays null.\n"
  )


  def run_agent(question: str, llm, tools: dict) -> str:
      """Stages 1 and 2 work below. Stage 3 adds the invoice.

      tools["invoice"]() returns {"status": 200, "text": <the scanned invoice>}.
      Treat any other result as an invoice with no text.

      The letter names its invoice as "invoice No. <number>", and the invoice's
      first line prints "INVOICE No. <number>". When both give a number and the
      numbers differ, the error line is WRONG_INVOICE.

      Read the invoice a line at a time. The Total line is the first line whose
      first word is TOTAL, and a goods line is any line above it whose first word
      is not SUBTOTAL or VAT. A line item counts only when one goods line
      contains both its description and its amount. Leave any other item out,
      with the error line NOT_A_GOODS_LINE. With no items left, it is NO_ITEMS.
      When the items left do not add up to amount_claimed to the penny, it is
      INCLUDES_CHARGES if they add up to less and amount_claimed equals the
      Total line's amount, and DOES_NOT_ADD_UP otherwise.

      These lines join the intake errors, so they drive the one repair and the
      routing exactly as those do. The record you return carries the line_items
      that count.

      At most 3 model calls. Allowed imports: json, re, decimal.
      """
      invoice_text = ""  # TODO 1: read it from tools["invoice"]()

      prompt = EXTRACT.format(letter=question, invoice=invoice_text)
      reply = llm(prompt)
      record, errors = _check(reply, question, invoice_text)

      if errors:
          repair = REPAIR.format(extract=prompt, reply=reply, errors="\n".join(errors))
          record, errors = _check(llm(repair), question, invoice_text)

      if errors:
          tools["human_queue"](record=record, errors=errors)
          status = "queued"
      else:
          tools["submit"](record=record)
          status = "submitted"
      return json.dumps({"status": status, "record": record, "errors": errors})


  def _check(reply: str, letter: str, invoice_text: str):
      """Everything one reply has to pass. Returns (record, error lines)."""
      extracted = _parse(reply)
      record = _ground(extracted, letter)
      errors = _validate(record)
      # TODO 2: check the invoice is the one the letter names, ground the line
      #         items and reconcile them, put the kept items in
      #         record["line_items"], and add every error line
      return record, errors


  def _ground_items(items, invoice_text: str):
      """Keep the items whose description and amount one goods line contains.

      Returns (kept items, error lines), one NOT_A_GOODS_LINE per item left out.
      """
      return [], []  # TODO 3


  def _reconcile(record: dict, invoice_text: str) -> list:
      """[NO_ITEMS], [INCLUDES_CHARGES] or [DOES_NOT_ADD_UP] when the items fail, else []."""
      return []  # TODO 4


  def _parse(reply: str) -> dict:
      try:
          parsed = json.loads(reply)
      except ValueError:
          return {}
      return parsed if isinstance(parsed, dict) else {}


  def _ground(extracted: dict, letter: str) -> dict:
      """Stage 1: a field survives only when the letter contains it."""
      source = _normalise(letter)
      record = {}
      for field in FIELDS:
          value = extracted.get(field)
          if isinstance(value, str) and value.strip() and _normalise(value) in source:
              record[field] = value.strip()
          else:
              record[field] = None
      return record


  def _normalise(text: str) -> str:
      return re.sub(r"\s+", " ", text).strip().casefold()


  def _validate(record: dict) -> list:
      """Stage 2: the claims system's intake rules, one error line per failed rule."""
      errors = [f"{field}: missing" for field in FIELDS if record.get(field) is None]
      policy = record.get("policy_number")
      if policy is not None and not POLICY_NUMBER.match(policy):
          errors.append("policy_number: not a policy number")
      amount = record.get("amount_claimed")
      if amount is not None and not AMOUNT.match(amount):
          errors.append("amount_claimed: not an amount")
      return errors

hints:
  - An invoice prints more amounts than it has goods. Before you write the
    check, decide which of its lines a line item may honestly come from.
  - Finding an amount somewhere in the invoice text proves little, because the
    total, the VAT and every other item's price are in the text too. A line
    item is a description and an amount sitting together on one goods line.
  - A repaired reply is a second answer from the same model, and a model told
    that its lines fall short will add one that closes the gap. Check the
    repaired lines exactly as you checked the first ones.
  - Two invoices from the same shop can share a total. Compare the number the
    letter names with the number the invoice prints before any of its lines
    count.
  - "The shape: read the invoice a line at a time and stop at the Total line, skipping `SUBTOTAL` and `VAT` lines. Keep each item one goods line holds, add the kept amounts in whole pence, then pick the error line by comparing the claim with that sum and with the Total line's amount."

scenario:
  headline: "A claim was overpaid by £412.50 against its own invoice"
  who: The head of claims operations at a regional home insurer
  situation: >-
    Stages 1 and 2 are live. A claim with an itemised invoice goes through
    when its fields pass, and nothing checks that the invoice lines add up to
    the total the letter claims.
  stakes: >-
    A contents claim was paid at £4,125.00 against invoice lines worth
    £3,712.50. Itemised claims are 18 percent of the letters and 71 percent
    of the money claimed.
  metrics:
    - { label: Overpaid on one claim, value: "£412.50" }
    - { label: Letters with an invoice, value: "18%" }
    - { label: Share of money claimed, value: "71%" }

diagram:
  title: Where an invoice's own total passes as a line of goods
  caption: >-
    An invoice prints its total, and often VAT, beside its goods. A check that
    finds an amount anywhere in the text lets either one balance the books.
  direction: lr
  nodes:
    - { id: letter, label: Claim letter, sub: the total claimed and the invoice No., kind: doc, tone: blue, at: [0, 1] }
    - { id: invoice, label: Invoice, sub: "goods lines, then subtotal, VAT and total", kind: doc, tone: blue, at: [0, 2] }
    - { id: model, label: Model, sub: can copy the total or add the VAT, kind: model, tone: teal, at: [1, 0] }
    - { id: extractor, label: Extractor, sub: "asks, then repairs once", kind: agent, tone: purple, at: [1, 1] }
    - { id: grounding, label: Source check, sub: "fields in the letter, items on goods lines", kind: guard, tone: green, at: [2, 1] }
    - { id: validator, label: Validator, sub: the claims system's intake rules, kind: guard, tone: blue, at: [3, 1] }
    - { id: reconcile, label: Reconciliation, sub: goods lines against the claim in pence, kind: guard, tone: green, at: [3, 2] }
    - { id: claims, label: Claims system, sub: pays what the record says, kind: service, tone: orange, at: [4, 1] }
    - { id: queue, label: Human queue, sub: an adjuster keys it by hand, kind: queue, tone: neutral, at: [4, 2] }
  edges:
    - { from: letter, to: extractor, label: letter text, step: 1 }
    - { from: invoice, to: extractor, label: invoice text, step: 2 }
    - { from: extractor, to: model, label: fields and line items, step: 3 }
    - { from: model, to: extractor, label: the total copied as one item, step: 4 }
    - { from: extractor, to: grounding, label: every value and line, step: 5 }
    - { from: grounding, to: validator, label: a grounded record }
    - { from: validator, to: reconcile, label: a valid record }
    - { from: reconcile, to: claims, label: adds up to the penny, tone: success }
    - { from: reconcile, to: queue, label: "VAT, charges or a mismatch" }
    - { from: validator, to: extractor, label: one repair with the reasons }
    - { from: invoice, to: grounding, label: any amount in the text counts, tone: danger }

approach:
  goal: Pay what the goods lines prove, and send every disagreement to a person
  branches:
    - label: Trust neither number on its own
      leaves: [a letter total can be inflated, a printed total can hide charges, the model can balance the books]
    - label: A line item is a line of goods
      detail: Its description and its amount sit on one line above the Total line, and no subtotal or VAT line counts.
      leaves: [an amount beside another item proves nothing, nothing below the Total line is goods]
    - label: Check it is the right invoice
      leaves: [its number against the one the letter names, no invoice leaves nothing to check]
    - label: Add money the way an auditor would
      leaves: [to the penny, in a type that cannot drift]
    - label: Reuse the pipeline you have
      leaves: [new error lines drive the one repair, a repaired reply gets every check again]

coach:
  opening: >-
    Two numbers on every itemised claim should agree: the total the letter
    claims and the sum of the goods lines. Before you write code, decide which
    lines of an invoice a line item may come from.
  signals:
    - id: amount-anywhere
      when: { code_lacks: 'splitlines\(|\.split\(\s*r?["''][\\]n' }
      say: >-
        Nothing in your code reads the invoice a line at a time. A check
        against the whole text counts a line item whose amount appears
        anywhere, and the total and the VAT are in that text too. Which lines
        can a line item honestly come from?
    - id: float-money
      when: { code_matches: '\bfloat\(' }
      say: >-
        Money is being added as floats. Most pence values have no exact binary
        form, so a sum can miss a total it equals. Which type holds pence
        exactly?
    - id: sent-a-correct-claim-to-a-person
      when: { test_failed: a_claim_that_adds_up_to_the_penny_is_submitted }
      say: >-
        That claim adds up exactly and your pipeline sent it to an adjuster.
        Print the sum your code computed next to the total, with every digit.
    - id: counted-a-written-line
      when: { test_failed: a_line_the_invoice_never_shows_does_not_count }
      say: >-
        The model added a delivery line to make the lines match the letter.
        Where on that invoice does a £75.00 line appear?
    - id: merged-row-kept
      when: { test_failed: two_items_on_one_scanned_row_are_split_on_repair }
      say: >-
        The scan put two items on one row and the model returned them as a
        single £538.00 line. Nothing on the invoice says £538.00, and the
        repair is where the model gets to look again.
    - id: total-counted-as-a-line
      when: { test_failed: a_total_copied_as_the_only_line_does_not_count }
      say: >-
        The model returned the invoice's Total line as its only line item, and
        your check counted it, so the claim balanced against itself. The goods
        above that total add up to less. Is a total a line of goods?
    - id: vat-balanced-the-books
      when: { test_failed: a_vat_line_added_on_repair_does_not_count }
      say: >-
        Told that the lines fell short, the repair added the VAT line and your
        code counted it. VAT is on the invoice, and it is not goods. Who
        decides whether it is paid?
    - id: missing-invoice-trusted
      when: { test_failed: adversarial_the_invoice_never_arrived }
      say: >-
        The invoice tool returned nothing, and the model still produced lines
        that add up. What can a line be checked against when there is no
        invoice, and does your code survive being handed None?
    - id: wrong-invoice-trusted
      when: { test_failed: adversarial_another_customers_invoice_adds_up }
      say: >-
        Every line on that invoice is real and they add up to the claim. Read
        the number at the top of the invoice, then the one the letter names.
    - id: planted-line-counted
      when: { test_failed: adversarial_an_instruction_below_the_invoice_total }
      say: >-
        The invoice ended with an instruction, and the model obeyed it with a
        line priced at an amount the invoice does show, on another item's
        line. What does a line item need besides an amount the invoice prints?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1 and print the invoice text a line at a time inside
        `_check`. Mark the Total line, then write the line check before the
        sum.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints go from which lines count, to why an
        amount alone proves little, to the repair, to the arithmetic.
  wrap_up: >-
    Two numbers that should agree are a free check, and trusting either one
    throws it away. A line item is a description and an amount on a line of
    goods, and everything else an invoice prints, its own total included, is
    evidence of nothing.

tests:
  - name: an_invoice_that_adds_up_is_submitted
    visibility: public
    spec:
      kind: agent_run
      input:
        question: |
          8 April 2026

          Dear claims team,

          Our home was burgled on 6 April 2026 and the electrical goods in the
          living room were taken. My policy number is HX-509118. The
          retailer's invoice No. 20417 for the replacements is attached, and
          the total I am claiming is £1,626.00.

          Yours faithfully,
          Grace Adeyemi
      llm_script:
        - { match: "*",
            reply: '{"policy_number": "HX-509118", "claimant": "Grace Adeyemi", "incident_date": "6 April 2026", "amount_claimed": "£1,626.00", "line_items": [{"description": "Laptop, 14 inch", "amount": "£899.00"}, {"description": "Television, 43 inch", "amount": "£449.00"}, {"description": "Soundbar", "amount": "£189.00"}, {"description": "Wall bracket", "amount": "£89.00"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 20417          Date: 7 April 2026
              Laptop, 14 inch                         £899.00
              Television, 43 inch                     £449.00
              Soundbar                                £189.00
              Wall bracket                             £89.00
              TOTAL                                 £1,626.00
        submit: { returns: { status: 200, claim: "C-6101" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4201" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: invoice }
        - { type: calls_tool, name: submit }
        - { type: returns_matches, value: '"status":\s*"submitted"' }
        - { type: returns_matches, value: '"line_items":\s*\[' }

  - name: line_items_that_do_not_add_up_go_to_the_queue
    visibility: public
    spec:
      kind: agent_run
      input:
        question: |
          3 April 2026

          Dear claims team,

          Jewellery, a camera and a laptop were stolen from our home on 1 April
          2026. My policy number is HX-338150. I attach invoice No. 8812 for
          the replacements, and I am claiming £1,935.00 in total.

          Kind regards,
          Omar Haddad
      llm_script:
        - { match: "*",
            reply: '{"policy_number": "HX-338150", "claimant": "Omar Haddad", "incident_date": "1 April 2026", "amount_claimed": "£1,935.00", "line_items": [{"description": "Laptop, 13 inch", "amount": "£899.00"}, {"description": "Camera body", "amount": "£623.50"}, {"description": "Jewellery box, silver", "amount": "£41.25"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 8812           Date: 2 April 2026
              Laptop, 13 inch                         £899.00
              Camera body                             £623.50
              Jewellery box, silver                    £41.25
              TOTAL                                 £1,563.75
        submit: { returns: { status: 200, claim: "C-6102" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4202" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: invoice }
        - { type: calls_tool, name: human_queue }
        - { type: does_not_call_tool, name: submit }
        - { type: returns_matches, value: 'amount_claimed: does not match the line items' }

  - name: a_claim_that_adds_up_to_the_penny_is_submitted
    visibility: hidden
    spec:
      kind: agent_run
      input:
        question: |
          11 April 2026

          Dear claims team,

          A tablet, a phone and a laptop were taken when our car was broken
          into on 10 April 2026. My policy number is HX-716402. Invoice No.
          30551 for the replacements is attached, and I am claiming £2,079.97.

          Yours sincerely,
          Ben Castellano
      llm_script:
        - { match: "*",
            reply: '{"policy_number": "HX-716402", "claimant": "Ben Castellano", "incident_date": "10 April 2026", "amount_claimed": "£2,079.97", "line_items": [{"description": "Tablet, 11 inch", "amount": "£229.99"}, {"description": "Phone, 128 GB", "amount": "£599.99"}, {"description": "Laptop, 15 inch", "amount": "£1,249.99"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 30551          Date: 11 April 2026
              Tablet, 11 inch                         £229.99
              Phone, 128 GB                           £599.99
              Laptop, 15 inch                       £1,249.99
              TOTAL                                 £2,079.97
        submit: { returns: { status: 200, claim: "C-6103" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4203" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: submit }
        - { type: does_not_call_tool, name: human_queue }
        - { type: returns_matches, value: '"status":\s*"submitted"' }

  - name: a_line_the_invoice_never_shows_does_not_count
    visibility: hidden
    spec:
      kind: agent_run
      input:
        question: |
          9 April 2026

          Dear claims team,

          Smoke from a kitchen fire on 7 April 2026 ruined the sofa, the rug
          and the cushions in our living room. My policy number is HX-254877.
          Invoice No. 11960 for the replacements is attached, and the total I
          am claiming is £1,540.00, which includes the delivery charge for the
          new sofa.

          Yours faithfully,
          Helen Marsh
      llm_script:
        - { match: { regex: 'matches no goods line' },
            reply: '{"policy_number": "HX-254877", "claimant": "Helen Marsh", "incident_date": "7 April 2026", "amount_claimed": "£1,540.00", "line_items": [{"description": "Sofa, three seat", "amount": "£1,150.00"}, {"description": "Rug, 160 x 230", "amount": "£225.00"}, {"description": "Cushions, set of four", "amount": "£90.00"}]}' }
        - { match: "*",
            reply: '{"policy_number": "HX-254877", "claimant": "Helen Marsh", "incident_date": "7 April 2026", "amount_claimed": "£1,540.00", "line_items": [{"description": "Sofa, three seat", "amount": "£1,150.00"}, {"description": "Rug, 160 x 230", "amount": "£225.00"}, {"description": "Cushions, set of four", "amount": "£90.00"}, {"description": "Delivery", "amount": "£75.00"}]}' }
      tools:
        invoice:
          returns:
            status: 200
            text: |
              INVOICE No. 11960          Date: 8 April 2026
              Sofa, three seat                      £1,150.00
              Rug, 160 x 230                          £225.00
              Cushions, set of four                    £90.00
              TOTAL                                 £1,465.00
        submit: { returns: { status: 200, claim: "C-6104" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4204" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: submit }
        - { type: calls_tool, name: human_queue }
        - { type: returns_matches, value: 'amount_claimed: does not match the line items' }

  - name: two_items_on_one_scanned_row_are_split_on_repair
    visibility: hidden
    spec:
      kind: agent_run
      input:
        question: |
          14 April 2026

          Dear claims team,

          Burglars took the television and other electrical goods from our
          flat on 12 April 2026. My policy number is HX-883021. Invoice No.
