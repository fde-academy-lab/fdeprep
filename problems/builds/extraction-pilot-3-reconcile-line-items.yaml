        submit: { returns: { status: 200, claim: "C-6105" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4205" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: submit }
        - { type: llm_calls_at_most, value: 2 }
        - { type: returns_matches, value: '"amount":\s*"(?:£|\\u00a3)89\.00"' }

  - name: adversarial_the_invoice_never_arrived
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The invoice tool returned nothing, which is what an attachment looks
      like while the scanning service is still working on it. The model did
      not say so. It had the letter's description of a stolen bike and a
      total of £2,380.00, and it wrote three invoice lines that add up to
      exactly that.

      A reconciliation that trusts the model's lines passes this claim,
      because the model wrote them to pass. Only checking each line against
      the invoice text catches it, and with no invoice text there is nothing
      a line can be checked against. The claim goes to an adjuster, whose
      first question is where the invoice went.
    spec:
      kind: agent_run
      input:
        question: |
          15 April 2026

          Dear claims team,

          My road bike, helmet, lights and lock were stolen from the garage on
          13 April 2026. My policy number is HX-590362. The shop's invoice for
          the replacements is attached, and I am claiming £2,380.00.

          Yours faithfully,
          Chloe Brandt
      llm_script:
        - { match: "*",
            reply: '{"policy_number": "HX-590362", "claimant": "Chloe Brandt", "incident_date": "13 April 2026", "amount_claimed": "£2,380.00", "line_items": [{"description": "Road bike", "amount": "£1,899.00"}, {"description": "Helmet", "amount": "£129.00"}, {"description": "Lights and lock", "amount": "£352.00"}]}' }
      tools:
        invoice: { fixture: empty_tool_result }
        submit: { returns: { status: 200, claim: "C-6106" } }
        human_queue: { returns: { status: 200, ticket: "HQ-4206" } }
      budget: { max_llm_calls: 3, max_tool_calls: 5, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: does_not_call_tool, name: submit }
        - { type: calls_tool, name: human_queue }

reference_md: |
  An itemised claim carries two numbers that ought to agree: the total the
  letter claims, and the sum of the invoice lines. The pipeline paid the first
  and never read the second, which is how £4,125.00 went out against lines
  worth £3,712.50. Reconciling them does not decide which number is right. It
  notices that they disagree, which is all an automated step can honestly do,
  and it hands the disagreement to someone who can ring the trader.

  The line check matters more than the arithmetic. Given a letter claiming
  £1,540.00 and an invoice for £1,465.00, the model added a delivery line for
  £75.00, and a reconciliation over the model's own lines agrees with it
  perfectly, because the model wrote the line to agree. Checking each amount
  against the invoice text is stage 1's letter check pointed at the
  attachment, and it is the only thing in the pipeline that separates a line
  the trader printed from one the model supplied. With no invoice at all, as
  in the adversarial case, there is nothing to check a line against, and the
  claim belongs to a person.

  Money goes in whole pence because binary floating point stores almost no
  pence value exactly. 229.99 + 599.99 + 1249.99 is a hair more than 2079.97
  in floats, so a float comparison sends a correct claim to the queue, and the
  usual patch, a tolerance of a penny, quietly accepts a real one-penny
  discrepancy as well. Integers have neither problem.

  The new checks are error lines and nothing else, so stage 2's single repair
  and its routing carry them without new control flow. That is what gave the
  merged row its second look: the scan put the television and the bracket on
  one row, the model returned one £538.00 line that the invoice never shows,
  and the repair prompt said so.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    The line items you extracted add up to less than the total the letter claims. Which number do you pay?
  source: |
