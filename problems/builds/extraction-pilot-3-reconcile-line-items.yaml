slug: extraction-pilot-3-reconcile-line-items
title: "Check invoice lines add up before paying"
day: 28
skill: Check the invoice lines add up before anyone pays the total
artefact_type: code
difficulty: hard
track: builds
concept:
  topic: "Extraction pilot"
  question: "What has to add up before the total is paid?"
est_minutes: 40
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: tool-schema-design, weight: 0.5 }
