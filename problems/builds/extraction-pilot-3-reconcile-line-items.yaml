      A reconciliation that trusts the model's lines passes this claim,
      because the model wrote them to pass. Only checking each line against
      the goods lines of the invoice catches it, and with no invoice text
      there is no goods line for a line item to match. The claim goes to an
      adjuster, whose first question is where the invoice went.
