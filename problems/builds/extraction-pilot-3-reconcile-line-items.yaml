        - { match: "*",
            reply: '{"policy_number": "HX-716402", "claimant": "Ben Castellano", "incident_date": "10 April 2026", "amount_claimed": "£2,079.97", "line_items": [{"description": "Tablet, 11 inch", "amount": "£229.99"}, {"description": "Phone, 128 GB", "amount": "£599.99"}, {"description": "Laptop, 15 inch", "amount": "£1,249.99"}]}' }
      tools:
