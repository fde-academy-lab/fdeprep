slug: route-tickets-with-rules
title: "Route support tickets with plain rules"
day: 1
skill: Solve a routing task with rules before reaching for a model
artefact_type: code
difficulty: easy
track: loop
concept:
  topic: "Do you need a loop?"
  question: "Can plain rules route this ticket without any model at all?"
est_minutes: 15
competencies:
  - { slug: system-design, weight: 1.0 }
  - { slug: cost-and-latency, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [re]

brief_md: |
  A food delivery app the size of Swiggy gets most of its support tickets at
  dinner time, and every ticket lands in one of four queues: `refunds`,
  `late_delivery`, `account`, or `human` for a person to read first. The
  support lead wants the obvious tickets routed before anyone builds an AI
  feature, and has written the phrase table already.

  The first version shipped on Friday and two things went wrong on Saturday
  night. "My chocolate brownie arrived crushed" went to the late delivery
  team, because the word `late` sits inside `chocolate`. "I was charged twice
  and I am still waiting" went to refunds, and nobody chased the order.

  Write the router again. It uses no model at all, because this task does not
  need one.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the ticket text. Return exactly one queue name: `refunds`,
  `late_delivery`, `account` or `human`.

  A phrase from the table counts only when it appears as whole words, in any
  case, so `late` matches "Late again" and does not match "chocolate".

  | Phrases found | Return |
  |---|---|
  | Phrases from exactly one queue | That queue |
  | Phrases from two or more queues | `human` |
  | No phrase at all | `human` |

  Budget: no model calls. `llm` is passed in and must not be called. Allowed
  imports: re.

