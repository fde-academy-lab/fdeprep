    annotation_md: |
      The SSO executor's model kept replying with a sentence about checking
      the identity provider, and never with an action or a Done. Nothing it
      said could be run, and nothing it said ended the step.

      An executor that counts the actions it runs, rather than the model
      calls it makes, never reaches its share here, and goes round until the
      platform refuses the next call. Every reply is a call that was paid for,
      whatever it says. Counted that way, the step ends partial at its share,
      with no tool result to show, and billing still gets its turn.
