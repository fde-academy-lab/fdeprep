        import_users: { returns: { imported: 450, of: 450, errors: 0 } }
        configure_sso: { returns: { sso: enabled, provider: okta } }
        set_up_billing:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the billing service did not answer within 5000 ms" }
      budget: { max_llm_calls: 12, max_tool_calls: 20, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [steps, details, summary]
            properties:
              steps:
                type: object
                required: [set_up_billing, configure_sso]
                properties:
                  set_up_billing: { const: partial }
                  configure_sso: { const: done }
              details:
                type: object
                required: [set_up_billing]
                properties:
                  set_up_billing:
                    type: object
                    required: [error]
                    properties: { error: { const: TimeoutError } }

reference_md: |
  The incident had two causes and one shape. Each executor counted its own
  calls, so the order's budget bounded only the planner, and four loops with
  a cap of 8 each can spend 32 calls between them before the planner's own
  are counted. And the planner learned how a step ended only from the fact
  that its executor had stopped, so a step cut off at its cap read exactly
  like a step that had finished.

  Frameworks make the first mistake easy. In the OpenAI Agents SDK, version
  0.22.3, an agent turned into a tool with `as_tool` runs its own
  `Runner.run` with its own `max_turns`, which is `DEFAULT_MAX_TURNS`, 10,
  unless you pass one (read in `src/agents/agent.py` and
  `src/agents/run_config.py` on 1 October 2026). The parent's limit says
  nothing about what its sub-agents spend: a parent allowed 10 turns that
  calls a sub-agent on each turn can make 10 calls of its own and up to 10
  more inside every sub-agent. A budget that bounds the whole run has to be
  counted where every call is made, in one place.

  One count is not enough on its own. A stuck step can spend the whole of it
  and leave nothing for the steps after it, or for the summary, which is a
  model call too. So the planner keeps back the one call it needs to finish,
  and divides the rest by the steps still to run. Recomputing the share
  before each step means a step that finishes early leaves its calls to the
  steps after it, which is how the slow import still completes, and a step
  that never converges is cut off at its share.

  The status is the other half. Done means the executor said Done within its
  share. Anything else is partial, with the last thing the step's tools
  returned, because that is what a person needs to pick the step up. The
  summary model writes from the status lines it is given; told partial, it
  says partial, and told done for everything, it said all four steps were
  complete. The two adversarial cases are the same lesson from the
  executor's side: a reply that is not an action still costs a call, and a
  tool that raises has still answered.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Your planner agent hands each step to a sub-agent. How do you put one budget on the whole run, and what does the planner report when a sub-agent runs out?
  source: |
    Author judgement, with the OpenAI Agents SDK 0.22.3 source, read 1 October 2026, for how a sub-agent's turn limit is set. No employer frequency data stands behind it.

tools:
  - name: create_workspace
    args: name
    returns: '`{"workspace": ...}` once the workspace exists.'
  - name: import_users
    args: file
    returns: '`{"imported": ..., "of": ..., ...}`. A large file takes several calls, and a bad row stops it with an
      `error`.'
  - name: configure_sso
    args: provider
    returns: '`{"sso": "enabled", "provider": ...}`, or `{"sso": "failed", "error": ...}`.'
  - name: set_up_billing
    args: plan
    returns: '`{"billing": ..., "invoice": ...}`, or an `error`. It can also raise when the billing service does not
      answer.'
example:
  case: every_step_finishes_inside_its_share
  expect: Plan once, then run each step on its share, which here is an action and a Done each. Summarise with four
    status lines, and return all four steps as done with the model's summary.
traps:
  - Recording a step as done because its executor stopped, when its share ran out before it said Done.
  - Giving each executor a cap of its own, so the steps together spend more than the order's budget.
  - Letting one stuck step spend what the steps after it need, or the call the summary needs.
  - Counting actions instead of model calls, so an executor that never acts never runs out.
