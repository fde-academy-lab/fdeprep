  - name: adversarial_the_billing_service_never_answers
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      Every call to `set_up_billing` raised a `TimeoutError`. An executor
      written around answers lets the exception travel up through the
      planner, and the run ends with no summary, taking SSO, which never
      needed billing, down with it.

      A tool that raises has still answered the step, badly. Caught at the
      call, the timeout becomes a result, the executor carries on until its
      share runs out, the step ends partial with the error as its detail, and
      the planner moves on to SSO.
    spec:
      kind: agent_run
