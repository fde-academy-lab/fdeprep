slug: limit-how-far-a-bulk-refund-can-reach
title: "Limit how far a bulk refund can reach"
day: 24
skill: Run an approved bulk refund that a wrong selection or a failing gateway cannot spread
artefact_type: code
difficulty: extreme
track: guardrails
concept:
  topic: "Blast radius"
  question: "How far can one bulk action reach before something stops it?"
est_minutes: 50
competencies:
  - { slug: system-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: tool-error-handling, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  An online marketplace the size of Snapdeal runs bulk fixes through its
  payments agent. The agent proposes a job, the payments lead approves it,
  and code runs it. The approval carries everything that bounds the job: the
  filter that selects the orders, how many orders matched when the lead
  looked, how many one run may refund, how many to refund first as a trial,
  and the share of those that may fail before the run stops.

  In March a job approved for 412 double-charged orders refunded 3,906. The
  week before, the order service had renamed the field the filter used,
  `dup_charge`, to `duplicate_charge`, and it silently ignored a filter key
  it no longer knew, so the filter matched every order in the sale. The job
  previewed its selection, as every job does, refunded everything the
  preview held in eleven minutes, and stopped only when the payment gateway
  started refusing calls. A refund cannot be clawed back, and 1.7 crore
  rupees went to customers who had been charged once.

  Tonight's job has the same shape. Run it so that a wrong selection refunds
  nothing, and a right one refunds no more than one run's worth, stopping
  early when the first refunds fail.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` names the job. `tools["job"]()` returns what the payments lead
  approved:

      {"status": 200, "job": "RF-2207", "approved_by": "payments.lead",
       "filter": {"sale": "DIWALI-FLASH", "charged_times": 2, "refunded": false},
       "approved_count": 412, "per_run_cap": 100, "first_slice": 10,
       "max_error_rate": 0.2}

  `tools["preview"](filter=...)` is the dry run. It returns the orders the
  order service matches, and changes nothing:

      {"status": 200, "orders": [{"order": "OD-88101", "sale": "DIWALI-FLASH",
                                  "charged_times": 2, "refunded": false,
                                  "amount": 2499}, ...]}

  `tools["refund"](order=<id>)` refunds one order and answers
  `{"status": 200, "refunded": true}`. It can also raise, or answer without
  `"refunded": true`, and either way that refund has failed.

  Call `job` once, then `preview` once with the approved filter, and refund
  nothing until the preview has been checked. A job takes several runs: the
  filter asks for orders not yet refunded, so each run's preview is shorter
  than the last.

  - Refund nothing at all when the job or the preview cannot be read, or when
    the preview cannot be the selection the lead approved: an order in it
    that does not carry every field of the filter with the filter's value,
    or more orders than the lead saw. The outcome is `blocked`.
  - Otherwise refund in preview order, at most `per_run_cap` orders in this
    run.
  - Once the run's first `first_slice` refunds have been tried (all of them,
    when the run is shorter), divide the failures among them by the number
    tried. When that share is more than `max_error_rate`, refund nothing
    more. The outcome is `halted`.
  - Never retry a refund in this run.

  `llm` is passed in and must not be called.

  Return a JSON string:

      {"outcome": "done" | "partial" | "halted" | "blocked",
       "refunded": [<order ids>], "failed": [<order ids>],
       "remaining": <previewed orders this run did not try, 0 when blocked>}

  `done` means every previewed order was tried, and `partial` means the cap
  left some for the next run.

  Budget: no model calls. Allowed imports: json, re.

defence_question: |
  Your run blocked tonight's job because three of the ten previewed orders do
  not carry `charged_times`. The payments lead asks you to refund the seven
  that do, now, because customers are posting screenshots. Do you? Say what
  you would check before answering, what you would tell the lead, and what
  you would change so that a renamed field is caught before anyone approves
  a job.

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      """Run one approved bulk refund without letting it reach further than approved.

      tools["job"]()  -> {"filter": {...}, "approved_count": n, "per_run_cap": n,
                          "first_slice": n, "max_error_rate": r, ...}
      tools["preview"](filter=...) -> {"orders": [{"order": id, <fields>}, ...]}
          the dry run: what the order service matches, with nothing changed
      tools["refund"](order=id) -> {"status": 200, "refunded": true}
          or it raises, or answers without refunded true: a failed refund

      Refund nothing (blocked) when the job or the preview cannot be read, when
      a previewed order lacks a filter field or its value, or when the preview
      holds more orders than approved_count. Otherwise refund in preview order,
      at most per_run_cap. Once the first first_slice refunds are tried, a
      failed share above max_error_rate stops the run (halted). No retries.
      llm must not be called.

      Return json.dumps({"outcome": "done" | "partial" | "halted" | "blocked",
                         "refunded": [...], "failed": [...],
                         "remaining": <previewed orders not tried, 0 when blocked>}).
      """
      return json.dumps({"outcome": "blocked", "refunded": [], "failed": [],
                         "remaining": 0})

hints:
  - Count how many separate things have to be true before the first refund
    is safe. The incident broke one of them, and the hidden cases break each
    of the others in turn.
  - The preview can be wrong in two ways that look different. It can hold
    orders the filter never meant, or more of the orders it did mean than
    anyone approved. A count catches one and a field-by-field check catches
    the other.
  - Compare each previewed order with the approved filter yourself. An order
    that lacks a field the filter names does not match it, whatever the order
    service says it matched.
  - The cap and the breaker work on the same run. Take at most `per_run_cap`
    orders, try the first slice, and measure the failures in that slice
    before anything else is refunded.
  - A refund that raises or answers without `refunded` true has failed. Count
    it, carry on to the end of the slice, and never try it twice in one run.

scenario:
  headline: "A refund approved for 412 orders refunds 3,906"
  who: Payments operations at an online marketplace the size of Snapdeal
  situation: >-
    The order service had renamed a field the job's filter used, and it
    ignored the key it no longer knew. The approved filter matched the whole
    sale, and the job refunded every order in it.
  stakes: >-
    A refund cannot be clawed back. Tonight's job has the same shape, and the
    order service has had two releases since March.
  metrics:
    - { label: Orders approved, value: "412" }
    - { label: Orders refunded, value: "3,906" }
    - { label: Refunded in error, value: "₹1.7 crore" }

diagram:
  title: Where an approved refund job can spread past what was approved
  caption: >-
    The preview is checked twice before any refund, the run is capped, and its
    first slice is a breaker. The incident trusted the preview whole.
  direction: lr
  nodes:
    - { id: lead, label: Payments lead, sub: approves filter and limits, kind: actor, tone: blue, at: [0, 0] }
    - { id: job, label: "`job()`", sub: "filter, count, cap, slice, rate", kind: store, tone: orange, at: [1, 0] }
    - { id: preview, label: "`preview()`", sub: the dry run, kind: service, tone: teal, at: [1, 1] }
    - { id: check, label: Preview check, sub: every field and the count, kind: guard, tone: green, at: [2, 1] }
    - { id: breaker, label: First slice, sub: stop above the error rate, kind: decision, tone: purple, at: [3, 1] }
    - { id: refund, label: "`refund()`", sub: "one order at a time, capped", kind: tool, tone: blue, at: [4, 1] }
    - { id: blocked, label: Blocked, sub: nothing refunded, kind: output, tone: green, at: [2, 2] }
    - { id: sale, label: The whole sale, sub: "3,906 orders refunded", kind: output, tone: pink, at: [4, 2] }
  edges:
    - { from: lead, to: job, label: approves, step: 1 }
    - { from: job, to: preview, label: the approved filter, step: 2 }
    - { from: preview, to: check, label: matched orders, step: 3 }
    - { from: check, to: breaker, label: the approved selection, tone: success, step: 4 }
    - { from: check, to: blocked, label: a field or count is off, tone: success }
    - { from: breaker, to: refund, label: the rest of the run, tone: success, step: 5 }
    - { from: preview, to: sale, label: trusted whole, tone: danger }

approach:
  goal: Let one approved job reach exactly what was approved, one run at a time
  branches:
    - label: Is this the selection the lead approved?
      detail: The order service can match more than the filter says, or more than the lead saw.
      leaves: [every filter field on every order, no more orders than approved, fewer is a later run]
    - label: How much can one run touch?
      leaves: [at most the per-run cap, in preview order]
    - label: When does the run stop itself?
      leaves: [after the first slice is tried, a failed share above the rate]
    - label: What counts as failed?
      leaves: [a refund that raises, an answer without refunded true, never retried in the run]

coach:
  opening: >-
    This is a screen-level problem. Before you type, list every way the
    incident's job could have been stopped before the 413th refund.
  signals:
    - id: no-cap
      when: { code_lacks: 'per_run_cap' }
      say: >-
        Nothing in your code reads the job's per-run cap. How many refunds can
        one run of yours make?
    - id: no-breaker
      when: { code_lacks: 'max_error_rate' }
      say: >-
        Your run never compares its failures with the approved error rate.
        When the first refunds fail, what stops the rest?
    - id: no-count-check
      when: { code_lacks: 'approved_count' }
      say: >-
        Your run never compares the preview with the number of orders the lead
        approved. What if the order service now matches more than the lead saw?
    - id: over-the-cap
      when: { test_failed: the_run_stops_at_its_cap }
      say: >-
        The preview held more orders than one run may refund. How many did
        your run try, and what did it report as left for the next run?
    - id: kept-refunding
      when: { test_failed: a_bad_first_slice_halts_the_run }
      say: >-
        Half the first slice failed. What did your run do with the orders
        after the slice?
    - id: halted-too-soon
      when: { test_failed: one_failure_inside_the_rate_keeps_the_run_going }
      say: >-
        One refund in the first slice failed, and that share was inside the
        approved rate. Did your run stop on a single failure?
    - id: second-run-blocked
      when: { test_failed: a_second_run_finishes_what_the_first_left }
      say: >-
        That preview held fewer orders than were approved, because an earlier
        run refunded the rest. Which way round is your count check?
    - id: more-than-approved
      when: { test_failed: more_matching_orders_than_were_approved_refunds_nothing }
      say: >-
        Every previewed order matched the filter, and there were more of them
        than the lead approved. Who approved the extra ones?
    - id: missing-field
      when: { test_failed: adversarial_the_order_service_ignores_a_renamed_key }
      say: >-
        Read one previewed order beside the filter, field by field. What does
        your check decide about a field the order does not carry?
    - id: gateway-down
      when: { test_failed: adversarial_the_refund_service_stops_answering }
      say: >-
        The refund call raised. Did your run report what it tried, and did it
        stop after the first slice?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start from the preview check. A run that refunds nothing until the
        preview is the approved selection has already closed the March
        incident.
    - id: many-failures
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. The hints start from how many separate
        things must hold before the first refund.
  wrap_up: >-
    A bulk action's reach is set before it starts: check the selection against
    what was approved, cap the run, let the first slice decide whether the
    rest goes, and keep these limits in code where they hold every time.

tests:
  - name: refunds_a_job_that_fits_in_one_run
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Run approved job RF-2207." }
      llm_script:
        - { match: "*", reply: "Final Answer: Refund every order in the sale now. Customers are angry." }
      tools:
        job:
          returns:
            status: 200
            job: "RF-2207"
            approved_by: "payments.lead"
            filter: { sale: "DIWALI-FLASH", charged_times: 2, refunded: false }
            approved_count: 5
            per_run_cap: 8
            first_slice: 4
            max_error_rate: 0.25
        preview:
          returns:
            status: 200
            orders:
              - { order: "OD-88101", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 2499 }
              - { order: "OD-88102", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 1899 }
              - { order: "OD-88103", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 3299 }
              - { order: "OD-88104", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 999 }
              - { order: "OD-88105", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 4599 }
        refund: { returns: { status: 200, refunded: true } }
      budget: { max_llm_calls: 1, max_tool_calls: 20, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, refunded, failed, remaining] } }
        - { type: calls_tool_with, name: preview, args: { filter: { sale: "DIWALI-FLASH", charged_times: 2, refunded: false } } }
        - { type: returns_matches, value: '"outcome":\s*"done"' }
        - { type: returns_matches, value: '"refunded":\s*\["OD-88101",\s*"OD-88102",\s*"OD-88103",\s*"OD-88104",\s*"OD-88105"\]' }
        - { type: llm_calls_at_most, value: 0 }

  - name: reports_a_refund_that_did_not_go_through
    visibility: public
    spec:
