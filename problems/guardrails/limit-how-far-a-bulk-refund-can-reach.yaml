reference_md: |
  The March job did one thing right: it previewed. Then it trusted the
  preview whole, and the preview was the order service's answer to a filter
  it had partly ignored. Every limit on how far a bulk action can reach has
  to hold before the first refund, because after it nothing can be called
  back.

  There are four, and each catches what the others miss.

  The preview has to be the selection the lead approved, and that takes two
  checks. Comparing every previewed order with the approved filter, field by
  field, catches a key the order service ignored: an order without the field
  does not match it, whatever the service says. Comparing the size of the
  preview with the approved count catches orders that match the filter
  honestly and were never in front of the lead, such as new double charges
  since the approval. Either check alone passes one of the hidden cases that
  the other blocks. The count is a ceiling and never an equality, because the
  filter asks for orders not yet refunded and every run after the first sees
  fewer.

  The cap bounds one run. A job that is right still refunds at most one
  run's worth, so a mistake nobody has spotted yet reaches a hundred
  customers and not four thousand.

  The first slice is a breaker. The run tries it, measures the share that
  failed and stops above the approved rate, so a gateway that is failing
  stops the job after ten tries and not after the cap. A single failure
  inside the rate does not stop it, because a breaker that trips on one
  timeout means no job ever finishes.

  A failed refund is counted and never retried in the run. A timeout is the
  failure where nobody knows whether the money moved, and the next run's
  preview, which asks for orders not yet refunded, is what settles it.

  Blocking the whole run when three of ten orders look wrong is a choice, and
  the defence question asks you to argue it. The case for it is that the
  seven that look right were selected by a query nobody approved, from a
  service that has just shown it will answer a different question from the
  one it was asked.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Your agent can refund orders in bulk. What stops one approved job from refunding ten times what was approved?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: job
    args: ''
    returns: The approved `filter`, `approved_count`, `per_run_cap`, `first_slice` and `max_error_rate`, and
      who approved the job.
  - name: preview
    args: filter
    returns: A status and the `orders` the order service matches, each with its id and fields. It changes
      nothing.
  - name: refund
    args: order
    returns: A status and `refunded` true when the refund went through. It can raise, or answer without
      `refunded` true.
example:
  case: refunds_a_job_that_fits_in_one_run
  expect: Preview with the approved filter, find five orders that each carry every filter field and no
    more than the five approved, refund all five in order, and return `done` with the five ids.
traps:
  - Refunding whatever the preview returned, when an ignored filter key can make it the whole sale.
  - Reading a field an order does not carry as matching, so a renamed field passes every order.
  - Treating the approved count as an exact number, so every run after the first refuses to start.
  - Letting a failing first slice carry on into the rest of the run, or stopping on a single failure.
