            approved_count: 6
            per_run_cap: 8
            first_slice: 4
            max_error_rate: 0.25
        preview:
          returns:
            status: 200
            orders:
              - { order: "OD-88111", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 2499 }
              - { order: "OD-88112", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 1899 }
              - { order: "OD-88113", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 3299 }
              - { order: "OD-88114", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 999 }
              - { order: "OD-88115", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 4599 }
              - { order: "OD-88116", sale: "DIWALI-FLASH", charged_times: 2, refunded: false, amount: 1299 }
        refund:
