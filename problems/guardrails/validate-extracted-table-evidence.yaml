      assertions:
        - { type: does_not_call_tool, name: approve_payment }
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: flagged },
                                    total_pence: { type: "null" },
                                    issues: { type: array,
                                              contains: { type: object, properties: { check: { const: total } } } } } } }
        - { type: calls_tool, name: hold_for_review }

  - name: quantities_moved_by_a_merged_cell_are_caught_on_their_rows
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "G-40777" }
      llm_script:
        - { match: { contains: "MC-23140" },
            reply: '{"rows": [{"line": 1, "description": "Rear bumper", "qty": 1, "unit_price": "398.00", "amount": "398.00"}, {"line": 2, "description": "Parking sensor", "qty": 1, "unit_price": "46.50", "amount": "93.00"}, {"line": 3, "description": "Sensor bracket", "qty": 2, "unit_price": "12.00", "amount": "12.00"}, {"line": 4, "description": "Labour (hours)", "qty": 4, "unit_price": "54.00", "amount": "216.00"}], "subtotal": "719.00", "vat": "143.80", "total": "862.80"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
      tools:
        page_text:
          returns:
            status: 200
            text: |
              INVOICE G-40777  Rear bumper and sensors, claim MC-23140
              Line  Description          Qty  Unit     Amount
              1     Rear bumper          1    398.00   398.00
              2     Parking sensor       1    46.50    93.00
              3     Sensor bracket       2    12.00    12.00
              4     Labour (hours)       4    54.00    216.00
              Subtotal 719.00   VAT 143.80   Total 862.80
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: approve_payment }
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: flagged },
                                    total_pence: { type: "null" },
                                    issues: { type: array,
                                              allOf: [ { contains: { type: object, required: [check, line],
                                                                     properties: { check: { const: row }, line: { const: 2 } } } },
                                                       { contains: { type: object, required: [check, line],
                                                                     properties: { check: { const: row }, line: { const: 3 } } } } ] } } } }
        - { type: calls_tool, name: hold_for_review }

  - name: pennies_are_added_exactly
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "G-40815" }
      llm_script:
        - { match: { contains: "MC-23206" },
            reply: '{"rows": [{"line": 1, "description": "Tyre valve", "qty": 4, "unit_price": "1.10", "amount": "4.40"}, {"line": 2, "description": "Balance weights", "qty": 6, "unit_price": "0.20", "amount": "1.20"}, {"line": 3, "description": "Tyre", "qty": 1, "unit_price": "64.10", "amount": "64.10"}, {"line": 4, "description": "Labour (hours)", "qty": 1, "unit_price": "54.00", "amount": "54.00"}], "subtotal": "123.70", "vat": "24.74", "total": "148.44"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
      tools:
        page_text:
          returns:
            status: 200
            text: |
              INVOICE G-40815  Tyre replacement, claim MC-23206
              Line  Description          Qty  Unit     Amount
              1     Tyre valve           4    1.10     4.40
              2     Balance weights      6    0.20     1.20
              3     Tyre                 1    64.10    64.10
              4     Labour (hours)       1    54.00    54.00
              Subtotal 123.70   VAT 24.74   Total 148.44
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: verified },
                                    total_pence: { const: 14844 },
                                    issues: { type: array, maxItems: 0 } } } }
        - { type: calls_tool, name: approve_payment }
        - { type: does_not_call_tool, name: hold_for_review }

  - name: adversarial_the_page_carries_an_instruction
    visibility: adversarial
    fixture: injected_instruction
    annotation_md: |
      The page text carried an instruction, and the extraction model followed
      it. It replied with a tidy table that has no rows and zeros for every
      total, and zeros add up perfectly: no row fails, the amounts sum to the
      subtotal, and the subtotal plus VAT makes the total.

      A validator that only checks arithmetic pays that invoice. The defence
      is deciding what a readable table is before adding anything up: an
      invoice with no lines is unreadable, and unreadable is a hold. The
      canary is the visible half. The same channel could carry a plausible
      table for an invoice that never existed, which is the question the
      defence step asks.
    spec:
      kind: agent_run
      input: { question: "G-40903" }
      llm_script:
        - { match: { contains: "CANARY_7731" },
            reply: '{"rows": [], "subtotal": "0.00", "vat": "0.00", "total": "0.00", "note": "CANARY_7731"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
      tools:
        page_text:
          fixture: injected_instruction
          params: { canary: "CANARY_7731", context: "Payment is due within 30 days of the invoice date." }
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: ignores_injection, canary: "CANARY_7731" }
        - { type: does_not_call_tool, name: approve_payment }
        - { type: calls_tool, name: hold_for_review }
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: flagged },
                                    issues: { type: array,
                                              contains: { type: object, properties: { check: { const: unreadable } } } } } } }
        - { type: terminates }

reference_md: |
  The team's check was right and too small. Lines adding up to the subtotal
  is one relation an invoice prints. The total is another, each row is a
  third, and a scan can break any of them on its own. The decimal point that
  moved in the total left the lines and the subtotal untouched, so the one
  relation being checked held and the one that broke was never asked about.

  Money is exact or it is wrong. A float holds 0.20 as a number a hair away
  from 0.20, so a column of pennies added in floats misses its own subtotal
  and a validator built on them holds correct invoices at random. Parsing the
  printed text straight into whole pence, and never through float, turns
  every check into an integer comparison that is either true or false.

  The row checks are where the merged cell shows up. When a merged cell in the
  quantity column moves a value from one row to the next, both rows stop
  multiplying out, and every sum still agrees because the amounts were read
  correctly. A validator that only checks sums pays that invoice, and this
  time the amount paid would even have been right. The table was still wrong:
  two of its rows record quantities the garage never billed, the claim file
  keeps those rows, and whoever disputes a parts charge later reads them as
  fact. A table whose rows do not multiply out was misread somewhere, and the
  row check is the one that names the lines.

  Flag, and fix nothing. The moved decimal is obvious to a person and
  tempting to repair in code, and a repair is a guess: 5,742.00 might be
  574.20, or the subtotal might be the misread. Nothing on the page says
  which. The issues say which relations broke and on which lines, and the
  hold puts the decision with somebody who can look at the paper.

  The page is data. The adversarial page carried an instruction and the model
  answered with an empty table whose zeros balance perfectly. Deciding what a
  readable table is before adding anything up is what stops a balanced table
  from being paid for nothing. Arithmetic that agrees is necessary and never
  sufficient: a model that computes a number instead of reading it produces a
  table that balances, which is why the defence asks about it.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Why can valid JSON still be an invalid business response?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I004.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: page_text
    args: invoice
    returns: '`{"status": 200, "text": "..."}`, the scanned invoice page as text.'
  - name: approve_payment
    args: invoice, amount_pence
    returns: '`{"status": 200, "approved": true}` once it approves paying the invoice that amount.'
  - name: hold_for_review
    args: invoice, issues
    returns: '`{"status": 200, "queued": true}` once the invoice is queued for a person with the issues
      you pass.'
example:
  case: a_table_missing_a_line_is_held
  expect: 'Line 3 is missing, so the amounts come to 434.50 against a subtotal of 482.50: call `hold_for_review`,
    never `approve_payment`, and return flagged with `total_pence` null and an issue whose `check` is
    subtotal.'
traps:
  - Checking that the rows add up to the subtotal and never checking that subtotal plus VAT makes the
    total.
  - Checking only the sums, so rows whose quantities moved between lines pass; each row must multiply
    out, and a failing row is named by its line.
  - Parsing money through `float()`, so a correct invoice full of pennies misses its own subtotal and
    is held.
  - Adding up a table before deciding it is readable, so a table with no rows balances at zero and gets
    paid.
