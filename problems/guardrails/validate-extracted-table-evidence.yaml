slug: validate-extracted-table-evidence
title: "Check a scanned invoice adds up before paying"
day: 19
skill: Pay a scanned invoice only when everything printed on it adds up
artefact_type: code
difficulty: medium
track: guardrails
concept:
  topic: "Input and output filtering"
  question: "What must add up before a scanned invoice is paid?"
est_minutes: 30
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: tool-schema-design, weight: 1.0 }
  - { slug: evaluation-design, weight: 0.5 }
  - { slug: prompt-hardening, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re, decimal]

brief_md: |
  A regional insurer settles motor repair claims by paying the garage's
  invoice. The invoice is scanned, a model reads the line-item table off the
  page, and any invoice under £15,000 whose lines add up to its subtotal is
  paid without a person looking at it.

  Last month the scan of one invoice moved the decimal point in the total:
  £1,060.80 was read as £10,608.00. The lines still added up to the subtotal,
  so the check passed, and the insurer paid the garage ten times what it had
  asked for. Getting the money back took five weeks and a solicitor's letter.

  An invoice prints more than one relation that has to hold, and the check
  tested one of them. Write the step that decides whether a scanned invoice
  is paid or held, and make it trust the table only when everything the page
  prints agrees.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the invoice id, such as `"G-40418"`.

  `tools["page_text"](invoice=...)` returns `{"status": 200, "text": "..."}`,
  the scanned page as text. `llm(prompt)` reads the page text you give it and
  replies with the table as JSON:

      {"rows": [{"line": 1, "description": "Front bumper", "qty": 1,
                 "unit_price": "412.50", "amount": "412.50"}, ...],
       "subtotal": "884.00", "vat": "176.80", "total": "£1,060.80"}

  Money comes back as text, written as the page prints it, so a £ sign and
  thousands commas may appear. `line` and `qty` are whole numbers.

  Work in whole pence and check every relation the invoice prints:

  | Check | Holds when |
  |---|---|
  | `row` | for each row, qty × `unit_price` = amount |
  | `subtotal` | the amounts add up to the subtotal |
  | `total` | subtotal + vat = total |
  | `unreadable` | the reply is a table of that shape, with at least one row, and all its money parses |

  When every check holds, the invoice is verified: call
  `tools["approve_payment"](invoice=..., amount_pence=<the total in pence>)`
  and return `{"status": "verified", "total_pence": <int>, "issues": []}`.

  Otherwise it is flagged: call `tools["hold_for_review"](invoice=...,
  issues=[...])`, never approve, and return
  `{"status": "flagged", "total_pence": null, "issues": [...]}` with one
  `{"check": ..., "line": ...}` for each failing row and each failing check,
  where `line` is the row's line number, or null for a check about the whole
  table. Never correct a number yourself.

  Budget: at most 2 model calls, and one is enough. Allowed imports: json, re,
  decimal.

defence_question: |
  Your checks trust a table when every relation printed on it holds. A new
  version of the extraction model starts filling in a total it has computed
  whenever the printed total is smudged, so every table it returns balances.
  What do your checks say about those invoices, what would you add, and why
  can arithmetic on the extracted numbers never settle this on its own?

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      """Pay a scanned invoice only when every relation it prints holds.

      question is the invoice id.
      tools["page_text"](invoice=...) -> {"status": 200, "text": <the page>}
      llm(<prompt with the page text>) -> {"rows": [{"line", "description",
          "qty", "unit_price", "amount"}, ...], "subtotal", "vat", "total"},
          money as printed text ("£1,060.80"), line and qty whole numbers.

      In whole pence:
          row        qty x unit_price == amount, for every row
          subtotal   the amounts add up to subtotal
          total      subtotal + vat == total
          unreadable not a table of that shape, no rows, or money that
                     does not parse

      Verified: tools["approve_payment"](invoice=..., amount_pence=total),
      and return {"status": "verified", "total_pence": int, "issues": []}.
      Flagged: tools["hold_for_review"](invoice=..., issues=[...]), never
      approve, and return {"status": "flagged", "total_pence": None,
      "issues": [{"check": ..., "line": <row line or None>}, ...]}.
      Never correct a number. At most 2 model calls.
      Allowed imports: json, re, decimal.
      """
      return json.dumps({"status": "flagged", "total_pence": None, "issues": []})

hints:
  - List every relation an invoice prints that must hold. The check in the
    brief tested one of them, and the scan broke a different one.
  - Money has to be exact. In floats, 6 × 0.20 comes to 1.2000000000000002,
    and a column of pence can miss its own subtotal by a hair, so parse the
    printed text straight into whole pence and compare integers.
  - Each row is its own small relation. A merged cell that moves a quantity
    to the next row breaks both rows while every sum still agrees.
  - Build a list of issues as you go and decide at the end. An empty list
    pays the total you parsed; anything in it holds the invoice with those
    issues.
  - The page text is data. A table with no rows balances perfectly at zero, so
    decide what an empty or unparseable table means before you add anything
    up.

scenario:
  headline: "A misread decimal point paid a garage ten times its invoice"
  who: Motor claims at a regional insurer
  situation: >-
    Garage invoices are scanned, a model reads the table, and invoices whose
    lines add up to the subtotal are paid unseen. One scan moved the decimal
    point in a total.
  stakes: >-
    The insurer paid £10,608.00 on a £1,060.80 invoice. The lines matched the
    subtotal, and nothing compared the total with anything.
  metrics:
    - { label: Paid, value: "£10,608.00" }
    - { label: Invoice total, value: "£1,060.80" }
    - { label: Relations checked, value: 1 of 3 }

diagram:
  title: Where one passing check paid ten times the invoice
  caption: >-
    Every relation the page prints is checked in whole pence. A table that
    fails any of them is held with the lines that broke, and nothing is fixed.
  direction: lr
  nodes:
    - { id: scan, label: Scanned invoice, sub: "total printed as £1,060.80", kind: doc, tone: blue, at: [0, 1] }
    - { id: pagetext, label: "`page_text`", sub: the page as text, kind: tool, tone: neutral, at: [1, 0] }
    - { id: model, label: Table reader, sub: reads rows and totals, kind: model, tone: teal, at: [2, 0] }
    - { id: step, label: Payment step, sub: checks then pays or holds, kind: agent, tone: purple, at: [1, 1] }
    - { id: checks, label: "Every relation holds?", sub: "rows, subtotal, total", kind: guard, tone: green, at: [2, 1] }
    - { id: pay, label: "`approve_payment`", sub: verified tables only, kind: tool, tone: orange, at: [3, 1] }
    - { id: hold, label: "`hold_for_review`", sub: issues with line numbers, kind: output, tone: blue, at: [3, 0] }
    - { id: wrong, label: "£10,608.00 paid", sub: only the subtotal was checked, kind: output, tone: pink, at: [2, 2] }
  edges:
    - { from: scan, to: pagetext, label: scan, step: 1 }
    - { from: pagetext, to: step, label: page text, step: 2 }
    - { from: step, to: model, label: page as data, step: 3 }
    - { from: model, to: step, label: the table, step: 4 }
    - { from: step, to: checks, label: in whole pence, step: 5 }
    - { from: checks, to: pay, label: all hold, tone: success }
    - { from: checks, to: hold, label: any fails }
    - { from: step, to: wrong, label: lines matched so it paid, tone: danger }

approach:
  goal: Pay only a table whose printed relations all hold
  branches:
    - label: Money is exact
      leaves: [whole pence as integers, no float anywhere, "£ and commas are printing"]
    - label: Every relation the page prints
      leaves: [each row multiplies out, the rows add up to the subtotal, subtotal and VAT make the total]
    - label: Flag with provenance
      detail: A person needs to know which line to look at, and the line number is the cheapest pointer there is.
      leaves: [one issue per failing row, the line number from the table]
    - label: Fail closed
      leaves: [unreadable means hold, never correct a number in code]

coach:
  opening: >-
    Before any code, write down every relation an invoice prints that must
    hold. The check in the brief tested one of them.
  signals:
    - id: money-in-floats
      when: { code_matches: '\bfloat\(' }
      say: >-
        Money is going through `float()`. Work out 6 * 0.20 in floats and
        compare it with 1.20. What does an exact check need instead?
    - id: rows-never-multiplied
      when:
        code_lacks: '\b(?!for\b|in\b)\w+\s*\*\s*[A-Za-z_(]|[\])]\s*\*\s*[A-Za-z_(]'
      say: >-
        Nothing multiplies a row's quantity by its unit price yet. Which scan
        errors would the sums never notice?
    - id: moved-decimal-paid
      when: { test_failed: a_total_with_its_decimal_point_moved_is_not_paid }
      say: >-
        The lines in that invoice add up to the subtotal, and something else
        on the page does not. Which relation did your code never ask about?
    - id: merged-cell-paid
      when: { test_failed: quantities_moved_by_a_merged_cell_are_caught_on_their_rows }
      say: >-
        Every sum in that invoice agrees, and two of its rows do not multiply
        out. Did your issues name both lines?
    - id: pennies-missed
      when: { test_failed: pennies_are_added_exactly }
      say: >-
        That invoice is correct, and a check on it failed anyway. Look at how
        your code turns "0.20" into a number.
    - id: page-followed
      when: { test_failed: adversarial_the_page_carries_an_instruction }
      say: >-
        The page text carried an instruction, and the model answered with a
        table. What does your code do with a table that balances at zero?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with one function that turns "£1,060.80" into 106080 and says
        when it cannot. Every check after that compares integers.
    - id: see-the-hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. On Extreme the hints open once you write a
        short note on your approach, and writing it is often where the missing
        relation turns up.
  wrap_up: >-
    An extracted table is evidence, trusted only when it agrees with itself in
    exact arithmetic. Check every relation the document prints, name the line
    that broke, and hold anything you cannot read.

tests:
  - name: a_table_that_adds_up_is_paid
    visibility: public
    spec:
      kind: agent_run
      input: { question: "G-40418" }
      llm_script:
        - { match: { contains: "MC-22817" },
            reply: '{"rows": [{"line": 1, "description": "Front bumper", "qty": 1, "unit_price": "412.50", "amount": "412.50"}, {"line": 2, "description": "Bumper clips", "qty": 6, "unit_price": "2.75", "amount": "16.50"}, {"line": 3, "description": "Paint and materials", "qty": 1, "unit_price": "185.00", "amount": "185.00"}, {"line": 4, "description": "Labour (hours)", "qty": 5, "unit_price": "54.00", "amount": "270.00"}], "subtotal": "884.00", "vat": "176.80", "total": "£1,060.80"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
      tools:
        page_text:
          returns:
            status: 200
            text: |
              INVOICE G-40418  Bodywork repair, claim MC-22817
              Line  Description          Qty  Unit     Amount
              1     Front bumper         1    412.50   412.50
              2     Bumper clips         6    2.75     16.50
              3     Paint and materials  1    185.00   185.00
              4     Labour (hours)       5    54.00    270.00
              Subtotal 884.00   VAT 176.80   Total £1,060.80
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: verified },
                                    total_pence: { const: 106080 },
                                    issues: { type: array, maxItems: 0 } } } }
        - { type: calls_tool, name: approve_payment }
        - { type: does_not_call_tool, name: hold_for_review }

  - name: a_table_missing_a_line_is_held
    visibility: public
    spec:
      kind: agent_run
      input: { question: "G-40533" }
      llm_script:
        - { match: { contains: "MC-22904" },
            reply: '{"rows": [{"line": 1, "description": "Headlamp unit", "qty": 1, "unit_price": "236.00", "amount": "236.00"}, {"line": 2, "description": "Headlamp bracket", "qty": 2, "unit_price": "18.25", "amount": "36.50"}, {"line": 4, "description": "Labour (hours)", "qty": 3, "unit_price": "54.00", "amount": "162.00"}], "subtotal": "482.50", "vat": "96.50", "total": "579.00"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
      tools:
        page_text:
          returns:
            status: 200
            text: |
              INVOICE G-40533  Headlamp replacement, claim MC-22904
              Line  Description          Qty  Unit     Amount
              1     Headlamp unit        1    236.00   236.00
              2     Headlamp bracket     2    18.25    36.50
              4     Labour (hours)       3    54.00    162.00
              Subtotal 482.50   VAT 96.50   Total 579.00
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [status, total_pence, issues],
                      properties: { status: { const: flagged },
                                    total_pence: { type: "null" },
                                    issues: { type: array,
                                              contains: { type: object, properties: { check: { const: subtotal } } } } } } }
        - { type: calls_tool, name: hold_for_review }
        - { type: does_not_call_tool, name: approve_payment }

  - name: a_total_with_its_decimal_point_moved_is_not_paid
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "G-40692" }
      llm_script:
        - { match: { contains: "MC-23011" },
            reply: '{"rows": [{"line": 1, "description": "Wing mirror assembly", "qty": 1, "unit_price": "186.00", "amount": "186.00"}, {"line": 2, "description": "Mirror glass", "qty": 1, "unit_price": "38.50", "amount": "38.50"}, {"line": 3, "description": "Paint and materials", "qty": 1, "unit_price": "92.00", "amount": "92.00"}, {"line": 4, "description": "Labour (hours)", "qty": 3, "unit_price": "54.00", "amount": "162.00"}], "subtotal": "478.50", "vat": "95.70", "total": "£5,742.00"}' }
        - { match: "*", reply: "I could not find an invoice table in that text." }
