            text: |
              INVOICE G-40692  Mirror replacement, claim MC-23011
              Line  Description          Qty  Unit     Amount
              1     Wing mirror assembly 1    186.00   186.00
              2     Mirror glass         1    38.50    38.50
              3     Paint and materials  1    92.00    92.00
              4     Labour (hours)       3    54.00    162.00
              Subtotal 478.50   VAT 95.70   Total £5,742.00
        approve_payment: { returns: { status: 200, approved: true } }
        hold_for_review: { returns: { status: 200, queued: true } }
