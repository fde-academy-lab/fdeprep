  caption: >-
    Pasted under the instruction, the email reads as more instruction. Inside a
    labelled block it cannot close, it reads as the customer's words.
  direction: lr
  nodes:
    - { id: customer, label: Customer, sub: writes the email, kind: actor, tone: blue, at: [0, 1] }
    - { id: inbox, label: "`read_email`", sub: "from, subject and body", kind: tool, tone: neutral, at: [1, 1] }
    - { id: builder, label: Prompt builder, sub: your `run_agent`, kind: agent, tone: purple, at: [2, 1] }
    - { id: block, label: "`customer_email` block", sub: "labelled, brackets escaped", kind: guard, tone: green, at: [3, 0] }
    - { id: model, label: Model, sub: drafts the reply, kind: model, tone: teal, at: [4, 1] }
    - { id: draft, label: Draft, sub: answers the customer, kind: output, tone: green, at: [5, 0] }
    - { id: refund, label: Refund promised, sub: the draft obeys the paragraph, kind: output, tone: pink, at: [5, 2] }
  edges:
