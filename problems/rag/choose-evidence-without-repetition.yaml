    spec:
      kind: agent_run
      input: { question: "Are tools covered if they are stolen from a van overnight?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=tools stolen from a van overnight)" }
        - { match: { all: [ { contains: "up to 2,000 pounds" }, { contains: "up to 500 pounds" } ] },
            reply: "Final Answer: Yes. Tools are covered up to 2,000 pounds when the van is parked in a garage [t-1], and up to 500 pounds when it is parked on the street [t-2]." }
        - { match: { contains: "up to 2,000 pounds" },
            reply: "Final Answer: Yes. Tools are covered up to 2,000 pounds when the van is parked in a garage [t-1]." }
        - { match: "*", reply: "Final Answer: I could not find that in the policy wording." }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "t-1", source: "Tools cover", score: 0.94,
                  text: "Tools left in a locked van overnight are covered for theft up to 2,000 pounds when the van is parked in a garage." }
              - { id: "t-2", source: "Tools cover", score: 0.89,
                  text: "Tools left in a locked van overnight are covered for theft up to 500 pounds when the van is parked on the street." }
              - { id: "t-3", source: "Tools cover", score: 0.76,
                  text: "Theft of tools from a van left open is not covered at any time of day." }
              - { id: "t-4", source: "Tools cover", score: 0.66,
                  text: "Every tool must be marked with the business postcode before a theft claim is paid." }
              - { id: "t-5", source: "Commercial property", score: 0.57,
                  text: "A police crime reference is needed for every theft claim." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)up to 500 pounds when it is parked on the street" }
        - { type: no_exception }
        - { type: terminates }

reference_md: |
  Search scores every chunk against the query and never against the other
  results, so it cannot know it is returning one paragraph five times. Each
  copy matches the query as well as the others, the copies arrive together
  at the top, and a context of five blocks spends all five on one fact. The
  model then answers the question it has evidence for, which is a different
  question from the one it was asked.

  Order of operations is the first decision. Deduplicate and then take five.
  Taking five and then deduplicating looks equivalent and leaves one block
  where there were five, with the answer still at rank six. Dropping the cap
  instead lets every chunk in, including the commercial property rule that
  ranked tenth and contradicts the flood wording.

  The second decision is what a candidate is compared with. Copies are
  rarely neighbours in a real ranking, because something else scores between
  them, and a check against the last kept block lets each of them back in.
  Comparing with everything kept costs a few set operations over five
  blocks.

  The third is what counts as a copy, and it has two ways to be wrong. Exact
  string equality misses copies that differ by a product name, which is how
  syndicated paragraphs usually differ. Deduplicating by source is wrong in
  both directions at once: the five copies come from five pages, and the
  flood page alone holds several different facts. Wording is the signal, and
  the threshold is published so a reviewer can argue with it.

  The excess case is why the threshold sits high. The two excess sentences
  share more than half their words and differ in the amount, which is the
  part the broker asked about. A rule that merged them would pass every copy
  test and answer the question wrongly. Word overlap has a limit worth
  knowing here too: two long paragraphs that differ only in a number can
  clear 0.8, so the next rule a production system adds is that chunks with
  different numbers are never copies.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Your top five retrieved chunks are the same paragraph copied onto five pages. What do you change, and where in the pipeline?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: search
    args: query
    returns: A status and up to ten candidate `chunks`, best first, each with an `id`, a `source`, a `score`
      and its `text`.
example:
  case: keeps_five_distinct_chunks
  expect: 'No two of the five chunks are near-duplicates, so all five go in as [<id>] <text> blocks, and
    the answer names both exclusions: fences, gates and hedges, and a building already in poor repair.'
traps:
  - Taking the top five results and removing copies afterwards, which leaves one block where five fitted
    and the answer still outside the prompt.
  - Comparing a candidate with the last block kept, which lets a copy back in when another result ranked
    between the two.
  - Deduplicating by exact text or by `source`, which misses copies that differ by a product name and
    drops different facts from one page.
  - Measuring overlap against one text's words, or with a bar below 0.8, which merges two sentences that
    set different amounts.
