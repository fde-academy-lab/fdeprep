slug: choose-evidence-without-repetition
title: A broker asks about surveyors and gets the claim deadline
day: 12
skill: Stop five copies of one paragraph filling the context
artefact_type: code
difficulty: medium
track: rag
est_minutes: 30
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: context-assembly, weight: 1.0 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A commercial insurer's broker desk has an assistant that answers questions
  from the policy wordings. Five product pages carry the same paragraph about
  reporting a claim within 30 days, word for word apart from the product
  name.

  Last Thursday a broker asked whether a flood claim needs a surveyor visit
  before repairs start. Search returned the reporting paragraph from all five
  pages as its top five results. The context holds five blocks, so the model
  read one fact five times and answered it: report the claim within 30 days.
  The paragraph about surveyors ranked sixth and never reached the prompt,
  the customer's builder started on the Monday, and the claim is now
  disputed.

  Choose the five blocks so that a copy never takes a place from a new fact.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: search(query=<text>)` or
  `Final Answer: <text>`. `search` returns up to ten candidates, best first:

      {"status": 200, "chunks": [{"id": "p-1", "source": "Property cover",
                                  "score": 0.93, "text": "..."}]}

  Put at most five blocks in the prompt, each written as `[<id>] <text>`.
  Walk the candidates in the order search returned them. Keep a candidate
  unless it is a near-duplicate of a block you already kept, and stop when
  five are kept.

  Two texts are near-duplicates when their word overlap is 0.8 or more.
  The words of a text are its lowercased runs of letters and digits, and

      overlap(a, b) = len(words(a) & words(b)) / len(words(a) | words(b))

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  MAX_BLOCKS = 5
  NEAR_DUPLICATE = 0.8


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"

      for _ in range(6):
          output = llm(scratchpad)

          if "Final Answer:" in output:
              return output.split("Final Answer:", 1)[1].strip()

          action = re.search(r"Action:\s*search\(query=(.*?)\)", output)
          if action is None:
              scratchpad += f"{output}\nThat was not a valid action.\n"
              continue

          result = tools["search"](query=action.group(1).strip()) or {}
          chosen = choose(result.get("chunks") or [])
          # TODO 1: write each chosen chunk into the scratchpad as [<id>] <text>

      return "I could not find that in the policy wording."


  def words(text: str) -> set:
      """Lowercased runs of letters and digits."""
      return set(re.findall(r"[a-z0-9]+", text.lower()))


  def overlap(a: str, b: str) -> float:
      """Shared words over all the words either text uses, from 0 to 1."""
      # TODO 2: compare words(a) with words(b)
      return 0.0


  def choose(chunks: list) -> list:
      """At most MAX_BLOCKS chunks, best first, with no near-duplicates."""
      # TODO 3: walk the chunks in order, skip any that overlaps a chunk you
      #         already kept by NEAR_DUPLICATE or more, and stop at MAX_BLOCKS
      return chunks[:MAX_BLOCKS]

steps:
  - id: s1
    text: Write each chosen chunk into the scratchpad as [<id>] <text>.
    check_id: s1
  - id: s2
    text: Make `overlap()` return the shared words over all the words used.
    check_id: s2
  - id: s3
    text: Keep a candidate only when it is below 0.8 against every block kept, and stop at five.
    check_id: s3

step_checks:
  # Reads keeps_five_distinct_chunks, whose answer needs the first and the
  # fifth block in the prompt.
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: '(?i)poor repair' }
  # s2 and s3 carry their own cases, because every public chunk is distinct
  # and neither public search returns more than five, so the stub's first
  # five are already the right five. Both show once s3 uses overlap().
  #
  # In s2's case the answer needs w-3 and w-6. w-2 is a copy of w-1, with
  # overlap 0.9, so an overlap of 0 keeps it and w-6 does not fit in five.
  # w-3 shares 18 words with w-1 and states a different fact: its overlap is
  # 18/23, below 0.8, while shared words over the shorter text, the longer
  # text or their average all come to 0.8 or more, so those formulas drop it.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "Does the landlord policy cover a burst pipe while the flat is empty?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=burst pipe in an empty flat)" }
        - { match: { contains: "[w-2]" },
            reply: "Final Answer: Landlord cover pays for damage from a burst pipe while the flat is empty for up to 60 days in a row [w-1]." }
        - { match: { regex: '\[w-3\][\s\S]*\[w-6\]' },
            reply: "Final Answer: Landlord cover pays for the damage [w-1] and for tracing and fixing the pipe [w-3] while the flat is empty for up to 60 days in a row, as long as the flat is inspected once a week [w-6]." }
        - { match: "*", reply: "Final Answer: I could not find that in the policy wording." }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "w-1", source: "Landlord cover", score: 0.91,
                  text: "Landlord cover pays for damage from a burst pipe while the flat is empty for up to 60 days in a row." }
              - { id: "w-2", source: "Home cover", score: 0.90,
                  text: "Home cover pays for damage from a burst pipe while the flat is empty for up to 60 days in a row." }
              - { id: "w-3", source: "Landlord cover", score: 0.86,
                  text: "Landlord cover pays for tracing and fixing the burst pipe while the flat is empty for up to 60 days in a row." }
              - { id: "w-4", source: "Landlord cover", score: 0.74,
                  text: "Lost rent is paid for up to 9 months while the flat cannot be let after an escape of water." }
              - { id: "w-5", source: "Landlord cover", score: 0.69,
                  text: "Landlord cover carries a 350 pound excess on every escape of water claim." }
              - { id: "w-6", source: "Landlord cover", score: 0.63,
                  text: "An empty flat must be inspected inside and out at least once a week, and each visit must be written down." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: 'tracing and fixing the pipe[\s\S]*inspected once a week' }
  # In s3's case v-3 is a copy of v-1 with another block ranked between
  # them, so a check against the last block kept lets it in. Six distinct
  # blocks remain, so a loop that does not stop at five lets v-7 in.
  - step_id: s3
    spec:
      kind: agent_run
      input: { question: "What should a shop owner do with stock ruined in a flood?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=stock ruined in a flood)" }
        - { match: { contains: "[v-3]" },
            reply: "Final Answer: Shop cover pays for stock damaged by flood water once the loss adjuster has seen it [v-1]." }
        - { match: { contains: "[v-7]" },
            reply: "Final Answer: Refrigerated stock is covered if it spoils after a power cut of more than 6 hours [v-7]." }
        - { match: { contains: "[v-6]" },
            reply: "Final Answer: Keep the damaged stock until the loss adjuster has inspected it, and photograph it before any of it is thrown away [v-6]. Shop cover then pays for it [v-1]." }
        - { match: "*", reply: "Final Answer: I could not find that in the policy wording." }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "v-1", source: "Shop cover", score: 0.92,
                  text: "Shop cover pays for stock damaged by flood water once the loss adjuster has seen it." }
              - { id: "v-2", source: "Shop cover", score: 0.88,
                  text: "Stock in a basement store must be kept at least 15 centimetres off the floor." }
              - { id: "v-3", source: "Office cover", score: 0.87,
                  text: "Office cover pays for stock damaged by flood water once the loss adjuster has seen it." }
              - { id: "v-4", source: "Shop cover", score: 0.81,
                  text: "Glass in the shop front is covered up to 10,000 pounds for each pane." }
              - { id: "v-5", source: "Business interruption", score: 0.77,
                  text: "Business interruption after a flood is paid for up to 24 months." }
              - { id: "v-6", source: "Shop cover", score: 0.72,
                  text: "Keep damaged stock until the loss adjuster has inspected it, and photograph it before any of it is thrown away." }
              - { id: "v-7", source: "Shop cover", score: 0.64,
                  text: "Refrigerated stock is covered for spoiling after a power cut of more than 6 hours." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '(?i)photograph it before any of it is thrown away' }

hints:
  - Print the ids and the first ten words of the five blocks your loop sends
    for the flood question. Count how many different facts they hold.
  - Search scores each chunk against the query and never against the other
    results, so identical paragraphs score the same and arrive side by side.
  - Decide before a candidate takes a place. Compare it with every block
    already kept, skip it at 0.8 or more, and stop when five are kept.
  - Two sentences that differ in a number are two facts. A threshold low
    enough to merge them is lower than the published 0.8.

scenario:
  who: The broker desk at a commercial insurer
  situation: >-
    A broker asked whether a flood claim needs a surveyor visit before repairs
    start. Search's top five were one paragraph about reporting claims within
    30 days, copied onto five product pages.
  stakes: >-
    The assistant answered with the 30 day rule. The customer's builder
    started before a surveyor saw the damage, and the claim is now disputed.
  metrics:
    - { label: Copies in the top five, value: "5" }
    - { label: Rank of the answer, value: 6th }
    - { label: Blocks in the context, value: "5" }

diagram:
  title: Where one paragraph takes all five places
  caption: >-
    Search scores each chunk alone, so copies arrive together. Skip a
    near-duplicate of anything already kept before the five places fill.
  direction: lr
  nodes:
    - { id: broker, label: Broker, sub: asks about a flood survey, kind: actor, tone: blue, at: [0, 1] }
    - { id: search, label: search, sub: scores each chunk on its own, kind: tool, tone: neutral, at: [1, 0] }
    - { id: loop, label: Agent loop, sub: fills five places, kind: agent, tone: purple, at: [1, 1] }
    - { id: topk, label: Top five as returned, sub: the same paragraph five times, kind: decision, tone: pink, at: [2, 0] }
    - { id: dedup, label: Skip near-duplicates, sub: compare with every block kept, kind: guard, tone: green, at: [2, 2] }
    - { id: model, label: Model, sub: answers what it has evidence for, kind: model, tone: teal, at: [3, 1] }
    - { id: wrong, label: Report within 30 days, sub: an answer to a different question, kind: output, tone: pink, at: [4, 0] }
    - { id: right, label: Surveyor first, sub: the sixth result gets a place, kind: output, tone: green, at: [4, 2] }
  edges:
    - { from: broker, to: loop, label: question, step: 1 }
    - { from: loop, to: search, label: query, step: 2 }
    - { from: search, to: loop, label: "ten candidates, best first", step: 3 }
    - { from: loop, to: topk, label: take five, tone: danger }
    - { from: topk, to: model, label: "one fact, five times", tone: danger }
    - { from: model, to: wrong, label: answers from it, tone: danger }
    - { from: loop, to: dedup, label: walk the list, tone: success }
    - { from: dedup, to: model, label: five different facts, tone: success }
    - { from: model, to: right, label: answers the question, tone: success }

approach:
  goal: Spend five places on five different facts
  branches:
    - label: See why copies cluster
      detail: Search scores each chunk against the query, never against the other results.
      leaves: [every copy scores about the same, so copies arrive together]
    - label: Deduplicate before you cut
      leaves: [walk the list best first, stop at five kept rather than five read]
    - label: Compare with everything kept
      leaves: [copies are rarely neighbours, five blocks is a cheap comparison]
    - label: Let wording decide
      leaves: [a product name changes one word, one page holds several facts]

coach:
  opening: >-
    Look at how the five blocks are chosen. The question is what happens when
    the best five results all say the same thing.
  signals:
    - id: top-five-as-returned
      when:
        code_matches: '\[\s*:\s*(5|MAX_BLOCKS)\s*\]'
        code_lacks: '[<>]=?\s*(NEAR_DUPLICATE|0?\.8)\b|\bNEAR_DUPLICATE\s*[<>]'
      say: >-
        The five blocks are the first five results as they came. What reaches
        the model when those five are one paragraph copied onto five pages?
    - id: no-overlap-threshold
      when: { code_lacks: '[<>]=?\s*(NEAR_DUPLICATE|0?\.8)\b|\bNEAR_DUPLICATE\s*[<>]' }
      say: >-
        Nothing compares an overlap with NEAR_DUPLICATE yet. Two copies that
        differ by a product name are different strings, so how would your loop
        know they are one paragraph?
    - id: compares-with-last-only
      when: { code_matches: '(overlap|similar\w*|near\w*|dup\w*)\([^)\n]*\[\s*-1\s*\]' }
      say: >-
        Each candidate is compared with the last block kept. What happens to a
        copy when something else ranked between it and the original?
    - id: hidden-five-copies
      when: { test_failed: five_copies_of_one_paragraph_leave_room_for_the_answer }
      say: >-
        Search's top five in that run are one paragraph from five product
        pages. List the ids your loop keeps: there should be five, and no two
        should say the same thing.
    - id: hidden-copies-apart
      when: { test_failed: a_copy_further_down_the_list_is_still_a_copy }
      say: >-
        The copies in that run are not next to each other in the ranking. What
        does each candidate get compared with before you keep it?
    - id: hidden-similar-facts
      when: { test_failed: two_facts_that_share_wording_are_both_kept }
      say: >-
        Two chunks in that run share most of their wording and differ in the
        number. Work out their overlap by hand and compare it with 0.8.
    - id: hidden-limits-worded-alike
      when: { test_failed: two_limits_worded_alike_are_both_kept }
      say: >-
        Two chunks in that run differ in three words each and set different
        theft limits. Divide the words they share by all the words either one
        uses, and compare that with 0.8. Dividing by one text's words gives a
        higher number.
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1 so the public tests run. Then write `overlap()` and try
        it on two copies of the reporting paragraph: it should come out above
        0.8.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are open, and the second one names
        why copies arrive together.
  wrap_up: >-
    Search ranks each chunk on its own, so five copies of one paragraph all
    rank well. Deduplicate before you cut to the context size, compare with
    everything you kept, and let wording decide what counts as a copy.

tests:
  - name: answers_from_the_best_chunk
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Is accidental damage to a laptop covered on the contents policy?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=laptop accidental damage contents)" }
        - { match: { contains: "[c-1] Accidental damage" },
            reply: "Final Answer: Yes, away from home too, when the gadget extension is on the schedule [c-1]." }
        - { match: "*", reply: "Final Answer: I could not find that in the policy wording." }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "c-1", source: "Contents cover", score: 0.88,
                  text: "Accidental damage to laptops and phones is covered away from home when the gadget extension is on the schedule." }
              - { id: "c-2", source: "Contents cover", score: 0.64,
                  text: "Contents cover pays for items lost or damaged inside the home by fire, flood, theft or escape of water." }
              - { id: "c-3", source: "Contents cover", score: 0.41,
                  text: "Bicycles over 1,500 pounds must be listed on the schedule." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: search }
        - { type: returns_matches, value: "(?i)gadget extension" }
        - { type: llm_calls_at_most, value: 3 }

  - name: keeps_five_distinct_chunks
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What does the storm cover exclude?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=storm cover exclusions)" }
        - { match: { all: [ { contains: "[s-1] Storm damage to fences" }, { contains: "[s-5] Damage from a storm" } ] },
            reply: "Final Answer: It excludes fences, gates and hedges [s-1], and damage to a building that was already in poor repair [s-5]." }
        - { match: { contains: "[s-1] Storm damage to fences" },
            reply: "Final Answer: It excludes fences, gates and hedges [s-1]." }
        - { match: "*", reply: "Final Answer: I could not find that in the policy wording." }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "s-1", source: "Storm cover", score: 0.90,
                  text: "Storm damage to fences, gates and hedges is not covered." }
              - { id: "s-2", source: "Storm cover", score: 0.80,
                  text: "Storm cover pays for damage caused by winds of 55 miles an hour or more." }
              - { id: "s-3", source: "Storm cover", score: 0.70,
                  text: "A storm claim needs photographs taken before any temporary repair." }
              - { id: "s-4", source: "Storm cover", score: 0.60,
                  text: "Roof repairs after a storm are made by our approved roofers." }
              - { id: "s-5", source: "Storm cover", score: 0.50,
                  text: "Damage from a storm to a building that was already in poor repair is not covered." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)poor repair" }
        - { type: no_exception }
        - { type: terminates }

