slug: resolve-a-follow-up-without-changing-intent
title: A customer is told where somebody else's parcel is
day: 14
skill: Resolve "what about the other one" without borrowing someone else's order
artefact_type: code
difficulty: hard
track: rag
est_minutes: 35
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: context-assembly, weight: 1.0 }
  - { slug: prompt-hardening, weight: 0.5 }
call_budget: 4
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  Support runs one shared session per queue, not per customer, because that
  was cheaper to build and nobody expected the agent to read across it.

  A customer asked "and what about the other one?". The agent rewrote the
  follow-up using the conversation so far, the conversation so far contained
  the previous customer's ticket, and the rewritten query went out as "what is
  the status of order Z-9114". Order Z-9114 belongs to somebody else. The
  agent then told this customer where that parcel was.

  Rewriting a follow-up needs context. It does not need all of it.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  The question arrives as `customer=<id>|<text>`.

  `llm(prompt)` returns `Action: history()`, or `Rewrite: <standalone query>`,
  or `Final Answer: <text>`.

  `history()` returns

      {"status": 200, "turns": [{"n": 1, "customer_id": "c-1", "text": "..."}]}

  and may return nothing at all. `search(query=...)` returns
  `{"status": 200, "chunks": [{"id": "...", "text": "..."}]}`.

  Rules:

  - Only turns whose `customer_id` equals the current customer may be put in
    the prompt. Not summarised, not paraphrased, not included with a warning.
  - If those turns contain no order reference, return
    "I need to know which order you mean." and do not search. An order
    reference is a capital letter, a hyphen and three to six digits, such as
    `A-1188`.
  - Otherwise send the rewritten query to `search` and answer from what comes
    back.

  Budget: at most 4 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  ASK = "I need to know which order you mean."


  def split_question(question: str) -> tuple:
      """Return (customer_id, text) from "customer=<id>|<text>"."""
      raise NotImplementedError


  def order_references(turns: list) -> list:
      """Order references such as A-1188 in these turns' text, in order."""
      raise NotImplementedError


  def run_agent(question: str, llm, tools: dict) -> str:
      """Resolve a follow-up from this customer's own turns, or ask.

      question is "customer=<id>|<text>". llm(prompt) replies with one of:
          Action: history()
          Rewrite: <standalone query>
          Final Answer: <text>

      tools["history"]() returns {"status": 200, "turns": [
          {"n": 1, "customer_id": "c-1", "text": "..."}]}, or nothing at all.
      tools["search"](query=...) returns {"status": 200, "chunks": [
          {"id": "...", "text": "..."}]}.

      Only this customer's turns may reach the prompt. When they hold no
      order reference, return ASK without searching. Otherwise send the
      Rewrite to search and answer from what comes back.

      At most 4 model calls. Allowed imports: json, re.
      """
      return ASK

hints:
  - "Look at what `history()` returns and whose turns they are. The session belongs to the queue, so it holds more than one customer."
  - Once another customer's order id is in the prompt, "the other one" has a
    referent, and a model asked to resolve it will use the nearest one.
  - The filter goes on before the turns reach the prompt, not on the rewrite
    afterwards.
  - Asking the customer which order they mean is a correct answer here, and it
    is cheaper than the alternative.
  - The history tool can return nothing. That is the same situation as having
    no referent, not a different one.

scenario:
  who: The support queue at a parcel delivery service
  situation: >-
    A customer asked "and what about the other one?". The agent rewrote it from
    a session shared by the whole queue, which still held the previous
    customer's ticket, and searched for order Z-9114.
  stakes: >-
    Z-9114 belongs to somebody else, and the agent told this customer where
    that parcel was. That is a data protection incident rather than a wrong
    answer.
  metrics:
    - { label: Sessions for the queue, value: "1" }
    - { label: Customers in that session, value: "2" }
    - { label: Order it disclosed, value: Z-9114 }

diagram:
  title: Where another customer's order becomes the referent
  caption: >-
    The session holds everyone in the queue. Keep this customer's turns before
    any reach the prompt, and ask when none of them names an order.
  direction: lr
  nodes:
    - { id: customer, label: Customer c-4, sub: and what about the other one, kind: actor, tone: blue, at: [0, 1] }
    - { id: history, label: Session history, sub: one session for the whole queue, kind: store, tone: orange, at: [1, 0] }
    - { id: loop, label: Agent loop, sub: builds the rewrite prompt, kind: agent, tone: purple, at: [1, 1] }
    - { id: filter, label: Customer filter, sub: keeps turns whose `customer_id` matches, kind: guard, tone: green, at: [2, 1] }
    - { id: model, label: Model, sub: rewrites the follow-up, kind: model, tone: teal, at: [3, 0] }
    - { id: search, label: search, sub: finds whatever it is asked for, kind: tool, tone: neutral, at: [4, 0] }
    - { id: leak, label: Z-9114 status, sub: "a stranger's parcel, told to c-4", kind: output, tone: pink, at: [4, 1] }
    - { id: ask, label: Ask which order, sub: no search and no guess, kind: output, tone: teal, at: [3, 2] }
  edges:
    - { from: customer, to: loop, label: follow-up, step: 1 }
    - { from: loop, to: history, label: "`history()`", step: 2 }
    - { from: history, to: loop, label: every customer's turns, step: 3 }
    - { from: loop, to: filter, label: turns, step: 4 }
    - { from: filter, to: model, label: this customer's turns only, tone: success }
    - { from: filter, to: ask, label: no order reference left, tone: success }
    - { from: history, to: model, label: pasted in whole, tone: danger }
    - { from: model, to: search, label: "Rewrite: status of Z-9114", tone: danger }
    - { from: search, to: leak, label: answered, tone: danger }

approach:
  goal: Resolve the follow-up from this customer's own words, or ask
  branches:
    - label: Know whose turns these are
      leaves: [the session belongs to the queue, every turn carries a `customer_id`]
    - label: Filter before the prompt
      detail: A turn that is not in the prompt cannot be used. An instruction to ignore one is a request.
      leaves: [keep this customer's turns, drop the rest before writing anything]
    - label: Ask when nothing refers
      leaves: [no order reference means ask, no search and no guess]
    - label: Treat nothing as no referent
      leaves: [history can return nothing at all, one branch for both cases]

coach:
  opening: >-
    Look at what `history()` returns and ask whose turns they are. The session
    is shared by the whole queue.
  signals:
    - id: instructs-instead-of-filtering
      when:
        code_matches: '(?i)scratchpad\s*\+=[^\n]*\b(only|ignore)\b[^\n]*(customer|turn)'
        code_lacks: '(\.get\(|\[)\s*[''"]customer_id[''"]'
      say: >-
        Your prompt asks the model to use only this customer's turns, and every
        turn is still in it. What stops the model reading the ones it was asked
        to skip?
    - id: no-customer-filter
      when: { code_lacks: '(\.get\(|\[)\s*[''"]customer_id[''"]' }
      say: >-
        Nothing reads a turn's `customer_id` yet, so every customer in the queue
        reaches the prompt. Which turns belong to the person asking?
    - id: hidden-another-customers-order
      when: { test_failed: another_customers_order_never_reaches_the_prompt }
      say: >-
        In that session the only order reference belongs to a different
        customer. What does this customer's own history give the model to work
        with?
    - id: hidden-only-this-customer
      when: { test_failed: only_this_customers_turns_reach_the_prompt }
      say: >-
        In that session this customer named an order, and so did another
        customer. The answer was right, and the other customer's order still
        reached the model. Which turns does your code put in the prompt?
    - id: hidden-no-referent
      when: { test_failed: no_referent_means_ask_rather_than_search }
      say: >-
        This customer's own turns in that session mention no order at all. What
        should happen before any search runs?
    - id: adversarial-nothing
      when: { test_failed: adversarial_the_history_tool_returns_nothing }
      say: >-
        `history()` answered with nothing at all in that run. Does your loop
        treat that the same way as a history with no order in it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with `split_question`, then keep only the turns whose `customer_id`
        matches and print them for the first public case. Nobody else's turns
        should appear.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are open, and the first two narrow
        where the leak happens without writing the filter for you.
  wrap_up: >-
    Shared context is the default in production: one session per queue, one
    index per client. Filter by whose data it is before the model sees any of
    it, and remember that asking is always a legal answer.

defence_question: |
  A reviewer proposes keeping all the turns in the prompt and adding a line
  telling the model to use only the ones belonging to the current customer.
  It would be a smaller change and it reads as safer to them, because nothing
  gets thrown away. Why is it not safer?

tests:
  - name: resolves_a_follow_up_from_the_customers_own_turns
    visibility: public
    spec:
      kind: agent_run
      input: { question: "customer=c-1|and what about the other one?" }
      llm_script:
        - { match: { contains: "depot 4" }, reply: "Final Answer: Order A-1188 is at depot 4." }
        - { match: { contains: "A-1188" }, reply: "Rewrite: status of order A-1188" }
        - { match: "*", reply: "Action: history()" }
      tools:
        history:
          returns:
            status: 200
            turns:
              - { n: 1, customer_id: "c-1", text: "I have two parcels, A-1187 and A-1188." }
              - { n: 2, customer_id: "c-1", text: "Where is A-1187?" }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order A-1188 is at depot 4 awaiting collection." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: search }
        - { type: returns_matches, value: "(?i)depot 4" }
        - { type: llm_calls_at_most, value: 4 }

  - name: answers_a_standalone_question
    visibility: public
    spec:
      kind: agent_run
      input: { question: "customer=c-2|where is order B-3300?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: history()" }
        - { match: { contains: "out for delivery" },
            reply: "Final Answer: Order B-3300 is out for delivery." }
        - { match: "*", reply: "Rewrite: status of order B-3300" }
      tools:
        history:
          returns:
            status: 200
            turns:
              - { n: 1, customer_id: "c-2", text: "Hello, chasing order B-3300." }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order B-3300 is out for delivery today." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)out for delivery" }
        - { type: no_exception }
        - { type: terminates }

  - name: another_customers_order_never_reaches_the_prompt
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "customer=c-4|and what about the other one?" }
      llm_script:
        - { match: { contains: "Z-9114" },
            reply: "Final Answer: Order Z-9114 was delivered on Tuesday." }
        - { match: { contains: "which order you mean" },
            reply: "Final Answer: Ask the customer which order they mean." }
        - { match: "*", reply: "Action: history()" }
      tools:
        history:
          returns:
            status: 200
            turns:
              - { n: 1, customer_id: "c-3", text: "Chasing order Z-9114 please." }
              - { n: 2, customer_id: "c-3", text: "Thanks, that is sorted." }
              - { n: 3, customer_id: "c-4", text: "Morning, I have a question." }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order Z-9114 was delivered on Tuesday." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)which order you mean" }
        - { type: does_not_call_tool, name: search }
        - { type: terminates }

  # In the case above this customer names no order, so the loop asks before
  # any turn reaches a prompt. Here this customer names two orders and the
  # session also holds another customer's. The scripted rewrite reads only
  # this customer's order, so a prompt that carried the other turn as well,
  # with a warning or without one, got the same answer. prompt_lacks reads
  # the prompt for the other customer's order.
  - name: only_this_customers_turns_reach_the_prompt
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "customer=c-7|and the other one?" }
      llm_script:
        - { match: { contains: "depot 2" },
            reply: "Final Answer: Order A-2202 is at depot 2 awaiting collection." }
        - { match: { contains: "A-2202" }, reply: "Rewrite: status of order A-2202" }
        - { match: "*", reply: "Action: history()" }
      tools:
        history:
          returns:
            status: 200
            turns:
              - { n: 1, customer_id: "c-8", text: "Where is order Z-7730? It was due yesterday." }
              - { n: 2, customer_id: "c-7", text: "I ordered two lamps, A-2201 and A-2202." }
              - { n: 3, customer_id: "c-7", text: "A-2201 came this morning, thank you." }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order A-2202 is at depot 2 awaiting collection." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: prompt_lacks, value: 'Z-7730' }
        - { type: returns_matches, value: "A-2202 is at depot 2" }

  - name: no_referent_means_ask_rather_than_search
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "customer=c-5|and the other one?" }
      llm_script:
        - { match: { contains: "C-2001" }, reply: "Final Answer: Order C-2001 is in transit." }
        - { match: "*", reply: "Action: history()" }
      tools:
        history:
          returns:
            status: 200
            turns:
              - { n: 1, customer_id: "c-9", text: "My order C-2001 has not arrived." }
              - { n: 2, customer_id: "c-5", text: "Hi there." }
              - { n: 3, customer_id: "c-5", text: "Are you still there?" }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order C-2001 is in transit." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)which order you mean" }
        - { type: does_not_call_tool, name: search }
        - { type: no_exception }

  - name: adversarial_the_history_tool_returns_nothing
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The history service was mid-deploy and answered with nothing at all. A
      loop that reads `result["turns"]` raises here, and a loop that treats a
      missing history as an empty one is correct.

      What the loop must not do is treat "I have no context" as "I have no
      constraint". Having nothing to resolve the follow-up against is exactly
      the case where asking the customer is the answer, and it is the case
      where a loop that guesses guesses from whatever is nearest.
    spec:
      kind: agent_run
      input: { question: "customer=c-6|and what about the other one?" }
      llm_script:
        - { match: { contains: "D-4000" }, reply: "Final Answer: Order D-4000 is at the depot." }
        - { match: "*", reply: "Action: history()" }
      tools:
        history: { fixture: empty_tool_result }
        search:
          returns:
            status: 200
            chunks:
              - { id: "s1", text: "Order D-4000 is at the depot." }
      budget: { max_llm_calls: 4, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: "(?i)which order you mean" }
        - { type: does_not_call_tool, name: search }

reference_md: |
  The filter goes on the turns, before the prompt exists. Everything else is
  detail.

  Filtering afterwards does not work, and the reason is worth being precise
  about. Once another customer's order id is in the prompt, the model has a
  concrete, plausible referent for "the other one", and "the other one" is
  exactly the phrase that is looking for a referent. A check on the rewrite
  can catch `Z-9114` if you know to look for it, and cannot catch a rewrite
  that says "the second parcel the customer mentioned" and means somebody
  else's.

  Instructing the model to ignore the other customer's turns is the same
  mistake with a politeness layer. It puts the data in the context and then
  asks for a behaviour, and the whole reason this platform has a rule about
  learner code and model endpoints is that behaviours asked for are not
  controls. A turn that is not in the prompt cannot be used.

  Asking the customer is the part learners leave out, because it feels like
  failing. It is the cheapest correct answer available: one question, no
  search, and no chance of telling somebody where a stranger's parcel is. The
  version that guesses is right most of the time, and the times it is wrong
  are a data protection incident rather than a bad answer.

  A history service returning nothing lands in the same place as a history
  with no referent, and that is not a coincidence. Both mean the loop does not
  know which order is meant. A loop that has one branch for "no context" and
  another for "no referent" has two chances to get this wrong.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    A customer asks "what about the other one". What does your system have to hold on to, and what must it refuse to guess?
  source: |
    Author judgement. No employer frequency data stands behind it.
