slug: fuse-lexical-and-semantic-rankings
title: An engineer replaces the wrong part and a printer stays down
day: 14
skill: Merge keyword and vector search results by their rank in each list
artefact_type: code
difficulty: hard
track: rag
est_minutes: 35
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: context-assembly, weight: 0.5 }
  - { slug: tool-error-handling, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A managed print company's field engineers ask an assistant for the fix
  before they drive to a site. It searches the service knowledge base two
  ways: keyword search, which is good at exact error codes, and vector
  search, which is good at descriptions of a fault. It merges the two lists
  by score.

  Last week an engineer asked about an M400 showing E-4102 that would not
  pull paper from tray 2. Keyword search put three pages that mention E-4102
  on top: a firmware note, another model's code index and a fuser fault on
  that model. Vector search put three general pages about paper feed
  problems on top. The runbook that answers it, a worn tray 2 pick roller on the M400,
  was fourth in both. Merging by score kept keyword search's top three,
  because keyword scores run to 20 and vector scores stop at 1. The engineer
  replaced the fuser, and the customer's printer was down for two more days.

  Fuse the two rankings with the published rule, so a chunk both searches
  rate highly reaches the prompt.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: search(query=<text>)` or
  `Final Answer: <text>`. On a search, call both retrievers with the query:

      tools["keyword_search"](query=...)   BM25 over the knowledge base
      tools["vector_search"](query=...)    embeddings over the same chunks

  Each returns its results best first:

      {"status": 200, "results": [{"id": "kb-12", "score": 11.8, "text": "..."}]}

  Keyword scores run from 0 to about 20 and vector scores from 0 to 1, so a
  score from one list says nothing about a score from the other. Fuse the
  lists by reciprocal rank fusion with k = 60:

      fused(id) = the sum, over the lists that contain id, of 1 / (60 + rank)

  `rank` is the id's position in that list, counting from 1. An id that
  appears again later in the same list counts once, at its first position.
  An id missing from a list gets nothing from it. Order ids by fused score,
  highest first, and break a tie by id in ascending order.

  Write the top 3 into the prompt as `[<id>] <text>`, in fused order, and
  return the model's Final Answer. A retriever that raises, or returns
  anything other than a list of results, counts as an empty list.

  Budget: at most 3 model calls. Allowed imports: json, re.

defence_question: |
  A colleague proposes normalising each list's scores to the range 0 to 1
  and adding them, because ranks throw away how far ahead the first result
  was. Describe a query where their version puts the wrong chunk first and
  yours does not, and say what would have to be true of the two retrievers
  before you switched to theirs.

stub_code: |
  import json
  import re

  K = 60
  TOP = 3


  def ranks(results: list) -> dict:
      """Map each id to its position in results, counting from 1. An id that
      appears again later keeps its first position."""
      raise NotImplementedError


  def fuse(lexical: list, semantic: list) -> list:
      """Every result from either list, highest fused score first. An id earns
      one over (K plus its rank) from each list it is in, and a tie goes to
      the smaller id."""
      raise NotImplementedError


  def run_agent(question: str, llm, tools: dict) -> str:
      """Answer from the chunks the two searches rate highest together.

      llm(prompt) returns "Action: search(query=<text>)" or "Final Answer: <text>".
      On a search, call tools["keyword_search"](query=...) and
      tools["vector_search"](query=...). Each returns
          {"status": 200, "results": [{"id": "kb-12", "score": 11.8, "text": "..."}]}
      best first, with scores on different scales.

      Write the TOP fused results into the prompt as [<id>] <text>, in fused
      order, and return the model's Final Answer. A retriever that raises or
      returns something else counts as an empty list.

      At most 3 model calls. Allowed imports: json, re.
      """
      return "I could not find that in the knowledge base."

hints:
  - Print the three chunks your merge keeps for the E-4102 question, and next
    to each, the list it came from and its score.
  - A keyword score of 12 and a vector score of 0.8 are on different scales,
    so sorting their union by score sorts it by which retriever answered.
  - Positions are comparable where scores are not. Give each chunk 1 / (60 +
    rank) from every list it appears in, and add them up.
  - "Three details decide the edge cases: an id counts once per list, at its
    first position; an id missing from a list gets nothing from it; and ties
    go to the smaller id."
  - A retriever that raises or returns nothing is an empty list. The other
    list can still answer the question.

scenario:
  who: Field engineering at a managed print company
  situation: >-
    An M400 showed E-4102 and would not feed from tray 2. The runbook for it
    ranked fourth in keyword search and fourth in vector search, and merging
    by score kept keyword search's top three.
  stakes: >-
    The engineer replaced the fuser instead of the pick roller, and the
    customer's printer was down for two more days.
  metrics:
    - { label: Runbook rank in each list, value: 4th and 4th }
    - { label: Keyword scores, value: 0 to 20 }
    - { label: Vector scores, value: 0 to 1 }

diagram:
  title: Where a chunk both searches rank fourth loses to one search's top three
  caption: >-
    Scores from two retrievers are on different scales, so sorting their
    union by score sorts it by retriever. Fuse the two lists by rank.
  direction: lr
  nodes:
    - { id: engineer, label: Field engineer, sub: "M400, E-4102, tray 2", kind: actor, tone: blue, at: [0, 1] }
    - { id: keyword, label: "`keyword_search`", sub: exact codes and scores up to 20, kind: tool, tone: neutral, at: [1, 0] }
    - { id: vector, label: "`vector_search`", sub: descriptions and scores up to 1, kind: tool, tone: neutral, at: [1, 2] }
    - { id: byscore, label: Sort by score, sub: keyword scores always win, kind: decision, tone: pink, at: [2, 0] }
    - { id: fusion, label: Rank fusion, sub: "1 / (60 + rank), summed per chunk", kind: guard, tone: green, at: [2, 2] }
    - { id: model, label: Model, sub: answers from the top three, kind: model, tone: teal, at: [3, 1] }
    - { id: wrong, label: Replace the fuser, sub: from another model's page, kind: output, tone: pink, at: [4, 0] }
    - { id: right, label: Replace the pick roller, sub: the runbook both ranked fourth, kind: output, tone: green, at: [4, 2] }
  edges:
    - { from: engineer, to: keyword, label: query, step: 1 }
    - { from: engineer, to: vector, label: query, step: 1 }
    - { from: keyword, to: byscore, label: "14.2, 12.9, 11.7", tone: danger }
    - { from: vector, to: byscore, label: "0.86, 0.84, 0.82", tone: danger }
    - { from: byscore, to: model, label: keyword's top three, tone: danger }
    - { from: model, to: wrong, label: answers from them, tone: danger }
    - { from: keyword, to: fusion, label: positions, tone: success }
    - { from: vector, to: fusion, label: positions, tone: success }
    - { from: fusion, to: model, label: runbook first, tone: success }
    - { from: model, to: right, label: answers the question, tone: success }

approach:
  goal: Put the chunk both searches rate highly into the prompt
  branches:
    - label: Scores do not travel between retrievers
      detail: A keyword score of 12 and a vector score of 0.8 are not on one scale.
      leaves: [compare positions instead, each list ranks only its own results]
    - label: Reward agreement
      leaves: [fourth in both beats first in one, a list that lacks the chunk adds nothing]
    - label: Count each chunk once per list
      leaves: [a repeated id keeps its first rank, a duplicate is not a second vote]
    - label: Make it reproducible and available
      leaves: [ties go to the smaller id, a failed retriever is an empty list]

coach:
  opening: >-
    Look at how the two lists become one. Before you write anything, decide
    what a keyword score of 12 and a vector score of 0.8 can tell you about
    each other.
  signals:
    - id: sorts-by-score
      when: { code_matches: '(\.get\(|\[)\s*[''"]score[''"]' }
      say: >-
        Your merge reads the score field. Keyword scores run to 20 and vector
        scores stop at 1, so which list wins a sort by score?
    - id: no-rank-fusion
      when: { code_lacks: '/\s*\(\s*(K|k|RRF_K|60)\s*\+|/\s*\(\s*\w+\s*\+\s*(K|k|RRF_K|60)\s*\)' }
      say: >-
        Nothing here computes the published rule yet: one over 60 plus the
        rank, from each list a chunk appears in. Where would that sum be kept?
    - id: hidden-fourth-in-both
      when: { test_failed: either_ranking_alone_misses_the_runbook }
      say: >-
        In that run the runbook sits fourth in both lists, and each list's top
        three appear in that list only. Which three does your merge keep?
    - id: hidden-duplicate-id
      when: { test_failed: a_chunk_listed_twice_counts_once }
      say: >-
        One id appears twice in the vector list in that run. How many times
        does your fusion credit it?
    - id: hidden-tie
      when: { test_failed: a_tie_is_broken_by_id }
      say: >-
        Two chunks in that run finish level for third place. What decides
        which of them your code keeps, and would it decide the same way if the
        lists arrived in the other order?
    - id: adversarial-timeout
      when: { test_failed: adversarial_the_vector_index_times_out }
      say: >-
        Vector search raised a timeout in that run and keyword search answered
        normally. What does your loop do with the list it still has?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with `ranks()`: map each id to its first position in one list, and
        try it on a list where an id appears twice.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are open, and the second one says why
        sorting by score keeps the wrong three.
  wrap_up: >-
    Hybrid search is two retrievers whose scores cannot be compared. Fuse by
    rank, count each chunk once per list, break ties on something stable, and
    treat a failed retriever as an empty list so one outage does not take
    both down.

tests:
  - name: answers_from_a_chunk_both_searches_rank_first
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What does E-3001 mean on the M400?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=E-3001 M400)" }
        - { match: { contains: "[kb-300] E-3001" },
            reply: "Final Answer: The rear door is open, or its sensor cannot see the door closed [kb-300]." }
        - { match: "*", reply: "Final Answer: I could not find E-3001 in the knowledge base." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-300", score: 15.2, text: "E-3001 on the M400 means the rear door is open or its sensor cannot see the door closed." }
              - { id: "kb-301", score: 10.4, text: "The rear door sensor is a small lever on the right-hand hinge." }
              - { id: "kb-302", score: 7.9, text: "Firmware 3.2 renamed E-3001 from door open to rear door." }
        vector_search:
          returns:
            status: 200
            results:
              - { id: "kb-300", score: 0.91, text: "E-3001 on the M400 means the rear door is open or its sensor cannot see the door closed." }
              - { id: "kb-610", score: 0.62, text: "Paper not feeding on the C900: clean the feed rollers with a damp lint-free cloth." }
              - { id: "kb-303", score: 0.58, text: "Close every door fully before starting a print job." }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: keyword_search }
        - { type: calls_tool, name: vector_search }
        - { type: returns_matches, value: "(?i)rear door" }

  - name: answers_when_one_search_finds_nothing
    visibility: public
    spec:
      kind: agent_run
      input: { question: "How many sheets does tray 2 on the M400 hold?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=M400 tray 2 capacity)" }
        - { match: { contains: "550 sheets" },
            reply: "Final Answer: Tray 2 holds 550 sheets of A4 or A3 [kb-501]." }
        - { match: "*", reply: "Final Answer: I could not find the tray capacity in the knowledge base." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-501", score: 13.5, text: "Tray 2 on the M400 holds 550 sheets of A4 or A3." }
              - { id: "kb-502", score: 9.0, text: "Tray 1 on the M400 holds 250 sheets." }
        vector_search:
          returns: { status: 200, results: [] }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "550 sheets" }
        - { type: no_exception }
        - { type: terminates }

  - name: either_ranking_alone_misses_the_runbook
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "M400 showing E-4102 and it will not pull paper from tray 2. What is the fix?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=M400 E-4102 tray 2 not feeding)" }
        - { match: { contains: "pick roller is worn" },
            reply: "Final Answer: Replace the tray 2 pick roller with part PR-22 and reset the feed counter [kb-422]." }
        - { match: { contains: "replace the fuser" },
            reply: "Final Answer: Replace the fuser if the error returns after the jam is cleared [kb-118]." }
        - { match: "*", reply: "Final Answer: Clean the feed rollers with a damp lint-free cloth [kb-610]." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-310", score: 14.2, text: "Firmware 4.1 release notes: error codes E-4101 to E-4109 now show on the front panel as well as in the log." }
              - { id: "kb-205", score: 12.9, text: "Error code index for the C900 series: E-4102 means the duplex unit has jammed." }
              - { id: "kb-118", score: 11.7, text: "E-4102 on the C900 can follow a fuser temperature fault. If the error returns after the jam is cleared, replace the fuser." }
              - { id: "kb-422", score: 9.8, text: "M400 tray 2 not feeding with E-4102: the tray 2 pick roller is worn. Replace it with part PR-22 and reset the feed counter." }
              - { id: "kb-501", score: 8.1, text: "Tray 2 on the M400 holds 550 sheets of A4 or A3." }
        vector_search:
          returns:
            status: 200
            results:
              - { id: "kb-610", score: 0.86, text: "Paper not feeding on the C900: clean the feed rollers with a damp lint-free cloth." }
              - { id: "kb-612", score: 0.84, text: "Misfeeds from the bypass tray usually mean the paper guides are set too wide." }
              - { id: "kb-615", score: 0.82, text: "Curled paper causes feed failures on every model. Store paper flat and sealed." }
              - { id: "kb-422", score: 0.80, text: "M400 tray 2 not feeding with E-4102: the tray 2 pick roller is worn. Replace it with part PR-22 and reset the feed counter." }
              - { id: "kb-501", score: 0.71, text: "Tray 2 on the M400 holds 550 sheets of A4 or A3." }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "PR-22" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 3 }

  - name: a_chunk_listed_twice_counts_once
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "E-2210 keeps coming back on an M400 with a new cartridge fitted. What next?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=E-2210 returns after new cartridge)" }
        - { match: { contains: "sensor contacts are dirty" },
            reply: "Final Answer: Wipe the toner sensor contacts with the swab from the maintenance kit [kb-232]." }
        - { match: "*", reply: "Final Answer: Replace the toner cartridge [kb-777]." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-230", score: 13.1, text: "E-2210 on the M400 is a toner sensor warning that appears when a cartridge is fitted with its seal still in place." }
              - { id: "kb-231", score: 12.4, text: "To clear E-2210, remove the cartridge, pull the orange seal tab fully out and refit it." }
              - { id: "kb-232", score: 10.9, text: "If E-2210 returns with the seal removed, the toner sensor contacts are dirty. Wipe them with the swab in the maintenance kit." }
              - { id: "kb-240", score: 8.2, text: "Toner cartridges for the M400 yield about 12,000 pages." }
        vector_search:
          returns:
            status: 200
            results:
              - { id: "kb-777", score: 0.88, text: "Replace the toner cartridge when the front panel shows a low toner warning." }
              - { id: "kb-777", score: 0.87, text: "Replace the toner cartridge when the front panel shows a low toner warning." }
              - { id: "kb-230", score: 0.85, text: "E-2210 on the M400 is a toner sensor warning that appears when a cartridge is fitted with its seal still in place." }
              - { id: "kb-231", score: 0.83, text: "To clear E-2210, remove the cartridge, pull the orange seal tab fully out and refit it." }
              - { id: "kb-232", score: 0.81, text: "If E-2210 returns with the seal removed, the toner sensor contacts are dirty. Wipe them with the swab in the maintenance kit." }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)sensor contacts" }
        - { type: no_exception }
        - { type: terminates }

  - name: a_tie_is_broken_by_id
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Can the M400 scan straight to a shared network folder?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=M400 scan to network folder)" }
        - { match: { contains: "SMB version 2" },
            reply: "Final Answer: Yes, over SMB, as long as the share allows SMB version 2 or later [kb-107]. Add the folder path and a domain user to the address book entry [kb-121]." }
        - { match: "*", reply: "Final Answer: Yes. Add the folder path and a domain user to the address book entry [kb-121]." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-120", score: 12.0, text: "The M400 scans to email, to USB and to a network folder over SMB." }
              - { id: "kb-121", score: 11.1, text: "Scan to folder needs the folder path, a domain user name and that user's password in the address book entry." }
              - { id: "kb-311", score: 9.4, text: "Scan resolution on the M400 goes up to 600 dots per inch." }
        vector_search:
          returns:
            status: 200
            results:
              - { id: "kb-121", score: 0.87, text: "Scan to folder needs the folder path, a domain user name and that user's password in the address book entry." }
              - { id: "kb-120", score: 0.85, text: "The M400 scans to email, to USB and to a network folder over SMB." }
              - { id: "kb-107", score: 0.80, text: "Scanning to a folder fails on the M400 unless the share allows SMB version 2 or later. Firmware 4.0 switched version 1 off." }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)version 2" }
        - { type: no_exception }
        - { type: terminates }

  - name: adversarial_the_vector_index_times_out
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      The vector index was being rebuilt and timed out on the first call.
      Keyword search answered normally, and its first result is the runbook.

      A loop that calls both retrievers and lets either exception escape has
      made hybrid search less available than either half on its own: it now
      fails whenever keyword search fails and whenever vector search fails.
      Fusing an empty list with a full one is the full one, so the fused
      ranking needs no special case, only a retriever call that turns a
      failure into an empty list.
    spec:
      kind: agent_run
      input: { question: "Which part fixes E-4102 on an M400 that will not feed from tray 2?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=E-4102 M400 tray 2 part)" }
        - { match: { contains: "part PR-22" },
            reply: "Final Answer: Part PR-22, the tray 2 pick roller [kb-422]." }
        - { match: "*", reply: "Final Answer: I could not find that part in the knowledge base." }
      tools:
        keyword_search:
          returns:
            status: 200
            results:
              - { id: "kb-422", score: 14.8, text: "M400 tray 2 not feeding with E-4102: the tray 2 pick roller is worn. Replace it with part PR-22 and reset the feed counter." }
              - { id: "kb-205", score: 12.1, text: "Error code index for the C900 series: E-4102 means the duplex unit has jammed." }
              - { id: "kb-310", score: 11.0, text: "Firmware 4.1 release notes: error codes E-4101 to E-4109 now show on the front panel as well as in the log." }
        vector_search:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the vector index timed out during a rebuild" }
      budget: { max_llm_calls: 3, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: "PR-22" }
        - { type: terminates }

reference_md: |
  Hybrid search exists because keyword and vector retrieval fail
  differently. Keyword search is exact: it finds E-4102 wherever E-4102 is
  written, including the firmware note and the other printer's pages.
  Vector search is approximate: it finds pages about paper that will not
  feed, on any model. The runbook matched both halves of the question well
  enough to rank fourth in both lists, and fourth in both is the strongest
  evidence either retriever produced. Fusion is the step that has to see
  that.

  Scores cannot see it. A keyword score is a sum of term weights that
  depends on the query and the corpus, and a vector score is a cosine
  between 0 and 1. Sorting the pooled results by score sorts them by
  retriever, so the merge quietly becomes keyword search alone. Normalising
  each list to 0 to 1 before adding looks like the fix and inherits a
  different problem: one outlier compresses every other score in its list,
  and how the two add up changes with every query.

  Ranks are comparable because each retriever produces them the same way.
  1 / (60 + rank) gives the top of each list slightly more weight than the
  rest, and the 60 stops any single first place from outweighing agreement.
  First in one list is worth 0.0164, and fourth in both is worth 0.0313.

  The edge cases are where a fusion step stops being one without anybody
  noticing. A chunk that appears twice in one list, because it was ingested
  twice, is one chunk with one rank, and letting it vote twice pushed the
  E-2210 runbook out of the top three. A chunk missing from a list gets
  nothing from it, and a default rank for it is an invented vote. A tie
  broken by whichever list was read first makes the prompt depend on the
  order of two lines of code, and an evaluation that cannot reproduce the
  prompt cannot explain the answer.

  A retriever that times out is an empty list. Hybrid search that fails
  whenever either half fails is less available than either half alone.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    You have keyword results and vector results for the same query. How do you merge them into one ranking, and why not sort by score?
  source: |
    Author judgement. No employer frequency data stands behind it.
