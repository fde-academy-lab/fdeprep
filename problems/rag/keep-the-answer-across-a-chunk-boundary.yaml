slug: keep-the-answer-across-a-chunk-boundary
title: Cancellation answers have been wrong for a month
day: 12
skill: Stop the chunker cutting the answer in half
artefact_type: code
difficulty: medium
track: rag
est_minutes: 30
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: context-assembly, weight: 1.0 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A policy assistant reads help centre articles and answers from them. It has
  been answering one question wrong for a month: "how long do I have to
  cancel a subscription?"

  The article says so, in one sentence. The chunker cuts every article into
  120 character windows and the sentence begins at character 108, so it is
  split across two windows and neither window contains a usable answer. The
  assistant retrieves the first half, reads "you may cancel a subscription
  within", and fills in the rest.

  Windows are cheap. Losing the sentence is not.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: article(id=<id>)` or
  `Final Answer: <text>`. The `article` tool returns
  `{"status": 200, "text": "..."}`.

  Cut the text into windows of 120 characters that overlap by 40, so a window
  starts every 80 characters. Keep only the windows containing at least one
  word of four letters or more from the question, compared without case.

  Write each surviving window into the prompt as

      [start=<character offset in the original text>] <window text>

  in the order they appear in the article.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  SIZE = 120
  OVERLAP = 40


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"

      for _ in range(8):
          output = llm(scratchpad)

          # TODO 1: return the text when the reply is a Final Answer
          # TODO 2: call article when the reply is an Action
          # TODO 3: cut the text into overlapping windows, keeping each
          #         window's offset in the original text
          # TODO 4: keep the windows that share a word of four letters or more
          #         with the question, and write them as [start=<n>] <text>
          pass

      return "I could not find that in the help centre."

hints:
  - Both mistakes this problem catches are about positions, where each window
    starts and which number you write beside it. Write the start of every
    window down for a 200 character article.
  - A sentence that starts near the end of one window is only whole if the next
    window starts before that sentence does.
  - A window every 80 characters is not the same as a window every 120.
  - The offset you write is the offset in the article, not the index of the
    window in your list.

scenario:
  who: Support operations for a subscription service's help centre
  situation: >-
    For a month the policy assistant has answered "how long do I have to cancel
    a subscription?" wrongly. The article says it in one sentence, and the
    chunker cuts that sentence in half at character 120.
  stakes: >-
    Every customer who asked got a cancellation window the article never
    states, and the assistant finished the sentence itself.
  metrics:
    - { label: Window size, value: 120 characters }
    - { label: Answer starts at, value: character 108 }
    - { label: Wrong for, value: a month }

diagram:
  title: Where the cancellation sentence is cut in half
  caption: >-
    Windows that tile the article cut any sentence that crosses a seam.
    Overlap gives every short sentence one window where it is whole.
  direction: lr
  nodes:
    - { id: article, label: Article, sub: the answer starts at character 108, kind: doc, tone: blue, at: [0, 1] }
    - { id: chunker, label: Chunker, sub: cuts the text into windows, kind: service, tone: purple, at: [1, 1] }
    - { id: tiled, label: Window 0 to 120, sub: ends in the middle of the answer, kind: doc, tone: orange, at: [2, 0] }
    - { id: overlap, label: Window 80 to 200, sub: holds the whole sentence, kind: doc, tone: green, at: [2, 2] }
    - { id: model, label: Model, sub: reads the windows that match, kind: model, tone: teal, at: [3, 1] }
    - { id: guess, label: Invented window, sub: the model finished the sentence, kind: output, tone: pink, at: [4, 0] }
    - { id: cited, label: Cited answer, sub: "[start=80] points into the article", kind: output, tone: green, at: [4, 2] }
  edges:
    - { from: article, to: chunker, label: text, step: 1 }
    - { from: chunker, to: tiled, label: a window every 120, tone: danger }
    - { from: tiled, to: model, label: half a sentence, tone: danger }
    - { from: model, to: guess, label: fills in the rest, tone: danger }
    - { from: chunker, to: overlap, label: a window every 80, tone: success }
    - { from: overlap, to: model, label: the whole sentence, tone: success }
    - { from: model, to: cited, label: offset in the article, tone: success }

approach:
  goal: Keep every short sentence whole in one window, and cite where it sits
  branches:
    - label: Find where the answer sits
      leaves: [the sentence starts at character 108, a seam at 120 cuts it]
    - label: Overlap the windows
      detail: Windows 120 long that start every 80 repeat 40 characters at every seam.
      leaves: [half as much storage again, a sentence under 40 characters is always whole]
    - label: Carry the offset from the cut
      leaves: [the start in the article, filtering changes positions in a list]
    - label: Keep article order
      leaves: [write kept windows in the order they appear, a person can follow the citations]

coach:
  opening: >-
    Work out where each window starts. The cancellation sentence begins at
    character 108, and everything here depends on whether one window holds all
    of it.
  signals:
    - id: steps-by-the-window-size
      when: { code_matches: 'range\(.*,\s*(SIZE|120)\s*\)|\+=\s*(SIZE|120)\b(?!\s*-)' }
      say: >-
        Your windows start every SIZE characters, so they tile the article with
        no overlap. Which sentence does a seam at character 120 cut?
    - id: hidden-sentence-at-108
      when: { test_failed: a_sentence_starting_at_108_survives_the_cut }
      say: >-
        That article's answer starts at character 108. List where each of your
        windows starts and ends, and check whether any one holds the whole
        sentence.
    - id: hidden-offset
      when: { test_failed: the_offset_points_at_the_article_not_the_window_list }
      say: >-
        Only one window in that article matches, and it does not start at zero.
        Is the number after start= its place in the article or in your list?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 3 on its own: turn a string into (start, window) pairs
        and check that the starts go up by 80. The filter and the format come
        after.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are open now, and the second one
        names the mechanism without writing the loop for you.
  wrap_up: >-
    Chunking decides what the model can ever read whole. Overlap costs a little
    storage, and a citation that points at a real offset is the only kind a
    person can check.

tests:
  - name: answers_from_a_single_window
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What is the returns window for shoes?" }
      llm_script:
        - { match: { contains: "Shoes may be returned within 28 days" },
            reply: "Final Answer: Shoes can be returned within 28 days." }
        - { match: "*", reply: "Action: article(id=returns)" }
      tools:
        article:
          returns:
            status: 200
            text: "Shoes may be returned within 28 days of delivery. Boxed items only please."
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: article }
        - { type: returns_matches, value: "(?i)28 days" }
        - { type: llm_calls_at_most, value: 3 }

  - name: keeps_the_windows_in_article_order
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Who pays postage on a warranty claim?" }
      llm_script:
        - { match: { contains: "start=0" },
            reply: "Final Answer: We pay postage on warranty claims." }
        - { match: "*", reply: "Action: article(id=warranty)" }
      tools:
        article:
          returns:
            status: 200
            text: "Warranty claims are free to send back. We pay the postage on every warranty claim and refund it within a week of receipt at the depot."
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)we pay postage" }
        - { type: no_exception }
        - { type: terminates }

  - name: a_sentence_starting_at_108_survives_the_cut
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How long do I have to cancel a subscription?" }
      llm_script:
        - { match: { contains: "cancel a subscription within 14 days" },
            reply: "Final Answer: You have 14 days to cancel a subscription." }
        - { match: { contains: "cel a subscription within 14 days" },
            reply: "Final Answer: There is a 14 day window but the article does not say what it applies to." }
        - { match: "*", reply: "Action: article(id=subscriptions)" }
      tools:
        article:
          returns:
            status: 200
            text: "Subscriptions renew on the same day each month and the renewal charge appears on your statement immediately. You may cancel a subscription within 14 days of a renewal for a full refund."
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)14 days to cancel" }
        - { type: no_exception }
        - { type: terminates }

  - name: the_offset_points_at_the_article_not_the_window_list
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What is the escalation deadline for a damaged parcel?" }
      llm_script:
        - { match: { contains: "start=80" },
            reply: "Final Answer: Escalate a damaged parcel within 48 hours. The rule is at character 80." }
        - { match: { contains: "start=120" },
            reply: "Final Answer: Escalate within 48 hours. The rule is at character 120." }
        - { match: "*", reply: "Action: article(id=damage)" }
      tools:
        article:
          returns:
            status: 200
            text: "Parcels are inspected at the depot before they go out for delivery and again when a driver hands them over to a customer at the door. A damaged parcel must be escalated within 48 hours of delivery."
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)character 80" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 3 }

reference_md: |
  Two numbers and one subtraction, and the reason it is worth a problem is
  that the wrong version looks finished.

  A chunker that steps 120 characters at a time produces windows that tile the
  article with no gaps and no waste, which is exactly what you want if the
  article is a list of independent facts and exactly what you do not want if
  it is prose. Sentences do not respect the boundary, and the one sentence a
  question is about has a one in six chance of straddling one. The assistant
  then retrieves a window ending in "you may cancel a subscription within" and
  the model finishes the sentence, because finishing sentences is what it is
  for.

  Stepping 80 to produce windows of 120 costs half as much storage again and makes
  every sentence shorter than 40 characters whole in at least one window. That
  is the trade, and it is cheap on the side that matters.

  The offset is the other half. A window's position in your list is not its
  position in the article, and the moment you filter the list the two numbers
  diverge silently. A citation pointing at window three points at nothing a
  human can check, and the whole reason to cite is so a human can check.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    The correct document was retrieved but the answer is wrong. What do you inspect next?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I008.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: article
    args: id
    returns: A status and the article's full `text`.
example:
  case: keeps_the_windows_in_article_order
  expect: Cut 120 character windows every 80 characters, keep the one at offset 0, the only window that
    shares a word with the question, write it as [start=0] <text>, and return that we pay postage on warranty
    claims.
traps:
  - Stepping a whole window size each time, so the windows tile the article and a sentence that straddles
    a seam is whole in none of them.
  - Writing a window's place in your filtered list after `start=`, when the number a reader needs is its
    character offset in the article.
