slug: reject-unsupported-answer-claims
title: A cited mortgage answer doubles the overpayment allowance
day: 12
skill: Drop the sentence its citation does not support
artefact_type: code
difficulty: medium
track: rag
est_minutes: 30
competencies:
  - { slug: retrieval, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A building society's mortgage assistant drafts answers from the mortgage
  terms and ends every sentence with the id of the chunk it relies on. A
  check runs before anything is sent: every cited id has to be a chunk that
  search returned.

  In August a customer asked how much she could overpay without a charge.
  The draft said 20 percent of the balance a year and cited m-4. m-4 exists,
  so the check passed. m-4 says 10 percent. She overpaid 35,000 pounds on a
  200,000 pound balance, 15,000 of it over the real allowance, and paid a 3
  percent charge on that: 450 pounds she had been told she would not pay.

  Check what each sentence says against the chunks it cites, and send only
  the sentences they support.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: search(query=<text>)` or
  `Final Answer: <draft>`. `search` returns

      {"status": 200, "chunks": [{"id": "m-4", "text": "..."}]}

  The draft is sentences. A sentence ends with a full stop followed by a
  space or by the end of the draft, and it cites the chunks it relies on as
  ids in square brackets, one id to a pair, before its full stop:

      You can overpay up to 10 percent of the balance each year [m-4].

  A sentence is supported when it cites at least one id, every id it cites
  is a chunk search returned, and every number in it appears among the
  numbers of the chunks it cites. A number is a run of digits that may hold
  a comma or a point, so 10, 1,499 and 4.5 are one number each. The ids in
  square brackets are not part of the claim.

  Return the supported sentences exactly as drafted, in their order, joined
  by single spaces. If none is supported, return

      I could not check that answer against the mortgage terms.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  CANNOT_CHECK = "I could not check that answer against the mortgage terms."


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"
      retrieved = {}

      for _ in range(6):
          output = llm(scratchpad)

          if "Final Answer:" in output:
              draft = output.split("Final Answer:", 1)[1].strip()
              # TODO 3: split the draft into sentences, keep the ones supported()
              #         accepts, and return them joined by spaces, or CANNOT_CHECK
              #         when none is left
              return draft

          action = re.search(r"Action:\s*search\(query=(.*?)\)", output)
          if action is None:
              scratchpad += f"{output}\nThat was not a valid action.\n"
              continue

          chunks = (tools["search"](query=action.group(1).strip()) or {}).get("chunks") or []
          for chunk in chunks:
              retrieved[chunk["id"]] = chunk["text"]
          scratchpad += f"{output}\n" + "\n".join(f"[{c['id']}] {c['text']}" for c in chunks) + "\n"

      return CANNOT_CHECK


  def numbers(text: str) -> set:
      """Every number in the text, such as 10, 1,499 or 4.5."""
      return set(re.findall(r"\d+(?:[.,]\d+)*", text))


  def supported(sentence: str, retrieved: dict) -> bool:
      """True when the sentence cites retrieved chunks and every number in it
      appears among the numbers of the chunks it cites."""
      # TODO 1: read the ids in square brackets. With none, or with any id
      #         search never returned, the sentence is not supported
      # TODO 2: take the ids out of the sentence, then check each number left
      #         against the numbers of the chunks it cites
      return True

steps:
  - id: s1
    text: Reject a sentence that cites nothing, or cites an id search never returned.
    check_id: s1
  - id: s2
    text: Check every number in the sentence against the numbers in the chunks it cites.
    check_id: s2
  - id: s3
    text: Return the supported sentences in order, or the fixed sentence when none is left.
    check_id: s3

step_checks:
  # s1 and s3 read a_sentence_with_no_citation_is_not_sent. The stub returns
  # the draft untouched, which is already right for the other public case, and
  # never calls supported(), so s1 shows once s3 filters the sentences.
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: 'online or by phone' }
        - { type: returns_lacks, value: 'advisers' }
  # s2 carries its own case, because every number in a public sentence
  # appears in the chunk it cites. Here the second sentence cites a real chunk
  # and changes its fee from 15 to 35 pounds. s2 shows once s3 filters the
  # sentences.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "What happens if I miss a monthly payment?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=missed monthly payment)" }
        - { match: { contains: "A reminder letter is sent" },
            reply: "Final Answer: A reminder letter is sent 7 days after a missed payment [m-21]. A late payment fee of 35 pounds is added to the next statement [m-22]." }
        - { match: "*", reply: "Action: search(query=missed monthly payment)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-21", text: "A reminder letter is sent 7 days after a payment is missed." }
              - { id: "m-22", text: "A late payment fee of 15 pounds is added to the next monthly statement." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "7 days after a missed payment" }
        - { type: returns_lacks, value: "35 pounds" }
  - step_id: s3
    spec:
      assertions:
        - { type: returns_equals, value: 'Yes, you can overpay online or by phone [m-6].' }

hints:
  - The citation in the incident was real. Look at what your check asks about
    each sentence, and whether it ever reads the chunk the sentence cites.
  - Most of the damage in a drafted answer sits in its numbers. A number is
    either among the cited chunk's numbers or it is not, and a loop can check
    that exactly.
  - "Per sentence: read its ids, reject it when there are none or one is
    unknown, take the ids out, then look for each remaining number among the
    numbers of the cited chunks."
  - Compare whole numbers. 3 sits inside 30 as text, and "within 30 days"
    does not support "within 3 days".
  - A sentence may cite two chunks. Its numbers can come from either of them.

scenario:
  who: The mortgage servicing team at a building society
  situation: >-
    The assistant told a customer she could overpay 20 percent of her balance
    a year without a charge, and cited m-4. The citation check passed because
    m-4 exists. m-4 says 10 percent.
  stakes: >-
    She overpaid 35,000 pounds on a 200,000 pound balance and paid a 450 pound
    charge on the 15,000 that was over the real allowance.
  metrics:
    - { label: Allowance it quoted, value: 20% }
    - { label: Allowance in m-4, value: 10% }
    - { label: Charge she paid, value: "£450" }

diagram:
  title: Where a real citation carries a number it never said
  caption: >-
    An id that exists proves nothing about the sentence in front of it. Check
    each sentence's numbers against the chunks it cites before it is sent.
  direction: lr
  nodes:
    - { id: customer, label: Customer, sub: asks about overpaying, kind: actor, tone: blue, at: [0, 1] }
    - { id: search, label: search, sub: returns chunks with ids, kind: tool, tone: neutral, at: [1, 0] }
    - { id: model, label: Model, sub: drafts sentences with ids, kind: model, tone: teal, at: [1, 1] }
    - { id: chunk, label: Chunk m-4, sub: up to 10 percent a year, kind: doc, tone: blue, at: [1, 2] }
    - { id: idcheck, label: Id check, sub: asks only whether m-4 exists, kind: guard, tone: orange, at: [2, 0] }
    - { id: claimcheck, label: Claim check, sub: reads what m-4 says, kind: guard, tone: green, at: [2, 2] }
    - { id: sent, label: "20 percent, sent", sub: a real id on a wrong number, kind: output, tone: pink, at: [3, 0] }
    - { id: kept, label: Checked answer, sub: only what the chunks say, kind: output, tone: green, at: [3, 2] }
  edges:
    - { from: customer, to: model, label: question, step: 1 }
    - { from: search, to: model, label: chunks with ids, step: 2 }
    - { from: model, to: idcheck, label: draft, tone: danger }
    - { from: idcheck, to: sent, label: the id exists, tone: danger }
    - { from: model, to: claimcheck, label: each sentence, tone: success }
    - { from: chunk, to: claimcheck, label: its numbers }
    - { from: claimcheck, to: kept, label: supported sentences, tone: success }

approach:
  goal: Send only the sentences the cited chunks actually say
  branches:
    - label: A citation is a claim too
      detail: An id that exists proves the chunk exists, and nothing about the sentence citing it.
      leaves: [read what the chunk says, as well as whether it was retrieved]
    - label: Check what can be checked exactly
      leaves: [numbers are where drafts go wrong, whole numbers and never substrings]
    - label: Judge each sentence on its own
      leaves: [every id it cites, drop what the chunks do not back]
    - label: Say so when nothing is left
      leaves: [a fixed sentence and never an empty string, no second model call]

coach:
  opening: >-
    Find the line that decides whether a sentence is sent, and read what it
    checks. An id that exists says nothing about the sentence in front of it.
  signals:
    - id: never-checks-numbers
      when: { code_lacks: '(numbers|nums|digits|figures)\([\s\S]*(numbers|nums|digits|figures)\(' }
      say: >-
        Nothing compares the numbers in a sentence with the numbers in the
        chunks it cites yet. `numbers()` is written for you, so where would it be
        called?
    - id: substring-number-match
      when: { code_matches: '\bin\s+\w+\[\s*\w+\s*\]' }
      say: >-
        That line looks for the number as text inside the chunk, so 3 is found
        inside 30. Compare the sentence's numbers with the chunk's numbers
        instead.
    - id: hidden-changed-number
      when: { test_failed: a_real_citation_on_a_changed_number_is_dropped }
      say: >-
        In that draft one sentence cites a chunk that exists and states a
        number the chunk does not. What does your check read in the chunk?
    - id: hidden-longer-number
      when: { test_failed: a_number_inside_a_longer_number_is_not_support }
      say: >-
        That draft puts a small number where the chunk has a bigger one that
        starts with the same digit. Is your check comparing whole numbers?
    - id: hidden-nothing-supported
      when: { test_failed: nothing_supported_means_the_fixed_sentence }
      say: >-
        No sentence in that draft is supported. What does your loop return
        once every sentence has been dropped?
    - id: hidden-two-chunks
      when: { test_failed: a_sentence_can_rest_on_two_chunks }
      say: >-
        One sentence in that draft cites two chunks, and its numbers come from
        both. Which chunks does your check read for it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 3: split the draft into sentences and return them
        joined, so the public tests run. Then fill `supported()` one check at a
        time.
    - id: keep-failing
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are open, and the second one says
        where drafted answers usually go wrong.
  wrap_up: >-
    A citation check that asks whether the id exists passes every citation the
    model was shown. Check what the sentence claims against what the chunk
    says, deterministically where you can, before anything reaches a customer.

tests:
  - name: returns_a_draft_whose_sentences_are_all_supported
    visibility: public
    spec:
      kind: agent_run
      input: { question: "How much can I overpay each year without a charge?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=overpayment allowance and charge)" }
        - { match: { contains: "Overpayments of up to" },
            reply: "Final Answer: You can overpay up to 10 percent of the balance each year without a charge [m-4]. Above that, a 3 percent charge applies to the excess [m-5]." }
        - { match: "*", reply: "Action: search(query=overpayment allowance and charge)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-4", text: "Overpayments of up to 10 percent of the balance each year are free of charge." }
              - { id: "m-5", text: "Overpayments above the yearly allowance carry an early repayment charge of 3 percent of the excess." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: search }
        - { type: returns_matches, value: "10 percent[\\s\\S]*3 percent" }
        - { type: llm_calls_at_most, value: 3 }

  - name: a_sentence_with_no_citation_is_not_sent
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Can I make an overpayment online?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=how to make an overpayment)" }
        - { match: { contains: "Overpayments can be made" },
            reply: "Final Answer: Yes, you can overpay online or by phone [m-6]. Our advisers can talk you through it on weekdays." }
        - { match: "*", reply: "Action: search(query=how to make an overpayment)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-6", text: "Overpayments can be made online, by phone or by bank transfer." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "online or by phone" }
        - { type: returns_lacks, value: "advisers" }
        - { type: no_exception }

  - name: a_real_citation_on_a_changed_number_is_dropped
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How much can I overpay each year without paying a charge?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=overpayment allowance)" }
        - { match: { contains: "Overpayments of up to" },
            reply: "Final Answer: You can overpay up to 20 percent of the balance each year without a charge [m-4]. Overpayments above the allowance carry a 3 percent charge on the excess [m-5]." }
        - { match: "*", reply: "Action: search(query=overpayment allowance)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-4", text: "Overpayments of up to 10 percent of the balance each year are free of charge." }
              - { id: "m-5", text: "Overpayments above the yearly allowance carry an early repayment charge of 3 percent of the excess." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "3 percent charge" }
        - { type: returns_lacks, value: "20 percent" }
        - { type: no_exception }

  - name: a_number_inside_a_longer_number_is_not_support
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How soon does a new payment date take effect?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=change payment date)" }
        - { match: { contains: "A change to the monthly payment date" },
            reply: "Final Answer: A new payment date takes effect within 3 days of your request [m-8]. You can choose any day from the 1st to the 28th [m-9]." }
        - { match: "*", reply: "Action: search(query=change payment date)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-8", text: "A change to the monthly payment date takes effect within 30 days of the request." }
              - { id: "m-9", text: "The payment date can be any day from the 1st to the 28th of the month." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "28th" }
        - { type: returns_lacks, value: "3 days" }
        - { type: no_exception }

  - name: nothing_supported_means_the_fixed_sentence
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Can I move my mortgage to a new house, and what does it cost?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=porting a mortgage)" }
        - { match: { contains: "Porting your mortgage" },
            reply: "Final Answer: Porting your mortgage to a new home is always approved [m-12]. The product fee on the new rate is 1,499 pounds [m-3]." }
        - { match: "*", reply: "Action: search(query=porting a mortgage)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-2", text: "Porting your mortgage to a new property is subject to a new affordability check." }
              - { id: "m-3", text: "A product fee of 999 pounds applies to every new fixed rate." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)could not check that answer" }
        - { type: llm_calls_at_most, value: 3 }
        - { type: terminates }

  - name: a_sentence_can_rest_on_two_chunks
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Is there a charge if I repay the whole mortgage in the second year?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: search(query=repay in full early repayment charge)" }
        - { match: { contains: "Early repayment charges apply" },
            reply: "Final Answer: Repaying in full during the first 5 years carries an early repayment charge of 3 percent [m-5][m-10]. The redemption statement you need is free [m-11]." }
        - { match: "*", reply: "Action: search(query=repay in full early repayment charge)" }
      tools:
        search:
          returns:
            status: 200
            chunks:
              - { id: "m-5", text: "Overpayments above the yearly allowance carry an early repayment charge of 3 percent of the excess." }
              - { id: "m-10", text: "Early repayment charges apply for the first 5 years of a fixed rate and end when the fixed rate ends." }
              - { id: "m-11", text: "Repaying the mortgage in full needs a redemption statement, which is free." }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "3 percent[\\s\\S]*redemption statement" }
        - { type: no_exception }
        - { type: terminates }

reference_md: |
  The check that shipped asked one question about a citation: does this id
  exist? That is a question about the index, and it was always going to say
  yes, because the model cites the ids it was shown. The question that
  matters is about the sentence: does the chunk it cites say this?

  Most of that question cannot be answered exactly, and one part can.
  Numbers are where drafts go wrong in ways that cost money. A model that
  has read "10 percent" writes "20 percent" because 20 appears somewhere
  else in its context, and the sentence around the number stays fluent. A
  number either appears among the cited chunk's numbers or it does not, so
  this check needs no model call, gives the same answer every time, and can
  be explained to the customer who appeals it. That is the order this
  platform grades in too: deterministic checks first, and a judge only for
  what they cannot see.

  Three details decide whether the check works. Compare whole numbers: 3
  sits inside 30 as text, and a substring test passes a payment date that
  changes within 3 days when the terms say 30. Read every id a sentence
  cites, because a sentence that combines two chunks takes its numbers from
  both. Take the ids out before reading numbers, or m-4 becomes a claim that
  the chunk mentions 4.

  Dropping an unsupported sentence is the floor. It stops a false promise
  going out, and it can leave an answer that no longer answers the
  question. The next step up is to send the draft back once with the
  failing sentences named, and check the redraft the same way. That spends
  a model call, and it earns it when answers are often left partial. The
  fixed sentence for a draft with nothing left is the assistant declining to
  promise something the mortgage terms do not say.

complexity: C2

