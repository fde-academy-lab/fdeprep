approach:
  goal: A method chosen by what can reach production and when, recorded on one page
  branches:
    - label: Count the deploys before naming a method
      leaves: ["which Tuesdays fall inside 4 May to 12 June?", "which of them can carry anything?", "what must the first one carry?"]
    - label: Cost every option in her terms
      detail: Weeks to a first deploy, and the decisions it sends to a sponsor who reads one page.
      leaves: [the platform team's plan as well, a source and a date for every method fact]
    - label: Read each source for what it rules out
      leaves: ["who owns the APIs the agent calls?", "what does each profile skip?"]
    - label: Decide, then say what it costs
      leaves: [what the decision gives up, who approves what from 4 May]

coach:
  opening: >-
    Before you compare methods, write down every date in the six weeks on
    which code can reach production, and which of them anything could be
    ready for.
  signals:
    - id: windows-not-counted
      when: { code_lacks: '(?i)\b19(th)?\s+may\b|\bmay\s+19' }
      say: >-
        Your record never says when code first reaches production. Which
        Tuesdays between 4 May and 12 June can carry anything?
    - id: three-releases
      when:
        code_matches: '(?i)three\s+(releases|deploys|deployments)|(release|deploy|ship)\w*\s+at\s+the\s+end\s+of\s+(each|every)\s+(sprint|bolt|two)'
        code_lacks: '(?i)two\s+deploys|16\s+june'
      say: >-
        Put each release you plan on the platform team's calendar. How many
        of them land in a window inside the six weeks?
    - id: prd-before-window
      when:
        code_matches: '(?i)40[-\s]page'
        code_lacks: '(?i)ships\s+nothing|nothing\s+(ships|reaches|is\s+ready|to\s+deploy)|carries\s+nothing'
      say: >-
        The 40-page PRD takes two weeks before any code. Which window does the
        first code then reach?
    - id: express-cross-team
      when:
        code_matches: '(?i)\bexpress\b'
        code_lacks: '(?i)cross[-\s]team|other\s+teams?|another\s+team'
      say: >-
        Express's own guide names the work it should not be chosen for. Read
        that line against who owns the APIs the agent calls.
    - id: her-decisions
      when: { code_lacks: '(?i)you\s+(make|decide|sign|approve)|your\s+decisions?' }
      say: >-
        She reads one page. Which decisions does your method send to her in
        six weeks, and which go to the platform team lead?
    - id: nothing-given-up
      when: { code_lacks: '(?i)\bgives?\s+up\b|at\s+the\s+cost\s+of|in\s+exchange\s+for|we\s+lose' }
      say: >-
        What does your decision give up? Name what the option you turned down
        would have given her.
    - id: unsourced
      when: { code_lacks: '(?i)\b8(th)?\s+oct(ober)?\b|\boct(ober)?\s+8\b' }
      say: >-
        Every fact about a method needs its source and the date it was read.
        Which page, read when, says each thing in your options?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with the Tuesdays. List the windows from 4 May to 12 June, then
        cross out the ones nothing could use.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three tries without a pass. The second hint puts the platform team's
        plan on the same calendar as the windows.
  wrap_up: >-
    A method is chosen against the calendar the client already has. Count
    what can reach production first, cost every option in weeks and in the
    sponsor's decisions, and write down what the choice gives up.

reference_md: |
  The decision turns on a count, and the count comes before any method has a
  name. The window opens every second Tuesday: 5 May, 19 May, 2 June and 16
  June. Construction holds the first three, but 5 May is its second day,
  when nothing exists to ship, and 16 June falls after it ends. So six weeks
  hold two deploys, 19 May and 2 June, whatever method runs, and the method
  only decides what is ready when each window opens. The 19 May window
  matters twice over. It falls in the week the peak began last year, and it
  is the first chance to put R-5's refusal in front of the gates she signed
  the day before, which cannot start reading until the refusal is live.

  On that calendar the platform team's plan has one deploy inside
  construction. Two weeks of PRD take it to 15 May, so 19 May carries
  nothing; the first sprint of code ends on 29 May and ships on 2 June; the
  last ends on 12 June and waits for 16 June. The 40-page PRD would also
  restate PRD v2, whose eight requirements the sponsor validated in
  February. The platform team still has a real reason for its proposal: it
  owns the platform and answers for every merge. The record keeps its lead
  as the approver of every merge, and moves the detail the team wants into a
  spec per unit, written as each unit starts instead of before anyone learns
  what the rebuild gets wrong.

  The sources rule options out in their own words. The aidlc-workflows
  guide says "Do not choose Express for ambiguous, cross-team, regulated, or
  architecture-heavy work", and the parts check reads a stock API another
  team owns. Express also skips Unit decomposition and Delivery Planning,
  the stages that cut units and plan bolts. Classic fits the work, but 18
  stages that each end in an approval gate, except the three Initialization
  stages, are at least fifteen approvals in six weeks, and BMAD's Build a
  Change page calls human attention "by far the most expensive resource".
  BMAD's answer is to "Put approvals there rather than inventing new gates":
  a ticket-breakdown approval and a retrospective verdict per epic, which the
  platform team lead can give, leaving the sponsor one kind of decision, the
  one her gate table already defines. Its sizing page sends cross-team work
  to more planning, which is the rule that puts every change to the partner
  stock API or the booking API on the project-sized path, however few lines
  it touches.

  The decision composes parts, and its cost has to be on the page. It gives
  up the document and the sprint rhythm the platform team trusts, Classic's
  full ceremony and Express's speed, and it spends an hour of review per
  unit inside every bolt. In exchange the first deploy lands in the first
  window that can carry anything.

  The build that follows, Deliver the field-service agent in bolts, starts
  from ADR-1 on 4 May: Inception cuts the units, bolt 1 is planned against 19
  May, and every change request gets its planning path. Another problem in
  this chapter, Compose a method for a first agent product, asks the same
  question when the constraint is a compliance officer's calendar in place
  of a change window.

  Sources, each read on 8 October 2026: the AWS DevOps blog post
  [AI-Driven Development Life Cycle: Reimagining Software Engineering](https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/),
  Raja SP, 31 July 2025; the
  [Workflow Profiles](https://github.com/awslabs/aidlc-workflows/blob/main/docs/guide/workflow-profiles.md)
  and [Interaction Modes](https://github.com/awslabs/aidlc-workflows/blob/main/docs/guide/07-interaction-modes.md)
  guides of aidlc-workflows, release 2.11.0; and BMAD's
  [Choose a Planning Path](https://docs.bmad-method.org/plan/choose-a-planning-path/),
  [Define Requirements and a Specification](https://docs.bmad-method.org/plan/define-requirements-and-a-specification/),
  [Plan Inside an Organization](https://docs.bmad-method.org/plan/plan-inside-an-organization/)
  and [Build a Change](https://docs.bmad-method.org/build/build-a-change/)
  pages, with `bmad-method` at release 6.12.1. The client, the change window,
  the 110 to 140 hours and the two-day bolt are this problem's own
  construction.

interview_evidence:
  round: both
  asked_as: |
    The client's platform team wants a 40-page PRD and two-week sprints, the sponsor wants the agent rebuilt in six weeks, and production changes only go out every second Tuesday. Which delivery method do you choose, and how do you record the decision?
  source: |
    Author judgement. No employer frequency data stands behind it. Method facts from the AWS
    DevOps blog post "AI-Driven Development Life Cycle: Reimagining Software Engineering" by
    Raja SP, 31 July 2025 (https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/);
    the Workflow Profiles and Interaction Modes guides of awslabs/aidlc-workflows
    (https://github.com/awslabs/aidlc-workflows), release 2.11.0; and BMAD's Choose a Planning
    Path, Define Requirements and a Specification, Plan Inside an Organization and Build a Change
    pages (https://docs.bmad-method.org), with bmad-method at release 6.12.1 on the npm registry.
    All read 8 October 2026.

traps:
  - Reading six weeks as three deploys, when the change window decides how many releases six weeks can hold.
  - Adopting a method by its name, with no cost in weeks or in her decisions set against the other options.
  - Choosing Express for work that calls APIs other teams own, which its own guide says not to do.
  - Writing the 40-page PRD before any code, so the first deploy waits for June.
