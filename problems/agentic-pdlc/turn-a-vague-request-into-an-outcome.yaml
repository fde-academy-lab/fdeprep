slug: turn-a-vague-request-into-an-outcome
title: "Turn a vague request into a testable goal"
day: 24
skill: Turn a request for faster support into an outcome you can test
artefact_type: design
difficulty: easy
track: agentic-pdlc
concept:
  topic: "Problem framing"
  question: "How do you turn \"make support faster\" into a goal you can test?"
est_minutes: 20
competencies:
  - { slug: client-communication, weight: 1.0 }
  - { slug: evaluation-design, weight: 1.0 }

brief_md: |
  The chief operating officer of a regional home insurer opened your kickoff
  call with one sentence: "We want to make support faster with AI." Then she
  left for another meeting. Her head of support stayed on and shared a
  dashboard.

  Fourteen agents answer about 2,300 customer emails a week. The median time
  to a first reply is 19 hours. Around 40 percent of the emails ask where a
  claim has got to, and agents answer those by looking the claim up by hand in
  the claims system. Across all email, 31 percent of tickets need a second
  reply, usually because the first one asked for a document the customer had
  already sent. The COO's office wants a monthly slide showing the number of
  AI-assisted tickets.

  You speak to the COO again on Thursday, and the contract has a review point
  in six weeks. Write the outcome you will ask her to agree to.

contract_md: |
  Write the outcome as you would send it to the COO before Thursday's call.
  She will give it two minutes and then agree or push back.

  Between 200 and 400 words. There is no template and no required structure.

  Say which piece of work you would start with and who it is for, which
  number should move and what it is today, by when, and what this first
  piece of work will not do. Say what you would do with the monthly slide.

word_range: [200, 400]
required_headings: []

rubric:
  - label: Picks one workflow and one group of people
    weight: 25
    descriptor_md: |
      Strong answers start with one kind of email, most often the claim status
      emails: the biggest single group, with the answer already in a system,
      and a reply that is mostly a lookup. Another slice with the same
      properties is as good. An answer about support in general has no number
      anybody can measure next week.
  - label: Chooses a number that moves only when customers are better off
    weight: 25
    descriptor_md: |
      Strong answers measure the customer's side of the slice, such as the
      time to a reply that answers the question, with a guard such as the
      share needing a second reply so speed cannot be bought with worse
      replies. The count of AI-assisted tickets rises whenever the tool is
      used, including in a week when replies got slower, so strong answers
      keep it as a usage figure and decline it as the outcome.
  - label: States the baseline, where it comes from, and a date
    weight: 25
    descriptor_md: |
      Nineteen hours is the median across all email, not for the slice.
      Strong answers say the slice's own figure has to be measured first,
      from ticket timestamps, and set the target against it with a date
      inside the six-week review. A target with no baseline is a hope, and a
      date past the review is one nobody will check.
  - label: Says what the first piece of work will not do
    weight: 15
    descriptor_md: |
      A non-goal protects the pilot from being misread. Strong answers say it
      will not send replies an agent has not read, will not cover the other
      email types yet, or is not a staffing plan, whichever the reader is
      most likely to assume.
  - label: Can be agreed or rejected in one reply
    weight: 10
    descriptor_md: |
      Short, concrete and free of jargon, ending with the one decision the
      COO is asked to make. An answer that reads as a project plan asks her
      to review it rather than decide.

exemplars:
  - band: strong
    score: 90
    body_md: |
      Proposed outcome for the first six weeks

      Start with the emails asking where a claim has got to. They are about
      40 percent of the 2,300 emails a week, and the answer already sits in the
      claims system, so an assistant can look the claim up and draft a reply
      for an agent to check and send. The people it serves are policyholders
      with an open claim, and the people using it are your 14 agents.

      The number to move is the median time from a claim status email arriving
      to the first reply that answers it. Across all email the median is 19
      hours today. We do not have that figure for claim status emails alone,
      so the first job is to measure it from the last four weeks of ticket
      timestamps, before anything changes, and that becomes the baseline. The
      target is to halve it by the review in week six, while the share of
      those emails needing a second reply stays at or below today's level, so
      speed cannot be bought with worse answers.

      What this will not do: it will not send anything an agent has not read,
      it will not touch the other 60 percent of email yet, and it is not a
      headcount plan.

      On the monthly slide, I would show the count of AI-assisted tickets as
      usage, next to the outcome rather than instead of it. That count rises
      every time the tool is used, including in a week when replies get
      slower, so on its own it cannot tell you whether support got faster.

      What I need from you on Thursday is agreement to the slice, the number
      and the date, and read access to the ticket timestamps.
  - band: adequate
    score: 62
    body_md: |
      I suggest we focus the first phase on claim status emails, since they
      are the biggest single category at around 40 percent of volume and the
      information is already in the claims system.

      The AI assistant would read each incoming claim status email, look up
      the claim, and draft a reply for the agent to approve. This should cut
      the time agents spend searching the claims system by hand, which is
      where most of the delay comes from.

      Success measure: reduce the median time to first reply from 19 hours to
      under 12 hours for claim status emails within three months. The
      dashboard the head of support showed us already reports this figure, so
      nothing extra is needed to measure it. We would
      also track the number of AI-assisted tickets each month for the COO's
      slide, and agent satisfaction with the drafts through a short survey.

      Risks: the claims system may be slow or incomplete, and agents may not
      trust the drafts at first, so we should plan some training and a
      feedback button in the tool.

      Next steps: agree the scope on Thursday, get access to the claims
      system, and build a first version for a small group of agents within
      four weeks, then roll it out to the full team if the numbers look good.
  - band: weak
    score: 28
    body_md: |
      To make support faster with AI, I recommend rolling out an AI assistant
      across the whole support team. Every incoming email would be read by the
      assistant, which would draft a reply for the agent. Agents can then edit
      and send, which should save a lot of effort on every ticket.

      The main success metric would be the number of AI-assisted tickets per
      month, which is what the COO's office has asked for. Our target is for
      80 percent of tickets to be AI-assisted by the end of the quarter. We
      would also track how many drafts agents accept without edits, as a sign
      the assistant is doing a good job.

      We should also consider adding a chatbot on the website so customers
      can get answers instantly without waiting for an email reply. That would
      take pressure off the team as well, and leave agents free for the more
      complicated tickets.

      To get started, we need access to the email system and some historical
      tickets to test with. We can pilot it with a few agents first and then
      expand once they are comfortable. I would suggest a monthly check-in
      with the COO to review progress against the targets and adjust the plan
      as we learn more about what works.

hints:
  - The request names a department. Look on the dashboard for one kind of
    email that is common and whose answer already exists somewhere.
  - A number that goes up whenever the tool is used measures the tool. Ask
    what would move if customers were better off.
  - A target without today's figure cannot be checked, and the 19 hours on the
    dashboard covers all email. Say where the slice's own figure comes from.
  - Put the date inside the six-week review, and add one guard number so that
    speed cannot be bought with worse replies.
  - Close with what the first piece of work will not do, and the one decision
    you need from the COO on Thursday.

scenario:
  headline: "The COO asked for faster support with AI, then left the call"
  who: The COO and the head of support at a regional home insurer
  situation: >-
    The kickoff opened with one sentence, "We want to make support faster
    with AI", and the COO's office has asked for a monthly count of
    AI-assisted tickets.
  stakes: >-
    Without a baseline and a date, the review in six weeks becomes an
    argument about impressions instead of a decision.
  metrics:
    - { label: Emails a week, value: "2,300" }
    - { label: Median first reply, value: 19 hours }
    - { label: Review point, value: week 6 }

diagram:
  title: From one sentence to something you can check
  caption: >-
    The requested count measures what the tool does. An outcome measures what
    the customer gets, on one workflow, from a known baseline, by a date.
  direction: lr
  nodes:
    - { id: request, label: '"Make support faster"', sub: "the COO, in one sentence", kind: doc, tone: blue, at: [0, 0] }
    - { id: dashboard, label: Support dashboard, sub: "2,300 emails, 19 hours", kind: store, tone: neutral, at: [0, 2] }
    - { id: slice, label: One workflow, sub: one kind of email and its people, kind: decision, tone: purple, at: [1, 1] }
    - { id: activity, label: AI-assisted tickets, sub: rises whenever the tool is used, kind: output, tone: pink, at: [2, 0] }
    - { id: outcome, label: A customer number, sub: measured from a baseline, kind: guard, tone: green, at: [2, 2] }
    - { id: review, label: Week 6 review, sub: agree to it or stop, kind: output, tone: teal, at: [3, 2] }
  edges:
    - { from: request, to: slice, label: "which part first?", step: 1 }
    - { from: dashboard, to: slice, label: where the volume is, step: 2 }
    - { from: slice, to: activity, label: counts the tool, tone: danger }
    - { from: slice, to: outcome, label: counts the customer, tone: success, step: 3 }
    - { from: outcome, to: review, label: "baseline, target, date", step: 4 }

approach:
  goal: An outcome the COO can agree to or reject in one reply
  branches:
    - label: Narrow the request
      leaves: [one kind of email, one group of people]
    - label: Count what the customer gets
      detail: A number that rises whenever the tool is used measures the tool.
      leaves: ["what would change for the customer?", "what would stop it being gamed?"]
    - label: Anchor it
      leaves: [today's figure and where it comes from, a date inside the review]
    - label: Fence it
      leaves: [what this will not do, the one decision you need]

coach:
  opening: >-
    Before you write, pick the one kind of email you would start with, and
    say to yourself why that one.
  signals:
    - id: no-workflow
      when: { code_lacks: '(?i)claim\s+status|where\s+(a|their|the)\s+claim|status\s+of\s+(a|their|the)\s+claim|second\s+repl|already\s+sent|one\s+(type|kind|category)\s+of|\b(40|forty|31|thirty-one)\s*(percent|%)|\bslice\b|start\s+with' }
      say: >-
        Your outcome covers all of support. Which one kind of email would you
        start with, and what makes it a good first slice?
    - id: activity-metric
      when:
        code_matches: '(?i)ai[-\s]assisted|(tickets?|emails?)\s+(handled|touched|drafted)\s+by\s+(the\s+)?(ai|assistant)'
        code_lacks: '(?i)time\s+to|time\s+from|\bhours?\b|resolved|second\s+repl|usage'
      say: >-
        You are counting what the AI did. Would that number fall if customers
        waited longer for worse replies?
    - id: no-baseline
      when: { code_lacks: '(?i)baseline|today|currently|at\s+the\s+moment|before\s+anything\s+changes|starting\s+point|19\s+hours|measured?\s+(it|them|this)\s+(over|from|for)' }
      say: >-
        Your target has nothing to be compared with. What is the number today,
        and where will that figure come from?
    - id: no-date
      when: { code_lacks: '(?i)\bweeks?\s+(\d+|one|two|three|four|five|six)\b|\b(\d+|two|three|four|five|six|eight)\s+weeks\b|\bby\s+(the\s+)?(review|end\s+of|thursday|friday|monday)|\bdeadline\b|\bdays?\s+\d+|\b\d+\s+days\b' }
      say: >-
        There is no date in your outcome. When will the COO know whether it
        worked, and is that before the review?
    - id: no-non-goal
      when: { code_lacks: '(?i)will\s+not|won''t|not\s+(in|part\s+of)\s+(the\s+)?(scope|this)|out\s+of\s+scope|non-goal|not\s+going\s+to|does\s+not\s+(include|cover)|is\s+not\s+a\b' }
      say: >-
        Nothing says what this first piece of work will not do. What is the
        COO most likely to assume it covers?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Write one sentence naming the kind of email you would start with, and
        one naming the number that should move. The rest hangs off those two.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three tries without a pass. Open the hints; the second one is about the
        number the COO's office asked for.
  wrap_up: >-
    A vague request gets a precise answer by narrowing it: one workflow, one
    number that tracks the customer, today's value and a date. Usage counts
    belong on the slide next to the outcome, never in its place.

reference_md: |
  The request is a direction. The job is to turn it into something that can
  be shown to be wrong in six weeks.

  "Faster support" covers 2,300 emails a week, fourteen agents and every
  question a policyholder asks, and there is no single number for all of it
  that an assistant could move by the review and anybody could check. The
  claim status emails are the natural place to start: the biggest single
  group, an answer that already exists in a system, and a reply that is
  mostly a lookup, which is the shape of work a drafting assistant is good
  at. Another slice with the same properties would do as well. An answer
  that picks no slice has no baseline, because nobody can measure "support".

  The requested metric is the trap in the brief. A count of AI-assisted
  tickets rises whenever the tool is used, so it goes up in a week when
  replies got slower, and fastest of all if agents are told to use the tool
  on everything. It measures adoption. Adoption is worth reporting next to
  the outcome rather than instead of it, and saying so before the first slide
  reaches the board is far cheaper than saying so after.

  The baseline is the step most answers skip, and it is what turns the review
  into a decision. Nineteen hours is the median across all email. The claim
  status median could be four hours or forty, and a target set against the
  wrong one is a guess. Measuring it from last month's ticket timestamps
  costs a day.

  The non-goal protects the pilot from the two readings most likely to sink
  it: that it will send replies on its own, and that it is a staffing plan.
  Either one, assumed quietly by the wrong person, turns a working pilot into
  a political problem.

complexity: C3

interview_evidence:
  round: both
  asked_as: |
    A client says "we need AI to make support faster" and wants to report the number of AI-assisted tickets. How do you turn that into a useful first problem?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I028,
    whose follow-up is a requested metric that counts generated answers. That bank
    labels every entry "Original interview-style practice; actual employer frequency
    unverified", and this inherits the caveat.

traps:
  - Proposing an assistant for all of support, with no single kind of email and no group of people anyone
    could measure next week.
  - Making the count of AI-assisted tickets the success measure, a number that rises whenever the tool
    is used, even as replies get slower.
  - Setting the target against the 19-hour median for all email, when the chosen slice needs its own baseline
    measured from ticket timestamps.
  - Putting the date past the six-week review, or leaving out a guard number that stops speed being bought
    with worse replies.
