reference_md: |
  The elaboration agent did what it was asked. It read two intent lines and
  proposed twelve questions, and ten of them serve those lines. Q-7 and Q-12
  read like discovery questions too. On the sponsor's list, a question about
  scheduling installations tells her installations are part of the work, and a
  question about cancelling requests when customers go quiet tells her somebody
  plans to. A sort that forwards whatever discovery cannot answer makes her the
  filter for the agent's mistakes, in the one reply she gives to discovery.

  Each id in `traces_to` is a claim the agent makes about its own question, and
  only the agreed intent can settle it. `intent()` lists the lines the sponsor
  agreed. A question goes forward when it cites at least one id and every id it
  cites is on that list. INT-9 fails the lookup because nobody ever wrote it,
  and a real line cited beside it does not change that. The sponsor's opening
  sentence fails it as well: it is on file as INT-0, and it is the ask she made
  before anyone agreed what the work would serve.

  Null is the data lead's way of saying nobody has measured the thing. Q-9 asks
  how many customers complete a diagnostic chat today, a number no one has, so
  the question goes to the sponsor and stays out of the answers. A measured 0 is
  the other case: somebody read it, and it belongs with the answers. Comparing
  the read with `None`, instead of testing whether it is truthy, keeps the two
  apart.

  AWS puts this step in Inception and names it Mob Elaboration, in which AI
  turns business intent into requirements, stories and units, "where the entire
  team actively validates AI's questions and proposals"
  ([AI-Driven Development Life Cycle](https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/),
  AWS DevOps blog, Raja SP, 31 July 2025, read 8 October 2026). Running the
  check in code first means the team spends its time on the five questions only
  the sponsor can answer.

  A reason travels with every drop because both questions come back in later
  stages of this build: the auto-cancel idea as a requirement nobody asked for,
  and installations as a message from the sponsor. A dropped question with its
  reason is what lets the team say why each one was never asked.

  The three lists, the routing rule and the ids are this problem's own
  construction.

interview_evidence:
  round: both
  asked_as: |
    An AI agent proposed a dozen discovery questions for your client. Before any of them reach the sponsor, what do you check, and what happens to a question nobody can answer from the data?
  source: |
    Author judgement. No employer frequency data stands behind it. AWS describes Inception's
    Mob Elaboration as the step "where the entire team actively validates AI's questions and
    proposals": AI-Driven Development Life Cycle, AWS DevOps blog, Raja SP, 31 July 2025,
    https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/, read 8 October 2026.

tools:
  - name: intent
    args: ""
    returns: The intent lines the sponsor agreed, each with its `id` and `text`.
  - name: discovery
    args: metric
    returns: "The data lead's read for that metric: a number, or null when nobody has measured it."
example:
  case: sorts_the_twelve_questions_the_agent_proposed
  expect: Q-1, Q-2, Q-4, Q-8 and Q-11 are answered from discovery, the five with no number go to the
    sponsor, and Q-7 and Q-12 are dropped because neither cites an agreed intent line.
traps:
  - Sending the sponsor every question discovery cannot answer, including ones that cite a line nobody
    wrote or cite nothing at all.
  - Checking only that `traces_to` is not empty, when every id in it has to be a line `intent()` returns.
  - Testing the read for truth, so a measured 0 goes to the sponsor as if nobody had read it.
  - Passing a null on as an answer, which the discovery plan then reads as a number somebody measured.
