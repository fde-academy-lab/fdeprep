steps:
  - id: s1
    text: Check each of a stage's four gates, and name every one that does not hold.
    check_id: s1
  - id: s2
    text: Treat a missing measurement, or accuracy from fewer than `min_graded` tasks, as a gate that does not hold.
    check_id: s2
  - id: s3
    text: Move the pilot up a stage when every gate of the stage above holds.
    check_id: s3
  - id: s4
    text: Move a POC no further than MVP in one review, whatever its numbers say.
    check_id: s4

step_checks:
  # The first public pilot misses all four production gates, so only code
  # that checks every gate names all four.
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: '"missed":\s*\["accuracy",\s*"cost_per_task",\s*"escalation_rate",\s*"sign_off"\]' }
  # Every public pilot reports every measurement on a big enough sample, so
  # this check runs its own: 60 graded tasks against a table asking for 100,
  # and no spend at all.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "Can the credit-note pilot become an MVP this week?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: poc, tasks: 900, escalated: 180, graded: 60, correct: 58, signed_off: [mvp] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"stage":\s*"poc"' }
        - { type: returns_matches, value: '"missed":\s*\["accuracy",\s*"cost_per_task"\]' }
  # The starter code never returns production, so this holds only once the
  # third public pilot is promoted.
  - step_id: s3
    spec:
      assertions:
        - { type: returns_matches, value: '"stage":\s*"production"' }
  # No public pilot is a POC with production numbers, so this check runs one.
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "The shelf-audit pilot beat the production gates. Where does it stand?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: poc, tasks: 3000, escalated: 330, graded: 420, correct: 405, spend_inr: 24000, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"stage":\s*"mvp"' }

hints:
  - Before comparing anything, write down for each gate which fields it reads
    and what has to be true of them. Then ask what each gate does when one of
    those fields is missing.
  - A blank and a zero are different facts, and so are 30 graded tasks and
    400. A gate whose evidence is missing or too thin has not been shown to
    hold.
  - Write one function that takes a stage and returns every gate of that stage
    that does not hold. Promotion is then a question of whether that list is
    empty for the stage above.
  - The stage above depends on where the pilot is now. A POC's stage above is
    MVP, whatever its numbers say about production.

scenario:
  headline: "A spreadsheet moved a pilot from POC to production on 30 graded tasks"
  who: The steering committee at a pharmacy chain the size of Apollo Pharmacy
  situation: >-
    Three agent pilots are reviewed every week against gates the CFO agreed.
    Last Thursday the committee's spreadsheet sent one from POC straight to
    production, on a perfect accuracy from 30 graded tasks and a spend column
    nobody filled in.
  stakes: >-
    A pilot promoted on evidence nobody gathered touches real suppliers'
    payments, and the committee stops trusting every number the next pilot
    brings.
  metrics:
    - { label: Graded tasks behind 100%, value: 30 of 400 }
    - { label: Spend recorded, value: none }
    - { label: Stages skipped, value: "1" }

diagram:
  title: Where the spreadsheet read a blank as a pass
  caption: >-
    Each gate reads its evidence from the results. A gate whose evidence is
    missing or too thin cannot hold, and a POC becomes an MVP first.
  direction: lr
  nodes:
    - { id: results, label: Pilot results, sub: what the pilot measured, kind: store, tone: blue, at: [0, 0] }
    - { id: table, label: Gate table, sub: agreed with the CFO, kind: doc, tone: purple, at: [0, 2] }
    - { id: check, label: Gate check, sub: four gates for the stage above, kind: guard, tone: teal, at: [1, 1] }
    - { id: stage, label: Stage after review, sub: one step up at most, kind: decision, tone: green, at: [2, 0] }
    - { id: missed, label: Missed gates, sub: "every one, in table order", kind: output, tone: orange, at: [2, 2] }
    - { id: sheet, label: The old spreadsheet, sub: read a blank spend as zero, kind: doc, tone: pink, at: [1, 3] }
  edges:
    - { from: results, to: check, label: measurements, step: 1 }
    - { from: table, to: check, label: thresholds, step: 1 }
    - { from: check, to: stage, label: every gate holds, tone: success, step: 2 }
    - { from: check, to: missed, label: any gate does not, step: 2 }
    - { from: results, to: sheet, label: "30 graded, no spend", tone: muted }
    - { from: sheet, to: stage, label: POC to production, tone: danger }

approach:
  goal: Move a pilot up only when every gate of the stage above has its evidence
  branches:
    - label: Work out each measurement
      leaves: [accuracy from the graded tasks, cost and escalation per task attempted]
    - label: Decide what missing evidence means
      detail: A blank spend is a figure nobody recorded, and a few graded tasks are too few to trust.
      leaves: [a field that is missing or null, fewer graded tasks than `min_graded`]
    - label: Name every miss
      leaves: [all four gates every time, in the order of the table]
    - label: Move one stage at a time
      leaves: [a POC becomes an MVP first, a pilot never moves down]

coach:
  opening: >-
    Before you compare anything, list what each gate needs from the results,
    and what the gate does when that evidence is missing.
  signals:
    - id: no-min-graded
      when:
        code_matches: '["'']correct["'']'
        code_lacks: 'min_graded'
      say: >-
        Your accuracy never looks at `min_graded`. Would you promote a pilot on
        30 graded tasks when the table asks for 400?
    - id: blank-as-zero
      when: { code_matches: '\.get\(\s*["''](spend_inr|graded|correct|escalated|tasks)["'']\s*,\s*0' }
      say: >-
        A blank becomes a zero here. Is a spend nobody recorded the same as a
        pilot that cost nothing?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        The gates are arithmetic against a table the sponsor agreed. What would
        a model call add, and could the committee reproduce its answer?
    - id: hidden-skips-a-stage
      when: { test_failed: a_poc_moves_one_stage_even_with_production_numbers }
      say: >-
        In that run a POC cleared every production gate. Where does your code
        decide which stage is the one above?
    # Before the thin-sample and missing-spend signals: code that demotes an
    # MVP fails those two cases as well, and moving down is its real mistake.
    # Code that mishandles only the sample or the blank passes this case.
    - id: hidden-moves-down
      when: { test_failed: an_mvp_whose_accuracy_slipped_never_moves_down }
      say: >-
        In that run an MVP no longer cleared its own stage's gates. Where
        does your code start counting from, and does a pilot ever move down?
    - id: hidden-thin-sample
      when: { test_failed: thirty_right_out_of_thirty_is_too_few_to_count }
      say: >-
        In that run the accuracy was perfect. How many tasks was it read from,
        and how many does the table ask for?
    - id: hidden-missing-spend
      when: { test_failed: spend_nobody_recorded_does_not_hold }
      say: >-
        In that run one measurement was never recorded. What does your code do
        with a value that is not there?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with one function that takes a stage and returns every gate it
        misses. The stage decision is whether that list is empty.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints go from where to look to the shape of
        the fix, so open the first one.
  wrap_up: >-
    A gate holds only when its evidence is there. Count a blank as a miss,
    read accuracy from a sample big enough to mean something, name every
    miss, and move one stage at a time.

tests:
  - name: a_poc_that_holds_every_mvp_gate_becomes_an_mvp
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Where does the invoice-matching pilot stand after week six?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: poc, tasks: 4200, escalated: 966, graded: 250, correct: 230, spend_inr: 52500, signed_off: [mvp] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: pilot_results }
        - { type: calls_tool, name: gate_table }
        - { type: tool_calls_at_most, value: 2 }
        - { type: llm_calls_at_most, value: 0 }
        - type: valid_json_return
          schema:
            type: object
            required: [stage, missed]
            properties:
              stage: { enum: [poc, mvp, production] }
              missed: { type: array, items: { type: string } }
        - { type: returns_matches, value: '"stage":\s*"mvp"' }
        - { type: returns_matches, value: '"missed":\s*\["accuracy",\s*"cost_per_task",\s*"escalation_rate",\s*"sign_off"\]' }

  - name: a_poc_that_misses_two_mvp_gates_stays_a_poc
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Can the supplier-onboarding pilot become an MVP yet?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: poc, tasks: 1800, escalated: 810, graded: 160, correct: 146, spend_inr: 23400, signed_off: [] }
        gate_table:
          returns:
            mvp: { accuracy: 0.9, min_graded: 150, cost_per_task_inr: 15, escalation_rate: 0.3 }
            production: { accuracy: 0.97, min_graded: 500, cost_per_task_inr: 8, escalation_rate: 0.1 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: '"stage":\s*"poc"' }
        - { type: returns_matches, value: '"missed":\s*\["escalation_rate",\s*"sign_off"\]' }

  - name: an_mvp_that_holds_every_production_gate_goes_to_production
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Is the stock-reorder pilot ready for production?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: mvp, tasks: 12000, escalated: 1440, graded: 500, correct: 481, spend_inr: 96000, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"stage":\s*"production"' }
        - { type: returns_matches, value: '"missed":\s*\[\s*\]' }

  - name: a_poc_moves_one_stage_even_with_production_numbers
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "The returns pilot beat every production number. Can it go live on Monday?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: poc, tasks: 2000, escalated: 200, graded: 450, correct: 437, spend_inr: 14000, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.8, min_graded: 100, cost_per_task_inr: 20, escalation_rate: 0.4 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 10, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"stage":\s*"mvp"' }
        - { type: returns_matches, value: '"missed":\s*\[\s*\]' }

  - name: thirty_right_out_of_thirty_is_too_few_to_count
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "The price-check pilot is 100 percent accurate. Can it go to production?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
