slug: promote-a-pilot-only-when-every-gate-holds
title: "Promote a pilot only when every gate holds"
day: 27
skill: Move a pilot up one stage only on evidence, and name every gate it still misses
artefact_type: code
difficulty: medium
track: agentic-pdlc
concept:
  topic: "POC, MVP, production"
  question: "When has a pilot earned the next stage, and what counts as evidence?"
est_minutes: 30
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

brief_md: |
  Your client, a pharmacy chain the size of Apollo Pharmacy, runs three agent
  pilots in its finance and supply teams. A steering committee reviews each
  one every week and decides whether it stays a POC, becomes an MVP with real
  users, or goes to production. The gates for each stage were agreed with the
  chief financial officer, who sponsors all three pilots.

  Until now a spreadsheet made the call. Last Thursday it moved the
  supplier-onboarding pilot from POC straight to production. Its accuracy was
  100 percent, read from 30 graded tasks where the table asks for 400, and its
  spend column was empty, which the spreadsheet read as zero. The CFO caught
  it the next morning and has asked you for a gate check the committee can
  rerun and trust.

  Write it. It says where a pilot stands after the review, and names every
  gate the pilot still misses for the stage above.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the committee's question about one pilot. Call
  `tools["pilot_results"]()` and `tools["gate_table"]()` once each. `llm` is
  passed in and must not be called: the decision is arithmetic against a
  table the sponsor agreed.

  `pilot_results()` returns what the pilot measured:

      {"stage": "poc", "tasks": 4200, "escalated": 966,
       "graded": 250, "correct": 230, "spend_inr": 52500,
       "signed_off": ["mvp"]}

  `stage` is where the pilot is now, `poc` or `mvp`. `tasks` counts every task
  the agent attempted, `escalated` the ones it handed to a person, `graded`
  the ones a reviewer checked and `correct` how many of those it got right.
  `spend_inr` is the model and tool spend for the period, and `signed_off`
  lists the stages the sponsor has signed off.

  `gate_table()` returns the gates of each stage above a POC:

      {"mvp":        {"accuracy": 0.85, "min_graded": 100,
                      "cost_per_task_inr": 18, "escalation_rate": 0.35},
       "production": {"accuracy": 0.95, "min_graded": 400,
                      "cost_per_task_inr": 9, "escalation_rate": 0.15}}

  A stage has four gates, checked in this order:

  | Gate | Holds when |
  |---|---|
  | `accuracy` | `graded` is at least `min_graded`, and `correct / graded` is at least `accuracy` |
  | `cost_per_task` | `spend_inr / tasks` is at most `cost_per_task_inr` |
  | `escalation_rate` | `escalated / tasks` is at most `escalation_rate` |
  | `sign_off` | the stage is in `signed_off` |

  A gate whose measurement is missing or null does not hold.

  A pilot moves up one stage when every gate of the stage above holds. It
  moves at most one stage in a review, so a POC never goes straight to
  production, and it never moves down.

  Return a JSON string:

      {"stage": "mvp", "missed": ["accuracy", "sign_off"]}

  `stage` is where the pilot stands after the review. `missed` names every
  gate of the stage above it that does not hold, in the order of the table,
  and is empty when the pilot is in production.

  Budget: one call to each tool and no model calls. Allowed imports: json.

