          returns: { stage: mvp, tasks: 9000, escalated: 990, graded: 30, correct: 30, spend_inr: 72000, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"stage":\s*"mvp"' }
        - { type: returns_matches, value: '"missed":\s*\["accuracy"\]' }

  - name: spend_nobody_recorded_does_not_hold
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Has the delivery-slot pilot earned production this week?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: mvp, tasks: 10000, escalated: 1200, graded: 600, correct: 576, spend_inr: null, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"stage":\s*"mvp"' }
        - { type: returns_matches, value: '"missed":\s*\["cost_per_task"\]' }

  - name: an_mvp_whose_accuracy_slipped_never_moves_down
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "The invoice-matching pilot had a bad fortnight. Where does it stand now?" }
      llm_script:
        - { match: "*", reply: "Production. Every number on the dashboard is green." }
      tools:
        pilot_results:
          returns: { stage: mvp, tasks: 5000, escalated: 600, graded: 400, correct: 320, spend_inr: 40000, signed_off: [mvp, production] }
        gate_table:
          returns:
            mvp: { accuracy: 0.85, min_graded: 100, cost_per_task_inr: 18, escalation_rate: 0.35 }
            production: { accuracy: 0.95, min_graded: 400, cost_per_task_inr: 9, escalation_rate: 0.15 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"stage":\s*"mvp"' }
        - { type: returns_matches, value: '"missed":\s*\["accuracy"\]' }

reference_md: |
  The spreadsheet compared the numbers it had with the numbers in the table,
  and that is the mistake. A gate is a promise the sponsor agreed to, and it
  holds only when somebody measured the thing it is about. Code that checks
  only the figures present reads every gap in the evidence as a pass.

  Three gaps did the damage, and each one needs its own rule.

  A measurement nobody recorded does not hold. The empty spend column was
  read as zero, and a pilot that cost nothing clears every cost gate ever
  written. `None` is the honest value, and a gate that receives it fails and
  says so. A `TypeError` is no better, because a crashed check promotes
  nothing and explains nothing.

  An accuracy read from too few tasks does not hold either. Thirty right
  answers out of thirty is a perfect score and very little evidence: at the
  usual 95 percent confidence it still allows an agent that is wrong about one
  time in ten, twice what the production gate allows. The table's
  `min_graded` is the sponsor saying how much evidence she agreed to act on,
  so it belongs inside the accuracy gate rather than beside it.

  A pilot moves one stage per review. A POC usually runs on past data and
  without real users, so its numbers say what the agent can do and say little
  about what happens when people depend on it. The MVP is where that gets
  measured. AWS draws the same line in its open-source AI-DLC workflows,
  whose proof-of-concept profile the documentation calls "evidence for a
  later decision; it is not the production-readiness profile" (version
  2.10.0 of [aidlc-workflows](https://github.com/awslabs/aidlc-workflows),
  read 1 October 2026).

  A pilot never moves down in a review either. Code that works the stage
  out afresh from POC every week demotes an MVP whose accuracy dipped, and
  taking a pilot away from the users it already has is a decision the
  committee makes in the room.

  Naming every miss, instead of the first, is what turns the check into a
  work plan. "Escalation rate and sign-off" tells the sponsor two things to
  fix and one to sign. A check that stops at the first failure hands the
  committee one item a week.

  The model stays out of it. The decision is arithmetic against a table the
  sponsor signed, so anyone on the committee can rerun it and get the same
  answer, and a model asked whether the pilot is ready answers with the
  confidence of the dashboard it was shown.

  The four gates, their thresholds and the one-stage rule are this problem's
  own construction. No method prescribes them, and a real engagement agrees
  its own table with its sponsor before the pilot starts.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Your agent pilot scored 100 percent and the sponsor wants it in production next week. What has to be true before you agree, and how would you check it?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: pilot_results
    args: ""
    returns: The pilot's `stage`, `tasks`, `escalated`, `graded`, `correct`, `spend_inr` and `signed_off`,
      any of which may be missing.
  - name: gate_table
    args: ""
    returns: The gates of `mvp` and `production`, each with `accuracy`, `min_graded`, `cost_per_task_inr`
      and `escalation_rate`.
example:
  case: a_poc_that_holds_every_mvp_gate_becomes_an_mvp
  expect: Every MVP gate holds, so the POC becomes an MVP, and all four production gates are named as
    missed, in the order of the table.
traps:
  - Reading accuracy from however many tasks were graded, so a handful of perfect grades clears a gate
    that asks for hundreds.
  - Reading a measurement nobody recorded as zero, or letting it raise, when a missing figure is a gate
    that does not hold.
  - Working the stage out from the numbers alone, so a POC with production numbers skips a stage, or an MVP
    that slipped drops back to POC.
  - Stopping at the first gate that fails, so the sponsor never sees the rest of the list.
