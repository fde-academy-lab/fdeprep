reference_md: |
  The construction agent wrote eleven fluent requirements and cited
  something for ten of them, so the draft reads as if every line was asked
  for. A citation is a claim that somebody asked, and this check is where
  the claim gets tested.

  Each source answers a different question. An answered question is
  somebody's ask, met by discovery's numbers or by the sponsor's reply. A
  row in the ledger is something somebody counted, typed or estimated. An
  intent line is what the sponsor agreed on 4 February; her opening sentence
  of 2 February, logged as INT-0, is not one, and nothing may rest on it.
  Everything else is a citation of nothing, and it comes in several shapes.
  R-9 cites no id at all. It is the easiest to see and the one that would
  have hurt most: a request cancelled after a day without a reply lands on
  the customers who do not answer chats, and in the Nagpur trial 59 percent
  never finished one. R-11 cites Q-7, the installations question the
  elaboration check dropped because it traced to no intent line, so the
  requirement carries the drop forward. A target resting on Q-9 rests on a
  number nobody has, since the sponsor could not say how many customers
  finish a chat today. An id the ledger never held, such as EV-17, is the
  hole claim C-13 fell into in the PR/FAQ draft.

  Every id has to resolve. A requirement that cites an answered question and
  a missing row is half asked for, and the half nobody asked for is usually
  the part that costs money. The first id that fails goes back to the
  sponsor with its reason, because she can act on "EV-17 is not in the
  ledger" and can do nothing with "this one looks wrong".

  Conflicts are a separate failure, and good sources do not prevent them.
  R-4 rests on the intent line and on Q-1, the baseline discovery measured,
  and R-8 rests on one city's chat-completers. Both are in, and they promise
  the week-6 review two different medians. Grouping by metric gives the
  sponsor one line for each number she has to choose. Reporting pairs gives
  her two lines when a third requirement joins, and she settles one and
  misses the other. Flagging two requirements that state the same number
  hands her a choice that does not exist. On 18 February she withdrew R-8,
  rejected R-9 and deferred R-11 to the MVP gate.

  The model stays out of the check. The agent drafts, the check is a lookup
  anyone can rerun, and the decision is hers. AWS describes this step of its
  AI-Driven Development Life Cycle as the one "where the entire team
  actively validates AI's questions and proposals"
  ([AWS DevOps blog](https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/),
  Raja SP, 31 July 2025, read 8 October 2026), and BMAD names "PRD
  validate" among its "five moments where a human decision is expected"
  ([BMAD, plan inside an organization](https://docs.bmad-method.org/plan/plan-inside-an-organization/),
  with `bmad-method` at release 6.12.1, read 8 October 2026). The reasons,
  the every-id rule and the conflict rule are this problem's own
  construction, and so are the client and its numbers.

interview_evidence:
  round: written
  asked_as: |
    An agent drafted your PRD from the discovery notes. Before the sponsor signs it, how do you check that every requirement is something somebody actually asked for?
  source: |
    Author judgement. No employer frequency data stands behind it. The step it practises, people
    validating what an agent proposed, follows the AWS DevOps blog post "AI-Driven Development Life
    Cycle: Reimagining Software Engineering" (Raja SP, 31 July 2025,
    https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/), read 8 October 2026.

tools:
  - name: questions
    args: ""
    returns: Every discovery question as `{id, status}`, where the status after the sponsor's replies is
      `answered`, `unanswered` or `dropped`.
  - name: ledger
    args: ""
    returns: Every row of the evidence ledger as `{id, kind}`, from EV-1 to EV-16.
example:
  case: prd_v1_sends_two_back_and_names_one_conflict
  expect: R-9 cites nothing and R-11 cites the dropped Q-7, so both go back as unasked. R-4 and R-8 set
    the median at 3.0 and 2.5 days, which is one conflict naming both. Nine stay in, R-4 and R-8 among them.
traps:
  - Treating every question on the list as a source, when a requirement resting on an unanswered question
    rests on a number nobody has.
  - Taking an evidence or intent id at face value, when the ledger never held the row or the id is no
    agreed intent line.
  - Keeping a requirement because one of its ids resolves, when every id it rests on has to.
  - Reporting conflicts pair by pair, or flagging requirements that agree, when the sponsor needs one line
    for each number she has to choose.
