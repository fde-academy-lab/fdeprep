reference_md: |
  Twelve of the draft's fourteen claims cite rows that exist, so the committee
  sees numbered claims with their sources and has every reason to trust them.
  C-9, "The agent resolves 65 percent of requests without a visit", is stated
  as counted and cites EV-12. EV-12 is in the ledger, and it is a line from a
  vendor's sales deck. A check that only resolves the id passes C-9, and the
  POC gets judged against a seller's number.

  A row's kind decides what it can carry. A counted row was read from a system
  of record, and a trial row was measured, if only in one city and without
  randomising; both carry the number they hold. A typed row is a person's pick
  from a code list, an estimate is somebody's arithmetic, and a vendor row comes
  from someone selling; each carries an assumption at most.

  A claim is as strong as the weakest row under it. C-8, which says partner
  stock is checked before a slot is booked, cites the partner survey of stock
  sheets (typed) and the 23 percent of visits that end without the part
  (counted). The counted row shows the problem is real, and only the survey
  speaks to the stock sheets the agent would read, so the claim is an
  assumption whichever row the draft lists first.

  A cited id the ledger does not have fails the whole claim. C-13 cites EV-17,
  which nobody ever logged. Skipping the missing id and grading the rows that
  are left would carry a claim the draft half invented, and the check would
  repeat the draft's mistake.

  The status comes from the ledger, and `stated_as` is reported beside it.
  Where the draft says counted and the ledger says assumption, the committee
  sees the overstatement on one line. Where the draft hedges a claim on a
  counted row, the claim is still carried, and the committee learns the
  evidence is stronger than the draft let on.

  BMAD puts a human decision at this point. Its guide to planning inside an
  organization says "The skills give you five moments where a human decision is
  expected, and each one blocks something specific." The first of the five is
  the PRFAQ verdict, which blocks writing the PRD, and "Every one of these
  produces a written result, so the approval has something to attach to."
  ([Plan inside an organization](https://docs.bmad-method.org/plan/plan-inside-an-organization/),
  read 8 October 2026, when the current BMAD release was 6.12.1.) Friday's vote
  is that verdict, and this check is the written part of what it attaches to.
  On Friday 13 February the committee funded a four-week POC from 23 February.

  Writing a PR/FAQ yourself is another problem in this chapter, Write a PR/FAQ
  with evidence for each claim. The five kinds and the weakest-row rule are this
  problem's own construction.

interview_evidence:
  round: written
  asked_as: |
    An agent drafted your client's PR/FAQ, and every claim cites the evidence log. Before the funding committee reads it, how do you check which claims the evidence can actually carry?
  source: |
    Author judgement. No employer frequency data stands behind it. BMAD's Plan inside an
    organization page, https://docs.bmad-method.org/plan/plan-inside-an-organization/, names
    the PRFAQ verdict as the first of five moments where a human decision is expected. Read
    8 October 2026, when the current release of bmad-method on npm was 6.12.1, published
    4 October 2026.

tools:
  - name: ledger
    args: ""
    returns: Every row of the evidence ledger, each with its `id`, `kind` and `source`.
  - name: draft
    args: ""
    returns: The draft's claims in order, each with its `id`, `text`, `rests_on` and `stated_as`.
example:
  case: checks_the_fourteen_claims_in_the_draft
  expect: C-9 cites EV-12, a vendor's sales deck, so it is an assumption although the draft states it
    as counted. Seven claims are carried, five are assumptions and two are unsupported.
traps:
  - Passing a claim because the id it cites is in the ledger, when the row's kind decides what the claim
    can carry.
  - Grading a claim on the first row it cites, when the weakest of its rows decides.
  - Skipping a cited id the ledger does not have, and grading the claim on the rows that are left.
  - Letting the draft's own `stated_as` set the status, when the status comes from the ledger.
