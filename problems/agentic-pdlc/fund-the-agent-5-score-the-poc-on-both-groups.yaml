  - name: a_held_back_export_that_failed_with_a_200
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      The held-back export answered with status 200 and an `error` where its
      bins should be. A scorer that trusts the status goes on to read `bins`
      and raises. A scorer that reads the missing list as an empty one either
      guards the division with 0.0, and gives the agent a 58-point lead over
      a group nobody scored, or applies the rule for a group with no
      requests, and reports something false that leaves the export unfixed.
      The record names the group, quotes the export's own error and carries
      no number, because the POC has no result until the export runs again.
    spec:
      kind: agent_run
      input: { question: "Score the POC from this morning's export." }
      llm_script:
        - match: { contains: "Send your POC report" }
          reply: |
