                bins: [
                  { chat_completed: true, completed_days: 0, requests: 196 }, { chat_completed: true, completed_days: 1, requests: 301 },
                  { chat_completed: true, completed_days: 2, requests: 254 }, { chat_completed: true, completed_days: 3, requests: 156 },
                  { chat_completed: true, completed_days: 4, requests: 74 }, { chat_completed: true, completed_days: 5, requests: 43 },
                  { chat_completed: true, completed_days: 6, requests: 25 }, { chat_completed: true, completed_days: 8, requests: 19 },
                  { chat_completed: true, completed_days: null, requests: 52 }, { chat_completed: false, completed_days: 0, requests: 22 },
                  { chat_completed: false, completed_days: 1, requests: 41 }, { chat_completed: false, completed_days: 2, requests: 47 },
                  { chat_completed: false, completed_days: 3, requests: 50 }, { chat_completed: false, completed_days: 4, requests: 96 },
                  { chat_completed: false, completed_days: 5, requests: 88 }, { chat_completed: false, completed_days: 6, requests: 79 },
                  { chat_completed: false, completed_days: 7, requests: 63 }, { chat_completed: false, completed_days: 9, requests: 46 },
                  { chat_completed: false, completed_days: 12, requests: 26 }, { chat_completed: false, completed_days: null, requests: 162 } ]
              held_back: { status: 200, error: "held_back group export failed" }
            default: { status: 200, error: "no group by that name; the groups are agent and held_back" }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [status, group, reason]
            properties:
              status: { const: not_scorable }
              group: { const: held_back }
              reason: { type: string, pattern: "held_back group export failed" }
        - { type: returns_lacks, value: '"(share|difference|reported)"' }

reference_md: |
  The agent's 81 is a true number about part of its group. It is 907 of the
  1,120 customers who finished the diagnostic chat, and those customers
  chose to finish it. The random split at intake made two groups that
  differ only in how they were handled: 1,840 requests to the agent and
  1,790 held back. Nobody randomised who finished the chat, and the
  customers who do not answer a chat are the ones who do not answer the
  phone either, so they wait longer in either group. Scored whole, the agent
  group is 1,067 of 1,840, 58.0 percent, against 877 of 1,790 held back,
  49.0 percent. The 9.0 points between them are what the agent did.

  Every request stays in its group. The 214 agent requests with no repair by
  22 March are requests the agent did not get repaired, and leaving them out
  of the denominator scores each group on its finished work, 65.6 against
  57.4. The test for a missing repair is `is None`, because a repair closed
  the day it was raised is `0`, and a truthiness test throws away the
  fastest repairs in both groups.

  The comparison is the held-back group. Last summer's 4.3 days would be the
  wrong one: the POC ran in late winter, the held-back group's median was 3.1
  days, and the gap between the two is the season.

  The report is checked on both of its numbers. Its `n` says how much of the
  group it counted, and its `within_3_days` says what it found there. A
  report with the whole group's size and a different count measured
  something else, such as days from the end of the chat instead of from the
  request, so it reaches the review flagged as `unmatched`. A reply the
  scorer cannot read is flagged as `unreadable`, and the POC is still
  scored, because its number never came from the agent.

  A group the data cannot give has no share. An export that failed, or a
  group with no requests, makes the POC not scorable, and the record names
  the group and the reason. The usual repairs for the crash invent a
  number. A guard that returns 0.0 when nothing was counted scores a city
  the POC never ran in, and with a missing list read as an empty one it
  gives the held-back group 0.0 and the agent a 58-point lead. A failed
  export and an empty group also need different reasons, because one sends
  the data lead back to the export and the other says the POC never ran
  there.

  The two error paths need opposite answers, which is why one handler
  around everything fails. A failed export stops the scoring. An unreadable
  report stops only the check, and the POC's number still goes to the
  review.

  AWS describes the AI-Driven Development Life Cycle as one in which AI
  "defers critical decisions to humans"
  ([AWS DevOps blog](https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/),
  Raja SP, 31 July 2025, read 8 October 2026). Whether the POC earned an
  MVP is one of those decisions, so its number comes from the data the split
  produced, and the agent's account of its own work is a claim the scorer
  checks. The voice question "Explain why the POC scored 58, not 81" asks
  you to say this to the sponsor before the board meets. The MVP that
  follows runs without a held-back group, which the next stage of this
  build has to reckon with. The client, the POC and every number here are
  this problem's own construction.

interview_evidence:
  round: both
  asked_as: |
    Your agent's own report says 81 percent of requests were repaired within three days. Counting every request in the trial it is 58, against 49 for the control group. Which number goes to the board, and how do you compute it?
  source: |
    Author judgement. No employer frequency data stands behind it. The split it practises, an
    agent that drafts and a person who decides, follows the AWS DevOps blog post "AI-Driven
    Development Life Cycle: Reimagining Software Engineering" (Raja SP, 31 July 2025,
    https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/), which says AI
    "defers critical decisions to humans", read 8 October 2026.

tools:
  - name: poc_results
    args: group
    returns: One group's export, `agent` or `held_back`, with `bins` counting requests by `chat_completed`
      and `completed_days`, or an `error` key and no `bins`.
example:
  case: the_poc_scores_both_groups_whole
  expect: Every request counts, so the agent group is 1,067 of 1,840, 58.0, against 877 of 1,790 held
    back, 49.0. The report's 907 of 1,120 are the chat completers, flagged at 81.0 against 58.0.
traps:
  - Matching the agent's report to a part of its group by its size alone, when the count of repairs
    inside it has to match as well.
  - Guarding the division with a zero, or reading a failed export as an empty list, so the record
    carries a share nobody measured.
  - Handling every error one way, so a reply you cannot read stops the scoring, or an export that
    failed gets a reason that sends nobody to fix it.
