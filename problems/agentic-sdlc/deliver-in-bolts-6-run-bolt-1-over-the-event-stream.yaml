build: { id: deliver-in-bolts, title: "Deliver the field-service agent in bolts", stage: 6, of: 9 }

brief_md: |
  Stage 6 of 9. Bolt 1 of the field-service agent at an air-conditioner maker
  the size of Voltas started on Thursday 14 May at 09:00 and ended on Tuesday
  19 May at noon. The plan from stage 2, BOLT-1, gave UoW-1 7 hours and UoW-2
  6 hours, each with its one-hour review inside, and left 3 of the bolt's 16
  hours spare. The engineers worked from the twelve tickets stage 4 cleared;
  the ticket agent's re-run on Tuesday 12 May brought back no T-14. When the
  bolt ended its clock read 27: 11 hours over.

  The construction agent stamps every event with `h`, the working hours since
  the bolt started, beside `at`, the wall-clock time. AWS's post on AI-DLC
  (Raja SP, AWS DevOps blog, 31 July 2025, read 8 October 2026) calls bolts
  "shorter, more intense work cycles measured in hours or days rather than
  weeks". Eleven hours over on a 16-hour bolt is most of a second bolt.

  At hour 9 the head of customer service, the sponsor, sent MSG-1: "Add
  installs to this bolt. Same window." Before it reached you, the platform
  engineer had started T-18, an installs intake stub, and typed UoW-9 as its
  unit. Nobody ever accepted a UoW-9. You parked T-18 at hour 11 and moved
  installs to bolt 2's elaboration.

  The agent's own report for the retrospective says the overrun showed at
  `BOLT_ENDED` and lists UoW-9 as the bolt's third unit. Found at the end, an
  overrun tells the team nothing it could have acted on, and a report that
  counts UoW-9 as planned work hides where the hours went.

  Write the bolt report from the plan and the stream, the way the team will
  read every bolt from now on.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the delivery lead asking for the report. Call `plan` and
  `events` once each, and `message` once for each `SPONSOR_MESSAGE`:

      tools["plan"]()   -> {"id": "BOLT-1", "bolt_h": 16, "units": ["UoW-1", "UoW-2"],
                            "planned_h": {"UoW-1": 7.0, "UoW-2": 6.0},
                            "carried": ["UoW-4", "UoW-8", "UoW-5", "UoW-6"], ...}
      tools["events"]() -> [{"id": "EVT-17", "kind": "REVIEW_DONE", "h": 9.0,
                             "at": "2026-05-15T10:00+05:30", "ref": "RV-1",
                             "unit": "UoW-1", "note": "...",
                             "outcome": "changes_requested"}, ...]
      tools["message"](ref="MSG-1") -> {"status": 200, "text": "..."}

  The stream is in order. `ref` names the bolt, a ticket, a review or a
  message, and `unit` is null on bolt and message events. Only `REVIEW_DONE`
  carries `outcome`, which is `approved` or `changes_requested`.

  | Rule | What it says |
  |---|---|
  | Clock | Time is `h`. `at` is for people reading the trail |
  | Runs | A ticket runs from `TICKET_STARTED` to `TICKET_DONE` or `TICKET_PARKED`, a review from `REVIEW_REQUESTED` to `REVIEW_DONE`. A unit's `actual_h` is the sum of its runs, and a ticket can run more than once |
  | The bolt | The plan's `units` are the bolt. Hours on any other unit are unplanned: reported under `unplanned`, and never in `units`, `carried` or the projection |
  | Approved | A unit is approved at the first `REVIEW_DONE` for it whose `outcome` is `approved` |
  | Projection | At each event up to `BOLT_ENDED`, after counting the runs it ends: `h` plus, for each planned unit not yet approved, `max(0, planned_h - hours_so_far)` |
  | First knowable | The `id` of the first event whose projection is greater than `bolt_h`, or null |
  | Elapsed | `elapsed_h` is the `h` of `BOLT_ENDED`. `overrun_h` is `elapsed_h` minus `bolt_h`, or 0 when that is below 0 |
  | Messages | A `SPONSOR_MESSAGE` never changes the running bolt. Each goes `to` `"bolt 2 elaboration"` with its `text` as `message` returned it, the `unit` of the first unplanned run started after it and before `BOLT_ENDED` (null when there was none), and `hours_spent`, that unit's hours |

  Return a JSON string with `units` in the plan's order, and `unplanned` and
  `messages` in the order the stream first shows them:

      {"bolt": "BOLT-1",
       "units": [{"unit": "UoW-1", "planned_h": 7.0, "actual_h": ...}, ...],
       "unplanned": [{"unit": ..., "actual_h": ...}],
       "elapsed_h": ..., "overrun_h": ..., "first_knowable": "EVT-..." or null,
       "carried": [...],
       "messages": [{"ref": "MSG-1", "text": "...", "to": "bolt 2 elaboration",
                     "unit": ..., "hours_spent": ...}]}

  Budget: one call each to `plan` and `events`, one `message` call per
  message, and no model calls. `llm` is passed in and must not be called.
  Allowed imports: json.

defence_question: |
  Your clock says the overrun was knowable at hour 11. The vendor engineer
  says hour 9, when the first review asked for changes. What would the
  projection have to know to fire at hour 9, and what would it get wrong on a
  bolt whose first review asks for a one-line change?

stub_code: |
  import json


  def run_agent(question: str, llm, tools: dict) -> str:
      """Replay a bolt's event stream into the bolt report.

      tools["plan"]() returns BOLT-1: its units, each unit's planned_h, the
      bolt's length bolt_h, and the units carried to the next bolt.
      tools["events"]() returns the stream in order. Time is each event's h.
      tools["message"](ref=...) returns a sponsor message's status and text.

      A unit's hours are the sum of its runs: ticket start to done or parked,
      review requested to done. At every event up to BOLT_ENDED, project h
      plus what each unapproved planned unit still owes, and keep the first
      event past bolt_h. Work on a unit outside the plan is unplanned.

      Return json.dumps({"bolt": ..., "units": [...], "unplanned": [...],
                         "elapsed_h": ..., "overrun_h": ...,
                         "first_knowable": ..., "carried": [...],
                         "messages": [...]}).
      No model calls. Allowed imports: json.
      """
      plan = tools["plan"]()
      events = tools["events"]()
      return json.dumps({"bolt": plan["id"], "units": [], "unplanned": [],
                         "elapsed_h": 0.0, "overrun_h": 0.0, "first_knowable": None,
                         "carried": plan["carried"], "messages": []})

hints:
  - Work EVT-20 by hand. How many hours had the bolt clock run, how many had
    UoW-1 and UoW-2 each used, and how many did each still owe?
  - Every hour belongs to one run, from the event that opens it to the event
    that ends it, read on `h`. Two runs can be open at once, and a ticket a
    review sends back runs again.
  - A unit owes its planned hours minus the hours it has used, never below
    zero, until a review approves it, and a review that asks for changes
    approves nothing. The bolt's length is the clock at `BOLT_ENDED`,
    whatever the units' hours add up to.
  - Walk the events once. Open each run under its own `ref`, close it into
    its unit, project after every event, and keep the first `id` past
    `bolt_h`. A message waits for the first unplanned run after it.

scenario:
  headline: "Bolt 1 ran 27 hours of 16, and installs arrived at hour 9"
  who: The FDE closing bolt 1 for an air-conditioner maker the size of Voltas
  situation: >-
    BOLT-1 planned 13 of its 16 hours for UoW-1 and UoW-2 and ended at hour 27.
    The construction agent's report says the overrun showed at the last event,
    and it counts UoW-9, an installs stub started on the sponsor's message, as
    a third unit.
  stakes: >-
    The retrospective ranks causes from this report and plans bolt 2 from it.
    A report that finds the overrun at the end, or counts a unit nobody
    accepted, points bolt 2 at the wrong fix.
  metrics:
    - { label: Bolt, value: 16 hours }
    - { label: Bolt clock at the end, value: "27" }
    - { label: Units in the plan, value: "2" }

diagram:
  title: Where the bolt clock reads the stream
  caption: >-
    Every run is timed on h and charged to its unit. After each event the
    clock asks whether the planned units can still finish inside 16 hours.
  direction: lr
  nodes:
    - { id: plan, label: "`plan()`", sub: "BOLT-1: two units, 16 hours", kind: doc, tone: blue, at: [0, 0] }
    - { id: events, label: "`events()`", sub: stamped by the construction agent, kind: store, tone: blue, at: [0, 1] }
    - { id: message, label: "`message(ref)`", sub: the sponsor's words, kind: tool, tone: teal, at: [0, 2] }
    - { id: clock, label: Your bolt clock, sub: every run timed on h, kind: agent, tone: purple, at: [1, 1] }
    - { id: projection, label: "Still inside 16 hours?", sub: clock plus what each unit owes, kind: guard, tone: orange, at: [2, 0] }
    - { id: report, label: Bolt report, sub: read by the retrospective, kind: output, tone: green, at: [3, 1] }
    - { id: elaboration, label: Bolt 2 elaboration, sub: where a mid-bolt request goes, kind: actor, tone: orange, at: [3, 2] }
    - { id: draft, label: "Agent's report", sub: "overrun found at the end, UoW-9 a unit", kind: output, tone: pink, at: [1, 3] }
  edges:
    - { from: plan, to: clock, label: planned hours, step: 1 }
    - { from: events, to: clock, label: runs in order, step: 2 }
    - { from: clock, to: projection, label: after every event, step: 3 }
    - { from: projection, to: report, label: first event past 16, step: 4 }
    - { from: message, to: elaboration, label: never into the bolt, step: 5 }
    - { from: elaboration, to: report, label: hours it already cost, tone: muted }
    - { from: events, to: draft, label: read at the end, tone: danger }

approach:
  goal: Read the bolt the way it ran, hour by hour on its own clock
  branches:
    - label: Time comes from h
      leaves: [a night is no bolt time, "`at` is for people"]
    - label: Every hour belongs to one run
      detail: A run opens and closes on its own ref, so two can overlap and a reworked ticket counts twice.
      leaves: [tickets and reviews alike, parking a ticket ends its run]
    - label: The plan's units are the bolt
      leaves: [other units' hours are unplanned, never projected or carried]
    - label: Project after every event
      leaves: [the clock so far, what each unapproved unit still owes, approved only when the review says so]
    - label: A message goes to elaboration
      leaves: [the running bolt does not change, report what it already cost]

coach:
  opening: >-
    Before you write the loop, take EVT-20 and work out by hand what the bolt
    clock read and what UoW-1 and UoW-2 still owed at that moment.
  signals:
    - id: wall-clock
      when: { code_matches: '\[\s*["'']at["'']\s*\]|\.get\(\s*["'']at["'']' }
      say: >-
        Your clock reads `at`, the wall clock. A night and a weekend pass
        inside this bolt, and none of them is bolt time. What does `h` give
        you that `at` does not?
    - id: reads-note
      when: { code_matches: '\[\s*["'']note["'']\s*\]|\.get\(\s*["'']note["'']' }
      say: >-
        Your code reads an event's `note`. Two notes in the stream say
        unplanned, and only one of those tickets is on a unit outside the
        plan. Which field says where an hour belongs?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        Every number in the report is in the plan and the stream. What would a
        model call add, and could the retrospective rerun it and get the same
        report?
    - id: start-by-unit
      when: { code_matches: '\[\s*(unit|\w+\[\s*["'']unit["'']\s*\])\s*\]\s*=\s*(h|\w+\[\s*["'']h["'']\s*\])\s*$' }
      say: >-
        This keeps one start time per unit. What happens to it when a second
        ticket of the same unit starts before the first is done?
    - id: no-outcome
      when: { code_lacks: '["'']outcome["'']' }
      say: >-
        Nothing in your clock reads a review's `outcome`. Does every review
        result finish a unit?
    - id: hidden-two-engineers
      when: { test_failed: two_engineers_on_one_unit_do_more_work_than_the_clock_shows }
      say: >-
        In that run two tickets of one unit were open at the same time. Whose
        start time did your clock keep, and how long did the bolt really run?
    - id: hidden-after-the-end
      when: { test_failed: a_message_after_the_bolt_ended_still_goes_to_elaboration }
      say: >-
        In that run the sponsor's message came after `BOLT_ENDED`. What did it
        do to the bolt's length, and what does your code look for after it?
    - id: hidden-sent-back
      when: { test_failed: a_unit_sent_back_early_still_owes_its_hours }
      say: >-
        In that run a review sent a unit back while it still owed hours, and
        other work arrived next. Did your projection keep counting what that
        unit owed?
    - id: adversarial-text
      when: { test_failed: adversarial_a_message_forwarded_with_invisible_characters }
      say: >-
        The sponsor's message arrived with characters you cannot see. Where in
        your report does its text go, and does anything in your code change it
        or decide from it?
    - id: stuck
      when: { idle_minutes: 6 }
      say: >-
        Start with the runs. Open one under its `ref` when it starts, close it
        into its unit when it ends, and check each unit's hours for bolt 1.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and the
        later ones get closer to the loop.
  wrap_up: >-
    A bolt is measured on its own clock. Charge every hour to the run that
    spent it, project after every event, and keep work nobody planned out of
    the bolt, so the retrospective sees the hour the plan stopped holding.

tests:
  - name: reports_bolt_1_as_it_ran
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Bolt 1 has ended. Write the report the retrospective reads." }
      llm_script:
        - { match: { contains: "event stream" }, reply: "Bolt report, drafted from the event stream: 27 hours on a 16-hour bolt, 11 over. Units in the bolt: UoW-1, UoW-2 and UoW-9. The overrun showed at BOLT_ENDED." }
        - { match: "*", reply: "Send me BOLT-1 and the event stream, and I will draft the bolt report." }
      tools:
        plan:
          returns:
            id: BOLT-1
            bolt_h: 16
            units: ["UoW-1", "UoW-2"]
            planned_h: { "UoW-1": 7.0, "UoW-2": 6.0 }
            hours: 13
            review_hours: 2
            spare: 3
            carried: ["UoW-4", "UoW-8", "UoW-5", "UoW-6"]
            elaboration: ["UoW-3"]
        events:
