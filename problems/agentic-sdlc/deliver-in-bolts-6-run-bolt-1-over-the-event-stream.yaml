reference_md: |
  The agent's report found the overrun at `BOLT_ENDED`, where any clock finds
  it. The retrospective needs to know when the plan stopped being possible,
  and the end of the stream cannot say. That takes the bolt's own clock,
  every hour charged to the run that spent it, and a projection made after
  every event.

  The clock is `h`. Between EVT-14 and EVT-15 the wall clock moves from
  Thursday evening to Friday morning and the bolt clock moves one hour, and
  between EVT-27 and EVT-28 a weekend passes in one bolt hour. Read from
  `at`, T-8 took 64 hours.

  Every hour belongs to one run, kept under its own `ref`. T-3 and T-9 each
  ran twice because RV-1 and RV-3 sent their units back, and both runs count:
  that is how UoW-1 reaches 12.5 hours against 7, and UoW-2 the same against
  6. A start time kept per unit works on bolt 1, where one ticket was open at
  a time, and breaks the day the vendor engineer picks up a ticket of the same
  unit.

  The plan's units are the bolt. T-18 ran on UoW-9, a unit nobody accepted,
  so its 2 hours are unplanned: reported, never projected, never carried.
  T-19, the credential rotation, was unplanned work on a planned unit, and it
  counts toward UoW-2. The notes on both tickets say unplanned, and the unit
  decides.

  After each event the projection is the clock plus what each unapproved unit
  still owes. At EVT-17, RV-1 has asked for changes, UoW-1 has used 9 of its 7
  hours and owes nothing more on paper, and the projection reads 15. At EVT-20
  the clock has moved two hours on T-18 while UoW-2 still owes all 6, and the
  projection reads 17: the first event at which the bolt could not end by hour
  16. The floor at zero is what lets it fire there. Without it, UoW-1's
  overspend cancels UoW-2's debt, and the projection stays under 16 until RV-2
  approves UoW-1 at EVT-24, three and a half hours later. Approval has to be
  the review's `outcome`, because a unit sent back while it still owes hours
  keeps owing them.

  The bolt's length is the clock at `BOLT_ENDED`. On bolt 1 the hours of every
  run add up to 27 as well, because one person worked at a time. With two
  engineers on one unit the hours worked outrun the clock, and a report that
  adds them up shows an overrun that never happened.

  A sponsor message changes nothing in the running bolt. MSG-1 goes to bolt
  2's elaboration with the 2 hours T-18 already cost. AWS's post (Raja SP, 31
  July 2025, read 8 October 2026) runs new intent through Mob Elaboration,
  "where the entire team actively validates AI's questions and proposals",
  and installs wait there until somebody can estimate them. The message's
  text goes into the report as the sponsor wrote it, because the report is
  the record of what she asked for, and the events decide what happened to
  it.

  aidlc-workflows keeps an audit trail of typed events, which its guide says
  are "organized into 25 categories", with `REVIEW_REQUESTED` and
  `REVIEW_COMPLETED` among them (`docs/guide/10-state-and-audit.md`,
  release 2.11.0, read 8 October 2026). The event kinds here, the bolt
  clock and the projection rule are this engagement's own construction after
  that trail.
  The next stage, Bind the approval to the exact version, decides the merges
  that came on Tuesday, and Write the retrospective for bolt 1 ranks what
  this report found.

interview_evidence:
  round: oral
  asked_as: |
    Your two-day work cycle finished eleven hours late. From the event log alone, how would you show when the overrun became visible, and what would you do with a scope request that arrived halfway through?
  source: |
    Author judgement. No employer frequency data stands behind it. Method facts from the AWS DevOps
    post "AI-Driven Development Life Cycle: Reimagining Software Engineering" by Raja SP, 31 July 2025
    (https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/), and the aidlc-workflows
    guide docs/guide/10-state-and-audit.md at release v2.11.0
    (https://github.com/awslabs/aidlc-workflows), both read 8 October 2026.

tools:
  - name: plan
    args: ""
    returns: "BOLT-1: its `units`, each unit's `planned_h` with its review, `bolt_h`, and the units `carried` to the next bolt."
  - name: events
    args: ""
    returns: "The bolt's events in order, each with `id`, `kind`, `h`, `at`, `ref`, `unit` and `note`, and `outcome` on a review's result."
  - name: message
    args: ref
    returns: "The sponsor message with that `ref`, as `status` and `text`."
example:
  case: reports_bolt_1_as_it_ran
  expect: >-
    UoW-1 and UoW-2 each used 12.5 hours against 7 and 6. At EVT-20 the clock
    read 11 with UoW-2 still owing 6, so the projection passed 16 there. MSG-1
    goes to bolt 2 elaboration with the 2 hours T-18 cost.
traps:
  - Finding the overrun at the last event, when the clock and what each unit still owed showed it hours earlier.
  - Letting a unit nobody accepted into the bolt's units, the projection or the carried list because someone started a ticket on it.
  - Timing runs by their unit, or adding the units' hours up and calling the sum the bolt's length.
  - Treating any review result as the end of a unit, when a review that asks for changes leaves the unit owing hours.
