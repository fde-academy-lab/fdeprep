slug: deliver-in-bolts-6-run-bolt-1-over-the-event-stream
title: "Run bolt 1 over the event stream"
day: 27
skill: Replay a bolt on its own clock, find when the overrun showed, keep new work out
artefact_type: code
difficulty: hard
complexity: C2
track: agentic-sdlc
concept:
  topic: "Units of work and bolts"
  question: "When was the overrun knowable, and what does a mid-bolt message do to the bolt?"
est_minutes: 45
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: state-and-memory, weight: 0.5 }
call_budget: 1
time_limit_s: 10
