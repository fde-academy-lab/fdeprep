reference_md: |
  AWS introduced the bolt in "AI-Driven Development Life Cycle: Reimagining
  Software Engineering" (Raja SP, AWS DevOps blog, 31 July 2025, read on 8
  October 2026). Sprints are replaced by bolts, "shorter, more intense work
  cycles measured in hours or days rather than weeks", and "Epics are
  replaced by Units of Work". The post gives a bolt no fixed size and sets no
  packing rules. The 16-hour cap and the rules here are this problem's own
  construction, and a real engagement agrees its own with the client.

  A bolt's cap is what lets a plan say when work finishes. The 22-hour task
  took 22 hours whatever the plan said, so a packer that trimmed it kept the
  plan tidy and made it wrong. The bolt ran long and every bolt after it
  moved, and nobody saw it coming because the plan showed 16.

  The check is one comparison, and where it sits decides whether it works. A
  task bigger than the cap fits no bolt, empty or not, so it has to be
  compared with the cap before the packer looks for a bolt. Asked only "does
  it fit the current bolt?", the packer hears no, opens a new bolt, and puts
  the task in alone, which breaks the cap in that bolt instead.

  The task goes to `too_large` because what happens to it next is a planning
  decision. The delivery lead may split the migration into two tasks that
  each fit, run it outside the bolt cycle, or agree a later date with the
  client. A packer that splits or trims the task itself makes that decision
  without telling anyone.

  Units stay whole when they fit because their tasks belong together, and a
  unit spread over two bolts is half done at the end of the first. A unit
  bigger than a bolt has to be split, and `units_split` tells the delivery
  lead which ones were, so she can check the split falls somewhere sensible.
  Bolts never take work back once the next one starts, because a bolt is a
  stretch of time and the earlier one is already over.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Your planner packs work into fixed-length cycles. What should it do with a task longer than a whole cycle, and who decides what happens to it next?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: plan
    args: ""
    returns: "`bolt_hours`, the cap on every bolt, and the `units` in plan order: each has an `id` and `tasks`, and each task an `id` and `hours`."
example:
  case: packs_units_that_fit_one_bolt
  expect: Both units fit one 16-hour bolt, 9 hours and then 5, so a single bolt of 14 hours holds `T-1`, `T-2` and `T-3`, and nothing is split or too large.
traps:
  - Trimming a task's estimate so it fits a bolt, which hides the overrun until the bolt runs late.
  - Opening a bolt for a task bigger than the cap, so that one bolt runs past it.
  - Splitting a unit that would fit an empty bolt, or adding work to a bolt after the next one has started.
