slug: pack-units-of-work-into-bolts
title: "Pack units of work into bolts"
day: 26
skill: Pack units of work into capped bolts, and report a task too big for any bolt
artefact_type: code
difficulty: easy
track: agentic-sdlc
concept:
  topic: "Units of work and bolts"
  question: "What is a bolt, and what happens to a task that does not fit one?"
est_minutes: 20
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

brief_md: |
  A services firm the size of Mindtree runs a client's build with AI-DLC, the
  AI-driven development life cycle AWS set out on its DevOps blog in July
  2025. The method renames two things a delivery team plans with. Sprints
  become bolts, "shorter, more intense work cycles measured in hours or days
  rather than weeks", and "Epics are replaced by Units of Work".

  In this problem a bolt is a work cycle with a cap in hours, and a unit of
  work is a list of tasks, each with an hour estimate, that belong together.
  The delivery lead's planner packs the client's units into 16-hour bolts, in
  the order her plan lists them.

  On Monday the planner met a 22-hour data-migration task. Its loop had one
  answer for a task that did not fit: write it down as the cap. The task
  went in as 16 hours, the bolt ran four days, and every bolt planned after
  it slipped.

  Write the packer. A task that fits no bolt goes back to the delivery lead,
  and no bolt ever holds more hours than its cap.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the delivery lead's request. `tools["plan"]()` returns the
  bolt cap and the units of work, in plan order:

      {"bolt_hours": 16,
       "units": [{"id": "UW-1", "tasks": [{"id": "T-1", "hours": 6},
                                          {"id": "T-2", "hours": 4}]},
                 {"id": "UW-2", "tasks": [{"id": "T-3", "hours": 5}]}]}

  A unit's hours are the sum of its tasks' hours, and something fits a bolt
  when its hours are no more than the hours the bolt has left. Take the units
  in plan order. Bolts run one after another: a unit goes in the current bolt
  or starts the next one, and nothing goes back into an earlier bolt.

  | The unit | Where it goes |
  |---|---|
  | Fits in the hours the current bolt has left | The current bolt, whole |
  | Fits an empty bolt, and not the hours left in this one | The next bolt, whole |
  | Is bigger than a bolt | Task by task, in order: each task in the current bolt when it fits there, otherwise in the next bolt. The unit's id goes in `units_split` |

  A task bigger than a bolt fits no bolt. Its id goes in `too_large`, it goes
  in no bolt, and packing carries on with the next task. A unit that holds
  such a task is bigger than a bolt, so it goes task by task. No bolt ever
  holds more hours than `bolt_hours`.

  Return a JSON string:

      {"bolts": [{"n": 1, "hours": 15, "tasks": ["T-1", "T-2", "T-3"]}],
       "too_large": [], "units_split": []}

  Bolts are numbered from 1, a bolt's `hours` is the sum of its tasks' hours,
  and a bolt with no tasks is left out.

  Budget: one call to `plan` and no model calls. `llm` is passed in and must
  not be called. Allowed imports: json.

stub_code: |
  import json


  def run_agent(question: str, llm, tools: dict) -> str:
      plan = tools["plan"]()
      cap = plan["bolt_hours"]
      bolts = [{"n": 1, "hours": 0, "tasks": []}]
      too_large = []
      units_split = []

      for unit in plan["units"]:
          hours = sum(task["hours"] for task in unit["tasks"])
          # TODO 1: when the unit's hours fit in what the current bolt,
          #         bolts[-1], has left, add every task of the unit to it
          # TODO 2: when the unit fits an empty bolt and not this one, start
          #         the next bolt with open_bolt and add the whole unit there
          # TODO 3: when the unit is bigger than cap, go task by task: each
          #         task into bolts[-1] when it fits, otherwise into a new
          #         bolt. Put the unit's id in units_split
          # TODO 4: in that loop, a task bigger than cap fits no bolt at all.
          #         Put its id in too_large and go on to the next task
          pass

      return json.dumps({"bolts": [bolt for bolt in bolts if bolt["tasks"]],
                         "too_large": too_large, "units_split": units_split})


  def open_bolt(bolts: list) -> None:
      """Start the next bolt. Earlier bolts take no more tasks."""
      bolts.append({"n": len(bolts) + 1, "hours": 0, "tasks": []})


  def add(bolt: dict, task: dict) -> None:
      """Put one task in a bolt."""
      bolt["hours"] += task["hours"]
      bolt["tasks"].append(task["id"])

steps:
  - id: s1
    text: Put a unit in the current bolt, whole, when it fits in the hours the bolt has left.
    check_id: s1
  - id: s2
    text: Start the next bolt for a unit that fits an empty bolt and not the current one.
    check_id: s2
  - id: s3
    text: Split a unit bigger than a bolt task by task, and name it in `units_split`.
    check_id: s3
  - id: s4
    text: Send a task bigger than a bolt to `too_large`, keep it out of every bolt, and keep packing.
    check_id: s4

step_checks:
  # The first public plan fits one bolt, so the starter code's open bolt
  # holds it once a unit that fits goes in whole.
  - step_id: s1
    spec:
      assertions:
        - type: valid_json_return
          schema:
            type: object
            properties:
              bolts: { const: [{ n: 1, hours: 14, tasks: ["T-1", "T-2", "T-3"] }] }
  # The second public plan needs a second bolt for its middle unit.
  - step_id: s2
    spec:
      assertions:
        - type: valid_json_return
          schema:
            type: object
            properties:
              bolts:
                const:
                  - { n: 1, hours: 10, tasks: ["T-1", "T-2"] }
                  - { n: 2, hours: 14, tasks: ["T-3", "T-4", "T-5", "T-6"] }
  # No public plan holds a unit bigger than a bolt, so this step runs its own,
  # with 12-hour bolts.
  - step_id: s3
    spec:
      kind: agent_run
      input: { question: "Pack the units for the supplier portal into 12-hour bolts." }
      llm_script:
        - { match: "*", reply: "Trim the biggest task to the cap and pack everything into bolt 1." }
      tools:
        plan:
          returns:
            bolt_hours: 12
            units:
              - { id: "UW-11", tasks: [{ id: "T-11", hours: 3 }] }
              - { id: "UW-12", tasks: [{ id: "T-12", hours: 6 }, { id: "T-13", hours: 5 }, { id: "T-14", hours: 4 }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            properties:
              bolts:
                const:
                  - { n: 1, hours: 9, tasks: ["T-11", "T-12"] }
                  - { n: 2, hours: 9, tasks: ["T-13", "T-14"] }
              units_split: { const: ["UW-12"] }
  # Nor does any public plan hold a task bigger than a bolt.
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "Pack the units for the warehouse scanner into 12-hour bolts." }
      llm_script:
        - { match: "*", reply: "Trim the biggest task to the cap and pack everything into bolt 1." }
      tools:
        plan:
          returns:
            bolt_hours: 12
            units:
              - { id: "UW-21", tasks: [{ id: "T-21", hours: 4 }, { id: "T-22", hours: 15 }, { id: "T-23", hours: 3 }] }
              - { id: "UW-22", tasks: [{ id: "T-24", hours: 5 }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            properties:
              bolts: { const: [{ n: 1, hours: 12, tasks: ["T-21", "T-23", "T-24"] }] }
              too_large: { const: ["T-22"] }
              units_split: { const: ["UW-21"] }

hints:
  - Follow one task through your packer by hand. Take a 22-hour task in the
    middle of a unit, with 16-hour bolts, and write down the bolt it ends up
    in and how many hours that bolt holds.
  - A task bigger than the cap fits no bolt, empty or not. Opening a new bolt
    for it moves the overrun into that bolt, and trimming its estimate hides
    it.
  - 'Where the comparison sits decides whether it works. A packer that asks
    only "does it fit the current bolt?" hears no for a 22-hour task, opens
    a new bolt, and puts the task there alone. Ask about the cap before you
    ask about a bolt.'
  - Bolts run in order. A unit goes in the current bolt or starts the next
    one, and an earlier bolt never takes more work, even with hours to spare.

scenario:
  headline: "A 22-hour task was trimmed to fit a 16-hour bolt, which ran four days"
  who: A delivery lead at a services firm the size of Mindtree
  situation: >-
    Her planner packs a client's units of work into 16-hour bolts. On Monday
    it met a 22-hour data-migration task, trimmed the estimate to 16 so it
    would fit, and packed it.
  stakes: >-
    A trimmed estimate hides an overrun until the bolt is already late. That
    bolt ran four days, and every bolt planned after it slipped.
  metrics:
    - { label: Bolt cap, value: 16 hours }
    - { label: Task estimate, value: 22 hours }
    - { label: The bolt ran, value: 4 days }

diagram:
  title: Where a task too big for any bolt should go
  caption: >-
    Units go into the current bolt or start the next. A task bigger than the
    cap goes back to the delivery lead and never into a bolt.
  direction: lr
  nodes:
    - { id: plan, label: "`plan()`", sub: units of work in plan order, kind: store, tone: blue, at: [0, 1] }
    - { id: packer, label: Bolt packer, sub: one unit at a time, kind: agent, tone: purple, at: [1, 1] }
    - { id: check, label: "Task bigger than a bolt?", sub: its hours against the cap, kind: guard, tone: teal, at: [2, 1] }
    - { id: bolts, label: Bolts, sub: 16 hours at most each, kind: output, tone: green, at: [3, 0] }
    - { id: lead, label: Delivery lead, sub: "reads `too_large`", kind: actor, tone: orange, at: [3, 2] }
    - { id: trimmed, label: Trimmed estimate, sub: 22 hours packed as 16, kind: output, tone: pink, at: [1, 2] }
  edges:
    - { from: plan, to: packer, label: the cap and the units, step: 1 }
    - { from: packer, to: bolts, label: a unit that fits, tone: success, step: 2 }
    - { from: packer, to: check, label: a unit split task by task, step: 3 }
    - { from: check, to: bolts, label: a task that fits, tone: success, step: 4 }
    - { from: check, to: lead, label: a task over the cap, step: 4 }
    - { from: packer, to: trimmed, label: trim it to fit, tone: danger }

approach:
  goal: Fill bolts in plan order without a bolt going past its cap
  branches:
    - label: Keep a unit whole when it fits
      leaves: [in the current bolt when its hours are left, in the next bolt when only an empty one holds it]
    - label: Split only a unit no bolt can hold
      detail: A unit bigger than a bolt goes task by task, and the delivery lead hears which unit was split.
      leaves: [each task in the current bolt or the next, "the unit's id in `units_split`"]
    - label: Report a task no bolt can hold
      leaves: ["its id in `too_large`", packing carries on with the next task]
    - label: Leave the model out
      leaves: [packing is arithmetic on hours]

coach:
  opening: >-
    Before you write a line, decide where a 22-hour task goes when every bolt
    holds 16.
  signals:
    - id: trims-the-estimate
      when: { code_matches: 'min\([^)]*\b(cap|bolt_hours)\b' }
      say: >-
        This cuts a task's hours down to the size of a bolt. The task still
        takes as long as it takes. Who should hear about it instead?
    - id: nothing-too-large
      when: { code_lacks: 'too_large\s*\.\s*append|too_large\s*\+=' }
      say: >-
        Nothing in your packer adds to `too_large` yet. Follow a task bigger
        than a whole bolt through your code: which bolt does it end up in?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        The plan already holds every number the packing needs. What would a
        model call add, and could the delivery lead rerun it and get the same
        bolts?
    - id: hidden-exact-fill
      when: { test_failed: a_unit_that_fills_what_is_left_goes_in_whole }
      say: >-
        In that run a unit needed exactly the hours a bolt had left. Does your
        check let a bolt reach its cap, or only come close to it?
    - id: hidden-too-large
      when: { test_failed: a_task_bigger_than_any_bolt_is_reported_not_packed }
      say: >-
        In that run one task was bigger than any bolt. Which bolt did it land
        in, and how many hours did that bolt end with?
    - id: hidden-split
      when: { test_failed: a_unit_bigger_than_a_bolt_is_split_and_named }
      say: >-
        In that run one unit was bigger than a bolt, and each of its tasks fit
        on its own. Where did its first task go, and is the unit named in
        `units_split`?
    - id: hidden-exact-cap-task
      when: { test_failed: a_task_exactly_the_size_of_a_bolt_fills_one }
      say: >-
        In that run one task was exactly as long as a bolt. Fits means no
        more than the cap. Did your packer give it a bolt of its own, or
        send it to `too_large`?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1. One bolt is already open, so the first public case
        passes once a unit that fits goes into it whole.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and on
        this tier it costs nothing to open.
  wrap_up: >-
    A bolt has a cap so that a plan can say when work finishes. Keep units
    whole when they fit, split only what no bolt can hold, and hand the
    delivery lead every task that fits no bolt at all.

