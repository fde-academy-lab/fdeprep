    visibility: public
    spec:
      kind: agent_run
      input: { question: "Pack the units for the invoice export into bolts." }
      llm_script:
        - { match: "*", reply: "Trim the biggest task to the cap and pack everything into bolt 1." }
      tools:
        plan:
          returns:
            bolt_hours: 16
            units:
              - { id: "UW-1", tasks: [{ id: "T-1", hours: 6 }, { id: "T-2", hours: 3 }] }
              - { id: "UW-2", tasks: [{ id: "T-3", hours: 5 }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: plan }
        - { type: tool_calls_at_most, value: 1 }
        - { type: llm_calls_at_most, value: 0 }
        - type: valid_json_return
          schema:
            type: object
            required: [bolts, too_large, units_split]
            properties:
              bolts: { const: [{ n: 1, hours: 14, tasks: ["T-1", "T-2", "T-3"] }] }
              too_large: { const: [] }
