                const:
                  - { id: "CR-5", path: "skip", rule: "lines" }
                  - { id: "CR-9", path: "project", rule: "contract" }

reference_md: |
  BMAD's Choose a Planning Path page (bmad-method 6.12.1, read 8 October
  2026) says size is one signal among several: "Scope is only one signal: use
  more planning when the work has high risk, unclear requirements, broad
  architectural reach, cross-system effects, or coordination between people
  or teams." A line count measures scope. The units a change touches and the
  contracts it edits measure reach, which is why the classifier asks about
  them first.

  CR-5 shows why. One line in UoW-1 moves
  `dispatch_threshold_minutes` from 45 to 30, and the partner stock API reads
  that field, so the edit changes what another team's system does. The Build
  a Change page keeps the skip for "a trivial edit you are willing to review
  yourself". Nobody on this team can review the partner team's system, and
  ADR-1 sends any change to an external contract down the project-sized
  path. CR-9 has the same shape against the booking API, at two lines.

  CR-6 moves the parts table into a shared table that UoW-4 reads, so it
  changes what two units' reviews check. That is coordination between
  people, one of BMAD's reasons for more planning, and it holds at six lines
  as much as at sixty. A classifier that counts units only for a large change
  sends the six-line version to skip.

  CR-1 and CR-7 show the other edge. CR-1 names the stock API and edits the
  agent's own retry count; CR-7 puts reschedule reasons into the customer
  message's free text. No contract lists either field, so CR-1 skips planning
  and CR-7 stays an epic. A field counts when a contract lists it by name.

  The contracts come from `contracts()` on every run, because the list
  belongs to the teams that own the APIs. A classifier with the fields
  written into it keeps sizing changes against a contract that may have
  moved.

  BMAD sets no line threshold. Its Build a Change page puts a typical session
  at "about 500 lines of code added or changed (not counting tests) in a
  small handful of files", and the ten lines here are this team's own cut for
  an edit an engineer reviews in one sitting. CR-5 comes back later in this
  build.

interview_evidence:
  round: oral
  asked_as: |
    A one-line change edits a setting another team's API reads. How much planning does it get, and how would you decide that for every change request without reading each one yourself?
  source: |
    Author judgement. No employer frequency data stands behind it. Method facts from BMAD's
    Choose a Planning Path page (https://docs.bmad-method.org/plan/choose-a-planning-path/) and
    Build a Change page (https://docs.bmad-method.org/build/build-a-change/), read 8 October 2026,
    when the current bmad-method release was 6.12.1 (npm registry, published 4 October 2026).

tools:
  - name: changes
    args: ""
    returns: "The change requests in arrival order: `id`, `change`, the `units` it touches, its `lines` and the `fields` it edits."
  - name: contracts
    args: ""
    returns: "Each external contract another team owns, with the fields its API reads."
example:
  case: picks_paths_for_five_changes
  expect: >-
    No change here edits a field a contract lists. CR-3 needs a unit nobody
    has accepted, so it is a project. CR-4 and CR-8 are ten lines or fewer
    and skip planning, and CR-2 and CR-7 are epics.
traps:
  - Sizing a change by its line count before asking whose contract it edits.
  - Counting the units a change touches only when the change is large.
  - Writing the contract fields into your code, so a change to the contracts never reaches the classifier.
