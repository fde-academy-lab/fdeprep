slug: deliver-in-bolts-3-pick-the-planning-path
title: "Pick the planning path for each change"
day: 26
skill: Send a change that reaches another unit or contract to the project path, however small
artefact_type: code
difficulty: medium
complexity: C2
track: agentic-sdlc
concept:
  topic: "Planning paths in BMAD"
  question: "How much planning does each change request need, and what decides it?"
est_minutes: 30
competencies:
  - { slug: system-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

build: { id: deliver-in-bolts, title: "Deliver the field-service agent in bolts", stage: 3, of: 9 }

brief_md: |
  Stage 3 of 9. Between 4 and 6 May nine change requests reached you for the
  field-service agent at an air-conditioner maker the size of Voltas, from a
  retry count to a new unit for installations. On Wednesday 6 May you decide
  how much planning each one gets, before anyone touches code.

  ADR-1 took its planning paths from BMAD (bmad-method 6.12.1, docs read 8
  October 2026). The Choose a Planning Path page says "You don't need BMad
  for an obvious, low-risk edit" and "One coherent outcome that needs several
  sessions is an epic", and adds: "Scope is only one signal: use more
  planning when the work has high risk, unclear requirements, broad
  architectural reach, cross-system effects, or coordination between people
  or teams." The Build a Change page says: "For a trivial edit you are
  willing to review yourself, skip the process and ask the agent to make it
  directly. But if a bug could escape into production, `bmad-build` is
  likely worth it."

  The construction agent sized the nine by their diffs. CR-5 changes
  `dispatch_threshold_minutes` from 45 to 30, one line in UoW-1, so the agent
  put it with the edits that skip planning. The partner stock API reads that
  field, and another team owns that API.

  The three paths, the ten-line threshold and the order of the checks are
  this team's own, after BMAD's pages. Write the classifier the team runs on
  every change request.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is your request. `tools["changes"]()` returns the change
  requests, in the order they arrived:

      [{"id": "CR-1", "change": "Retry the stock API call three times instead of two",
        "units": ["UoW-2"], "lines": 1, "fields": ["stock_call_retries"]}, ...]

  `units` names the accepted units the change touches, and is empty when the
  change needs a unit nobody has accepted. `lines` is the size of the diff,
  and is `null` only on a change with no unit, which nobody can size yet.
  `fields` names every field or setting the change edits.

  `tools["contracts"]()` returns the external contracts other teams own, each
  with the fields its API reads:

      {"partner_stock_api": ["partner_id", "part_no", ...], "service_booking_api": [...], ...}

  Give each change one path. Check the rows in this order and stop at the
  first that holds:

  | The change | `path` | `rule` |
  |---|---|---|
  | Edits a field that a contract lists, by exact name | `project` | `contract` |
  | Touches more than one unit | `project` | `units` |
  | Touches no accepted unit | `project` | `new_unit` |
  | Stays inside one unit, 10 lines or fewer | `skip` | `lines` |
  | Stays inside one unit, more than 10 lines | `epic` | `lines` |

  `skip` is BMAD's trivial edit: the agent makes it and an engineer reviews
  it. `epic` is BMAD's epic-sized path, a spec and its `tickets.toml`.
  `project` is the project-sized path, which ADR-1 keeps for any change that
  reaches into another team's contract, and which this team also uses for a
  change across units.

  Return a JSON string with one entry per change, in the order `changes()`
  gave them:

      {"paths": [{"id": "CR-1", "path": "skip", "rule": "lines"}, ...]}

  Budget: one call each to `changes` and `contracts`, and no model calls.
  `llm` is passed in and must not be called. Allowed imports: json.

