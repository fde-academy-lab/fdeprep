reference_md: |
  The construction agent proposes and the session decides. That split comes
  from AWS's post on AI-DLC (Raja SP, 31 July 2025, read 8 October 2026), where
  Mob Elaboration is "where the entire team actively validates AI's questions
  and proposals". The aidlc-workflows guide (release 2.11.0, read the same
  day) adds why the check matters this early: "Construction repeats its stages
  for each Unit", so every unit accepted here runs through every Construction
  stage.

  A trace is an id the agent wrote down. The first check asked whether the
  list had anything in it, which says what the agent typed and nothing about
  what the ids are. UoW-7's list had R-9, and R-9 is the one requirement the
  sponsor rejected in writing, so the check has to follow each id to where
  it points.

  That makes it an allowlist: one set of the ids a unit may rest on, the two
  intent lines and PRD v2's eight accepted requirements, with every id
  looked up in it. A check against the rejected list catches UoW-7 and
  nothing else. PRD v2 also deferred R-11, installations, to the MVP gate,
  and withdrew R-8, the 2.5-day target, which appears in none of its lists.
  A unit resting on either was not asked for, and a unit with an empty list
  rests on nothing. Each of those passes a blocklist.

  A rejected unit goes back with the first id that failed, because that is
  what the session can act on: re-trace the unit to an accepted requirement,
  take the question to the sponsor, or drop the unit. `null` says there was
  nothing to look up, which is a different conversation from a bad id.

  The seven accepted units go to the next stage, which plans bolt 1 from
  them. UoW-3 came through with no estimate; that is a planning problem, and
  a trace check has no business deciding it. The rule here, intent lines and
  accepted requirements only, is this engagement's own construction after the
  two sources above, and the ids, dates and the sponsor's sentence are the
  scenario's.

interview_evidence:
  round: oral
  asked_as: |
    An agent proposes units of work, each with a list of the requirement ids it traces to. How do you decide which units the client asked for, and what do you send back for the rest?
  source: |
    Author judgement. No employer frequency data stands behind it. Method facts from the AWS DevOps
    post "AI-Driven Development Life Cycle: Reimagining Software Engineering" by Raja SP, 31 July 2025
    (https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/), and the aidlc-workflows
    guide docs/guide/04-phases-and-stages.md at release v2.11.0
    (https://github.com/awslabs/aidlc-workflows), both read 8 October 2026.

tools:
  - name: intent
    args: ""
    returns: "The intent lines, each with its `id` and `text`."
  - name: prd
    args: version
    returns: "PRD v2's decisions when asked for version 2: the `accepted`, `rejected` and `deferred` requirement ids."
example:
  case: accepts_the_units_that_trace_to_prd_v2
  expect: >-
    Read the intent lines and PRD v2, ask the agent once, and accept seven
    units. UoW-7 traces to R-9, which PRD v2 rejected, so it comes back with
    `failed` set to R-9.
traps:
  - Accepting a unit because its `traces_to` has something in it, without looking up what each id is.
  - Checking ids against what the sponsor rejected, when a trace counts only if it points at something accepted.
  - Accepting a unit with an empty `traces_to` because nothing in it was turned down.
