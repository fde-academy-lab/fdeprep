              "2": { accepted: ["R-1", "R-2", "R-3", "R-4", "R-5", "R-6", "R-7", "R-10"], rejected: ["R-9"], deferred: ["R-11"] }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: intent }
        - { type: calls_tool_with, name: prd, args: { version: 2 } }
        - { type: llm_calls_at_most, value: 1 }
        - type: valid_json_return
          schema:
            type: object
            required: [accepted, rejected]
            properties:
              accepted: { const: ["UoW-1", "UoW-2", "UoW-3", "UoW-4", "UoW-5", "UoW-6", "UoW-8"] }
              rejected: { const: [{ id: "UoW-7", failed: "R-9" }] }

