reference_md: |
  An approval is a statement about one version of one artefact, made on
  particular evidence by a particular person. The gate checks each part of
  that statement against the tools before anything merges, and APR-1 shows
  why every part is needed.

  APR-1 names uow-1 v3, and its evidence really does cover v3: RUN-41 ran 61
  tests on it, and RV-5 is a comment on it. At 10:20 the platform engineer
  applied CR-5 and uow-1 became v4. A gate that matches the approval to uow-1
  by name merges v4 at 10:30 on v3's evidence, with a threshold change that
  no one reviewed and no test ran against. Comparing the version the approval
  names with the artefact's current version refuses it, and the reason names
  both versions so the lead knows what to read next.

  Evidence counts for what its trail entry is bound to. RUN-41 exists, and it
  tested v3, so it says nothing about v4. RUN-37 exists, and it tested uow-2.
  ADR-1 is the method record of 29 April and names no version at all, which
  is why the rule turns on an entry's kind. A gate that wants every cited
  entry to match the approval's artefact and version refuses APR-2 for citing
  ADR-1. A gate that skips every entry about another artefact, to let ADR-1
  through, lets RUN-37 through with it. Test runs and reviews are bound, a
  decision record is passed over, and an approval still needs a test run of
  the version it approves.

  Authority comes from `roles`. The approval names a person, and a name
  carries no permission. Only a `reviewer` may approve a merge, and the
  platform engineer, who wrote v4, holds `engineer`.

  The gate acts on its own decision. It calls `merge` only after all three
  checks hold, and it writes the `APPROVAL_DECIDED` event either way, with a
  reason built from ids, versions and roles. A trail note is text whoever
  wrote the entry chose, and an event that quotes it hands that text to the
  next reader of the trail, a person or another agent.

  On the day, APR-1 was refused at 10:30. RUN-42 ran on v4 at 14:10, RV-6
  read the new threshold against the partner API's document at 14:20, and
  APR-2 merged uow-1 v4 at 14:35. APR-6 merged uow-2 v2 at 14:45 on RUN-37,
  RV-4 and ADR-1, so the run that refuses an approval of uow-1 is the right
  evidence for uow-2. RV-6 checked the field against the partner's contract
  and did not ask what 30 minutes does to the parts check. The gate trusts a
  review once it is bound to the right version, so that gap belongs to the
  review, and the next stage, Deploy, watch the guard, roll back, is where it
  shows.

  aidlc-workflows lists "Human approval gates and source-bound review
  evidence" among its features (README, release 2.11.0, read 8 October
  2026), and its audit guide binds a reviewed unit's evidence with a
  `source-manifest.json` and a `Unit Source Fingerprint`
  (`docs/guide/10-state-and-audit.md`, the same release and day). This
  engagement binds by artefact and version, so the three checks, their order
  and the event's fields are its own construction after that guide. A
  fingerprint would also catch content that changed under the same version
  number, which a version label cannot, and that gap is where the defence
  question goes.

interview_evidence:
  round: both
  asked_as: |
    An engineer changed one line after the reviewer approved the previous version, and the approval still has passing tests attached. What does your merge gate check before it merges, and why is the approval on its own not enough?
  source: |
    Author judgement. No employer frequency data stands behind it. AI-DLC facts from the
    aidlc-workflows README and docs/guide/10-state-and-audit.md at release v2.11.0
    (https://github.com/awslabs/aidlc-workflows), read 8 October 2026.

tools:
  - name: approvals
    args: id
    returns: "The approval with that id: its `artefact`, `version` and `approver`, the `evidence` ids it cites, and when it was given."
  - name: artefacts
    args: artefact
    returns: "The artefact's `current` version."
  - name: trail
    args: ""
    returns: "The audit trail's entries, each with `id`, `kind`, the `artefact` and `version` it is bound to, `at` and `note`."
  - name: roles
    args: ""
    returns: "Each person's role: `reviewer`, `engineer` or `sponsor`."
  - name: merge
    args: "artefact, version"
    returns: "Whether the merge went through, as `merged`."
example:
  case: merges_uow_1_v4_on_its_own_evidence
  expect: >-
    APR-2 names v4, uow-1's current version. RUN-42 and RV-6 are bound to uow-1
    v4, ADR-1 is the method record, and the platform team lead is a reviewer,
    so the gate merges uow-1 v4.
traps:
  - Matching an approval to its artefact by name, so an approval of an earlier version merges whatever the artefact has become since.
  - Counting a cited id because it exists in the trail, when the entry tested another unit or another version.
  - Skipping every entry about another artefact to let the method record through, which lets another unit's test run through too.
  - Taking an approver's authority from the approval itself, or copying a trail entry's note into the reason.
