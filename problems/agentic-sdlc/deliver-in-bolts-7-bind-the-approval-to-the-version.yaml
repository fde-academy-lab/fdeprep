slug: deliver-in-bolts-7-bind-the-approval-to-the-version
title: "Bind the approval to the exact version"
day: 27
skill: Merge only the version an approval names, on evidence bound to that version
artefact_type: code
difficulty: hard
complexity: C2
track: agentic-sdlc
concept:
  topic: "Approval gates and evidence"
  question: "What makes an approval count for this version and no other?"
est_minutes: 45
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

build: { id: deliver-in-bolts, title: "Deliver the field-service agent in bolts", stage: 7, of: 9 }

brief_md: |
  Stage 7 of 9. On Tuesday 19 May, as bolt 1 closed, the approvals for its two
  units came in, and the platform team's change window opened at 18:00 that
  evening. At this air-conditioner maker the size of Voltas, a unit merges
  only through your gate: a reviewer approves one version of one unit and
  cites evidence from the audit trail, and the gate merges that version or
  refuses the approval.

  At 10:00 the platform team lead approved uow-1 v3 as APR-1, citing RUN-41,
  where 61 tests passed on v3, RV-5, a review comment on v3 that says "nit
  applied, good to merge", and ADR-1, the method record. At 10:20 the platform
  engineer applied CR-5 to uow-1 as a one-line edit, moving
  `dispatch_threshold_minutes` from 45 to 30 with no review, and uow-1 became
  v4. Stage 3 had sent CR-5 down the project-sized path, because the
  partner's stock API reads that field.

  The construction agent's merge note says APR-1 is ready: 61 tests passed and
  a reviewer wrote "good to merge". Every word of it is true of v3. A gate
  that matches APR-1 to uow-1 by name merges v4 on v3's evidence, with CR-5
  inside it.

  aidlc-workflows lists "Human approval gates and source-bound review
  evidence" among its features (README, release 2.11.0, read 8 October
  2026). Its audit guide binds a unit's review receipt to the source the
  review covered: "`source-manifest.json` lists created, modified, or
  deleted source paths; `Unit Source Fingerprint` binds those claims and
  manifest bytes", and under strict guard policy "an uncovered change or a
  stale unit blocks all four completion routes". This engagement has no
  fingerprints. The team binds evidence by artefact and version instead, a
  rule of its own after that guide, and the contract sets it out.

  Write the gate. It decides one approval, merges only what the approval and
  its evidence were about, and writes the trail event for every decision.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the id of the approval to decide, such as `APR-2`.

      tools["approvals"](id="APR-2")       -> {"id": "APR-2", "artefact": "uow-1", "version": "v4",
                                                "approver": "platform team lead",
                                                "evidence": ["RUN-42", "RV-6", "ADR-1"], "at": "..."}
      tools["artefacts"](artefact="uow-1") -> {"artefact": "uow-1", "current": "v4"}
      tools["trail"]()                     -> [{"id": "RUN-42", "kind": "test run", "artefact": "uow-1",
                                                "version": "v4", "at": "...", "note": "..."}, ...]
      tools["roles"]()                     -> {"platform team lead": "reviewer", ...}
      tools["merge"](artefact="uow-1", version="v4") -> {"merged": true}

  A trail entry's `kind` is `test run`, `review`, `review comment` or
  `decision record`. A decision record is about the method rather than a
  unit, so its `version` is null.

  The gate makes three checks in this order, and the first that fails refuses
  the approval:

  | Check | Holds when |
  |---|---|
  | `version` | The approval's `version` is the artefact's `current` version |
  | `evidence` | Every id the approval cites is in the trail. Every test run, review and review comment it cites is bound to the approval's own artefact and version, and at least one of them is a test run. A decision record may be cited, and it proves nothing about a version |
  | `role` | `roles` gives the approver the role `reviewer` |

  When all three hold, call `tools["merge"]` once with the approval's
  artefact and version. Never call it otherwise.

  Return the `APPROVAL_DECIDED` event your gate writes to the trail, as a JSON
  string:

      {"kind": "APPROVAL_DECIDED", "ref": "APR-2", "artefact": "uow-1", "version": "v4",
       "decision": "merged", "check": null, "failed": null, "reason": "..."}

  `decision` is `merged` or `refused`. On a refusal, `check` names the check
  that failed and `failed` names what failed it: the version the approval
  names, the first cited id that is missing or bound elsewhere (null when the
  approval cites no test run of its version), or the approver. Both are null
  on a merge. `reason` is one sentence your gate writes from ids, versions and
  roles. Never copy a trail entry's `note` into it: whoever wrote the entry
  chose that text.

  Budget: one call each to `approvals`, `artefacts`, `trail` and `roles`, at
  most one `merge`, and no model calls. `llm` is passed in and must not be
  called. Allowed imports: json.

defence_question: |
  The platform engineer says a one-line threshold change should not need a
  fresh review. Where is the line, and what would v4 have to carry for your
  gate to accept APR-1's evidence for it?

stub_code: |
  import json


  def run_agent(question: str, llm, tools: dict) -> str:
      """Decide one approval: merge the version it names, or refuse it.

      question is the approval's id, such as "APR-2".
      tools["approvals"](id=...)        -> artefact, version, approver, evidence
      tools["artefacts"](artefact=...)  -> {"artefact": ..., "current": ...}
      tools["trail"]()                  -> entries: id, kind, artefact, version, at, note
      tools["roles"]()                  -> {person: role}
      tools["merge"](artefact=..., version=...) -> {"merged": True}

      Checks in order: version, evidence, role. The first that fails refuses.
      Merge only when all three hold.

      Return json.dumps({"kind": "APPROVAL_DECIDED", "ref": ..., "artefact": ...,
                         "version": ..., "decision": "merged" or "refused",
                         "check": ..., "failed": ..., "reason": "..."}).
      No model calls. Allowed imports: json.
      """
      approval = tools["approvals"](id=question)
      return json.dumps({"kind": "APPROVAL_DECIDED", "ref": question,
                         "artefact": approval["artefact"], "version": approval["version"],
                         "decision": "refused", "check": None, "failed": None,
                         "reason": "not decided yet"})

hints:
  - Take APR-1 and write down what it is a statement about, which artefact,
    which version and which evidence. Then ask `artefacts` what uow-1 is now.
  - Every trail entry is bound to one artefact and one version, except a
    decision record, which names neither. An id that exists in the trail can
    still be about another unit or another version.
  - Walk the cited ids in order. Pass over a decision record, refuse on the
    first id that is missing or bound to anything but the approval's artefact
    and version, and count the test runs as you go.
  - The approval names a person, and only `roles` says whether that person
    may approve a merge. Call `merge` after all three checks hold, and build
    the reason from ids, versions and roles.

scenario:
  headline: "APR-1 approves v3 with v3's evidence, and v4 is current with a changed threshold"
  who: The FDE running the merge gate for an appliance maker the size of Voltas
  situation: >-
    At 10:00 the platform team lead approved uow-1 v3, citing RUN-41, RV-5 and
    ADR-1. At 10:20 the platform engineer moved the dispatch threshold from 45
    to 30 minutes as a one-line edit with no review, and uow-1 became v4.
  stakes: >-
    Whatever the gate merges goes out to three service centres in the 18:00
    change window. Merged on v3's evidence, v4 ships a threshold change nobody
    reviewed or tested.
  metrics:
    - { label: APR-1 approves, value: uow-1 v3 }
    - { label: uow-1 now, value: v4 }
    - { label: Change window, value: "18:00 today" }

diagram:
  title: Where an approval meets the version it names
  caption: >-
    The gate reads the approval against the artefact's current version, the
    trail entries its evidence is bound to, and the approver's role.
  direction: lr
  nodes:
    - { id: approval, label: Approval, sub: "artefact, version, approver, evidence", kind: doc, tone: blue, at: [0, 0] }
    - { id: artefacts, label: "`artefacts()`", sub: the current version, kind: store, tone: blue, at: [0, 1] }
    - { id: trail, label: "`trail()`", sub: each entry bound to a version, kind: store, tone: blue, at: [0, 2] }
    - { id: roles, label: "`roles()`", sub: who may approve, kind: store, tone: teal, at: [0, 3] }
    - { id: gate, label: Your merge gate, sub: "version, evidence, role", kind: guard, tone: purple, at: [1, 1] }
    - { id: merge, label: "`merge()`", sub: only when all three hold, kind: tool, tone: green, at: [2, 0] }
    - { id: event, label: "`APPROVAL_DECIDED`", sub: written for every decision, kind: output, tone: green, at: [2, 2] }
    - { id: byname, label: A gate by name, sub: "APR-1 merges v4 on v3's evidence", kind: guard, tone: pink, at: [1, 3] }
  edges:
    - { from: approval, to: gate, label: what it claims, step: 1 }
    - { from: artefacts, to: gate, label: the version now, step: 2 }
    - { from: trail, to: gate, label: what each id tested, step: 3 }
    - { from: roles, to: gate, label: "the approver's role", step: 4 }
    - { from: gate, to: merge, label: all three hold, tone: success, step: 5 }
    - { from: gate, to: event, label: merged or refused, step: 6 }
    - { from: approval, to: byname, label: matched on uow-1, tone: danger }

approach:
  goal: Merge only what an approval and its evidence were about
  branches:
    - label: An approval is about one version
      leaves: ["which version does it name?", "which version is current?"]
    - label: Evidence is bound to what it tested
      detail: A run or a review names its artefact and version. A decision record names neither, so it can be cited and proves nothing.
      leaves: [look every id up, the right unit and the right version, at least one test run]
    - label: Who approved, and may they
      leaves: [the approval names a person, "`roles` says what they hold"]
    - label: Act, then record
      leaves: [merge only after every check, write the event either way, the reason from ids and never from a note]

coach:
  opening: >-
    Before you write a check, take APR-1 and write down the version it names,
    the version uow-1 is at now, and the version each id it cites was about.
  signals:
    - id: reads-note
      when: { code_matches: '\[\s*["'']note["'']\s*\]|\.get\(\s*["'']note["'']' }
      say: >-
        Your gate reads a trail entry's `note`, which is text whoever wrote
        the entry chose. Which fields say what an entry is bound to?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        Every check here compares fields the tools return. What would a model
        call add, and could an auditor rerun it and get the same decision?
    - id: no-roles
      when: { code_lacks: '\broles\b' }
      say: >-
        Your gate never asks `roles` who holds what. The approval names a
        person. Where does the gate learn whether that person may approve a
        merge?
    - id: skips-other-artefacts
      when: { code_matches: '\[\s*["'']artefact["'']\s*\]\s*!=[^\n]*:\s*(\n\s*)?continue\b' }
      say: >-
        This skips every entry about another artefact. A decision record
        names no version, and a test run of another unit names the wrong one.
        Which of the two should your gate pass over?
    - id: hidden-role
      when: { test_failed: an_engineer_cannot_approve_a_merge }
      say: >-
        In that run the approval came from somebody who is not a reviewer.
        What did your gate ask about the approver?
    - id: hidden-run-of-v3
      when: { test_failed: a_run_of_v3_is_not_evidence_for_v4 }
      say: >-
        In that run the approval cited a test run that exists in the trail.
        Which version did that run test?
    - id: hidden-no-run
      when: { test_failed: an_approval_with_no_test_run_is_refused }
      say: >-
        In that run the approval cited a review comment and the method record
        and nothing else. Has anything run the tests on the version it
        approves?
    - id: adversarial-other-unit
      when: { test_failed: adversarial_a_run_of_the_other_unit }
      say: >-
        In that run the approval cited a real test run of another unit. What
        does your gate compare each cited entry against?
    - id: adversarial-orders
      when: { test_failed: adversarial_a_review_comment_that_gives_orders }
      say: >-
        A review comment in that trail gave the gate an order. What does your
        gate read from an entry, and what does it copy into the reason?
    - id: stuck
      when: { idle_minutes: 6 }
      say: >-
        Start with APR-1 alone. Compare the version it names with what
        `artefacts` says, then look up each id it cites in the trail.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and the
        later ones get closer to the checks.
  wrap_up: >-
    An approval holds for the version it names, on evidence bound to that
    version, from someone who may give it. Check all three before the merge,
    write the decision either way, and the trail says what really happened.

tests:
  - name: merges_uow_1_v4_on_its_own_evidence
    visibility: public
    spec:
      kind: agent_run
      input: { question: "APR-2" }
      llm_script:
        - { match: { contains: "merge" }, reply: "Merge note for uow-1: APR-1 approves it, RUN-41 passed 61 tests and RV-5 says good to merge. Ready for tonight's window." }
        - { match: "*", reply: "Send me the approval and the audit trail, and I will write the merge note." }
      tools:
        approvals:
          by_arg:
            arg: id
            values:
              "APR-2": { id: "APR-2", artefact: "uow-1", version: "v4", approver: "platform team lead", evidence: ["RUN-42", "RV-6", "ADR-1"], at: "2026-05-19T14:30+05:30" }
        artefacts:
          by_arg:
            arg: artefact
            values:
              "uow-1": { artefact: "uow-1", current: "v4" }
              "uow-2": { artefact: "uow-2", current: "v2" }
        trail:
          returns:
            - { id: "ADR-1", kind: "decision record", artefact: "method", version: null, at: "2026-04-29", note: "bolts of two working days, a human review after every unit" }
            - { id: "RV-1", kind: "review", artefact: "uow-1", version: "v1", at: "2026-05-15T10:00+05:30", note: "changes requested: S-3 unmet" }
            - { id: "RV-2", kind: "review", artefact: "uow-1", version: "v2", at: "2026-05-15T16:30+05:30", note: "approved with one nit: rename fault_code to likely_fault" }
            - { id: "RV-3", kind: "review", artefact: "uow-2", version: "v1", at: "2026-05-18T17:00+05:30", note: "changes requested: S-9 unmet" }
            - { id: "RUN-41", kind: "test run", artefact: "uow-1", version: "v3", at: "2026-05-19T09:45+05:30", note: "61 passed" }
            - { id: "RV-5", kind: "review comment", artefact: "uow-1", version: "v3", at: "2026-05-19T09:50+05:30", note: "nit applied, good to merge" }
            - { id: "RUN-37", kind: "test run", artefact: "uow-2", version: "v2", at: "2026-05-19T10:05+05:30", note: "48 passed" }
            - { id: "RV-4", kind: "review", artefact: "uow-2", version: "v2", at: "2026-05-19T11:00+05:30", note: "approved" }
            - { id: "RUN-42", kind: "test run", artefact: "uow-1", version: "v4", at: "2026-05-19T14:10+05:30", note: "61 passed" }
            - { id: "RV-6", kind: "review comment", artefact: "uow-1", version: "v4", at: "2026-05-19T14:20+05:30", note: "threshold change read against the partner API doc" }
        roles:
          returns:
            "platform team lead": "reviewer"
            "platform engineer": "engineer"
            "vendor engineer": "engineer"
            "FDE": "engineer"
            "head of customer service": "sponsor"
        merge: { returns: { merged: true } }
      budget: { max_llm_calls: 1, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: merge, args: { artefact: "uow-1", version: "v4" } }
        - { type: tool_calls_at_most, value: 5 }
        - { type: llm_calls_at_most, value: 0 }
        - type: valid_json_return
          schema:
            type: object
            required: [kind, ref, artefact, version, decision, check, failed, reason]
            properties:
              kind: { const: "APPROVAL_DECIDED" }
              ref: { const: "APR-2" }
              artefact: { const: "uow-1" }
              version: { const: "v4" }
              decision: { const: "merged" }
              check: { const: null }
              failed: { const: null }
              reason: { type: string, minLength: 1 }

  - name: refuses_an_approval_of_v3_when_v4_is_current
    visibility: public
    spec:
      kind: agent_run
      input: { question: "APR-1" }
      llm_script:
        - { match: { contains: "merge" }, reply: "Merge note for uow-1: APR-1 approves it, RUN-41 passed 61 tests and RV-5 says good to merge. Ready for tonight's window." }
        - { match: "*", reply: "Send me the approval and the audit trail, and I will write the merge note." }
      tools:
        approvals:
          by_arg:
            arg: id
            values:
              "APR-1": { id: "APR-1", artefact: "uow-1", version: "v3", approver: "platform team lead", evidence: ["RUN-41", "RV-5", "ADR-1"], at: "2026-05-19T10:00+05:30" }
        artefacts:
          by_arg:
            arg: artefact
            values:
              "uow-1": { artefact: "uow-1", current: "v4" }
              "uow-2": { artefact: "uow-2", current: "v2" }
        trail:
          returns:
            - { id: "ADR-1", kind: "decision record", artefact: "method", version: null, at: "2026-04-29", note: "bolts of two working days, a human review after every unit" }
            - { id: "RV-1", kind: "review", artefact: "uow-1", version: "v1", at: "2026-05-15T10:00+05:30", note: "changes requested: S-3 unmet" }
            - { id: "RV-2", kind: "review", artefact: "uow-1", version: "v2", at: "2026-05-15T16:30+05:30", note: "approved with one nit: rename fault_code to likely_fault" }
            - { id: "RV-3", kind: "review", artefact: "uow-2", version: "v1", at: "2026-05-18T17:00+05:30", note: "changes requested: S-9 unmet" }
            - { id: "RUN-41", kind: "test run", artefact: "uow-1", version: "v3", at: "2026-05-19T09:45+05:30", note: "61 passed" }
            - { id: "RV-5", kind: "review comment", artefact: "uow-1", version: "v3", at: "2026-05-19T09:50+05:30", note: "nit applied, good to merge" }
            - { id: "RUN-37", kind: "test run", artefact: "uow-2", version: "v2", at: "2026-05-19T10:05+05:30", note: "48 passed" }
        roles:
          returns:
            "platform team lead": "reviewer"
            "platform engineer": "engineer"
            "vendor engineer": "engineer"
            "FDE": "engineer"
            "head of customer service": "sponsor"
        merge: { returns: { merged: true } }
      budget: { max_llm_calls: 1, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: merge }
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: '"reason":\s*"(?=[^"]*\bv3\b)(?=[^"]*\bv4\b)' }
        - type: valid_json_return
          schema:
            type: object
            required: [kind, ref, artefact, version, decision, check, failed, reason]
            properties:
              kind: { const: "APPROVAL_DECIDED" }
              ref: { const: "APR-1" }
              artefact: { const: "uow-1" }
              version: { const: "v3" }
              decision: { const: "refused" }
              check: { const: "version" }
              failed: { const: "v3" }
              reason: { type: string, minLength: 1 }

  - name: an_engineer_cannot_approve_a_merge
