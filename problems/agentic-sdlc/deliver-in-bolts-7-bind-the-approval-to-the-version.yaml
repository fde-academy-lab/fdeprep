    spec:
      kind: agent_run
      input: { question: "APR-4" }
      llm_script:
        - { match: { contains: "merge" }, reply: "Merge note for uow-1: APR-1 approves it, RUN-41 passed 61 tests and RV-5 says good to merge. Ready for tonight's window." }
        - { match: "*", reply: "Send me the approval and the audit trail, and I will write the merge note." }
      tools:
