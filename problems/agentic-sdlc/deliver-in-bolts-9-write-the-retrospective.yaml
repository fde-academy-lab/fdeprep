    - { from: retro, to: sponsor, label: true and first, step: 6, tone: success }

approach:
  goal: A retrospective the sponsor can read first and bolt 2 can act on
  branches:
    - label: Account for every hour
      leaves: [planned against actual, the bolt's 16 hours and the plan's 13, each hour to one cause]
    - label: Rank by hours, with a source
      detail: A finding the trail cannot point at does not make the report.
      leaves: [an event for each cause, the loudest cause is not the largest]
    - label: Answer each cause in bolt 2
      leaves: [one change per cause, the same 16-hour bolt, "the draft, at bolt 1's ratio"]
    - label: Keep the release facts straight
      leaves: [what the gate refused, what reached r2 anyway, why r2 was rolled back]
    - label: Write the sponsor's section
      leaves: [true and first, "every cause, the rollback included"]

coach:
  opening: >-
    Before you write a word for the sponsor, account for the 14 hours bolt 1
    spent over its plan, one cause at a time, each with the event it rests
    on.
  signals:
    - id: rework-hours
      when: { code_lacks: '(?i)\b6(\.0)?\s*(h\b|hours?)|six hours' }
      say: >-
        Your causes put no hours on the review rework. Add the rebuilds and
        the review time over plan. Where does that cause rank against the
        installs message?
    - id: no-rollback
      when: { code_lacks: '(?i)roll(ed|ing)?[ -]?back' }
      say: >-
        Your retrospective never says r2 was rolled back. The sponsor will
        hear it from someone. What should your first section say about it?
    - id: blames-gate
      when: { code_matches: '(?i)gate (failed|missed|should have|let)|gate did ?n.t (catch|stop)' }
      say: >-
        The approval gate refused APR-1. What reached r2 anyway, and which
        path had stage 3 given it?
    - id: longer-bolt
      when: { code_matches: '(?i)\b(longer|bigger|three-day|3-day|24-hour) bolts?\b|\bextend(ing)? (the |each )?bolts?\b|\bbolts? of (three|3) days' }
      say: >-
        Your change makes the bolt longer. Bolt 1 overran a 16-hour bolt.
        What would a longer one have shown you at noon on Friday, when the
        overrun was already knowable?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with the report: subtract the plan from the actual, then give
        every hour of the difference to one cause.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        The hints are open. The first one starts from the 14 hours, which is
        where a ranking has to come from.
  wrap_up: >-
    A retrospective ranks causes by the hours they cost and changes the next
    bolt so each cause has an answer. The sponsor's section goes first and
    stays true when she repeats it.

reference_md: |
  A retrospective is the record the next bolt plans from, and BMAD's page
  Finish an Epic sets its rule: "Every finding carries a source reference: a
  file, a line, a commit, a log. A claim it can't point at doesn't make the
  report." (bmad-method 6.12.1, read 8 October 2026.) Each cause below cites
  the event that shows it, and the verdict uses the page's words.

  Start with the arithmetic. Bolt 1 planned 13.0 hours and took 27.0, which
  is 11.0 over the 16-hour bolt and 14.0 over the plan, because the plan left
  3 hours spare. Every one of the 14 belongs to a cause. Review rework is
  6.0: the rebuilds of T-3 and T-9, 2.5 and 2.0, and 1.5 of review time over
  the 2 hours planned. Builds over estimate are 5.0, 2.5 on each unit. The
  installs message is 2.0 and the credential rotation 1.0.

  Ranked by hours, the installs message is third. It is the cause the
  sponsor will ask about, and the only one a person sent, which is why a
  weak retrospective puts it first. Rework comes first, and both
  checks that failed, S-3 and S-9, were in the spec a week before the first
  ticket. The review did its job twice, and the change that answers it is
  cheap: the mob reads the check aloud before the ticket starts.

  The estimate ratio, 16 hours of build against 11 estimated, about 1.5 to
  1, has to reach bolt 2's draft before anyone promises its date. At that
  ratio the draft's 12 hours of estimates become 18, plus 3 review hours, in
  a 16-hour bolt. The trade is to keep the bolt at 16 hours at the cost of a
  unit: UoW-3 and UoW-4 fit with 2 hours spare, and UoW-8 moves on. A
  longer bolt hides the next overrun until later, and a draft kept at 15
  hours has the overrun built in.

  The approval and the rollback are facts with causes. The gate refused
  APR-1 because it approved v3 while v4 was current, which cost calendar and
  no bolt hours. v4 held CR-5, a one-line edit to a field the partner API
  reads, which stage 3 had put on the project-sized path. The edit took the
  path a one-line change looks as if it deserves, and RV-6 read the new
  threshold against the API document and never against what it does to the
  parts check. That gap is why r2 was rolled back, and it is closed by the
  contract rule in bolt 2's changes.

  The sponsor reads the first section and may read nothing else, so it
  goes first and has to stay true when she repeats it: the hours, each cause
  with its share, the rollback with its cause in plain words, and what bolt 2
  delivers by when. The verdict is accepted-with-open-items: both units met
  their done-when checks, and the guard and the installs elaboration stay
  open.

  The voice question Defend the bolt 2 plan to a sponsor who wants dates is
  the conversation that follows. The cause categories, the ratio rule and the
  bolt 2 plan are this stage's own construction after BMAD's page.

interview_evidence:
  round: both
  asked_as: |
    Your first two-day iteration took more than twice its planned hours, and the release was rolled back. Walk me through the retrospective you would write and what changes in the next iteration.
  source: |
    Author judgement. No employer frequency data stands behind it. BMAD facts from
    docs.bmad-method.org, the page Finish an Epic, bmad-method 6.12.1, read 8 October 2026.

traps:
  - Ranking the cause the sponsor will ask about above the causes that cost the most hours.
  - A sponsor section that reports the overrun and leaves out the rollback, or gives the rollback no cause.
  - Answering an overrun with a longer bolt, or keeping a bolt 2 plan that bolt 1's own estimates say will not fit.
  - Blaming the approval gate for a change it refused to approve.
