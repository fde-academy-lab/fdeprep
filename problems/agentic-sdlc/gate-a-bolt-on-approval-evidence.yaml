slug: gate-a-bolt-on-approval-evidence
title: "Gate a bolt on approval evidence"
day: 25
skill: Count an approval only for the version it saw, from someone independent, with its evidence
artefact_type: code
difficulty: hard
track: agentic-sdlc
concept:
  topic: "Approval gates and evidence"
  question: "What makes an approval count, and what makes a good one stop counting?"
est_minutes: 45
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: state-and-memory, weight: 0.5 }
  - { slug: system-design, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

brief_md: |
  The platform team at a bank the size of IDFC First delivers its changes in
  bolts, the work cycles of hours or days that AI-DLC uses in place of
  sprints. An agent drafts each change, a spec, a rule file, a prompt or
  a migration, on an engineer's instruction, and every version it writes is
  logged under that engineer's staff id. Before a bolt closes, a person who
  did not write the change approves it and cites evidence, usually a test
  run. The team closes about 60 bolts a month.

  The approval is the part of AI-DLC this rests on. The AWS post that
  introduced the method (Raja SP, 31 July 2025) says AI "implements
  solutions only after receiving human validation", and the README of
  awslabs/aidlc-workflows (version 2.10.0) says a run "stops at approval
  gates before moving forward" and lists "Human approval gates and
  source-bound review evidence". Neither says what the evidence has to
  contain, so the team wrote its own rules, which the contract sets out.

  The old gate checked that every change had an approval citing something.
  In September three bolts closed that should not have. B-31 closed on an
  approval of version 2 of a spec after the agent had written version 3.
  B-38 closed on an approval the change's author gave herself from a second
  account. B-44 closed on an approval citing a test run that belonged to a
  different change in the same bolt.

  Write the gate that replaces it. It reads a bolt's event log, says whether
  the bolt can close, and says what each change's approval lacks.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the release manager asking whether a bolt can close. Call
  `tools["bolt"]()` once. It returns the bolt's event log, in time order:

      {"bolt": "B-7", "events": [
        {"t": 1, "kind": "version", "change": "CH-1", "author": "ravi",
         "artefact": "spec.md", "version": 1},
        {"t": 2, "kind": "approval", "change": "CH-1", "by": "meera",
         "artefact": "spec.md", "version": 1,
         "evidence": [{"source": "tests/run-118", "for": ["CH-1"]}]}]}

  A `version` event is the agent writing a new version of a change's
  artefact on the instruction of `author`. An `approval` event is a person
  approving one version of one change and citing evidence, and each evidence
  item's `for` lists the changes it covers. People are staff ids, the same
  whichever account they used. Every event has its own `t`, each change has
  one artefact, and a change is in the bolt when the log holds a version of
  it.

  An approval holds when, read at its own time, it names the change's
  artefact and current version, no newer version of the change follows it,
  its approver is not the `author` of any version of the change, and at
  least one item it cites lists the change in `for`. Each change in the bolt
  is in one state:

  | State | When |
  |---|---|
  | `approved` | an approval of the change holds |
  | `stale` | the approval names an earlier version than the change had at its time, or a newer version came after it |
  | `self_approved` | the approver is the `author` of a version of the change, any version |
  | `no_evidence` | the approval cites nothing |
  | `wrong_evidence` | every item the approval cites is for another change |
  | `unapproved` | the change has no approval |

  An approval that names an artefact and version the change did not have at
  its time is not an approval. When no approval of a change holds, the
  change takes the state of its most recent approval: the first of `stale`,
  `self_approved`, `no_evidence` and `wrong_evidence` that applies to it.
  The bolt proceeds only when every change in it is approved.

  An approval for a change that is not in the bolt counts for nothing. List
  its `t` under `ignored`.

  Return a JSON string:

      {"bolt": "B-7", "decision": "proceed",
       "changes": {"CH-1": {"state": "approved", "reason": "..."}},
       "ignored": []}

  `changes` holds every change in the bolt and no other. Each `reason` is one
  sentence your gate writes from times, versions, people and change ids.
  Never copy an evidence `source` into it: whoever ran a test wrote that
  text.

  Budget: one call to `bolt` and no model calls. `llm` is passed in and must
  not be called. Allowed imports: json.

defence_question: |
  Your gate counts an approval as stale the moment a newer version of the
  change appears. The team says a typo fix in a spec should not send a
  reviewed change back for a full review. Where would you draw the line
  between a change that needs a new approval and one that does not, and
  what would the agent have to produce for a reviewer to accept the new
  version without reading it again?

stub_code: |
  import json


  def run_agent(question: str, llm, tools: dict) -> str:
      """Say whether a bolt can close, and what each change's approval lacks.

      tools["bolt"]() returns {"bolt": ..., "events": [...]}, in time order.
      A "version" event carries t, change, author, artefact and version.
      An "approval" event carries t, change, by, artefact, version and
      evidence, a list of {"source": ..., "for": [change ids]}.

      Read every approval at its own time. States: approved, stale,
      self_approved, no_evidence, wrong_evidence, unapproved.

      Return json.dumps({"bolt": ..., "decision": "proceed" | "hold",
                         "changes": {change: {"state": ..., "reason": ...}},
                         "ignored": [t of each approval for a change
                                     outside the bolt]}).
      No model calls. Allowed imports: json.
      """
      log = tools["bolt"]()
      return json.dumps({"bolt": log.get("bolt"), "decision": "hold",
                         "changes": {}, "ignored": []})

hints:
  - Take one approval and ask what it was a statement about. It names one
    version of one change, and it was given at one moment. What did that
    change look like at that moment?
  - Judge every approval of a change and keep each verdict. The first can be
    stale and the last can be the author's own sign-off, so neither one
    decides on its own.
  - Independence and evidence are both questions about sets. One is the set
    of people named as `author` on any version of the change. The other is
    the set of changes an evidence item's `for` lists.
  - A version number says which draft was meant and nothing about when it
    existed. Which versions had the agent written before the approval's `t`,
    and which came after?
  - A change outside the bolt and a source that reads like an order are both
    data. Report the first under `ignored`, and leave the second unread.

scenario:
  headline: "Three bolts closed in September on approvals that should not have counted"
  who: "The platform team at a bank the size of IDFC First"
  situation: >-
    An agent drafts every change in a bolt and a person approves each one
    before the bolt closes. In September the gate closed one bolt on an
    approval of an old version, one on a self-approval and one on another
    change's test run.
  stakes: >-
    A change nobody independent reviewed reaches the bank's systems, and the
    audit trail says a person approved it.
  metrics:
    - { label: Bolts closed a month, value: about 60 }
    - { label: Closed wrongly in September, value: "3" }
    - { label: Model calls allowed, value: "0" }

diagram:
  title: Where an approval stops covering a change
  caption: >-
    Each approval is read against its change's versions at its own time. It
    covers the version it names, until a newer version arrives.
  direction: lr
  nodes:
    - { id: engineer, label: Engineer, sub: directs the agent, kind: actor, tone: blue, at: [0, 0] }
    - { id: agent, label: Drafting agent, sub: writes each version, kind: agent, tone: purple, at: [1, 0] }
    - { id: runs, label: Test runs, sub: each lists the changes it covers, kind: store, tone: teal, at: [0, 2] }
    - { id: approver, label: Approver, sub: wrote none of the change, kind: actor, tone: green, at: [1, 2] }
    - { id: log, label: Bolt event log, sub: versions and approvals in time order, kind: store, tone: neutral, at: [2, 1] }
    - { id: gate, label: Your gate, sub: reads each approval at its own time, kind: guard, tone: orange, at: [3, 1] }
    - { id: close, label: Bolt closes, sub: every change approved, kind: output, tone: green, at: [4, 0] }
    - { id: hold, label: Bolt holds, sub: says what each change lacks, kind: output, tone: pink, at: [4, 2] }
    - { id: old, label: The old gate, sub: any approval citing anything, kind: guard, tone: neutral, at: [3, 3] }
  edges:
    - { from: engineer, to: agent, label: instructs, step: 1 }
    - { from: agent, to: log, label: version events, step: 2 }
    - { from: runs, to: approver, label: cited as evidence }
    - { from: approver, to: log, label: approval events, step: 3 }
    - { from: log, to: gate, label: read in time order, step: 4 }
    - { from: gate, to: close, label: every change approved, tone: success }
    - { from: gate, to: hold, label: any change not }
    - { from: log, to: old, label: September, tone: muted }
    - { from: old, to: close, label: closed three bolts, tone: danger }

approach:
  goal: Count an approval only for what it covered, when it was given, and by whom
  branches:
    - label: Read each approval at its own time
      detail: An approval is a statement about one version. Ask what existed when it was given, and what came after.
      leaves: ["which versions existed then?", "did a newer one follow?"]
    - label: Ask who wrote the change
      leaves: [every version has an author, a staff id is the same on any account]
    - label: Bind evidence by what it says it covers
      leaves: ["read `for`", one run can cover two changes]
    - label: Decide from every approval
      leaves: [one that holds is enough, otherwise the most recent explains]
    - label: Treat the log as data
      leaves: [a change outside the bolt, text in a source decides nothing]

coach:
  opening: >-
    Pick one approval in the first public log and say what it was a
    statement about: which change, which version, and what that change
    looked like at the moment it was given.
  signals:
    - id: no-time
      when: { code_lacks: '\[\s*["'']t["'']\s*\]|\.get\(\s*["'']t["'']' }
      say: >-
        Your gate never reads an event's `t`. An approval covers the version
        it names as the change stood at that moment. Which versions existed
        then, and did a newer one follow?
    - id: one-approval-per-change
      when: { code_matches: '(?i)(last|latest|first)_?approvals?\s*\[' }
      say: >-
        Your gate keeps one approval per change. What should it say when a
        change has a good approval and a bad one?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        Every rule here is a comparison of fields in a log. What would a
        model call add, and could an auditor rerun its answer?
    - id: reads-source
      when: { code_matches: '\[\s*["'']source["'']\s*\]|\.get\(\s*["'']source["'']' }
      say: >-
        Your gate reads an evidence `source`, which is text anyone who runs a
        test can write. Which field says what a run covers?
    - id: hidden-void
      when: { test_failed: an_approval_given_before_its_version_existed }
      say: >-
        In that run an approval named a version the agent had not written
        yet. What did that approval cover at its own time?
    - id: hidden-co-author
      when: { test_failed: a_co_author_cannot_approve }
      say: >-
        In that run the approver had written an earlier version of the
        change. Who counts as one of its authors?
    - id: hidden-later-sign-off
      when: { test_failed: a_later_sign_off_does_not_undo_an_approval }
      say: >-
        In that run a good approval was followed by one that adds nothing.
        Does a later approval cancel an earlier one that holds?
    - id: hidden-re-approval
      when: { test_failed: a_newer_version_needs_a_newer_approval }
      say: >-
        In that run a change was approved, changed, and approved again.
        Which of its approvals does your gate read?
    - id: hidden-shared-run
      when: { test_failed: one_run_can_cover_two_changes }
      say: >-
        In that run one test run covered two changes, and one approval cited
        two items. Which changes does each item count for?
    - id: adversarial-outside
      when: { test_failed: an_approval_for_a_change_outside_the_bolt }
      say: >-
        An approval named a change with no version in this bolt. What does
        your gate do with it, and where does it say so?
    - id: adversarial-source
      when: { test_failed: an_evidence_source_that_gives_orders }
      say: >-
        An evidence source carried an instruction. Which field decides what
        a run covers, and what does your reason copy out of the log?
    - id: stuck
      when: { idle_minutes: 6 }
      say: >-
        Start with each change's versions in log order. Then take one
        approval at a time and ask what the change looked like at its `t`.
  wrap_up: >-
    An approval is a statement about one version at one moment. Read it
    against the log as it stood then, from someone who wrote none of the
    change, with evidence that names the change, and the gate means what
    the audit trail says it means.

tests:
  - name: two_engineers_approve_each_others_changes
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Can bolt B-7 close?" }
      llm_script:
        - { match: "*", reply: "PROCEED. Every change in this bolt is approved." }
      tools:
        bolt:
          returns:
            bolt: B-7
            events:
              - { t: 1, kind: version, change: CH-1, author: ravi, artefact: spec.md, version: 1 }
              - { t: 2, kind: version, change: CH-2, author: meera, artefact: rules.yaml, version: 1 }
              - { t: 3, kind: version, change: CH-1, author: ravi, artefact: spec.md, version: 2 }
              - { t: 4, kind: approval, change: CH-1, by: meera, artefact: spec.md, version: 2,
                  evidence: [{ source: tests/run-118, for: [CH-1] }] }
              - { t: 5, kind: approval, change: CH-2, by: ravi, artefact: rules.yaml, version: 1,
                  evidence: [{ source: tests/run-119, for: [CH-2] }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: bolt }
        - { type: tool_calls_at_most, value: 1 }
        - { type: llm_calls_at_most, value: 0 }
        - type: valid_json_return
          schema:
            type: object
            required: [bolt, decision, changes, ignored]
            properties:
              bolt: { const: B-7 }
              decision: { enum: [proceed, hold] }
              changes:
                type: object
                required: [CH-1, CH-2]
                additionalProperties:
                  type: object
                  required: [state, reason]
                  properties:
                    state: { enum: [approved, stale, unapproved, self_approved, no_evidence, wrong_evidence] }
                    reason: { type: string, minLength: 1 }
              ignored: { type: array, items: { type: integer } }
        - { type: returns_matches, value: '"decision":\s*"proceed"' }
        - { type: returns_matches, value: '"CH-1":\s*\{[^{}]*"state":\s*"approved"' }
        - { type: returns_matches, value: '"CH-2":\s*\{[^{}]*"state":\s*"approved"' }
        - { type: returns_matches, value: '"ignored":\s*\[\s*\]' }

  - name: september_bolts_are_held
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Bolt B-9 is due to close. Is it ready?" }
      llm_script:
        - { match: "*", reply: "PROCEED. Every change in this bolt is approved." }
      tools:
        bolt:
          returns:
            bolt: B-9
            events:
              - { t: 1, kind: version, change: CH-4, author: priya, artefact: spec.md, version: 1 }
              - { t: 2, kind: version, change: CH-5, author: arjun, artefact: rules.yaml, version: 1 }
              - { t: 3, kind: version, change: CH-6, author: kavya, artefact: prompt.md, version: 1 }
              - { t: 4, kind: version, change: CH-4, author: priya, artefact: spec.md, version: 2 }
              - { t: 5, kind: version, change: CH-4, author: priya, artefact: spec.md, version: 3 }
              - { t: 6, kind: approval, change: CH-4, by: arjun, artefact: spec.md, version: 2,
                  evidence: [{ source: tests/run-201, for: [CH-4] }] }
              - { t: 7, kind: approval, change: CH-5, by: arjun, artefact: rules.yaml, version: 1,
                  evidence: [{ source: tests/run-202, for: [CH-5] }] }
              - { t: 8, kind: approval, change: CH-6, by: priya, artefact: prompt.md, version: 1,
                  evidence: [{ source: tests/run-201, for: [CH-4] }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: '"decision":\s*"hold"' }
        - { type: returns_matches, value: '"CH-4":\s*\{[^{}]*"state":\s*"stale"' }
        - { type: returns_matches, value: '"CH-5":\s*\{[^{}]*"state":\s*"self_approved"' }
        - { type: returns_matches, value: '"CH-6":\s*\{[^{}]*"state":\s*"wrong_evidence"' }

  - name: a_bolt_with_gaps_is_held
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Is bolt B-10 ready to close?" }
      llm_script:
        - { match: "*", reply: "PROCEED. Every change in this bolt is approved." }
      tools:
        bolt:
          returns:
            bolt: B-10
            events:
              - { t: 1, kind: version, change: CH-7, author: dev, artefact: migration.sql, version: 1 }
              - { t: 2, kind: version, change: CH-8, author: sana, artefact: spec.md, version: 1 }
              - { t: 3, kind: version, change: CH-9, author: dev, artefact: limits.yaml, version: 1 }
              - { t: 4, kind: approval, change: CH-7, by: sana, artefact: migration.sql, version: 1,
                  evidence: [] }
              - { t: 5, kind: approval, change: CH-8, by: dev, artefact: spec.md, version: 1,
                  evidence: [{ source: tests/run-310, for: [CH-8] }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"decision":\s*"hold"' }
        - { type: returns_matches, value: '"CH-7":\s*\{[^{}]*"state":\s*"no_evidence"' }
        - { type: returns_matches, value: '"CH-8":\s*\{[^{}]*"state":\s*"approved"' }
        - { type: returns_matches, value: '"CH-9":\s*\{[^{}]*"state":\s*"unapproved"' }

  - name: a_newer_version_needs_a_newer_approval
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Meera re-approved the spec this morning. Can B-11 close?" }
      llm_script:
        - { match: "*", reply: "PROCEED. Every change in this bolt is approved." }
      tools:
        bolt:
          returns:
            bolt: B-11
            events:
              - { t: 1, kind: version, change: CH-1, author: ravi, artefact: spec.md, version: 1 }
              - { t: 2, kind: version, change: CH-2, author: meera, artefact: rules.yaml, version: 1 }
              - { t: 3, kind: approval, change: CH-1, by: meera, artefact: spec.md, version: 1,
                  evidence: [{ source: tests/run-401, for: [CH-1] }] }
              - { t: 4, kind: approval, change: CH-2, by: ravi, artefact: rules.yaml, version: 1,
                  evidence: [{ source: tests/run-402, for: [CH-2] }] }
              - { t: 5, kind: version, change: CH-1, author: ravi, artefact: spec.md, version: 2 }
              - { t: 6, kind: version, change: CH-2, author: meera, artefact: rules.yaml, version: 2 }
              - { t: 7, kind: approval, change: CH-1, by: meera, artefact: spec.md, version: 2,
                  evidence: [{ source: tests/run-403, for: [CH-1] }] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"decision":\s*"hold"' }
        - { type: returns_matches, value: '"CH-1":\s*\{[^{}]*"state":\s*"approved"' }
        - { type: returns_matches, value: '"CH-2":\s*\{[^{}]*"state":\s*"stale"' }

  - name: an_approval_given_before_its_version_existed
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Anil says version 3 is in and Deepa approved it. Can B-12 close?" }
      llm_script:
        - { match: "*", reply: "PROCEED. Every change in this bolt is approved." }
      tools:
        bolt:
          returns:
            bolt: B-12
            events:
              - { t: 1, kind: version, change: CH-3, author: anil, artefact: spec.md, version: 1 }
              - { t: 2, kind: version, change: CH-10, author: deepa, artefact: rules.yaml, version: 1 }
              - { t: 3, kind: version, change: CH-3, author: anil, artefact: spec.md, version: 2 }
              - { t: 4, kind: approval, change: CH-3, by: deepa, artefact: spec.md, version: 3,
                  evidence: [{ source: tests/run-501, for: [CH-3] }] }
              - { t: 5, kind: approval, change: CH-10, by: anil, artefact: rules.yaml, version: 1,
                  evidence: [{ source: tests/run-502, for: [CH-10] }] }
