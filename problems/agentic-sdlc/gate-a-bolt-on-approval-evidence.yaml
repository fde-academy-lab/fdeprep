      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: '"decision":\s*"hold"' }
        - { type: returns_matches, value: '"CH-3":\s*\{[^{}]*"state":\s*"unapproved"' }
        - { type: returns_matches, value: '"CH-10":\s*\{[^{}]*"state":\s*"approved"' }

  - name: a_co_author_cannot_approve
