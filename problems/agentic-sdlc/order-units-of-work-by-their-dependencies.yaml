slug: order-units-of-work-by-their-dependencies
title: "Order units of work by their dependencies"
day: 27
skill: Order units by the dependencies a model names, and send unknown ids and loops to a person
artefact_type: code
difficulty: medium
track: agentic-sdlc
concept:
  topic: "Units of work and bolts"
  question: "When the planner cannot find a safe order, who decides, and what are they told?"
est_minutes: 30
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
  - { slug: tool-error-handling, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json]

brief_md: |
  A services firm the size of Mindtree delivers a client's build in bolts,
  the short work cycles of AWS's AI-DLC, and the delivery lead plans each
  release as units of work. Before she packs any bolts, a model reads the
  units and says which depend on which, and her planner turns that answer
  into an order.

  In week two the model wrote that the reporting unit depended on "the schema
  work". No unit has that name. The planner matched it to nothing, dropped
  it, and scheduled reporting before the data model it reads. In week three
  the model said two units depended on each other. There is no order that
  satisfies both, and the planner picked one by alphabet. Each wrong order
  cost the team a bolt of rework before anyone noticed.

  Write the planner's ordering step. It orders the units when the model's
  answer allows it, and when the answer does not, it stops and tells the
  delivery lead exactly why.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the delivery lead's request. `tools["plan"]()` returns the
  units of work:

      {"units": [{"id": "UW-1", "title": "Customer data model",
                  "description": "Tables for customers and accounts."}, ...]}

  Every plan here numbers its units from `UW-1` to `UW-9`, so sorting the ids
  as text puts the lowest first.

  Ask the model once, with every unit's id, title and description, which
  units depend on which. Ask for one line in this shape, ids only:

      Depends: {"UW-2": ["UW-1"], "UW-3": ["UW-1", "UW-2"]}

  A reply is in that shape when, with the whitespace around it stripped, it
  starts with `Depends:` and the rest is one JSON object whose values are
  lists of strings. A unit the object leaves out depends on nothing, and a key
  that is not in the plan is ignored. When a reply is in any other shape, ask
  once more, with the reply that failed and the shape in the prompt. There is
  no third ask.

  Check every id the map names against the plan before ordering anything.
  Then order the units so that none comes before a unit it depends on, and
  whenever more than one unit is ready, take the lowest id.

  Some answers stop the ordering. The delivery lead decides those, so return
  `needs_person`, an empty `order`, and every reason in `problems`:

  | What stopped it | Entry in `problems` |
  |---|---|
  | A unit depends on an id that is not in the plan | `{"unit": "UW-4", "problem": "depends on UW-9, which is not in the plan"}`, in that wording, one for each such dependency |
  | The ordering is left with units that wait on each other in a loop | `{"cycle": ["UW-2", "UW-5"], "problem": "these units depend on each other"}`, the loop's ids sorted. A unit that only waits on the loop is not in it |
  | The reply is still in the wrong shape after the second ask | `{"problem": "the model did not reply in the Depends: shape"}` |

  Return a JSON string:

      {"outcome": "ordered", "order": ["UW-1", "UW-3", "UW-2"], "problems": []}

  Budget: at most 2 model calls, and one call to `plan`. Allowed imports:
  json.

