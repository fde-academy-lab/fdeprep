            - { id: "S-8", unit: "UoW-2", text: "Picks the nearest partner with the part in stock", check: "partner has qty > 0" }
            - { id: "S-9", unit: "UoW-2", text: "Refuses to book on a sheet older than 24 hours", check: "no booking with updated_at over 24 h" }
