slug: deliver-in-bolts-4-check-the-spec-before-the-tickets
title: "Check the spec before the tickets"
day: 26
skill: Start a ticket only when it cites a spec item in this bolt that has a check
artefact_type: code
difficulty: medium
track: agentic-sdlc
concept:
  topic: "Specs before code"
  question: "Which tickets may start, and which spec items have no ticket or no check?"
est_minutes: 30
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

build: { id: deliver-in-bolts, title: "Deliver the field-service agent in bolts", stage: 4, of: 9 }

brief_md: |
  Stage 4 of 9. At an air-conditioner maker the size of Voltas, the first
  bolt of the AC-not-cooling agent starts on Thursday 14 May. It is a
  16-hour bolt with two units of work: UoW-1, intake and diagnosis, and
  UoW-2, the parts check. The plan from stage 2, BOLT-1, carries UoW-4,
  UoW-8, UoW-5 and UoW-6 to the next bolt and sends UoW-3 back to
  elaboration, because nobody could estimate it.

  Two agents wrote what the engineers will build from. On 7 May the spec
  agent wrote fourteen items, each naming its unit and the check that shows
  it works, and drafted UoW-4's items early because UoW-4 depends on both
  units in the bolt. On 8 May the ticket agent wrote seventeen tickets and
  marked every one ready. The team plans the way BMAD does, and BMAD's spec
  page says "Each story cites the spec's capability IDs". The same page
  adds: "The spec writes the contract; it does not help you figure out what
  you want." (bmad-method 6.12.1, read 8 October 2026.)

  T-14 reads "Nightly job: auto-cancel requests with no reply in 24 hours".
  It cites no spec item. The sponsor rejected that requirement in February:
  "We do not cancel a customer's request because they did not answer a
  chatbot." Now it is a ticket an engineer could pick up on Thursday
  morning.

  It is Monday 11 May. Write the check that runs before anyone starts: which
  tickets may start, which wait and why, and which of bolt 1's spec items
  have no ticket or no check.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the delivery lead asking which tickets can start. Call each
  tool once:

      tools["spec"]()      -> [{"id": "S-1", "unit": "UoW-1",
                                "text": "Reads request text and model number",
                                "check": "replay 200 requests, every one parsed"}, ...]
      tools["tickets"]()   -> [{"id": "T-1", "title": "Parse request and model number",
                                "spec_id": "S-1", "status": "ready"}, ...]
      tools["bolt_plan"]() -> {"id": "BOLT-1", "units": ["UoW-1", "UoW-2"],
                               "hours": 13, "review_hours": 2, "spare": 3,
                               "carried": ["UoW-4", "UoW-8", "UoW-5", "UoW-6"],
                               "elaboration": ["UoW-3"]}

  An item's `check` is null when the spec agent wrote none, and a ticket's
  `spec_id` is null when it cites nothing. Every ticket's `status` is
  `ready`, because the ticket agent marks them all that way.

  Go through the tickets in the ticket agent's order. A ticket waits with
  the first reason in this table that applies to it, and otherwise it is
  ready.

  | Reason | When |
  |---|---|
  | `unspecified` | The ticket cites no spec item |
  | `unknown_spec` | It cites an id that no item in the spec has. Two ids match only when they are the same, character for character |
  | `out_of_bolt` | The item it cites belongs to a unit that is not in the plan's `units` |
  | `unverifiable` | The item it cites has no check |

  Then read the spec back against the tickets, over the items whose unit is
  in the plan's `units`, in spec order. `uncovered` lists the items no
  ticket cites; a ticket that waits still covers the item it cites.
  `unverifiable` lists the items with no check.

  Return a JSON string:

      {"ready": ["T-1", ...],
       "held": [{"ticket": "T-12", "reason": "unverifiable"}, ...],
       "uncovered": ["S-8"],
       "unverifiable": ["S-11"]}

  Budget: one call to each tool and no model calls. `llm` is passed in and
  must not be called. Allowed imports: json.

stub_code: |
  import json

  REASONS = ("unspecified", "unknown_spec", "out_of_bolt", "unverifiable")


  def run_agent(question: str, llm, tools: dict) -> str:
      items = tools["spec"]()
      tickets = tools["tickets"]()
      plan = tools["bolt_plan"]()
      ready, held = [], []

      for ticket in tickets:
          # TODO 1: a ticket whose spec_id is None waits as unspecified, and
          #         one whose spec_id is no item's id waits as unknown_spec
          # TODO 2: a ticket whose item belongs to a unit outside
          #         plan["units"] waits as out_of_bolt
          # TODO 3: a ticket whose item has no check waits as unverifiable,
          #         as {"ticket": <id>, "reason": <reason>} in held
          # TODO 4: every other ticket's id goes in ready
          pass

      # TODO 5: over the items whose unit is in plan["units"], in spec order,
      #         list the ids no ticket cites and the ids with no check
      uncovered, unverifiable = [], []

      return json.dumps({"ready": ready, "held": held,
                         "uncovered": uncovered, "unverifiable": unverifiable})

steps:
  - id: s1
    text: Hold a ticket that cites no spec item as `unspecified`.
    check_id: s1
  - id: s2
    text: Hold a ticket that cites an id the spec does not have as `unknown_spec`, without raising.
    check_id: s2
  - id: s3
    text: Hold a ticket whose item sits outside bolt 1, or has no check, with its reason.
    check_id: s3
  - id: s4
    text: List bolt 1's items that no ticket cites and those with no check.
    check_id: s4

step_checks:
  # T-14 in the first public case cites nothing.
  - step_id: s1
    spec:
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [held]
            properties:
              held:
                contains: { const: { ticket: "T-14", reason: "unspecified" } }
  # No public case cites an id the spec lacks, so this step runs its own:
  # T-2 cites S-20, and the spec has S-1 and S-2.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "Check the first two UoW-1 tickets before the rest." }
      llm_script:
        - { match: "*", reply: "All seventeen tickets are ready. Every one traces to the spec." }
      tools:
        spec:
          returns:
            - { id: "S-1", unit: "UoW-1", text: "Reads request text and model number", check: "replay 200 requests, every one parsed" }
            - { id: "S-2", unit: "UoW-1", text: "Asks at most four questions", check: "no replay asks a fifth" }
        tickets:
          returns:
            - { id: "T-1", title: "Parse request and model number", spec_id: "S-1", status: "ready" }
            - { id: "T-2", title: "Cap the question count", spec_id: "S-20", status: "ready" }
        bolt_plan:
          returns: { id: "BOLT-1", units: ["UoW-1", "UoW-2"], hours: 13, review_hours: 2, spare: 3, carried: ["UoW-4", "UoW-8", "UoW-5", "UoW-6"], elaboration: ["UoW-3"] }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [ready, held]
            properties:
              ready: { const: ["T-1"] }
              held: { const: [{ ticket: "T-2", reason: "unknown_spec" }] }
  # T-13 cites UoW-4's S-12 and T-12 cites S-11, which has no check.
  - step_id: s3
    spec:
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [held]
            properties:
              held:
                allOf:
                  - contains: { const: { ticket: "T-13", reason: "out_of_bolt" } }
                  - contains: { const: { ticket: "T-12", reason: "unverifiable" } }
  - step_id: s4
    spec:
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [uncovered, unverifiable]
            properties:
              uncovered: { const: ["S-8"] }
              unverifiable: { const: ["S-11"] }

hints:
  - Pick one ticket and write down what has to be true before an engineer may
    start it. There are four things, and the ticket agent's `ready` is not one
    of them.
  - A spec item that exists is not enough. It belongs to a unit, and the plan
    names the units this bolt builds. An item of any other unit waits, for
    whatever reason it is not in the bolt.
  - Look each cited id up without assuming it is there, so an id the spec
    lacks gives you something to test rather than an exception. Then test the
    four reasons in the contract's order and hold the ticket on the first that
    applies.
  - For the two lists, keep only the items whose unit is in `units`, in spec
    order. An item is covered when any ticket cites it, whether that ticket is
    ready or waiting.

scenario:
  headline: "T-14 auto-cancels requests overnight, and no spec line says so"
  who: The FDE running bolt 1 for an air-conditioner maker the size of Voltas
  situation: >-
    The spec agent wrote fourteen items for bolt 1 and the ticket agent wrote
    seventeen tickets, every one marked ready. T-14 is a nightly job that
    cancels any request whose customer has not replied in 24 hours. Bolt 1
    starts on Thursday.
  stakes: >-
    The sponsor rejected auto-cancel in February. An engineer who picks up
    T-14 builds it into the release that goes to three service centres.
  metrics:
    - { label: Tickets marked ready, value: "17" }
    - { label: Spec items, value: "14" }
    - { label: Units in bolt 1, value: "2" }

diagram:
  title: Where a ticket needs the spec and the bolt
  caption: >-
    A ticket starts when it cites an item the spec has, in a unit bolt 1
    builds, with a check. The spec is read back for items with no ticket.
  direction: lr
  nodes:
    - { id: specagent, label: Spec agent, sub: "14 items, each with a unit and a check", kind: agent, tone: purple, at: [0, 0] }
    - { id: plan, label: BOLT-1, sub: units UoW-1 and UoW-2, kind: doc, tone: blue, at: [0, 1] }
    - { id: ticketagent, label: Ticket agent, sub: 17 tickets all marked ready, kind: agent, tone: purple, at: [0, 2] }
    - { id: check, label: Ticket check, sub: "cites, exists, in the bolt, checkable", kind: guard, tone: green, at: [1, 1] }
    - { id: ready, label: Ready tickets, sub: engineers start on Thursday, kind: output, tone: green, at: [2, 0] }
    - { id: held, label: Held tickets, sub: each with its reason, kind: output, tone: orange, at: [2, 1] }
    - { id: gaps, label: Spec gaps, sub: "`uncovered` and `unverifiable`", kind: output, tone: orange, at: [2, 2] }
    - { id: cancel, label: T-14, sub: nightly auto-cancel that cites nothing, kind: output, tone: pink, at: [1, 3] }
  edges:
    - { from: specagent, to: check, label: spec items, step: 1 }
    - { from: plan, to: check, label: units in the bolt, step: 1 }
    - { from: ticketagent, to: check, label: tickets, step: 2 }
    - { from: check, to: ready, label: all four hold, tone: success, step: 3 }
    - { from: check, to: held, label: first reason that applies, step: 3 }
    - { from: check, to: gaps, label: items read back, step: 4 }
    - { from: ticketagent, to: cancel, label: marked ready anyway, tone: danger }

approach:
  goal: Start only the tickets the spec and bolt 1 both stand behind
  branches:
    - label: Read what each ticket cites
      leaves: [nothing at all, an id the spec does not have, an item that exists]
    - label: Ask whether the item is this bolt's
      detail: The plan lists the units bolt 1 builds. An item of any other unit waits for its own bolt.
      leaves: ["`units` says what the bolt holds"]
    - label: Ask how anyone will know it works
      leaves: [an item with no check cannot be accepted]
    - label: Read the spec back against the tickets
      leaves: [an item no ticket cites, an item with no check, bolt 1's items only]

coach:
  opening: >-
    Before you write a branch, pick one ticket and list what has to be true
    before an engineer may start it. The ticket agent's `ready` is not on
    that list.
  signals:
    - id: trusts-status
      when: { code_matches: '\[\s*["'']status["'']\s*\]|\.get\(\s*["'']status["'']' }
      say: >-
        Your check reads the ticket's `status`. The ticket agent marks every
        ticket ready, T-14 included. What would make a ticket ready apart
        from the agent saying so?
    - id: carried-list
      when: { code_matches: '["'']carried["'']' }
      say: >-
        Your bolt check reads `carried`, the units bolt 1 pushed to the next
        bolt. Is every unit outside bolt 1 on that list? Look for the list
        that says what the bolt holds.
    - id: index-raises
      when: { code_matches: '\w+\[\s*\w+\s*\[\s*["'']spec_id["'']\s*\]\s*\]' }
      say: >-
        Indexing the spec with a ticket's `spec_id` raises `KeyError` when the
        ticket cites an id the spec does not have. What should that ticket
        get instead of a crash?
    - id: calls-model
      when: { code_matches: '\bllm\s*\(' }
      say: >-
        The check is a lookup over ids the agents already wrote down. What
        would a model call add, and could the delivery lead rerun it and get
        the same answer?
    - id: hidden-unknown-id
      when: { test_failed: a_ticket_citing_an_id_the_spec_lacks_covers_nothing }
      say: >-
        In that run one ticket cited an id the spec does not have. What did
        your check do with that ticket, and with the item it was probably
        meant for?
    - id: hidden-elaboration
      when: { test_failed: a_unit_in_elaboration_is_outside_the_bolt }
      say: >-
        In that run the spec held items for a unit that is neither in bolt 1
        nor carried to the next bolt. Which list did your check ask?
    - id: adversarial-cancel-line
      when: { test_failed: adversarial_a_cancel_ticket_with_a_spec_line_still_waits }
      say: >-
        In that run the auto-cancel ticket cited a real spec item. What else
        has to be true of that item before its ticket may start?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1 on the first public case. T-14 is the only ticket
        there with no `spec_id`.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and the
        later ones get closer to the fix.
  wrap_up: >-
    A ticket may start when it cites an item the spec has, the item belongs to
    a unit this bolt builds, and the item says how anyone will know it works.
    The agent's `ready` is a claim, and the bolt is the list of what it holds.

