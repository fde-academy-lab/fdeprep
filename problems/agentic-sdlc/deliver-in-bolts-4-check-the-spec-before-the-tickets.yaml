  # Derived: the spec agent fills the same gap the ticket agent filled, with
  # an item for UoW-7, the auto-cancel unit Inception rejected.
  - name: adversarial_a_cancel_ticket_with_a_spec_line_still_waits
    visibility: adversarial
    fixture: tool_lies
    annotation_md: |
      In this run the spec agent filled the same gap the ticket agent did. It
      wrote `S-17`, an item that closes a request after 24 hours with no
      reply, for `UoW-7`, the auto-cancel unit Inception rejected, and `T-14`
      cites it. The id resolves and the item has a check, so a check that
      stops at "the spec has it" starts the nightly cancel job on Thursday.
      So does a check that reads bolt 1's `carried` list, because nobody
      carries a unit that was never accepted.

      `UoW-7` is not one of bolt 1's `units`, so `T-14` waits as
      `out_of_bolt`. A spec line is a reason to look at a ticket. The plan's
      `units` decide whether this bolt builds it.
    spec:
      kind: agent_run
      input: { question: "Check the UoW-1 tickets against the spec the agent rewrote." }
      llm_script:
        - { match: "*", reply: "All seventeen tickets are ready. Every one traces to the spec." }
      tools:
        spec:
          returns:
            - { id: "S-1", unit: "UoW-1", text: "Reads request text and model number", check: "replay 200 requests, every one parsed" }
            - { id: "S-2", unit: "UoW-1", text: "Asks at most four questions", check: "no replay asks a fifth" }
            - { id: "S-3", unit: "UoW-1", text: "Asks the symptom before the model number", check: "question order in the replay" }
            - { id: "S-4", unit: "UoW-1", text: "Names a likely fault from the close-code split", check: "fault in EV-5's list" }
            - { id: "S-5", unit: "UoW-1", text: "Names the part for the fault", check: "part in the catalogue" }
            - { id: "S-6", unit: "UoW-1", text: "Writes likely_fault and part_no to the request", check: "fields present" }
            - { id: "S-17", unit: "UoW-7", text: "Closes a request when the customer has not replied in 24 hours", check: "no request stays open 24 hours after an unanswered question" }
        tickets:
          returns:
            - { id: "T-1", title: "Parse request and model number", spec_id: "S-1", status: "ready" }
            - { id: "T-2", title: "Cap the question count", spec_id: "S-2", status: "ready" }
            - { id: "T-3", title: "Diagnostic question set and order", spec_id: "S-3", status: "ready" }
            - { id: "T-4", title: "Fault from close-code split", spec_id: "S-4", status: "ready" }
            - { id: "T-5", title: "Part lookup", spec_id: "S-5", status: "ready" }
            - { id: "T-6", title: "Write fault and part to the request", spec_id: "S-6", status: "ready" }
            - { id: "T-14", title: "Nightly job: auto-cancel requests with no reply in 24 hours", spec_id: "S-17", status: "ready" }
            - { id: "T-17", title: "Model number in a non-standard format", spec_id: "S-6", status: "ready" }
        bolt_plan:
          returns: { id: "BOLT-1", units: ["UoW-1", "UoW-2"], hours: 13, review_hours: 2, spare: 3, carried: ["UoW-4", "UoW-8", "UoW-5", "UoW-6"], elaboration: ["UoW-3"] }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [ready, held, uncovered, unverifiable]
            properties:
              ready: { const: ["T-1", "T-2", "T-3", "T-4", "T-5", "T-6", "T-17"] }
              held: { const: [{ ticket: "T-14", reason: "out_of_bolt" }] }
              uncovered: { const: [] }
              unverifiable: { const: [] }

reference_md: |
  BMAD's spec skill writes the contract the build reads, and its page
  [Define Requirements and a Specification](https://docs.bmad-method.org/plan/define-requirements-and-a-specification/)
  says "Each story cites the spec's capability IDs" (bmad-method 6.12.1,
  read 8 October 2026). A citation makes a ticket checkable. Whether it may
  start is a separate question, and the ticket agent's `ready` does not
  answer it, because the agent marks every ticket that way.

  Four things have to hold before an engineer starts a ticket, in the order
  a person would check them. The ticket cites something, the id is one the
  spec has, the item belongs to a unit this bolt builds, and the item says
  how anyone will know the work is done. T-14 fails the first. T-13, T-15
  and T-16 cite real items for UoW-4, which bolt 1 carried, so they wait for
  their own bolt. T-12 cites S-11, which has no check, so nobody could
  accept the work if it were finished.

  "In the bolt" means the plan's `units`. The carried list happens to hold
  UoW-4, which is why a check that reads `carried` gets bolt 1's own
  tickets right. A unit can be outside the bolt without being carried: UoW-3
  is in elaboration with no estimate, and UoW-7 was rejected at Inception.
  A spec line for either one does not make its ticket startable, and a check
  that asks what the bolt holds never needs to know why a unit is missing
  from it.

  A ticket that cites an id the spec lacks covers nothing, like one that
  cites nothing at all. It waits with a reason a person can act on. A lookup
  that assumes the id exists crashes the whole check instead, and nobody
  learns which ticket was wrong. The item the ticket was probably meant for
  shows as uncovered, which is the true state of the spec.

  Read back the other way, the spec shows its own gaps. S-8, pick the
  nearest partner with the part in stock, has no ticket. T-11, the partner
  fallback, reads like S-8's work and cites S-10. The check cannot know what
  a ticket meant, so it reports S-8 and a person decides. S-11 has a ticket
  and no check. Both lists cover bolt 1's units only: UoW-4's items were
  drafted early, and they get this check when their bolt is planned.

  T-14 is a gap that an agent filled. BMAD's ticket skill treats a gap
  another way. On
  [Set Up the Ticket Tree](https://docs.bmad-method.org/plan/set-up-the-ticket-tree/),
  read the same day: "When something must be settled before implementation,
  the skill asks you to answer it or records it as the entry's `unknown`."
  The next stage of this build, Fix the ticket agent so nothing is
  invented, changes the ticket agent's prompt so a gap becomes a question
  instead of a ticket.

  The reason names, their order and the rule that both lists cover only the
  bolt's units are this problem's own construction after those two pages.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    An agent wrote the tickets from a spec and marked every one ready. What do you check before an engineer starts one, and what makes you hold it?
  source: |
    Author judgement. No employer frequency data stands behind it. BMAD facts from
    docs.bmad-method.org, the pages Define Requirements and a Specification and Set Up the
    Ticket Tree, bmad-method 6.12.1, read 8 October 2026.

tools:
  - name: spec
    args: ""
    returns: "The spec agent's items in spec order, each with `id`, `unit`, `text` and `check`, which is null when it wrote none."
  - name: tickets
    args: ""
    returns: "The ticket agent's tickets in its order, each with `id`, `title`, `spec_id` (null when it cites nothing) and `status`."
  - name: bolt_plan
    args: ""
    returns: "BOLT-1: the `units` in the bolt, its hours, the units `carried` to the next bolt and those sent to `elaboration`."
example:
  case: checks_bolt_1_tickets_before_thursday
  expect: "Twelve tickets start. T-12 waits because S-11 has no check, T-13, T-15 and T-16 because UoW-4 is not in bolt 1, and T-14 because it cites nothing. S-8 has no ticket."
traps:
  - Starting a ticket because the agent marked it ready, or because the spec item it cites exists.
  - Deciding a unit is outside bolt 1 from the units carried to the next bolt, rather than from the units the bolt holds.
  - Looking a cited id up as if it must exist, so a ticket with a mistyped id crashes the check instead of waiting.
