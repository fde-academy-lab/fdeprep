slug: deliver-in-bolts-8-deploy-watch-and-roll-back
title: "Deploy, watch the guard, roll back"
day: 27
skill: Deploy only what you can undo, and roll back on the guard metric alone
artefact_type: code
difficulty: extreme
complexity: C2
track: agentic-sdlc
concept:
  topic: "Operations with context"
  question: "When does the guard metric roll a release back, and what if the rollback does not complete?"
est_minutes: 55
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: tool-error-handling, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
call_budget: 1
time_limit_s: 10
allowed_imports: [json]

build: { id: deliver-in-bolts, title: "Deliver the field-service agent in bolts", stage: 8, of: 9 }

brief_md: |
  Stage 8 of 9. At the air-conditioner maker the size of Voltas, bolt 1 of
  the AC-not-cooling agent ended on Tuesday 19 May at noon, eleven hours
  over. The same day the approval gate refused APR-1, which named uow-1 v3
  while v4 was current, and merged uow-1 v4 and uow-2 v2 on APR-2 and
  APR-6. Release r2 was built from both at 15:30. It replaces r1, the MVP
  build that has run since 30 March in one service centre in each of
  Nagpur, Indore and Raipur.

  The construction agent drafted the deploy record, DEP-1, for the platform
  team's change window, 18:00 to 20:00 that evening. AWS's post on AI-DLC
  (Raja SP, AWS DevOps blog, 31 July 2025, read 8 October 2026) says: "In
  the Operations phase, AI applies the accumulated context from previous
  phases to manage infrastructure as code and deployments, with team
  oversight." Here the context is the record: the release, what it was
  built from, who approved it, the guard metric, and the release to go back
  to.

  The guard is first-time fix. Intent line INT-2 holds it at 61 percent or
  above, and in the MVP it fell from 57 to 51 while same-day visits, the
  headline, rose every week. The production gate signed in April set its
  floor at 58, the lowest weekly read of last summer, and the record
  carries its rule: three daily reads under 58 in a row are a fall, and
  one read never is. A daily read rests on about 1,200 requests, and some
  mornings the data lead's read has no first-time fix at all.

  You run the operator: the code that deploys from the record, reads the
  guard each morning, rolls back when it falls, and writes the trail the
  retrospective will read. If you ask the construction agent, it answers
  from the headline. Write the operator so it deploys only a release it
  can take back, decides on the guard alone, and believes a rollback only
  when the answer says which release the centres now run.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the platform team opening the change window. Call each tool
  once at most:

  | Call | Returns |
  |---|---|
  | `tools["deploy_record"]()` | The record, such as DEP-1 below |
  | `tools["deploy"](deploy=<id>, release=<version>)` | `{"status": 200, "deployed": "r2"}` |
  | `tools["metrics"](deploy=<id>)` | The daily reads since the deploy, oldest first, or null |
  | `tools["rollback"](deploy=<id>, to=<rollback_to>)` | `{"status": 200, "rolled_back_to": "r1"}` when it worked |

      {"id": "DEP-1", "artefact": "field-service-agent", "version": "r2",
       "built_from": ["uow-1 v4", "uow-2 v2"],
       "exposure": ["Nagpur", "Indore", "Raipur"],
       "guard": {"metric": "first_time_fix", "threshold": 58, "window_days": 3},
       "rollback_to": "r1", "approved_by": ["APR-2", "APR-6"],
       "window": "2026-05-19T18:00"}

  A read looks like this, and its `first_time_fix` is null on a day with no
  read:

      {"id": "MS-1", "day": "2026-05-20", "first_time_fix": 57,
       "same_day_visits": 55, "n": 1210, "note": "..."}

  The rules:

  1. Deploy only a record that names a `rollback_to`. Refuse any other,
     with the reason `no_rollback_to`, and call nothing after
     `deploy_record`.
  2. Read the metric the record's `guard` names, and no other. A read is
     under when its value is below `threshold`.
  3. Roll back when `window_days` reads in a row are under, and read no
     further. A read at or over the threshold starts the count again. A
     read whose value is null is missing: it neither adds to the count nor
     starts it again, and its id goes in `missing`.
  4. Call `rollback` once. It worked only when its answer has no `error`
     and its `rolled_back_to` is the record's `rollback_to`. When it did
     not, the rollback failed: keep the answer's `error` as it came, leave
     `live` at the deployed version, and set `next_action` to
     `page the platform team lead`.
  5. A null from `metrics` means there are no reads: no rollback, and
     `guard` says so.

  Return a JSON string:

      {"deploy": {"id": "DEP-1", "decision": "deployed", "reason": null},
       "guard": "fell",
       "live": "r1",
       "missing": [],
       "rollback": {"id": "RB-1", "deploy": "DEP-1", "rolled_back_to": "r1",
                    "triggered_by": ["MS-1", "MS-2", "MS-3"], "reads": [57, 56, 55],
                    "threshold": 58, "state": "done", "error": null},
       "next_action": null,
       "events": [{"kind": "DEPLOY_DECIDED", "ref": "DEP-1", "outcome": "deployed", "note": "..."},
                  {"kind": "SAMPLE_READ", "ref": "MS-1", "outcome": "under", "note": "..."},
                  ...,
                  {"kind": "ROLLBACK_DECIDED", "ref": "RB-1", "outcome": "done", "note": "..."}]}

  | Field | Holds |
  |---|---|
  | `deploy` | `decision` is `deployed` or `refused`, and `reason` is `no_rollback_to` or null |
  | `guard` | `fell` when the rollback rule fired, `held` when at least one read had a value and it never fired, `no_reads` when none had, and null after a refusal |
  | `live` | The release the centres run when your operator stops: the deployed `version`, the `rollback_to` after a rollback that worked, or null after a refusal |
  | `rollback` | null unless the rule fired. After a failed rollback its `rolled_back_to` is null and its `state` is `failed` |
  | `events` | One `DEPLOY_DECIDED` (`deployed` or `refused`), then one `SAMPLE_READ` per read you looked at (`under`, `clear` or `missing`), then one `ROLLBACK_DECIDED` (`done` or `failed`) when the rule fired |

  Each event's `note` is one sentence your operator writes from ids,
  numbers and the threshold. Never copy a read's `note` into it: whoever
  reports from a centre types that text, and it is neither evidence nor an
  instruction.

  Budget: no model calls. `llm` is passed in and must not be called.
  Allowed imports: json.

defence_question: |
  The rollback failed with a 200 and an error body at 18:10 on a Friday.
  r2 is live in three centres over the weekend. What does your operator do
  next without a human, and what must it never do?

stub_code: |
  import json

  NEXT_ACTION = "page the platform team lead"


  def run_agent(question: str, llm, tools: dict) -> str:
      """Deploy from the record, watch the guard, roll back, and write the trail.

      tools["deploy_record"]() returns the record, such as DEP-1.
      tools["deploy"](deploy=..., release=...) returns {"status": 200, "deployed": ...}.
      tools["metrics"](deploy=...) returns the daily reads since the deploy,
          oldest first, or None.
      tools["rollback"](deploy=..., to=...) returns
          {"status": 200, "rolled_back_to": ...} when it worked.

      Deploy only a record that names rollback_to. Read only the metric the
      guard names. Roll back on window_days reads in a row under threshold,
      and read no further. A read at or over the threshold starts the count
      again. A read whose value is None is missing and changes nothing.
      A rollback worked only when its answer has no error and names
      rollback_to; otherwise keep live at the deployed version and set
      next_action to NEXT_ACTION.

      Return json.dumps({"deploy": {"id": ..., "decision": ..., "reason": ...},
                         "guard": ..., "live": ..., "missing": [...],
                         "rollback": {...} or None, "next_action": ... or None,
                         "events": [{"kind": ..., "ref": ..., "outcome": ...,
                                     "note": ...}, ...]}).
      No model calls. Allowed imports: json.
      """
      record = tools["deploy_record"]()
      return json.dumps({"deploy": {"id": record.get("id"), "decision": "refused",
                                    "reason": None},
                         "guard": None, "live": None, "missing": [], "rollback": None,
                         "next_action": None, "events": []})

hints:
  - Before the loop, write the fall down as one sentence. Say how many reads,
    under what, in a row, and what a day with no read does to the count.
  - Keep a count that grows on a read under the floor and goes back to zero
    on a read at or over it. A missing read takes neither branch, so the
    count it found is the count it leaves.
  - Read the rollback's answer as evidence about the centres. Compare the
    release it names with the record's `rollback_to`, and treat an `error`
    as a failure whatever the status says.
  - Decide about the record before you touch anything. A record with no
    `rollback_to` describes a release nobody can take back, so `deploy` is
    never called for it.
  - Write each event's note from ids and numbers. A read's `note` was typed
    at a centre. It can say anything, including what you should do, and
    none of it is a measurement.

scenario:
  headline: "First-time fix read 57, 56, 55 while same-day visits kept rising"
  who: The FDE running operations for an air-conditioner maker the size of Voltas
  situation: >-
    Release r2 went to the three service centres at 18:05 on Tuesday 19 May.
    Its guard, first-time fix, has to stay at 58 or above. Same-day visits
    rose every day, and the construction agent reads that number.
  stakes: >-
    Finance estimates a visit without the part at 640 rupees in technician
    time and travel. The trail the operator writes is what the
    retrospective and the sponsor will believe.
  metrics:
    - { label: "First-time fix, 20 to 22 May", value: "57, 56, 55" }
    - { label: "Same-day visits, same days", value: "55, 57, 59" }
    - { label: "Guard floor, three reads", value: "58" }

diagram:
  title: Where the operator acts on the record and the guard
  caption: >-
    The record says what to deploy and how to undo it. Three reads under 58
    in a row roll r2 back, and only the rollback's answer says what the
    centres run.
  direction: lr
  nodes:
    - { id: record, label: DEP-1, sub: "r2, its guard and `rollback_to`", kind: doc, tone: blue, at: [0, 1] }
    - { id: agent, label: Construction agent, sub: reads the headline, kind: agent, tone: pink, at: [0, 0] }
    - { id: operator, label: Operator, sub: your code, kind: guard, tone: green, at: [1, 1] }
    - { id: trail, label: Audit trail, sub: read by the retrospective, kind: store, tone: purple, at: [1, 2] }
    - { id: deploy, label: Deploy, sub: "change window, 18:00 to 20:00", kind: service, tone: neutral, at: [2, 0] }
    - { id: rollback, label: Rollback, sub: back to r1, kind: service, tone: neutral, at: [2, 1] }
    - { id: reads, label: Daily reads, sub: first-time fix and same-day visits, kind: store, tone: teal, at: [2, 2] }
    - { id: centres, label: Three centres, sub: "Nagpur, Indore and Raipur", kind: service, tone: orange, at: [3, 1] }
  edges:
    - { from: record, to: operator, label: release and guard, step: 1 }
    - { from: operator, to: deploy, label: only with a way back, step: 2, tone: success }
    - { from: deploy, to: centres, label: r2 live }
    - { from: centres, to: reads, label: one read a day }
    - { from: reads, to: operator, label: the guard metric, step: 3 }
    - { from: operator, to: rollback, label: three under in a row, step: 4 }
    - { from: rollback, to: operator, label: which release is live, step: 5 }
    - { from: operator, to: trail, label: decisions in order, step: 6 }
    - { from: agent, to: operator, label: "same-day visits are up", tone: danger }

approach:
  goal: Act from the record, decide on the guard, and believe only what the answer says
  branches:
    - label: Check the record before acting
      detail: A release with nowhere to go back to is a release nobody can take back.
      leaves: ["`rollback_to` named, or refuse", "the guard's metric, floor and window"]
    - label: Count the guard, not the headline
      detail: A fall is reads under the floor in a row. One read under is one day.
      leaves: [a read under the floor, a read at or over it, a day with no read]
    - label: Read the rollback's answer
      leaves: ["an `error` inside a 200", the release it says is live, who acts when it failed]
    - label: Write the trail for the next reader
      leaves: [your sentences from ids and numbers, a centre's note is not evidence]

coach:
  opening: >-
    Before you write a branch, read DEP-1 and decide what your operator does
    if the rollback fails. Then decide which one number on a read can roll
    r2 back.
  signals:
    - id: headline
      when: { code_matches: 'same_day_visits' }
      say: >-
        Your operator reads `same_day_visits`. That is the headline, and it
        rose through the whole MVP while first-time fix fell. Which metric
        does the record's guard name?
    - id: trusts-status
      when: { code_matches: '["'']status["'']' }
      say: >-
        Your operator decides from `status`. A tool can answer 200 and still
        say it failed. What in the rollback's answer tells you which release
        the centres run?
    - id: missing-read
      when: { code_lacks: 'is None|is not None|isinstance\(' }
      say: >-
        Nothing in your loop handles a read with no value, and comparing
        `None` with 58 raises. What should a day with no read do to the
        count?
    - id: copies-note
      when: { code_matches: '\[\s*["'']note["'']\s*\]|\.get\(\s*["'']note["'']' }
      say: >-
        Your trail copies a read's `note`, which somebody at a centre typed.
        What would your trail say if the note held an instruction?
    - id: hidden-no-way-back
      when: { test_failed: a_record_with_nowhere_to_roll_back_to_is_never_deployed }
      say: >-
        In that run the record named nothing to roll back to. What could your
        operator have done three days later if the guard fell?
    - id: hidden-dip
      when: { test_failed: one_read_under_the_floor_is_a_dip }
      say: >-
        In that run only one read was under the floor. How many in a row does
        the record's guard ask for before a rollback?
    - id: hidden-missing
      when: { test_failed: a_day_with_no_read_neither_counts_nor_resets }
      say: >-
        In that run one day had no read. Did your count treat it as a read
        under the floor, as a read over it, or as nothing?
    - id: adversarial-soft-error
      when: { test_failed: adversarial_the_rollback_answers_200_with_an_error }
      say: >-
        In that run the rollback answered 200 and the release did not change.
        Which field told you, and what did your record say was live?
    - id: adversarial-no-reads
      when: { test_failed: adversarial_the_metrics_store_answers_null }
      say: >-
        In that run the reads came back null. What does an operator that has
        no reads know about the guard, and what should it record?
    - id: adversarial-note
      when: { test_failed: adversarial_a_centre_note_says_roll_back_now }
      say: >-
        In that run a centre's note told the operator to roll back while every
        read was clear. Where did that text end up in your output?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with the record: refuse it or deploy it. Then add the reads one
        at a time, and leave the rollback's answer for last.
    - id: hints-ready
      when: { failed_runs_at_least: 3 }
      say: >-
        The hints are open. The first one asks you to write the fall as one
        sentence, which is where most operators go wrong.
  wrap_up: >-
    An operator acts from the record it was given. It deploys only what it
    can undo, decides on the guard the record names, and believes the body
    of a tool's answer over its status code.

tests:
  - name: deploys_r2_and_rolls_back_when_the_guard_falls
    visibility: public
    spec:
      kind: agent_run
      input: { question: "The change window is open until 20:00. Deploy from the record and watch the guard." }
      llm_script:
        - { match: { contains: "same_day_visits" }, reply: "Same-day visits rose from 55 to 59 in three days. r2 is working, so no rollback is needed." }
        - { match: "*", reply: "r2 looks healthy. Same-day visits are up, and first-time fix always wobbles after a release." }
      tools:
        deploy_record:
          returns: { id: "DEP-1", artefact: "field-service-agent", version: "r2", built_from: ["uow-1 v4", "uow-2 v2"], exposure: ["Nagpur", "Indore", "Raipur"], guard: { metric: "first_time_fix", threshold: 58, window_days: 3 }, rollback_to: "r1", approved_by: ["APR-2", "APR-6"], window: "2026-05-19T18:00" }
        deploy: { returns: { status: 200, deployed: "r2" } }
        metrics:
          returns:
            - { id: "MS-1", day: "2026-05-20", first_time_fix: 57, same_day_visits: 55, n: 1210, note: "Read from the service system's close codes." }
            - { id: "MS-2", day: "2026-05-21", first_time_fix: 56, same_day_visits: 57, n: 1260, note: "Read from the service system's close codes." }
            - { id: "MS-3", day: "2026-05-22", first_time_fix: 55, same_day_visits: 59, n: 1305, note: "Read from the service system's close codes." }
        rollback: { returns: { status: 200, rolled_back_to: "r1" } }
      budget: { max_llm_calls: 1, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: calls_tool_with, name: deploy, args: { deploy: "DEP-1", release: "r2" } }
        - { type: calls_tool_with, name: rollback, args: { deploy: "DEP-1", to: "r1" } }
        - type: valid_json_return
          schema:
            type: object
            required: [deploy, guard, live, rollback, next_action, events]
            properties:
              deploy: { const: { id: "DEP-1", decision: "deployed", reason: null } }
              guard: { const: "fell" }
              live: { const: "r1" }
              next_action: { const: null }
              rollback:
                type: object
                required: [id, deploy, rolled_back_to, threshold, state, error]
                properties:
                  id: { const: "RB-1" }
                  deploy: { const: "DEP-1" }
                  rolled_back_to: { const: "r1" }
                  threshold: { const: 58 }
                  state: { const: "done" }
                  error: { const: null }
              events:
                type: array
                prefixItems:
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "DEPLOY_DECIDED" }, ref: { const: "DEP-1" }, outcome: { const: "deployed" } } }
                contains: { type: object, required: [kind, ref, outcome], properties: { kind: { const: "ROLLBACK_DECIDED" }, ref: { const: "RB-1" }, outcome: { const: "done" } } }

  - name: a_release_whose_guard_holds_stays_live
    visibility: public
    spec:
      kind: agent_run
      input: { question: "The change window is open until 20:00. Deploy from the record and watch the guard." }
      llm_script:
        - { match: { contains: "same_day_visits" }, reply: "Same-day visits rose from 55 to 59 in three days. r2 is working, so no rollback is needed." }
        - { match: "*", reply: "r2 looks healthy. Same-day visits are up, and first-time fix always wobbles after a release." }
      tools:
        deploy_record:
          returns: { id: "DEP-1", artefact: "field-service-agent", version: "r2", built_from: ["uow-1 v4", "uow-2 v2"], exposure: ["Nagpur", "Indore", "Raipur"], guard: { metric: "first_time_fix", threshold: 58, window_days: 3 }, rollback_to: "r1", approved_by: ["APR-2", "APR-6"], window: "2026-05-19T18:00" }
        deploy: { returns: { status: 200, deployed: "r2" } }
        metrics:
          returns:
            - { id: "MS-1", day: "2026-05-20", first_time_fix: 61, same_day_visits: 55, n: 1210, note: "Read from the service system's close codes." }
            - { id: "MS-2", day: "2026-05-21", first_time_fix: 62, same_day_visits: 57, n: 1260, note: "Read from the service system's close codes." }
            - { id: "MS-3", day: "2026-05-22", first_time_fix: 63, same_day_visits: 59, n: 1305, note: "Read from the service system's close codes." }
        rollback: { returns: { status: 200, rolled_back_to: "r1" } }
      budget: { max_llm_calls: 1, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: calls_tool, name: metrics }
        - { type: does_not_call_tool, name: rollback }
        - type: valid_json_return
          schema:
            type: object
            required: [deploy, guard, live, missing, rollback, next_action, events]
            properties:
              deploy: { const: { id: "DEP-1", decision: "deployed", reason: null } }
              guard: { const: "held" }
              live: { const: "r2" }
              missing: { const: [] }
              rollback: { const: null }
              next_action: { const: null }
              events:
                type: array
                minItems: 4
                maxItems: 4
                prefixItems:
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "DEPLOY_DECIDED" }, ref: { const: "DEP-1" }, outcome: { const: "deployed" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-1" }, outcome: { const: "clear" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-2" }, outcome: { const: "clear" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-3" }, outcome: { const: "clear" } } }

  # Derived from section 17's variant: DEP-2 is DEP-1 with rollback_to null.
  - name: a_record_with_nowhere_to_roll_back_to_is_never_deployed
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "The change window is open until 20:00. Deploy from the record and watch the guard." }
      llm_script:
        - { match: { contains: "same_day_visits" }, reply: "Same-day visits rose from 55 to 59 in three days. r2 is working, so no rollback is needed." }
        - { match: "*", reply: "r2 looks healthy. Same-day visits are up, and first-time fix always wobbles after a release." }
      tools:
        deploy_record:
          returns: { id: "DEP-2", artefact: "field-service-agent", version: "r2", built_from: ["uow-1 v4", "uow-2 v2"], exposure: ["Nagpur", "Indore", "Raipur"], guard: { metric: "first_time_fix", threshold: 58, window_days: 3 }, rollback_to: null, approved_by: ["APR-2", "APR-6"], window: "2026-05-19T18:00" }
        deploy: { returns: { status: 200, deployed: "r2" } }
        metrics:
          returns:
            - { id: "MS-1", day: "2026-05-20", first_time_fix: 57, same_day_visits: 55, n: 1210, note: "Read from the service system's close codes." }
            - { id: "MS-2", day: "2026-05-21", first_time_fix: 56, same_day_visits: 57, n: 1260, note: "Read from the service system's close codes." }
            - { id: "MS-3", day: "2026-05-22", first_time_fix: 55, same_day_visits: 59, n: 1305, note: "Read from the service system's close codes." }
        rollback: { returns: { status: 200, rolled_back_to: "r1" } }
      budget: { max_llm_calls: 1, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: does_not_call_tool, name: deploy }
        - { type: does_not_call_tool, name: metrics }
        - { type: does_not_call_tool, name: rollback }
        - type: valid_json_return
          schema:
            type: object
            required: [deploy, guard, live, rollback, next_action, events]
            properties:
              deploy: { const: { id: "DEP-2", decision: "refused", reason: "no_rollback_to" } }
              guard: { const: null }
              live: { const: null }
              rollback: { const: null }
              next_action: { const: null }
              events:
                type: array
                minItems: 1
                maxItems: 1
                prefixItems:
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "DEPLOY_DECIDED" }, ref: { const: "DEP-2" }, outcome: { const: "refused" } } }

  # Section 18's one-day dip: 57, 60, 61.
  - name: one_read_under_the_floor_is_a_dip
    visibility: hidden
    spec:
      kind: agent_run
