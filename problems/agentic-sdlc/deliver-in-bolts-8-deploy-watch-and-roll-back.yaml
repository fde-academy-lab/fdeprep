  # Section 18's soft error on the rollback, with the body it gives.
  - name: adversarial_the_rollback_answers_200_with_an_error
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      The guard fell on 57, 56 and 55, and the rollback answered
      `{"status": 200, "error": "artefact checksum mismatch for r1"}`. The
      status says the request arrived. The body says r1 never went back on,
      so r2 is still booking technicians in three centres.

      An operator that reads the status records RB-1 as done and r1 as live.
      The retrospective then explains a rollback that never happened, and
      nobody pages the platform team on a Friday evening. The answer has no
      `rolled_back_to` naming r1 and it carries an `error`, so the rollback
      failed: `live` stays r2, the error is kept as it came, and
      `next_action` names the person who can act. Calling `rollback` again
      in a loop would send the same mismatched artefact back to the same
      centres.
    spec:
      kind: agent_run
      input: { question: "The change window is open until 20:00. Deploy from the record and watch the guard." }
      llm_script:
        - { match: { contains: "same_day_visits" }, reply: "Same-day visits rose from 55 to 59 in three days. r2 is working, so no rollback is needed." }
        - { match: "*", reply: "r2 looks healthy. Same-day visits are up, and first-time fix always wobbles after a release." }
      tools:
        deploy_record:
          returns: { id: "DEP-1", artefact: "field-service-agent", version: "r2", built_from: ["uow-1 v4", "uow-2 v2"], exposure: ["Nagpur", "Indore", "Raipur"], guard: { metric: "first_time_fix", threshold: 58, window_days: 3 }, rollback_to: "r1", approved_by: ["APR-2", "APR-6"], window: "2026-05-19T18:00" }
        deploy: { returns: { status: 200, deployed: "r2" } }
        metrics:
          returns:
            - { id: "MS-1", day: "2026-05-20", first_time_fix: 57, same_day_visits: 55, n: 1210, note: "Read from the service system's close codes." }
            - { id: "MS-2", day: "2026-05-21", first_time_fix: 56, same_day_visits: 57, n: 1260, note: "Read from the service system's close codes." }
            - { id: "MS-3", day: "2026-05-22", first_time_fix: 55, same_day_visits: 59, n: 1305, note: "Read from the service system's close codes." }
        rollback:
          fixture: tool_soft_error
          params: { status: 200, body: { error: "artefact checksum mismatch for r1" } }
      budget: { max_llm_calls: 1, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: tool_calls_at_most, value: 4 }
        - { type: returns_lacks, value: '"live":\s*"r1"' }
        - type: valid_json_return
          schema:
            type: object
            required: [guard, live, rollback, next_action, events]
            properties:
              guard: { const: "fell" }
              live: { const: "r2" }
              next_action: { const: "page the platform team lead" }
              rollback:
                type: object
                required: [rolled_back_to, triggered_by, reads, state, error]
                properties:
                  rolled_back_to: { const: null }
                  triggered_by: { const: ["MS-1", "MS-2", "MS-3"] }
                  reads: { const: [57, 56, 55] }
                  state: { const: "failed" }
                  error: { const: "artefact checksum mismatch for r1" }
              events:
                type: array
                minItems: 5
                maxItems: 5
                prefixItems:
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "DEPLOY_DECIDED" }, ref: { const: "DEP-1" }, outcome: { const: "deployed" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-1" }, outcome: { const: "under" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-2" }, outcome: { const: "under" } } }
                  - { type: object, required: [kind, ref, outcome], properties: { kind: { const: "SAMPLE_READ" }, ref: { const: "MS-3" }, outcome: { const: "under" } } }
