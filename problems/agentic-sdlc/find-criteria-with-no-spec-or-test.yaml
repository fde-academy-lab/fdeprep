              - { id: "AC-2", text: "An invitation expires after seven days." }
              - { id: "AC-3", text: "A teammate who accepts joins with the role the admin chose." }
              - { id: "AC-4", text: "An admin can cancel an invitation nobody has accepted." }
            sections:
              - { id: "S-1", covers: ["AC-1", "AC-2"] }
              - { id: "S-2", covers: ["AC-2", "AC-3"] }
              - { id: "S-3", covers: ["AC-4"] }
            tests:
              - { id: "T-1", criteria: ["AC-1"] }
              - { id: "T-2", criteria: ["AC-3"] }
              - { id: "T-3", criteria: ["AC-4"] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [criteria, unknown_refs, complete]
            properties:
              criteria:
                const:
                  - { id: "AC-1", sections: ["S-1"], tests: ["T-1"], gaps: [] }
                  - { id: "AC-2", sections: ["S-1", "S-2"], tests: [], gaps: ["no_test"] }
                  - { id: "AC-3", sections: ["S-2"], tests: ["T-2"], gaps: [] }
                  - { id: "AC-4", sections: ["S-3"], tests: ["T-3"], gaps: [] }
              complete: { const: false }

  - name: one_test_can_cover_two_criteria
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Check the order export spec before build." }
      llm_script:
        - { match: "*", reply: "Every criterion is covered. Thirty-one tests is plenty." }
      tools:
        spec:
          returns:
            criteria:
              - { id: "AC-1", text: "Finance can export a month of orders as a spreadsheet." }
              - { id: "AC-2", text: "The export shows the GST on each order." }
              - { id: "AC-3", text: "An export of more than 50,000 orders arrives by email." }
            sections:
              - { id: "S-1", covers: ["AC-1", "AC-2"] }
              - { id: "S-2", covers: ["AC-3"] }
            tests:
              - { id: "T-1", criteria: ["AC-2", "AC-3"] }
              - { id: "T-2", criteria: ["AC-1"] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [criteria, unknown_refs, complete]
            properties:
              criteria:
                const:
                  - { id: "AC-1", sections: ["S-1"], tests: ["T-2"], gaps: [] }
                  - { id: "AC-2", sections: ["S-1"], tests: ["T-1"], gaps: [] }
                  - { id: "AC-3", sections: ["S-2"], tests: ["T-1"], gaps: [] }
              unknown_refs: { const: [] }
              complete: { const: true }

  - name: a_repeated_criterion_id_is_flagged_on_both_entries
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Check the store credit spec before build." }
      llm_script:
        - { match: "*", reply: "Every criterion is covered. Thirty-one tests is plenty." }
      tools:
        spec:
          returns:
            criteria:
              - { id: "AC-1", text: "A refund can be paid as store credit." }
              - { id: "AC-2", text: "Store credit never expires." }
              - { id: "AC-3", text: "Store credit can pay for part of an order." }
              - { id: "AC-3", text: "A customer sees their store credit balance at checkout." }
              - { id: "AC-4", text: "Support can add store credit, with a reason." }
            sections:
              - { id: "S-1", covers: ["AC-1", "AC-2"] }
              - { id: "S-2", covers: ["AC-3"] }
              - { id: "S-3", covers: ["AC-4"] }
            tests:
              - { id: "T-1", criteria: ["AC-1"] }
              - { id: "T-2", criteria: ["AC-2"] }
              - { id: "T-3", criteria: ["AC-3"] }
              - { id: "T-4", criteria: ["AC-4"] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [criteria, unknown_refs, complete]
            properties:
              criteria:
                const:
                  - { id: "AC-1", sections: ["S-1"], tests: ["T-1"], gaps: [] }
                  - { id: "AC-2", sections: ["S-1"], tests: ["T-2"], gaps: [] }
                  - { id: "AC-3", sections: ["S-2"], tests: ["T-3"], gaps: ["duplicate_id"] }
                  - { id: "AC-3", sections: ["S-2"], tests: ["T-3"], gaps: ["duplicate_id"] }
                  - { id: "AC-4", sections: ["S-3"], tests: ["T-4"], gaps: [] }
              complete: { const: false }

  - name: adversarial_a_reference_to_a_missing_criterion_fills_no_gap
    visibility: adversarial
    fixture: tool_lies
    annotation_md: |
      `T-7` names `AC-61`, which is no criterion, and `AC-6` has a section and
      no test. A trace that matches ids as text finds `AC-6` inside `AC-61`
      and gives `T-7` to `AC-6`, which closes the one gap that mattered: the
      second approver for refunds over ₹10,000 goes to build with no test
      behind it. A trace built from one set of every id mentioned anywhere
      marks `AC-6` covered because its section named it.

      Compared as whole ids, `AC-61` matches nothing. It goes to
      `unknown_refs` for someone to fix, `AC-6` keeps its `no_test` gap, and
      the spec is not complete.
    spec:
      kind: agent_run
      input: { question: "Check the refunds spec again before build." }
      llm_script:
        - { match: "*", reply: "Every criterion is covered. Thirty-one tests is plenty." }
      tools:
        spec:
          returns:
            criteria:
              - { id: "AC-1", text: "A customer can ask for a refund from the invoice page." }
              - { id: "AC-2", text: "The refund request records the reason the customer gives." }
              - { id: "AC-3", text: "Finance sees every open refund request in one queue." }
              - { id: "AC-4", text: "An approved refund goes back to the original payment method." }
              - { id: "AC-5", text: "The customer gets an email when the refund is paid." }
              - { id: "AC-6", text: "A refund over ₹10,000 needs a second approver." }
            sections:
              - { id: "S-1", covers: ["AC-1", "AC-2"] }
              - { id: "S-2", covers: ["AC-3"] }
              - { id: "S-3", covers: ["AC-4"] }
              - { id: "S-4", covers: ["AC-5"] }
              - { id: "S-5", covers: ["AC-6"] }
            tests:
              - { id: "T-1", criteria: ["AC-1"] }
              - { id: "T-2", criteria: ["AC-2"] }
              - { id: "T-3", criteria: ["AC-3"] }
              - { id: "T-4", criteria: ["AC-4"] }
              - { id: "T-5", criteria: ["AC-5"] }
              - { id: "T-6", criteria: ["AC-2"] }
              - { id: "T-7", criteria: ["AC-61"] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [criteria, unknown_refs, complete]
            properties:
              unknown_refs: { const: [{ from: "T-7", id: "AC-61" }] }
              complete: { const: false }
        - type: valid_json_return
          schema:
            type: object
            properties:
              criteria:
                const:
                  - { id: "AC-1", sections: ["S-1"], tests: ["T-1"], gaps: [] }
                  - { id: "AC-2", sections: ["S-1"], tests: ["T-2", "T-6"], gaps: [] }
                  - { id: "AC-3", sections: ["S-2"], tests: ["T-3"], gaps: [] }
                  - { id: "AC-4", sections: ["S-3"], tests: ["T-4"], gaps: [] }
                  - { id: "AC-5", sections: ["S-4"], tests: ["T-5"], gaps: [] }
                  - { id: "AC-6", sections: ["S-5"], tests: [], gaps: ["no_test"] }

  - name: adversarial_a_reference_in_the_wrong_case_is_unknown
    visibility: adversarial
    fixture: tool_lies
    annotation_md: |
      `T-6` names `ac-6`. The checker could guess it meant `AC-6`, and the
      guess would be right here and wrong the day a spec imported from
      another tool holds both. A trace that lowercases or strips ids before
      comparing them makes that guess on every spec, and the second approver
      goes to build on a test that names nothing.

      Compared character for character, `ac-6` is no criterion's id. It goes
      to `unknown_refs`, `AC-6` keeps its `no_test` gap, and someone fixes
      the test.
    spec:
      kind: agent_run
      input: { question: "Check the refunds spec a third time before build." }
      llm_script:
        - { match: "*", reply: "Every criterion is covered. Thirty-one tests is plenty." }
      tools:
        spec:
          returns:
            criteria:
              - { id: "AC-4", text: "An approved refund goes back to the original payment method." }
              - { id: "AC-5", text: "The customer gets an email when the refund is paid." }
              - { id: "AC-6", text: "A refund over ₹10,000 needs a second approver." }
            sections:
              - { id: "S-3", covers: ["AC-4"] }
              - { id: "S-4", covers: ["AC-5"] }
              - { id: "S-5", covers: ["AC-6"] }
            tests:
              - { id: "T-4", criteria: ["AC-4"] }
              - { id: "T-5", criteria: ["AC-5"] }
              - { id: "T-6", criteria: ["ac-6"] }
      budget: { max_llm_calls: 1, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [criteria, unknown_refs, complete]
            properties:
              unknown_refs: { const: [{ from: "T-6", id: "ac-6" }] }
              complete: { const: false }
        - type: valid_json_return
          schema:
            type: object
            properties:
              criteria:
                const:
                  - { id: "AC-4", sections: ["S-3"], tests: ["T-4"], gaps: [] }
                  - { id: "AC-5", sections: ["S-4"], tests: ["T-5"], gaps: [] }
                  - { id: "AC-6", sections: ["S-5"], tests: [], gaps: ["no_test"] }

reference_md: |
  BMAD's spec skill writes a short contract for the build to read. In
  bmad-method 6.12.1, published on 4 October 2026, its template gives every
  capability a stable id, `CAP-1` and on, and a success condition that is
  "Something a test or a real demonstration can decide". The docs page
  [Define Requirements and a Specification](https://docs.bmad-method.org/plan/define-requirements-and-a-specification/),
  read on 8 October 2026, adds that "Each story cites the spec's capability
  IDs". Ids that stay put and get cited downstream are what make a trace
  possible. Checking the trace is still the team's job, because the same page
  says the spec "does not help you figure out what you want".

  A count says how much was written. Nine sections and 31 tests sounded
  thorough, and AC-6 sat outside all of them. A trace asks two things of each
  criterion: which section says it will be built, and which test will show
  it was. Those are separate facts from separate lists, so one set of every
  id mentioned anywhere cannot hold them. A criterion named by two sections
  and no test is in that set, and nobody has said how anyone will know it
  works.

  A reference to a criterion that does not exist is a mistake somebody has to
  fix, and it covers nothing. AC-61 was most likely meant for AC-6, and a
  trace that matches ids as fragments of text treats it that way, which
  closes the one gap that mattered. Comparing whole ids keeps the mistake in
  `unknown_refs`, and `complete` stays false until someone looks.

  Two criteria with one id are the same problem seen from the other side.
  Every reference to that id is ambiguous, so both entries stay in the report
  and both are flagged. Merging them would drop one of the two criteria from
  the report without a word.

  The criteria ids, the gap names and the rule for `complete` are this
  problem's own construction. BMAD gives the spec's capabilities their ids,
  and a team that traces a client's criteria to the spec agrees its own
  format with the client.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Before the team starts building from a spec, how would you check that it covers every acceptance criterion, and what would make you stop the build?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: spec
    args: ""
    returns: "The `criteria`, each with an `id` and `text`, the `sections`, each with the ids it `covers`, and the `tests`, each with its `criteria`."
example:
  case: traces_a_spec_that_covers_every_criterion
  expect: Every criterion has a section and a test, so each entry lists them with no gaps, nothing is unknown, and `complete` is true. `AC-1` has two tests, `T-1` and `T-5`.
traps:
  - Marking a criterion covered when any section or test mentions it, so one with no test passes.
  - Counting a reference to a criterion that does not exist, or letting it fill another criterion's gap.
  - Keeping one entry per id, so two criteria that share an id read as one.
