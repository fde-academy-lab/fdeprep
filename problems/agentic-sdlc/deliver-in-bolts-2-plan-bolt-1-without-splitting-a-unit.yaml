reference_md: |
  ADR-1 fixed this engagement's bolt at two working days, 16 hours, with a
  human review after every unit. AWS's post on AI-DLC (Raja SP, 31 July 2025,
  read 8 October 2026) describes bolts as work cycles "measured in hours or
  days rather than weeks" and gives them no size and no packing rule, so the
  16 hours, the review hour and every rule here are this engagement's own.

  A null estimate means nobody knows how long the unit takes. Counted as
  zero, it fits any bolt, and the plan's spare hours become a claim nobody
  can back. The agent's draft showed 2 hours spare with slot booking inside
  it, so the bolt would have looked on time until slot booking turned out to
  need more than two hours. Sent to elaboration, the unit gets an estimate
  before it gets a place in a bolt: mob elaboration on 13 May sized UoW-3 at
  5 hours, and it goes into bolt 2.

  A unit that waits on an unsized unit waits too. Customer messaging and the
  partner dashboard act on bookings that slot booking makes, so neither can
  be finished in a bolt that does not hold it. Ready means every dependency
  is already in this bolt, which is why the planner looks again from the
  first unit after each one it plans: planning UoW-2 makes the technician
  brief ready, and it comes before UoW-8 in id order.

  The review sits inside the bolt because a unit is finished when its review
  passes. Leave the hour out and slot booking at 5 hours appears to fit after
  UoW-1 and UoW-2, in a bolt that then needs 19 hours.

  Units stay whole because a review checks a unit. Pack units of work into
  bolts, another problem in this chapter, splits a unit bigger than a bolt
  task by task. This team never splits one, so a unit that does not fit
  waits whole for the next bolt, and the planner moves on to the next ready
  unit.

  The aidlc-workflows guide (release 2.11.0, read 8 October 2026) makes
  Delivery Planning Inception stage 2.9, marked ALWAYS, with `bolt-plan.md`
  among its outputs. BOLT-1 is that plan for this engagement: UoW-1 and
  UoW-2, 13 hours with their reviews, 3 spare, four units carried and UoW-3
  in elaboration. The next stages build from it.

