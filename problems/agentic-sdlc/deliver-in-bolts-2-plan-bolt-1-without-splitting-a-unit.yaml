tools:
  - name: units
    args: ""
    returns: "The accepted units in id order, each with its `id`, `unit`, `estimate_h` (`null` when unsized) and `depends_on`."
  - name: bolt
    args: ""
    returns: "The bolt's `id`, its `hours`, and `review_h`, the hours each unit's review takes inside it."
example:
  case: plans_bolt_1_with_every_unit_estimated
  expect: >-
    UoW-1 and UoW-2 take 13 of the 16 hours with their reviews. Slot booking
    needs 6 with its review and 3 are left, so it is carried, and so are the
    units that wait on it.
traps:
  - Counting a unit with no estimate as zero hours, so it fits any bolt.
  - Treating a unit as ready when something it depends on has no estimate or was carried.
  - Leaving the review hour outside the bolt, or turning away a unit that fills the bolt exactly.
