reference_md: |
  The old rule asked one question, how much does this cost, and it is a fair
  question for deciding how much attention an action deserves. It is the
  wrong first question for deciding when that attention has to arrive. A
  person can only act on what they see, and what they can do about an action
  that has already run depends on whether it can be undone.

  That is what the three placements mean. In the loop, a person approves
  before anything happens. On the loop, the action runs and a person sees it
  soon after, which is cheap and keeps the agent fast, and is worth exactly
  as much as that person's ability to reverse it. Out of the loop, nobody
  looks, which is right for small things that can be put back.

  So the order of the checks is the lesson. An action nobody can undo goes in
  the loop whatever it costs: a notice that cost nothing to send, or a deposit
  under the approval line, would otherwise run first and be shown to someone
  who can only read about it. A tool the policy has never classified goes in
  the loop too, because nobody has yet said that it can be undone, and the
  first time an agent uses it is the worst time to find out. Only an action
  that can be reversed meets the cost lines, and there the cost decides how
  soon a person needs to see it.

  The lines and the table belong to the operations team, so the code reads
  them on every run. A line written into the code is the policy as it was on
  the day somebody copied it.

  The same split appears in OWASP's Top 10 for LLM Applications 2025 under
  LLM06, Excessive Agency, whose mitigations include requiring a person to
  approve high-impact actions before they are taken. The policy table is how
  "high-impact" becomes something code can check.

  An `in` placement ends this run with an approval request in a queue and the
  tool uncalled. What the rest of the run does while that request waits, and
  what the person who opens it needs to see, are two later problems in this
  chapter.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Your agent can book repairs, credit rent and send legal notices. Which of those would you let it do with nobody watching, and how do you decide?
  source: |
    Author judgement, informed by OWASP Top 10 for LLM Applications 2025,
    LLM06 Excessive Agency, mitigation 6, "Require user approval", read on
    1 October 2026. No employer frequency data stands behind it.

tools:
  - name: proposals
    args: ''
    returns: A status, the `ticket` and its proposed `actions`, each with an `id`, a `tool`, its `args` and
      a `cost` in rupees.
  - name: policy
    args: ''
    returns: 'A status, the two cost lines `watch_above` and `approve_above`, and `reversible`: for each
      tool it classifies, whether it can be undone.'
  - name: reschedule_visit
    args: flat, day
    returns: A status and `rescheduled` set to true.
  - name: book_repair
    args: flat, trade
    returns: A status and `booked` set to true.
  - name: issue_credit
    args: flat, amount
    returns: A status and `credited` set to true.
  - name: release_deposit
    args: flat, amount
    returns: A status and `released` set to true. Money that has left cannot be called back.
  - name: send_notice
    args: flat, kind
    returns: A status and `sent` set to true. A sent notice cannot be unsent.
  - name: notify
    args: action
    returns: A status and `notified` set to true, once the duty manager can see the action and undo it.
  - name: ask_approval
    args: action
    returns: A status of 202 and `queued` set to true. A person decides later, outside this run.
example:
  case: places_and_acts_on_a_mixed_plan
  expect: Reschedule the visit on its own, book the 4,500 rupee repair and call `notify` for it, and ask
    approval for the deposit without releasing it, returning `a1` out, `a2` on and `a3` in.
traps:
  - Placing an action by its cost alone, so one that costs nothing and cannot be undone runs with nobody
    watching.
  - Putting an action that cannot be undone on the loop, where a person only learns of it after it has
    happened.
  - Treating a tool the policy has never classified as safe to run, when nobody has said it can be undone.
  - Writing the policy's lines into the code, so a line the operations team moved this morning is not
    the one applied.
