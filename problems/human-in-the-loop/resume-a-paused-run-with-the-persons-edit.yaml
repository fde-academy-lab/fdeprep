  - name: a_check_that_ran_before_the_pause_is_not_requested_again
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "RUN-5575" }
      llm_script:
        - { match: { regex: 'Ran: schedule_onboarding' },
