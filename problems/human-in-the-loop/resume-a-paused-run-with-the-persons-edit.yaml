              - { step: 2, tool: request_background_check, args: { candidate: "C-7798" } }
            paused: { step: 3, tool: issue_offer, args: { candidate: "C-7798", salary: 960000, start: "2026-11-30" } }
            decision: { step: 3, type: approve, by: "Meera Iyer" }
        create_candidate: { returns: { status: 200, candidate: "C-7798" } }
        request_background_check: { returns: { status: 200, check: "BG-147" } }
        issue_offer: { returns: { status: 200, offer: "OF-2335" } }
        send_offer_email: { returns: { status: 200, sent: true } }
