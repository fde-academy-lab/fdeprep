              args: { candidate: "C-7770", salary: 1650000, start: "2026-11-02" }
        create_candidate: { returns: { status: 200, candidate: "C-7770" } }
        request_background_check: { returns: { status: 200, check: "BG-136" } }
        issue_offer: { returns: { status: 200, offer: "OF-2316" } }
        send_offer_email: { returns: { status: 200, sent: true } }
