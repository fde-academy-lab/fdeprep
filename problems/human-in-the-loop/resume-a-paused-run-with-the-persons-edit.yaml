            reply: 'Step: {"tool": "send_offer_email", "args": {"to": "divya.nair@example.com", "body": "Dear Divya, we are delighted to offer you the operations analyst role at ₹9,60,000 a year, starting on 30 November 2026."}}' }
        - { match: { regex: 'Ran: issue_offer' },
            reply: 'Step: {"tool": "request_background_check", "args": {"candidate": "C-7798"}}' }
        - { match: { regex: 'Ran: request_background_check' },
            reply: 'Step: {"tool": "issue_offer", "args": {"candidate": "C-7798", "salary": 960000, "start": "2026-11-30"}}' }
        - { match: { regex: 'Ran: create_candidate' },
            reply: 'Step: {"tool": "request_background_check", "args": {"candidate": "C-7798"}}' }
        - { match: "*",
            reply: 'Step: {"tool": "create_candidate", "args": {"name": "Divya Nair", "role": "Operations analyst"}}' }
      tools:
