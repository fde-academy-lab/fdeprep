  - name: adversarial_the_model_tries_to_reissue_the_offer
    visibility: adversarial
    fixture: loop_bait
    annotation_md: |
      The recruiter cut the salary and the edited offer went out. On the next
      call the model proposed the offer again at its own figure, because the
      run it remembered was the one it had planned, and a model reading its
      own earlier plan can try to finish it.

      A resume that runs whatever the model proposes issues a second offer
      at the salary the recruiter removed, and since nothing in the record
      says the proposal was turned down, the model proposes it again on every
      call until the budget stops it. The tool already ran in this run, so
      the proposal is refused, the refusal goes into the record, and the
      model moves on to the email with the recruiter's figure in front of it.
    spec:
      kind: agent_run
      input: { question: "RUN-5563" }
      llm_script:
        - { match: { regex: 'Ran: schedule_onboarding' },
            reply: "Done: Offer issued to Karan, emailed, and onboarding booked for 23 November." }
        - { match: { regex: 'Ran: send_offer_email' },
            reply: 'Step: {"tool": "schedule_onboarding", "args": {"candidate": "C-7784", "start": "2026-11-23"}}' }
        - { match: { all: [ { regex: 'Refused: issue_offer' }, { regex: 'Ran: issue_offer\b[^\n]*2250000' } ] },
            reply: 'Step: {"tool": "send_offer_email", "args": {"to": "karan.mehta@example.com", "body": "Dear Karan, we are delighted to offer you the sales manager role at ₹22,50,000 a year, starting on 23 November 2026."}}' }
        - { match: { regex: 'Refused: issue_offer' },
            reply: 'Step: {"tool": "send_offer_email", "args": {"to": "karan.mehta@example.com", "body": "Dear Karan, we are delighted to offer you the sales manager role at ₹24,00,000 a year, starting on 23 November 2026."}}' }
        - { match: { regex: 'Ran: issue_offer' },
            reply: 'Step: {"tool": "issue_offer", "args": {"candidate": "C-7784", "salary": 2400000, "start": "2026-11-23"}}' }
        - { match: { regex: 'Ran: request_background_check' },
            reply: 'Step: {"tool": "issue_offer", "args": {"candidate": "C-7784", "salary": 2400000, "start": "2026-11-23"}}' }
        - { match: { regex: 'Ran: create_candidate' },
            reply: 'Step: {"tool": "request_background_check", "args": {"candidate": "C-7784"}}' }
        - { match: "*",
            reply: 'Step: {"tool": "create_candidate", "args": {"name": "Karan Mehta", "role": "Sales manager"}}' }
      tools:
        checkpoint:
          returns:
            status: 200
            run: "RUN-5563"
            request: "Offer Karan Mehta the sales manager role"
            ran:
              - { step: 1, tool: create_candidate, args: { name: "Karan Mehta", role: "Sales manager" } }
              - { step: 2, tool: request_background_check, args: { candidate: "C-7784" } }
            paused: { step: 3, tool: issue_offer, args: { candidate: "C-7784", salary: 2400000, start: "2026-11-23" } }
            decision:
              step: 3
              type: edit
              by: "Kavya Menon"
              args: { candidate: "C-7784", salary: 2250000, start: "2026-11-23" }
        create_candidate: { returns: { status: 200, candidate: "C-7784" } }
        request_background_check: { returns: { status: 200, check: "BG-140" } }
        issue_offer: { returns: { status: 200, offer: "OF-2322" } }
        send_offer_email: { returns: { status: 200, sent: true } }
        schedule_onboarding: { returns: { status: 200, booked: true } }
      budget: { max_llm_calls: 6, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: tool_calls_at_most, value: 4 }
        - { type: calls_tool_with, name: issue_offer, args: { salary: 2250000 } }
        - { type: calls_tool_with, name: send_offer_email,
            args: { body: "Dear Karan, we are delighted to offer you the sales manager role at ₹22,50,000 a year, starting on 23 November 2026." } }
        - { type: returns_matches, value: '"refused":\s*\[\s*"issue_offer"\s*\]' }

  - name: adversarial_the_checkpoint_comes_back_empty
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The checkpoint store answered with nothing at all. Read loosely, an
      empty checkpoint looks exactly like a run that has done nothing yet:
      no steps ran, nothing is paused, so ask the model where to begin. The
      model begins at the top, creates the candidate a second time and
      requests a second background check, which is the incident from the
      week before.

      A checkpoint you cannot read is not a fresh start. The resume runs
      nothing, asks the model nothing, and hands the run to a person.
    spec:
      kind: agent_run
      input: { question: "RUN-5570" }
      llm_script:
        - { match: { regex: 'Ran: request_background_check' },
            reply: 'Step: {"tool": "issue_offer", "args": {"candidate": "C-7791", "salary": 980000, "start": "2026-11-09"}}' }
        - { match: { regex: 'Ran: create_candidate' },
            reply: 'Step: {"tool": "request_background_check", "args": {"candidate": "C-7791"}}' }
        - { match: "*",
            reply: 'Step: {"tool": "create_candidate", "args": {"name": "Ishaan Gupta", "role": "Field sales executive"}}' }
      tools:
        checkpoint: { fixture: empty_tool_result }
        create_candidate: { returns: { status: 200, candidate: "C-7791" } }
        request_background_check: { returns: { status: 200, check: "BG-144" } }
        issue_offer: { returns: { status: 200, offer: "OF-2329" } }
        send_offer_email: { returns: { status: 200, sent: true } }
        schedule_onboarding: { returns: { status: 200, booked: true } }
      budget: { max_llm_calls: 6, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: does_not_call_tool, name: create_candidate }
        - { type: does_not_call_tool, name: request_background_check }
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: '"outcome":\s*"needs_person"' }

reference_md: |
  Resuming from the checkpoint is the familiar half. The checkpoint says what
  ran, and nothing in it runs again. The same reasoning is why a checkpoint that cannot
  be read sends the run to a person: an empty checkpoint looks exactly like a
  run that has done nothing yet, and treating it as one starts the hire again
  from the top, which is the second background check from the week before.

  The person's decision settles the paused step, and the model is never
  asked what that step should have been. It would answer with the version it
  already chose. After an approve, an edit or a reject, the step belongs to
  the person for the rest of the run, which is also why a proposal to run
  that tool again is refused rather than judged. The resume cannot tell a
  harmless duplicate from the model finishing the plan it remembers without
  saying so, and the second is the model undoing a person's change.

  The incident lived in the record. The model plans from what it reads, and
  the checkpoint held the offer as the model proposed it. Running the edited
  offer while leaving the proposal in the record left the action and the
  account of it disagreeing, and every step the model wrote afterwards
  followed the account. The fix is to write each step into the record as it
  actually ran, with a line for what a person rejected and why, so the model
  writes the email from the salary that went out.

  The same two traps sit in LangGraph's own primitives, which is worth
  knowing before an interview asks. The docstring of `interrupt()` in langgraph
  1.2.12 says the graph resumes from the start of the node, re-executing all
  of its logic, so a side effect placed before the interrupt in that node
  runs again on every resume. Its `add_messages` reducer appends a message
  unless one with the same id is already in the state, so an edited tool call
  added as a new message leaves the model's original call in the history it
  reads. Replacing the original message by its id is the LangGraph form of
  writing the step as it ran.

  Two checks come before anything runs. A pause lands at the next step
  boundary, so a person can be looking at a step that finished while they
  typed. An edit for a step that already ran cannot be applied by running
  that step again, which would issue a second offer, and dropping it without
  a word would send the first offer's email under the recruiter's name. It goes to a
  person, and so does a decision of any other shape.

complexity: C2

interview_evidence:
  round: both
  asked_as: |
    A person pauses your agent, edits the next step and resumes. How do you make sure the agent keeps their change and repeats nothing?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: checkpoint
    args: run
    returns: 'The saved run: its `request`, the steps that `ran`, the `paused` step and the person''s `decision`
      on it.'
  - name: create_candidate
    args: name, role
    returns: '`{"status": 200, "candidate": <id>}`.'
  - name: request_background_check
    args: candidate
    returns: '`{"status": 200, "check": <id>}`. Each check costs ₹1,200 and asks the candidate for consent.'
  - name: issue_offer
    args: candidate, salary, start
    returns: '`{"status": 200, "offer": <id>}`. An issued offer binds the client.'
  - name: send_offer_email
    args: to, body
    returns: '`{"status": 200, "sent": true}`. An email cannot be unsent.'
  - name: schedule_onboarding
    args: candidate, start
    returns: '`{"status": 200, "booked": true}`.'
example:
  case: resumes_after_an_approval
  expect: The recruiter approved the offer as proposed, so issue it once with the checkpoint's arguments,
    let the model carry on with the email and onboarding, and return `outcome` completed.
traps:
  - Writing the model's first proposal into the record the model reads, so later steps quote a figure the
    person changed.
  - Running the paused step as proposed when the person rejected it, because a rejection has no arguments
    to swap in.
  - Reading a blank checkpoint as a run that never began, or applying an edit to whichever step is paused
    when it was made for a step that already ran.
  - Running a tool the model proposes again when it already ran before or after the pause, or refusing it
    with no `Refused:` line for the model to read.
