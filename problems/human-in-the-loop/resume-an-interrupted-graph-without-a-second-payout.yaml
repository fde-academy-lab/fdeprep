slug: resume-an-interrupted-graph-without-a-second-payout
title: "Resume an interrupted graph without a second payout"
day: 21
skill: Pause a graph for a person, resume with their decision, and run nothing twice
artefact_type: code
difficulty: extreme
track: human-in-the-loop
concept:
  topic: "Interrupts"
  question: "When a node resumes from an interrupt, what runs again, and what must not?"
est_minutes: 55
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: state-and-memory, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
call_budget: 5
time_limit_s: 10
allowed_imports: [json, re, typing, langgraph]

brief_md: |
  A payroll provider the size of greytHR runs a corrections agent on
  LangGraph. When an employee's pay comes out wrong, the agent fixes it one
  step at a time. Its model proposes a step, such as a correction payout, the
  bank-file export or the email to the employee, and the graph pauses at an
  `interrupt()` until a payroll manager approves the step, edits it or rejects
  it. On the night before payday the managers settle about 400 of these runs.

  On Tuesday a manager cut a correction payout from ₹48,000 to ₹41,500. The
  payout ran at ₹41,500, and the bank paid it twice, because the bank-file
  export ran twice. In the team's graph the export call sat in the same node
  as the `interrupt()` that asked about the next step, above it. The docstring
  of `interrupt()` in langgraph 1.2.12 says the graph resumes from the start of
  the node, re-executing all of its logic.

  The email the agent sent next told the employee ₹48,000. The history in the
  graph's state, read back afterwards, holds the model's proposal at ₹48,000,
  then the manager's edit at ₹41,500, then the email. The bank is now
  recovering ₹41,500 from the employee's account, and the employee holds an
  email from payroll promising ₹48,000.

  Write the graph and the code that resumes it, so that the manager's decision
  is the one that runs and nothing runs twice.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is JSON naming one corrections run:

      {"run": "PAY-7714", "request": "Ananya Rao (E-2231) was not paid her September arrears."}

  Build the agent as a LangGraph `StateGraph`, compile it with
  `InMemorySaver()`, and run it on the thread
  `{"configurable": {"thread_id": <the run id>}}`.

  The model plans from the record of the run: the request, then one line per
  settled step, oldest first.

      Request: Ananya Rao (E-2231) was not paid her September arrears.
      Ran: payout {"amount": 41500, "employee": "E-2231", "month": "2026-09"}
      Rejected: email {"body": "...", "to": "..."}: <the manager's message>
      Refused: payout: it already ran in this run

  A `Ran:` line carries the arguments the step ran with, as JSON.
  `llm(prompt)` replies with one of:

      Step: {"tool": "export", "args": {"batch": "B-1007"}}
      Done: <one line for the manager>

  Every step pauses before it runs, at

      interrupt({"step": n, "proposal": {"tool": ..., "args": {...}}})

  where `n` counts the steps that have paused in this run, from 1. While the
  graph is paused, `invoke` returns its state with an `__interrupt__` key. Take
  the manager's decision from `tools["decisions"](run=<the run id>)` and resume
  the same thread with `invoke(Command(resume=decision), config)`.

  A decision is `{"run": ..., "step": n, "type": ..., "by": ...}`:

  | `type` | What happens |
  |---|---|
  | `approve` | The step runs as proposed |
  | `edit` | The step runs with the decision's `args`, and the record shows those. The proposal they replace never reaches the model again |
  | `reject` | Nothing runs. Add a `Rejected:` line with the proposal and the decision's `message`, then ask the model again |

  - No side effect sits above an `interrupt()` in its node.
  - The approvals service delivers at least once, so one decision can arrive
    twice. Before you resume, check that the decision is for this run, for the
    step that is paused, and an approve, an edit carrying `args` or a reject.
    When it is not, run nothing more and stop with `needs_person`.
  - A proposed step whose tool already ran in this run is refused without
    pausing: add a `Refused:` line and ask again. A rejected tool may be
    proposed again, and it pauses like any other step.
  - A tool that raises may still have done its work. Never call it again in
    the run: stop with `needs_person`, and say in `summary` which tool raised.
  - At most 5 model calls, re-asks included. A reply that is neither a step nor
    `Done`, or no `Done` within 5 calls, stops the run with `needs_person`.

  Return a JSON string:

      {"outcome": "completed" | "needs_person",
       "ran": [<tools that ran, in order>],
       "refused": [<tools refused, in order>],
       "summary": <the Done text, or why the run stopped>}

  Allowed imports: json, re, typing and langgraph, version 1.2.12.

defence_question: |
  Your driver binds each decision to a run and a step number. One reviewer
  wants every decision to carry a hash of the exact proposal the manager saw,
  so that any change between the pause and the run voids the approval.
  Another wants to keep step numbers, so a manager approves step 3 and the
  agent may still adjust its arguments within policy, such as moving a payout
  to the next bank batch after the 4 pm cut-off. Pick one for a 400-run
  payroll night and say what the other one costs.

stub_code: |
  import json
  import re
  from typing import TypedDict

  from langgraph.checkpoint.memory import InMemorySaver
  from langgraph.graph import END, START, StateGraph
  from langgraph.types import Command, interrupt


  def read_reply(reply: str):
      """{"done": text}, {"tool": name, "args": {...}}, or None for anything else."""
      text = str(reply or "").strip()
      if text.startswith("Done:"):
          return {"done": text[len("Done:"):].strip()}
      if text.startswith("Step:"):
          try:
              step = json.loads(text[len("Step:"):])
          except ValueError:
              return None
          if (isinstance(step, dict) and isinstance(step.get("tool"), str)
                  and isinstance(step.get("args", {}), dict)):
              return {"tool": step["tool"], "args": step.get("args") or {}}
      return None


  def run_agent(question: str, llm, tools: dict) -> str:
      """Run one corrections run as a graph that pauses before every step.

      question is JSON: {"run": "PAY-7714", "request": "..."}. Compile with
      InMemorySaver() and run on {"configurable": {"thread_id": <run id>}}.

      The model reads the record: "Request: ...", then one line per settled step,
          Ran: <tool> <args it ran with, as JSON>
          Rejected: <tool> <proposed args as JSON>: <the manager's message>
          Refused: <tool>: <why>
      and replies Step: {"tool": ..., "args": {...}} or Done: <summary>.

      Every step pauses at interrupt({"step": n, "proposal": {"tool", "args"}}),
      n counting the steps that paused, from 1. invoke returns the state with an
      "__interrupt__" key while paused. Resume the same thread with
      Command(resume=tools["decisions"](run=<run id>)). A decision is
      {"run", "step", "type": "approve" | "edit" | "reject", "by",
       "args" on an edit, "message" on a reject}.

      No side effect sits above an interrupt() in its node. A decision for
      another run, for a step that is not paused, or of another shape stops
      the run with needs_person. A tool that already ran is refused without
      pausing. A tool that raises is never called again, and the run stops
      with needs_person. At most 5 model calls, re-asks included.

      Return json.dumps({"outcome": "completed" | "needs_person",
                         "ran": [...], "refused": [...], "summary": ...}).
      """
      return json.dumps({"outcome": "needs_person", "ran": [], "refused": [],
                         "summary": "not written yet"})

hints:
  - Read the `interrupt()` docstring sentence in the brief again. Then list
    every line of your graph that runs between a resume and the step the
    manager decided on.
  - A model asked the same question twice can answer differently. If the model
    call and the pause share a node, the step that runs after a resume is
    whatever the model said the second time.
  - The checkpoint holds the state as it stood when the node that paused
    began. Whatever that node computed above `interrupt()`, a model reply
    included, is gone on the resume and computed again. Anything the pause
    needs has to be in the state already, written by a node that finished.
  - "Before each resume, compare the decision's `run` and `step` with the run
    id and with the `step` in `result[\"__interrupt__\"][0].value`. When the
    run stops there, `app.get_state(config).values` still holds what ran."
  - An edit settles the step. Write the `Ran:` line with the edited arguments
    and keep the model's proposal out of the record, which only ever holds
    steps that settled.

scenario:
  headline: "A payout ran at ₹41,500 as edited, and the bank paid it twice"
  who: "Payroll operations at a payroll provider the size of greytHR"
  situation: >-
    A manager cut a correction payout from ₹48,000 to ₹41,500 at the graph's
    interrupt. The payout ran as edited, the bank-file export ran twice, and
    the email the agent sent next quoted ₹48,000.
  stakes: >-
    Managers settle about 400 correction runs the night before payday. An
    export that runs twice pays every line in its bank file twice.
  metrics:
    - { label: Payout as edited, value: "₹41,500" }
    - { label: Times the bank paid it, value: "2" }
    - { label: Amount the email quoted, value: "₹48,000" }

diagram:
  title: What a resume runs again, and where the decision is checked
  caption: >-
    A resumed node runs again from its first line, so everything above
    `interrupt()` runs twice. Check each decision before resuming, and record
    what ran.
  direction: lr
  nodes:
    - { id: service, label: Approvals service, sub: delivers each decision at least once, kind: queue, tone: orange, at: [0, 0] }
    - { id: driver, label: "`run_agent`", sub: "checks run and step, then resumes", kind: agent, tone: purple, at: [1, 0] }
    - { id: propose, label: Propose node, sub: asks the model for the next step, kind: model, tone: teal, at: [1, 2] }
    - { id: approve, label: Approve node, sub: "`interrupt()` and nothing above it", kind: guard, tone: pink, at: [2, 1] }
    - { id: act, label: Act node, sub: runs the step as decided, kind: tool, tone: green, at: [3, 1] }
    - { id: record, label: Record the model reads, sub: each step as it ran, kind: doc, tone: neutral, at: [3, 2] }
    - { id: bank, label: Bank file, sub: "pays every line, each time it is sent", kind: service, tone: blue, at: [4, 1] }
  edges:
    - { from: service, to: driver, label: the next decision, step: 1 }
    - { from: driver, to: approve, label: "`Command(resume=...)`", step: 2, tone: success }
    - { from: propose, to: approve, label: the proposal }
    - { from: approve, to: act, label: the decision, step: 3 }
    - { from: act, to: bank, label: one export, step: 4, tone: success }
    - { from: act, to: record, label: what ran and its arguments, tone: success }
    - { from: record, to: propose, label: read before each step }
    - { from: approve, to: bank, label: export above it runs again, tone: danger }

approach:
  goal: Resume with the person's decision in force and nothing run twice
  branches:
    - label: Know what a resume runs again
      detail: The interrupted node starts again from its first line, so every line above the pause runs a second time.
      leaves: [a tool call, a model call, a count kept outside the state]
    - label: Hold each decision up to its step
      leaves: [the same run, the step that is paused, "an approve, an edit or a reject"]
    - label: Keep the record true
      leaves: [each step with the arguments it ran with, a rejection with the manager's message, no proposal an edit replaced]
    - label: Count what costs
      leaves: [every model call, re-asks included, a tool that raised counts as tried]

coach:
  opening: >-
    Before you write a node, list what LangGraph runs again when that node
    resumes, and decide which of those lines may run twice.
  signals:
    - id: model-call-above-interrupt
      when: { code_matches: '(?s)\bllm\((?:(?!\n\s*def ).)*?\binterrupt\(' }
      say: >-
        Your model call sits above `interrupt()` in the same node. When that
        node resumes, LangGraph asks the model again. What runs if the second
        answer is not the step the manager approved?
    - id: no-run-check
      when: { code_lacks: '(\[\s*["'']run["'']\s*\]|get\(\s*["'']run["''][^)]*\))\s*(==|!=|\bin\b)|(==|!=)\s*\w+(\[\s*["'']run["'']\s*\]|\.get\(\s*["'']run["''][^)]*\))' }
      say: >-
        Your code never checks the run a decision was made for. What would it
        do with another run's decision that happens to name the same step?
    - id: no-step-check
      when: { code_lacks: '\[\s*["'']step["'']\s*\]|get\(\s*["'']step["'']' }
      say: >-
        Your code never compares the step a decision names with the step that
        is paused. The approvals service can deliver one decision twice.
    - id: proposal-drift
      when: { test_failed: the_step_that_runs_is_the_one_the_manager_saw }
      say: >-
        In that run the manager approved one payout and a different one ran.
        Where in your graph was the model asked between the pause and the step?
    - id: stale-amount
      when: { test_failed: the_email_quotes_the_amount_the_manager_set }
      say: >-
        The manager edited the payout in that run. Which amount did the record
        your model read carry when it wrote the email?
    - id: second-delivery
      when: { test_failed: a_decision_delivered_twice_runs_nothing_new }
      say: >-
        The first decision arrived a second time while step 2 was paused. What
        did your code do with it?
    - id: rejections-cost
      when: { test_failed: a_reject_costs_a_model_call }
      say: >-
        That run had two rejections. Count the model calls it asked for, and
        check which step number the third proposal got.
    - id: note-as-approval
      when: { test_failed: adversarial_the_managers_note_asks_to_approve_ahead }
      say: >-
        The manager's note asked the agent to approve the next steps. What
        approved the export in your run?
    - id: other-run
      when: { test_failed: adversarial_a_decision_for_another_run }
      say: >-
        The approvals service answered with a decision for step 1 of another
        run. What did your code check before it resumed?
    - id: export-raised
      when: { test_failed: adversarial_the_export_times_out_after_approval }
      say: >-
        The export raised after the manager approved it. Did your run call it
        again, or end without saying which tool failed?
    - id: proposed-again
      when: { test_failed: adversarial_the_model_proposes_the_payout_again }
      say: >-
        After the edited payout ran, the model proposed the payout again at its
        own figure. Did that proposal pause, and what number did the next step get?
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. The first hint asks you to list what runs
        between a resume and the step the manager decided on.
  wrap_up: >-
    A resume starts the paused node from its first line. Keep the pause alone
    in its node, hold every decision up to its run and its step, write each
    step into the record as it ran, and never call again a tool that may
    already have done its work.

tests:
  - name: runs_three_approved_steps
    visibility: public
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7714", "request": "Ananya Rao (E-2231) was not paid her September arrears."}' }
      llm_script:
        - { match: { regex: 'Ran: email' },
            reply: "Done: Paid Ananya ₹41,500 of September arrears in batch B-1007 and emailed her." }
        - { match: { regex: 'Ran: export' },
            reply: 'Step: {"tool": "email", "args": {"to": "ananya.rao@example.com", "body": "Hi Ananya, your September arrears of ₹41,500 reach your account on 8 October."}}' }
        - { match: { regex: 'Ran: payout' },
            reply: 'Step: {"tool": "export", "args": {"batch": "B-1007"}}' }
        - { match: "*",
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-2231", "month": "2026-09", "amount": 41500}}' }
      tools:
        decisions:
          sequence:
            - { run: "PAY-7714", step: 1, type: approve, by: "Kavitha Nair" }
            - { run: "PAY-7714", step: 2, type: approve, by: "Kavitha Nair" }
            - { run: "PAY-7714", step: 3, type: approve, by: "Kavitha Nair" }
        payout: { returns: { status: 200, payout: "PO-55120" } }
        export: { returns: { status: 200, file: "BF-1007-01" } }
        email: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 8, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [outcome, ran, refused, summary]
            properties:
              outcome: { enum: [completed, needs_person] }
              ran: { type: array }
              refused: { type: array }
              summary: { type: string }
        - { type: calls_tool_with, name: payout, args: { employee: "E-2231", month: "2026-09", amount: 41500 } }
        - { type: calls_tool_with, name: export, args: { batch: "B-1007" } }
        - { type: calls_tool, name: email }
        - { type: returns_matches, value: '"ran":\s*\["payout",\s*"export",\s*"email"\]' }
        - { type: returns_matches, value: '"outcome":\s*"completed"' }

  - name: asks_again_after_a_rejection
    visibility: public
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7720", "request": "Rohit Menon (E-3108) says his September overtime was left out."}' }
      llm_script:
        - { match: { regex: 'Ran: payout' },
            reply: "Done: Paid Rohit ₹6,800 for 17 hours of September overtime." }
        - { match: { regex: 'Rejected: payout' },
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-3108", "month": "2026-09", "amount": 6800}}' }
        - { match: "*",
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-3108", "month": "2026-09", "amount": 9200}}' }
      tools:
        decisions:
          sequence:
            - { run: "PAY-7720", step: 1, type: reject, by: "Kavitha Nair",
                message: "He worked 17 hours of overtime, not 23. Pay ₹400 an hour." }
            - { run: "PAY-7720", step: 2, type: approve, by: "Kavitha Nair" }
        payout: { returns: { status: 200, payout: "PO-55134" } }
        export: { returns: { status: 200, file: "BF-1008-01" } }
        email: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 8, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: payout, args: { amount: 6800 } }
        - { type: prompt_contains, value: 'Rejected: payout' }
        - { type: returns_matches, value: '"ran":\s*\["payout"\]' }
        - { type: returns_matches, value: '"outcome":\s*"completed"' }

  - name: runs_the_managers_edit
    visibility: public
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7731", "request": "Imran Qureshi (E-4410) was not paid his September shift allowance."}' }
      llm_script:
        - { match: { regex: 'Ran: payout' },
            reply: "Done: Paid Imran's September shift allowance." }
        - { match: "*",
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-4410", "month": "2026-09", "amount": 5400}}' }
      tools:
        decisions:
          sequence:
            - { run: "PAY-7731", step: 1, type: edit, by: "Suresh Babu",
                args: { employee: "E-4410", month: "2026-09", amount: 3600 } }
        payout: { returns: { status: 200, payout: "PO-55141" } }
        export: { returns: { status: 200, file: "BF-1008-02" } }
        email: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 8, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: payout, args: { employee: "E-4410", amount: 3600 } }
        - { type: returns_matches, value: '"ran":\s*\["payout"\]' }
        - { type: returns_matches, value: '"outcome":\s*"completed"' }

  - name: the_step_that_runs_is_the_one_the_manager_saw
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7746", "request": "Sneha Pillai (E-5127) was paid September at the old rate."}' }
      llm_script:
        - { match: { regex: 'Ran: export' },
            reply: "Done: Paid Sneha the ₹12,600 September difference in batch B-1009." }
        - { match: { regex: 'Ran: payout' },
            reply: 'Step: {"tool": "export", "args": {"batch": "B-1009"}}' }
        - { match: { call_index: 2 },
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-5127", "month": "2026-09", "amount": 21600}}' }
        - { match: "*",
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-5127", "month": "2026-09", "amount": 12600}}' }
      tools:
        decisions:
          sequence:
            - { run: "PAY-7746", step: 1, type: approve, by: "Kavitha Nair" }
            - { run: "PAY-7746", step: 2, type: approve, by: "Kavitha Nair" }
        payout: { returns: { status: 200, payout: "PO-55160" } }
        export: { returns: { status: 200, file: "BF-1009-01" } }
        email: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 8, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: payout, args: { amount: 12600 } }
        - { type: llm_calls_at_most, value: 3 }
        - { type: returns_matches, value: '"ran":\s*\["payout",\s*"export"\]' }
        - { type: returns_matches, value: '"outcome":\s*"completed"' }

  - name: the_email_quotes_the_amount_the_manager_set
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7752", "request": "Farhan Sheikh (E-6032) was not paid his September arrears."}' }
      llm_script:
        - { match: { regex: 'Ran: email' },
            reply: "Done: Paid Farhan's September arrears in batch B-1011 and emailed him." }
        - { match: { all: [ { regex: 'Ran: export' }, { regex: '48000|48,000' } ] },
            reply: 'Step: {"tool": "email", "args": {"to": "farhan.sheikh@example.com", "body": "Hi Farhan, your September arrears of ₹48,000 reach your account on 8 October."}}' }
        - { match: { regex: 'Ran: export' },
            reply: 'Step: {"tool": "email", "args": {"to": "farhan.sheikh@example.com", "body": "Hi Farhan, your September arrears of ₹41,500 reach your account on 8 October."}}' }
        - { match: { regex: 'Ran: payout' },
            reply: 'Step: {"tool": "export", "args": {"batch": "B-1011"}}' }
        - { match: "*",
            reply: 'Step: {"tool": "payout", "args": {"employee": "E-6032", "month": "2026-09", "amount": 48000}}' }
      tools:
        decisions:
          sequence:
            - { run: "PAY-7752", step: 1, type: edit, by: "Kavitha Nair",
                args: { employee: "E-6032", month: "2026-09", amount: 41500 } }
            - { run: "PAY-7752", step: 2, type: approve, by: "Kavitha Nair" }
            - { run: "PAY-7752", step: 3, type: approve, by: "Kavitha Nair" }
        payout: { returns: { status: 200, payout: "PO-55177" } }
        export: { returns: { status: 200, file: "BF-1011-01" } }
        email: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 8, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: payout, args: { amount: 41500 } }
        - { type: calls_tool_with, name: email,
            args: { body: "Hi Farhan, your September arrears of ₹41,500 reach your account on 8 October." } }
        - { type: prompt_contains, value: '"amount":\s*41500' }
        - { type: prompt_lacks, value: '48000|48,000' }
        - { type: tool_calls_at_most, value: 6 }
        - { type: returns_matches, value: '"outcome":\s*"completed"' }

  - name: a_decision_delivered_twice_runs_nothing_new
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"run": "PAY-7763", "request": "Deepa Iyer (E-7215) had her loan deduction taken twice in September."}' }
      llm_script:
        - { match: { regex: 'Ran: export' },
