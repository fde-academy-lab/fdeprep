        - { match: { regex: "^REVISE" }, reply: "Draft: Made for late readers: warm 3000 K for the evening, cool 6500 K for work, 5 brightness levels on just 9 W, and a 1 year warranty." }
        - { match: { regex: "^WRITE" }, reply: "Draft: This 9 W lamp shifts from 3000 K to 6500 K across 5 brightness levels, with a 1 year warranty." }
        - { match: "*", reply: '{"score": 6, "issues": ["Could be more engaging."]}' }
      tools:
        limits: { returns: { max_rounds: 5, pass_score: 8 } }
        policy_check:
          by_arg:
            arg: text
            values:
              "This 9 W lamp shifts from 3000 K to 6500 K across 5 brightness levels, with a 1 year warranty.":
                { status: 200, passed: [under_90_words, sheet_values, no_medical_claim, no_competitor, warranty_stated], failed: [] }
              "For late readers and night-shift desks: a 9 W lamp from 3000 K to 6500 K across 5 brightness levels, with a 1 year warranty.":
                { status: 200, passed: [under_90_words, sheet_values, no_medical_claim, no_competitor, warranty_stated], failed: [] }
              "Made for late readers: warm 3000 K for the evening, cool 6500 K for work, 5 brightness levels on just 9 W, and a 1 year warranty.":
                { status: 200, passed: [under_90_words, sheet_values, no_medical_claim, no_competitor, warranty_stated], failed: [] }
            default: { status: 200, passed: [], failed: [{ rule: sheet_values, detail: "Name every value on the specification sheet." }] }
      budget: { max_llm_calls: 7, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: terminates }
        - type: valid_json_return
          schema:
            type: object
            required: [text, rounds, score, stopped]
