          reply: "Draft: Commute, gym and weekend in one bag: 30 litres of 600D polyester with a 15.6 inch laptop sleeve and a 1 year warranty."
        - { match: { regex: "^REVISE" }, reply: "Draft: Your whole week fits in 30 litres: 600D polyester, a padded 15.6 inch laptop sleeve and a 1 year warranty." }
        - { match: { regex: "^WRITE" }, reply: "Draft: This backpack holds 30 litres in 600D polyester, with a padded 15.6 inch laptop sleeve and a 1 year warranty." }
        - { match: "*", reply: '{"score": 5, "issues": ["Could be more engaging."]}' }
      tools:
        limits: { returns: { max_rounds: 5, pass_score: 8 } }
        policy_check:
          by_arg:
            arg: text
            values:
              "This backpack holds 30 litres in 600D polyester, with a padded 15.6 inch laptop sleeve and a 1 year warranty.":
