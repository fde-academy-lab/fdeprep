        - { type: returns_matches, value: "Made for late readers" }

reference_md: |
  Anthropic's "Building effective agents" (published 19 December 2024,
  read 8 October 2026) calls this pattern evaluator-optimizer: "one LLM
  call generates a response while another provides evaluation and feedback
  in a loop". It says the pattern fits when there are "clear evaluation
  criteria". A listing policy is exactly that, which is why most of it
  belongs in code. A word count, the values on a sheet, a list of
  competitors and a list of medical claims are checks a program makes the
  same way every time. The critic is for what a program cannot judge, such
  as whether a shopper would read past the first line.

  Running the checker on every draft is what catches the writer's
  regressions. A revision is a new draft written to answer the latest
  feedback, and nothing in that feedback says which rules the draft before
  it already met. Draft three's medical claim came back while the writer
  was working on tone, and only a check on every draft could see it. A
  draft that fails a rule never reaches the critic, which saves a call and
  stops a critic that enjoys a comparison with a competitor from scoring
  one.

  A critic that always finds something never says done, so the loop
  decides what done means: a pass, two flat rounds in a row, or the cap.
  The plateau rule reads the best score so far, so a failed draft and a
  failed critique count as flat too. Each spent a call and moved nothing.
  With that rule a listing whose critic never rises stops at six calls
  instead of ten, and a listing whose writer keeps failing the policy stops
  after two drafts with nothing published, for a person to pick up.

  The best draft is kept as the loop runs, because the last draft is only
  the one the loop happened to end on. A tie keeps the earlier draft, so a
  later draft has to earn its place with a higher score.

  A critique counts as a score only when it parses: JSON with a
  whole-number score from 0 to 10. Prose with a 9 in it, or JSON cut off
  halfway, scored nothing. Treating that round as flat keeps the loop going
  on a fresh draft without trusting a number nobody gave as a score, and
  the plateau rule still stops a critic that keeps failing.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    You have a generator and a critic in a loop. How do you stop it, and which output do you ship?
  source: |
    Author judgement. The interview bank's I023, a change that improves the average and hurts a critical slice, is
    the nearest entry, and the bank labels it original interview-style practice with employer frequency unverified.

tools:
  - name: limits
    args: ""
    returns: '`{"max_rounds": 5, "pass_score": 8}` on most listings: the round cap and the score that passes.'
  - name: policy_check
    args: text
    returns: '`{"status": 200, "passed": [<rule>, ...], "failed": [{"rule": ..., "detail": <what to fix>}]}` for one draft.'
example:
  case: a_first_draft_that_passes_ships_in_one_round
  expect: "The first draft fails no rule and the critic scores it 9, so the loop stops after one round with `stopped` as `passed`, having made two model calls."
traps:
  - Checking the policy once, so a revision can bring back a claim that an earlier draft had removed.
  - Publishing the last draft when an earlier one scored higher.
  - Running every listing to the round cap because the critic always asks for more.
  - Reading a critic's reply that is not JSON as a score, or letting it crash the loop.
