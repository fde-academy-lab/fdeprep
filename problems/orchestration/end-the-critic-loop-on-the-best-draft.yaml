  - name: adversarial_a_critique_cut_off_halfway
    visibility: adversarial
    fixture: malformed_on_nth
    annotation_md: |
      The critic's second reply stopped halfway through its JSON, at
      `{"score": 9, "issues": ["Lovely`. A parser with no guard raises and
      the listing goes out with no description. A parser that hunts for a
      number finds the 9 and publishes a draft the critic never finished
      scoring.

      A reply that does not parse scored nothing, so that round is flat,
      and a flat round is never a pass and never the end on its own. The
      next round revises the same draft, the critic answers properly, and
      the third draft passes with a 9.
    spec:
      kind: agent_run
      input: { question: '{"sku": "MP-21126", "specs": {"power": "9 W", "colour_temperature": "3000 K to 6500 K", "brightness_levels": "5", "warranty": "1 year"}}' }
