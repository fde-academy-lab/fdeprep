  - name: adversarial_a_critic_that_always_wants_more
    visibility: adversarial
    fixture: loop_bait
    annotation_md: |
      The critic gave every draft a 5 and asked for it to be "more
      engaging". It never says done, and a loop that waits for it to say
      done runs to the cap on every listing, at ten calls each.

      The plateau rule decides what done means when the critic will not.
      The first draft set the best score, the next two did not raise it,
      and two flat rounds in a row end the loop after six calls with the
      first draft, the one the later drafts never beat.
    spec:
      kind: agent_run
