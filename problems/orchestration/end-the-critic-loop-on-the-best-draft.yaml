                { status: 200, passed: [under_90_words, sheet_values, no_medical_claim, no_competitor, warranty_stated], failed: [] }
            default: { status: 200, passed: [], failed: [{ rule: sheet_values, detail: "Name every value on the specification sheet." }] }
      budget: { max_llm_calls: 7, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
