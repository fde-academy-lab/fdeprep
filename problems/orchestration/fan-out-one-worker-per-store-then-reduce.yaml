        store_report:
          by_arg:
            arg: store
            values:
              S-503: { status: 200, stockouts: 1, wastage_pct: 1.5, till_variance: 0 }
              S-507: { status: 200, stockouts: 4, wastage_pct: 2.2, till_variance: -300 }
              S-512: { status: 200, stockouts: 0, wastage_pct: 0.6, till_variance: 0 }
              S-520: { status: 200, stockouts: 2, wastage_pct: 1.9, till_variance: 120 }
