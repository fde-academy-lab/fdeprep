        - { type: returns_matches, value: "Call S-507" }

  - name: the_reduce_reads_summaries_and_never_a_report
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"region": "R-06", "date": "2026-10-07"}' }
      llm_script:
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-601:" } ] }
          reply: "Summary: S-601 had six stock-outs, wasted 4.2 percent and was ₹950 short."
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-604:" } ] }
          reply: "Summary: S-604 had a clean day."
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-607:" } ] }
          reply: "Summary: S-607 ran out of one line."
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-610:" } ] }
          reply: "Summary: S-610 wasted 2.6 percent, mostly fruit."
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-615:" } ] }
          reply: "Summary: S-615 had a clean day."
        - { match: { regex: "^BRIEF" }, reply: "Brief: Call S-601 first: six stock-outs, 4.2 percent wastage and ₹950 short. S-610 wasted 2.6 percent. The other three stores had a quiet day." }
        - { match: "*", reply: "Summary: Nothing worth a manager's time." }
      tools:
        list_stores: { returns: { status: 200, stores: [S-601, S-604, S-607, S-610, S-615] } }
        store_report:
          by_arg:
            arg: store
            values:
              S-601: { status: 200, stockouts: 6, wastage_pct: 4.2, till_variance: -950 }
              S-604: { status: 200, stockouts: 0, wastage_pct: 0.5, till_variance: 0 }
              S-607: { status: 200, stockouts: 1, wastage_pct: 1.0, till_variance: 0 }
              S-610: { status: 200, stockouts: 2, wastage_pct: 2.6, till_variance: 75 }
              S-615: { status: 200, stockouts: 0, wastage_pct: 0.8, till_variance: 0 }
            default: { error: not_found }
        limits: { returns: { max_llm_calls: 6 } }
      budget: { max_llm_calls: 6, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: prompt_lacks, value: "wastage_pct" }
        - { type: prompt_lacks, value: "stockouts" }
        - { type: prompt_contains, in: last, value: "Summaries \\(data\\):\\n- S-601" }
        - { type: returns_matches, value: "Call S-601 first" }

  - name: a_region_with_no_stores_needs_no_model_call
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"region": "R-07", "date": "2026-10-07"}' }
      llm_script:
        - { match: { regex: "^BRIEF" }, reply: "Brief: Every store in R-07 had a quiet day." }
        - { match: "*", reply: "Summary: Nothing worth a manager's time." }
      tools:
        list_stores: { returns: { status: 200, stores: [] } }
        store_report: { returns: { error: not_found } }
        limits: { returns: { max_llm_calls: 6 } }
      budget: { max_llm_calls: 6, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - type: valid_json_return
          schema:
            type: object
            required: [brief, stores, failed, batches]
            properties:
              brief: { const: "No stores reported for R-07 on 2026-10-07." }
              stores: { const: [] }
              failed: { const: [] }
              batches: { const: 0 }

  - name: adversarial_the_report_service_goes_down
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      The report service went down before the brief ran, and every call to
      `store_report` raised `TimeoutError`. In langgraph 1.2.12 an exception
      inside one `Send` branch comes out of `invoke` as that exception, and
      every other branch's work goes with it. That is how region R-04
      went a whole morning with no brief.

      The worker is the only place that can catch it, and it catches per
      store, so the store beside the one that failed is still read. Here
      nothing came back, so no worker spends a model call, and the reduce
      writes a brief that names all four stores for the managers to ring.
    spec:
      kind: agent_run
      input: { question: '{"region": "R-08", "date": "2026-10-07"}' }
      llm_script:
        - match: { all: [ { regex: "^BRIEF" }, { contains: "No report from: S-801, S-805, S-809, S-812" } ] }
          reply: "Brief: No store in R-08 has reported this morning. S-801, S-805, S-809 and S-812 all timed out, so call each store manager before 08:00."
        - { match: { regex: "^BRIEF" }, reply: "Brief: Some stores in R-08 sent no report this morning." }
        - { match: "*", reply: "Summary: Nothing worth a manager's time." }
      tools:
        list_stores: { returns: { status: 200, stores: [S-809, S-801, S-812, S-805] } }
        store_report: { fixture: slow_then_timeout, params: { succeeds: 0, message: "store_report timed out after 20 seconds" } }
        limits: { returns: { max_llm_calls: 3 } }
      budget: { max_llm_calls: 3, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [brief, stores, failed, batches]
            properties:
              failed: { const: [S-801, S-805, S-809, S-812] }
              batches: { const: 2 }
        - { type: returns_matches, value: "No store in R-08 has reported" }
        - { type: llm_calls_at_most, value: 1 }

  - name: adversarial_two_calls_for_nine_stores
    visibility: adversarial
    fixture: budget_squeeze
    annotation_md: |
      The limits allowed two model calls for nine stores, and one worker per
      store needs ten. A graph that sends a worker per store has its third
      call refused, the refusal raises inside a branch, and the run ends
      with no brief.

      The number of workers is a decision, and the budget is the input to
      it. One call is kept for the reduce, so one worker reads all nine
      reports and summarises them in the other call. A batch of nine makes
      a longer worker prompt, which is the price of a brief that goes out.
    spec:
      kind: agent_run
      input: { question: '{"region": "R-09", "date": "2026-10-07"}' }
      llm_script:
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-901:" } ] }
          reply: "Summary: All nine stores reported. S-907 had six stock-outs, and the rest were quiet."
        - { match: { regex: "^BRIEF" }, reply: "Brief: All nine stores in R-09 reported. Call S-907 about six stock-outs, and the other eight had a quiet day." }
        - { match: "*", reply: "Summary: Nothing worth a manager's time." }
      tools:
        list_stores: { returns: { status: 200, stores: [S-901, S-902, S-904, S-905, S-907, S-908, S-910, S-911, S-913] } }
        store_report:
          by_arg:
            arg: store
            values:
              S-907: { status: 200, stockouts: 6, wastage_pct: 2.4, till_variance: 0 }
            default: { status: 200, stockouts: 0, wastage_pct: 0.7, till_variance: 0 }
        limits: { returns: { max_llm_calls: 2 } }
      budget: { max_llm_calls: 2, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: returns_nonempty }
        - type: valid_json_return
          schema:
            type: object
            required: [brief, stores, failed, batches]
            properties:
              failed: { const: [] }
              batches: { const: 1 }
        - { type: returns_matches, value: "Call S-907" }
        - { type: llm_calls_at_most, value: 2 }

reference_md: |
  `Send` is LangGraph's map step. Its docstring in langgraph 1.2.12
  describes this use, a "map-reduce" workflow where the graph "invokes the
  same node multiple times in parallel with different states, before
  aggregating the results back into the main graph's state". Each `Send`
  becomes a task of its own, and each bad morning came from a property of
  those tasks.

  A task that raises ends the run. In langgraph 1.2.12 an exception inside
  one `Send` branch comes out of `invoke` as that exception, and every
  other branch's work is lost with it. A model call refused by the budget
  is no different, because `BudgetExceeded` is a `RuntimeError`. The
  worker is the only place that can catch it, and it catches per store: a
  `try` around the whole batch would lose the stores that reported
  alongside the one that failed. The failure becomes data, a store id in
  `failed` that the reduce can name.

  A fan-out is as wide as the list it is given unless you decide
  otherwise. Here the width comes from the budget: one call is kept for
  the reduce, so there are at most `max_llm_calls - 1` workers, and a
  region with more stores than that puts several stores in each worker's
  prompt. Batching costs a longer worker prompt and saves the reduce,
  which is the call the managers read.

  A reducer key collects what every branch returns, in the order the
  branches finish. In this sandbox LangGraph's thread pool runs inline, so
  branches finish in the order they were sent. In production they run in
  parallel and finish in any order. Sorting by store before the reduce
  makes the brief read the same every morning, whichever way the branches
  ran.

  The reduce reads summaries because producing them was the workers' job.
  A raw report puts every field of every store into one prompt, which
  grows with the region and hands field names such as `wastage_pct` to a
  model that writes for a manager.

  An empty region shows one more property of the pattern. With no `Send`
  no worker runs, and the reduce, which waits on the workers, never runs
  either: in langgraph 1.2.12 the run ends with the state it started with.
  So the empty region's brief is returned before the graph starts.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    You fan out forty workers and one fails. What does the reduce step see, and what did you do about the cost of forty model calls?
  source: |
    Author judgement. The interview bank's I012, on when more agents make a workflow worse, is adjacent, and the bank
    labels it original interview-style practice with employer frequency unverified.

tools:
  - name: list_stores
    args: region
    returns: '`{"status": 200, "stores": [<store id>, ...]}`, in no particular order.'
  - name: store_report
    args: store
    returns: '`{"status": 200, "stockouts": ..., "wastage_pct": ..., "till_variance": ...}`, or `{"error": <reason>}`. It can also raise.'
  - name: limits
    args: ""
    returns: '`{"max_llm_calls": <n>}`, every model call one brief may make, the reduce''s included.'
example:
  case: three_stores_three_workers_one_brief
  expect: "Three stores and six calls allowed, so three workers each summarise one store and the reduce writes the brief: four model calls, and `batches` is 3."
traps:
  - Letting one store's tool failure escape its branch, which ends the whole run and every manager's brief with it.
  - Starting one worker per store whatever the call budget, so the reduce has no call left.
  - Handing the reduce the raw reports, so its prompt grows with every store and carries every field.
  - Relying on the order the branches finish in, which changes from run to run once branches run in parallel.
