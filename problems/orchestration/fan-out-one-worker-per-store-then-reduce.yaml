        limits: { returns: { max_llm_calls: 6 } }
      budget: { max_llm_calls: 6, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [brief, stores, failed, batches]
