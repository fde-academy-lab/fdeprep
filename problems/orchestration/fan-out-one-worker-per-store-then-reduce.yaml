              batches: { const: 5 }
        - { type: prompt_contains, value: "S-420: stock-outs 3" }
        - { type: prompt_contains, in: last, value: "S-415 and S-420 had five stock-outs" }
        - { type: returns_matches, value: "No report from S-417" }

  - name: summaries_reach_the_reduce_in_store_order
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: '{"region": "R-05", "date": "2026-10-07"}' }
      llm_script:
        - match: { all: [ { regex: "^SUMMARISE" }, { contains: "S-503:" } ] }
