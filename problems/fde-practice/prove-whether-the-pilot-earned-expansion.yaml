slug: prove-whether-the-pilot-earned-expansion
title: Tell the sponsor whether the pilot she announced should expand
artefact_type: design
difficulty: extreme
track: fde-practice
est_minutes: 45
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: client-communication, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
  - { slug: cost-and-latency, weight: 0.5 }

brief_md: |
  A pensions administrator ran a twelve-week pilot of a drafting assistant
  with 40 of its 400 member services agents. The agents answer letters from
  pension scheme members, about 5,000 a week across the pilot group. The
  chief operating officer sponsored the pilot. Last month she told the board
  it had worked, and she wants all 400 agents on the assistant next quarter.

  She has asked you, as the engineer who built it, to confirm the case for
  expansion. This is what the pilot produced:

  | Measure | Before the pilot | During the pilot |
  |---|---|---|
  | Agent satisfaction with their tools | 3.1 of 5 | 4.4 of 5 |
  | Handling time per letter | 18 minutes | 14 minutes |
  | Checked letters needing correction | 6% | 13% |
  | Quality team time on corrections | 12 hours a week | 26 hours a week |

  The quality team checks one letter in ten before it is sent. Agents used
  the assistant on 55 percent of their letters, and rarely on transfer
  requests or complaints. The assistant scored 94 percent on a 400-letter
  test set drawn from the pilot's first two weeks, mostly address changes and
  statement requests. On 100 transfer and complaint letters you pulled last
  week, it scored 70 percent. Model spend was £9,000 a month for the pilot
  group.

  Write your answer to the COO.

contract_md: |
  Write the memo you would send the COO. She will read it closely, because
  she has already told the board the pilot worked and she is the one who
  goes back to them.

  Between 400 and 600 words. There is no template and no required structure.

  Say whether the pilot is worth expanding and on what evidence, what the
  headline numbers leave out, what you would expand, when and behind which
  gate, and what she can truthfully tell the board.

word_range: [400, 600]
required_headings: []

rubric:
  - label: Reads adoption, quality, cost and correction effort together
    weight: 20
    descriptor_md: |
      Strong answers put the measures in one picture: about 330 agent hours a
      week saved, 14 more hours of correction, an error rate that doubled, a
      tool used on only the easier half of the work, and a model bill that
      grows tenfold at full scale. An answer that argues from satisfaction and
      handling time alone repeats what the board already heard.
  - label: Counts the correction work and the unchecked letters as a cost
    weight: 25
    descriptor_md: |
      The quality team checks one letter in ten, so its corrections are a
      sample of the errors that reach members. Strong answers turn 6 and 13
      percent into letters a week: roughly 650 drafts with an error against
      300 before, of which about 585 go out unchecked against 270. At 400
      agents that is around 3,000 more wrong letters a week reaching members.
      Satisfaction rose while this happened, which is why it cannot be the
      verdict.
  - label: Says what the test set does not show
    weight: 15
    descriptor_md: |
      The 94 percent came from the pilot's first two weeks, mostly the simple
      letters. On the transfer and complaint letters agents avoid, the score
      was 70 percent, and the 55 percent usage rate is the same fact seen
      from the agents' side. Strong answers say the pilot's quality number
      cannot be carried to full scale, and what test set would replace it.
  - label: Recommends a staged expansion with a gate and a date
    weight: 20
    descriptor_md: |
      Strong answers say what expands first, such as the letter types whose
      corrected rate is back at or below the 6 percent before the pilot, what
      checking rate applies meanwhile, what keeps transfers and complaints
      out, and when the next decision is taken on which number. A flat yes or
      a flat no to all 400 agents next quarter is weaker than a staged answer
      in either direction.
  - label: Gives the sponsor something true to tell the board
    weight: 20
    descriptor_md: |
      The COO has told the board it worked. Strong answers give her a
      sentence that is true: what the pilot did show, what it found, and what
      happens next, framed as a pilot doing the job a pilot exists to do.
      Answers that tell her she was wrong in front of her board fail here,
      and so do answers that help her leave the correction numbers out.

exemplars:
  - band: strong
    score: 90
    body_md: |
      The pilot worked at what it measured, and it found a problem that would
      be ten times larger at full scale. My recommendation is to expand in
      stages, and there is a true sentence for the board below.

      What the pilot shows. Handling time fell from 18 to 14 minutes a letter,
      about 330 agent hours a week across 5,000 letters, and agents rate the
      tool 4.4 out of 5. Both are real.

      What the headline leaves out. The share of checked letters needing
      correction went from 6 to 13 percent. The quality team checks one letter
      in ten, so that is a sample of what goes out. Across 5,000 letters,
      roughly 650 drafts a week now contain an error, against about 300
      before, and about 585 of them are sent without a check. At 400 agents,
      if nothing changes, around 3,000 more wrong letters a week would reach
      members, each one a possible complaint about someone's pension. The 14
      extra hours of correction are the part we can see.

      Why it happens. The 94 percent test set came from the first two weeks
      and is mostly address changes and statement requests. On transfer and
      complaint letters the assistant scored 70 percent. Agents use it on 55
      percent of letters and avoid those types, so the time saving comes from
      the easy work, and we do not yet know which letters the errors come
      from.

      Recommendation.

      1. This week, split the quality team's corrections by letter type and
         by whether the assistant drafted the letter. We already hold the data.
      2. Until the next decision, check one assistant-drafted letter in four
         instead of one in ten, so that we are measuring errors rather than
         estimating them.
      3. Next quarter, move all 400 agents onto the assistant for the letter
         types whose corrected rate is at or below the 6 percent we had
         before the pilot, keeping the heavier checking for the first month.
      4. Keep transfers and complaints out until a test set drawn from real
         letters of those types reaches a score we agree now.
      5. Take the next decision at the end of month two, on the corrected
         rate, with satisfaction reported beside it.

      Cost. Spend goes from £9,000 to about £90,000 a month at full scale. The
      figure worth reporting is cost per letter sent correctly, which puts
      the corrections back into the sum.

      For the board: "The pilot did what we said it would. Letters are faster
      and staff want the tool. It also showed that some letter types need
      more checking than we planned, which is what a pilot is for. We are
      rolling out now for the letters where quality holds, and adding the
      rest as they pass the same test." Every word of that is true, and it
      keeps next quarter's date for most of the work.

      What I need from you is the quality team's correction log for the pilot,
      and agreement that the next stage is decided on errors reaching members.
  - band: adequate
    score: 61
    body_md: |
      I have looked at the pilot results in more detail, and while the
      headline numbers are good, I think we should be more careful about
      moving all 400 agents next quarter.

      The positives are clear. Agents like the tool, with satisfaction up from
      3.1 to 4.4, and the average handling time has come down from 18 to 14
      minutes per letter. That is a real productivity gain, and it is why the
      pilot felt like a success to everyone involved.

      There are two concerns. First, the quality team's correction work has
      more than doubled, from 12 to 26 hours a week, and the share of checked
      letters needing correction has gone from 6 to 13 percent. Some of the
      time saved by agents is being spent again by the quality team, so the
      real saving is smaller than the handling time suggests. Even so, 14
      extra hours of correction against about 330 hours saved by agents still
      leaves a large net gain, so the correction work on its own is not a
      reason to stop.

      Second, the test set that gave us 94 percent accuracy was taken from the
      first two weeks of the pilot, and most of it is simple letters. When we
      tested 100 transfer and complaint letters, accuracy was 70 percent. The
      agents seem to know this, because they only use the tool on about half
      of their letters.

      My recommendation is a phased rollout. Instead of all 400 agents next
      quarter, we expand to 120 agents, with training on when to use the tool
      and when not to. The 120 should come from teams that handle a similar
      mix of letters to the pilot group, so the results stay comparable. We
      should also build a better test set with more complex letters, and
      improve the prompts for transfers and complaints before the next phase.

      We should keep tracking satisfaction and handling time, and add
      correction hours as a third measure, reviewed monthly with the quality
      team lead, so the next review shows the full picture.

      On cost, model spend would go from £9,000 to about £27,000 a month for
      120 agents, which is still small next to the time saved.

      For the board, I would present this as a successful pilot moving into a
      careful second phase, which is a normal way to scale a new tool. The
      full rollout could follow in the quarter after, once the complex
      letters are working better and the quality team is comfortable with
      the correction workload.
  - band: weak
    score: 27
    body_md: |
      The pilot results are strong and support the COO's decision to expand
      to all 400 agents next quarter. The pilot group was a fair cross-section
      of the team, drawn from three different offices, so the results should
      hold when the rest of the agents join.

      Agent satisfaction rose from 3.1 to 4.4 out of 5, which is an
      exceptional improvement for any new tool, and average handling time
      fell by more than 20 percent, from 18 to 14 minutes per letter. The
      test set accuracy of 94 percent also shows that the assistant is
      producing high quality drafts.

      The increase in correction work is expected at this stage. Agents are
      still learning how to review the drafts, and the quality team is being
      extra careful because the tool is new. As agents get used to the
      assistant, corrections should return to normal levels without any
      change to the tool. The quality team has said the extra work is
      manageable for now, and its checks give us a safety net while agents
      build confidence.

      Adoption is also healthy, with nearly every pilot agent using the tool
      every week. Some agents are not yet using it on complex letters, which
      we can address with training and some example prompts for transfer
      requests and complaints.

      For the rollout, I recommend three waves of around 120 agents over the
      quarter, each with a one-hour training session and a champion in each
      team who can help colleagues. Pilot agents make natural champions, and
      it keeps their enthusiasm high. We should set up a dashboard showing
      satisfaction and handling time for each wave, with a short survey after
      each one, so the board can see the benefits growing as more agents come
      on board.

      On cost, the model spend will rise to around £90,000 a month at full
      scale. Given the time saved across 400 agents, this is a very good
      return on the investment, and the board has already accepted the
      business case for it. Every week of delay also means agents keep
      spending four extra minutes on each letter, which adds up quickly across
      400 people.

      The COO can confidently tell the board that the pilot has succeeded and
      that the rollout is on track. The next update to the board should focus
      on the productivity gains at scale, since that is what they will want
      to hear about, and on how quickly the remaining agents are being
      brought onto the tool.

hints:
  - Put adoption, quality, cost and correction effort in one table before you
    decide anything. The board has seen two of the four.
  - The quality team checks one letter in ten. Turn the 13 percent into
    letters a week that contain an error, and count the ones nobody checks.
  - The test set came from the first two weeks. Compare its letters with the
    ones agents choose not to use the assistant on.
  - A staged expansion needs a gate. Say which letter types go first, which
    error rate must hold, how it is measured, and when the next decision is
    taken.
  - The COO needs one true sentence for the board. Write what the pilot did
    show, what it found, and what happens next.

scenario:
  who: The COO of a pensions administrator, who sponsored the pilot
  situation: >-
    Forty of 400 agents used a drafting assistant for twelve weeks. She told
    the board last month that it worked, and she wants every agent on it next
    quarter.
  stakes: >-
    Satisfaction and handling time improved. The quality team's correction
    time doubled, and it checks only one letter in ten before it is sent.
  metrics:
    - { label: Agent satisfaction, value: 3.1 to 4.4 }
    - { label: Letters needing correction, value: 6% to 13% }
    - { label: Letters checked, value: 1 in 10 }

diagram:
  title: Two numbers the board heard, and two it did not
  caption: >-
    Satisfaction and speed went to the board. The correction rate and the nine
    letters in ten nobody checks decide what ten times the scale would bring.
  direction: lr
  nodes:
    - { id: agents, label: 40 pilot agents, sub: use it on 55% of letters, kind: actor, tone: blue, at: [0, 1] }
    - { id: board, label: The board, sub: heard satisfaction and speed, kind: output, tone: purple, at: [1, 0] }
    - { id: assistant, label: Drafting assistant, sub: 94% on an easy test set, kind: model, tone: teal, at: [1, 1] }
    - { id: letters, label: "5,000 letters a week", sub: to pension scheme members, kind: doc, tone: neutral, at: [2, 1] }
    - { id: checks, label: Quality checks, sub: one letter in ten, kind: guard, tone: orange, at: [3, 0] }
    - { id: members, label: Scheme members, sub: receive the other nine, kind: actor, tone: pink, at: [3, 2] }
  edges:
    - { from: agents, to: board, label: "4.4 of 5, 4 minutes saved", tone: muted }
    - { from: agents, to: assistant, label: mostly on easy letters, step: 1 }
    - { from: assistant, to: letters, label: 13% need correction, tone: danger, step: 2 }
    - { from: letters, to: checks, label: one in ten checked, step: 3 }
    - { from: letters, to: members, label: nine in ten never checked, tone: danger }

approach:
  goal: A verdict the sponsor can act on and say out loud to her board
  branches:
    - label: Put the four measures side by side
      leaves: [adoption, quality, cost, correction effort]
    - label: Follow the errors to the members
      detail: A check on one letter in ten is a sample of what goes out.
      leaves: ["what does 13 percent mean for the unchecked nine?", "what would it be at 400 agents?"]
    - label: Test the test set
      leaves: ["where did the 94 percent come from?", "which letters do agents avoid?"]
    - label: Stage it
      leaves: ["what goes first?", "what result opens the next stage?"]
    - label: Write the board's sentence
      leaves: [true to what the pilot showed, keeps the sponsor credible]

coach:
  opening: >-
    Before you judge the pilot, put the four measures in one place: adoption,
    quality, cost and correction effort. The board has seen two of them.
  signals:
    - id: corrections-ignored
      when: { code_lacks: '(?i)correct(ion|ed|ing)|quality\s+team|errors?\b|wrong\s+letters?' }
      say: >-
        Nothing in your memo mentions the quality team's corrections, which
        doubled during the pilot. Where do they belong in the verdict?
    - id: learning-curve
      when: { code_matches: '(?i)learning\s+curve|expected\s+at\s+this\s+stage|return\s+to\s+normal|get\s+used\s+to|settle\s+down|teething' }
      say: >-
        You expect the corrections to fall on their own. What in the data
        says so, and what happens to the unchecked letters in the meantime?
    - id: unchecked-letters
      when: { code_lacks: '(?i)one\s+(letter\s+)?in\s+ten|1\s+in\s+10|nine\s+in\s+ten|9\s+in\s+10|a\s+tenth|\b10\s*(%|percent)\s+of\s+(the\s+)?(letters|drafts|output)|\b90\s*(%|percent)|never\s+(checked|reviewed|seen)|not\s+(checked|reviewed)|unchecked|unreviewed|without\s+a\s+(check|review)|\bsample' }
      say: >-
        The quality team checks one letter in ten. What does a 13 percent
        correction rate in the checked letters say about the other nine?
    - id: test-set-at-face-value
      when:
        code_matches: '(?i)94\s*(percent|%)'
        code_lacks: '(?i)70\s*(percent|%)|first\s+two\s+weeks|easier|simple\s+letters|address\s+changes|not\s+representative|harder\s+letters'
      say: >-
        The 94 percent came from the pilot's first two weeks. What did the
        assistant score on the letters agents avoid?
    - id: all-or-nothing
      when: { code_lacks: '(?i)\bstages?\b|\bstaged\b|\bphases?\b|\bphased\b|\bwaves?\b|\bgate\b|letter\s+types?|first\s+\d+\s+agents' }
      say: >-
        Your answer is yes or no to all 400 agents. What would you expand
        first, and which result opens the next stage?
    - id: board-ignored
      when: { code_lacks: '(?i)\bboard\b' }
      say: >-
        The COO has already told the board the pilot worked. What true
        sentence can she say to them next?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with one line per measure: adoption, quality, cost and
        correction effort, each with its number. The verdict is what those four
        lines say together.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three tries without a pass. Open the hints; the second one turns the
        correction rate into letters that reach members.
  wrap_up: >-
    A pilot earns expansion when its benefit survives the costs the headline
    left out. Count the corrections and the letters nobody checks, stage the
    rollout behind a gate, and give the sponsor a true sentence to say.

reference_md: |
  The satisfaction score is the trap, and it is a trap because it is real.
  Agents like the tool, handling time fell by four minutes a letter, and
  about 330 hours a week came back to the team. A memo that denies any of
  that has lost the COO before it reaches the part that matters.

  The part that matters is the correction rate read as a sample. The quality
  team checks one letter in ten, so 13 percent of checked letters needing
  correction says roughly 13 percent of all drafts carry an error, and nine
  in ten of those go out as written. That is about 585 wrong letters a week at
  pilot scale against 270 before, and around 3,000 more a week at 400 agents
  if nothing changes. The fourteen extra hours of correction were never the
  cost. They were the visible edge of it, and satisfaction rose while it
  happened because satisfaction measures the agent's afternoon rather than the
  member's letter.

  The test set explains the rest. It was drawn from the first two weeks,
  when the pilot handled the letters everyone thought of first, and it scores
  94 percent on work the assistant is good at. On transfers and complaints it
  scores 70. The 55 percent usage rate is the same fact from the agents' side:
  they worked out which letters the tool could handle long before the test
  set did. A quality number measured on the easy half cannot be multiplied
  by ten.

  None of this makes the answer no. The strongest memos stage the expansion
  behind a gate the COO can explain: the letter types where the corrected
  rate is back at the pre-pilot level go first, checking stays heavier until
  the errors are measured rather than estimated, the hard letters wait for a
  test set drawn from real ones, and the next decision is taken on errors
  reaching members, with satisfaction reported beside it.

  The board sentence is the part most engineers skip, and it is the part the
  sponsor will actually use. She is right that the pilot worked, and she has
  heard half of what it found. Giving her a true sentence that keeps most of
  her date, frames the finding as the pilot doing its job, and names the next
  gate is what lets the evidence win without anyone having to lose.

complexity: C4

interview_evidence:
  round: both
  asked_as: |
    A pilot's sponsor has told the board it worked. Staff love the tool and the test score is high, but correction work has doubled. How do you decide whether it is worth expanding, and what do you tell the sponsor?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I030,
    whose follow-up is an evaluation set easier than real work. That bank labels
    every entry "Original interview-style practice; actual employer frequency
    unverified", and this inherits the caveat.
