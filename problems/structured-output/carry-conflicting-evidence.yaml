slug: carry-conflicting-evidence
title: "Flag documents that disagree before paying"
day: 8
skill: Say which documents disagree before the supplier is paid
artefact_type: code
difficulty: hard
track: structured-output
est_minutes: 40
competencies:
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: context-assembly, weight: 1.0 }
  - { slug: tool-schema-design, weight: 0.5 }
call_budget: 4
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  Accounts payable at a building-supplies wholesaler pays a new supplier only
  after an agent has read the supplier's paperwork and filled in a payment
  record: sort code, account number and VAT number. The paperwork is a signed
  registration form, the supplier's invoices, and any emails the supplier has
  sent.

  Three weeks ago a new joinery supplier's file held a signed form and an
  invoice that agreed on the bank details, and an email, sent later, that did
  not: "We have moved banks, please pay us at this account from today." The
  agent took the newest value. The record came out complete and certain, and
  38,400 pounds went to an account the supplier had never owned. The email
  had not come from the supplier.

  Nothing in the record showed that two documents disagreed. Write the
  reconciliation step so that it does.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the supplier's id, such as `"S-3301"`.

  `tools["documents"](supplier=...)` returns the supplier's paperwork:

      {"status": 200, "documents": [
          {"id": "FORM-3301", "kind": "signed form", "received": "2026-09-02",
           "text": "..."}, ...]}

  `llm(prompt)` reads the text you give it and replies with one JSON object
  holding the fields that text states, written as the text writes them:
  `sort_code`, `account_number` and `vat_number`. A field the text does not
  state is left out. Given several documents in one prompt, it returns one
  object and picks a value wherever they differ, with no sign of which
  document it read.

  Compare values after normalising them: sort codes and account numbers by
  their digits alone, VAT numbers in capitals with the spaces removed. Return
  JSON with three keys:

  - `record`: all three fields, holding normalised values. A field that every
    document stating it agrees on holds that value. A field no document states
    is null. A field the documents disagree on is null.
  - `conflicts`: one entry per field the documents disagree on,
    `{"field": ..., "candidates": [{"value": ..., "sources": [<document ids>]}, ...]}`,
    with every distinct value and the ids of the documents that gave it. An
    empty list when nothing disagrees.
  - `ready_to_pay`: true only when `sort_code` and `account_number` both hold
    values and `conflicts` is empty.

  Budget: at most 4 model calls, which is one per document in the largest
  file. Allowed imports: json, re.

defence_question: |
  Your record holds null for any field the documents disagree on, and those
  suppliers wait for a person. A month in, the finance director says four in
  ten new suppliers are waiting, mostly because invoices print the VAT number
  with a GB prefix and registration forms leave it off. What do you change,
  what do you refuse to change even if the queue doubles, and what is the
  principle that separates the two?

stub_code: |
  import json
  import re

  FIELDS = ("sort_code", "account_number", "vat_number")
  PAYMENT_FIELDS = ("sort_code", "account_number")


  def normalise(field: str, value):
      """The comparable form of one value, or None when there is none."""
      raise NotImplementedError


  def extract(llm, text: str) -> dict:
      """The fields one document's text states, as the model wrote them."""
      raise NotImplementedError


  def run_agent(question: str, llm, tools: dict) -> str:
      """Fill the supplier's payment record and carry any disagreement.

      tools["documents"](supplier=question) returns
          {"status": 200, "documents": [{"id", "kind", "received", "text"}, ...]}
      llm(prompt) returns one JSON object of the fields the given text states.

      Return json.dumps({
          "record": {field: normalised value or None for field in FIELDS},
          "conflicts": [{"field": ..., "candidates": [
              {"value": ..., "sources": [document ids]}, ...]}, ...],
          "ready_to_pay": both PAYMENT_FIELDS hold values and nothing conflicts,
      })
      At most 4 model calls. Allowed imports: json, re.
      """
      return json.dumps({"record": dict.fromkeys(FIELDS), "conflicts": [],
                         "ready_to_pay": False})

hints:
  - Ask where in your code the fact "the form and the email disagree" could
    live. A record with one slot per field has nowhere to put it.
  - Attribution is easiest when it comes from your loop. One document per
    model call means every value arrives already tied to the document it came
    from.
  - Group the values for each field by their normalised form, keeping the ids
    that gave each one. A field with one distinct value is agreed, and a field
    with two or more is a conflict.
  - "Normalise formatting and nothing else: dashes and spaces are formatting,
    and two digits in a different order make a different number."
  - "`ready_to_pay` asks for agreed values to be present. Think about what your code returns when there are no documents at all."

scenario:
  headline: "An email's bank details sent £38,400 to the wrong account"
  who: Accounts payable at a building-supplies wholesaler
  situation: >-
    Before a new supplier is paid, an agent reads its paperwork and fills a
    payment record. An email sent after the signed form gave different bank
    details, and the agent used the newest.
  stakes: >-
    38,400 pounds went to an account the supplier never owned. The documents
    disagreed, and the record looked complete and certain.
  metrics:
    - { label: Paid to the wrong account, value: "£38,400" }
    - { label: Documents that agreed, value: 2 of 3 }
    - { label: Conflicts shown, value: "0" }

diagram:
  title: Where a disagreement between documents disappeared
  caption: >-
    Each document is read on its own, so every value keeps its source. A field
    with two values becomes a conflict for a person, whatever the dates say.
  direction: lr
  nodes:
    - { id: form, label: Signed form, sub: account 41190352, kind: doc, tone: blue, at: [0, 0] }
    - { id: invoice, label: Invoice, sub: account 41190352, kind: doc, tone: blue, at: [0, 1] }
    - { id: email, label: Newer email, sub: account 88213004, kind: doc, tone: orange, at: [0, 2] }
    - { id: model, label: Extraction model, sub: one document per call, kind: model, tone: teal, at: [1, 1] }
    - { id: agent, label: Reconciler, sub: groups values by field and source, kind: agent, tone: purple, at: [2, 1] }
    - { id: record, label: Payment record, sub: "account null, conflict listed", kind: output, tone: green, at: [3, 0] }
    - { id: paid, label: Paid to the newest, sub: "£38,400 to a stranger", kind: output, tone: pink, at: [3, 2] }
  edges:
    - { from: form, to: model, label: text, step: 1 }
    - { from: invoice, to: model, label: text, step: 1 }
    - { from: email, to: model, label: text, step: 1 }
    - { from: model, to: agent, label: values with their source, step: 2 }
    - { from: agent, to: record, label: conflict carried, tone: success }
    - { from: agent, to: paid, label: newest value wins, tone: danger }

approach:
  goal: A record that shows where the documents disagree
  branches:
    - label: Read each document on its own
      leaves: [one extraction per document, the document id travels with each value]
    - label: Normalise before you compare
      leaves: ["20-41-77 and 204177 are one value", VAT in capitals without spaces]
    - label: Carry the disagreement forward
      detail: A newer date and a better-looking document are how the fraud got paid, so neither one decides.
      leaves: [null in the record, every candidate with its sources]
    - label: Ready means agreed
      leaves: [both bank fields hold values, no conflicts at all]

coach:
  opening: >-
    Before you write code, work out by hand what the form, the invoice and the
    email in the brief each say about the account number.
  signals:
    - id: one-prompt-for-every-document
      when:
        code_matches: 'join\(\s*\w+(\[["\x27]text["\x27]\]|\.get\(\s*["\x27]text["\x27][^)]*\))\s+for\b'
      say: >-
        Every document goes to the model in one prompt, so one object comes
        back and nothing says which document each value came from. How would
        you ever see that two of them disagreed?
    - id: conflicts-always-empty
      when:
        code_matches: '["\x27]conflicts["\x27]\s*:\s*\[\s*\]'
      say: >-
        Your answer always reports an empty conflicts list. Where in your code
        could two documents end up recorded as disagreeing?
    - id: newest-believed
      when: { test_failed: a_newer_email_does_not_overrule_the_signed_form }
      say: >-
        Three documents, and the newest one names a different account. What
        did your record say, and did the conflict carry every document's id?
    - id: formatting-read-as-conflict
      when: { test_failed: the_same_number_written_two_ways_is_not_a_conflict }
      say: >-
        The two documents in that case write the same numbers in different
        ways. Print what you compare for each field, after normalising.
    - id: second-conflict-missed
      when: { test_failed: every_field_the_documents_disagree_on_is_reported }
      say: >-
        More than one field disagrees in that case. Does your code look for
        conflicts in every field, or only in the one from the incident?
    - id: nothing-read-as-ready
      when: { test_failed: adversarial_the_document_store_returns_nothing }
      say: >-
        The document store returned nothing at all. What does your code say
        about paying a supplier when it has read no documents?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with normalise and try it on "20-41-77" and "204177". Two values
        that should compare equal are the easiest first test.
    - id: see-the-hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints are available now and narrow from where to
        look to the shape of the fix.
  wrap_up: >-
    When sources disagree, the disagreement is the finding. Keep every value
    with the document it came from, normalise formatting before comparing,
    and hand a person whatever the evidence cannot settle.

tests:
  - name: documents_that_agree_fill_the_record
    visibility: public
    spec:
      kind: agent_run
      input: { question: "S-2210" }
      llm_script:
        - { match: { regex: '(?s)(FORM-2210|INV-4102).*(?!\1)(?:FORM-2210|INV-4102)' },
            reply: '{"sort_code": "309215", "account_number": "60221847", "vat_number": "GB204551981"}' }
        - { match: { contains: "FORM-2210" },
            reply: '{"sort_code": "309215", "account_number": "60221847", "vat_number": "GB204551981"}' }
        - { match: { contains: "INV-4102" },
            reply: '{"sort_code": "309215", "account_number": "60221847", "vat_number": "GB204551981"}' }
        - { match: "*", reply: "{}" }
      tools:
        documents:
          returns:
            status: 200
            documents:
              - id: FORM-2210
                kind: signed form
                received: "2026-08-29"
                text: >-
                  Supplier registration form FORM-2210 for supplier S-2210.
                  Bank sort code 309215, account number 60221847. VAT
                  registration GB204551981. Signed by the director.
              - id: INV-4102
                kind: invoice
                received: "2026-09-12"
                text: >-
                  Invoice INV-4102 from supplier S-2210 for 200 bags of
                  cement, total 1,890.00 GBP. Pay by transfer to sort code
                  309215, account 60221847. VAT number GB204551981.
      budget: { max_llm_calls: 4, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [record, conflicts, ready_to_pay],
                      properties: { record: { type: object,
                                              required: [sort_code, account_number, vat_number],
                                              properties: { sort_code: { const: "309215" },
                                                            account_number: { const: "60221847" },
                                                            vat_number: { const: GB204551981 } } },
                                    conflicts: { type: array, maxItems: 0 },
                                    ready_to_pay: { const: true } } } }
        - { type: calls_tool, name: documents }
        - { type: no_exception }

