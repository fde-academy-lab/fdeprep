  - name: adversarial_the_document_store_returns_nothing
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The document store was mid-deploy and answered with nothing at all.
      With no documents there were no conflicts, and a reconciler that
      computes `ready_to_pay` as "nothing conflicts" approves a payment to an
      account nobody has named.

      Ready means both bank fields hold values that every document stating
      them agreed on. An empty file has no values to agree on, so the answer
      is a record of nulls with `ready_to_pay` false, returned without an
      exception.
    spec:
      kind: agent_run
      input: { question: "S-6015" }
      llm_script:
        - { match: "*", reply: "{}" }
      tools:
        documents: { fixture: empty_tool_result }
      budget: { max_llm_calls: 4, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: valid_json_return,
            schema: { type: object, required: [record, conflicts, ready_to_pay],
                      properties: { record: { type: object,
                                              required: [sort_code, account_number, vat_number],
                                              properties: { sort_code: { type: "null" },
                                                            account_number: { type: "null" },
                                                            vat_number: { type: "null" } } },
                                    conflicts: { type: array, maxItems: 0 },
                                    ready_to_pay: { const: false } } } }
        - { type: terminates }

reference_md: |
  Every value in the incident was read correctly. The form said 41190352, the
  email said 88213004, and the agent copied the newest into a record with one
  slot per field. A record with one slot cannot say that two documents
  disagree, so the most important fact in the file was thrown away by the
  data structure before any rule could look at it.

  Attribution comes from the loop. Extracting one document per call means
  every value arrives already attached to the document it came from, and
  nobody has to trust a model's account of where it read something. Group the
  values by field and then by normalised value, and a conflict is simply a
  field with more than one distinct value.

  Normalising first keeps the conflict list worth reading. Invoices print sort
  codes with dashes and forms print them without, and a reconciler that
  compares raw strings flags every supplier. A queue where every supplier is
  flagged is a queue people learn to clear without reading, which fails the
  same way the recency rule did, only more slowly. Normalisation removes
  formatting and nothing else: 110293 and 110239 differ by one transposed pair
  of digits and stay a conflict.

  Dates and document types decide nothing here. A request to change bank
  details arrives after the paperwork because the paperwork is what the payer
  already trusts, so the newest document is exactly where a fraud would sit.
  Ranking the signed form first would have paid the right account this time
  and would pay the wrong one when the form is the forged document. The record
  holds null, and the candidates go to a person who can phone the supplier on
  a number taken from the form.

  `ready_to_pay` asks for both bank fields to hold agreed values. The
  adversarial case is a document store that returned nothing: no documents
  means no conflicts, and a reconciler that reads "no conflicts" as "ready"
  approves a payment to no account at all.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Two documents give different bank details for the same supplier. What does your extraction return, and who decides?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: documents
    args: supplier
    returns: 'The supplier''s paperwork as `{"status": 200, "documents": [...]}`, each document holding
