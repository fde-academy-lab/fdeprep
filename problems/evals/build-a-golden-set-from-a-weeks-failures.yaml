reference_md: |
  A golden set makes a promise about each case in it: a person decided its
  right answer, there is only one, and the release being tested has not seen
  it. Last month's set broke the promise three ways, and all three came from
  treating the text as the case.

  Personal data lives in what customers wrote, spelled however they chose to
  spell it. Dropping the customer columns removed one copy and left the rest.
  The scrub runs on the free text: emails and phone numbers by pattern,
  because customers paste their relatives' numbers too, and the customer's
  name and each word of it in any case, because people sign off with a first
  name. Emails go first because they often contain the name, and a name
  replaced inside an address leaves an address the email pattern no longer
  recognises.

  The key is the decision about what counts as the same case. Sixty-one
  complaints that differ only by order number and amount are one case written
  sixty-one times, and a release that fixes the template passes all of them.
  The same key decides whether a failure is a ticket the prompt's examples
  were written from, which is why it has to be one function used twice: a set
  deduplicated by key and checked against the prompt by exact text lets the
  prompt's own tickets back in with their numbers changed. A key is also the
  cheapest near-duplicate test that can be appealed, because two texts either
  share one or they do not. Fuzzier matching over word shingles catches more,
  at the cost of a similarity threshold somebody has to defend.

  The order of the steps sets the counts. Unlabelled failures go first, so an
  unfixed copy cannot stand in for a fixed one. Copies are merged before the
  quota, so a template cannot take every slot for its failure type by
  arriving forty times. A group that two people fixed differently has no
  right answer yet, and keeping its first copy would make the golden answer a
  matter of which customer wrote first. It goes to whoever owns the refund
  policy, and the conflicting count says how many cases are waiting on them.

  A store of known examples that cannot be read is the step most worth
  failing on. Treated as empty, it produces a set that reports no overlap
  with the prompt because nothing was compared, which is last month's 18
  with a cleaner report. Building nothing, and saying why, costs a day.

complexity: C2

interview_evidence:
  round: both
  asked_as: |
    You have a week of production failures. How do you turn them into a golden set the next release can be judged on?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: failures
    args: week
    returns: '`per_type`, and the week''s `failures` in arrival order, each with `text`, `customer`, `type`
      and the `resolution` a person chose, or `null`.'
  - name: known_examples
    args: ''
    returns: '`{"status": 200, "examples": [...]}`, the texts the prompt and the fine-tuning set were written
      from, already scrubbed.'
example:
  case: builds_a_set_from_a_small_week
  expect: Scrub the four labelled failures, leave out the unlabelled one and the repeat of `F-3101`, and
    return three cases with `left_out` showing one duplicate and one unlabelled.
traps:
  - Treating two complaints that differ only by order number and amount as two cases, so one template
    fills the set.
  - Scrubbing the customer's details only as the record spells them, so a first name, a reformatted
    number or a capitalised email survives.
  - Checking the prompt's examples by exact text, so a ticket the prompt was written from gets back in
    with new numbers.
  - Keeping one copy of a complaint that two people fixed in different ways, so the golden answer is a
    decision nobody made.
