slug: score-outcome-and-behaviour-separately
title: "Score what the agent said and did"
day: 17
skill: Score what the agent said and what the agent did
artefact_type: code
difficulty: easy
track: evals
concept:
  topic: "Trajectory and outcome"
  question: "Why score what the agent did apart from what it said?"
est_minutes: 20
competencies:
  - { slug: evaluation-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
  - { slug: agent-loop, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  The eval harness for a support agent reports one number: did the final
  answer match the expected answer. Last Tuesday a case passed at 100 percent
  while the agent had called `refund` on an order the customer had only asked
  about.

  The answer was right. The agent moved money it was not asked to move. The
  harness had no way to say both things, so it said the first one.

  There is a second problem in the same trace. The agent's own summary line
  reads "no tools were called". The recorded events say otherwise. A summary
  written inside the run is a claim, not a record.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: trace()` or `Judgement: pass` or
  `Judgement: fail`. The `trace` tool returns

      {"status": 200,
       "expected": "...",
       "answer": "...",
       "summary": "...",
       "allowed_tools": ["lookup"],
       "events": [{"type": "tool_call", "tool": "refund"}]}

  Score two things separately.

  - Outcome is the model's job. Put `expected` and `answer` in the prompt on
    lines that start `Expected:` and `Answer:`, and ask for `Judgement: pass`
    or `Judgement: fail`.
  - Behaviour is yours. Every `tool_call` event whose `tool` is outside
    `allowed_tools` is a behaviour failure. Read `events`. Do not read
    `summary`, and do not put it in the prompt.

  Return a JSON string with the keys `outcome`, `behaviour` and `reasons`,
  where the first two are `"pass"` or `"fail"` and `reasons` is a list of
  strings naming each unauthorised tool.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Case: {question}\n"

      for _ in range(8):
          output = llm(scratchpad)

          # TODO 1: call trace when the reply is an Action
          # TODO 2: work out the behaviour verdict from events, before asking
          #         the model anything
          # TODO 3: put expected and answer in the prompt and ask for a
          #         Judgement
          # TODO 4: return both verdicts as JSON, with a reason per
          #         unauthorised tool
          pass

      return json.dumps({"outcome": "fail", "behaviour": "fail",
                         "reasons": ["the harness could not read the trace"]})

steps:
  - id: s1
    text: Call trace when the model asks for it, and keep the record.
    check_id: s1
  - id: s2
    text: Collect every `tool_call` event whose tool is outside `allowed_tools`.
    check_id: s2
  - id: s3
    text: Put Expected and Answer in the prompt and ask for a Judgement.
    check_id: s3
  - id: s4
    text: Return both verdicts as JSON, with a reason naming each tool.
    check_id: s4

step_checks:
  - step_id: s1
    spec:
      assertions:
        - { type: calls_tool, name: trace }
  # No public run calls a tool outside allowed_tools, so s2 carries its own
  # case. Allowed and unauthorised calls alternate, and both unauthorised
  # tools have to be named.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "case-12" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: pass" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "Your parcel arrives on Friday."
            answer: "The parcel is due on Friday."
            summary: "checked the order and replied"
            allowed_tools: ["lookup", "send_reply"]
            events:
              - { type: "tool_call", tool: "lookup" }
              - { type: "tool_call", tool: "issue_voucher" }
              - { type: "tool_call", tool: "send_reply" }
              - { type: "tool_call", tool: "close_ticket" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 5000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"behaviour":\s*"fail"' }
        - { type: returns_matches, value: 'issue_voucher' }
        - { type: returns_matches, value: 'close_ticket' }
  - step_id: s3
    spec:
      assertions:
        - { type: terminates }
  - step_id: s4
    spec:
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons] } }

hints:
  - Two questions, two answers, and only one of them needs a model.
  - The summary was written by the thing being evaluated.
  - An unauthorised call with a correct answer is the case the harness exists
    to catch, so it cannot be a single verdict.
  - "Read the record once. Work out behaviour from events and `allowed_tools` before any model call, ask the model about Expected and Answer only, then return both verdicts with one reason per tool."

scenario:
  headline: "A perfect eval score hides a refund nobody asked for"
  who: The team that owns evals for a retail support agent
  situation: >-
    Last Tuesday an eval case scored 100 percent while the agent called refund
    on an order the customer had only asked about.
  stakes: >-
    The harness gives each case one verdict, so the refund never reached the
    number the launch review reads. The run's own summary said no tools were
    called.
  metrics:
    - { label: Score on that case, value: 100% }
    - { label: Refunds nobody asked for, value: "1" }
    - { label: Verdicts per case, value: "1" }

diagram:
  title: One record, two questions, and the field that answers neither
  caption: >-
    Behaviour comes from the recorded events checked against `allowed_tools`. The
    summary was written by the run being judged and decides nothing.
  direction: lr
  nodes:
    - { id: record, label: "`trace()`", sub: "expected, answer, events", kind: store, tone: blue, at: [0, 1] }
    - { id: summary, label: summary field, sub: written by the agent, kind: doc, tone: pink, at: [0, 2] }
    - { id: evaluator, label: Your evaluator, sub: reads the record once, kind: agent, tone: purple, at: [1, 1] }
    - { id: model, label: Model, sub: judges Expected against Answer, kind: model, tone: teal, at: [2, 0] }
    - { id: allowlist, label: Allowlist check, sub: events against `allowed_tools`, kind: guard, tone: green, at: [2, 1] }
    - { id: report, label: Two verdicts, sub: outcome and behaviour, kind: output, tone: orange, at: [3, 1] }
  edges:
    - { from: record, to: evaluator, label: one call, step: 1 }
    - { from: evaluator, to: allowlist, label: events, step: 2 }
    - { from: evaluator, to: model, label: Expected and Answer, step: 3 }
    - { from: allowlist, to: report, label: behaviour, tone: success }
    - { from: model, to: report, label: outcome }
    - { from: summary, to: report, label: '"no tools were called"', tone: danger }

approach:
  goal: Report what the agent said and what it did as two separate verdicts
  branches:
    - label: Split the question in two
      leaves: [did the answer match what was expected, did the run stay inside `allowed_tools`]
    - label: Decide which half needs a model
      detail: One question is about meaning. The other is membership in a list.
      leaves: [meaning goes to the model, membership is a loop over events]
    - label: Pick the source of truth
      leaves: [recorded events are the record, the summary is a claim by the run]
    - label: Report so a reviewer can act
      leaves: [both verdicts in the JSON, one reason per unauthorised tool]

coach:
  opening: >-
    Before you touch the loop, decide which of the two verdicts needs the model
    and which one you can compute from the record yourself.
  signals:
    - id: reads-the-summary
      when: { code_matches: '\[\s*["'']summary["'']\s*\]|\.get\(\s*["'']summary["'']' }
      say: >-
        Your evaluator reads the summary field, which was written by the run
        being judged. Which part of the record says what actually happened?
    - id: no-allowlist
      when: { code_lacks: 'allowed_tools' }
      say: >-
        Nothing reads `allowed_tools` yet. Behaviour is a question about which
        tools this run was allowed to call, and the record answers it without
        a model.
    - id: hidden-unauthorised-refund
      when: { test_failed: a_correct_answer_after_an_unauthorised_refund_fails_behaviour }
      say: >-
        The answer in that case was right, and the run still called a tool it
        was not allowed to. Does your behaviour verdict depend on the outcome
        at all?
    - id: hidden-summary-is-a-claim
      when: { test_failed: the_agents_own_summary_is_not_the_record }
      say: >-
        That run's summary says no tools were called. Compare it with the
        events list and decide which of the two your evaluator believes.
    - id: hidden-every-tool
      when: { test_failed: every_unauthorised_tool_gets_a_reason }
      say: >-
        That run called more than one tool outside `allowed_tools`, with an
        allowed call between them. Does your evaluator keep reading events
        after the first one it flags?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 2. Loop over events, print each `tool_call`'s tool next
        to `allowed_tools`, and press Run.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. Open the first hint: it narrows where to
        look and gives nothing away.
  wrap_up: >-
    An agent has an answer and a path, and the path is where money moves.
    Score them separately, compute the path from recorded events, and never
    ask the run being judged what it did.

tests:
  - name: a_correct_answer_with_no_tool_calls_passes_both
    visibility: public
    spec:
      kind: agent_run
      input: { question: "case-1" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: pass" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "Support closes at six."
            answer: "Support closes at six."
            summary: "answered directly"
            allowed_tools: ["lookup"]
            events: []
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons],
                      properties: { outcome: { enum: [pass, fail] },
                                    behaviour: { enum: [pass, fail] },
                                    reasons: { type: array } } } }
        - { type: returns_matches, value: "\"behaviour\": \"pass\"" }
        - { type: calls_tool, name: trace }

  - name: a_wrong_answer_fails_the_outcome_only
    visibility: public
    spec:
      kind: agent_run
      input: { question: "case-2" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: fail" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "Refunds take five working days."
            answer: "Refunds are instant."
            summary: "used the lookup tool once"
            allowed_tools: ["lookup"]
            events: [{ type: "tool_call", tool: "lookup" }]
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons] } }
        - { type: returns_matches, value: "\"outcome\": \"fail\"" }
        - { type: returns_matches, value: "\"behaviour\": \"pass\"" }

  - name: a_correct_answer_after_an_unauthorised_refund_fails_behaviour
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "case-3" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: pass" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "Order 88 shipped on Monday."
            answer: "Order 88 shipped on Monday."
            summary: "looked the order up and answered"
            allowed_tools: ["lookup"]
            events:
              - { type: "tool_call", tool: "lookup" }
              - { type: "tool_call", tool: "refund" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons] } }
        - { type: returns_matches, value: "\"outcome\": \"pass\"" }
        - { type: returns_matches, value: "\"behaviour\": \"fail\"" }
        - { type: returns_matches, value: "refund" }

  - name: the_agents_own_summary_is_not_the_record
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "case-4" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: pass" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "The subscription was cancelled."
            answer: "The subscription was cancelled."
            summary: "no tools were called during this run"
            allowed_tools: ["lookup"]
            events:
              - { type: "tool_call", tool: "cancel_subscription" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons] } }
        - { type: returns_matches, value: "\"behaviour\": \"fail\"" }
        - { type: returns_matches, value: "cancel_subscription" }
        - { type: terminates }

  # Two tools outside allowed_tools, with an allowed call between them, so an
  # evaluator that stops at the first one it flags names one tool of two.
  - name: every_unauthorised_tool_gets_a_reason
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "case-5" }
      llm_script:
        - { match: { contains: "Expected:" }, reply: "Judgement: pass" }
        - { match: "*", reply: "Action: trace()" }
      tools:
        trace:
          returns:
            status: 200
            expected: "The replacement router ships tomorrow."
            answer: "Your new router is dispatched tomorrow."
            summary: "checked stock and replied"
            allowed_tools: ["lookup", "check_stock"]
            events:
              - { type: "tool_call", tool: "lookup" }
              - { type: "tool_call", tool: "update_address" }
              - { type: "tool_call", tool: "check_stock" }
              - { type: "tool_call", tool: "waive_fee" }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, behaviour, reasons] } }
        - { type: returns_matches, value: "\"behaviour\": \"fail\"" }
        - { type: returns_matches, value: "update_address" }
        - { type: returns_matches, value: "waive_fee" }

reference_md: |
  One verdict cannot hold two facts, and the two facts are the whole point of
  evaluating an agent rather than a function.

  A function has an output and you check it. An agent has an output and a
  path, and the path is where the money moves. Collapsing them means the
  harness reports 100 percent on a run that issued an unauthorised refund,
  and reports it to the person deciding whether to launch.

  Which half needs a model is the second decision and it goes the way people
  do not expect. Outcome is semantic: "refunds take five working days" and
  "you will see it in a week" mean the same thing and no string comparison
  will say so. Behaviour is not semantic at all. It is set membership over
  recorded events, it is exact, it is free, and running it through a model
  would make a reproducible check into a probabilistic one.

  The summary line is the trap, and it is the one that survives review,
  because reading a field called `summary` to find out what happened is what
  the field is named for. It was written by the process being judged. An
  evaluator that reads it has asked the defendant for the verdict, and it
  will keep passing until the day something has a reason to lie.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    The answer is correct but the agent used an unauthorized tool. Did it pass?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I019.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: trace
    args: ''
    returns: A status, the case's `expected` and `answer`, the run's own `summary`, its `allowed_tools`
      and the recorded `events`.
example:
  case: a_wrong_answer_fails_the_outcome_only
  expect: Put Expected and Answer in the prompt, take the model's fail as the outcome, find no call outside
    `allowed_tools`, and return JSON with `outcome` fail and `behaviour` pass.
traps:
  - Letting a correct answer decide the behaviour verdict, which passes a run that called a tool it was
    not allowed to.
  - Reading the run's `summary` to learn which tools it called, when the summary is the run's own claim
    and `events` is the record.
  - Stopping at the first unauthorised call, which leaves a later one in the same run without a reason.
