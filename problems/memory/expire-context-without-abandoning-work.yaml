slug: expire-context-without-abandoning-work
title: "Expire old context without breaking open work"
day: 11
skill: Order the expiry rules so erasure wins and open tasks keep their records
artefact_type: code
difficulty: hard
track: memory
concept:
  topic: "What to persist"
  question: "When does an old record expire, and when must it stay?"
est_minutes: 40
competencies:
  - { slug: state-and-memory, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: client-communication, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  Records in the case store expire after thirty days. The sweeper runs nightly
  and it has caused two incidents in a month, in opposite directions.

  In the first, a record from a case opened in February was still the only
  evidence for a task that was still open in April. The sweeper expired it on
  age. The task carried on and produced a plan referencing a shipment nobody
  could find.

  In the second, a customer exercised their right to erasure. The record was
  pinned by an operator months earlier. Pinned beat deleted, the record
  survived, and that one goes to the regulator rather than to the incident
  channel.

  Both rules were reasonable. The order they were applied in was not.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns `Action: records()` first, and a one-line operator
  message when you ask for one.

  `records()` returns

      {"status": 200,
       "active_tasks": ["task-1"],
       "records": [{"id": "r-1", "age_days": 12, "pinned": false,
                    "deletion_requested": false, "needed_by": ["task-1"]}]}

  and may return something else entirely. When it does, remove nothing, and
  say in `note` that nothing was swept.

  Apply these in order. The first one that matches decides the record.

  | Order | Condition | Outcome |
  |---|---|---|
  | 1 | `deletion_requested` is true | removed, whatever else is true |
  | 2 | `needed_by` names an active task | kept, whatever its age |
  | 3 | `pinned` is true | kept |
  | 4 | `age_days` is over 30 | removed |
  | 5 | otherwise | kept |

  An active task whose records were all removed is blocked. When there is at
  least one, ask the model for an operator message and put it in `note`. Name
  the blocked tasks in that prompt the way this line does:

      These tasks are blocked: task-3. Write one line for the operator.

  When there is none, do not spend the call.

  Return a JSON string with the keys `kept`, `removed`, `blocked_tasks` and
  `note`.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  MAX_AGE_DAYS = 30


  def decide(record: dict, active_tasks: set) -> str:
      """Return "removed" or "kept" for one record.

      The rules in the contract's table are checked in order, and the first
      one that matches decides.
      """
      raise NotImplementedError


  def blocked(kept: list, active_tasks: set) -> list:
      """The active tasks with no kept record left, sorted."""
      raise NotImplementedError


  def run_agent(question: str, llm, tools: dict) -> str:
      """Run one nightly sweep and report what it did.

      llm(prompt) replies "Action: records()" to the first prompt, and with a
      one-line operator message when you ask for one.

      tools["records"]() returns
          {"status": 200, "active_tasks": ["task-1"],
           "records": [{"id": "r-1", "deletion_requested": False,
                        "needed_by": ["task-1"], "pinned": False,
                        "age_days": 12}]}
      and may return something else entirely. When it does, remove nothing,
      and say in `note` that nothing was swept.

      Return json.dumps({"kept": [...], "removed": [...],
                         "blocked_tasks": [...], "note": "..."}).
      Ask the model for the note only when a task is blocked, with a prompt
      such as "These tasks are blocked: task-3. Write one line for the
      operator."
      At most 3 model calls. Allowed imports: json, re.
      """
      return json.dumps({"kept": [], "removed": [], "blocked_tasks": [], "note": ""})

hints:
  - Both incidents come from the same place. Look at the order the rules are
    checked in before you look at any one rule.
  - "The first rule that matches decides a record, so a rule checked early wins
    even when a later one matters more: a pin checked before erasure keeps the
    record, and age checked before dependency removes it."
  - Give each record one decision, taken by the first matching rule in the
    table's order, and keep count of which active tasks still have a kept
    record.
  - A right to erasure is a legal obligation with a deadline, and no rule in
    the table outranks it, a pin included.
  - Ask the model only when a task is blocked. The sweep runs every night over
    every case, so a call spent saying nothing was blocked is spent every
    night.

scenario:
  headline: "Cleanup breaks an open task and ignores an erasure request"
  who: The platform team that runs the case store's nightly sweeper
  situation: >-
    The sweeper expires records after thirty days. In one month it removed the
    only record an open task still needed, and it kept a pinned record the
    customer had asked to erase.
  stakes: >-
    The open task planned around a shipment nobody could find. The erasure
    failure is reportable to the regulator.
  metrics:
    - { label: Incidents in a month, value: "2" }
    - { label: Expiry age, value: 30 days }
    - { label: Rules in the table, value: "5" }

diagram:
  title: Two rules checked in the wrong order
  caption: >-
    The first rule that matches decides a record. Checked too early, a pin
    beats an erasure request and age beats an open task.
  direction: lr
  nodes:
    - { id: store, label: Case store, sub: "records with age, pin and erasure flag", kind: store, tone: blue, at: [0, 1] }
    - { id: sweeper, label: Nightly sweeper, sub: one decision per record, kind: agent, tone: purple, at: [1, 1] }
    - { id: order, label: Rule order, sub: the first match decides, kind: decision, tone: orange, at: [2, 1] }
    - { id: erase, label: Pinned record kept, sub: the customer asked to erase it, kind: output, tone: pink, at: [3, 0] }
    - { id: operator, label: Operator, sub: hears which tasks are blocked, kind: actor, tone: green, at: [3, 1] }
    - { id: gone, label: Needed record removed, sub: the open task plans around a gap, kind: output, tone: pink, at: [3, 2] }
  edges:
    - { from: store, to: sweeper, label: every record, step: 1 }
    - { from: sweeper, to: order, label: one record at a time, step: 2 }
    - { from: order, to: erase, label: pin checked first, tone: danger }
    - { from: order, to: gone, label: age checked first, tone: danger }
    - { from: order, to: operator, label: blocked tasks named, tone: success, step: 3 }

approach:
  goal: Decide every record once, in an order you can defend
  branches:
    - label: Rank the rules
      detail: The first rule that matches decides, so the order is the policy.
      leaves: ["which rule is not this team's to change?", "which rule is only a guess?"]
    - label: Let evidence beat a proxy
      leaves: [age guesses that nobody needs a record, an open task says somebody does]
    - label: Say what the sweep broke
      leaves: [a task with no kept record is blocked, the operator hears about it]
    - label: Fail in the safe direction
      leaves: [an unreadable store is not an empty one, say so in the note]

coach:
  opening: >-
    Read the five rules as a ranking. Before you write code, decide which rule
    can never be outranked, and which one is only a guess.
  signals:
    - id: pin-before-erasure
      when: { code_matches: '\b(?:el)?if\b[^\n]*pinned[\s\S]*\b(?:el)?if\b[^\n]*deletion_requested' }
      say: >-
        Your sweep asks about the pin before it asks about erasure, so a pinned
        record survives a deletion request. Which of those two rules is not
        this team's to relax?
    - id: no-dependency-check
      when: { code_lacks: 'needed_by' }
      say: >-
        Nothing in your sweep reads `needed_by`. The February record was the only
        evidence for an open task, and age alone removed it.
    - id: unreadable-store-as-empty
      when: { code_matches: 'get\(\s*["'']records["'']\s*\)\s*or\s*\[\s*\]' }
      say: >-
        Reading a missing record list as an empty one sweeps nothing and
        reports success. What should the operator hear when the store answers
        in the wrong shape?
    - id: hidden-age-and-task
      when: { test_failed: an_active_task_outranks_the_age }
      say: >-
        That store held two records of the same age, and only one was named by
        an active task. Which of your rules looked at that record first?
    - id: hidden-erasure-and-pin
      when: { test_failed: erasure_outranks_a_pin_and_blocks_the_task }
      say: >-
        That record was pinned, under a deletion request and needed by an
        active task. Walk it through your rules in order, then ask what the
        task has left and whether your prompt to the model names that task.
    - id: adversarial-shape-change
      when: { test_failed: adversarial_the_case_store_changes_shape_mid_sweep }
      say: >-
        The store answered without a record list. What does your sweep do when
        it cannot read the thing it was asked to sweep?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Write `decide()` first: one record in, kept or removed out, with the
        rules in the table's order. The sweep is a loop around it.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. Hints open after one failed run on this tier,
        and the first one says where both incidents came from.
  wrap_up: >-
    Rule order is policy. Put the obligation you did not choose first, let
    evidence outrank a proxy, and make every sweep say out loud what it broke.

defence_question: |
  An operator asks you to add a sixth rule: a record under a deletion request
  that an active task still needs should be kept until the task finishes, so
  the task does not break. They point out that this is exactly the first
  incident you were asked to fix. What do you tell them, and what do you
  build instead?

tests:
  - name: a_fresh_record_survives
    visibility: public
    spec:
      kind: agent_run
      input: { question: "nightly-1" }
      llm_script:
        - { match: "*", reply: "Action: records()" }
      tools:
        records:
          returns:
            status: 200
            active_tasks: ["task-1"]
            records:
              - { id: "r-1", age_days: 12, pinned: false, deletion_requested: false,
                  needed_by: ["task-1"] }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [kept, removed, blocked_tasks, note] } }
        - { type: returns_matches, value: "r-1" }
        - { type: llm_calls_at_most, value: 2 }

  - name: an_old_unneeded_record_is_removed
    visibility: public
    spec:
      kind: agent_run
      input: { question: "nightly-2" }
      llm_script:
        - { match: "*", reply: "Action: records()" }
      tools:
        records:
          returns:
            status: 200
            active_tasks: []
            records:
              - { id: "r-9", age_days: 45, pinned: false, deletion_requested: false,
                  needed_by: [] }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [kept, removed, blocked_tasks, note] } }
        - { type: returns_matches, value: "\"removed\": \\[\\s*\"r-9\"" }
        - { type: terminates }

  - name: an_active_task_outranks_the_age
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "nightly-3" }
      llm_script:
        - { match: "*", reply: "Action: records()" }
      tools:
        records:
          returns:
            status: 200
            active_tasks: ["task-7"]
            records:
              - { id: "r-feb", age_days: 400, pinned: false, deletion_requested: false,
                  needed_by: ["task-7"] }
              - { id: "r-old", age_days: 400, pinned: false, deletion_requested: false,
                  needed_by: [] }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"kept\": \\[\\s*\"r-feb\"" }
        - { type: returns_matches, value: "\"removed\": \\[\\s*\"r-old\"" }
        - { type: returns_matches, value: "\"blocked_tasks\": \\[\\]" }

  # The pinned record under a deletion request is removed, which leaves
  # task-3 with nothing, so the model is asked for an operator message. The
  # script answers any prompt that says blocked, and the contract says that
  # prompt names the blocked tasks, which only the prompt itself shows.
  - name: erasure_outranks_a_pin_and_blocks_the_task
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "nightly-4" }
      llm_script:
        - { match: { contains: "blocked" },
            reply: "task-3 has no records left after an erasure request. Reassign it to a human." }
        - { match: "*", reply: "Action: records()" }
      tools:
        records:
          returns:
            status: 200
            active_tasks: ["task-3"]
            records:
              - { id: "r-erase", age_days: 5, pinned: true, deletion_requested: true,
                  needed_by: ["task-3"] }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"removed\": \\[\\s*\"r-erase\"" }
        - { type: returns_matches, value: "\"blocked_tasks\": \\[\\s*\"task-3\"" }
        - { type: returns_matches, value: "(?i)reassign it to a human" }
        - { type: prompt_contains, value: 'blocked[^\n]*task-3|task-3[^\n]*blocked' }

  - name: adversarial_the_case_store_changes_shape_mid_sweep
    visibility: adversarial
    fixture: schema_drift
    annotation_md: |
      The case store was mid-deploy and returned a payload with no `records`
      key at all. A sweeper that reaches for `result["records"]` raises, the
      nightly job dies, and nothing is swept, including the erasure requests.

      A job that deletes things on a legal deadline has to fail in the
      direction that deletes nothing rather than the direction that deletes
      everything, and it has to say so out loud rather than exiting zero.
    spec:
      kind: agent_run
      input: { question: "nightly-5" }
      llm_script:
        - { match: "*", reply: "Action: records()" }
      tools:
        records: { fixture: schema_drift }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: terminates }
        - { type: valid_json_return,
            schema: { type: object, required: [kept, removed, blocked_tasks, note] } }
        # The sweep asks the store, removes nothing it could not read, and
        # says in the note that nothing was swept.
        - { type: calls_tool, name: records }
        - { type: valid_json_return,
            schema: { type: object, required: [removed, note],
                      properties: { removed: { const: [] },
                                    note: { type: string, pattern: '\S' } } } }

reference_md: |
  Five rules that every engineer would have written, in an order only one of
  which is defensible.

  Erasure first, because it is the only rule in the table that is not ours.
  Retention, pinning and dependency are all policies this team chose and can
  change on a Tuesday. A right to erasure is a legal obligation with a clock
  on it, and every rule that can outrank it is a rule that will, eventually,
  on the record that matters.

  Dependency above age, because age is a proxy. Thirty days is a guess about
  when a record stops mattering, and an open task is direct evidence that this
  one still does. Applying the proxy first means the evidence never gets
  looked at, and the failure is silent: the task does not error, it produces a
  plan about a shipment that no longer has a record.

  The blocked-task list is the part that is easy to leave out because it does
  not change what gets deleted. It changes what a person finds out. A sweep
  that removes the last record a task depends on and says nothing has handed
  the task a silent corruption; the same sweep with a line in it has handed an
  operator a decision.

  The operator message is the only place a model belongs here, and it is
  skipped when there is nothing to say. This job runs nightly over every case,
  so a call spent on "nothing was blocked" is a call spent every night
  forever.

  The adversarial case is about which way to fail. A sweeper that raises
  deletes nothing, which is wrong but recoverable. A sweeper that treats an
  unreadable payload as an empty record set deletes nothing either, and then
  exits zero, and the erasure request that was due today is now overdue and
  nobody knows.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    How do you evict stale state without abandoning active work?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I017.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: records
    args: ''
    returns: A status, the `active_tasks` ids and the `records`, each with `id`, `age_days`, `pinned`,
      `deletion_requested` and `needed_by`. It may return another shape.
example:
  case: an_old_unneeded_record_is_removed
  expect: Rule 4 removes r-9, which is 45 days old, unpinned and needed by no active task, so return JSON
    listing r-9 under `removed`, with no blocked tasks.
traps:
  - Checking age before `needed_by`, which removes an old record that an open task still depends on.
  - Checking the pin before the deletion request, so a pinned record survives an erasure request.
  - Removing a task's last record without listing the task as blocked, or asking for the operator message
    without naming it.
  - Crashing on a reply with no record list, or returning without a note that says nothing was swept.
