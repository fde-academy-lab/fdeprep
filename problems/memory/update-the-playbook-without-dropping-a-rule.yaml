              refused:
                type: array
                minItems: 1
                maxItems: 1
                items: { properties: { reason: { const: required }, edit: { properties: { step: { const: identity } } } } }

reference_md: |
  A playbook is the agent's procedural memory: it decides what the agent does,
  and in what order, on every ticket of its kind. A wrong fact in memory
  misleads the answers that use it. A wrong step is wrong for every caller
  until somebody notices, which in September took six days. So the model never
  writes the playbook. It proposes edits, and code decides which ones the
  playbook takes.

  An edit is one operation with a target, which is what makes it checkable.
  The September rewrite read like a better playbook and lacked the identity
  step, and the only way to see that was to compare it with the old one line
  by line. The same change as an edit is a `remove` of a step marked
  `required`, and refusing it takes one comparison.

  Required steps belong to teams outside the helpdesk, so the optimiser may
  move them and nothing more. A removed identity check is easy to spot, and a
  reworded one is not. "Verify the caller by asking for their employee number"
  keeps a step called identity and drops the control security put there,
  because an employee number is printed on every badge.

  Support is counted by the code, against the week's feedback. The model's
  list of tickets is a claim, and it can repeat one ticket or cite tickets the
  week never had. The Pune rule was one reviewer's comment on one ticket,
  cited as if it were a pattern. Three different tickets from this week's
  feedback is a low bar, and the model cannot clear it by saying so.

  Two edits that pull one step in different directions are a disagreement
  between reviewers, and settling it by order is how the newer comment won in
  September. Neither edit is applied, both are held, and the person who owns
  the playbook decides. A reply that is not a list of edits changes nothing:
  the optimiser was asked for edits, and a whole new playbook is the
  September rewrite arriving again.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Your agent updates its own instructions from reviewer feedback every week. What stops it from unlearning a compliance rule?
  source: |
    Author judgement. The nearest entry in the FDE interview bank, docs/source-pack/09-interview-bank.json
    I018, asks how a corrected fact becomes wrong again, and carries the bank's caveat that actual
    employer frequency is unverified.

tools:
  - name: playbook
    args: issue
    returns: The playbook's `steps` in the order the agent runs them, each with an `id`, its `text`, `required` and the `owner`.
  - name: save_playbook
    args: issue, steps, held
    returns: '`{"status": 200}` once the playbook and the held edits are recorded.'
example:
  case: moves_the_certificate_check_and_refuses_a_one_ticket_rule
  expect: >-
    The reorder cites five tickets from the feedback, so the certificate check moves to second
    place. The Pune rule cites one ticket and is refused with the reason `support`.
traps:
  - Counting the tickets the model lists, when it can list one ticket three times or cite tickets the feedback never had.
  - Guarding a required step against removal and letting a reword hollow it out.
  - Applying two edits that disagree, so whichever comes last wins and nobody decides.
  - Applying whatever the optimiser returns when it is not a list of edits.
