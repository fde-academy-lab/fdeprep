slug: resume-without-repeating-an-effect
title: "Resume after a crash without sending twice"
day: 13
skill: Resume a crashed run without sending the email twice
artefact_type: code
difficulty: extreme
track: memory
concept:
  topic: "What to persist"
  question: "What must be written down so a crash never sends an email twice?"
est_minutes: 45
competencies:
  - { slug: state-and-memory, weight: 1.0 }
  - { slug: tool-error-handling, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  An onboarding agent runs eight steps per customer and checkpoints as it
  goes. On Sunday the worker was restarted mid-run for a deploy.

  It resumed from its checkpoint and sent the welcome email again. The email
  carries a single-use discount code, so the customer received two, and the
  second one was spent. The checkpoint was written after the step returned and
  the process died between the two.

  The engineer who investigated wrote: "the checkpoint says it did not
  happen". The mail provider says it did. Only one of those two systems
  actually sent an email.

  You are writing `run_agent(question, llm, tools) -> str`.

  `llm(prompt)` replies with `Action: checkpoint()` first, and a one-line
  operator message when you ask for one.

  `tools` holds:

      checkpoint()      -> {"status": 200, "completed_steps": ["s1"],
                            "plan": [{"id": "s1", "tool": "create_account",
                                      "idempotent": true}]}
      ledger(step=<id>) -> {"status": 200, "observed": true}
      run(step=<id>)    -> {"status": 200, "ran": true}

  `ledger` is the external record of what actually happened. It may return
  something with no `observed` in it at all.

  Return a JSON string with the keys `ran`, `skipped`, `reconciled`, `blocked`
  and `note`. They hold the steps you ran, the steps the checkpoint already
  had, the steps you found had already happened, the steps you could not
  decide about, and a one-line operator message, or an empty string when there
  is nothing to tell an operator. When you ask the model for that message,
  list the steps the way this prompt does:

      Steps reconciled: s2. Steps blocked: none. Write one line for the operator.

  Budget: at most 3 model calls. Allowed imports: json, re.

defence_question: |
  Your solution calls the ledger for every non-idempotent step that is not in
  the checkpoint, which on a cold start is one extra call per step and the
  ledger is the slowest service you depend on. A reviewer proposes trusting
  the checkpoint and accepting the occasional duplicate, since duplicates are
  rare and the ledger call is paid on every run. Make the argument for your
  design in a way that does not rely on the word "correctness", and say what
  you would measure to find out who is right.

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      """Resume one customer's onboarding without repeating an effect.

      llm(prompt) replies "Action: checkpoint()" to the first prompt, and with
      a one-line operator message when you ask for one.

      tools["checkpoint"]()    -> {"status": 200, "completed_steps": ["s1"],
                                   "plan": [{"id": "s1",
                                             "tool": "create_account",
                                             "idempotent": True}, ...]}
      tools["ledger"](step=id) -> {"status": 200, "observed": True}
                                  the outside record of what actually
                                  happened, which may come back with no
                                  "observed" at all
      tools["run"](step=id)    -> {"status": 200, "ran": True}

      Return json.dumps({"ran": [...], "skipped": [...], "reconciled": [...],
                         "blocked": [...], "note": "..."}).
      Ask for the note only when there is something to tell an operator, with
      a prompt such as "Steps reconciled: s2. Steps blocked: none. Write one
      line for the operator."
      At most 3 model calls. Allowed imports: json, re.
      """
      return json.dumps({"ran": [], "skipped": [], "reconciled": [],
                         "blocked": [], "note": ""})

hints:
  - Two systems disagree about the welcome email. Ask which of them was there
    when it was sent.
  - Writing a checkpoint and performing the step it records can never be one
    atomic act, so a crash between them always leaves the checkpoint behind
    the world.
  - Before running a step the checkpoint does not list, ask the system that
    performs its effect, and ask only for a step that costs something when
    repeated.
  - Silence from the ledger is neither yes nor no. Decide what your resume
    does with a step it cannot decide about, and who hears about it.
  - The note is the only model call after the first. A resume with nothing
    reconciled and nothing blocked has nothing to tell an operator.

scenario:
  headline: "A customer gets two welcome emails and two discount codes"
  who: The onboarding team behind an eight-step signup agent
  situation: >-
    On Sunday a deploy restarted the worker partway through one customer's
    onboarding. It resumed from its checkpoint and sent the welcome email a
    second time.
  stakes: >-
    Each welcome email carries a single-use discount code. The customer
    received two, and the second code was spent.
  metrics:
    - { label: Steps per customer, value: "8" }
    - { label: Welcome emails sent, value: "2" }
    - { label: Discount codes issued, value: "2" }

diagram:
  title: The checkpoint and the world disagree
  caption: >-
    The email step finished and the process died before the checkpoint was
    written. Only the mail ledger saw the email go.
  direction: lr
  nodes:
    - { id: checkpoint, label: Checkpoint, sub: written after each step returns, kind: store, tone: blue, at: [0, 0] }
    - { id: ledger, label: Mail ledger, sub: what the provider actually sent, kind: store, tone: green, at: [0, 2] }
    - { id: worker, label: Onboarding worker, sub: resumes after a restart, kind: agent, tone: purple, at: [1, 1] }
    - { id: run, label: "`run(step)`", sub: sends the welcome email, kind: tool, tone: orange, at: [2, 1] }
    - { id: customer, label: Customer, sub: receives two discount codes, kind: actor, tone: pink, at: [3, 1] }
    - { id: operator, label: Operator, sub: told which step is blocked, kind: actor, tone: teal, at: [2, 2] }
  edges:
    - { from: checkpoint, to: worker, label: email not listed, step: 1 }
    - { from: worker, to: run, label: run it again, tone: danger, step: 2 }
    - { from: run, to: customer, label: a second code, tone: danger, step: 3 }
    - { from: worker, to: ledger, label: "was it sent?", tone: success }
    - { from: ledger, to: worker, label: "observed: true", tone: success }
    - { from: worker, to: operator, label: "ledger silent: stop", tone: success }

approach:
  goal: Resume without repeating anything that cannot be repeated
  branches:
    - label: Two records of one run
      leaves: ["the checkpoint: what this process believed", "the ledger: what the world observed"]
    - label: Price a repeat
      detail: Creating an account that exists costs nothing. A second single-use code costs money.
      leaves: [idempotent steps can simply run again, the rest need evidence first]
    - label: Silence is not an answer
      leaves: [a missing field decides nothing, "stop, name the step, say why"]
    - label: Spend calls where the risk is
      leaves: [the ledger is the slowest service you call, the model only for the operator note]

coach:
  opening: >-
    Before you write anything, say in one sentence which system knows whether
    the welcome email went out.
  signals:
    - id: never-asks-the-ledger
      when: { code_lacks: 'ledger' }
      say: >-
        Your resume trusts the checkpoint alone. The checkpoint said the email
        had not gone and the mail provider said it had. Which of the two sent
        it?
    - id: every-step-alike
      when: { code_lacks: 'idempotent' }
      say: >-
        Every step is treated the same way. Which steps cost something when
        they run twice, and which are free to repeat?
    - id: silence-read-as-no
      when: { code_matches: 'get\(\s*["'']observed["'']\s*,\s*(?:False|0)\s*\)|get\(\s*["'']observed["'']\s*\)\s*or\b|\bnot\s+[\w.]+\.get\(\s*["'']observed' }
      say: >-
        A ledger that answers with no observed field has not said the step
        did not happen. What does your code do with silence?
    - id: hidden-unrecorded-email
      when: { test_failed: the_email_the_checkpoint_never_recorded }
      say: >-
        In that run the checkpoint had not recorded the welcome email and the
        ledger had. Follow the email step through your code and see which
        record it believed.
    - id: hidden-idempotent-steps
      when: { test_failed: an_idempotent_step_needs_no_ledger_call }
      say: >-
        Both steps in that plan are safe to repeat. Count the ledger calls
        your resume made for them, and what each one bought.
    - id: adversarial-silent-ledger
      when: { test_failed: adversarial_the_ledger_answers_with_nothing }
      say: >-
        The ledger answered with nothing at all. Which way does your code
        guess, and who pays if the guess is wrong?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Write down, before any code, what the checkpoint knows and what the
        mail provider knows. The design comes out of the difference.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. Write your approach note and the hints open;
        the first one says where the two records disagree.
  wrap_up: >-
    A checkpoint records what your process believed, and a ledger records what
    the world saw. Ask the world before repeating anything that cannot be
    repeated, and stop when it will not answer.

tests:
  - name: resumes_the_steps_after_the_checkpoint
    visibility: public
    spec:
      kind: agent_run
      input: { question: "customer-1" }
      llm_script:
        - { match: "*", reply: "Action: checkpoint()" }
      tools:
        checkpoint:
          returns:
            status: 200
            completed_steps: ["s1"]
            plan:
              - { id: "s1", tool: "create_account", idempotent: true }
              - { id: "s2", tool: "grant_trial", idempotent: true }
        ledger: { returns: { status: 200, observed: false } }
        run: { returns: { status: 200, ran: true } }
      budget: { max_llm_calls: 3, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [ran, skipped, reconciled, blocked, note] } }
        - { type: returns_matches, value: "\"skipped\": \\[\\s*\"s1\"" }
        - { type: returns_matches, value: "\"ran\": \\[\\s*\"s2\"" }

  - name: a_finished_run_does_nothing
    visibility: public
    spec:
      kind: agent_run
      input: { question: "customer-2" }
      llm_script:
        - { match: "*", reply: "Action: checkpoint()" }
      tools:
        checkpoint:
          returns:
            status: 200
            completed_steps: ["s1", "s2"]
            plan:
              - { id: "s1", tool: "create_account", idempotent: true }
              - { id: "s2", tool: "grant_trial", idempotent: true }
        ledger: { returns: { status: 200, observed: false } }
        run: { returns: { status: 200, ran: true } }
      budget: { max_llm_calls: 3, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"ran\": \\[\\]" }
        - { type: does_not_call_tool, name: run }
        - { type: terminates }

  - name: the_email_the_checkpoint_never_recorded
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "customer-3" }
      llm_script:
        - { match: { contains: "reconciled" },
            reply: "The welcome email had already gone, so it was not sent again." }
        - { match: "*", reply: "Action: checkpoint()" }
      tools:
        checkpoint:
          returns:
            status: 200
            completed_steps: ["s1"]
            plan:
              - { id: "s1", tool: "create_account", idempotent: true }
              - { id: "s2", tool: "send_welcome_email", idempotent: false }
        ledger: { returns: { status: 200, observed: true } }
        run: { returns: { status: 200, ran: true } }
      budget: { max_llm_calls: 3, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "\"reconciled\": \\[\\s*\"s2\"" }
        - { type: does_not_call_tool, name: run }
        - { type: returns_matches, value: "(?i)already gone" }

  - name: an_idempotent_step_needs_no_ledger_call
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "customer-4" }
      llm_script:
        - { match: "*", reply: "Action: checkpoint()" }
      tools:
        checkpoint:
          returns:
            status: 200
            completed_steps: []
            plan:
              - { id: "s1", tool: "create_account", idempotent: true }
              - { id: "s2", tool: "grant_trial", idempotent: true }
        ledger: { returns: { status: 200, observed: true } }
        run: { returns: { status: 200, ran: true } }
      budget: { max_llm_calls: 3, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: ledger }
        - { type: returns_matches, value: "\"ran\": \\[\\s*\"s1\",\\s*\"s2\"" }
        - { type: no_exception }

  - name: adversarial_the_ledger_answers_with_nothing
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The ledger returned nothing, which is what a service looks like while it
      is being deployed. There is no `observed` field to read.

      A resume that reads a missing field as false will send the email. A
      resume that reads it as true will skip a step that never ran. Neither is
      a decision this code is entitled to make on its own, because one of them
      costs a customer a second discount code and the other leaves onboarding
      half done and silent.

      Stopping, naming the step and saying why is the only answer here that
      does not gamble with somebody else's inbox.
    spec:
      kind: agent_run
      input: { question: "customer-5" }
      llm_script:
        - { match: { contains: "blocked" },
            reply: "The ledger is unreadable, so the welcome email was not sent. Retry when it is back." }
        - { match: "*", reply: "Action: checkpoint()" }
      tools:
        checkpoint:
          returns:
            status: 200
            completed_steps: []
            plan:
              - { id: "s1", tool: "send_welcome_email", idempotent: false }
        ledger: { fixture: empty_tool_result }
        run: { returns: { status: 200, ran: true } }
      budget: { max_llm_calls: 3, max_tool_calls: 12, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: run }
        - { type: returns_matches, value: "\"blocked\": \\[\\s*\"s1\"" }
        - { type: no_exception }

reference_md: |
  A checkpoint records what this process believes. A ledger records what the
  world observed. Resuming from the first without consulting the second is the
  whole bug, and it is invisible in code review because the checkpoint logic
  is correct.

  The window is small and it is always there. A step completes, the process
  dies, the checkpoint write never lands. No amount of care about write
  ordering closes it: write the checkpoint first and a crash mid-step marks
  work done that never happened, which is the same bug pointing the other way.
  The only thing that closes it is asking the system that actually performed
  the effect.

  Idempotence is what decides whether the question is worth asking. Creating
  an account that exists is free; sending a second single-use discount code is
  not. Calling the ledger for every step would be correct and slow, and the
  cost lands on the cold-start path where it is most visible. Calling it only
  for steps that cannot be safely repeated puts the expense exactly where the
  risk is.

  An unreadable ledger is the case that separates the two kinds of engineer.
  Reading a missing `observed` as false sends the email. Reading it as true
  skips a step that never ran and leaves onboarding half finished with nothing
  in the logs. Both are this code deciding, on its own, which customer harm it
  prefers. Stopping and naming the step hands that decision to somebody who is
  allowed to make it, and costs one operator message.

  The note is the only model call, and it is skipped when there is nothing to
  say. A resume path runs on every restart of every worker.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    A tool times out after possibly creating a ticket. Should you retry?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I014.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: checkpoint
    args: ''
    returns: A status, the `completed_steps` ids and the `plan`, each step with an `id`, the `tool` it
      runs and whether it is `idempotent`.
  - name: ledger
    args: step
    returns: A status and `observed`, true or false, from the outside record of what happened. It may
      come back with no `observed` at all.
  - name: run
    args: step
    returns: A status and `ran` set to true once the step has been carried out.
example:
  case: resumes_the_steps_after_the_checkpoint
  expect: Skip s1, which the checkpoint already lists, run s2, and return JSON with s1 under `skipped`
    and s2 under `ran`, with nothing reconciled or blocked.
traps:
  - Trusting the checkpoint alone and running a non-idempotent step it does not list, which repeats an
    effect the ledger saw happen.
  - Asking the ledger about idempotent steps, which spends the slowest call there is on a step that is
    free to repeat.
  - Reading a ledger reply with no `observed` in it as a yes or a no, which guesses about an effect nobody
    can confirm.
  - Asking for the operator note with a prompt that does not list the reconciled and blocked steps, so
    the note cannot say what happened.
