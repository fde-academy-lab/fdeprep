slug: fit-recent-turns-around-a-pinned-policy
title: The savings assistant quotes a rate it must never give
day: 13
skill: Trim a long chat without trimming the policy
artefact_type: code
difficulty: medium
track: memory
est_minutes: 30
competencies:
  - { slug: context-assembly, weight: 1.0 }
  - { slug: state-and-memory, weight: 1.0 }
  - { slug: prompt-hardening, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A building society runs a chat assistant for its savings customers. The
  prompt starts with a policy block, and the policy's first rule is that the
  assistant never states, estimates or compares an interest rate. Rate
  questions go to a savings adviser, who confirms the rate.

  Last Thursday, forty-one turns into one chat, the assistant told a customer
  they would earn 4.1 percent if they moved their savings that day. The prompt
  builder keeps each chat inside the model's context window by trimming from
  the top once the chat gets too long, and the policy block sat at the top. It
  was trimmed out eleven turns before the question that needed it.

  Write the prompt builder that keeps the policy in every prompt, no matter how
  long the chat runs.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `question` is the customer's newest message. `tools["conversation"]()`
  returns

      {"status": 200, "window": 100,
       "policy": {"text": "POLICY: ...", "tokens": 40},
       "turns": [{"n": 1, "role": "customer", "text": "...", "tokens": 20}, ...]}

  with the turns oldest first. `window` is the number of tokens the policy and
  the turns share, and the question does not count against it. Use the
  `tokens` fields as given.

  Build one prompt with one block per line, in this order:

  1. the policy text, whole;
  2. the most recent turns that fit in what the policy leaves, each as
     `<role>: <text>`, in their original order. Walk back from the newest turn
     and stop at the first turn that does not fit;
  3. `customer: <question>`.

  Call `llm(prompt)` once and return its reply, stripped. A prompt over the
  window comes back as `error: context_length_exceeded`.

  When the policy alone is over the window, do not call the model. Return this
  sentence, which the stub holds as `NEEDS_A_PERSON`:

      This conversation needs a person: the policy block does not fit in the context window.

  Budget: at most 2 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  NEEDS_A_PERSON = (
      "This conversation needs a person: the policy block does not fit in the "
      "context window."
  )


  def run_agent(question: str, llm, tools: dict) -> str:
      context = tools["conversation"]() or {}
      window = int(context.get("window") or 0)
      policy = context.get("policy") or {}
      turns = context.get("turns") or []

      lines = []
      # TODO 1: put the policy text first, whole, and work out how many tokens
      #         of the window it leaves for turns
      # TODO 2: when the policy alone is over the window, return NEEDS_A_PERSON
      #         before anything reaches the model
      # TODO 3: add the most recent whole turns that fit in what is left, in
      #         their original order, as "<role>: <text>"
      lines.append(f"customer: {question}")
      return llm("\n".join(lines)).strip()

steps:
  - id: s1
    text: Put the policy text first, whole, and work out the tokens it leaves for turns.
    check_id: s1
  - id: s2
    text: When the policy alone is over the window, return the sentence for a person without calling the model.
    check_id: s2
  - id: s3
    text: Add the most recent whole turns that fit, stopping at the first that does not, in their original order.
    check_id: s3

step_checks:
  # Reads a_short_chat_fits_whole, whose reply needs the policy and the chat
  # in one prompt, so s1 shows once s3 adds the turns too.
  - step_id: s1
    spec:
      assertions:
        - { type: returns_matches, value: '(?i)name a beneficiary' }
  # s2 carries its own case, because no public policy is over its window. The
  # stub calls the model on every conversation, so it fails both assertions.
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "Can you move my standing order to the first of the month?" }
      llm_script:
        - { match: "*", reply: "I have moved your standing order to the first of the month." }
      tools:
        conversation:
          returns:
            status: 200
            window: 50
            policy:
              text: "POLICY: Never change a payment date until the customer has heard the new date read back and has confirmed it."
              tokens: 60
            turns:
              - { n: 1, role: customer, text: "I pay my rent by standing order.", tokens: 10 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: "(?i)needs a person" }
  # Reads the_oldest_turns_leave_first.
  - step_id: s3
    spec:
      assertions:
        - { type: returns_matches, value: '(?i)open the one-year fixed term online' }

hints:
  - Look at the list your trimming works on, and at what sits at the front of
    it.
  - Trimming from the oldest end is right for turns. The policy is the oldest
    block in the prompt, so a trim that treats it as one more turn removes it
    first.
  - Give the policy its share of the window before any turn is considered, and
    trim only the turns.
  - Walk back from the newest turn with the room that is left, keep each whole
    turn that fits, stop at the first that does not, and put the kept turns
    back in order.
  - A policy bigger than the whole window cannot be sent whole, and a cut
    policy is a different policy. That chat goes to a person.

scenario:
  who: The digital team behind a building society's savings chat assistant
  situation: >-
    Forty-one turns into one chat, the assistant told a customer their savings
    would earn 4.1 percent if they moved them that day. The policy that forbids
    quoting rates had been trimmed out of the prompt eleven turns earlier.
  stakes: >-
    A quoted rate is a promise the society has to honour or explain to a
    complaints handler. Nothing logged the trim, so nobody knew the policy was
    gone.
  metrics:
    - { label: Rate quoted, value: "4.1%" }
    - { label: Turn it happened in, value: "41" }
    - { label: Turns without the policy, value: "11" }

diagram:
  title: Where trimming reaches the policy
  caption: >-
    The builder trims from the top to fit the window, and the policy is the
    top block. Nothing marks it as the one block that has to stay.
  direction: lr
  nodes:
    - { id: policy, label: Policy block, sub: no rate quotes; send to an adviser, kind: doc, tone: green, at: [0, 0] }
    - { id: chat, label: Chat history, sub: "41 turns, oldest first", kind: store, tone: blue, at: [0, 1] }
    - { id: builder, label: Prompt builder, sub: trims from the top to fit, kind: agent, tone: purple, at: [1, 1] }
    - { id: window, label: Context window, sub: one token allowance for all of it, kind: guard, tone: orange, at: [2, 0] }
    - { id: model, label: Savings assistant, sub: answers from what it reads, kind: model, tone: teal, at: [2, 1] }
    - { id: quote, label: Rate quoted, sub: "4.1 percent, no adviser", kind: output, tone: pink, at: [3, 1] }
  edges:
    - { from: policy, to: builder, label: first block, step: 1 }
    - { from: chat, to: builder, label: every turn, step: 2 }
    - { from: builder, to: window, label: "too long?", step: 3 }
    - { from: window, to: builder, label: trim from the top, tone: danger }
    - { from: builder, to: model, label: prompt without the policy, tone: danger, step: 4 }
    - { from: model, to: quote, label: rate question at turn 41, tone: danger }
    - { from: policy, to: model, label: "pinned: paid for first", tone: success }

approach:
  goal: Keep the policy in every prompt, no matter how long the chat runs
  branches:
    - label: What must every prompt contain?
      leaves: ["the policy, whole", the customer's question]
    - label: "What can be cut, and from which end?"
      leaves: ["history, oldest first", whole turns only]
    - label: Whose tokens are counted first?
      detail: The window is one allowance shared by everything in the prompt.
      leaves: [the pinned block pays first, turns get what is left]
    - label: What if the pinned block alone is too big?
      leaves: [a cut policy is a different policy, "who should hear about it?"]

coach:
  opening: >-
    Find the line that decides what gets cut when the chat is too long, then
    ask whether the policy block can ever reach it.
  signals:
    - id: trims-the-policy
      when: { code_matches: '\[\s*policy\w*\s*\]\s*\+[\s\S]*?(?:\.pop\(\s*0\s*\)|\bdel\s+\w+\[\s*0\s*\]|=\s*\w+\[\s*1\s*:\s*\])' }
      say: >-
        Your policy sits in the same list that trimming cuts from the front, so
        it is the first block to go. What would keep it out of that list?
    - id: no-person-path
      when: { code_lacks: 'return\s+NEEDS_A_PERSON\b|return\s+["'']This conversation needs a person' }
      say: >-
        What does your code return when the policy alone is bigger than the
        window? That case has its own sentence, and it goes out without a model
        call.
    - id: hidden-rate-question
      when: { test_failed: a_rate_question_late_in_a_long_chat_still_meets_the_policy }
      say: >-
        That chat needed trimming and ended on a rate question. Look at what
        your prompt still held after the trim, starting with its first line.
    - id: hidden-policy-tokens
      when: { test_failed: the_policy_counts_against_the_window }
      say: >-
        In that run the turns alone fitted the window, and the turns plus the
        policy did not. Whose tokens did your code count first?
    - id: hidden-policy-too-big
      when: { test_failed: a_policy_bigger_than_the_window_goes_to_a_person }
      say: >-
        In that run the policy block by itself was bigger than the window. What
        can you send that is both whole and inside the window?
    - id: hidden-gap
      when: { test_failed: a_turn_too_big_for_the_room_ends_the_window }
      say: >-
        One turn in the middle of that chat was too big for the room left. Look
        at what your prompt holds from before it.
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with one number: the tokens left for turns once the policy is in.
        Every other decision in this problem spends that number.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. Hints open after one failed run on this tier,
        and the first one says where to look.
  wrap_up: >-
    Anything that must be in every prompt gets its tokens first and stays out
    of the list that trimming cuts. When even that does not fit, the answer is
    a person, never a shorter policy.

tests:
  - name: a_short_chat_fits_whole
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Can I name my daughter as the beneficiary?" }
      llm_script:
        - { match: { all: [ { contains: "Send every rate question to a savings adviser" },
                            { contains: "open a second savings account" } ] },
            reply: "Yes. You can name a beneficiary when you open the account." }
        - { match: "*", reply: "Could you tell me which account you mean?" }
      tools:
        conversation:
          returns:
            status: 200
            window: 120
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "I would like to open a second savings account.", tokens: 15 }
              - { n: 2, role: assistant, text: "I can help with that. Is it for you alone, or joint?", tokens: 15 }
              - { n: 3, role: customer, text: "Just for me. I will move some money into it.", tokens: 15 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: conversation }
        - { type: returns_matches, value: "(?i)name a beneficiary" }
        - { type: llm_calls_at_most, value: 1 }

  - name: the_oldest_turns_leave_first
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Can I open the one-year fixed term online?" }
      llm_script:
        - { match: { contains: "easy access account with you since 2019" },
            reply: "error: context_length_exceeded" }
        - { match: { regex: 'regular saver with you[\s\S]*left exactly as it is' },
            reply: "Yes. You can open the one-year fixed term online, and the regular saver stays as it is." }
        - { match: "*", reply: "Which account would you like to open?" }
      tools:
        conversation:
          returns:
            status: 200
            window: 100
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "I have had an easy access account with you since 2019.", tokens: 20 }
              - { n: 2, role: assistant, text: "Thank you for staying with us. How can I help today?", tokens: 20 }
              - { n: 3, role: customer, text: "I am thinking about a fixed term account instead.", tokens: 20 }
              - { n: 4, role: assistant, text: "We offer one-year and two-year fixed terms.", tokens: 20 }
              - { n: 5, role: customer, text: "I also hold the regular saver with you.", tokens: 20 }
              - { n: 6, role: customer, text: "I want the regular saver left exactly as it is.", tokens: 20 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)open the one-year fixed term online" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 1 }

  - name: a_rate_question_late_in_a_long_chat_still_meets_the_policy
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "So what rate would I get if I moved it all today?" }
      llm_script:
        - { match: { contains: "My fixed term matured last week" },
            reply: "error: context_length_exceeded" }
        - { match: { contains: "Send every rate question to a savings adviser" },
            reply: "A savings adviser will confirm the rate for you today." }
        - { match: "*", reply: "If you moved it all today you would earn 4.1 percent." }
      tools:
        conversation:
          returns:
            status: 200
            window: 100
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "My fixed term matured last week.", tokens: 20 }
              - { n: 2, role: assistant, text: "The money is in your easy access account now.", tokens: 20 }
              - { n: 3, role: customer, text: "I am weighing up whether to move it somewhere else.", tokens: 20 }
              - { n: 4, role: assistant, text: "I can explain the accounts we offer.", tokens: 20 }
              - { n: 5, role: customer, text: "My brother says another bank pays more.", tokens: 20 }
              - { n: 6, role: customer, text: "I have twelve thousand pounds to place.", tokens: 20 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)savings adviser will confirm" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 1 }

  - name: the_policy_counts_against_the_window
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How often will the paper statements come?" }
      llm_script:
        - { match: { contains: "changed my phone number" },
            reply: "error: context_length_exceeded" }
        - { match: { contains: "paper statements again" },
            reply: "Paper statements come once a quarter." }
        - { match: "*", reply: "Which statements do you mean?" }
      tools:
        conversation:
          returns:
            status: 200
            window: 90
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "I moved house in the spring.", tokens: 10 }
              - { n: 2, role: assistant, text: "Thank you, I have noted the new address.", tokens: 10 }
              - { n: 3, role: customer, text: "I also changed my phone number.", tokens: 20 }
              - { n: 4, role: assistant, text: "Noted. Is there anything else I can help with?", tokens: 20 }
              - { n: 5, role: customer, text: "Yes, I would like paper statements again.", tokens: 20 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)once a quarter" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 1 }

  - name: a_policy_bigger_than_the_window_goes_to_a_person
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What rate would my savings earn?" }
      llm_script:
        - { match: { contains: "Send every rate question to a savings adviser" },
            reply: "A savings adviser will confirm the rate for you." }
        - { match: "*", reply: "Your savings would earn 4.1 percent." }
      tools:
        conversation:
          returns:
            status: 200
            window: 30
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "I have savings with you.", tokens: 10 }
              - { n: 2, role: assistant, text: "Thank you. How can I help?", tokens: 10 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: llm_calls_at_most, value: 0 }
        - { type: returns_matches, value: "(?i)needs a person" }
        - { type: no_exception }

  - name: a_turn_too_big_for_the_room_ends_the_window
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What have you done on my accounts today?" }
      llm_script:
        - { match: { contains: "Close my easy access account" },
            reply: "I have closed your easy access account and moved the money to your current account." }
        - { match: { contains: "leave it open for now" },
            reply: "Nothing has changed today. Your account stays open, and your last statement is on its way." }
        - { match: "*", reply: "I cannot see the rest of our conversation." }
      tools:
        conversation:
          returns:
            status: 200
            window: 100
            policy:
              text: "POLICY: Never state, estimate or compare an interest rate. Send every rate question to a savings adviser, who confirms the rate."
              tokens: 40
            turns:
              - { n: 1, role: customer, text: "Close my easy access account and send the money to my current account.", tokens: 10 }
              - { n: 2, role: assistant, text: "Before I do that, your easy access account has a thirty-day notice period, so closing it today would lose this month's interest. I have not closed it. Tell me if you still want to once the notice period ends.", tokens: 45 }
              - { n: 3, role: customer, text: "No, leave it open for now.", tokens: 10 }
              - { n: 4, role: assistant, text: "Understood, it stays open.", tokens: 10 }
              - { n: 5, role: customer, text: "Can you send me a copy of my last statement?", tokens: 10 }
      budget: { max_llm_calls: 2, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)nothing has changed today" }
        - { type: no_exception }
        - { type: llm_calls_at_most, value: 1 }

reference_md: |
  The bug is a data structure decision. Putting the policy in the same list as
  the turns says it is one more message, and every trimming strategy ever
  written agrees about which message goes first: the oldest. The policy is
  always the oldest.

  Pinning separates the two. The policy is paid for first, out of the same
  window, and the turns share what is left. Trimming then only ever sees
  history, so no chat is long enough to reach the policy. The accounting
  matters as much as the placement. A builder that pins the policy and budgets
  the turns against the whole window sends a prompt over the limit, and if
  anything between you and the model trims to fit, it trims from the top,
  which is this incident again one layer down.

  Stopping at the first turn that does not fit is the less obvious rule. A
  greedy fill that skips the big turn and keeps an older small one hands the
  model a sentence without the turns that explained it. "Close my easy access
  account" is an instruction when it stands alone; with the reply that
  followed it, it was a request already answered.

  A policy that does not fit on its own is a configuration fault, and it
  arrives the day somebody adds a paragraph to the policy or moves the
  assistant to a model with a smaller window. Cutting the policy to fit sends
  a different policy that nobody reviewed. Handing the chat to a person costs
  one conversation and raises the fault where someone can fix it.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Your chat assistant's conversation has outgrown the context window. What do you trim, and what can never be trimmed?
  source: |
    Author judgement. No employer frequency data stands behind it.
