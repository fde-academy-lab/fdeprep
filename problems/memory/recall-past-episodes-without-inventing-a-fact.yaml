  - name: adversarial_memory_the_old_version_wrote
    visibility: adversarial
    fixture: schema_drift
    annotation_md: |
      The old version of the agent wrote this customer's memory. Its chat
      about a refund for a spilled curry carries `status: escalated` and no
      `outcome` at all, and one of its facts, a gluten-free diet, has the
      source `inferred`: it is one of the guesses the review found in one
      customer in nine.

      A recall that looks for `outcome == "open"` files the escalation with
      the resolved chats, and at seven weeks old it is the first to drop out
      of the three. A prompt built from every fact tells the model the customer
      prefers gluten-free, and the model opens with it. Read by the contract's
      rules, the chat with no outcome is open and comes first, and the inferred
      fact is not known, so the customer hears about her refund and nothing
      about a diet she never stated.
    spec:
      kind: agent_run
      input: { question: '{"customer": "C-8150", "thread": "T-9394", "today": "2026-10-07", "message": "Hello again, any news for me?"}' }
      llm_script:
        - { match: { contains: "gluten-free (inferred)" },
            reply: "Reply: Hello again! As you prefer gluten-free, here are tonight's gluten-free picks.\nDid: Suggested gluten-free dishes.\nOutcome: resolved" }
        - { match: { contains: "OPEN E-0915" },
            reply: "Reply: Your refund for the spilled curry is still with our payments team. I have asked them for a date today.\nDid: Chased the payments team about the refund.\nOutcome: open" }
        - { match: "*", reply: "Reply: Hello again! There is nothing new on your account.\nDid: Answered a greeting.\nOutcome: resolved" }
      tools:
        load_memory:
          returns:
            status: 200
            episodes:
              - { id: E-0915, when: "2026-08-21", asked: "My refund for the spilled curry never arrived.",
                  did: "Raised it with the payments team.", status: escalated, noted: {} }
              - { id: E-0978, when: "2026-09-09", asked: "Can you deliver to my gym?",
                  did: "Added the gym as an address.", outcome: resolved, noted: {} }
              - { id: E-1004, when: "2026-09-22", asked: "My coupon expired before I could use it.",
                  did: "Extended the coupon by a week.", outcome: resolved, noted: {} }
              - { id: E-1039, when: "2026-10-01", asked: "Is the restaurant open on Sunday?",
                  did: "Confirmed its Sunday hours.", outcome: resolved, noted: {} }
            facts:
              - { key: diet, value: gluten-free, source: inferred, since: "2026-07-30" }
              - { key: size, value: regular, source: stated, since: "2026-02-11" }
        save_memory: { returns: { status: 200 } }
      budget: { max_llm_calls: 2, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: prompt_lacks, value: "(?i)gluten" }
        - { type: prompt_contains, value: "OPEN E-0915" }
        - type: valid_json_return
          schema:
            type: object
            required: [recalled]
            properties:
              recalled: { const: [E-0915, E-1039, E-1004] }
        - { type: returns_matches, value: "payments team" }

  - name: adversarial_memory_that_will_not_load
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The memory store answered `null`: no episodes, no facts and no error
      body to read.

      Code that reads `memory["episodes"]` raises, and the customer who asked
      where her order is gets nothing at all. Memory that will not load is a
      reason to answer as you would a new customer, with nothing recalled and
      nothing promoted, and to write this chat back as usual so the next chat
      has it.
    spec:
      kind: agent_run
      input: { question: '{"customer": "C-9021", "thread": "T-9401", "today": "2026-10-07", "message": "Where is my order? It has been an hour."}' }
      llm_script:
        - { match: "*", reply: "Reply: Your order is with the rider and arrives in 12 minutes.\nDid: Shared the order's arrival time.\nOutcome: resolved" }
      tools:
        load_memory: { fixture: empty_tool_result }
        save_memory: { returns: { status: 200 } }
      budget: { max_llm_calls: 2, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: terminates }
        - type: valid_json_return
          schema:
            type: object
            required: [recalled, facts_written]
            properties:
              recalled: { type: array, maxItems: 0 }
              facts_written: { type: array, maxItems: 0 }
        - { type: calls_tool_with, name: save_memory, args: { customer: C-9021 } }
        - { type: returns_matches, value: "12 minutes" }

reference_md: |
  The three faults are one confusion. An episode is something that happened:
  a date, what was asked, what was done, and whether it was resolved. A fact
  is something the agent relies on in every later chat. The old memory let an
  episode stand in for a fact twice, when a gluten-free order became a diet
  and when a closed chat became a resolved one, and it let an old episode
  stand in for the customer's present when a refund from last year was
  recalled ahead of an escalation that was still open.

  Recall is where that shows first. A customer's past chats matter to the new
  message in one way above all: what is still unfinished. So open chats come
  first whatever their age, then the newest, and three is the limit because
  three is what one reply can use. Ranking by likeness to the message finds
  old chats that share its words, which is how a pizza refund from fourteen
  months earlier beat last month's escalation, and it gives whoever wrote the
  most matching words a place in every later prompt. The order also needs
  every episode in front of it. In langgraph 1.2.12 `search` returns ten items
  unless it is given a `limit`, in the order they were put, so for a regular
  customer it leaves out exactly the newest chats.

  The close writes this chat the way it happened. An outcome is resolved only
  when the model says so. An escalation, a "pending" or a missing Outcome line
  is open, because the next chat reads the episode as it was written, and an
  episode written resolved is one the agent will later call fixed. `asked` and `did` are cut
  to 240 characters, so the episode stays a record of the chat and three of
  them still fit in one prompt.

  Facts have two ways in. The customer's own words are one: the model's
  `Stated:` line is a claim about the message, and the message is right there
  to check it against. Without that check, a model that reads a past
  gluten-free order writes the diet as stated, and the promotion rule is
  bypassed by the model it exists to hold back. The other way is agreement:
  three episodes from the last 90 days with the same key and value. One order
  is an anecdote and may be for a friend, three recent ones are a habit, and
  an order from June says little about October. The customer's word outranks
  the habit, so a key the customer has stated is never promoted over, and a
  fact already known is not written again.

  The store is what makes this a memory of a person. The checkpointer keeps
  one thread's state, and the next chat opens a new thread; the store is
  keyed by the customer and outlives both. In langgraph 1.2.12 `put` replaces
  whatever was under a key and keeps no history, which is why a fact has to
  earn its place before it is written. Memory the old version wrote is read
  by the same rules: a chat with no `outcome` is open, and a fact whose source
  is neither `stated` nor `promoted` was inferred, which is what one customer
  in nine was carrying.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    What is the difference between episodic and semantic memory in an agent, and when should something the agent saw happen become something it treats as true?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I016 and I018,
    whose follow-up is an old episode that is semantically relevant but factually obsolete.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat. The promotion rule is author judgement.

tools:
  - name: load_memory
    args: customer
    returns: The customer's `episodes`, oldest first, and `facts`, as yesterday's store held them.
  - name: save_memory
    args: customer, episode, facts
    returns: '`{"status": 200}` once this chat and its facts are written back.'
example:
  case: remembers_a_regular_and_what_she_told_us
  expect: >-
    Both past chats are resolved, so recall lists them newest first, `E-2040` then `E-2001`. The
    model sees her stated size, and the close writes this chat as resolved with no new fact.
traps:
  - Writing a fact from one episode, or from a `Stated:` line whose value the customer never wrote in this message.
  - Choosing the past chats most like the new message, so an old resolved one crowds out a chat that is still open.
  - Writing a chat as resolved because it closed, when the model said it was still with another team.
  - Reading the store with its default `limit`, which stops at the first ten episodes put.
