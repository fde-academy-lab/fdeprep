        - { match: { contains: "the wedding is in June 2027" },
            reply: "The wedding is in June 2027, and she will pay for it from cash." }
        - { match: "*", reply: "I cannot find anything about the wedding." }
      tools:
        profile:
          returns:
            status: 200
            fields:
              risk_profile: "cautious, from the risk assessment on 12 March 2026"
              time_horizon: five years
        notes:
          returns:
            status: 200
            hits:
              - { id: n-30, matched: 3, about: null,
                  text: "14 March meeting: the wedding is in June 2027, and she will pay for it from cash." }
              - { id: n-03, matched: 3, about: null,
                  text: "14 March meeting: keeps 20,000 pounds in cash for her daughter's wedding in 2027." }
        index:
