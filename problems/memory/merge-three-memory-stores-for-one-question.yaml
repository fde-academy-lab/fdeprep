      assertions:
        - { type: returns_matches, value: "(?i)now in September 2027" }
        - { type: returns_matches, value: '"memories"\s*:\s*\[\s*"v-388"\s*,\s*"v-300"\s*,\s*"n-30"\s*,\s*"v-405"\s*\]' }

  - name: adversarial_the_profile_store_is_down
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      The profile store timed out and answered 200 with an error in the body,
      which is the incident. There were no fields to read.

      A retrieval that reads the missing profile as an empty one tells the
      model nothing about it, so the chat line about taking more risk is the
      only word on risk the model sees, and it answers from it. Named as
      unavailable, the profile becomes something the model can say it could
      not check. Whether the memories about its fields still reach the prompt
      is the decision this problem leaves to you, and either choice passes
      here, because the Skipped line is what changes the answer.
    spec:
      kind: agent_run
      input: { question: "Is the global technology fund suitable for her ISA top-up?" }
      llm_script:
        - { match: { contains: "Skipped: profile (unavailable)" },
            reply: "Her profile could not be checked just now, so I cannot say whether the fund suits her. Confirm her risk profile before you recommend anything." }
        - { match: { contains: "happy to take more risk" },
            reply: "Yes. She told you in August she is happy to take more risk, so the technology fund suits her." }
        - { match: "*", reply: "I do not have enough on this client to say." }
      tools:
        profile: { fixture: tool_soft_error, params: { status: 200, body: { error: "profile_store_timeout" } } }
        notes:
          returns:
            status: 200
            hits:
              - { id: n-11, matched: 3, about: null,
                  text: "2 June call: asked how much of this year's ISA allowance is left." }
        index:
          returns:
            status: 200
            results:
              - { id: v-207, similarity: 0.91, about: null,
                  text: "Email, 2 September: asked whether her ISA could hold the global technology fund she read about." }
              - { id: v-118, similarity: 0.86, about: risk_profile,
                  text: "Chat, 20 August: says she is happy to take more risk now the mortgage is paid off." }
              - { id: v-150, similarity: 0.80, about: null, text: "Email, 9 July: wants every statement by email." }
              - { id: v-033, similarity: 0.41, about: null, text: "Email, 4 April: thanked the adviser for the birthday card." }
              - { id: v-090, similarity: 0.39, about: null, text: "Chat, 1 May: asked how to update her address." }
      budget: { max_llm_calls: 2, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: "(?i)profile could not be checked" }
        - { type: returns_matches, value: '"profile"\s*:\s*"unavailable"' }

  - name: adversarial_the_index_times_out
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      The index never answered: its first call raised `TimeoutError`. A
      retrieval that lets the exception escape gives the adviser nothing at
      all, though the profile and the notes both answered.

      One store failing is a reason to say so, never a reason to stop. The
      profile and the notes still go in, and the Skipped line tells the model
      the emails and chats were not searched, so it can tell the adviser to
      check them before the call.
    spec:
      kind: agent_run
      input: { question: "Is the global technology fund suitable for her ISA top-up?" }
      llm_script:
        - match: { all: [ { contains: "Skipped: index (unavailable)" },
                          { contains: "risk_profile: cautious" } ] }
          reply: "Her risk profile is cautious, so a single-sector technology fund does not fit it as things stand. I could not search her emails and chats just now, so check them before the call."
        - { match: { contains: "risk_profile: cautious" },
            reply: "Her risk profile is cautious, so the technology fund does not fit it." }
        - { match: "*", reply: "I do not have enough on this client to say." }
      tools:
        profile:
          returns:
            status: 200
            fields:
              risk_profile: "cautious, from the risk assessment on 12 March 2026"
              time_horizon: five years
        notes:
          returns:
            status: 200
            hits:
              - { id: n-11, matched: 3, about: null,
                  text: "2 June call: asked how much of this year's ISA allowance is left." }
              - { id: n-17, matched: 4, about: null,
                  text: "Fund review: her ISA holds the global equity fund and the UK bond fund." }
        index:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the email and chat index did not answer within 5 seconds" }
      budget: { max_llm_calls: 2, max_tool_calls: 6, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: "(?i)could not search her emails" }
        - { type: returns_matches, value: '"index"\s*:\s*"unavailable"' }

reference_md: |
  Every store answered correctly on its own terms. The notes search counted
  matching words, the index returned the nearest neighbours it had, and the
  profile store failed. The mistake was pooling two currencies into one
  ranking and saying nothing about the third store. A note matching three
  words scored 3 and the client's own email about the fund scored 0.91, so
  sorted together the notes win every time, on the size of their units
  alone.

  Each store gets its own floor and its own ranking, and the merge takes
  turns. The floors are not interchangeable. Keyword search returns nothing
  when nothing matches, and a vector index returns its nearest neighbours
  however far away they are: in langchain-core 1.6.6,
  `VectorStore.similarity_search` returns k=4 results by default, and
  `VectorStoreRetriever` applies a floor only when `search_type` is
  `"similarity_score_threshold"` and a `score_threshold` is set. An index
  without a floor fills the context with its least bad guesses.

  The profile is the record for its fields. A risk profile is set by an
  assessment, and a chat line about risk is a client thinking aloud, which
  belongs in the adviser's next conversation with her. When the profile
  answers, memories about its fields are dropped, because a second answer
  beside the record is a distractor. When it does not answer, you decide
  whether those memories are better than nothing. This reference keeps them
  and names the profile as unavailable, and the defence asks you to argue
  your own choice.

  Ties broken by id and duplicates counted once make the context the same on
  every run, which is what lets anyone reproduce an answer that went wrong.
  The Skipped line separates two facts the model cannot otherwise tell apart:
  the client never said anything, and the firm could not look. The incident
  needed the second, and the model was given the first.

complexity: C2

interview_evidence:
  round: both
  asked_as: |
    Your agent's memory lives in three places: a structured profile, notes searched by keyword, and a vector index. How do you combine them to answer one question, and what does the agent say when one of them does not answer?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: profile
    args: ''
    returns: A status and the client's `fields` of record, set by formal reviews.
  - name: notes
    args: query
    returns: A status and keyword `hits` in file order, each with `id`, `matched`, `about` and `text`.
  - name: index
    args: query
    returns: A status and its five nearest `results`, each with `id`, `similarity`, `about` and `text`.
example:
  case: the_profile_and_both_searches_all_answer
  expect: Both notes pass the floor of 2, two index results pass 0.75. Taking turns gives `v-207`, `n-11`,
    `v-150`, `n-03`, nothing is skipped, and the reply says her risk profile is cautious.
traps:
  - Sorting notes and index results together by score, so the store with the bigger numbers takes every
    place.
  - Taking the index's nearest results without a floor, when it returns five whether or not any are
    relevant.
  - Letting a memory about a profile field stand beside the profile, where it reads as a second answer.
  - Saying nothing about a store that did not answer, so the model reads a store it could not search as
    one with nothing to say.
