        transcript:
          returns:
            status: 200
            session: s-57
            turns:
              - { n: 1, role: traveller, text: "Give me an aisle seat on the Zurich flight." }
              - { n: 2, role: assistant, text: "Done, 14C." }
              - { n: 3, role: traveller, text: "Actually, make it a window seat. I want to sleep." }
        proposals:
          returns:
            status: 200
            proposals:
              - { key: seat, value: aisle, source: user, turn: 1 }
              - { key: seat, value: window, source: user, turn: 3 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - type: valid_json_return
          schema:
            type: object
            required: [notes]
            properties:
              notes:
                type: array
                minItems: 3
                maxItems: 3
                contains:
                  required: [key, value, session, turn, status]
                  properties:
                    key: { const: seat }
                    value: { const: window }
                    session: { const: s-57 }
                    turn: { const: 3 }
                    status: { const: current }
        - type: valid_json_return
          schema:
            type: object
            properties:
              notes:
                type: array
                contains:
                  required: [key, value, status]
                  properties: { key: { const: seat }, value: { const: aisle }, status: { const: replaced } }
        - type: valid_json_return
          schema:
            type: object
            properties:
              notes:
                type: array
                contains:
                  required: [key, status]
                  properties: { key: { const: seat }, status: { const: current } }
                maxContains: 1

  - name: adversarial_a_claimed_correction_with_nothing_behind_it
    visibility: adversarial
    fixture: tool_lies
    annotation_md: |
      The extraction model labelled its proposal as the traveller's and cited
      the traveller's own turn. The turn asked for the expense form to match
      the old itinerary. It never said Mukerji.

      A merge that ranks by the label gives any guess the traveller's
      authority, so the ranking that protects a correction becomes the route
      that overwrites it. Checked against the transcript the proposal is the
      assistant's, and it is kept as a conflict beside the correction.
    spec:
      kind: agent_run
      input: { question: "traveller T-0481" }
      llm_script:
        - { match: "*", reply: "unused" }
      tools:
        notes:
          returns:
            status: 200
            notes:
              - { key: surname, value: Mukherjee, source: user, session: s-31, turn: 4, status: current }
        transcript:
          returns:
            status: 200
            session: s-55
            turns:
              - { n: 1, role: traveller, text: "Please fill in the expense form for Frankfurt the way the old itinerary had it." }
              - { n: 2, role: assistant, text: "The old itinerary shows S. Mukerji." }
        proposals:
          returns:
            status: 200
            proposals:
              - { key: surname, value: Mukerji, source: user, turn: 1 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [notes]
            properties:
              notes:
                type: array
                contains:
                  required: [key, value, status]
                  properties: { key: { const: surname }, value: { const: Mukherjee }, status: { const: current } }
        - type: valid_json_return
          schema:
            type: object
            properties:
              notes:
                type: array
                contains:
                  required: [key, value, source, status]
                  properties: { key: { const: surname }, value: { const: Mukerji }, source: { const: agent }, status: { const: conflict } }

  - name: adversarial_the_notes_file_could_not_be_read
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      The notes store timed out and answered 200 with an error in the body.
      There was no list of notes in the reply.

      A merge that reads the missing list as an empty file applies the
      chat's proposals to nothing and returns a file holding only the new
      notes. The platform saves what it is given, so every correction and all
      the history the traveller had is gone in one write. A file that could
      not be read is unknown, and the only safe write is none.
    spec:
      kind: agent_run
      input: { question: "traveller T-2207" }
      llm_script:
        - { match: "*", reply: "unused" }
      tools:
        notes: { fixture: tool_soft_error, params: { status: 200, body: { error: "store_timeout" } } }
        transcript:
          returns:
            status: 200
            session: s-56
            turns:
              - { n: 1, role: traveller, text: "Aisle seats from now on, please." }
        proposals:
          returns:
            status: 200
            proposals:
              - { key: seat, value: aisle, source: user, turn: 1 }
      budget: { max_llm_calls: 1, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - type: valid_json_return
          schema:
            type: object
            required: [notes]
            properties:
              notes: { type: "null" }

reference_md: |
  The incident was a write, and every part of it worked as built. The
  extraction model read a surname off an itinerary and proposed it, which is
  its job. The store replaced the value under the key, which is what a
  key-value store does: LangGraph's store in langgraph 1.2.12, for one, replaces
  the item under a namespace and key on `put` and keeps no history. Nothing
  in the write knew that one value came from the traveller and the other from
  a document she had already corrected.

  So the write has to carry who said each value, and rank by it. The
  traveller outranks the assistant. An equal or stronger value replaces the
  one in force and the old one is kept as replaced, so the history survives.
  A weaker value that disagrees is kept as a conflict, beside the correction:
  the itinerary still says Mukerji, and somebody fixing the HR record will
  want to know that.

  The rank is only as good as the source behind it, and the source the
  extraction model reports is a claim. Ranked by that claim, any guess can
  borrow the traveller's authority, and the mechanism that protects a
  correction becomes the way to overwrite one. The transcript records who
  said what, so the merge checks the cited turn: the traveller's own, with
  the value in it. The same check works the other way, and a correction the
  model mislabelled as its own still counts as the traveller's.

  Two smaller rules keep the file honest. The same value written in another
  case or with a stray space is no change, so it neither replaces anything
  nor raises a conflict nobody needs to resolve. And a notes file that could
  not be read is unknown, never empty: written back, an empty read erases
  every correction the traveller ever made.

complexity: C2

interview_evidence:
  round: both
  asked_as: |
    A user corrected a fact about themselves, and a week later your agent is using the old value again. How did that happen, and what do you change in how the agent writes its memory?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I018.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: notes
    args: ''
    returns: A status and the traveller's `notes`, each with `key`, `value`, `source`, `session`, `turn`
      and `status`.
  - name: transcript
    args: ''
    returns: A status, this chat's `session` id, and its `turns`, each with `n`, `role` and `text`.
  - name: proposals
    args: ''
    returns: A status and the extraction model's `proposals` in order, each with `key`, `value`, a claimed
      `source` and the `turn` it cites.
example:
  case: a_traveller_changes_a_preference_and_adds_one
  expect: Turn 3 is the traveller's and holds both values, so both proposals rank as theirs. The aisle seat
    replaces the window seat, which stays in the file as replaced, and the meal becomes a new current note.
traps:
  - Letting the proposal written last win, so the assistant's reading of an old document replaces the
    traveller's correction.
  - Trusting the source the extraction model reports, when the transcript says who actually spoke.
  - Treating the same value written in another case as a change, which writes a replacement or a conflict
    nobody needs.
  - Reading a notes file that failed to load as empty, and writing back a file with only the new notes.
