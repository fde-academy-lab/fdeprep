slug: separate-actions-from-final-answers
title: "Confirm a booking only after it really happened"
day: 2
skill: Tell an action apart from an answer
artefact_type: code
difficulty: easy
track: agent-loop
est_minutes: 15
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A restaurant booking agent has been telling customers their table is
  confirmed when nothing was booked. The support team pulled the traces and
  found the cause: about one reply in twenty carries an answer and an action
  at the same time.

      Final Answer: Your table is booked for 8pm.
      Action: book(table=4, time=20:00)

  The loop reads the first line, returns it, and stops. The booking call never
  happens and the customer is told it did.

  Write the loop that does not make that mistake.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns a string. A well-formed reply is either
  `Action: <tool>(<key>=<value>, ...)` or `Final Answer: <text>`, and nothing
  else. Tools are callables in the `tools` dict.

  A reply that carries both, or neither, is not an answer. Append the reply and
  the line `That was not a valid action.` to the scratchpad and ask again,
  rather than guessing which half the model meant.

  Budget: at most 3 model calls. Allowed imports: json, re.
  Return a non-empty string in every case.

stub_code: |
  import json
  import re

  ACTION = re.compile(r"^Action:\s*(\w+)\((.*)\)\s*$", re.MULTILINE)
  FINAL = re.compile(r"^Final Answer:\s*(.*)$", re.MULTILINE)
  INVALID = "That was not a valid action."


  def arguments(raw: str) -> dict:
      """Turn 'table=4, time=20:00' into {'table': '4', 'time': '20:00'}."""
      args = {}
      for pair in raw.split(","):
          if "=" in pair:
              key, value = pair.split("=", 1)
              args[key.strip()] = value.strip()
      return args


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"

      for _ in range(8):
          reply = llm(scratchpad)
          action = ACTION.search(reply)
          final = FINAL.search(reply)

          # TODO 1: when the reply holds an action and an answer together,
          #         append the reply and INVALID to the scratchpad, then go
          #         round again without acting on either half
          # TODO 2: when it holds only an answer, return the answer text
          # TODO 3: when it holds only an action, call the tool it names with
          #         arguments(...) and append the reply and what came back
          # TODO 4: when it holds neither, append the reply and INVALID too,
          #         so the next prompt differs from this one

      return "I could not finish this booking."

steps:
  - id: s1
    text: Give a reply with both an action and an answer its own branch, first.
    check_id: s1
  - id: s2
    text: Return the answer text when the reply holds only an answer.
    check_id: s2
  - id: s3
    text: Call the tool when the reply holds only an action, and append the result.
    check_id: s3
  - id: s4
    text: Send a reply with neither marker back with the same line, so the prompt changes.
    check_id: s4

step_checks:
  # No public reply carries both markers, so s1 carries its own case. The
  # first reply books and answers at once, with the Action line first. Only a
  # reply sent back with the line the contract names gets the honest answer.
  - step_id: s1
    spec:
      kind: agent_run
      input: { question: "Table for six at half past six on Saturday" }
      llm_script:
        - { match: { contains: "not a valid action" },
            reply: "Final Answer: Nothing is booked yet. Tell me which Saturday and I will book table 6." }
        - { match: "*",
            reply: "Action: book(table=6, time=18:30)\nFinal Answer: Table 6 is booked for 6:30pm on Saturday." }
      tools:
        book: { returns: { status: 200, reference: "BK-6630" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 5000 }
      assertions:
        - { type: does_not_call_tool, name: book }
        - { type: returns_matches, value: "(?i)nothing is booked yet" }
  - step_id: s2
    spec:
      assertions:
        - { type: returns_nonempty }
  - step_id: s3
    spec:
      assertions:
        - { type: calls_tool, name: book }
  # No public reply lacks both markers, so s4 carries its own case too. The
  # first reply is small talk, and the model answers only once the prompt
  # carries the line the contract names.
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "Do you have room for a birthday group next week?" }
      llm_script:
        - { match: { contains: "not a valid action" },
            reply: "Final Answer: Tell me the day and the number of guests and I will check." }
        - { match: "*", reply: "What a lovely thing to celebrate!" }
      tools:
        book: { returns: { status: 200, reference: "BK-3318" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 5000 }
      assertions:
        - { type: terminates }
        - { type: returns_matches, value: "(?i)number of guests" }

hints:
  - One reply can hold two markers. Find out which are present before any
    branch acts on either of them.
  - Whichever marker your code tests first wins when both are present. The
    booking agent tested for a Final Answer first, so the Action was dropped.
  - Give the both-markers case its own branch ahead of the answer branch, and
    send that reply back to the model with the line the contract names.
  - A reply with neither marker gets the same line. Without it the next prompt
    is identical to the last one, and so is the next reply.

scenario:
  headline: "Guests are told their table is booked when nothing was"
  who: Guest support for a restaurant booking agent
  situation: >-
    About one reply in twenty carries a Final Answer and an Action together.
    The loop returns the answer as soon as it sees one, so the booking call
    never runs.
  stakes: >-
    Guests are told their table is booked when nothing was booked, and the
    trace records the run as a success.
  metrics:
    - { label: Replies with both markers, value: 1 in 20 }
    - { label: Tables they booked, value: "0" }
    - { label: Model calls allowed, value: "3" }

diagram:
  title: Where an answer and an action collide in one reply
  caption: >-
    The loop tested for a Final Answer first and returned. Classify the whole
    reply before acting on any part of it.
  direction: lr
  nodes:
    - { id: guest, label: Guest, sub: asks for a table, kind: actor, tone: blue, at: [0, 1] }
    - { id: model, label: Model, sub: answers and acts in one reply, kind: model, tone: teal, at: [1, 0] }
    - { id: loop, label: Agent loop, sub: reads the reply, kind: agent, tone: purple, at: [1, 1] }
    - { id: sort, label: Classify the reply, sub: "action, answer, both or neither", kind: decision, tone: blue, at: [2, 1] }
    - { id: book, label: "`book()`", sub: reserves the table, kind: tool, tone: orange, at: [3, 0] }
    - { id: answer, label: Final Answer, sub: returned only when it stands alone, kind: output, tone: green, at: [3, 1] }
    - { id: wrong, label: Table confirmed, sub: nothing was booked, kind: output, tone: pink, at: [2, 2] }
  edges:
    - { from: guest, to: loop, label: table for two at seven, step: 1 }
    - { from: loop, to: model, label: scratchpad, step: 2 }
    - { from: model, to: loop, label: Final Answer and Action, step: 3 }
    - { from: loop, to: wrong, label: returns the first marker, tone: danger }
    - { from: loop, to: sort, label: classify first, step: 4 }
    - { from: sort, to: book, label: action only, tone: success }
    - { from: sort, to: answer, label: answer only, tone: success }
    - { from: sort, to: model, label: "both or neither: ask again" }

approach:
  goal: Act on a reply only when it makes exactly one move
  branches:
    - label: Read the whole reply first
      leaves: [find every marker before any branch runs, both markers means two moves at once]
    - label: Name all four cases
      detail: Action only, answer only, both, and neither. Only the first two can be acted on.
      leaves: [both and neither go back to the model]
    - label: Change the prompt when you send it back
      leaves: [append the reply and the line the contract names, an unchanged prompt gets an unchanged reply]
    - label: Stay inside three calls
      leaves: [an unusable reply costs one call, every path ends in a sentence]

coach:
  opening: >-
    Before you write a branch, list what one reply can contain. There are four
    cases, and the booking agent handled two of them.
  signals:
    - id: answer-first
      when:
        code_matches: '(?i)^\s*(if|elif)\b[^\n]*final[^\n]*:\s*\n\s*return\b'
        code_lacks: '(?i)^\s*(if|elif)\b[^\n]*\b(action|final)\w*\b[^\n]*\b(and|or)\b[^\n]*\b(action|final)|\blen\(|\.count\(|\bsum\('
      say: >-
        Your answer branch returns before anything asks whether the same reply
        also holds an Action. What happens to the booking when both arrive
        together?
    - id: silent-retry
      when: { code_matches: '(?i)(is\s+None|^\s*if\s+not\s+\w+)\s*:\s*\n\s*continue\b' }
      say: >-
        When a reply has no usable marker your loop goes round again with the
        prompt unchanged. What will the model say to the identical prompt?
    - id: hidden-both-markers
      when: { test_failed: an_ambiguous_reply_is_not_an_answer }
      say: >-
        In that run the model answered and asked to book in the same reply.
        Trace your branches with that reply and see which one it reaches first.
    - id: hidden-neither
      when: { test_failed: an_unusable_reply_does_not_burn_the_budget }
      say: >-
        That run opens with a reply that has neither marker. Does the prompt
        your loop sends next differ from the one before it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1, the branch for a reply that holds both markers.
        Written first, it makes the order problem impossible.
    - id: hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and on
        this tier it costs nothing to open.
  wrap_up: >-
    One model reply can carry two moves. Classify the whole reply before acting
    on any part of it, and send a reply you cannot use back with a reason.

tests:
  - name: books_then_answers
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Table for four at eight tonight" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: book(table=4, time=20:00)" }
        - { match: "*", reply: "Final Answer: Booked, table 4 at 8pm." }
      tools:
        book: { returns: { status: 200, reference: "BK-4471" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_nonempty }
        - { type: calls_tool, name: book }
        - { type: returns_matches, value: "(?i)booked" }

  - name: answers_without_a_tool
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Are you open on Mondays?" }
      llm_script:
        - { match: "*", reply: "Final Answer: We are closed on Mondays." }
      tools:
        book: { returns: { status: 200, reference: "BK-0000" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)closed on mondays" }
        - { type: does_not_call_tool, name: book }
        - { type: llm_calls_at_most, value: 2 }

  - name: an_ambiguous_reply_is_not_an_answer
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Table for two at seven" }
      llm_script:
        - { match: { contains: "not a valid action" },
            reply: "Final Answer: I have not booked anything. Confirm the date and I will." }
        - { match: "*",
            reply: "Final Answer: Your table is booked for 7pm.\nAction: book(table=2, time=19:00)" }
      tools:
        book: { returns: { status: 200, reference: "BK-9902" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)not booked anything" }
        - { type: does_not_call_tool, name: book }
        - { type: terminates }

  - name: an_unusable_reply_does_not_burn_the_budget
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Something for Friday" }
      llm_script:
        - { match: { contains: "not a valid action" },
            reply: "Final Answer: I need a time before I can book." }
        - { match: "*", reply: "Sure! Happy to help with that." }
      tools:
        book: { returns: { status: 200, reference: "BK-1200" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: returns_matches, value: "(?i)need a time" }
        - { type: llm_calls_at_most, value: 3 }

reference_md: |
  The whole problem is the order of two `if` statements, which is why it is
  the first problem in the track rather than a footnote in a later one.

  A loop that asks "is there a Final Answer?" and returns on the first yes has
  already decided that a reply carrying both is an answer. Nothing about the
  reply says that. The model emitted two moves and the loop picked the one it
  happened to check first, so the behaviour of the booking agent depends on
  the order two branches were typed in.

  Counting both markers first turns that accident into a decision. Once the
  loop knows a reply is ambiguous it has somewhere to put it: back to the
  model, with a line saying the reply was not usable. That line is doing more
  work than it looks. It changes the prompt, so the next call is a different
  question rather than the same one asked again, which is the difference
  between two calls and a spent budget.

  Returning the customer-facing sentence from an ambiguous reply is the
  expensive version of this bug. A table that was never booked is a customer
  standing in a doorway, and the trace says the agent succeeded.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    The model emits something that could be a tool call or could be the answer. How do you tell, and what happens when you are wrong?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: book
    args: table, time
    returns: '`{"status": 200, "reference": ...}` with the booking reference once the table is booked.'
example:
  case: books_then_answers
  expect: The first reply is only an Action, so call `book(table=4, time=20:00)` and append the result;
    the next reply is only a Final Answer, so return its text saying table 4 is booked.
traps:
  - Testing for a Final Answer first and returning it, so a reply that also carries an Action is taken
    as the answer.
  - Calling the tool from a reply that also carries a Final Answer; a reply with both markers goes back
    to the model unused.
  - Sending a reply with neither marker back with the prompt unchanged, so the model gives the same reply
    until the budget runs out.
