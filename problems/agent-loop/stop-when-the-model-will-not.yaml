slug: stop-when-the-model-will-not
title: Stop the loop yourself when the model never will
artefact_type: code
difficulty: easy
track: agent-loop
est_minutes: 20
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: cost-and-latency, weight: 0.5 }
call_budget: 5
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A research assistant looks things up and summarises what it found. It works.
  Once or twice a week it does not: the model keeps asking for one more lookup
  and never writes the summary, and the loop keeps going because the only way
  out of it is a Final Answer that never arrives.

  The bill for last Thursday was 340 dollars on one question.

  Nothing about the model guarantees it will stop. The loop has to.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns either `Action: lookup(topic=<text>)` or
  `Final Answer: <text>`. The `lookup` tool returns
  `{"status": 200, "text": "..."}`.

  You may make at most 5 model calls. Count them yourself. When the fifth one
  comes back without a Final Answer, stop and return a sentence that says the
  work is unfinished and what was found so far. Do not return an empty string
  and do not let an exception out.

  Budget: at most 5 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  MAX_CALLS = 5
  ACTION = re.compile(r"^Action:\s*lookup\(topic=(.*)\)\s*$", re.MULTILINE)


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Question: {question}\n"
      found = []

      # TODO 1: this loop has one exit and the model owns it. Stop it after
      #         MAX_CALLS model calls, counting the calls themselves.
      while True:
          reply = llm(scratchpad)

          # TODO 2: return the text after "Final Answer:" when the reply has one

          action = ACTION.search(reply)
          if action is None:
              scratchpad += f"{reply}\nThat was not a valid action.\n"
              continue

          # TODO 3: call tools["lookup"] with the topic, keep the "text" it
          #         returned in found, and append the result to the scratchpad

      return unfinished(found)


  def unfinished(found: list) -> str:
      """What the caller gets when the model calls run out."""
      # TODO 4: say the work is unfinished, and include the text in found
      return ""

steps:
  - id: s1
    text: Stop the loop after MAX_CALLS model calls, counting the calls themselves.
    check_id: s1
  - id: s2
    text: Return the text when the reply is a Final Answer.
    check_id: s2
  - id: s3
    text: Call lookup and keep the text it returned.
    check_id: s3
  - id: s4
    text: Return an unfinished answer that carries what the lookups found.
    check_id: s4

step_checks:
  # Every public case ends on a Final Answer, so s1 carries its own case: the
  # model asks for one more lookup on every call. The budget refuses a sixth
  # call, so a loop with no exit of its own ends on the budget and never
  # returns.
  - step_id: s1
    spec:
      kind: agent_run
      input: { question: "List every freight quote we received this year" }
      llm_script:
        - { match: "*", reply: "Action: lookup(topic=freight quotes)" }
      tools:
        lookup: { returns: { status: 200, text: "Quote Q-2210 covers 18 pallets to Rotterdam." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 5000 }
      assertions:
        - { type: terminates }
        - { type: llm_calls_at_most, value: 5 }
  - step_id: s2
    spec:
      assertions:
        - { type: returns_nonempty }
  - step_id: s3
    spec:
      assertions:
        - { type: calls_tool, name: lookup }
  # No public case runs out of calls either, so s4 carries its own case. The
  # model asks for one more lookup every time, and the check is that the
  # answer the loop returns when the calls run out carries what the lookup
  # found.
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "Which of our suppliers charge for late payment?" }
      llm_script:
        - { match: "*", reply: "Action: lookup(topic=late payment fees)" }
      tools:
        lookup: { returns: { status: 200, text: "Brightwell Packaging adds 2 percent a month after 30 days." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 5000 }
      assertions:
        - { type: terminates }
        - { type: returns_matches, value: "Brightwell Packaging adds 2 percent" }

hints:
  - Count the ways out of your loop, and ask who controls each one.
  - A loop that ends only on a Final Answer has one exit, and the model owns
    it. The loop needs a second exit that it owns itself.
  - Count model calls where you make them. When the count reaches MAX_CALLS,
    leave the loop whatever the last reply said.
  - Running out of calls is a result. Say the work is unfinished and include
    the text the lookups returned, because that text is what a person can
    still use.

scenario:
  who: The procurement team's contract research assistant
  situation: >-
    Once or twice a week the model keeps asking for one more lookup and never
    writes the summary. The loop's only exit is a Final Answer, so it keeps
    going.
  stakes: >-
    Last Thursday one question cost 340 dollars before a spend alarm stopped
    it, and the buyer who asked got nothing back.
  metrics:
    - { label: One question last Thursday, value: "$340" }
    - { label: Runaway runs a week, value: 1 to 2 }
    - { label: Model calls allowed, value: "5" }

diagram:
  title: Where a loop with one exit runs up the bill
  caption: >-
    The only way out is a Final Answer the model may never write. A call
    counter gives the loop an exit of its own.
  direction: lr
  nodes:
    - { id: buyer, label: Buyer, sub: asks one question, kind: actor, tone: blue, at: [0, 1] }
    - { id: loop, label: Agent loop, sub: while True, kind: agent, tone: purple, at: [1, 1] }
    - { id: model, label: Model, sub: asks for one more lookup, kind: model, tone: teal, at: [2, 0] }
    - { id: lookup, label: lookup(), sub: returns contract text, kind: tool, tone: orange, at: [2, 2] }
    - { id: counter, label: Call counter, sub: stops after the fifth call, kind: guard, tone: green, at: [2, 1] }
    - { id: alarm, label: Spend alarm, sub: 340 dollars on one question, kind: output, tone: pink, at: [1, 2] }
    - { id: unfinished, label: Unfinished answer, sub: carries what the lookups found, kind: output, tone: green, at: [3, 1] }
  edges:
    - { from: buyer, to: loop, label: question, step: 1 }
    - { from: loop, to: model, label: scratchpad, step: 2 }
    - { from: model, to: loop, label: one more lookup, step: 3, tone: danger }
    - { from: loop, to: lookup, label: lookup(topic) }
    - { from: lookup, to: loop, label: contract text }
    - { from: loop, to: alarm, label: no exit of its own, tone: danger }
    - { from: loop, to: counter, label: count every call, step: 4 }
    - { from: counter, to: unfinished, label: fifth call made, tone: success }

approach:
  goal: Give the loop an exit the model cannot take away
  branches:
    - label: Count the exits
      leaves: [a Final Answer is the model's exit, a call ceiling is the loop's exit]
    - label: Count calls where they happen
      detail: >-
        A retry added inside the loop later turns five iterations into eight
        calls. The counter belongs next to llm().
      leaves: [one counter, one comparison with MAX_CALLS]
    - label: Use the whole allowance
      leaves: [a summary on the fourth call still counts, stop after the fifth]
    - label: Say what you have
      leaves: [running out is a result, carry the text the lookups returned]

coach:
  opening: >-
    Count the ways out of this loop and who controls each one. Everything else
    in this problem follows from that count.
  signals:
    - id: one-exit
      when:
        code_matches: '^\s*while\s+True\s*:'
        code_lacks: '\+=\s*1|range\('
      say: >-
        This loop ends only when the model writes a Final Answer. What stops it
        on the day the model never does?
    - id: empty-unfinished
      when: { code_matches: '^\s*return\s+(""|'''')\s*$' }
      say: >-
        An empty string is what the caller gets when the calls run out. What
        could a person do with it? Say the work is unfinished and include what
        the lookups found.
    - id: hidden-never-finishes
      when: { test_failed: a_model_that_never_finishes_does_not_run_forever }
      say: >-
        In that run the model never writes a Final Answer. Follow your loop to
        the fifth reply: does it stop there, and does what it returns carry the
        lookup text?
    - id: hidden-late-summary
      when: { test_failed: a_late_summary_is_still_a_summary }
      say: >-
        In that run the summary arrives late, after several lookups. Does your
        loop give up before the model has used its last permitted call?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1. Put a counter next to the llm() call and leave the
        loop when it reaches MAX_CALLS, then press Run.
    - id: hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The first hint narrows where to look, and on
        this tier it costs nothing to open.
  wrap_up: >-
    Nothing about a model guarantees it will stop. Every agent loop needs an
    exit the code owns, counted in the unit that costs money, and an honest
    result for the day it is used.

tests:
  - name: summarises_after_one_lookup
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What changed in the carrier contract?" }
      llm_script:
        - { match: { call_index: 1 }, reply: "Action: lookup(topic=carrier contract)" }
        - { match: "*", reply: "Final Answer: The weekend surcharge was removed." }
      tools:
        lookup: { returns: { status: 200, text: "Weekend surcharge removed in March." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: lookup }
        - { type: returns_matches, value: "(?i)surcharge" }
        - { type: llm_calls_at_most, value: 5 }

  - name: answers_with_no_lookup_at_all
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Who owns the carrier relationship?" }
      llm_script:
        - { match: "*", reply: "Final Answer: Logistics owns it." }
      tools:
        lookup: { returns: { status: 200, text: "Logistics." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)logistics" }
        - { type: llm_calls_at_most, value: 2 }
        - { type: no_exception }

  - name: a_model_that_never_finishes_does_not_run_forever
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Summarise every carrier contract we have ever signed" }
      llm_script:
        - { match: "*", reply: "Action: lookup(topic=one more thing)" }
      tools:
        lookup: { returns: { status: 200, text: "Another paragraph of contract text." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: llm_calls_at_most, value: 5 }
        - { type: calls_tool, name: lookup }
        - { type: returns_matches, value: "(?i)paragraph of contract text" }

  - name: a_late_summary_is_still_a_summary
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "What did the carrier change in March?" }
      llm_script:
        - { match: { call_index: 4 }, reply: "Final Answer: They removed the weekend surcharge." }
        - { match: "*", reply: "Action: lookup(topic=march changes)" }
      tools:
        lookup: { returns: { status: 200, text: "March: surcharge removed." } }
      budget: { max_llm_calls: 5, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)weekend surcharge" }
        - { type: llm_calls_at_most, value: 5 }
        - { type: terminates }

reference_md: |
  Two exits, and the problem is that most loops are written with one.

  `while True` with a break on Final Answer hands the stopping decision to the
  model. That is fine on the days the model stops. On the day it does not, the
  only remaining limit is whatever the platform enforces, which on Thursday
  was a spend alarm and 340 dollars.

  Counting model calls rather than iterations is the detail that survives the
  next edit. An iteration counter is correct right up until someone adds a
  retry inside the body, at which point the loop runs five times and calls the
  model eight, and the diff that broke it touched nothing that looks like a
  budget.

  The off-by-one is worth getting right in both directions. A loop that gives
  up after two calls throws away an answer the model was three calls from
  giving, and a learner who tests only the runaway case will not notice. The
  allowance is a ceiling, not a target and not a trigger to stop early.

  What comes back when the calls run out is part of the contract, not an
  afterthought. An empty string is indistinguishable from a bug to whatever
  called this, and a cheerful summary of nothing is worse than both. Carrying
  what the lookups actually returned is what makes the unfinished answer worth
  reading: five calls of research with a sentence saying it did not finish is
  something a person can use, and "I could not complete this" is not.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    An agent never emits a final answer. How do you stop it safely?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I011.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.
