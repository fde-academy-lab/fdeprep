slug: never-run-a-step-on-a-guess
title: A sofa refund went to a dining table the customer still has
day: 9
skill: Run a plan whose steps depend on each other, and never on a guess
artefact_type: code
difficulty: hard
track: agent-loop
est_minutes: 40
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: tool-error-handling, weight: 1.0 }
  - { slug: state-and-memory, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  The returns desk at an online furniture retailer runs an agent that plans a
  return in one go: find the order, open a case, refund it, book a collection
  of the damaged item, and email the customer the refund reference and the
  collection slot. The model writes the plan and the loop executes it.

  Last Tuesday a customer with two accounts reported a damaged sofa. The order
  lookup found two matching orders and answered 200 with an empty order id.
  The executor passed that empty id to the refund API, which reads a blank
  order id as the latest order on the account, and refunded 640 pounds
  against a dining table the customer still has. The sofa was never refunded.

  Every tool did what its documentation says. The executor ran a step on an
  input that did not exist. Write the executor that holds such a step, and
  holds nothing else.

defence_question: |
  In the two-matches case your executor still opened a case for the customer
  while it held the refund, the collection and the email. A reviewer asks for
  the opposite rule, that any failure stops the whole plan, because a
  half-finished return is harder to explain to a customer. Which rule do you
  keep, what does the plan have to say for your rule to be safe, and what
  does a person need to see to finish what was held?

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` replies once with the plan:

      Plan: {"steps": [
        {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
        {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
        ...]}

  An argument written `$<step id>.<field>` is a reference. It stands for that
  field of that step's output and makes this step depend on that one. Every
  other argument is passed as written.

  The tools are `find_order`, `open_case`, `issue_refund`, `book_collection`
  and `email_customer`. Each returns a dict such as
  `{"status": 200, "order_id": "SO-4471"}` or `{"status": 200, "slot": "Thu 10:00-12:00"}`.

  - A step completed when its tool returned a dict whose `status` is from 200
    to 299 and which has no `error` key. Anything else is a failure, including
    an exception and `None`.
  - A reference resolves only when the step it names completed and the field
    holds a value that is not `None` and not an empty string. The value keeps
    its type.
  - A step whose references do not all resolve is blocked, and its tool is
    never called. Blocking follows references and nothing else: a step that
    refers to nothing a failure touched still runs.
  - The plan does not promise to list a step after the steps it refers to.

  Return a JSON string with the keys `completed`, `failed` and `blocked`, each
  a list of step ids in the order the plan lists them.

  Budget: at most 2 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  REFERENCE = re.compile(r"^\$([A-Za-z0-9_-]+)\.([A-Za-z0-9_]+)$")


  def parse_plan(reply: str) -> list:
      """The steps of a 'Plan: {...}' reply, in the order the model wrote them."""
      return []


  def references(step: dict) -> list:
      """(step id, field) for every argument of step that refers to another step."""
      return []


  def completed(result) -> bool:
      """Whether what a tool returned means its step completed."""
      return False


  def run_agent(question: str, llm, tools: dict) -> str:
      """Run the model's plan, and never run a step on an input that does not exist.

      The model replies once with Plan: {"steps": [{"id", "tool", "args"}, ...]}.
      An argument written "$<step id>.<field>" refers to that field of that
      step's output and makes this step depend on that one.

      A step completed when its tool returned a dict with a 2xx status and no
      error key. A reference resolves only when its step completed and the
      field holds a value that is not None and not "". A step whose references
      do not all resolve is blocked, and its tool is never called. Steps that
      refer to nothing a failure touched still run, and the plan may list a
      step before the steps it refers to.

      Return json.dumps({"completed": [...], "failed": [...], "blocked": [...]})
      with step ids in the order the plan lists them.
      At most 2 model calls. Allowed imports: json, re.
      """
      return json.dumps({"completed": [], "failed": [], "blocked": []})

hints:
  - Read the arguments before you run anything. They say which steps each step
    is waiting on.
  - An input that never arrived still turns into a value if you let it, None
    or an empty string, and the tool cannot tell it from a real one. The
    refund API read a blank order id as the latest order.
  - Decide each step from the steps it refers to. Run it when every reference
    resolves to a real value, block it when one does not, and let the block
    spread only along references.
  - Pass over the plan until a pass decides nothing new. A step waits while
    any step it refers to is undecided, which makes the listed order
    irrelevant.
  - A tool that raises has failed. Catch it at the call, record the step as
    failed, and its dependents are blocked like any others.

scenario:
  who: The returns desk at an online furniture retailer
  situation: >-
    The order lookup found two matching orders and answered with an empty
    order id. The executor passed it to the refund API, which reads a blank id
    as the latest order on the account.
  stakes: >-
    640 pounds was refunded against a dining table the customer still has,
    and the damaged sofa was never refunded.
  metrics:
    - { label: Refunded to the wrong order, value: "£640" }
    - { label: Orders the lookup matched, value: "2" }
    - { label: Steps in the plan, value: "5" }

diagram:
  title: Where an empty order id becomes a refund
  caption: >-
    The lookup could not pick one order, and the refund ran anyway. Block a
    step whose input never arrived, and only the steps downstream of it.
  direction: lr
  nodes:
    - { id: model, label: Model, sub: plans five steps, kind: model, tone: teal, at: [0, 1] }
    - { id: case, label: "`open_case()`", sub: needs nothing from the order, kind: tool, tone: neutral, at: [1, 0] }
    - { id: order, label: "`find_order()`", sub: two matches and an empty id, kind: tool, tone: orange, at: [1, 1] }
    - { id: blocked, label: Blocked, sub: never called and reported, kind: output, tone: green, at: [1, 2] }
    - { id: refund, label: "`issue_refund()`", sub: a blank id means the latest order, kind: tool, tone: pink, at: [2, 1] }
    - { id: pickup, label: "`book_collection()`", sub: needs the order id, kind: tool, tone: neutral, at: [2, 2] }
    - { id: email, label: "`email_customer()`", sub: needs the refund and the slot, kind: tool, tone: neutral, at: [3, 1] }
  edges:
    - { from: model, to: order, label: the plan, step: 1 }
    - { from: model, to: case, label: depends on nothing, tone: success }
    - { from: order, to: refund, label: empty `order_id`, step: 2, tone: danger }
    - { from: order, to: pickup, label: "`order_id`" }
    - { from: refund, to: email, label: "`refund_id`" }
    - { from: pickup, to: email, label: slot }
    - { from: order, to: blocked, label: hold its dependents, tone: success }

approach:
  goal: Run each step on real inputs, and hold only the steps that lost theirs
  branches:
    - label: Read the graph from the arguments
      leaves: ["a $`step.field` argument is a dependency", the listed order is not the run order]
    - label: Decide what counts as a real input
      detail: >-
        A step that completed and a field with a value in it. A 200 with an
        error key is a failure.
      leaves: [None and empty strings are not values, an exception is a failure]
    - label: Block along references only
      leaves: [a failed step blocks what refers to it, independent steps still run]
    - label: Report every step's fate
      leaves: [completed, failed and blocked, in plan order]

coach:
  opening: >-
    Before you run anything, draw the plan's dependencies from its arguments.
    The whole problem lives on the edges of that drawing.
  signals:
    - id: never-blocks
      when: { code_lacks: '(?i)blocked["'']?\]?\s*\.(append|add)\(|=\s*["'']blocked["'']|["'']blocked["'']\s*\)' }
      say: >-
        Nothing in your executor ever marks a step as blocked. What does it do
        with a step whose input never arrived?
    - id: one-pass-in-listed-order
      when:
        code_matches: '^\s*for\s+\w+\s+in\s+(plan|steps)\b[^\n]*:'
        code_lacks: '(?i)\bwhile\b|pending|remaining|waiting|ready|topolog|sorted\(|progress|visit|recurs|queue|stack|deque|graph|dependen'
      say: >-
        Your executor walks the plan once, in the order the model listed it.
        What happens when a step comes before the step it needs?
    - id: hidden-empty-id
      when: { test_failed: two_matching_orders_hold_everything_that_needed_one }
      say: >-
        In that run the order lookup answered, but without a usable order id.
        Which of your steps still ran, and what were they handed?
    - id: hidden-only-dependents
      when: { test_failed: a_failed_collection_holds_only_the_email }
      say: >-
        In that run one step answered 200 with an error in its body, partway
        through the plan. Did your executor count it as done, and did it hold
        back more steps than depended on it?
    - id: hidden-out-of-order
      when: { test_failed: a_plan_listed_out_of_order_still_waits_for_its_inputs }
      say: >-
        In that run the plan lists steps before the steps they depend on. Does
        your executor wait for an input, or decide a step before its input
        exists?
    - id: adversarial-raises
      when: { test_failed: adversarial_the_order_lookup_times_out }
      say: >-
        One tool raised instead of answering. Where does your executor catch
        that, and what happens to the steps that were waiting on it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with `references()`: for each argument, pick out the step id and
        field of anything written as $`step.field`. The executor is built on it.
    - id: hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints open after one failed run on this
        tier, and the second one names the mechanism behind the wrong refund.
  wrap_up: >-
    A plan is a graph whose edges are data. Run a step only on inputs that
    exist, let a failure block exactly the steps downstream of it, and report
    every step's fate so a person can finish what was held.

tests:
  - name: every_step_runs_when_every_input_arrives
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Customer C-5520 says their sofa arrived damaged" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
            {"id": "case", "tool": "open_case", "args": {"customer": "C-5520", "reason": "arrived damaged"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5520", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        find_order: { returns: { status: 200, order_id: "SO-4471" } }
        open_case: { returns: { status: 200, case_id: "CS-310" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2201" } }
        book_collection: { returns: { status: 200, slot: "Thu 10:00-12:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [completed, failed, blocked] } }
        - { type: calls_tool, name: email_customer }
        - { type: returns_matches, value: '"completed": \["order", "case", "refund", "pickup", "email"\]' }
        - { type: returns_matches, value: '"blocked": \[\]' }

  - name: a_refund_takes_its_amount_from_the_order
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Customer C-1180 wants a refund for a faulty lamp" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-1180", "item": "lamp"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": "$order.total_cents"}}
            ]}
      tools:
        find_order: { returns: { status: 200, order_id: "SO-9012", total_cents: 12900 } }
        open_case: { returns: { status: 200, case_id: "CS-311" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2210" } }
        book_collection: { returns: { status: 200, slot: "Fri 14:00-16:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: issue_refund }
        - { type: returns_matches, value: '"completed": \["order", "refund"\]' }
        - { type: returns_matches, value: '"failed": \[\]' }

  - name: two_matching_orders_hold_everything_that_needed_one
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Customer C-5520 says their sofa arrived damaged" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
            {"id": "case", "tool": "open_case", "args": {"customer": "C-5520", "reason": "arrived damaged"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5520", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        find_order: { returns: { status: 200, order_id: "", matches: 2 } }
        open_case: { returns: { status: 200, case_id: "CS-312" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2230" } }
        book_collection: { returns: { status: 200, slot: "Thu 10:00-12:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: issue_refund }
        - { type: does_not_call_tool, name: book_collection }
        - { type: calls_tool, name: open_case }
        - { type: returns_matches, value: '"blocked": \["refund", "pickup", "email"\]' }

  - name: a_failed_collection_holds_only_the_email
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Customer C-7310 says their wardrobe door arrived split" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-7310", "item": "wardrobe"}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 21500}},
            {"id": "case", "tool": "open_case", "args": {"customer": "C-7310", "reason": "door split"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-7310", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        find_order: { returns: { status: 200, order_id: "SO-6620" } }
        open_case: { returns: { status: 200, case_id: "CS-313" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2241" } }
        book_collection:
          fixture: tool_soft_error
          params: { status: 200, body: { error: "carrier_unavailable" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: issue_refund }
        - { type: calls_tool, name: open_case }
        - { type: does_not_call_tool, name: email_customer }
        - { type: returns_matches, value: '"failed": \["pickup"\]' }
        - { type: returns_matches, value: '"blocked": \["email"\]' }

  - name: a_plan_listed_out_of_order_still_waits_for_its_inputs
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Customer C-2044 says their bookcase arrived with a cracked shelf" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-2044", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 18900}},
            {"id": "case", "tool": "open_case", "args": {"customer": "C-2044", "reason": "cracked shelf"}},
            {"id": "order", "tool": "find_order", "args": {"customer": "C-2044", "item": "bookcase"}}
            ]}
      tools:
        find_order: { returns: { status: 200, order_id: "SO-3318" } }
        open_case: { returns: { status: 200, case_id: "CS-314" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2255" } }
        book_collection: { returns: { status: 200, slot: "Mon 08:00-10:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: email_customer }
        - { type: returns_matches, value: '"failed": \[\]' }
        - { type: returns_matches, value: '"blocked": \[\]' }

  - name: adversarial_the_order_lookup_times_out
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      The order lookup raised a `TimeoutError` instead of answering. An
      executor written around return values has no branch for that, and the
      exception travels up through the loop and ends the run, taking the
      case that did not need the order with it.

      A step that raises has failed exactly as surely as one that returns an
      error, and the steps waiting on it have nothing real to run on. Caught
      at the call, it is one more failed step: its dependents are blocked,
      and the case, which depends on nothing, is still opened.
    spec:
      kind: agent_run
      input: { question: "Customer C-5577 says their armchair arrived with a torn seat" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5577", "item": "armchair"}},
            {"id": "case", "tool": "open_case", "args": {"customer": "C-5577", "reason": "torn seat"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 34900}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5577", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        find_order:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the order lookup did not answer in time" }
        open_case: { returns: { status: 200, case_id: "CS-315" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2260" } }
        book_collection: { returns: { status: 200, slot: "Wed 12:00-14:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: calls_tool, name: open_case }
        - { type: does_not_call_tool, name: issue_refund }
        - { type: returns_matches, value: '"failed": \["order"\]' }

reference_md: |
  The refund went to the wrong order because the executor had a value where
  it should have had nothing. The lookup answered 200 with an empty order id,
  the reference resolved to that empty string, and the refund API did what
  its documentation says with a blank id. Every component behaved as
  specified and 640 pounds went to the wrong order, because the executor
  never asked whether its input was real.

  A plan is a graph, and here the arguments draw it. `$refund.refund_id` is a
  dependency on the refund step and a demand for one field of its output.
  Reading the references as the graph means the executor needs no separate
  ordering: it decides any step whose inputs are decided, and the model's
  listing order stops mattering. The out-of-order case exists because models
  do list steps in the wrong order, most often in a plan they have revised.

  A real input is a step that completed and a field with something in it. A
  200 with an error key is a failure, a None is a failure, an exception is a
  failure, and an empty string where an id belongs is not an input. Each of
  those, passed along, becomes an argument the next tool cannot tell from a
  real one.

  Blocking has to be exact in both directions. Too little and a step runs on
  a guess, which is the incident. Too much and a carrier outage holds a
  refund that never depended on the carrier, which is a second incident with
  a different customer on the phone. Blocking along the references, and only
  along them, is exact because the references are exactly the dependencies.

  The report is for the person who finishes the job. Completed, failed and
  blocked, in plan order, tells them which tool to look at and which steps
  are waiting on it, without reading a trace.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Step three of the agent's plan needs step two's output, and step two failed. What does your executor do with step three, and with the steps that never needed step two?
  source: |
    Author judgement. No employer frequency data stands behind it.

tools:
  - name: find_order
    args: customer, item
    returns: 'The matched order as `{"status": 200, "order_id": ...}`, sometimes with its `total_cents`.'
  - name: open_case
    args: customer, reason
    returns: '`{"status": 200, "case_id": ...}` once the case is open.'
  - name: issue_refund
    args: order_id, amount_cents
    returns: '`{"status": 200, "refund_id": ...}`. Given a blank `order_id`, it refunds the latest order
      on the account.'
  - name: book_collection
    args: order_id
    returns: '`{"status": 200, "slot": ...}` with the collection slot, such as Thu 10:00-12:00.'
  - name: email_customer
    args: customer, refund_id, slot
    returns: '`{"status": 200, "sent": true}` once the customer is emailed.'
example:
  case: every_step_runs_when_every_input_arrives
  expect: Every tool answers with real values, so run all five steps, filling each `$step.field` reference
    from the step it names, and return all five ids as completed in plan order with nothing blocked.
traps:
  - Treating a 2xx answer that carries an `error` key, or a field holding `None` or an empty string, as
    a real input.
  - Blocking every step after a failure, when only the steps that refer to the failed one should wait.
  - Walking the plan once in listed order, so a step listed before the step it needs is decided on a missing
    input.
  - Letting a tool that raises end the run, when a raised exception is one more failed step.
