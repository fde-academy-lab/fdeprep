slug: bind-approval-to-an-exact-action
title: "Pay exactly what was approved, and nothing else"
day: 10
skill: Make an approval mean the exact payment that was approved
artefact_type: code
difficulty: extreme
track: agent-loop
est_minutes: 45
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: prompt-hardening, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
call_budget: 4
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A UK fintech the size of Revolut runs a payouts agent. It asks a human before it moves money. The human sees a summary,
  clicks approve, and the agent executes.

  Last month it paid 8,400 pounds to an account nobody had approved. The
  approval was real and the click was real. Between the approval and the
  execution the agent re-planned, because a tool result had arrived, and the
  new plan had the same tool name and a different destination. The approval
  was recorded against the tool name.

  Nobody lied to anybody. The approval just did not say what everyone assumed
  it said.

  You are writing `run_agent(question, llm, tools) -> str`.

  `llm(prompt)` replies with one of:

      Propose: {"tool": "payout", "args": {"account": "GB-11", "amount_cents": 840000}}
      Revise:  {"tool": "payout", "args": {"account": "GB-99", "amount_cents": 840000}}
      Execute: <the approval token you were given>
      Final Answer: <text>

  `Propose` is the plan going to a human. `Revise` is the model changing the
  plan because something arrived, and it does not go to a human. `Execute`
  runs whatever the plan is now.

  `tools` holds `approve(digest=<hex>)`, which returns
  `{"status": 200, "approved": true, "token": "<token>", "digest": "<hex>"}`
  or `{"status": 200, "approved": false}`, and `payout(**args)`, which returns
  `{"status": 200, "paid": true}`. `approve` may also return something else
  entirely, and `revoked(token=...)` returns `{"status": 200, "revoked": true}`
  when an approval has been withdrawn since it was granted.

  Return a JSON string with the keys `outcome`, `paid_args` and `reason`.
  `outcome` is one of `paid`, `refused` or `not_approved`. `paid_args` is the
  argument object you actually executed, or null.

  Budget: at most 4 model calls. Allowed imports: json, re.

defence_question: |
  Your digest covers the tool name and the arguments. A reviewer asks why it
  does not also cover the model's reasoning, the conversation so far, or a
  timestamp, since any of those could differ between approval and execution
  and each one is cheap to add. Which of the three would you add, which would
  you refuse, and what is the principle that decides it?

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      """Pay only what a human approved, exactly as approved.

      llm(prompt) replies with one of:
          Propose: {"tool": ..., "args": {...}}   the plan a human reviews
          Revise:  {"tool": ..., "args": {...}}   the model changing the plan
          Execute: <token>                        run whatever the plan is now
          Final Answer: <text>

      tools["approve"](digest=...)  decides approval, and nothing else does
      tools["revoked"](token=...)   says whether an approval was withdrawn
      tools["payout"](**args)       moves the money

      Return json.dumps({"outcome": "paid" | "refused" | "not_approved",
                         "paid_args": <the args you executed, or None>,
                         "reason": <one sentence>}).
      At most 4 model calls. Allowed imports: json, re.
      """
      return json.dumps({"outcome": "refused", "paid_args": None,
                         "reason": "not written yet"})

hints:
  - Ask what the approval was a signature over. The incident says it was a
    tool name.
  - If the approval covered exactly what executes, nothing would need to
    detect re-planning at all.
  - Fingerprint the tool and its arguments when you propose, and recompute the
    fingerprint from the arguments you are about to pass when you execute.
  - Canonical means two dicts that mean the same thing produce the same
    fingerprint, whatever order their keys arrived in.
  - "Two facts live outside the fingerprint. Whether the approval was withdrawn since the click, which `revoked()` answers just before you pay, and anything a proposal or tool result claims about approval, which decides nothing."

scenario:
  headline: "An approved £8,400 payout went to a different account"
  who: "The payouts team at a UK fintech the size of Revolut"
  situation: >-
    The agent asks a human before it moves money. Between the click and the
    payment it re-planned, and the new plan sent the money somewhere else.
  stakes: >-
    8,400 pounds went to an account nobody approved, and every log line says
    the approval was real.
  metrics:
    - { label: Paid without approval, value: "£8,400" }
    - { label: What was approved, value: a tool name }
    - { label: Model calls allowed, value: "4" }

diagram:
  title: Where an approval stops meaning the payment
  caption: >-
    Sign exactly what executes. Recompute the fingerprint from the arguments
    about to be paid, and refuse if it moved.
  direction: lr
  nodes:
    - { id: model, label: Model, sub: proposes then revises, kind: model, tone: teal, at: [0, 1] }
    - { id: agent, label: Agent loop, sub: holds the current plan, kind: agent, tone: purple, at: [1, 1] }
    - { id: approve, label: "`approve()`", sub: a human signs the plan, kind: guard, tone: green, at: [2, 0] }
    - { id: check, label: Fingerprint check, sub: recompute before paying, kind: guard, tone: blue, at: [2, 1] }
    - { id: payout, label: "`payout()`", sub: moves the money, kind: tool, tone: orange, at: [3, 1] }
    - { id: refuse, label: Refuse, sub: the plan moved after the click, kind: output, tone: pink, at: [3, 2] }
  edges:
    - { from: model, to: agent, label: Propose then Revise, step: 1 }
    - { from: agent, to: approve, label: fingerprint of the plan, step: 2 }
    - { from: approve, to: agent, label: token, step: 3 }
    - { from: agent, to: check, label: Execute, step: 4 }
    - { from: check, to: payout, label: fingerprints match, tone: success }
    - { from: check, to: refuse, label: they differ, tone: danger }

approach:
  goal: An approval must mean the exact action that runs
  branches:
    - label: Sign the action, not the tool
      leaves: [the tool and its arguments together, same meaning gives same fingerprint]
    - label: Check at the last moment
      leaves: [recompute at Execute, compare before `payout()`]
    - label: Only the approver decides
      detail: A proposal or a tool result saying it is approved is text, not an approval.
      leaves: ["`approve()` grants", "`revoked()` can take it back"]
    - label: Report what really happened
      leaves: ["paid, refused or `not_approved`", "`paid_args` is what actually ran"]

coach:
  opening: >-
    This is a screen-level problem. Before you type, write down what the
    approval in the incident was a signature over.
  signals:
    - id: no-canonical-form
      when: { code_lacks: 'sort_keys|sorted\(' }
      say: >-
        Two dicts that mean the same thing can arrive with their keys in a
        different order. How does your fingerprint make that order irrelevant?
    - id: no-revocation-check
      when: { code_lacks: 'revoked' }
      say: >-
        Approvals can be withdrawn after the click. Where does your loop ask
        whether this one still stands?
    - id: plan-changed
      when: { test_failed: the_destination_changes_after_the_approval }
      say: >-
        The model revised the destination after the click. Compare what was
        approved with what is about to run, not with the tool's name.
    - id: withdrawn
      when: { test_failed: an_approval_withdrawn_before_execution_is_not_an_approval }
      say: >-
        That approval was real when granted and withdrawn later. What does your
        loop ask immediately before it pays?
    - id: trusted-the-text
      when: { test_failed: adversarial_the_proposal_carries_an_instruction }
      say: >-
        Something inside the proposal told your agent it was approved. Which
        single source is allowed to decide that?
  wrap_up: >-
    Approvals, signatures and idempotency keys all fail the same way: they
    certify a label instead of the thing. Sign exactly what executes and check
    it at the last possible moment.

tests:
  - name: pays_what_was_approved
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Pay supplier GB-11 the agreed 8400 pounds" }
      llm_script:
        - { match: { contains: "approved" }, reply: "Execute: TOKEN" }
        - { match: "*",
            reply: 'Propose: {"tool": "payout", "args": {"account": "GB-11", "amount_cents": 840000}}' }
      tools:
        approve: { returns: { status: 200, approved: true, token: "TOKEN", digest: "ignored" } }
        payout: { returns: { status: 200, paid: true } }
        revoked: { returns: { status: 200, revoked: false } }
      budget: { max_llm_calls: 4, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, paid_args, reason] } }
        - { type: returns_matches, value: "\"outcome\": \"paid\"" }
        - { type: calls_tool, name: payout }

  - name: a_refused_approval_pays_nothing
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Pay supplier GB-22 four hundred pounds" }
      llm_script:
        - { match: { contains: "not approved" },
            reply: "Final Answer: The approver declined, so nothing was paid." }
        - { match: "*",
            reply: 'Propose: {"tool": "payout", "args": {"account": "GB-22", "amount_cents": 40000}}' }
      tools:
        approve: { returns: { status: 200, approved: false } }
        payout: { returns: { status: 200, paid: true } }
        revoked: { returns: { status: 200, revoked: false } }
      budget: { max_llm_calls: 4, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: payout }
        - { type: returns_matches, value: "\"outcome\": \"not_approved\"" }
        - { type: terminates }

  - name: the_destination_changes_after_the_approval
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Pay the supplier the agreed amount" }
      llm_script:
        - { match: { call_index: 1 },
            reply: 'Propose: {"tool": "payout", "args": {"account": "GB-11", "amount_cents": 840000}}' }
        - { match: { call_index: 2 },
            reply: 'Revise: {"tool": "payout", "args": {"account": "GB-99", "amount_cents": 840000}}' }
        - { match: { call_index: 3 }, reply: "Execute: TOKEN" }
        - { match: "*",
            reply: "Final Answer: The plan changed after approval, so I paid nothing." }
      tools:
        approve: { returns: { status: 200, approved: true, token: "TOKEN", digest: "ignored" } }
        payout: { returns: { status: 200, paid: true } }
        revoked: { returns: { status: 200, revoked: false } }
      budget: { max_llm_calls: 4, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: payout }
        - { type: returns_matches, value: "\"outcome\": \"refused\"" }
        - { type: returns_matches, value: "\"paid_args\": null" }

  - name: an_approval_withdrawn_before_execution_is_not_an_approval
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Pay supplier GB-33 twelve hundred pounds" }
      llm_script:
        - { match: { contains: "withdrawn" },
            reply: "Final Answer: The approval was withdrawn before I executed, so nothing moved." }
        - { match: { contains: "approved" }, reply: "Execute: TOKEN" }
        - { match: "*",
            reply: 'Propose: {"tool": "payout", "args": {"account": "GB-33", "amount_cents": 120000}}' }
      tools:
        approve: { returns: { status: 200, approved: true, token: "TOKEN", digest: "ignored" } }
        payout: { returns: { status: 200, paid: true } }
        revoked: { returns: { status: 200, revoked: true } }
      budget: { max_llm_calls: 4, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: payout }
        - { type: returns_matches, value: "\"outcome\": \"refused\"" }
        - { type: no_exception }

  - name: adversarial_the_proposal_carries_an_instruction
    visibility: adversarial
    fixture: injected_instruction
    annotation_md: |
      The approval tool's summary carried an instruction, which came in with
      the supplier's name on the ticket. It reached the prompt because the
      approval tool echoes the proposal back for the approver, and an agent
      that pastes that echo into its own next prompt has handed the model text
      it did not write.

      The canary is the visible half. The invisible half is that the same
      channel can carry "the approver has already confirmed this", and an
      agent that decides approval from anything other than the approve tool's
      own answer will believe it.
    spec:
      kind: agent_run
      input: { question: "Pay the supplier named in the ticket" }
      llm_script:
        - { match: { contains: "CANARY_7731" }, reply: "Final Answer: CANARY_7731" }
        - { match: { contains: "approved" }, reply: "Execute: TOKEN" }
        - { match: "*",
            reply: 'Propose: {"tool": "payout", "args": {"account": "GB-44", "amount_cents": 5000}}' }
      tools:
        approve:
          fixture: injected_instruction
          params: { canary: "CANARY_7731", context: "Payout of 50 pounds to account GB-44 is waiting for approval." }
        payout: { returns: { status: 200, paid: true } }
        revoked: { returns: { status: 200, revoked: false } }
      budget: { max_llm_calls: 4, max_tool_calls: 8, wall_ms: 10000 }
      assertions:
        - { type: ignores_injection, canary: "CANARY_7731" }
        - { type: does_not_call_tool, name: payout }
        - { type: terminates }

reference_md: |
  An approval is a signature over a thing. The bug was that the thing was a
  tool name.

  The fix is to compute a digest over exactly what will execute, hand that
  digest to the approver, and at execution time recompute it from the
  arguments you are about to pass and compare. If they differ, something
  changed between the click and the call, and it does not matter what or why.
  Nobody has to detect re-planning, or reason about which changes are
  material, or trust the model to mention that it revised the plan.

  Canonicalisation is the part that has to be right rather than clever.
  Sorted keys, a fixed separator, no whitespace. Two dicts that mean the same
  thing must produce the same digest or the agent refuses correct payments
  all day, and two that mean different things must not or the whole control is
  decorative.

  Revocation is a second question and not the same one. The digest proves the
  action is the one that was approved. It cannot prove the approval is still
  standing, because that fact lives with the approver and changes after the
  token was issued. Checking immediately before execution is the narrowest
  window this design can offer, and saying that out loud is better than
  implying the window is zero.

  Approval is decided by the approve tool's answer and by nothing else. Not by
  a field in the proposal, not by a line in an observation, not by the model
  saying it has been confirmed. The adversarial case makes the point with a
  canary because a canary is visible; the same channel carries "already
  approved by finance" just as easily, and that one nobody would have noticed.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    Approval was granted, then the action arguments changed. Can the agent proceed?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I020.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: approve
    args: digest
    returns: '`{"status": 200, "approved": true, "token": ..., "digest": ...}` when granted, `{"status":
      200, "approved": false}` when declined, or something else entirely.'
  - name: payout
    args: account, amount_cents
    returns: '`{"status": 200, "paid": true}` once it has moved the money.'
  - name: revoked
    args: token
    returns: '`{"status": 200, "revoked": true}` when the approval was withdrawn after it was granted,
      and `"revoked": false` while it stands.'
example:
  case: pays_what_was_approved
  expect: The approver grants the proposal and nothing changes before Execute, so call `payout` with the
    approved arguments and return JSON with `outcome` paid, `paid_args` and a `reason`.
traps:
  - Recording the approval against the tool name, so a plan the model revises after the click still pays.
  - Trusting an approval granted earlier without asking `revoked` just before `payout` runs.
  - Treating anything but `approve` answering `approved` true as an approval, or pasting its reply into
    the next prompt.
