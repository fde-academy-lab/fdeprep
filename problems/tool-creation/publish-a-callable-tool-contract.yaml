slug: publish-a-callable-tool-contract
title: Publish a tool the model can call without guessing
artefact_type: code
difficulty: easy
track: tool-creation
est_minutes: 20
competencies:
  - { slug: tool-schema-design, weight: 1.0 }
  - { slug: prompt-construction, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A coworking operator's front desk assistant books meeting rooms through one
  tool, `book_room`. When the tool was wired up, somebody published it to the
  model as a name and a line: `book_room: Books a meeting room.`

  On Thursday a member asked for the Rooftop, which is a terrace and cannot be
  booked. Nothing told the model that, so it called `book_room` with it, and
  the booking API, which falls back to the first free room when it does not
  recognise a name, put the member in Cedar. On Friday the model booked Oak
  for a design review without a length, because nothing said a length was
  needed, and the API used its thirty minute default. The review was asked to
  leave after half an hour.

  The model knows the tool only through what your code publishes. Publish
  everything it needs.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  The booking API's client declares the tool like this, and that declaration
  is the only source of truth:

      def book_room(room: Literal["Cedar", "Birch", "Oak"], start: str,
                    minutes: int, note: str = "") -> dict

  `start` is local time as YYYY-MM-DDTHH:MM and `minutes` is the length of the
  meeting. The tool returns `{"status": 200, "booking": <ref>}` when it books.

  Complete `BOOK_ROOM` in the stub as the contract the model reads:
  `{"name", "description", "input_schema"}`, where `input_schema` is JSON
  Schema. The model reads nothing else, so the schema has to say everything
  the declaration says: each parameter's JSON type and a description of what
  it holds, the values `room` can take, and which parameters have no default.
  Put the contract in the first prompt as JSON, using `json.dumps`.

  `llm(prompt)` replies with `Action: book_room({...})`, where the arguments
  are a JSON object, or with `Final Answer: <text>`. Return the final answer.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  # The booking API's own declaration, and the only source of truth:
  #
  #     def book_room(room: Literal["Cedar", "Birch", "Oak"], start: str,
  #                   minutes: int, note: str = "") -> dict
  #
  # start is local time as YYYY-MM-DDTHH:MM, and minutes is the meeting length.

  BOOK_ROOM = {
      "name": "book_room",
      "description": "Books a meeting room.",
      "input_schema": {
          "type": "object",
          "properties": {
              # TODO 1: give room, start, minutes and note a JSON type and a
              #         description each
          },
          # TODO 2: room takes one of three names. Say which, in its property.
          # TODO 3: list the parameters that have no default
      },
  }

  _ACTION = re.compile(r"Action:\s*(\w+)\((\{.*\})\)\s*$", re.MULTILINE | re.DOTALL)


  def run_agent(question: str, llm, tools: dict) -> str:
      # TODO 4: put BOOK_ROOM in the first prompt as JSON, before the question
      scratchpad = f"Question: {question}\n"

      for _ in range(3):
          output = llm(scratchpad)

          if "Final Answer:" in output:
              return output.split("Final Answer:", 1)[1].strip()

          action = _ACTION.search(output)
          if action is None or action.group(1) not in tools:
              scratchpad += f"{output}\nThat was not a tool you have.\n"
              continue

          # TODO 5: call the tool with the JSON arguments and append what it
          #         returned to the scratchpad
          scratchpad += f"{output}\n"

      return "I could not book that room."

steps:
  - id: s1
    text: Give every parameter a JSON type and a description.
    check_id: s1
  - id: s2
    text: List the three rooms room can take.
    check_id: s2
  - id: s3
    text: List the parameters that have no default as required.
    check_id: s3
  - id: s4
    text: Publish the contract in the first prompt as JSON.
    check_id: s4
  - id: s5
    text: Call the tool and put what it returned in the scratchpad.
    check_id: s5

step_checks:
  # The public tool books whatever arguments arrive, so no public case shows
  # what the contract says. Steps 1 to 4 each carry their own case, where the
  # model answers well only when the published contract carries that step's
  # part. Steps 1 to 3 accept the contract in either quote style, so each one
  # reports its own part; step 4 asks for JSON.
  #
  # s1 reads each parameter's object: a type (integer for minutes, string for
  # the rest) and a description that is not empty.
  - step_id: s1
    spec:
      kind: agent_run
      input: { question: "What do you need from me to book a room?" }
      llm_script:
        - { match: { regex: '(?=[\s\S]*["'']room["'']:\s*\{(?=[^{}]*["'']type["'']:\s*["'']string["''])(?=[^{}]*["'']description["'']:\s*["''][^"'']))(?=[\s\S]*["'']start["'']:\s*\{(?=[^{}]*["'']type["'']:\s*["'']string["''])(?=[^{}]*["'']description["'']:\s*["''][^"'']))(?=[\s\S]*["'']minutes["'']:\s*\{(?=[^{}]*["'']type["'']:\s*["'']integer["''])(?=[^{}]*["'']description["'']:\s*["''][^"'']))(?=[\s\S]*["'']note["'']:\s*\{(?=[^{}]*["'']type["'']:\s*["'']string["''])(?=[^{}]*["'']description["'']:\s*["''][^"'']))' },
            reply: "Final Answer: Tell me which room, the start as YYYY-MM-DDTHH:MM and the length in whole minutes, plus any note for the screen by the door." }
        - { match: "*",
            reply: "Final Answer: I cannot tell what a booking needs from you, so please ask at the front desk." }
      tools:
        book_room: { returns: { status: 200, booking: "BK-4417" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)length in whole minutes" }
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "Book the Library on Wednesday 14 October at 09:00 for 30 minutes" }
      llm_script:
        - { match: { regex: '["'']room["'']:\s*\{[^{}]*["'']enum["'']:\s*\[(?=[^\]]*["'']Cedar["''])(?=[^\]]*["'']Birch["''])(?=[^\]]*["'']Oak["''])' },
            reply: "Final Answer: The Library cannot be booked. The rooms I can book are Cedar, Birch and Oak." }
        - { match: "*",
            reply: 'Action: book_room({"room": "Library", "start": "2026-10-14T09:00", "minutes": 30})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-5108" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: book_room }
        - { type: returns_matches, value: "(?i)Library cannot be booked" }
  - step_id: s3
    spec:
      kind: agent_run
      input: { question: "Book Birch for the budget review on Tuesday 13 October at 11:30" }
      llm_script:
        - { match: { regex: '["'']required["'']:\s*\[(?=[^\]]*["'']room["''])(?=[^\]]*["'']start["''])(?=[^\]]*["'']minutes["''])(?![^\]]*["'']note["''])' },
            reply: "Final Answer: How many minutes do you need Birch for? Once I have a length I can book it." }
        - { match: "*",
            reply: 'Action: book_room({"room": "Birch", "start": "2026-10-13T11:30"})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-5109" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: book_room }
        - { type: returns_matches, value: "(?i)how many minutes" }
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "Can you book meeting rooms for me here?" }
      llm_script:
        - { match: { regex: '(?=[\s\S]*"name":\s*"book_room")(?=[\s\S]*"input_schema":\s*\{)' },
            reply: "Final Answer: I can book a meeting room for you. Tell me which room, when it starts and how long you need it." }
        - { match: "*",
            reply: "Final Answer: I have no way to book rooms from here, so please ask at the front desk." }
      tools:
        book_room: { returns: { status: 200, booking: "BK-5110" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "(?i)I can book a meeting room" }
        - { type: llm_calls_at_most, value: 1 }
  - step_id: s5
    spec:
      assertions:
        - { type: calls_tool, name: book_room }

hints:
  - The model knows the tool only through what your code publishes. Read
    BOOK_ROOM as if it were everything you knew about the booking API.
  - JSON Schema says more than types. A fixed set of values is an enum, and
    the parameters a call cannot do without are listed in required.
  - The declaration already says both. room is a Literal of three names, and
    note is the only parameter with a default.
  - Put the whole contract in the first prompt with json.dumps, so the model
    reads the same description of the tool on every call.
  - "Work in this order: a type and a description for every parameter, the
    allowed values for the one with a fixed set, the list of parameters with
    no default, then the contract in the first prompt."

scenario:
  who: The front desk team at a coworking operator
  situation: >-
    The room booking tool was published to the model as one line. This week
    the model booked a terrace that is not a room, and booked Oak with no
    length, and both times the booking API filled the gap with its own
    default.
  stakes: >-
    A two hour design review was asked to leave Oak after thirty minutes, and
    a member who asked for the terrace was booked into a room they never
    asked for.
  metrics:
    - { label: Bad bookings this week, value: "2" }
    - { label: Default length, value: 30 min }
    - { label: Rooms that can be booked, value: "3" }

diagram:
  title: Where the model learns what the tool takes
  caption: >-
    The model sees only the contract in its prompt. A one-line contract leaves
    it guessing, and the booking API turns every guess into a default.
  direction: lr
  nodes:
    - { id: member, label: Member, sub: asks for a room, kind: actor, tone: blue, at: [0, 1] }
    - { id: contract, label: Tool contract, sub: "types, enum, required", kind: doc, tone: green, at: [1, 0] }
    - { id: agent, label: Agent loop, sub: builds the prompt, kind: agent, tone: purple, at: [1, 1] }
    - { id: model, label: Model, sub: fills in the arguments, kind: model, tone: teal, at: [2, 0] }
    - { id: tool, label: book_room(), sub: falls back to defaults, kind: tool, tone: orange, at: [3, 1] }
    - { id: defaults, label: Wrong room or 30 minutes, sub: what a guess turns into, kind: output, tone: pink, at: [2, 2] }
  edges:
    - { from: member, to: agent, label: request, step: 1 }
    - { from: contract, to: agent, label: published once, tone: muted }
    - { from: agent, to: model, label: contract and question, step: 2 }
    - { from: model, to: agent, label: "Action: book_room({...})", step: 3 }
    - { from: agent, to: tool, label: the model's arguments, step: 4 }
    - { from: tool, to: defaults, label: a missing or unknown value, tone: danger }

approach:
  goal: Give the model everything it needs to call the tool, so it guesses nothing
  branches:
    - label: Start from the declaration
      detail: The API client's signature is the source of truth. The contract is its translation.
      leaves: [str to string and int to integer, a Literal is a fixed set of values]
    - label: Say which values exist
      leaves: [three rooms by name, a terrace is not on the list]
    - label: Say what cannot be left out
      leaves: [no default means the call needs it, a missing length is a question for the member]
    - label: Publish it where the model reads
      leaves: [the first prompt as JSON, the same contract on every call]

coach:
  opening: >-
    Read the contract your code publishes as if it were all you knew about the
    booking API. Then ask what the model would have to guess.
  signals:
    - id: no-types
      when: { code_lacks: '["'']integer["'']' }
      say: >-
        Nothing in your contract says minutes is an integer. What would the
        model send for a length if nothing said what type it was?
    - id: not-published
      when: { code_lacks: 'dumps\(|\{\s*BOOK_ROOM\s*\}|str\(\s*BOOK_ROOM' }
      say: >-
        Nothing turns the contract into text. How does the model read BOOK_ROOM
        if it never reaches the prompt?
    - id: no-enum
      when: { code_lacks: '["'']enum["'']' }
      say: >-
        Nothing in your contract says which rooms exist. When a member asks for
        a room that is not one of the three, what stops the model booking it?
    - id: required-empty
      when: { code_matches: '["'']required["'']\s*:\s*\[\s*\]' }
      say: >-
        required is an empty list, which tells the model every parameter is
        optional. Which ones have no default in the declaration?
    - id: no-required
      when: { code_lacks: '["'']required["'']' }
      say: >-
        Nothing tells the model which parameters it cannot leave out. What does
        the booking API do with a booking that has no length?
    - id: hidden-unknown-room
      when: { test_failed: a_room_that_is_not_on_the_list_is_not_booked }
      say: >-
        A member asked for a room that cannot be booked, and the model booked
        it. What in your contract tells the model which rooms exist?
    - id: hidden-no-length
      when: { test_failed: a_booking_with_no_length_is_asked_about }
      say: >-
        That member gave no length and the model booked anyway. How does a
        contract tell the model that a parameter cannot be left out?
    - id: hidden-no-descriptions
      when: { test_failed: a_described_contract_gets_the_arguments_right }
      say: >-
        The model guessed in that run: the format of the start time, and where
        the line for the door screen goes. A type says what kind of value a
        parameter takes. What tells the model what the value means?
    - id: hidden-note-required
      when: { test_failed: a_booking_with_no_note_goes_ahead }
      say: >-
        That member wanted no note, and the model would not book without one.
        note has a default in the declaration. What does your contract say
        about it?
    - id: hidden-not-json
      when: { test_failed: the_contract_reaches_the_model_as_json }
      say: >-
        The model did not recognise your contract in that run and guessed the
        argument names. A dict printed as it is comes out in Python's notation,
        with single quotes. What does json.dumps give the model instead?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1 and TODO 4: give each parameter a JSON type, publish
        the contract and run. The trace shows the arguments the model sends
        once it can see them.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. The hints are open on this tier, and the
        first one says where the model gets its idea of the tool.
  wrap_up: >-
    A tool contract is all the model knows about your API. Put in it every
    fact a new colleague would have to ask about: the names, the types, the
    values that exist and what cannot be left out.

tests:
  - name: books_a_room_the_member_named
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Book Cedar on Thursday 8 October at 14:00 for 60 minutes" }
      llm_script:
        - { match: { contains: "BK-2291" },
            reply: "Final Answer: Cedar is booked for Thursday 8 October, 14:00 to 15:00. Your reference is BK-2291." }
        - { match: { regex: '["'']minutes["'']:\s*\{[^{}]*["'']type["'']:\s*["'']integer["'']' },
            reply: 'Action: book_room({"room": "Cedar", "start": "2026-10-08T14:00", "minutes": 60})' }
        - { match: "*",
            reply: 'Action: book_room({"room": "Cedar", "time": "Thursday 2pm", "length": "an hour"})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-2291" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: book_room }
        - { type: returns_matches, value: "BK-2291" }
        - { type: llm_calls_at_most, value: 3 }

  - name: answers_without_booking
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What time does the building close on Fridays?" }
      llm_script:
        - { match: "*", reply: "Final Answer: The building closes at 19:00 on Fridays." }
      tools:
        book_room: { returns: { status: 200, booking: "BK-0001" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: returns_matches, value: "19:00" }
        - { type: does_not_call_tool, name: book_room }
        - { type: llm_calls_at_most, value: 1 }

  - name: a_room_that_is_not_on_the_list_is_not_booked
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Book the Rooftop on Friday 9 October at 16:00 for 45 minutes" }
      llm_script:
        - { match: { regex: '["'']enum["'']:\s*\[[^\]]*["'']Cedar["'']' },
            reply: "Final Answer: The Rooftop is not a room I can book. I can book Cedar, Birch or Oak." }
        - { match: { contains: "BK-3310" },
            reply: "Final Answer: The Rooftop is booked. Your reference is BK-3310." }
        - { match: "*",
            reply: 'Action: book_room({"room": "Rooftop", "start": "2026-10-09T16:00", "minutes": 45})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-3310" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: book_room }
        - { type: returns_matches, value: "(?i)not a room I can book" }
        - { type: no_exception }

  - name: a_booking_with_no_length_is_asked_about
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Book Oak for the design review on Friday 9 October at 10:00" }
      llm_script:
        - { match: { regex: '["'']required["'']:\s*\[[^\]]*["'']minutes["'']' },
            reply: "Final Answer: How long do you need Oak for? I need a length before I can book it." }
        - { match: { contains: "BK-3311" },
            reply: "Final Answer: Oak is booked from 10:00. Your reference is BK-3311." }
        - { match: "*",
            reply: 'Action: book_room({"room": "Oak", "start": "2026-10-09T10:00"})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-3311" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: book_room }
        - { type: returns_matches, value: "(?i)how long" }
        - { type: no_exception }

  # The member gives the time in words and a line for the door screen. The
  # model sends the start in the stated format, and puts the line in note,
  # only when every parameter carries a description.
  - name: a_described_contract_gets_the_arguments_right
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Book Oak on Monday 12 October at half past two for an hour and a half, and put Supplier call on the door screen" }
      llm_script:
        - { match: { contains: "BK-4729" },
            reply: "Final Answer: Oak is booked for Monday 12 October from 14:30. Your reference is BK-4729." }
        - { match: { regex: '(?=[\s\S]*["'']room["'']:\s*\{[^{}]*["'']description["'']:\s*["''][^"''])(?=[\s\S]*["'']start["'']:\s*\{[^{}]*["'']description["'']:\s*["''][^"''])(?=[\s\S]*["'']minutes["'']:\s*\{[^{}]*["'']description["'']:\s*["''][^"''])(?=[\s\S]*["'']note["'']:\s*\{[^{}]*["'']description["'']:\s*["''][^"''])' },
            reply: 'Action: book_room({"room": "Oak", "start": "2026-10-12T14:30", "minutes": 90, "note": "Supplier call"})' }
        - { match: "*",
            reply: 'Action: book_room({"room": "Oak", "start": "Monday 12 October, half past two", "minutes": 90})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-4729" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: book_room,
            args: { start: "2026-10-12T14:30", minutes: 90, note: "Supplier call" } }
        - { type: returns_matches, value: "BK-4729" }

  - name: a_booking_with_no_note_goes_ahead
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Book Cedar on Thursday 15 October at 16:00 for 30 minutes" }
      llm_script:
        - { match: { contains: "BK-4730" },
            reply: "Final Answer: Cedar is booked for Thursday 15 October, 16:00 to 16:30. Your reference is BK-4730." }
        - { match: { regex: '["'']required["'']:\s*\[[^\]]*["'']note["'']' },
            reply: "Final Answer: What should the screen by the door say? I need a note before I can book Cedar." }
        - { match: "*",
            reply: 'Action: book_room({"room": "Cedar", "start": "2026-10-15T16:00", "minutes": 30})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-4730" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: book_room }
        - { type: returns_matches, value: "BK-4730" }

  # A Python repr of the contract has single quotes where JSON has double
  # ones, and the model does not read it as a tool contract, so it guesses
  # the argument names the way it did before the contract existed.
  - name: the_contract_reaches_the_model_as_json
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Book Birch on Friday 16 October at 08:30 for 45 minutes" }
      llm_script:
        - { match: { contains: "BK-4731" },
            reply: "Final Answer: Birch is booked for Friday 16 October, 08:30 to 09:15. Your reference is BK-4731." }
        - { match: { regex: '"input_schema":\s*\{' },
            reply: 'Action: book_room({"room": "Birch", "start": "2026-10-16T08:30", "minutes": 45})' }
        - { match: "*",
            reply: 'Action: book_room({"room": "Birch", "when": "Friday 08:30", "length": "45 minutes"})' }
      tools:
        book_room: { returns: { status: 200, booking: "BK-4731" } }
      budget: { max_llm_calls: 3, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: calls_tool_with, name: book_room,
            args: { room: "Birch", start: "2026-10-16T08:30", minutes: 45 } }
        - { type: returns_matches, value: "BK-4731" }

reference_md: |
  The model cannot see the booking API. It sees a prompt, and whatever the
  prompt says about `book_room` is the whole of its knowledge. A one-line
  description is a contract too. It says the tool takes any arguments, that
  every one of them is optional, and that any string names a room, and the
  model believed all three.

  Everything in the fix comes from the declaration the API's own client
  already carries. `Literal["Cedar", "Birch", "Oak"]` is an enum, and without
  it the model has no way to know the Rooftop is a terrace. A parameter with
  no default is required, and without `required` the model treats a missing
  length as a detail it may leave out. The API filled it in instead, with a
  thirty minute default that nobody chose. Types and descriptions carry the
  rest: `minutes` is a whole number of minutes, and `start` is local time in
  one stated format.

  The contract is built once and published in the first prompt as JSON, and
  the model reads the same contract on every call. Two descriptions of one
  tool, one in the prompt and one in somebody's head, are how the first
  incident happened.

  A good contract makes a wrong call less likely. It cannot make one
  impossible, because the model can still send a value the schema forbids.
  The dispatcher still checks the arguments against the same schema before
  anything is called, which is the other half of the job and the subject of
  "Validate what the model asked for before you do it".

complexity: C2

interview_evidence:
