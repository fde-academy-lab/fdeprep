slug: repair-an-invalid-json-response
title: "Repair invalid JSON before it moves on"
drill: true
skill: Give the downstream system JSON it can actually parse
artefact_type: code
difficulty: easy
track: tools
concept:
  topic: "Strict input schemas"
  question: "What do you do when the model's JSON will not parse?"
est_minutes: 20
competencies:
  - { slug: tool-schema-design, weight: 1.0 }
  - { slug: prompt-construction, weight: 0.5 }
call_budget: 3
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A ticket triage service hands its output straight to the client's workflow
  engine, which does `JSON.parse` and nothing else. Since Tuesday it has been
  returning 500s on roughly one ticket in six.

  The traces show why. The model is asked for JSON and mostly returns JSON,
  but sometimes wraps it in a fenced code block, and sometimes leaves a
  trailing comma after the last field. Both are still obviously the right
  answer to a human reading the trace, which is why nobody spotted it for two
  days.

  The client's engine will not be changed. Your service has to send something
  it can parse, every time.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` returns a string that should be a JSON object with the keys
  `category`, `priority` and `order_id`. The ticket text arrives as
  `question`. There are no tools.

  Return the JSON as a string. You get one repair attempt: when the first
  reply does not parse, tell the model that it did not parse, say what was
  wrong with it, and ask once more. When the second reply does not parse
  either, return the fallback the stub ends with:

      {"category": "unknown", "priority": "unknown", "order_id": null}

  Do not fill in a field the model did not give you.

  Budget: at most 3 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re


  def run_agent(question: str, llm, tools: dict) -> str:
      scratchpad = f"Ticket: {question}\n"

      for _ in range(8):
          reply = llm(scratchpad)

          # TODO 1: strip a fenced code block if there is one
          # TODO 2: try to parse what is left
          # TODO 3: on failure, append what went wrong and ask once more
          # TODO 4: on success, return it as a JSON string
          pass

      return json.dumps({"category": "unknown", "priority": "unknown", "order_id": None})

steps:
  - id: s1
    text: Strip a fenced code block before parsing.
    check_id: s1
  - id: s2
    text: Parse what is left and catch the failure.
    check_id: s2
  - id: s3
    text: Append what was wrong with the reply so the retry differs.
    check_id: s3
  - id: s4
    text: Return a JSON string in every case, including total failure.
    check_id: s4

step_checks:
  # Both public replies are clean JSON, so steps 1 to 3 each carry their own
  # case: a fenced reply, a reply that does not parse followed by one that
  # does, and a cut-off reply the model repairs only once it is told the
  # reply did not parse.
  - step_id: s1
    spec:
      kind: agent_run
      input: { question: "Discount code SPRING10 was not applied to order 6035" }
      llm_script:
        - { match: "*", reply: "```json\n{\"category\": \"pricing\", \"priority\": \"low\", \"order_id\": \"6035\"}\n```" }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "pricing" }
  - step_id: s2
    spec:
      kind: agent_run
      input: { question: "The tracking link for order 3158 opens a blank page" }
      llm_script:
        - { match: { call_index: 1 }, reply: '{"category": "tracking", "priority": "low", "order_id": "3158"' }
        - { match: "*", reply: '{"category": "tracking", "priority": "low", "order_id": "3158"}' }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "tracking" }
  - step_id: s3
    spec:
      kind: agent_run
      input: { question: "The gift message on order 9024 was printed in the wrong language" }
      llm_script:
        - { match: { contains: "did not parse" },
            reply: '{"category": "gifting", "priority": "low", "order_id": "9024"}' }
        - { match: "*", reply: '{"category": "gifting", "priority": "low", "order_id":' }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "9024" }
        - { type: llm_calls_at_most, value: 2 }
  # Every public reply parses, so s4 carries its own case too: neither reply
  # parses here, and the step holds only when the loop stops after its one
  # repair and still returns JSON. A loop that keeps asking runs into the
  # budget and returns nothing.
  - step_id: s4
    spec:
      kind: agent_run
      input: { question: "The courier left my parcel at the wrong house on Elm Road" }
      llm_script:
        - { match: { contains: "did not parse" },
            reply: "category=delivery; priority=high; order_id=not given" }
        - { match: "*", reply: "I would file this under delivery, with high priority." }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }

hints:
  - A fence is three backticks and an optional language name. It is not JSON
    and it never was.
  - "`json.loads` raises. Something has to catch it, and the something is not the client's workflow engine."
  - Telling the model the reply did not parse is a different prompt from
    asking the same question again.
  - Unwrapping and parsing are two separate steps. A reply can be fenced and
    still broken inside the fence, so the repair runs whenever the parse fails,
    whatever the reply was wrapped in.
  - "In order: take off a fence if there is one, try `json.loads`, return the object as a JSON string when it parses, and when it does not, append the reply and the parser's message, say it did not parse, and go round once more."

scenario:
  headline: "About one ticket in six fails and never reaches a queue"
  who: The team running a ticket triage service for a client's workflow engine
  situation: >-
    The engine calls JSON.parse on whatever the service sends. Since Tuesday
    the model has wrapped some replies in a code fence and left a trailing
    comma in others, and the engine rejects both.
  stakes: >-
    About one ticket in six fails with a 500 and reaches no queue. Both
    replies look right to a person reading the trace, which is why it took two
    days to spot.
  metrics:
    - { label: Tickets failing, value: 1 in 6 }
    - { label: Days before anyone noticed, value: "2" }
    - { label: Repair attempts allowed, value: "1" }

diagram:
  title: Where a reply that looks right fails to parse
  caption: >-
    The repair sits between the model and the engine. Without it, a reply a
    person would accept goes straight to JSON.parse and fails there.
  direction: lr
  nodes:
    - { id: ticket, label: Ticket, sub: customer text, kind: doc, tone: blue, at: [0, 1] }
    - { id: model, label: Model, sub: asked for one JSON object, kind: model, tone: teal, at: [1, 0] }
    - { id: service, label: Triage service, sub: your code, kind: agent, tone: purple, at: [1, 1] }
    - { id: repair, label: Parse and repair, sub: "unwrap, parse, ask once more", kind: guard, tone: green, at: [2, 1] }
    - { id: engine, label: Workflow engine, sub: JSON.parse and nothing else, kind: service, tone: orange, at: [3, 1] }
    - { id: failure, label: 500 from the engine, sub: the ticket reaches no queue, kind: output, tone: pink, at: [2, 2] }
  edges:
    - { from: ticket, to: service, label: ticket text, step: 1 }
    - { from: service, to: model, label: prompt, step: 2 }
    - { from: model, to: service, label: "fenced, or a trailing comma", step: 3 }
    - { from: service, to: repair, label: every reply, step: 4 }
    - { from: repair, to: engine, label: an object that parses, tone: success }
    - { from: service, to: failure, label: raw reply sent on, tone: danger }

approach:
  goal: Send the engine JSON it can parse on every ticket
  branches:
    - label: Unwrap before you parse
      leaves: [a fence is not JSON, the object inside may still be fine]
    - label: Catch the parse failure
      leaves: ["`json.loads` raises", the engine must never see the raise]
    - label: Repair once, with a different prompt
      detail: The same prompt gets the same reply, so the retry has to say what failed.
      leaves: [one retry that carries the parser's message, then stop]
    - label: Invent nothing
      leaves: [a missing `order_id` stays null, a JSON fallback when both attempts fail]

coach:
  opening: >-
    Take one of the failing replies, a fenced block with an object inside, and
    follow it through your code line by line until something parses it or
    something raises.
  signals:
    - id: unguarded-parse
      when: { code_matches: 'json\.loads\(', code_lacks: '\bexcept\b' }
      say: >-
        `json.loads` raises on anything that is not JSON, and nothing in your
        code catches it. Where should that failure go, if not to the client's
        engine?
    - id: no-fence-handling
      when: { code_lacks: '`|chr\(96\)|\\x60|find\(\s*["'']\{|index\(\s*["'']\{|\\\{' }
      say: >-
        Nothing in your code deals with a fence. What does `json.loads` make of a
        reply that starts with three backticks and the word json?
    - id: returns-the-raw-reply
      when: { code_matches: 'return\s+(reply|output|raw|text)\b' }
      say: >-
        You return the model's reply exactly as it came. The engine parses
        what you return, so return what you parsed.
    - id: same-prompt-retry
      when: { code_matches: '\bexcept\b[^\n]*:\s*\n\s*continue\b' }
      say: >-
        Your retry sends the prompt that produced the broken reply. The model
        will answer it the same way. What does the retry need to carry?
    - id: hidden-fence
      when: { test_failed: strips_a_fenced_block }
      say: >-
        That reply arrived inside a fenced code block. Trace what your code
        hands to `json.loads` in that case.
    - id: hidden-trailing-comma
      when: { test_failed: repairs_a_trailing_comma_once }
      say: >-
        That first reply had a trailing comma, and the model sends a clean one
        only once it is told its last reply did not parse. Does your retry tell
        it that, and why?
    - id: hidden-broken-inside-fence
      when: { test_failed: a_fence_around_broken_json_is_still_broken }
      say: >-
        That reply was fenced and also broken inside the fence. Unwrapping it
        is one step. What happens in your code after the parse fails?
    - id: hidden-total-failure
      when: { test_failed: a_reply_that_never_parses_gets_the_fallback }
      say: >-
        Neither reply in that run parsed, not even the repair. What does your
        code send the engine once its one repair attempt has failed, and how
        many times did it ask the model?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with TODO 1, TODO 2 and TODO 4: take off a fence, parse, and
        return `json.dumps` of the object. Both public tests go green with that
        alone.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. The hints go in order, and the first one
        says where to look.
  wrap_up: >-
    A model asked for JSON returns JSON most of the time, and most of the time
    is the failure. The service that owns the client's contract owns the
    repair: bounded, told what failed, and never inventing a field.

tests:
  - name: parses_a_clean_reply
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Parcel never arrived, order 8812, customer is furious" }
      llm_script:
        - { match: "*", reply: '{"category": "delivery", "priority": "high", "order_id": "8812"}' }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object,
                      required: [category, priority, order_id],
                      properties: { category: { type: string }, priority: { type: string } } } }
        - { type: returns_matches, value: "delivery" }
        - { type: llm_calls_at_most, value: 2 }

  - name: answers_a_second_clean_ticket
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Item arrived damaged, order 2290, wants replacement" }
      llm_script:
        - { match: "*", reply: '{"category": "returns", "priority": "high", "order_id": "2290"}' }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "2290" }
        - { type: no_exception }

  - name: strips_a_fenced_block
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Wrong size sent, order 4410" }
      llm_script:
        - { match: "*", reply: "```json\n{\"category\": \"returns\", \"priority\": \"normal\", \"order_id\": \"4410\"}\n```" }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "returns" }
        - { type: no_exception }

  - name: repairs_a_trailing_comma_once
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Card declined at checkout twice" }
      llm_script:
        - { match: { contains: "did not parse" },
            reply: '{"category": "billing", "priority": "normal", "order_id": null}' }
        - { match: "*",
            reply: '{"category": "billing", "priority": "normal", "order_id": null,}' }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "billing" }
        - { type: no_exception }

  - name: a_fence_around_broken_json_is_still_broken
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Cannot log in since the update" }
      llm_script:
        - { match: { contains: "did not parse" },
            reply: '{"category": "access", "priority": "high", "order_id": null}' }
        - { match: "*",
            reply: "```json\n{\"category\": \"access\", \"priority\": \"high\" \"order_id\": null}\n```" }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [category, priority, order_id] } }
        - { type: returns_matches, value: "access" }
        - { type: terminates }

  # Neither reply parses, the repair included, so the one correct answer is
  # the fallback after two model calls. A loop that keeps asking runs into
  # the budget instead.
  - name: a_reply_that_never_parses_gets_the_fallback
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "My loyalty points disappeared after I changed my email address" }
      llm_script:
        - { match: { contains: "did not parse" },
            reply: "```json\n{'category': 'account', 'priority': 'normal', 'order_id': None}\n```" }
        - { match: "*", reply: "{category: account, priority: normal, order_id: null}" }
      budget: { max_llm_calls: 3, max_tool_calls: 2, wall_ms: 10000 }
      assertions:
        - { type: terminates }
        - { type: valid_json_return,
            schema: { type: object,
                      required: [category, priority, order_id],
                      properties: { category: { const: unknown },
                                    priority: { const: unknown },
                                    order_id: { type: "null" } } } }
        - { type: llm_calls_at_most, value: 2 }

reference_md: |
  Three lines of code and one decision about where the boundary is.

  The decision is that this service owns the contract, not the model and not
  the client. The model produces something JSON-shaped; turning that into
  something parsable is this code's job, and shipping the model's raw string
  onward is this code declining to do it. The client's workflow engine was
  never going to grow a fence-stripper.

  Repair has to be bounded and it has to change the prompt. One attempt,
  carrying the parser's own complaint, is a different question from the one
  that just failed. Asking the same question again gets the same reply, and a
  loop that keeps asking turns a parse error into a spend.

  When the repaired reply fails too, the service stops asking and sends the
  fallback, with category and priority unknown and no order id. The engine
  can parse that and route it to a person, and it can do neither with an
  exception.

  The field that must not be filled in is `order_id`. A triage service that
  invents an order id sends a real customer's complaint to a real stranger's
  order, and the value looks exactly as plausible as a correct one. Returning
  null is the honest answer when the model gave nothing, and the workflow
  engine can route on null.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    A model returns malformed output twice. How should the service respond?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I005.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

example:
  case: parses_a_clean_reply
  expect: 'The reply is clean JSON, so parse it and return it with `json.dumps`: category delivery, priority
    high and order 8812, with no repair needed.'
traps:
  - Parsing a reply wrapped in a fenced code block as it arrived, so the fence makes a correct object
    fail.
  - Retrying with the same prompt after a parse failure; the repair has to say the reply did not parse
    and what was wrong.
  - Treating a stripped fence as the fix, so broken JSON inside a fence never gets its repair.
  - Asking again after the repair fails too, or sending anything but the fallback JSON once it has.
