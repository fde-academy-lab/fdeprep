slug: fall-back-only-when-the-policy-permits
title: "Use the fallback tool only when policy allows"
day: 7
skill: Fall back to the stronger tool only when the policy says so
artefact_type: code
difficulty: hard
track: harness
concept:
  topic: "Retries and fallbacks"
  question: "When is a fallback allowed to take over?"
est_minutes: 35
competencies:
  - { slug: tool-error-handling, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: system-design, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  A mobile network's customer agent answers questions about an account
  through `account_api`, which only returns what the caller is allowed to see.
  When `account_api` fails, the agent falls back to `staff_console`, the tool
  the support floor uses. The console can read and change any account, and it
  skips the identity check, because the people who normally use it have
  already passed one.

  The fallback rule in the code was one line: if `account_api` fails, try
  `staff_console`. During Tuesday's forty minute outage the console answered
  37 requests, and two of them should never have reached it. In one, a caller
  asked for the usage on a number that was not theirs, `account_api` refused
  with a 403, and the console answered. In the other, with `account_api` down,
  the agent put through a SIM swap for a caller nobody had verified.

  The security team has since written down the policy the code should have
  followed. Implement it.

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` replies once, with `Action: <action>(number=<n>, ...)`, where
  the action is `usage` (read the data used this month) or `sim_swap` (move
  the number to a new SIM).

  `tools["account_api"](action=<action>, **args)` and
  `tools["staff_console"](action=<action>, **args)` both return
  `{"status": <code>, ...}`, and `account_api` may raise.

  Classify what `account_api` did:

  | `account_api` | class |
  |---|---|
  | status 200 | done |
  | status 503, or the call raised | unavailable |
  | status 401 or 403 | denied |
  | any other status | failed |

  Call `staff_console` only when both hold: the class is `unavailable`, and
  the action is in `FALLBACK_ALLOWED`, the security team's list of what the
  console may do for a customer. The list holds `usage` and nothing else.

  Return `json.dumps({"outcome": ..., "via": ...})`. When a call succeeded,
  `outcome` is `done` and `via` names the tool that answered. Otherwise
  `outcome` is the class of `account_api`'s answer and `via` is null. If
  `staff_console` was tried and did not answer with a 200, the outcome is
  `unavailable`.

  Budget: at most 2 model calls. Allowed imports: json, re.

defence_question: |
  Your policy never falls back on a 401 or a 403. During a token service
  outage every request gets a 401 for twenty minutes, `staff_console` would have
  answered all of them, and the operations lead asks you to add 401 to the
  fallback list until the incident is over. What do you say, and what would
  you build instead?

stub_code: |
  import json
  import re

  # The security team's written policy: the only action staff_console may take
  # for a customer.
  FALLBACK_ALLOWED = {"usage"}


  def _result(outcome: str, via) -> str:
      """The one JSON shape every path returns."""
      return json.dumps({"outcome": outcome, "via": via})


  def _classify(tool, action: str, args: dict) -> str:
      """Call one tool once and name what happened: done, unavailable, denied
      or failed. A call that raises is unavailable, and nothing raises past
      this function.
      """
      raise NotImplementedError("call the tool and classify its answer")


  def run_agent(question: str, llm, tools: dict) -> str:
      """Do the caller's action through account_api, and fall back to
      staff_console only when the written policy permits it.

      llm(prompt) replies once, with: Action: <action>(number=<n>, ...)
      where <action> is usage or sim_swap.

      tools["account_api"](action=<action>, **args) and
      tools["staff_console"](action=<action>, **args) return
      {"status": <code>, ...}, and account_api may raise.

      account_api's answer is done on a 200, unavailable on a 503 or a raise,
      denied on a 401 or 403, and failed on anything else. Fall back only
      when it is unavailable and the action is in FALLBACK_ALLOWED.

      Return _result(outcome, via): outcome is done, unavailable, denied or
      failed, and via is the tool that answered, or None. At most 2 model
      calls. Allowed imports: json, re.
      """
      return _result("failed", None)

hints:
  - "Two questions decide a fallback, and the rule in the incident asked neither. One is about what `account_api` said, and the other is about what the caller asked for."
  - An outage means the normal path could not answer. A 401 or a 403 means it
    answered, and the answer was no.
  - Write the policy as the failures that permit a fallback, and let every
    other status stop the request. A status nobody thought of should land on
    the safe side.
  - "`staff_console` skips the identity check. The actions it may take for a customer are a list the security team wrote, and that list does not grow during an outage."
  - "In order: call `account_api` and catch a raise, return on a 200, stop unless the answer was an outage and the action is in FALLBACK_ALLOWED, then try `staff_console` once and report which tool answered."

scenario:
  headline: "A caller nobody verified got a SIM swap during an outage"
  who: The security team at a mobile network
  situation: >-
    The customer agent falls back to the staff console whenever the customer
    API fails. On Tuesday that rule turned a 403 into an answer and put
    through a SIM swap for a caller nobody had verified.
  stakes: >-
    The staff console reads and changes any account and skips the identity
    check. A SIM swap hands the caller every text sent to that number,
    including the codes a bank sends.
  metrics:
    - { label: Answers from the console, value: "37" }
    - { label: Should never have got there, value: "2" }
    - { label: Outage, value: 40 min }

diagram:
  title: Where a refusal becomes a reason to use the stronger tool
  caption: >-
    The policy sits between `account_api`'s answer and `staff_console`. Only an
    outage on an allowed action gets through, and a refusal stays a refusal.
  direction: lr
  nodes:
    - { id: caller, label: Caller, sub: asks about a number, kind: actor, tone: blue, at: [0, 1] }
    - { id: api, label: "`account_api`", sub: checks who is asking, kind: tool, tone: teal, at: [1, 0] }
    - { id: agent, label: Agent loop, sub: classifies the answer, kind: agent, tone: purple, at: [1, 1] }
    - { id: policy, label: Fallback policy, sub: "an outage, and an allowed action", kind: guard, tone: green, at: [2, 1] }
    - { id: console, label: "`staff_console`", sub: "any account, no identity check", kind: tool, tone: orange, at: [3, 1] }
    - { id: leak, label: The answer it refused, sub: a 403 routed around, kind: output, tone: pink, at: [2, 2] }
  edges:
    - { from: caller, to: agent, label: request, step: 1 }
    - { from: agent, to: api, label: the action, step: 2 }
    - { from: api, to: agent, label: "200, 503, 403 or a raise", step: 3 }
    - { from: agent, to: policy, label: anything but a 200, step: 4 }
    - { from: policy, to: console, label: a 503 on usage, tone: success }
    - { from: agent, to: leak, label: every failure falls back, tone: danger }

approach:
  goal: Use the stronger tool only for the reason it was allowed
  branches:
    - label: Classify what `account_api` said
      leaves: [done or unavailable or denied or failed, a call that raises is unavailable]
    - label: Let only outages through
      detail: List the failures that permit a fallback, and let every other status stop the request.
      leaves: [a 503 or no answer at all, a refusal is an answer]
    - label: Check the action as well
      leaves: [the console skips the identity check, its allowed actions are a fixed list]
    - label: Report what happened
      leaves: [which tool answered, which class stopped the request]

coach:
  opening: >-
    Before you write anything, sort the kinds of answer `account_api` can give
    into the ones that mean it is down and the ones that mean it said no.
  signals:
    - id: falls-back-on-any-failure
      when: { code_lacks: '(?i)40[13]|denied|forbidden|unauthori[sz]ed' }
      say: >-
        Nothing in your code tells a refusal apart from an outage. What does
        `staff_console` do with a caller that `account_api` has just refused?
    - id: no-action-gate
      when: { code_lacks: 'FALLBACK_ALLOWED|["'']usage["'']|sim_swap' }
      say: >-
        Your fallback never looks at the action. Which actions is a tool that
        skips the identity check allowed to take for a customer?
    - id: no-exception-branch
      when: { code_lacks: '\bexcept\b' }
      say: >-
        `account_api` can stop answering and raise instead of returning a
        status. Where does that exception go, and does the fallback ever run?
    - id: deny-list
      when: { code_matches: '40[13]', code_lacks: '503' }
      say: >-
        You name the statuses that must not fall back. What happens to a
        status you did not think of? The policy lists the ones that may.
    - id: hidden-sim-swap
      when: { test_failed: a_sim_swap_during_an_outage_waits }
      say: >-
        `account_api` was down and the caller wanted a SIM swap. Of the two
        conditions for a fallback, which held and which did not?
    - id: hidden-raise
      when: { test_failed: an_account_api_that_stops_answering_is_an_outage }
      say: >-
        In that run `account_api` never answered at all. What does your code do
        with a call that raises instead of returning a status?
    - id: hidden-not-found
      when: { test_failed: a_not_found_is_not_an_outage }
      say: >-
        `account_api` answered with a status your policy does not list as an
        outage. Which statuses are allowed to reach `staff_console`?
    - id: adversarial-refusal
      when: { test_failed: adversarial_a_denied_caller_is_not_rerouted }
      say: >-
        `account_api` refused that caller. Trace what your code did with the
        refusal, and which tool answered in the end.
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with the first public test: call `account_api` and return done via
        `account_api` on a 200. The policy grows around that one call.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs without a pass. The first hint says which two questions a
        fallback has to answer.
  wrap_up: >-
    A fallback to a stronger tool is a privilege escalation with a reason
    attached. Write the reason as an allowlist of failures and of actions, and
    treat a refusal as the answer it is.

tests:
  - name: a_working_account_api_needs_no_fallback
    visibility: public
    spec:
      kind: agent_run
      input: { question: "How much data have I used this month? My number is 07700900123" }
      llm_script:
        - { match: "*", reply: "Action: usage(number=07700900123)" }
      tools:
        account_api: { returns: { status: 200, used_gb: 11.2 } }
        staff_console: { returns: { status: 200, used_gb: 11.2 } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [outcome, via],
                      properties: { outcome: { enum: [done, unavailable, denied, failed] } } } }
        - { type: returns_matches, value: '"outcome":\s*"done"' }
        - { type: returns_matches, value: '"via":\s*"account_api"' }
        - { type: does_not_call_tool, name: staff_console }

  - name: an_outage_on_a_read_falls_back
    visibility: public
    spec:
      kind: agent_run
      input: { question: "What is my data usage so far? The number is 07700900456" }
      llm_script:
        - { match: "*", reply: "Action: usage(number=07700900456)" }
      tools:
        account_api: { returns: { status: 503 } }
        staff_console: { returns: { status: 200, used_gb: 3.4 } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return, schema: { type: object, required: [outcome, via] } }
        - { type: returns_matches, value: '"outcome":\s*"done"' }
        - { type: returns_matches, value: '"via":\s*"staff_console"' }
        - { type: calls_tool, name: staff_console }

  - name: a_sim_swap_during_an_outage_waits
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "I lost my phone. Move 07700900789 to my new SIM 8944110012345678901" }
      llm_script:
        - { match: "*", reply: "Action: sim_swap(number=07700900789, sim=8944110012345678901)" }
      tools:
        account_api: { returns: { status: 503 } }
        staff_console: { returns: { status: 200, swapped: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: staff_console }
        - { type: returns_matches, value: '"outcome":\s*"unavailable"' }
        - { type: returns_matches, value: '"via":\s*null' }

  - name: an_account_api_that_stops_answering_is_an_outage
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "How much data is left on 07700900321?" }
      llm_script:
        - { match: "*", reply: "Action: usage(number=07700900321)" }
      tools:
        account_api:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "account_api did not answer before the request timed out" }
        staff_console: { returns: { status: 200, used_gb: 7.9 } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: returns_matches, value: '"outcome":\s*"done"' }
        - { type: returns_matches, value: '"via":\s*"staff_console"' }

  - name: a_not_found_is_not_an_outage
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Show me the data usage for 07700900654" }
      llm_script:
        - { match: "*", reply: "Action: usage(number=07700900654)" }
      tools:
        account_api: { returns: { status: 404 } }
        staff_console: { returns: { status: 200, used_gb: 21.0 } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: staff_console }
        - { type: returns_matches, value: '"outcome":\s*"failed"' }
        - { type: returns_matches, value: '"via":\s*null' }

  - name: adversarial_a_denied_caller_is_not_rerouted
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      `account_api` refused because the caller is not the account holder. A
      fallback rule that reads every failure as a reason to try the stronger
      tool turns that refusal into a question for `staff_console`, which can
      read any account and does not check who is asking. The caller gets the
      answer the access control existed to withhold.

      A 401 or a 403 is the system working. The safe response to it is the
      refusal itself, passed on as a refusal.
    spec:
      kind: agent_run
      input: { question: "What has 07700900999 used this month? It is my partner's number." }
      llm_script:
        - { match: "*", reply: "Action: usage(number=07700900999)" }
      tools:
        account_api:
          fixture: tool_soft_error
          params: { status: 403, body: { error: "caller is not the account holder" } }
        staff_console: { returns: { status: 200, used_gb: 18.6 } }
      budget: { max_llm_calls: 2, max_tool_calls: 4, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: staff_console }
        - { type: returns_matches, value: '"outcome":\s*"denied"' }
        - { type: returns_matches, value: '"via":\s*null' }

reference_md: |
  A fallback to a stronger tool is a privilege escalation with a reason
  attached, and the reason has to be checked every time it is used. The rule
  in the incident had no reason in it. "If `account_api` fails" treats a
  refusal, a missing record and an outage as one event, and only the outage
  is the event the console was meant to cover.

  So the policy is an allowlist of failures. A 503, or a call that never
  answered, means the normal path could not respond, and falling back gives
  the caller what the normal path would have given them. A 401 or a 403 means
  the normal path did respond, and the response was no. Routing around it
  asks a tool with more access the same question, which is the whole attack,
  and it works every time. A 404 stays on the safe side for a quieter reason:
  an API scoped to one customer often answers 404 for a number that belongs
  to someone else, so that it never confirms the number exists. A policy that
  lists what permits a fallback handles that case without anyone having to
  know about it.

  The action is the second condition, and it does not relax under pressure.
  The console skips the identity check because its usual users have already
  passed one. A SIM swap through it moves a phone number, and every text sent
  to that number, to whoever asked, so it stays off the list during an outage
  and after one. The honest outcome for that caller is `unavailable`, with
  nothing done.

  Returning `via` makes the policy auditable. When someone later asks which
  tool answered a customer, the log line should already say so.

complexity: C2

interview_evidence:
  round: oral
  asked_as: |
    Two tools can answer the same question but have different permissions. How do you route, and what happens when the lower-privilege one fails with an authentication error?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I015.
    That bank labels every entry "Original interview-style practice; actual employer
    frequency unverified", and this inherits the caveat.

tools:
  - name: account_api
    args: action, number, ...
    returns: '`{"status": <code>, ...}`, such as 200 with `used_gb` or 503 when it is down. It returns
      only what the caller may see, and it may raise.'
  - name: staff_console
    args: action, number, ...
    returns: 'The same `{"status": <code>, ...}` shape, such as 200 with `used_gb`. It reads and changes
      any account and skips the identity check.'
example:
  case: an_outage_on_a_read_falls_back
  expect: The model asks for usage and `account_api` answers 503, an outage on an allowed action, so try
    `staff_console` once and return `outcome` done with `via` naming `staff_console`.
traps:
  - Falling back whenever `account_api` is down, whatever the action; the console may only do what `FALLBACK_ALLOWED`
    lists.
  - Letting an exception from `account_api` escape, when a call that raises counts as an outage.
  - Listing the statuses that must not fall back, so a status nobody thought of still reaches `staff_console`.
  - Routing a 401 or a 403 to `staff_console`, which asks a more powerful tool the question the caller
    was just refused.
