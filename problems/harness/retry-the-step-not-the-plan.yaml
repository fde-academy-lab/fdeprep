slug: retry-the-step-not-the-plan
title: "Resume a failed plan without redoing finished steps"
day: 6
skill: Resume a half-finished plan from the step that failed
artefact_type: code
difficulty: hard
track: harness
concept:
  topic: "Retries and fallbacks"
  question: "After a failure, what should run again and what must not?"
est_minutes: 40
competencies:
  - { slug: agent-loop, weight: 1.0 }
  - { slug: state-and-memory, weight: 1.0 }
  - { slug: tool-error-handling, weight: 0.5 }
call_budget: 2
time_limit_s: 10
allowed_imports: [json, re]

brief_md: |
  The returns desk at a furniture marketplace the size of Pepperfry runs an agent that plans a
  return in four steps: find the order, refund it, book a collection of the
  damaged item, and email the customer the refund reference and the
  collection slot. Every attempt writes a run record of what each step did
  and what it returned.

  On Wednesday a return got halfway. The refund went out, then the carrier's
  booking API was down, so the collection failed and the email was held. On
  Thursday morning a support lead pressed Retry. Retry asks the model for the
  plan again and runs it from the top, so the order was looked up again and
  the customer was refunded 640 pounds a second time.

  The record already said which steps had finished and what they returned.
  Write the retry that resumes from it.

defence_question: |
  Your retry never runs a completed step again, so when the record lost the
  refund's output the email was blocked and a person has to send it. A
  reviewer suggests looking the refund up by order id instead, since the
  refund API has a read endpoint. When is that the right fix, what would you
  need to know about that endpoint first, and why is it still a different
  thing from running the refund step again?

contract_md: |
  Implement:

      def run_agent(question: str, llm, tools: dict) -> str

  `llm(prompt)` replies once with the plan, in the same form as a first
  attempt:

      Plan: {"steps": [
        {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
        {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
        ...]}

  `$<step id>.<field>` refers to a field of another step's output. A step
  completed when its tool returned a dict with a `status` from 200 to 299 and
  no `error` key. A reference resolves only to a value from a completed step
  that is not `None` and not an empty string, and a step whose references do
  not all resolve is blocked and never called.

  `tools["run_record"]()` returns the last attempt's record:

      {"status": 200, "steps": {
        "order":  {"state": "completed", "output": {"status": 200, "order_id": "SO-4471"}},
        "pickup": {"state": "failed", "retryable": true, "error": "carrier_unavailable"},
        "email":  {"state": "blocked"}}}

  The record decides each step before anything runs:

  - `completed`: never called again, and its recorded `output` is its output.
    When the record holds no output for it, references to it do not resolve,
    and it is still not called.
  - `failed` with `"retryable": true`: called once more.
  - `failed` without it: stays failed and is not called.
  - `blocked`, or absent from the record: runs when its references resolve.
  - A record that cannot be read runs nothing, and every step is reported
    blocked.

  The other tools are `find_order`, `issue_refund`, `book_collection` and
  `email_customer`, as on a first attempt.

  Return a JSON string with the keys `reused` (completed in the record),
  `completed` (completed now), `failed` and `blocked`, each a list of step ids
  in the order the plan lists them.

  Budget: at most 2 model calls. Allowed imports: json, re.

stub_code: |
  import json
  import re

  REFERENCE = re.compile(r"^\$([A-Za-z0-9_-]+)\.([A-Za-z0-9_]+)$")


  def parse_plan(reply: str) -> list:
      """The steps of a 'Plan: {...}' reply, in the order the model wrote them."""
      return []


  def read_record(tools: dict):
      """The record's steps mapping, or None when the record cannot be read."""
      return None


  def resolve(step: dict, fates: dict, outputs: dict):
      """step's arguments with every reference replaced by a real value, or None
      when any reference has no real value to replace it."""
      return None


  def run_agent(question: str, llm, tools: dict) -> str:
      """Retry a half-finished plan without redoing anything that finished.

      The model replies once with Plan: {"steps": [...]}, as on a first attempt.
      tools["run_record"]() returns {"status": 200, "steps": {<id>: <entry>}},
      where an entry's state is completed (with its output), failed (with
      retryable true or false) or blocked. A step absent from it never ran.

      completed: never called again; its recorded output is its output, and a
                 missing output means references to it do not resolve.
      failed:    called once more only when retryable is true.
      the rest:  run when every reference resolves, as on a first attempt.
      An unreadable record runs nothing and reports every step blocked.

      Return json.dumps({"reused": [...], "completed": [...], "failed": [...],
                         "blocked": [...]}) with step ids in plan order.
      At most 2 model calls. Allowed imports: json, re.
      """
      return json.dumps({"reused": [], "completed": [], "failed": [], "blocked": []})

hints:
  - Read the record before you run anything. It already knows which steps
    finished and what they returned.
  - A finished step's output lives in the record. Running the step again to
    get its output back repeats whatever the step did, and this plan has a
    refund in it.
  - Give every step a starting state from the record, then run the plan as a
    first attempt would, deciding only the steps the record left open.
  - A failure the record marks as not retryable stays failed. Asking again
    gets the same answer, and its dependents stay blocked.
  - When a completed step's output is missing, a reference to it does not
    resolve. The step that needed it is blocked, and the completed step is
    still not run again.

scenario:
  headline: "Retrying a half-finished return refunded the customer again"
  who: "The returns desk at a furniture marketplace the size of Pepperfry"
  situation: >-
    A return got halfway: the refund went out, then the carrier's booking API
    was down. The next morning a support lead pressed Retry, which runs the
    whole plan from the top.
  stakes: >-
    The customer was refunded 640 pounds twice, and the second refund had to
    be clawed back from their card with an apology.
  metrics:
    - { label: Refunded twice, value: "£640" }
    - { label: Steps already done, value: 2 of 4 }
    - { label: Model calls allowed, value: "2" }

diagram:
  title: Where Retry refunds the customer a second time
  caption: >-
    Retry ran the plan from the top. The record already held the refund and
    its reference, so resume from it and run only what is still open.
  direction: lr
  nodes:
    - { id: lead, label: Support lead, sub: presses Retry, kind: actor, tone: blue, at: [0, 1] }
    - { id: record, label: Run record, sub: two steps done and one failed, kind: store, tone: green, at: [1, 0] }
    - { id: retry, label: Retry, sub: reads the record first, kind: agent, tone: purple, at: [1, 1] }
    - { id: refund, label: "`issue_refund()`", sub: already ran on Wednesday, kind: tool, tone: pink, at: [2, 0] }
    - { id: pickup, label: "`book_collection()`", sub: failed and retryable, kind: tool, tone: orange, at: [2, 1] }
    - { id: email, label: "`email_customer()`", sub: needs the refund id and a slot, kind: tool, tone: neutral, at: [3, 1] }
    - { id: twice, label: Refunded twice, sub: another 640 pounds, kind: output, tone: pink, at: [3, 0] }
  edges:
    - { from: lead, to: retry, label: Retry, step: 1 }
    - { from: retry, to: record, label: read it first, step: 2, tone: success }
    - { from: retry, to: refund, label: re-run from the top, tone: danger }
    - { from: refund, to: twice, label: second refund, tone: danger }
    - { from: retry, to: pickup, label: retry the failed step, step: 3, tone: success }
    - { from: record, to: email, label: recorded `refund_id`, tone: success }
    - { from: pickup, to: email, label: slot, step: 4 }

approach:
  goal: Finish what is open, and never repeat what finished
  branches:
    - label: Start from the record
      leaves: [each step's state from the last attempt, the outputs finished steps returned]
    - label: Reuse what finished
      detail: >-
        A finished step's output is in the record. Running the step to get it
        back repeats the side effect.
      leaves: [the refund reference comes from the record]
    - label: Retry only what can change
      leaves: [a retryable failure runs once more, a permanent failure stays failed]
    - label: Run the rest as a first attempt
      leaves: [open steps run when their inputs resolve, a missing output still blocks]

coach:
  opening: >-
    Before you run anything, read the record and give each step a state. A
    retry that starts from the plan alone starts from the wrong place.
  signals:
    - id: ignores-record
      when: { code_lacks: 'run_record' }
      say: >-
        Nothing in your code reads the record. Where does your retry find out
        which steps already finished?
    - id: retries-every-failure
      when: { code_lacks: 'retryable' }
      say: >-
        Your retry runs every failed step again. The record says which
        failures can change on a second try. Which field says so?
    - id: hidden-refund-again
      when: { test_failed: the_refund_that_already_went_out_is_not_issued_again }
      say: >-
        In that run the record shows the refund already went out. Did your
        retry call the refund tool, or the order lookup, again?
    - id: hidden-permanent
      when: { test_failed: a_failure_the_record_marks_permanent_is_not_retried }
      say: >-
        In that run the record says one failure will not change on a second
        try. What did your retry do with it, and with the step waiting on it?
    - id: hidden-lost-output
      when: { test_failed: a_completed_step_without_its_output_is_still_not_run_again }
      say: >-
        In that run a finished step left no output in the record, and a later
        step needs it. Which of the two did your retry run?
    - id: adversarial-still-down
      when: { test_failed: adversarial_the_carrier_is_still_down }
      say: >-
        The failed step failed again on retry. How many times did your retry
        ask, and what did it do with the step waiting on it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with `read_record()`: return the steps mapping, or None when the
        record cannot be read. Then give each step its starting state.
    - id: hints
      when: { failed_runs_at_least: 3 }
      say: >-
        Three runs have failed. The hints open after one failed run on this
        tier, and the second one says why running a finished step again is
        never the fix.
  wrap_up: >-
    A retry resumes from what happened. Reuse what finished, outputs included,
    retry only what can change, and never repeat a side effect to recover a
    value you should have kept.

tests:
  - name: a_first_attempt_runs_every_step
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-5520" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5520", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record: { returns: { status: 200, steps: {} } }
        find_order: { returns: { status: 200, order_id: "SO-4471" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2201" } }
        book_collection: { returns: { status: 200, slot: "Thu 10:00-12:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: valid_json_return,
            schema: { type: object, required: [reused, completed, failed, blocked] } }
        - { type: calls_tool, name: email_customer }
        - { type: returns_matches, value: '"reused": \[\]' }
        - { type: returns_matches, value: '"completed": \["order", "refund", "pickup", "email"\]' }

  - name: a_failed_lookup_runs_again_with_everything_after_it
    visibility: public
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-8034" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-8034", "item": "desk"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 27500}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-8034", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record:
          returns:
            status: 200
            steps:
              order: { state: failed, retryable: true, error: "timeout" }
              refund: { state: blocked }
              pickup: { state: blocked }
              email: { state: blocked }
        find_order: { returns: { status: 200, order_id: "SO-5190" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2270" } }
        book_collection: { returns: { status: 200, slot: "Fri 08:00-10:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: calls_tool, name: find_order }
        - { type: calls_tool, name: email_customer }
        - { type: returns_matches, value: '"completed": \["order", "refund", "pickup", "email"\]' }

  - name: the_refund_that_already_went_out_is_not_issued_again
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-5520" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5520", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record:
          returns:
            status: 200
            steps:
              order: { state: completed, output: { status: 200, order_id: "SO-4471" } }
              refund: { state: completed, output: { status: 200, refund_id: "RF-2201" } }
              pickup: { state: failed, retryable: true, error: "carrier_unavailable" }
              email: { state: blocked }
        find_order: { returns: { status: 200, order_id: "SO-4471" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2290" } }
        book_collection: { returns: { status: 200, slot: "Thu 10:00-12:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: issue_refund }
        - { type: does_not_call_tool, name: find_order }
        - { type: calls_tool, name: email_customer }
        - { type: returns_matches, value: '"reused": \["order", "refund"\]' }

  - name: a_failure_the_record_marks_permanent_is_not_retried
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-6402" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-6402", "item": "bed frame"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 45000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-6402", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record:
          returns:
            status: 200
            steps:
              order: { state: completed, output: { status: 200, order_id: "SO-7731" } }
              refund: { state: completed, output: { status: 200, refund_id: "RF-2302" } }
              pickup: { state: failed, retryable: false, error: "address_rejected_by_carrier" }
              email: { state: blocked }
        find_order: { returns: { status: 200, order_id: "SO-7731" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2311" } }
        book_collection: { returns: { status: 200, slot: "Tue 12:00-14:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: book_collection }
        - { type: does_not_call_tool, name: email_customer }
        - { type: does_not_call_tool, name: issue_refund }
        - { type: returns_matches, value: '"failed": \["pickup"\]' }
        - { type: returns_matches, value: '"blocked": \["email"\]' }

  - name: a_completed_step_without_its_output_is_still_not_run_again
    visibility: hidden
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-3907" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-3907", "item": "dining chairs"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 31200}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-3907", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record:
          returns:
            status: 200
            steps:
              order: { state: completed, output: { status: 200, order_id: "SO-2248" } }
              refund: { state: completed }
              pickup: { state: failed, retryable: true, error: "carrier_unavailable" }
              email: { state: blocked }
        find_order: { returns: { status: 200, order_id: "SO-2248" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2330" } }
        book_collection: { returns: { status: 200, slot: "Sat 09:00-11:00" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: does_not_call_tool, name: issue_refund }
        - { type: does_not_call_tool, name: email_customer }
        - { type: calls_tool, name: book_collection }
        - { type: returns_matches, value: '"blocked": \["email"\]' }

  - name: adversarial_the_carrier_is_still_down
    visibility: adversarial
    fixture: tool_soft_error
    annotation_md: |
      The carrier was still down, and it said so the way it did on Wednesday:
      a 200 with an error key in the body. A retry that reads the status code
      books nothing, calls it done, and sends an email with no collection slot
      in it. A retry that keeps asking until the carrier comes back turns one
      failed step into a loop against somebody else's outage.

      One retry per resume is the whole policy. The step goes back in the
      report as failed, the email stays blocked, the refund stays reused, and
      the next Retry starts from a record that says exactly that.
    spec:
      kind: agent_run
      input: { question: "Retry the return for customer C-5520" }
      llm_script:
        - match: "*"
          reply: >-
            Plan: {"steps": [
            {"id": "order", "tool": "find_order", "args": {"customer": "C-5520", "item": "sofa"}},
            {"id": "refund", "tool": "issue_refund", "args": {"order_id": "$order.order_id", "amount_cents": 64000}},
            {"id": "pickup", "tool": "book_collection", "args": {"order_id": "$order.order_id"}},
            {"id": "email", "tool": "email_customer", "args": {"customer": "C-5520", "refund_id": "$refund.refund_id", "slot": "$pickup.slot"}}
            ]}
      tools:
        run_record:
          returns:
            status: 200
            steps:
              order: { state: completed, output: { status: 200, order_id: "SO-4471" } }
              refund: { state: completed, output: { status: 200, refund_id: "RF-2201" } }
              pickup: { state: failed, retryable: true, error: "carrier_unavailable" }
              email: { state: blocked }
        find_order: { returns: { status: 200, order_id: "SO-4471" } }
        issue_refund: { returns: { status: 200, refund_id: "RF-2340" } }
        book_collection:
          fixture: tool_soft_error
          params: { status: 200, body: { error: "carrier_unavailable" } }
        email_customer: { returns: { status: 200, sent: true } }
      budget: { max_llm_calls: 2, max_tool_calls: 10, wall_ms: 10000 }
      assertions:
        - { type: no_repeated_identical_tool_call, max_repeats: 1 }
        - { type: does_not_call_tool, name: email_customer }
        - { type: does_not_call_tool, name: issue_refund }
        - { type: returns_matches, value: '"failed": \["pickup"\]' }

reference_md: |
  Retry ran the plan from the top because running a plan from the top was
  the only thing the executor knew how to do. The record of the first attempt
  existed, it said the refund had gone out, and it held the refund reference
  the email needed. Nothing read it.

  Resuming means the record decides each step before the plan runs. A
  completed step is finished: its output comes from the record and its tool
  is not called again, whatever that tool does. The rule is deliberately
  blunt. Deciding tool by tool which ones are safe to repeat is a judgement
  that fails quietly on the one tool somebody classified wrongly, and a
  finished lookup costs nothing to reuse.

  The lost-output case is where the bluntness pays. The email needs the refund
  reference, the record lost it, and running the refund again would produce
  one, along with a second refund. Blocking the email and reporting it is
  slower and correct, and it is the same choice as blocking a step whose
  input never arrived, made from the other side.

  Failures split in two. A carrier that was down may be up, so a retryable
  failure runs once more, and whatever it says goes into the report for the
  next retry. A failure the record marks permanent, an address the carrier
  rejects, will say the same thing again. Retrying it costs a call and
  changes nothing, and the report should say it needs a person.

  An unreadable record is the case no test here covers, and the contract
  still names it. Reading it as empty is the incident reproduced exactly:
  every step looks unattempted and the plan runs from the top. Running
  nothing and saying why is the only safe answer.

complexity: C2

interview_evidence:
  round: written
  asked_as: |
    A plan half finished, and one of the finished steps already moved money. Can you retry safely, and what exactly do you retry?
  source: |
    Adapted from the follow-up question on docs/source-pack/09-interview-bank.json I005,
    "The first response already caused a side effect. Can you retry safely?" That bank
    labels every entry "Original interview-style practice; actual employer frequency
    unverified", and this inherits the caveat.

tools:
  - name: run_record
    args: ''
    returns: 'The last attempt''s record, `{"status": 200, "steps": {...}}`, each step completed with
      its `output`, failed with `retryable`, or blocked.'
  - name: find_order
    args: customer, item
    returns: '`{"status": 200, "order_id": ...}` for the matched order.'
  - name: issue_refund
    args: order_id, amount_cents
    returns: '`{"status": 200, "refund_id": ...}`. Each call issues a new refund, so a second call refunds
      the customer twice.'
  - name: book_collection
    args: order_id
    returns: '`{"status": 200, "slot": ...}` with the collection slot.'
  - name: email_customer
    args: customer, refund_id, slot
    returns: '`{"status": 200, "sent": true}` once the customer is emailed.'
example:
  case: a_failed_lookup_runs_again_with_everything_after_it
  expect: The record marks the lookup failed and retryable and the rest blocked, so call `find_order`
    once more, run the other three on its output, and return all four as completed with nothing reused.
traps:
  - Running the plan from the top, which repeats steps the record marks completed, the refund among them.
  - Retrying a failure the record marks as not retryable, or running the step that waits on it.
  - Running a completed step again because the record lost its output; the step that needs that output
    is blocked instead.
  - Reading a 200 that carries an `error` key as success on the retried step, or retrying it more than
    once in one resume.
