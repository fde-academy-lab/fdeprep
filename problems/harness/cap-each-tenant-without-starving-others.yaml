  - name: adversarial_the_plans_never_arrived
    visibility: adversarial
    fixture: empty_tool_result
    annotation_md: |
      The plans service answered with nothing at all. A gateway that indexes
      into the missing table raises, and the whole batch ends with a stack
      trace instead of an answer for each run. One that falls back to "no
      limits" sends every run, which is the incident with the limiter switched
      off.

      With no plans, nothing is known to be allowed. Every run is refused with
      `no_plan`, nothing reaches the provider, and the tenant sees a reason it
      can act on.
    spec:
      kind: agent_run
      input: { question: "batch-0928-1130" }
      llm_script:
        - { match: "*", reply: "I can help with that." }
      tools:
        batch:
          returns:
            status: 200
            runs:
              - { id: e1, tenant: harbour-bank, at_s: 3, max_tokens: 600, prompt: "Summarise card dispute 4700 for the agent" }
              - { id: e2, tenant: oak-and-ash, at_s: 6, max_tokens: 500, prompt: "Tag ticket 88501 with a product category" }
              - { id: e3, tenant: harbour-bank, at_s: 9, max_tokens: 600, prompt: "Summarise card dispute 4701 for the agent" }
        plans: { fixture: empty_tool_result }
        complete: { returns: { status: 200, text: "Done.", tokens: 400 } }
      budget: { max_llm_calls: 1, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: does_not_call_tool, name: complete }
        - { type: returns_matches, value: '"e1":\s*\{[^{}]*"reason":\s*"no_plan"' }
        - { type: returns_matches, value: '"e2":\s*\{[^{}]*"reason":\s*"no_plan"' }
        - { type: returns_matches, value: '"e3":\s*\{[^{}]*"reason":\s*"no_plan"' }

  - name: adversarial_the_provider_stops_answering
    visibility: adversarial
    fixture: slow_then_timeout
    annotation_md: |
      Every call to `complete` timed out. A timeout leaves the outcome
      unknown: the provider may have run the request to the end and billed it
      before the connection dropped, so nobody knows what it used. A gateway that charges
      nothing for it lets a tenant keep sending runs whose cost is unknown,
      and the cap only holds while the provider is healthy. One that lets the
      exception escape ends the batch for every tenant behind the first
      failure.

      The reservation stands until a usage report says otherwise. The third
      run for this tenant is refused for its budget, and the other tenant's
      run is still tried.
    spec:
      kind: agent_run
      input: { question: "batch-0928-1200" }
      llm_script:
        - { match: "*", reply: "I can help with that." }
      tools:
        batch:
          returns:
            status: 200
            runs:
              - { id: t1, tenant: oak-and-ash, at_s: 3, max_tokens: 1000, prompt: "Write a reply about a late sofa delivery" }
              - { id: t2, tenant: oak-and-ash, at_s: 7, max_tokens: 1000, prompt: "Write a reply about a damaged table leg" }
              - { id: t3, tenant: oak-and-ash, at_s: 12, max_tokens: 1000, prompt: "Write a reply about a missing fitting kit" }
              - { id: p1, tenant: pine-travel, at_s: 15, max_tokens: 800, prompt: "Draft a reply about a cancelled ferry crossing" }
        plans:
          returns:
            status: 200
            account_rpm: 8
            tenants:
              oak-and-ash: { rpm: 5, tokens: 2500 }
              pine-travel: { rpm: 5, tokens: 9000 }
        complete:
          fixture: slow_then_timeout
          params: { succeeds: 0, message: "the model provider did not answer within 30 seconds" }
      budget: { max_llm_calls: 1, max_tool_calls: 24, wall_ms: 10000 }
      assertions:
        - { type: no_exception }
        - { type: terminates }
        - { type: returns_matches, value: '"t2":\s*\{[^{}]*"status":\s*"failed"' }
        - { type: returns_matches, value: '"t3":\s*\{[^{}]*"reason":\s*"token_budget"' }
        - { type: returns_matches, value: '"p1":\s*\{[^{}]*"status":\s*"failed"' }

reference_md: |
  The limiter in the incident was right about the account and wrong about
  everyone in it. One counter for the whole provider account protects the
  provider from you. It does nothing to protect your tenants from each other,
  and arrival order hands the shared minute to whoever arrives first in the
  largest numbers.

  Per-tenant limits are the first fix, and on their own they are not enough.
  The incident limiter also counted a run as it arrived, before deciding it.
  Under a flood that is the bug that hurts: the retailer's refused runs went
  on filling the account's window, so other tenants were refused behind runs
  that never reached the provider. A refusal has to cost nothing, which means
  deciding first and counting only what is sent. The order of the checks
  matters for the same reason. AWS API Gateway documents the same order for
  its own throttles, a usage plan's per-tenant limit before the account's
  (Amazon API Gateway Developer Guide, request throttling, read 1 October
  2026), and that order is what keeps one tenant's excess from spending the
  account's capacity.

  The budget needs the same care for a different reason. Before a call, the
  only number you know about its cost is its ceiling, `max_tokens`. Checking
  what is already spent lets the call that crosses the line run with its
  whole ceiling, which is how the retailer ended the month 31 percent over.
  Reserving the ceiling before the call holds the cap exactly, and charging
  what the provider reports afterwards hands the unused part back, so the cap
  does not refuse work the budget could pay for. Amazon Bedrock does this to
  your own account's quota: its user guide says input tokens plus `max_tokens`
  are deducted when a request starts, and that unused tokens are replenished
  when it ends ("How tokens are counted in Amazon Bedrock", read 1 October
  2026).

  A call that raises has an unknown cost, because the provider may have run
  it to the end before the connection dropped. The reservation stands until a
  usage report says otherwise. Charging nothing is the optimistic guess, and
  a cap that guesses optimistically holds only while nothing goes wrong.

  The reasons are part of the product. `tenant_rate` tells a tenant its own
  traffic is the problem, and `account_rate` tells it the platform is full,
  which is your problem rather than theirs. A support conversation that
  starts from the wrong one goes badly, and `retry_at_s` turns either into a
  time to come back.

  Deciding runs one at a time keeps the arithmetic honest here. With
  concurrent workers, the reservation has to be one conditional update in the
  store that holds the counts, or two workers read the same remaining budget
  and both spend it.

complexity: C2

interview_evidence:
  round: both
  asked_as: |
    Several tenants share one model account behind your gateway. How do you stop one tenant's burst from starving the rest, and why is checking the remaining budget before each call not enough to hold a cap?
  source: |
    Adapted from the FDE interview bank, docs/source-pack/09-interview-bank.json I027, and the
    topic catalogue entry A057. That bank labels every entry "Original interview-style practice;
    actual employer frequency unverified", and this inherits the caveat.

tools:
  - name: batch
    args: ''
    returns: A status and the `runs` in arrival order, each with `id`, `tenant`, `at_s`, `max_tokens` and
      `prompt`.
  - name: plans
    args: ''
    returns: A status, the account's `account_rpm`, and `tenants`, giving each tenant's `rpm` and token
      budget.
  - name: complete
    args: run, prompt, max_tokens
    returns: '`{"status": 200, "text": ..., "tokens": <used>}`, or it raises, and then nobody knows what
      the run used.'
example:
  case: refuses_a_tenant_past_its_minute_limit
  expect: "The furniture retailer may send 2 runs a minute, so its third run, at 12 seconds, is refused with
    `tenant_rate` and `retry_at_s` 60, and the bank's run after it is still sent."
traps:
  - Counting a run against a window before deciding it, so refused runs fill the minute for everyone else.
  - Checking the budget against what is already spent, so the run that crosses it goes out with its whole
    ceiling.
  - Charging each run its ceiling and never what it used, which refuses work the budget could pay for.
  - Counting a tenant's runs across the whole batch instead of per minute, so a refusal outlives its window.
