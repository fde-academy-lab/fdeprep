slug: design-a-sandbox-for-code-analysts-write
title: "Design a sandbox for code analysts write"
day: 8
skill: Contain code you did not write, from its network to its credentials and limits
artefact_type: design
difficulty: extreme
track: harness
concept:
  topic: "Sandboxed execution"
  question: "What must code you did not write never be able to reach?"
est_minutes: 45
competencies:
  - { slug: system-design, weight: 1.0 }
  - { slug: failure-mode-analysis, weight: 1.0 }
  - { slug: client-communication, weight: 0.5 }

brief_md: |
  A motor insurer the size of Admiral is piloting an analysis agent for its
  120 pricing and claims analysts. An analyst asks a question in plain
  English, and the agent runs Python to answer it: cells the analyst has
  written, or cells the agent adapts from them. The code reads parquet
  extracts of claims of up to 2 GB, which hold policyholders' names,
  addresses and vehicle registrations, and each analyst may read only their
  own line of business. The pilot runs about 4,000 analyses a day. Most finish
  in under two minutes, and the month-end reserving runs take up to twenty.

  In the pilot, the agent ran analyst code inside its own orchestrator
  container. On Tuesday 22 September an analyst pasted a snippet from a forum
  that printed every environment variable into a chart title. The chart
  showed the data warehouse password, and the same environment held the
  credentials the agent uses to call the model. The head of security stopped
  the pilot the same afternoon.

  The client wants the pilot back. Everything runs in the client's own AWS
  account, nothing may leave it, and the approved libraries are pandas, numpy,
  scikit-learn and matplotlib. Write the sandbox design you would put in front
  of the head of security. Cover the boundary around each run, processes, the
  network, the file system, credentials, time and memory limits, and what is
  never staged inside. Say how you would prove it holds before the pilot
  restarts, and what risk remains when it does.

  Between 400 and 650 words.

word_range: [400, 650]
required_headings: []

rubric:
  - label: Puts a real boundary around each run
    weight: 20
    descriptor_md: |
      Strong answers give each run its own isolation boundary, created for the
      run and destroyed after it, with nothing shared between runs or
      analysts. They choose a boundary stronger than a container sharing the
      host kernel, such as a microVM like Firecracker or a user-space kernel
      like gVisor, and say why: the shared kernel is what hostile code
      attacks. Naming a technology without saying what it separates earns
      little.
  - label: Leaves no credential within reach
    weight: 25
    descriptor_md: |
      Strong answers name the routes to credentials that nobody put there on
      purpose: the environment, the instance metadata endpoint, a container
      credential endpoint, a mounted service account token, files in the
      image. The sandbox holds none of them. Data arrives through a broker
      outside the sandbox that reads with its own scoped credential and
      stages only the rows this analyst may read. Fetching a secret from a
      vault inside the sandbox is a credential within reach.
  - label: Denies the network by default
    weight: 15
    descriptor_md: |
      No route out: no internet, no metadata endpoint, no path into the VPC.
      Approved libraries are built into the image, so nothing is installed at
      run time. Any exception is one named endpoint, and the answer says who
      enforces it.
  - label: Gives every limit a number and a reason
    weight: 15
    descriptor_md: |
      Wall clock, memory, CPU, processes and threads, scratch disk and output
      size, each with a number sized to the workload in the brief: a 2 GB
      extract, a twenty-minute run. Strong answers say what happens at a limit,
      and that a run killed by one is reported to the analyst as such.
      Adjectives such as appropriate or sensible earn nothing here.
  - label: Says what is never staged inside
    weight: 15
    descriptor_md: |
      The model credential, the warehouse credential, the agent's prompt and
      tool definitions, other analysts' data and rows this analyst may not
      read all stay outside. Inputs are read-only, and results leave through
      one size-capped channel that the agent treats as data rather than as
      instructions.
  - label: Proves it, and names what is left
    weight: 10
    descriptor_md: |
      Escape attempts run inside the sandbox before go-live and on every image
      build: reach the metadata endpoint, open a socket, read a token path,
      fork without limit, exhaust memory. Every run is logged. Strong answers
      say plainly what the design does not remove, such as a hypervisor bug,
      or an analyst sharing rows they are allowed to see.

exemplars:
  - band: strong
    score: 92
    body_md: |
      The pilot leaked because analyst code ran inside the orchestrator,
      where everything the orchestrator holds was one print statement
      away. I would design from the opposite assumption: code in the
      sandbox can read everything in the sandbox, so nothing worth taking
      goes in.

      Boundary. Every run gets a fresh Firecracker microVM, the
      virtualisation AWS built for Lambda, created for that run and
      destroyed after it. A container shares the host kernel with every
      other analyst's code, and the kernel is what hostile code attacks
      first. A microVM gives each run a kernel of its own. Lambda itself
      is out, because its 15 minute ceiling is shorter than a month-end
      run. If the platform team would rather stay on Kubernetes, gVisor's
      runsc runtime is the fallback: it answers the code's system calls
      with its own kernel in user space. No warm pool keeps one analyst's
      files for the next.

      Network. There is no route out. The microVM has no network device,
      only a vsock channel to the broker, so the code cannot reach the
      internet, the VPC or the instance metadata endpoint at
      169.254.169.254, where code on an EC2 host collects the role's
      credentials. Running pip install fails by design: pandas, numpy,
      scikit-learn and matplotlib are baked into the image at the versions
      security approved, and a new library is a change request.

      Credentials. The sandbox holds none. The environment is a fixed
      allowlist with no secrets in it, no service account token is
      mounted, and the image carries no credential files. Data comes
      through a broker outside the sandbox, which reads the extract with
      its own scoped role, keeps only the rows for the analyst's line of
      business, and writes them read-only to the run's disk. The model
      credential and the warehouse password stay with the orchestrator.

      Files and output. The input is read-only. The code writes only to an
      8 GB scratch disk that dies with the microVM. Results leave through
      one channel, a single file of at most 50 MB as CSV, PNG or JSON, and
      the agent reads it as data and follows nothing written in it.

      Limits. A wall clock of 25 minutes, five above the longest month-end
      run. 16 GB of memory, sized from the largest extract in the pilot,
      since a compressed parquet file grows several times over in pandas.
      Two vCPUs. At most 64 processes and threads, enough for the
      scikit-learn thread pool and too few for a fork bomb. One megabyte
      of captured output. A run that hits a limit is killed, the analyst
      is told which limit, and it does not count against their daily runs.

      Never inside: the model and warehouse credentials, the agent's
      system prompt and tool definitions, other analysts' data, rows this
      analyst may not read, and the orchestrator's state. If a forum
      snippet prints everything it can find, it prints its own input.

      Proof. Before the pilot restarts, an escape suite runs inside the
      sandbox on every image build: read 169.254.169.254, open a socket,
      read the token path, fork a thousand processes, allocate 40 GB,
      write outside scratch, print the environment. Each attempt must
      fail, and the build fails if one succeeds. Every run is logged with
      the analyst, the code's hash, the inputs, any limit hit and the
      output size.

      What remains. A hypervisor bug is still possible, which is why the
      boundary is a microVM rather than a container. And an analyst can
      still put rows they are allowed to read into a chart and share it.
      The sandbox limits what code can reach. What an authorised person
      chooses to show is a policy question, and I would raise it with you
      rather than claim the design answers it.
  - band: adequate
    score: 64
    body_md: |
      The core problem in the pilot was that analyst code ran in the same
      container as the orchestrator, so it could see the orchestrator's
      environment variables. The fix is to run analyst code somewhere
      else, with tight controls around it.

      I would run each analysis in its own Docker container on a separate
      node group from the orchestrator, started fresh for each run and
      removed when it finishes. The container runs as a non-root user with
      every Linux capability dropped, a read-only root file system and the
      default seccomp profile, which blocks the riskiest system calls.

      For the network, a Kubernetes network policy blocks all egress from
      the sandbox pods, so analyst code cannot reach the internet or send
      data out. Libraries are installed in the image in advance rather
      than with pip at run time, since there is no internet access, and
      new ones go through the security team.

      For credentials, nothing is passed in environment variables. When
      the code needs the claims extract, the sandbox fetches a short-lived
      token from the secrets manager at start-up, scoped to read-only
      access for the analyst's line of business, and uses it to download
      the extract from S3. The token expires after an hour, so a leaked
      token has limited value.

      Each container gets a CPU limit and a memory limit through
      Kubernetes resource limits, and a timeout after which the pod is
      killed. I would start with 2 CPUs, 8 GB of memory and 30 minutes,
      and adjust once we see real usage. A process limit stops fork bombs.
      If a run hits the memory limit, Kubernetes kills the pod and the
      analyst sees an out-of-memory error instead of a hung notebook.
      Output is written to a results folder that the agent reads after the
      run.

      The input files are mounted read-only, and the scratch space is an
      empty directory deleted with the pod, so nothing carries over from
      one analyst to the next.

      The model credentials and the orchestrator's own secrets never enter
      the sandbox, because the sandbox is a separate pod with its own
      service account, and that service account has no permissions beyond
      reading the extract.

      Before restarting the pilot I would ask the security team to review
      the configuration, and I would log every run with the analyst's
      name, the code and the run time, so that anything unusual can be
      investigated afterwards.

      The main remaining risk is a container escape through a kernel
      vulnerability. We would reduce it by keeping the nodes patched and
      by running the sandbox pods on nodes that host nothing else.
  - band: weak
    score: 28
    body_md: |
      Security is very important for this kind of system, so the sandbox
      needs to be designed carefully, with several layers of protection
      working together.

      I would run the analysts' code in Docker containers, which isolate
      each workload from the others and from the host. Containers are an
      industry standard approach, they are well supported on AWS, and the
      platform team already knows how to operate them.

      To keep the system secure, the containers should have appropriate
      resource limits for CPU and memory, so that one analyst cannot use
      up all the resources and slow down everyone else. A sensible timeout
      should also be applied so that runs do not go on forever.

      For network access, a firewall should block unwanted traffic.
      Analysts will sometimes need extra libraries for their work, so the
      container should be able to run pip install for any library an
      analyst asks for, and the firewall can allow access to the package
      repository for this purpose.

      The analysts' code needs to read the claims data, so the container
      will be given the warehouse credentials as environment variables.
      This is the standard way to pass configuration into a container, and
      it means analysts do not have to manage passwords themselves. The
      credentials should be rotated regularly and stored in a vault when
      they are not in use.

      The analysts are employees of the client and have already been
      through background checks, so the main risk is accidental mistakes
      rather than malicious code. Training for analysts on secure coding
      practices would reduce this risk further, and a short guide on what
      not to do in a cell would help new starters.

      Regular backups of the analysts' notebooks should be taken so that
      no work is lost if a container fails, and the containers should
      restart automatically after any failure.

      All activity should be logged and monitored, and alerts should be
      set up for anything suspicious. The security team should review the
      logs regularly. A comprehensive approach to monitoring means that
      any issues can be found and fixed quickly before they cause harm.

      Data should be encrypted at rest and in transit, and access should
      follow the principle of least privilege. The solution should also
      comply with the client's security policies and with relevant
      regulations such as GDPR, which matters because the extracts hold
      personal data.

      Overall, this design gives the analysts the flexibility they need
      while keeping the system secure, and it can be extended later as new
      requirements come up.

hints:
  - Start from the pilot. List everything that snippet could have printed, and
    decide for each item whether your design keeps it out of reach or merely
    moves it.
  - Code in the sandbox can read anything in the sandbox, so the question for
    each secret is how to keep it outside the boundary. That includes
    credentials nobody put there on purpose.
  - Cloud hosts and most pods hand credentials to anything that asks, over a
    local address or from a mounted file. Name those routes and close each
    one, then decide how data reaches the code without a credential.
  - Give every limit a number tied to the workload in the brief, and say what
    the analyst sees when a run hits it.
  - Finish with how you would prove the sandbox holds before real data goes
    into it, and the risk that remains when it does.

scenario:
  headline: "A forum snippet printed the warehouse password into a chart"
  who: The head of security at a motor insurer piloting an analysis agent
  situation: >-
    The agent ran analysts' Python inside its own orchestrator container. A
    pasted snippet printed every environment variable into a chart title, and
    the chart showed the data warehouse password.
  stakes: >-
    The warehouse password opens every line of business, with policyholders'
    names, addresses and vehicle registrations, and the same environment held
    the credentials that call the model.
  metrics:
    - { label: Analyses a day, value: "4,000" }
    - { label: Largest extract, value: 2 GB }
    - { label: Longest run, value: 20 min }

diagram:
  title: Where the pilot's snippet could reach the orchestrator's secrets
  caption: >-
    Analyst code ran in the orchestrator's own container, one print statement
    away from the warehouse password and the model role.
  direction: lr
  nodes:
    - { id: analyst, label: Analyst, sub: asks a question or writes a cell, kind: actor, tone: blue, at: [0, 1] }
    - { id: agent, label: Analysis agent, sub: runs and adapts the code, kind: agent, tone: purple, at: [1, 1] }
    - { id: secrets, label: Orchestrator secrets, sub: "warehouse password, model role", kind: store, tone: pink, at: [1, 2] }
    - { id: sandbox, label: Per-run sandbox, sub: "own kernel, no network, wiped after", kind: guard, tone: green, at: [2, 1] }
    - { id: broker, label: Data broker, sub: reads with its own scoped role, kind: service, tone: teal, at: [2, 0] }
    - { id: metadata, label: Metadata endpoint, sub: hands out the host's role, kind: service, tone: orange, at: [3, 2] }
    - { id: extracts, label: Claims extracts, sub: "parquet, up to 2 GB, personal data", kind: store, tone: orange, at: [3, 0] }
    - { id: result, label: Size-capped result, sub: "a table or a chart, read as data", kind: output, tone: neutral, at: [3, 1] }
  edges:
    - { from: analyst, to: agent, label: a question, step: 1 }
    - { from: agent, to: sandbox, label: the code, step: 2 }
    - { from: extracts, to: broker, label: scoped read }
    - { from: broker, to: sandbox, label: "this run's rows, read-only", step: 3 }
    - { from: sandbox, to: result, label: one capped channel, step: 4, tone: success }
    - { from: sandbox, to: metadata, label: no route, tone: muted }
    - { from: agent, to: secrets, label: "pilot: same container", tone: danger }

approach:
  goal: Assume the code reads everything inside the sandbox, and put nothing worth taking there
  branches:
    - label: The boundary
      leaves: [a kernel of its own for each run, nothing reused between runs]
    - label: Credentials
      detail: The ones nobody put there on purpose are the ones that leak, from the environment, a local endpoint or a mounted file.
      leaves: [data through a broker outside]
    - label: Network and files
      leaves: [no route out, inputs read-only, one capped way out]
    - label: Limits with numbers
      leaves: [sized to a 2 GB extract and a twenty-minute run, what the analyst sees at a limit]
    - label: Proof and what remains
      leaves: [escape attempts before go-live, the risk you cannot design away]

coach:
  opening: >-
    Before you write the design, list every secret the pilot's snippet could
    have printed, including the ones nobody put in the environment on purpose.
  signals:
    - id: no-ambient-credentials
      when: { code_lacks: '(?i)metadata|169\.254' }
      say: >-
        Where would code in your sandbox find cloud credentials that nobody
        handed it? Think about what every EC2 host and every pod will serve to
        anything that asks.
    - id: container-is-the-boundary
      when:
        code_matches: '(?i)\b(docker|containers?)\b'
        code_lacks: '(?i)micro-?vms?|firecracker|gvisor|runsc|kata|own kernel|\bkernel'
      say: >-
        A container shares the host's kernel with every other run on it. What
        sits between hostile code and that kernel in your design?
    - id: no-default-deny
      when: { code_lacks: '(?i)no (network|route|internet|egress|outbound)|(egress|outbound)[^.]{0,40}(denied|blocked|none)|blocks? all (egress|outbound)' }
      say: >-
        Which addresses can the sandbox reach in your design? Start from none,
        and say what each exception is for.
    - id: nothing-named-outside
      when: { code_lacks: '(?i)model (credential|role)|system prompt|tool definitions|orchestrator' }
      say: >-
        Which things must never be inside the sandbox at all, whatever the code
        tries? Name them, starting with what the agent itself holds.
    - id: installs-at-run-time
      when:
        code_matches: '(?i)pip install'
        code_lacks: '(?i)baked|pre-?installed|in the image|in advance|change request'
      say: >-
        Installing packages at run time needs a route to the internet. How
        would the approved libraries get into the sandbox without one?
    - id: limits-without-numbers
      when: { code_lacks: '(?i)\d+\s*(GB|MB|minutes?|seconds?|vCPUs?|CPUs?|processes)\b' }
      say: >-
        Give each limit a number sized to the brief: a 2 GB extract and a
        twenty-minute run. What happens when a run hits one?
    - id: no-proof
      when: { code_lacks: '(?i)\btest|escape|red team|penetration' }
      say: >-
        How would you show the head of security that the sandbox holds before
        anyone's real data goes into it?
    - id: stuck
      when: { idle_minutes: 5 }
      say: >-
        Start with two lines: the boundary each run gets, and the one place
        data comes from. The rest of the design hangs off those.
    - id: many-failed-runs
      when: { failed_runs_at_least: 3 }
      say: >-
        Three attempts without a pass. The first hint starts from what the
        pilot's snippet could print.
  wrap_up: >-
    A sandbox holds nothing worth taking, so code you did not write can read
    every byte of it and find only its own input.

reference_md: |
  The pilot failed because analyst code ran in a process that held secrets,
  and any code that runs can read its own process. Nobody had to be
  malicious. That is the whole design principle: assume the code reads
  everything inside the boundary, and put nothing inside worth taking. This
  platform's own runner is built the same way, holding the scripted model and
  the trace outside the process that runs learner code (docs/03 section 7).

  The boundary comes first because everything else depends on it. A container
  is a set of namespaces on a kernel it shares with every other run on the
  host, and the kernel is what hostile code goes after. A microVM such as
  Firecracker, which AWS built to run Lambda, gives each run a kernel of its
  own, and gVisor answers the code's system calls with a kernel in user space.
  Either is a stronger answer than a container for code nobody reviewed.

  Credentials are where good designs still leak. The pilot's password was in
  the environment, which is the obvious route. The less obvious routes hand
  out credentials to anything that asks: the EC2 instance metadata endpoint
  at 169.254.169.254, the container credential endpoint, and the service
  account token Kubernetes mounts into a pod by default. A design that blocks
  the internet and leaves those in reach has moved the secret rather than
  removed it. So has one where the sandbox fetches a token from a vault,
  because the code can read the token as easily as the sandbox can. A broker
  outside the sandbox, reading with its own scoped role and staging only the
  rows this analyst may see, means the code never needs a credential at all.

  A limit needs a number. A 2 GB parquet extract becomes
  several times that in memory, and a twenty-minute run needs a wall clock
  above twenty minutes, which also rules out Lambda's fifteen-minute ceiling.
  A process limit has to count threads as well, since on Linux that is what
  `RLIMIT_NPROC` counts, so it is set high enough for a library's thread pool
  and low enough to stop a fork bomb.

  Proof is what the head of security is actually buying. A suite that tries
  each escape from inside the sandbox on every image build turns "we
  configured it" into "we tried it and it failed", and it fails the build the
  day someone loosens a setting.

  The strongest answers end by naming what is left. A hypervisor bug is
  possible, and an analyst can still share rows they are allowed to read. The
  second is a policy question rather than a sandbox question, and saying so to
  a head of security is part of the job.

  The platform facts here were checked on 1 October 2026 against the
  Firecracker and gVisor documentation, the Amazon EC2 instance metadata
  pages, the Kubernetes service account guide, the AWS Lambda quotas page and
  the `getrlimit(2)` manual page.

complexity: C4

interview_evidence:
  round: both
  asked_as: |
    Your agent runs Python that a client's analysts write. Walk me through the sandbox: what can that code reach, and what must never be inside it?
  source: |
    Author judgement, informed by this platform's own runner design in docs/03 section 7. No
    employer frequency data stands behind it.

traps:
  - Fetching a secret inside the sandbox, even from a vault, where the code can read it as easily as the
    agent can.
  - Blocking the internet and leaving the metadata endpoint or a mounted token within reach.
  - Writing limits as adjectives, when the head of security needs numbers sized to the workload.
  - Treating a container as the boundary for code nobody reviewed, when it shares the host's kernel.
