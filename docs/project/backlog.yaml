# The delivery record and the plan, in one file.
#
# Every stage of the build is an epic and every piece of work in it is a
# story. tools/project_sync.py turns each one into a GitHub issue, nests the
# stories under their stage, and puts them on the Project board with the
# fields below. The pages in docs/project are generated from this file too, so
# change it here and run `python -m tools.project_sync --render-docs`.
#
# Two kinds of number live here, and every page keeps them apart:
#   facts      dates, pull requests, commits, lines and test counts, from git
#              and GitHub (the `actuals` blocks, the `pr` and `commits` keys,
#              and every delivered `finish`). Dates are India time.
#   estimates  `points` on a relative scale, three-point `estimate` blocks in
#              person-days for a human team, `rice` scores, and every date on
#              planned work. They are judgement, and docs/project/estimation.md
#              says how they were made.
#
# Every pull request adds or closes the story it delivers. CI checks this file.

version: 1
as_of: 2026-10-01

project:
  owner: fde-academy-lab
  owner_type: organization
  repository: fdeprep
  # Found automatically when exactly one Project is linked to the repository.
  number: null
  status: {field: Status, done: Done, in_progress: In Progress, todo: Todo}

sprints:
  field: Sprint
  start: 2026-09-14
  days: 7
  count: 12

areas:
  - {name: Runner and sandbox, label: "area: runner", color: "1f6feb",
     description: "Where learner code runs, and the harness around it."}
  - {name: Grading and judge, label: "area: grading", color: "8250df",
     description: "Gates, caps, policy and the model judge."}
  - {name: Evaluation panel, label: "area: eval", color: "bf3989",
     description: "The three evaluators and the faculty tools."}
  - {name: Web application, label: "area: web", color: "1a7f37",
     description: "Every screen a learner or an admin uses."}
  - {name: Voice, label: "area: voice", color: "9a6700",
     description: "Spoken interview practice."}
  - {name: Content, label: "area: content", color: "bc4c00",
     description: "Problems, voice questions and their solutions."}
  - {name: Auth and access, label: "area: auth", color: "cf222e",
     description: "Sign-in, invites and roles."}
  - {name: Infrastructure, label: "area: infra", color: "57606a",
     description: "AWS, the stack and the deploy."}
  - {name: Docs and process, label: "area: docs", color: "0550ae",
     description: "Specifications, runbooks and how the work is done."}
  - {name: Delivery management, label: "area: delivery", color: "116329",
     description: "The board, the estimates and the reports."}

stages:

