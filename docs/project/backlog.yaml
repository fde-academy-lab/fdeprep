    why: >-
      Content is what learners actually meet, and a rule that its own worked
      example breaks is a fault only careful reading finds.
    lesson: >-
      Timing real speech moved every voice budget by a third. The first
      measurement method confirmed the hypothesis suspiciously neatly and
      turned out to be an artefact, which a second method caught.
