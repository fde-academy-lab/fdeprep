  - id: S1
    name: Core grading platform
    kind: history
    start: 2026-09-14
    finish: 2026-09-14
    area: Grading and judge
    priority: P0
    summary: >-
      Learner code runs in a sandbox against a scripted model and is
      graded the same way every time. The platform also decides what
      help each difficulty shows, caps attempts, and grades prompts and
      design answers with a model judge.
    why: >-
      Deterministic grading is why a verdict can be reproduced and appealed,
      and why the model bill does not grow with how much learners practise.
    lesson: >-
      Reading the vendor's documentation against the specification found a
      specification error and a live bug in the judge on the same day, PR #5.
    estimate: {optimistic: 25, likely: 40, pessimistic: 70}
    actuals: {prs: 5, commits: 10, added: 20577, removed: 217, files: 180,
              tests: {python: 112, web: 149, voice: 0, infra: 0}}
    stories:
      - id: S1.1
        title: "The runner: a scripted model, adversarial fixtures and a static gate"
        type: Feature
        status: done
        points: 13
        area: Runner and sandbox
        finish: 2026-09-14
        pr: 1
        summary: >-
          A Lambda container on Python 3.12 with the mock model, ten
          adversarial fixtures, the assertion registry, the static gate, gates
          that run in order, the result contract and an authoring command. Each
          case runs in its own process, and call counts are recomputed from the
          trace instead of trusted from the sandbox.
      - id: S1.2
        title: Problems, the code workspace and the submission pipeline
        type: Feature
        status: done
        points: 21
        area: Web application
        finish: 2026-09-14
        pr: 2
        summary: >-
          The Next.js application, a validator that reports every authoring rule
          with line numbers, an import with a diff preview, the catalogue and
          the code workspace. One transaction writes the submission, the cap
          decrement and an outbox row, a dispatcher publishes it, and a lease
          stops a late runner overwriting a fresh result.
      - id: S1.3
        title: The scaffold ladder, attempt caps and the step protocol
        type: Feature
        status: done
        points: 13
        area: Grading and judge
        finish: 2026-09-14
        pr: 3
        summary: >-
          One policy module decides what each difficulty shows and allows, and a
          lint rule stops anything else reading difficulty directly. It covers
          hints, the Hard attempt note, the Extreme rule that tests come first,
          caps spent in the same transaction as the submission, and the step
          protocol for live runs.
      - id: S1.4
        title: Prompt surgery, the design argument and the model judge
        type: Feature
        status: done
        points: 13
        area: Grading and judge
        finish: 2026-09-14
        pr: 4
        summary: >-
          The judge is a second Lambda that may call Bedrock and never runs
          learner code, with its prompts kept as files so a grading change is a
          code review. A static rule engine is shared by the live checklist and
          the submit gate.
      - id: S1.5
        title: Correct the seed and top_p in docs/03, and state the judge's thinking mode
        type: Bug
        status: done
        points: 2
        area: Grading and judge
        finish: 2026-09-14
        pr: 5
        found_by: Reading
        summary: >-
          docs/03 asked for a fixed seed that Bedrock's Converse API has no
          field for, and a temperature and top_p pair that recent Claude models
          refuse together. The same reading exposed a live bug in the judge.

