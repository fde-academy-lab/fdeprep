  - id: S0
    name: Foundation
    kind: history
    start: 2026-09-14
    finish: 2026-09-14
    area: Docs and process
    priority: P0
    summary: >-
      Ten numbered documents, 2,843 lines, specified the product before
      any code was written: what a learner does, how grading works, the
      data model, deployment, the Voice Screen and the design system.
      The agent that built it got written rules, a curated set of skills
      and a check that runs before anything merges.
    why: >-
      Every later disagreement between the code and the plan was settled
      against the specification, and each change to the plan was written
      into it where the next reader would find it.
    lesson: >-
      Writing 2,843 lines first delays the first thing you can learn from
      running code. It paid back in the Voice Screen, whose hardest rule, no
      transcript while the learner speaks, was written down before any cockpit
      existed and never had to be undone.
    estimate: {optimistic: 6, likely: 10, pessimistic: 18}
    actuals: {prs: 0, commits: 7, added: 33784, removed: 125, files: 195,
              tests: {python: 0, web: 0, voice: 0, infra: 0}}
    stories:
