        title: Write the specification before any code
        type: Task
        status: done
        points: 13
        area: Docs and process
        finish: 2026-09-14
        commits: [b86a1ae, 03e128a]
        summary: >-
          The product contract, the wireframes, the data model, the runner and
          grading contract, the problem authoring schema, deploy and
          operations, the build plan, the Voice Screen, the design system, and
          a reconciliation of an earlier build pack from a different model.
      - id: S0.2
