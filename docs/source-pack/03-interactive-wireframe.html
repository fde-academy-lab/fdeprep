<script>
const problems=JSON.parse(document.getElementById('catalog-data').textContent).problems;
const app=document.getElementById('app');const nav=document.getElementById('nav');
const S={persona:'Builder',page:1,query:'',domain:'All',difficulty:'All',format:'All',left:'Brief',right:'Public tests',file:'solution.py',job:'idle',hints:0,scenario:'failure',currentId:'G001',saveTimer:null};
const routes=[['home','My roadmap'],['problems','All problems'],['learn','Learn'],['interview','Interview studio'],['progress','My progress'],['cohort','Cohort']];
const titles={Builder:'Build the foundations. Make them work.',Navigator:'Connect the parts. Handle the failures.',Accelerator:'Own the trade-offs. Defend the result.'};
const tracks={Builder:['G004','G001','G002','G003','G008','A044','A001','A004'],Navigator:['G009','G014','A008','A021','A022','A017','A025','F010'],Accelerator:['A029','G021','A054','A057','F016','F017','A060','F023']};
const intro={Builder:'Start with precise prompts and small, testable functions. Support fades as the problems become more demanding.',Navigator:'Begin with an integrated workflow, then repair gaps in tools, evidence, evaluation and delivery.',Accelerator:'Start with production failure modes and move into independent client work samples.'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pBy(id){return problems.find(p=>p.id===id)||problems[0]}
function pill(d){return `<span class="pill ${d}">${d}</span>`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
function options(xs,chosen){return xs.map(x=>`<option ${x===chosen?'selected':''}>${e(x)}</option>`).join('')}
function go(h){location.hash=h}
function render(){const hash=location.hash.slice(1)||'home';const section=hash.split('/')[0];nav.innerHTML=routes.map(([r,t])=>`<a href="#${r}" class="${r===section?'active':''}">${t}</a>`).join('');if(section==='problem'){S.currentId=hash.split('/')[1]||'G001';workspace();return}({home,problems:library,learn,interview,progress,cohort}[section]||home)()}
function home(){app.innerHTML=`<div class="top"><div><div class="eyebrow">Your recommended roadmap</div><h1>${titles[S.persona]}</h1><p>${intro[S.persona]}</p></div><label>Support persona<select id="persona">${options(['Builder','Navigator','Accelerator'],S.persona)}</select></label></div><div class="grid"><section class="panel pad"><div class="flex between"><div><span class="eyebrow">Current milestone</span><h2 style="margin-top:8px">${S.persona==='Builder'?'Ground an answer in evidence':S.persona==='Navigator'?'Make the workflow reliable':'Prove the system under pressure'}</h2></div><span class="pill">${S.persona} recommendation</span></div><p class="muted">${S.persona==='Builder'?'You can identify input and output contracts. Next, make the assistant handle missing evidence.':'Your next tasks combine implementation with the evidence needed to explain your decisions.'}</p><div class="track"><span style="width:12.5%"></span></div><div class="note">Demo progress: 1 of 8 milestone activities completed. All problems stay open.</div><div class="steps">${tracks[S.persona].slice(0,5).map((id,i)=>{let p=pBy(id);return `<div class="step ${i<1?'done':i===1?'current':''}"><div class="circle">${i<1?'✓':i+1}</div><div><div class="flex"><strong>${e(p.title)}</strong>${pill(p.difficulty)}</div><p>${i===1?'Recommended next · ':''}${e(p.objective)}</p></div><button data-open="${id}">${i<1?'Review':i===1?'Continue →':'Open'}</button></div>`}).join('')}</div></section><aside><div class="panel pad"><span class="eyebrow">Why this starting point?</span><h2 style="margin-top:10px">A recommendation, with room to move.</h2><p class="muted">${S.persona==='Builder'?'The demo diagnostic suggests more practice with prompt boundaries and test interpretation.':'This demo roadmap assumes the foundational skills have been demonstrated. Missing evidence should trigger a prerequisite check.'}</p><a class="link" href="#problems">Explore all 120 planned exercises →</a><div class="rule"></div><h3>How practice builds evidence</h3><div class="topicrow"><div><strong>Try with support</strong><p class="note">Use the guidance provided at this difficulty.</p></div></div><div class="topicrow"><div><strong>Repair a failure</strong><p class="note">Read the result, change the artifact and test again.</p></div></div><div class="topicrow"><div><strong>Solve a transfer task</strong><p class="note">Demonstrate the skill independently on different data.</p></div></div></div><div class="panel pad" style="margin-top:16px"><span class="eyebrow">Interview practice</span><h3 style="margin-top:10px">Explain the boundary you implemented.</h3><p class="note">90 seconds. One answer. One changed constraint.</p><button onclick="go('interview')">Open interview studio →</button></div></aside></div>`;document.getElementById('persona').onchange=x=>{S.persona=x.target.value;home()};bindOpen()}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.left='Brief';S.right='Public tests';S.job='idle';S.hints=0;S.file=b.dataset.open.startsWith('G')?'system_prompt.md':'solution.py';go('problem/'+b.dataset.open)})}
function filtered(){return problems.filter(p=>(S.domain==='All'||p.domain===S.domain)&&(S.difficulty==='All'||p.difficulty===S.difficulty)&&(!S.query||[p.id,p.title,p.topic,p.objective].join(' ').toLowerCase().includes(S.query.toLowerCase())))}
function library(){app.innerHTML=`<div class="top"><div><div class="eyebrow">The complete library</div><h1>All problems</h1><p>Generative AI, agent engineering and FDE delivery. Every published exercise is open to every cohort member.</p></div><div class="pill">120 authoring briefs</div></div><div class="panel pad filters"><label>Search problems<input id="search" placeholder="Search titles, concepts or IDs…" value="${e(S.query)}"></label><label>Domain<select id="domain">${options(['All','Generative AI','Agentic AI','FDE Practice'],S.domain)}</select></label><label>Difficulty<select id="difficulty">${options(['All','Easy','Medium','Hard','Extreme'],S.difficulty)}</select></label><div class="legend">Easy → guided<br>Extreme → independent</div><button id="clear">Clear filters</button></div><div class="flex between" style="margin-bottom:13px"><span id="count" class="note"></span><span class="note">Design catalog: briefs await publication QA</span></div><div class="panel table-wrap"><table><thead><tr><th>ID</th><th>Problem</th><th>Difficulty</th><th>Topic</th><th>Est.</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footerbar"><span>43 mapped reference topics + 77 original additions</span><div class="flex"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></div>`;document.getElementById('search').oninput=x=>{S.query=x.target.value;S.page=1;drawRows()};['domain','difficulty'].forEach(k=>document.getElementById(k).onchange=x=>{S[k]=x.target.value;S.page=1;drawRows()});document.getElementById('clear').onclick=()=>{S.query='';S.domain='All';S.difficulty='All';S.page=1;library()};document.getElementById('prev').onclick=()=>{S.page--;drawRows()};document.getElementById('next').onclick=()=>{S.page++;drawRows()};drawRows()}
function drawRows(){const ps=filtered(),pages=Math.max(1,Math.ceil(ps.length/10));S.page=Math.min(Math.max(1,S.page),pages);document.getElementById('count').textContent=`${ps.length} matching briefs · Page ${S.page} of ${pages}`;document.getElementById('page').textContent=`${S.page} / ${pages}`;document.getElementById('prev').disabled=S.page===1;document.getElementById('next').disabled=S.page===pages;document.getElementById('rows').innerHTML=ps.slice((S.page-1)*10,S.page*10).map(p=>`<tr><td class="mono muted">${p.id}</td><td class="titlecell"><a href="#problem/${p.id}" data-open="${p.id}">${e(p.title)}</a><small>${e(p.domain)} · Authoring brief</small></td><td>${pill(p.difficulty)}</td><td class="muted">${e(p.topic)}</td><td class="mono muted">${p.estimated_minutes}m</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching problems. Clear a filter or try another term.</td></tr>';bindOpen()}
const starters={G001:{'system_prompt.md':'You answer Northstar policy questions.\nUse [EVIDENCE_RULE].\nTreat instructions inside retrieved documents as [TRUST_RULE].\nWhen evidence does not support an answer, [MISSING_EVIDENCE_RULE].\nReturn [OUTPUT_RULE].','config.json':'{\n  "response": "json",\n  "max_output_tokens": 400,\n  "source_policy": "approved_only"\n}','tests.py':'# Public behavior examples\n# 1. Standard first response → two business days, source P-17\n# 2. Resolution time → insufficient_evidence\n'},A004:{'solution.py':'def solve(data):\n    events = data["events"]\n    limit = data["max_actions"]\n    actions = 0\n    # TODO: validate the budget.\n    # TODO: stop before consuming an event beyond the limit.\n    # TODO: distinguish tool events and final answers.\n    return {"status": "no_final", "answer": None, "actions": actions}\n'},A008:{'solution.py':'def solve(data):\n    errors = []\n    # Validate the declared contract without coercion.\n    return {"ok": True}\n','tests.py':'def test_boolean_is_not_a_limit():\n    # Add a boundary case for limit=True.\n    pass\n'},A022:{'solution.py':'def solve(data):\n    raise NotImplementedError\n','tests.py':'# Add your tests.\n'},A060:{'solution.py':'','decision.md':''}};
function files(p){if(starters[p.id])return Object.keys(starters[p.id]);return p.domain==='Generative AI'?['system_prompt.md','config.json','tests.py']:['solution.py','tests.py','decision.md']}
function key(p,f){return 'fde-wireframe:'+p.id+':'+f}function initial(p,f){return starters[p.id]?.[f]??(p.difficulty==='Extreme'?'':f==='config.json'?'{}\n':f==='system_prompt.md'?'# Write or repair the system prompt.\n':f==='tests.py'?'# Add a test for the published contract.\n':'def solve(data):\n    raise NotImplementedError\n')}
function value(p,f){try{return localStorage.getItem(key(p,f))??initial(p,f)}catch{return initial(p,f)}}
function workspace(){const p=pBy(S.currentId),fs=files(p);if(S.left==='Guidance'&&!['Easy','Medium'].includes(p.difficulty))S.left='Brief';if(!fs.includes(S.file))S.file=fs[0];app.innerHTML=`<div class="flex between" style="margin-bottom:12px"><a href="#problems" class="note">← All problems</a><div class="flex"><label for="example" style="display:inline">Explore guidance</label><select id="example" aria-label="Select guidance example">${[['G001','Easy · prompt editing'],['A008','Medium · code repair'],['A022','Hard · approval gate'],['A060','Extreme · client brief']].map(([id,t])=>`<option value="${id}" ${p.id===id?'selected':''}>${t}</option>`).join('')}</select></div></div><section class="panel taskhead"><div class="flex"><span class="mono muted">${p.id} / ${e(p.domain)}</span>${pill(p.difficulty)}<span class="pill">${p.difficulty==='Extreme'?'Independent work sample':p.difficulty==='Hard'?'Minimal scaffolding':p.difficulty==='Medium'?'Targeted support':'Guided practice'}</span><span class="note">${p.estimated_minutes} min estimate</span></div><h1>${e(p.title)}</h1><p class="muted">${e(p.objective)}</p></section><div class="workspace"><section class="panel"><div class="tabs" id="lefttabs">${['Brief',...(['Easy','Medium'].includes(p.difficulty)?['Guidance']:[]),'History','Review'].map(t=>`<button class="${S.left===t?'selected':''}" data-left="${t}">${t}</button>`).join('')}</div><div class="briefbody" id="brief"></div></section><section class="panel"><div class="tabs" id="filetabs">${fs.map(f=>`<button class="${S.file===f?'selected':''}" data-file="${f}">${f}</button>`).join('')}</div><div class="codebar"><span class="mono muted" id="savestate">Draft stored on this device</span><div class="flex"><button id="reset">Reset</button><button id="run">▷ Run public checks</button><button id="submit" class="primary">Submit →</button></div></div><textarea id="editor" class="codearea" aria-label="${e(S.file)} editor" spellcheck="false">${e(value(p,S.file))}</textarea><div class="results"><div class="tabs">${['Public tests','Submission result','Trace','Output','Cost'].map(t=>`<button data-result="${t}" class="${S.right===t?'selected':''}">${t}</button>`).join('')}</div><div class="resultsbody" id="results" aria-live="polite"></div></div></section></div><div class="footerbar"><span>Wireframe: editable local drafts; no Python, model or remote grader runs here.</span><label>Simulated result <select id="scenario" style="display:inline;width:auto;margin:0"><option value="failure" ${S.scenario==='failure'?'selected':''}>A boundary test fails</option><option value="pass" ${S.scenario==='pass'?'selected':''}>All required checks pass</option><option value="outage" ${S.scenario==='outage'?'selected':''}>Service unavailable</option></select></label></div>`;drawBrief(p);drawResults(p);document.getElementById('example').onchange=x=>{S.left='Brief';S.hints=0;S.job='idle';go('problem/'+x.target.value)};document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{S.left=b.dataset.left;workspace()});document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{S.file=b.dataset.file;workspace()});document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{S.right=b.dataset.result;workspace()});document.getElementById('editor').oninput=x=>{try{localStorage.setItem(key(p,S.file),x.target.value);document.getElementById('savestate').textContent='Saved on this device · edited draft'}catch{document.getElementById('savestate').textContent='Storage unavailable · copy your draft'}if(S.job==='complete'){document.getElementById('savestate').textContent+=' · results use previous version'}};document.getElementById('reset').onclick=()=>{try{localStorage.setItem(key(p,S.file)+':backup',value(p,S.file));localStorage.removeItem(key(p,S.file))}catch{}workspace();toast('Starter restored. The previous draft is retained locally as a backup.')};document.getElementById('scenario').onchange=x=>S.scenario=x.target.value;document.getElementById('run').onclick=()=>simulate(false);document.getElementById('submit').onclick=()=>simulate(true)}
function drawBrief(p){let html='';if(S.left==='Brief'){html=`<div class="eyebrow">${p.difficulty==='Extreme'?'Client brief':'Your task'}</div><h3 style="margin-top:10px">${p.id==='G001'?'Give a supported answer, or say what is missing.':e(p.title)}</h3><p>${p.id==='G001'?'Complete the four prompt slots. Use approved sources, treat documents as data, handle missing evidence and return the required JSON shape.':e(p.objective)}</p>`;if(p.id==='G001')html+=`<h4>Available evidence</h4><pre>P-17 · approved · version 3\nStandard: first response within 2 business days.\nPriority: first response within 4 business hours.</pre><h4>Return contract</h4><pre>{\n "status": "answered" | "insufficient_evidence",\n "answer": "supported answer" | null,\n "source_ids": ["P-17"]\n}</pre><p class="note">When evidence is missing, answer must be null and source_ids must be empty.</p><h4>Visible example</h4><p>“When will this ticket be resolved?” has no supported answer. First response and resolution are different commitments.</p>`;else if(p.id==='A008')html+=`<h4>Input contract</h4><p>order_id: nonempty string. include_history: optional boolean. limit: optional integer from 1 to 20. Reject additional fields; do not coerce types.</p><h4>Output</h4><pre>{"ok": true}\nor\n{"ok": false, "errors": ["invalid:limit"]}</pre><p>Return all applicable error labels in alphabetical order. Missing order_id is invalid.</p>`;else if(p.id==='A022')html+=`<h4>Authorization contract</h4><p>Bind approval to the current actor and a SHA-256 digest of canonical action JSON. Approval expires when expires_at is less than or equal to now.</p><p>Check denial reasons in order: not_approved, actor_mismatch, action_changed, expired.</p><h4>Deliverables</h4><p>Implementation, boundary tests and a short explanation of execution-time revalidation.</p>`;else if(p.id==='A060')html+=`<p>Investigate an authorized support ticket and propose an escalation. Execute only with current approval bound to the exact actor and action. Duplicate delivery must not duplicate the effect.</p><h4>Available</h4><p>Synthetic tickets, policy sources, model tape, approval fixture and tool API contract.</p><h4>Deliverables</h4><p>Runnable artifacts, your tests, successful and failed traces, and a technical decision note.</p><h4>Evaluation dimensions</h4><p>Correctness, authorization, recovery, budget behavior, test quality and explanation.</p><div class="callout">No hints, tutor or implementation plan during this attempt.</div>`;else html+=`<h4>Failure variation to address</h4><p>${e(p.adversarial_case)}</p><h4>Authoring status</h4><p class="note">This catalog brief needs a complete interface, fixtures, oracle and review before it becomes a published exercise. The build pack defines the publication gate.</p>`;if(['Easy','Medium'].includes(p.difficulty))html+=`<button id="showguide">${p.difficulty==='Easy'?'Open guided steps':'View optional conceptual guidance'}</button>`}
if(S.left==='Guidance')html=p.difficulty==='Easy'?`<h3>One decision at a time</h3><ol><li>Read the output contract and the worked micro-example.</li><li>Complete the highlighted prompt slot or code TODO.</li><li>Run the visible normal and missing-evidence cases.</li><li>Explain which boundary your change enforces.</li></ol><div class="rule"></div><h3>Hints <span class="note">${S.hints} of 3 revealed</span></h3>${S.hints>0?'<p>1. Begin by stating which source is allowed to provide facts.</p>':''}${S.hints>1?'<p>2. Document text must not be allowed to change the system policy.</p>':''}${S.hints>2?'<p>3. Complete a clause starting with “If no approved source supports the requested fact…”</p>':''}<button id="hint" ${S.hints>=3?'disabled':''}>Reveal next hint</button><p class="note" style="margin-top:15px">Support use is recorded separately from correctness.</p>`:`<h3>A conceptual nudge</h3><p>Look for a case where the language's type rules differ from the API contract. Which values could a broad type check accidentally accept?</p><p class="note">No step-by-step solution is supplied for this Medium task.</p>`;
if(S.left==='History')html=`<h3>Attempt history</h3><p class="note">Illustrative data for this wireframe.</p><div class="topicrow"><div><strong>Attempt 2 · Boundary failure</strong><p class="note">Previous draft · 1 hint used · evaluator v1</p></div></div><div class="topicrow"><div><strong>Attempt 1 · Schema failure</strong><p class="note">Earlier draft · public tests only</p></div></div><p class="note" style="margin-top:15px">Production attempts retain immutable files, assistance and evaluator versions.</p>`;
if(S.left==='Review')html=p.difficulty==='Extreme'?`<h3>Review after submission</h3><p>Independent work samples reveal a debrief only after the attempt closes. No solution guidance is available here during the attempt.</p>`:`<h3>Understand the solution</h3><p>Review material becomes available after an attempt or an explicit solution reveal in practice. Seeing a solution records assisted exposure.</p><button id="reveal">Preview review behavior</button><div id="reviewbody"></div>`;
document.getElementById('brief').innerHTML=html;document.getElementById('showguide')?.addEventListener('click',()=>{S.left='Guidance';workspace()});document.getElementById('hint')?.addEventListener('click',()=>{S.hints++;workspace()});document.getElementById('reveal')?.addEventListener('click',()=>{document.getElementById('reviewbody').innerHTML='<div class="callout">Assisted exposure recorded in this demonstration. A later, different transfer task is needed for an independent evidence label.</div>'})}
function simulate(submit){S.job='queued';S.right=submit?'Submission result':'Public tests';workspace();const jobId=S.currentId;setTimeout(()=>{if(S.currentId!==jobId||!location.hash.startsWith('#problem/'))return;S.job='complete';workspace()},700)}
function drawResults(p){let html='';if(S.job==='queued')html='<strong>Queued · simulation</strong><p class="muted">Your draft version is captured. In production, this job receives a fair execution slot.</p>';else if(S.right==='Cost')html='<h3>Resource visibility</h3><p>Production shows actual tokens, sandbox duration and remaining allowance for this run.</p><p class="note">No cloud resources or model tokens were consumed by this wireframe.</p>';else if(S.right==='Trace')html='<div class="resultrow"><span class="mono">01</span><span>Validate artifact and source scope</span><span class="success">Allowed</span></div><div class="resultrow"><span class="mono">02</span><span>Run candidate against the provided case</span><span class="muted">Example event</span></div><div class="resultrow"><span class="mono">03</span><span>Check output with the trusted evaluator</span><span class="muted">Example event</span></div><p class="note" style="margin-top:12px">Illustrative action trace; no private model reasoning.</p>';else if(S.right==='Output')html='<pre>No program was executed.\n\nProduction displays bounded, escaped learner output here.\nOutput text never determines the trusted grading status.</pre>';else if(S.job==='idle')html=`<div class="flex between"><h3>${S.right==='Public tests'?'Check the visible contract':'Submit when your artifact is ready'}</h3><span class="pill">${S.right==='Public tests'?'Public cases':'Held-out evaluation'}</span></div><p class="muted">${S.right==='Public tests'?'Run public checks to inspect expected and actual behavior.':'A submission records the artifact version and evaluates unpublished variations.'}</p><p class="note">Run and Submit demonstrate interface states only.</p>`;else if(S.scenario==='outage')html='<h3>Evaluation unavailable</h3><p class="muted">The evaluation service did not complete. Your draft is safe. This is an infrastructure error, not an incorrect answer.</p><span class="pill">Simulation · retry without penalty</span>';else if(S.scenario==='pass')html=`<h3 class="success">Required checks passed · simulation</h3><p>${S.hints?'Passed with support. Try a later transfer task independently.':'Correctness evidence recorded. Independent transfer is assessed separately.'}</p><span class="pill">No real grade was saved</span>`;else html=`<div class="flex between"><h3 class="error">A boundary case needs attention</h3><span class="pill">Simulated result</span></div><div class="resultrow"><span class="success">✓</span><span>Normal input</span><span class="success">Pass</span></div><div class="resultrow"><span class="error">×</span><span>${p.id==='A008'?'Boolean accepted as integer':p.id==='A022'?'Approval expiry boundary':p.id==='A060'?'Duplicate side effect':'Missing-evidence behavior'}</span><span class="error">Fail</span></div><p class="note" style="margin-top:12px">${S.right==='Submission result'?'Held-out feedback names the failed constraint without exposing secret cases or answers.':'Public feedback can show input, expected output and actual output in production.'}</p>`;document.getElementById('results').innerHTML=html}
function learn(){app.innerHTML=`<div class="top"><div><div class="eyebrow">Short lessons, connected practice</div><h1>Learn the pattern. Then use it.</h1><p>Each concept introduces one useful idea, a worked example and the failure that makes the boundary matter.</p></div></div><div class="triple">${[['Prompt contracts','Define evidence, output and abstention.','G001'],['Tools and control','Validate an action before it crosses a boundary.','A008'],['Approvals and effects','Bind permission to the action that actually executes.','A022'],['Retrieval and grounding','Keep authorized evidence connected to claims.','A017'],['Evaluation and release','Use failure slices to make a release decision.','G024'],['FDE delivery','Build a useful slice and explain its operating limits.','F003']].map(([t,b,id])=>`<section class="panel pad"><span class="eyebrow">Mental model → example → practice</span><h2 style="margin-top:12px">${t}</h2><p class="muted">${b}</p><button data-open="${id}">Open linked practice →</button></section>`).join('')}</div><section class="panel pad" style="margin-top:20px"><h2>Example: evidence is not an instruction channel</h2><div class="triple"><div><h3>Instruction</h3><p class="muted">Answer policy questions using approved sources. Abstain when support is missing.</p></div><div><h3>Evidence</h3><p class="muted">P-17 says first response takes two business days. It says nothing about resolution time.</p></div><div><h3>Decision</h3><p class="muted">Answer the first-response question. Mark the resolution-time question as unsupported.</p></div></div></section>`;bindOpen()}
function interview(){app.innerHTML=`<div class="top"><div><div class="eyebrow">Interview studio</div><h1>Show how you think and build.</h1><p>Original interview-style practice. These prompts are not claimed to be actual employer questions.</p></div><span class="pill">Explain · Repair · Deliver</span></div><div class="grid"><section class="panel pad"><div class="flex between"><span class="eyebrow">Explain a decision · 90-second format</span><span class="pill Medium">Applied</span></div><h2 style="margin-top:18px">The final answer is correct. The agent used an unauthorized tool. Did it pass?</h2><p class="muted">Explain what you would measure and which outcome must block a release.</p><label for="answer">Your response</label><textarea id="answer" class="answer" placeholder="State the decision, explain the boundary, and give a concrete example…"></textarea><div class="flex" style="margin-top:14px"><button class="primary" id="reviewanswer">Compare with the rubric</button><button data-open="A022">Practice the approval boundary</button></div><div id="rubric"></div></section><aside class="panel pad"><h2>Three practice formats</h2><div class="topicrow"><div><strong>Explain</strong><p class="note">A concise answer with a reason and an example.</p></div><span class="mono muted">90s</span></div><div class="topicrow"><div><strong>Repair and defend</strong><p class="note">Fix a defect, test it and explain the trade-off.</p></div><span class="mono muted">25–40m</span></div><div class="topicrow"><div><strong>Client work sample</strong><p class="note">Deliver a usable result from a constrained brief.</p></div><span class="mono muted">60–120m</span></div><div class="callout">Follow-up: the tool was approved, but its arguments changed before execution. What now?</div><p class="note">Assessment assistance rules and time limits are set by the instructor before the attempt.</p></aside></div>`;document.getElementById('reviewanswer').onclick=()=>{if(!document.getElementById('answer').value.trim()){toast('Write your response before revealing the review rubric.');return}document.getElementById('rubric').innerHTML='<div class="rule"></div><h3>Review your answer</h3><ul><li>Separate answer correctness from authorized behavior.</li><li>Treat the unauthorized action as a critical failure.</li><li>Use an authoritative tool trace, not only the final answer.</li><li>Explain an execution-time permission check.</li></ul><p class="note">This is a rubric reveal, not automated scoring.</p>'};bindOpen()}
function progress(){app.innerHTML=`<div class="top"><div><div class="eyebrow">Your evidence</div><h1>See what you can do independently.</h1><p>Illustrative learner data. Reading, assisted practice and independent transfer are different kinds of evidence.</p></div><button id="export">Export demo evidence</button></div><div class="panel table-wrap"><table><thead><tr><th>Skill</th><th>Evidence</th><th>Support used</th><th>Recommended next action</th></tr></thead><tbody>${[['Prompt contracts','Passed with support','2 hints','G009','Try a different prompt repair'],['Tool validation','Independently demonstrated','None on transfer','A022','Move to action approval'],['Evaluation design','Needs review','Concept guidance','G014','Inspect a regression slice'],['Client delivery','Insufficient evidence','No attempt','F003','Build a thin usable slice']].map(([s,ev,h,id,a])=>`<tr><td>${s}</td><td><span class="pill">${ev}</span></td><td class="muted">${h}</td><td><a class="link" href="#problem/${id}">${a} →</a></td></tr>`).join('')}</tbody></table></div><div class="grid" style="margin-top:20px"><section class="panel pad"><h2>Your recurring repair area</h2><p class="muted">In this example, normal inputs pass, but unsupported or invalid inputs still expose a boundary problem.</p><button data-open="A008">Practice the boundary →</button></section><section class="panel pad"><h2>What counts as independent?</h2><p class="muted">A different transfer exercise, completed without instructional support after earlier practice. Repeating a revealed solution does not establish the same evidence.</p></section></div>`;document.getElementById('export').onclick=()=>toast('Prototype preview: production exports versioned artifacts and assessment evidence.');bindOpen()}
function cohort(){app.innerHTML=`<div class="top"><div><div class="eyebrow">Instructor view · demonstration only</div><h1>Support the cohort where it is stuck.</h1><p>Find shared failure patterns, review learning evidence and keep execution healthy.</p></div><span class="pill">Demo cohort · 200 invited</span></div><div class="triple"><section class="panel pad"><span class="eyebrow">Support queue</span><div class="big">18 learners</div><p class="note">Need repair practice on approval expiry.</p><button data-open="A022">Inspect the exercise</button></section><section class="panel pad"><span class="eyebrow">Execution</span><div class="big">12 queued</div><p class="note">40 active slots · illustrative healthy state</p><span class="pill success">No infrastructure incident</span></section><section class="panel pad"><span class="eyebrow">Example monthly budget</span><div class="big">$126 <span class="muted" style="font-size:16px">/ $300</span></div><div class="track"><span style="width:42%"></span></div><p class="note">Synthetic spend, not an account reading.</p></section></div><div class="grid" style="margin-top:20px"><section class="panel pad"><div class="flex between"><h2>Common failure patterns</h2><span class="note">Sample counts</span></div>${[['18','Expired approval accepted','A022'],['11','Unsupported claim with a citation','G013'],['7','Boolean accepted as integer','A008']].map(([n,t,id])=>`<div class="topicrow"><span class="circle">${n}</span><div><strong>${t}</strong><p class="note">Review evidence before assigning support.</p></div><button data-open="${id}">Inspect</button></div>`).join('')}</section><section class="panel pad"><h2>Content release pipeline</h2><p class="muted">120 planned briefs. The first release targets 24 reviewed challenges.</p><div class="topicrow"><div><strong>Technical QA</strong><p class="note">Reference passes; intended faulty variants fail.</p></div></div><div class="topicrow"><div><strong>Learning review</strong><p class="note">Contract, guidance and valid alternatives checked.</p></div></div><div class="topicrow"><div><strong>Pilot and publish</strong><p class="note">Calibrate live-model and human rubrics.</p></div></div></section></div>`;bindOpen()}
document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
